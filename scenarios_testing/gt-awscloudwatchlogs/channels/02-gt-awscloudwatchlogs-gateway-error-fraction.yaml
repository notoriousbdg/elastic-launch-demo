name: "GT aws_cloudwatch_logs: gateway_error_fraction"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-AWSCLOUDWATCHLOGS-GATEWAY-ERROR-FRACTION
sensor_type: impact_key_probe
affected_services:
  - gt-awscloudwatchlogs-aws-svc-1
cascade_services:
  - gt-awscloudwatchlogs-aws-svc-2
description: "Tests impact_key gateway_error_fraction on generator aws_cloudwatch_logs."
investigation_notes: |-
  1. Verify aws_cloudwatch_logs is active and writing logs-aws_logs.* documents.
  2. Check that the gateway_error_fraction signal has reached the trigger value (0.4).
  3. Confirm generator_impact for aws_cloudwatch_logs.gateway_error_fraction is set to 0.4.
  4. Look for correlated changes in service gt-awscloudwatchlogs-aws-svc-1 logs.
  5. Restore by deactivating this channel and verifying the logs return to baseline.
remediation_action: restore_gateway_error_fraction_baseline
error_message: "GT-PROBE: gen=aws_cloudwatch_logs key=gateway_error_fraction value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=aws_cloudwatch_logs
  impact_key: gateway_error_fraction
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 0.4
  svc_name: gt-awscloudwatchlogs-aws-svc-1
rca_clues:
  gt-awscloudwatchlogs-aws-svc-1:
    probe.generator: aws_cloudwatch_logs
    probe.impact_key: gateway_error_fraction
    probe.trigger_value: 0.4
  gt-awscloudwatchlogs-aws-svc-2:
    probe.upstream_generator: aws_cloudwatch_logs
    probe.upstream_key: gateway_error_fraction
generator_impact:
  aws_cloudwatch_logs:
    gateway_error_fraction: 0.4

name: "GT influxdb_otel: dropped_writes"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-INFLUXDB-DROPPED-WRITES
sensor_type: impact_key_probe
affected_services:
  - gt-influxdb-aws-svc-1
cascade_services:
  - gt-influxdb-aws-svc-2
description: "Tests impact_key dropped_writes on generator influxdb_otel."
investigation_notes: |-
  1. Verify influxdb_otel is active and reporting metrics.
  2. Check that the dropped_writes metric has reached the trigger value (50.0).
  3. Confirm generator_impact for influxdb_otel.dropped_writes is set to 50.0.
  4. Look for correlated changes in service gt-influxdb-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_dropped_writes_baseline
error_message: "GT-PROBE: gen=influxdb_otel key=dropped_writes value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=influxdb_otel
  impact_key: dropped_writes
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 50.0
  svc_name: gt-influxdb-aws-svc-1
rca_clues:
  gt-influxdb-aws-svc-1:
    probe.generator: influxdb_otel
    probe.impact_key: dropped_writes
    probe.trigger_value: 50.0
  gt-influxdb-aws-svc-2:
    probe.upstream_generator: influxdb_otel
    probe.upstream_key: dropped_writes
generator_impact:
  influxdb_otel:
    dropped_writes: 50.0

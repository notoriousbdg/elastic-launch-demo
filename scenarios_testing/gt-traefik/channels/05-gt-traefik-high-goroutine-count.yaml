description: "Tests impact_key high_goroutine_count on generator traefik_otel."
investigation_notes: |-
  1. Verify traefik_otel is active and reporting metrics.
  2. Check that the high_goroutine_count metric has reached the trigger value (15000.0).
  3. Confirm generator_impact for traefik_otel.high_goroutine_count is set to 15000.0.
  4. Look for correlated changes in service gt-traefik-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_high_goroutine_count_baseline
error_message: "GT-PROBE: gen=traefik_otel key=high_goroutine_count value={trigger_value} svc={svc_name}"

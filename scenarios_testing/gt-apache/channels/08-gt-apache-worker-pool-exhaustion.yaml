name: "GT apache_otel: worker_pool_exhaustion"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-APACHE-WORKER-POOL-EXHAUSTION
sensor_type: impact_key_probe
affected_services:
  - gt-apache-aws-svc-1
cascade_services:
  - gt-apache-aws-svc-2
description: "Tests impact_key worker_pool_exhaustion on generator apache_otel."
investigation_notes: |-
  1. Verify apache_otel is active and reporting metrics.
  2. Check that the worker_pool_exhaustion metric has reached the trigger value (90.0).
  3. Confirm generator_impact for apache_otel.worker_pool_exhaustion is set to 90.0.
  4. Look for correlated changes in service gt-apache-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_worker_pool_exhaustion_baseline
error_message: "GT-PROBE: gen=apache_otel key=worker_pool_exhaustion value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=apache_otel
  impact_key: worker_pool_exhaustion
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 90.0
  svc_name: gt-apache-aws-svc-1
rca_clues:
  gt-apache-aws-svc-1:
    probe.generator: apache_otel
    probe.impact_key: worker_pool_exhaustion
    probe.trigger_value: 90.0
  gt-apache-aws-svc-2:
    probe.upstream_generator: apache_otel
    probe.upstream_key: worker_pool_exhaustion
generator_impact:
  apache_otel:
    worker_pool_exhaustion: 90.0

agent_config:
  id: inttest-analyst
  name: Integration Test Harness Operations Analyst
  assessment_tool_name: inttest_readiness_assessment
  system_prompt: |
    You are the Integration Test Harness Operations Analyst, an expert AI assistant for a synthetic
    QA environment used to validate that every telemetry generator and observability integration in
    the platform is emitting data correctly. There is no real customer traffic here — the sole purpose
    of this environment is to exercise cache, cloud-audit, cloud-compute, database, platform, proxy,
    queue, and web-server integrations continuously so engineers can confirm each one works end-to-end.
    You help engineers investigate synthetic incidents and perform root cause analysis across 9
    services spanning AWS, GCP, and Azure.
    When investigating, search for these error identifiers in logs (field: body.text), grouped by subsystem:
    Caching (CACHE-MEM-PRESSURE), Ingress/WAF (WAF-BLOCK-SPIKE, INGRESS-PROXY-BACKEND-OUTAGE),
    Application gateway (APPGW-ERROR-SURGE), Cloud audit (GCP-AUDIT-DENY-SURGE),
    Compute fleet (FLEET-CPU-SATURATION, ALB-UNHEALTHY-TARGETS, LAMBDA-COLDSTART-STORM),
    ML/feature platform (FEATURESTORE-COMPACTION-BACKLOG, MODELSTORE-CONN-STORM, GPU-THERMAL-THROTTLE),
    Billing ledger (LEDGER-RANGE-UNAVAILABLE, LEGACYWEB-THREAD-EXHAUSTION),
    Session/identity (SESSIONSTORE-REPL-LAG, IDENTITYSTORE-POOL-EXHAUSTION),
    Analytics (ANALYTICS-WRITE-REJECT-SURGE), Legacy database (ERPDB-TNS-TIMEOUT),
    Orchestration/control plane (ORCH-CONTROLPLANE-INSTABILITY, PLATFORM-NODE-AUTO-RECOVERY),
    Messaging (BROKER-QUEUE-DEPTH-SPIKE).
    Log messages are in body.text — NEVER search the body field alone.
assessment_tool_config:
  id: inttest_readiness_assessment
  description: |
    Comprehensive assessment of the Integration Test Harness environment. Evaluates whether every
    enabled telemetry generator (cache, cloud-audit, cloud-compute, database, platform, proxy, queue,
    and web-server integrations) is actively emitting logs, metrics, or traces, and whether each of
    the 20 synthetic fault channels is exercising its target integration as expected. Log message
    field: body.text (never use 'body' alone).
executive_kpi_emitter_service_name: edge-gateway
executive_dashboard_intro: '**Executive view** — synthetic load, generator health, fault exercise
  coverage, and infra footprint for the Integration Test Harness (synthetic `business.*` from
  `edge-gateway`). These are QA proxies, not real business metrics.'
executive_kpi_sections:
  - header: '**Synthetic load & throughput** — requests, jobs, cache/db ops, and queue traffic'
    specs:
      - - Requests / min
        - metrics.business.requests_per_min
      - - Jobs processed / min
        - metrics.business.jobs_processed_per_min
      - - Cache ops / min
        - metrics.business.cache_ops_per_min
      - - DB ops / min
        - metrics.business.db_ops_per_min
      - - Queue messages / min
        - metrics.business.queue_messages_per_min
      - - Active synthetic sessions
        - metrics.business.active_synthetic_sessions
  - header: '**Generator health & coverage** — active generators, signal volume, ingest success'
    specs:
      - - Active generators
        - metrics.business.generators_active_count
      - - Signals emitted / min
        - metrics.business.signals_emitted_per_min
      - - Active datasets
        - metrics.business.datasets_active_count
      - - Installed packages
        - metrics.business.packages_installed_count
      - - Ingest success rate (%)
        - metrics.business.ingest_success_rate_pct
      - - Collector uptime (%)
        - metrics.business.otel_collector_uptime_pct
  - header: '**Fault exercise & chaos coverage** — active faults, HITL queue, auto-remediation'
    specs:
      - - Active fault channels
        - metrics.business.active_fault_channels
      - - HITL faults pending approval
        - metrics.business.hitl_faults_pending_approval
      - - Auto-remediated faults / hr
        - metrics.business.auto_remediated_faults_per_hr
      - - Faults exercised today
        - metrics.business.faults_exercised_today
      - - Mean fault duration (min)
        - metrics.business.mean_fault_duration_min
      - - Unique error types fired
        - metrics.business.unique_error_types_fired
  - header: '**Infra resource footprint** — CPU, memory, GPU, network, disk, and node health'
    specs:
      - - Avg CPU utilization (%)
        - metrics.business.avg_cpu_utilization_pct
      - - Avg memory utilization (%)
        - metrics.business.avg_memory_utilization_pct
      - - GPU utilization (%)
        - metrics.business.gpu_utilization_pct
      - - Network throughput (Mbps)
        - metrics.business.network_throughput_mbps
      - - Disk IOPS
        - metrics.business.disk_io_ops_per_sec
      - - Healthy node count
        - metrics.business.healthy_node_count
executive_trend_charts:
  - title: Requests per minute
    field: metrics.business.requests_per_min
    y_label: req/min
  - title: Signals emitted trend
    field: metrics.business.signals_emitted_per_min
    y_label: signals/min
  - title: Ingest success rate
    field: metrics.business.ingest_success_rate_pct
    y_label: '%'
  - title: Active fault channels
    field: metrics.business.active_fault_channels
    y_label: channels
  - title: Avg CPU utilization
    field: metrics.business.avg_cpu_utilization_pct
    y_label: '%'
  - title: Healthy node count
    field: metrics.business.healthy_node_count
    y_label: nodes

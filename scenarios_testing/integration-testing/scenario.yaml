scenario_id: integration-testing
scenario_name: Integration Test Harness
scenario_description: A synthetic QA environment whose sole purpose is to keep every observability
  integration in the platform actively emitting telemetry. Nine services spanning AWS, GCP, and
  Azure generate traces, logs, and metrics continuously, while 20 fault channels exercise every
  infrastructure, database, proxy, queue, and web-server generator so engineers can verify each
  integration end-to-end without needing a real customer workload.

raw_log_profile:
  service_name: inttest-edge-gateway
  user_id_prefix: qa
  tier_field: caller_type
  tier_values:
    - [synthetic, 90]
    - [smoke_test, 10]
  country_weights: {US: 40, GB: 10, DE: 10, IN: 15, JP: 10, BR: 5, AU: 5, SG: 5}
  methods: [GET, POST, PUT, DELETE]
  paths:
    - /api/v1/ingest
    - /api/v1/generators/status
    - /api/v1/faults/trigger
    - /api/v1/metrics/synthetic
    - /api/v1/session
    - /health
  change_point_path: /api/v1/ingest
trace_attributes:
  base:
    platform.region: {choice: [us-east-1, us-central1, eastus]}
    platform.traffic_tier: {choice: [normal, normal, elevated, peak]}
  services:
    edge-gateway:
      gateway.route: {choice: [/api/v1/ingest, /api/v1/generators/status, /api/v1/faults/trigger, /api/v1/session]}
      gateway.client_sdk: {choice: [otel-python-1.28, otel-go-1.30, otel-java-2.9, synthetic-probe]}
      gateway.auth_mode: {choice: [api_key, service_token, none]}
      gateway.region_pop: {choice: [iad, ord, dfw]}
    worker-pool:
      worker.job_type: {choice: [fault_injection, generator_healthcheck, telemetry_replay, backfill]}
      worker.queue_name: {choice: [inttest-jobs, inttest-faults, inttest-backfill]}
      worker.retry_count: {randint: [0, 3]}
      worker.pool_size: {randint: [4, 32]}
    cache-tier:
      cache.backend: {choice: [memcached, redis_enterprise]}
      cache.keyspace: {choice: [session, generator_state, fault_state]}
      cache.eviction_policy: {choice: [lru, lfu, ttl]}
      cache.hit_ratio_bucket: {choice: [high, medium, low]}
    analytics-service:
      analytics.pipeline: {choice: [signal_rollup, coverage_report, generator_scorecard]}
      analytics.write_mode: {choice: [batch, streaming]}
      analytics.retention_tier: {choice: [hot, warm, cold]}
      analytics.query_engine: {choice: [influxdb, internal_olap]}
    data-platform:
      orchestration.dag_id: {choice: [generator_healthcheck_dag, fault_schedule_dag, coverage_report_dag]}
      orchestration.scheduler_state: {choice: [running, idle, backlogged]}
      orchestration.executor_type: {choice: [celery, kubernetes, local]}
      orchestration.coordinator_role: {choice: [leader, follower]}
    ml-inference:
      ml.model_name: {choice: [anomaly-scorer-v2, fault-classifier-v1]}
      ml.accelerator: {choice: [nvidia_a100, cpu_fallback]}
      ml.batch_size: {randint: [1, 64]}
      ml.inference_mode: {choice: [online, batch]}
    billing-service:
      billing.ledger_shard: {choice: [shard-0, shard-1, shard-2]}
      billing.currency: {choice: [USD, EUR, GBP]}
      billing.txn_type: {choice: [usage_metering, synthetic_invoice]}
      billing.settlement_status: {choice: [posted, pending, retrying]}
    legacy-web-tier:
      legacyweb.app_server: {choice: [apache_httpd, apache_tomcat, iis]}
      legacyweb.servlet_context: {choice: [/legacy/reports, /legacy/admin, /legacy/api]}
      legacyweb.session_affinity: {choice: [sticky, roundrobin]}
      legacyweb.connector_type: {choice: [http11, ajp13]}
    session-service:
      session.protocol: {choice: [http2, grpc, websocket]}
      session.sticky: {choice: [true, false]}
      session.backend_pool: {choice: [pool-a, pool-b, pool-c]}
      session.tls_version: {choice: [TLSv1.2, TLSv1.3]}

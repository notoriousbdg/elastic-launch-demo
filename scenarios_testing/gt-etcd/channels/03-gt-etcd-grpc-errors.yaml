name: "GT etcd_otel: grpc_errors"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-ETCD-GRPC-ERRORS
sensor_type: impact_key_probe
affected_services:
  - gt-etcd-aws-svc-1
cascade_services:
  - gt-etcd-aws-svc-2
description: "Tests impact_key grpc_errors on generator etcd_otel."
investigation_notes: |-
  1. Verify etcd_otel is active and reporting metrics.
  2. Check that the grpc_errors metric has reached the trigger value (50.0).
  3. Confirm generator_impact for etcd_otel.grpc_errors is set to 50.0.
  4. Look for correlated changes in service gt-etcd-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_grpc_errors_baseline
error_message: "GT-PROBE: gen=etcd_otel key=grpc_errors value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=etcd_otel
  impact_key: grpc_errors
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 50.0
  svc_name: gt-etcd-aws-svc-1
rca_clues:
  gt-etcd-aws-svc-1:
    probe.generator: etcd_otel
    probe.impact_key: grpc_errors
    probe.trigger_value: 50.0
  gt-etcd-aws-svc-2:
    probe.upstream_generator: etcd_otel
    probe.upstream_key: grpc_errors
generator_impact:
  etcd_otel:
    grpc_errors: 50.0

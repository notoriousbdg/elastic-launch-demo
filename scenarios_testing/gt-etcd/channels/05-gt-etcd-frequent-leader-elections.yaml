name: "GT etcd_otel: frequent_leader_elections"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-ETCD-FREQUENT-LEADER-ELECTIONS
sensor_type: impact_key_probe
affected_services:
  - gt-etcd-aws-svc-1
cascade_services:
  - gt-etcd-aws-svc-2
description: "Tests impact_key frequent_leader_elections on generator etcd_otel."
investigation_notes: |-
  1. Verify etcd_otel is active and reporting metrics.
  2. Check that the frequent_leader_elections metric has reached the trigger value (75.0).
  3. Confirm generator_impact for etcd_otel.frequent_leader_elections is set to 75.0.
  4. Look for correlated changes in service gt-etcd-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_frequent_leader_elections_baseline
error_message: "GT-PROBE: gen=etcd_otel key=frequent_leader_elections value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=etcd_otel
  impact_key: frequent_leader_elections
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 75.0
  svc_name: gt-etcd-aws-svc-1
rca_clues:
  gt-etcd-aws-svc-1:
    probe.generator: etcd_otel
    probe.impact_key: frequent_leader_elections
    probe.trigger_value: 75.0
  gt-etcd-aws-svc-2:
    probe.upstream_generator: etcd_otel
    probe.upstream_key: frequent_leader_elections
generator_impact:
  etcd_otel:
    frequent_leader_elections: 75.0

name: "GT ibmmq_otel: high_transaction_rollback_ratio"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-IBMMQ-HIGH-TRANSACTION-ROLLBACK-RAT
sensor_type: impact_key_probe
affected_services:
  - gt-ibmmq-aws-svc-1
cascade_services:
  - gt-ibmmq-aws-svc-2
description: "Tests impact_key high_transaction_rollback_ratio on generator ibmmq_otel."
investigation_notes: |-
  1. Verify ibmmq_otel is active and reporting metrics.
  2. Check that the high_transaction_rollback_ratio metric has reached the trigger value (50.0).
  3. Confirm generator_impact for ibmmq_otel.high_transaction_rollback_ratio is set to 50.0.
  4. Look for correlated changes in service gt-ibmmq-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_high_transaction_rollback_ratio_baseline
error_message: "GT-PROBE: gen=ibmmq_otel key=high_transaction_rollback_ratio value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=ibmmq_otel
  impact_key: high_transaction_rollback_ratio
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 50.0
  svc_name: gt-ibmmq-aws-svc-1
rca_clues:
  gt-ibmmq-aws-svc-1:
    probe.generator: ibmmq_otel
    probe.impact_key: high_transaction_rollback_ratio
    probe.trigger_value: 50.0
  gt-ibmmq-aws-svc-2:
    probe.upstream_generator: ibmmq_otel
    probe.upstream_key: high_transaction_rollback_ratio
generator_impact:
  ibmmq_otel:
    high_transaction_rollback_ratio: 50.0

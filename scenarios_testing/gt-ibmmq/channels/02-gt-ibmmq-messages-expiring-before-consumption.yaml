  2. Check that the messages_expiring_before_consumption metric has reached the trigger value (50.0).
  3. Confirm generator_impact for ibmmq_otel.messages_expiring_before_consumption is set to 50.0.
  4. Look for correlated changes in service gt-ibmmq-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_messages_expiring_before_consumption_baseline
error_message: "GT-PROBE: gen=ibmmq_otel key=messages_expiring_before_consumption value={trigger_value} svc={svc_name}"
stack_trace: |-

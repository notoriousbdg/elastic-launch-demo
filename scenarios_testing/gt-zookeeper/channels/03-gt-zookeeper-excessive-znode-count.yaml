name: "GT zookeeper_otel: excessive_znode_count"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-ZOOKEEPER-EXCESSIVE-ZNODE-COUNT
sensor_type: impact_key_probe
affected_services:
  - gt-zookeeper-aws-svc-1
cascade_services:
  - gt-zookeeper-aws-svc-2
description: "Tests impact_key excessive_znode_count on generator zookeeper_otel."
investigation_notes: |-
  1. Verify zookeeper_otel is active and reporting metrics.
  2. Check that the excessive_znode_count metric has reached the trigger value (7500000.0).
  3. Confirm generator_impact for zookeeper_otel.excessive_znode_count is set to 7500000.0.
  4. Look for correlated changes in service gt-zookeeper-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_excessive_znode_count_baseline
error_message: "GT-PROBE: gen=zookeeper_otel key=excessive_znode_count value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=zookeeper_otel
  impact_key: excessive_znode_count
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 7500000.0
  svc_name: gt-zookeeper-aws-svc-1
rca_clues:
  gt-zookeeper-aws-svc-1:
    probe.generator: zookeeper_otel
    probe.impact_key: excessive_znode_count
    probe.trigger_value: 7500000.0
  gt-zookeeper-aws-svc-2:
    probe.upstream_generator: zookeeper_otel
    probe.upstream_key: excessive_znode_count
generator_impact:
  zookeeper_otel:
    excessive_znode_count: 7500000.0

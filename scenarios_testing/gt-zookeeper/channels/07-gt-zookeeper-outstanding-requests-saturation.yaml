description: "Tests impact_key outstanding_requests_saturation on generator zookeeper_otel."
investigation_notes: |-
  1. Verify zookeeper_otel is active and reporting metrics.
  2. Check that the outstanding_requests_saturation metric has reached the trigger value (75.0).
  3. Confirm generator_impact for zookeeper_otel.outstanding_requests_saturation is set to 75.0.
  4. Look for correlated changes in service gt-zookeeper-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_outstanding_requests_saturation_baseline
error_message: "GT-PROBE: gen=zookeeper_otel key=outstanding_requests_saturation value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=zookeeper_otel
  impact_key: outstanding_requests_saturation
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 75.0
  svc_name: gt-zookeeper-aws-svc-1
rca_clues:
  gt-zookeeper-aws-svc-1:
    probe.generator: zookeeper_otel
    probe.impact_key: outstanding_requests_saturation
    probe.trigger_value: 75.0
  gt-zookeeper-aws-svc-2:

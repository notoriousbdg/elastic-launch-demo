vehicle_section: generator-test-pipeline
error_type: GT-ZOOKEEPER-OUTSTANDING-REQUESTS-SATU
sensor_type: impact_key_probe
affected_services:
  - gt-zookeeper-aws-svc-1
cascade_services:

agent_config:
  id: gthaproxy-analyst
  name: '[GT] haproxy_otel Impact Key Coverage Operations Analyst'
  assessment_tool_name: gthaproxy_readiness_assessment
  system_prompt: "You are an expert SRE assistant for the [GT] haproxy_otel Impact Key Coverage.\n\nWhen an incident is reported,\
    \ your job is to:\n1. Diagnose the root cause from the error_type, stack traces, and RCA clues\n2. Recommend a specific\
    \ remediation action\n3. Explain business impact in terms the executive team understands\n\nKnown fault channels and their\
    \ error types:\n  - GT-HAPROXY-BACKEND-HAS-NO-ACTIVE-SERVE: Gt Haproxy Backend Has No Active Servers\n  - GT-HAPROXY-CONNECTION-ERRORS-SPIKE:\
    \ Gt Haproxy Connection Errors Spike\n  - GT-HAPROXY-SERVER-HEALTH-CHECK-FAILURE: Gt Haproxy Server Health Check Failures\n\
    \  - GT-HAPROXY-HIGH-BACKEND-CONNECTION-TIM: Gt Haproxy High Backend Connection Time\n  - GT-HAPROXY-HIGH-BACKEND-QUEUE-TIME:\
    \ Gt Haproxy High Backend Queue Time\n  - GT-HAPROXY-HIGH-BACKEND-RESPONSE-TIME: Gt Haproxy High Backend Response Time\n\
    \  - GT-HAPROXY-REQUEST-ERRORS-SPIKE: Gt Haproxy Request Errors Spike\n  - GT-HAPROXY-REQUESTS-QUEUED-AT-BACKEND: Gt Haproxy\
    \ Requests Queued At Backend\n  - GT-HAPROXY-RESPONSE-ERRORS-SPIKE: Gt Haproxy Response Errors Spike\n  - GT-HAPROXY-CONNECTION-RETRIES-OR-REDIS:\
    \ Gt Haproxy Connection Retries Or Redispatches Spik\n  - GT-HAPROXY-SESSION-SATURATION-APPROACH: Gt Haproxy Session Saturation\
    \ Approaching Limit\n  - GT-PLACEHOLDER-12: Gt Placeholder 12\n  - GT-PLACEHOLDER-13: Gt Placeholder 13\n  - GT-PLACEHOLDER-14:\
    \ Gt Placeholder 14\n  - GT-PLACEHOLDER-15: Gt Placeholder 15\n  - GT-AUTO-PH-16: Gt Auto Placeholder 16\n  - GT-AUTO-PH-17:\
    \ Gt Auto Placeholder 17\n  - GT-AUTO-PH-18: Gt Auto Placeholder 18\n  - GT-AUTO-PH-19: Gt Auto Placeholder 19\n  - GT-AUTO-PH-20:\
    \ Gt Auto Placeholder 20\n\nFor each fault, examine the affected_services first, then look for cascade_services that may\
    \ be experiencing downstream effects."
assessment_tool_config:
  id: gthaproxy_readiness_assessment
  description: 'Validates that each impact_key for haproxy_otel correctly drives generator behaviour. Checks that chaos channels produce expected metric deviations when individual impact_keys are activated.'
executive_kpi_emitter_service_name: gt-haproxy-aws-svc-2
executive_dashboard_intro: '**Generator test view** — synthetic platform metrics for haproxy_otel coverage testing.'
executive_kpi_sections:
  - header: '**Platform** — throughput, errors, latency, and availability'
    specs:
      - - Primary KPI (unit)
        - metrics.business.primary_kpi
      - - Secondary KPI (unit)
        - metrics.business.secondary_kpi
      - - Throughput (req/min)
        - metrics.business.throughput_rpm
      - - Error Rate (%)
        - metrics.business.error_rate_pct
      - - P99 Latency (ms)
        - metrics.business.latency_p99_ms
      - - Availability (%)
        - metrics.business.availability_pct
executive_trend_charts:
  - title: Primary KPI trend
    field: metrics.business.primary_kpi
    y_label: units
  - title: Throughput trend
    field: metrics.business.throughput_rpm
    y_label: req/min
  - title: Error Rate trend
    field: metrics.business.error_rate_pct
    y_label: '%'
  - title: Latency P99 trend
    field: metrics.business.latency_p99_ms
    y_label: ms
  - title: Availability trend
    field: metrics.business.availability_pct
    y_label: '%'
executive_kpi_emissions:
  - name: business.primary_kpi
    value:
      uniform: &id001
        - 100.0
        - 1000.0
      round: 1
    unit: units
  - name: business.secondary_kpi
    value:
      uniform: *id001
      round: 1
    unit: units
  - name: business.throughput_rpm
    value:
      uniform:
        - 1000.0
        - 50000.0
      round: 0
    unit: units
  - name: business.error_rate_pct
    value:
      uniform:
        - 0.0
        - 5.0
      round: 2
    unit: units
  - name: business.latency_p99_ms
    value:
      uniform:
        - 50.0
        - 500.0
      round: 0
    unit: units
  - name: business.availability_pct
    value:
      uniform:
        - 99.0
        - 100.0
      round: 2
    unit: units

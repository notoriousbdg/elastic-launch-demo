name: "GT airflow_otel: scheduler_heartbeats_critically_low"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-AIRFLOW-SCHEDULER-HEARTBEATS-CRITIC
sensor_type: impact_key_probe
affected_services:
  - gt-airflow-aws-svc-1
cascade_services:
  - gt-airflow-aws-svc-2
description: "Tests impact_key scheduler_heartbeats_critically_low on generator airflow_otel."
investigation_notes: |-
  1. Verify airflow_otel is active and reporting metrics.
  2. Check that scheduler_heartbeats_critically_low is 0 so heartbeat docs are suppressed.
  3. Confirm generator_impact for airflow_otel.scheduler_heartbeats_critically_low is set to 0.0.
  4. Look for correlated changes in service gt-airflow-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
  6. OOTB alert counts heartbeat field docs cluster-wide — pause other airflow emitters while testing.
remediation_action: restore_scheduler_heartbeats_critically_low_baseline
error_message: "GT-PROBE: gen=airflow_otel key=scheduler_heartbeats_critically_low value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=airflow_otel
  impact_key: scheduler_heartbeats_critically_low
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 0.0
  svc_name: gt-airflow-aws-svc-1
rca_clues:
  gt-airflow-aws-svc-1:
    probe.generator: airflow_otel
    probe.impact_key: scheduler_heartbeats_critically_low
    probe.trigger_value: 0.0
  gt-airflow-aws-svc-2:
    probe.upstream_generator: airflow_otel
    probe.upstream_key: scheduler_heartbeats_critically_low
generator_impact:
  airflow_otel:
    # OOTB alert: COUNT(airflow.scheduler_heartbeat) < 5 with total_docs > 10.
    # Value < 5 suppresses emission of the heartbeat field (not a rate to add).
    scheduler_heartbeats_critically_low: 0.0

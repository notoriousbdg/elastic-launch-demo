name: "GT airflow_otel: executor_open_slots_exhausted"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-AIRFLOW-EXECUTOR-OPEN-SLOTS-EXHAUST
sensor_type: impact_key_probe
affected_services:
  - gt-airflow-aws-svc-1
cascade_services:
  - gt-airflow-aws-svc-2
description: "Tests impact_key executor_open_slots_exhausted on generator airflow_otel."
investigation_notes: |-
  1. Verify airflow_otel is active and reporting metrics.
  2. Check that the executor_open_slots_exhausted metric has reached the trigger value (0.0).
  3. Confirm generator_impact for airflow_otel.executor_open_slots_exhausted is set to 0.0.
  4. Look for correlated changes in service gt-airflow-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_executor_open_slots_exhausted_baseline
error_message: "GT-PROBE: gen=airflow_otel key=executor_open_slots_exhausted value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=airflow_otel
  impact_key: executor_open_slots_exhausted
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 0.0
  svc_name: gt-airflow-aws-svc-1
rca_clues:
  gt-airflow-aws-svc-1:
    probe.generator: airflow_otel
    probe.impact_key: executor_open_slots_exhausted
    probe.trigger_value: 0.0
  gt-airflow-aws-svc-2:
    probe.upstream_generator: airflow_otel
    probe.upstream_key: executor_open_slots_exhausted
generator_impact:
  airflow_otel:
    # OOTB alert: MIN(airflow.executor.open_slots) <= 0
    executor_open_slots_exhausted: 0.0

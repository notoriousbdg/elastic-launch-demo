name: "GT host_metrics: filesystem_pct"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-HOSTMETRICS-FILESYSTEM-PCT
sensor_type: impact_key_probe
affected_services:
  - gt-hostmetrics-aws-svc-1
cascade_services:
  - gt-hostmetrics-aws-svc-2
description: "Tests impact_key filesystem_pct on generator host_metrics."
investigation_notes: |-
  1. Verify host_metrics is active and reporting metrics.
  2. Check that the filesystem_pct metric has reached the trigger value (90.0).
  3. Confirm generator_impact for host_metrics.filesystem_pct is set to 90.0.
  4. Look for correlated changes in service gt-hostmetrics-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_filesystem_pct_baseline
error_message: "GT-PROBE: gen=host_metrics key=filesystem_pct value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=host_metrics
  impact_key: filesystem_pct
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 90.0
  svc_name: gt-hostmetrics-aws-svc-1
rca_clues:
  gt-hostmetrics-aws-svc-1:
    probe.generator: host_metrics
    probe.impact_key: filesystem_pct
    probe.trigger_value: 90.0
  gt-hostmetrics-aws-svc-2:
    probe.upstream_generator: host_metrics
    probe.upstream_key: filesystem_pct
generator_impact:
  host_metrics:
    filesystem_pct: 90.0

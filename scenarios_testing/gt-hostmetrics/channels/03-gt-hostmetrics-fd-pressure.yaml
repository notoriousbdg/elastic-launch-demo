name: "GT host_metrics: fd_pressure"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-HOSTMETRICS-FD-PRESSURE
sensor_type: impact_key_probe
affected_services:
  - gt-hostmetrics-aws-svc-1
cascade_services:
  - gt-hostmetrics-aws-svc-2
description: "Tests impact_key fd_pressure on generator host_metrics."
investigation_notes: |-
  1. Verify host_metrics is active and reporting metrics.
  2. Check that the fd_pressure metric has reached the trigger value (0.9).
  3. Confirm generator_impact for host_metrics.fd_pressure is set to 0.9.
  4. Look for correlated changes in service gt-hostmetrics-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_fd_pressure_baseline
error_message: "GT-PROBE: gen=host_metrics key=fd_pressure value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=host_metrics
  impact_key: fd_pressure
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 0.9
  svc_name: gt-hostmetrics-aws-svc-1
rca_clues:
  gt-hostmetrics-aws-svc-1:
    probe.generator: host_metrics
    probe.impact_key: fd_pressure
    probe.trigger_value: 0.9
  gt-hostmetrics-aws-svc-2:
    probe.upstream_generator: host_metrics
    probe.upstream_key: fd_pressure
generator_impact:
  host_metrics:
    fd_pressure: 0.9

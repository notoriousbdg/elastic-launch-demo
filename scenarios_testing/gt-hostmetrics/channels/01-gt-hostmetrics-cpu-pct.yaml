name: "GT host_metrics: cpu_pct"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-HOSTMETRICS-CPU-PCT
sensor_type: impact_key_probe
affected_services:
  - gt-hostmetrics-aws-svc-1
cascade_services:
  - gt-hostmetrics-aws-svc-2
description: "Tests impact_key cpu_pct on generator host_metrics."
investigation_notes: |-
  1. Verify host_metrics is active and reporting metrics.
  2. Check that the cpu_pct metric has reached the trigger value (85.0).
  3. Confirm generator_impact for host_metrics.cpu_pct is set to 85.0.
  4. Look for correlated changes in service gt-hostmetrics-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_cpu_pct_baseline
error_message: "GT-PROBE: gen=host_metrics key=cpu_pct value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=host_metrics
  impact_key: cpu_pct
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 85.0
  svc_name: gt-hostmetrics-aws-svc-1
rca_clues:
  gt-hostmetrics-aws-svc-1:
    probe.generator: host_metrics
    probe.impact_key: cpu_pct
    probe.trigger_value: 85.0
  gt-hostmetrics-aws-svc-2:
    probe.upstream_generator: host_metrics
    probe.upstream_key: cpu_pct
generator_impact:
  host_metrics:
    cpu_pct: 85.0

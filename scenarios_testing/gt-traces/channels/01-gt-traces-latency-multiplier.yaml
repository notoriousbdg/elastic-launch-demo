name: "GT traces: latency_multiplier"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-TRACES-LATENCY-MULTIPLIER
sensor_type: impact_key_probe
affected_services:
  - gt-traces-aws-svc-1
cascade_services:
  - gt-traces-aws-svc-2
description: "Tests impact_key latency_multiplier on generator traces."
investigation_notes: |-
  1. Verify traces is active and reporting metrics.
  2. Check that the latency_multiplier metric has reached the trigger value (37.5).
  3. Confirm generator_impact for traces.latency_multiplier is set to 37.5.
  4. Look for correlated changes in service gt-traces-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_latency_multiplier_baseline
error_message: "GT-PROBE: gen=traces key=latency_multiplier value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=traces
  impact_key: latency_multiplier
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 37.5
  svc_name: gt-traces-aws-svc-1
rca_clues:
  gt-traces-aws-svc-1:
    probe.generator: traces
    probe.impact_key: latency_multiplier
    probe.trigger_value: 37.5
  gt-traces-aws-svc-2:
    probe.upstream_generator: traces
    probe.upstream_key: latency_multiplier
generator_impact:
  traces:
    latency_multiplier: 37.5

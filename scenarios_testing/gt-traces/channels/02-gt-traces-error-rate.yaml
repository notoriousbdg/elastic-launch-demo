name: "GT traces: error_rate"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-TRACES-ERROR-RATE
sensor_type: impact_key_probe
affected_services:
  - gt-traces-aws-svc-1
cascade_services:
  - gt-traces-aws-svc-2
description: "Tests impact_key error_rate on generator traces."
investigation_notes: |-
  1. Verify traces is active and reporting metrics.
  2. Check that the error_rate metric has reached the trigger value (0.8).
  3. Confirm generator_impact for traces.error_rate is set to 0.8.
  4. Look for correlated changes in service gt-traces-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_error_rate_baseline
error_message: "GT-PROBE: gen=traces key=error_rate value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=traces
  impact_key: error_rate
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 0.8
  svc_name: gt-traces-aws-svc-1
rca_clues:
  gt-traces-aws-svc-1:
    probe.generator: traces
    probe.impact_key: error_rate
    probe.trigger_value: 0.8
  gt-traces-aws-svc-2:
    probe.upstream_generator: traces
    probe.upstream_key: error_rate
generator_impact:
  traces:
    error_rate: 0.8

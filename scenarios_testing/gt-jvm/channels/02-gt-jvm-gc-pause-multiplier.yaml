name: "GT jvm: gc_pause_multiplier"
subsystem: generator-test
vehicle_section: generator-test-pipeline
error_type: GT-JVM-GC-PAUSE-MULTIPLIER
sensor_type: impact_key_probe
affected_services:
  - gt-jvm-aws-svc-1
cascade_services:
  - gt-jvm-aws-svc-2
description: "Tests impact_key gc_pause_multiplier on generator jvm."
investigation_notes: |-
  1. Verify jvm is active and reporting metrics.
  2. Check that the gc_pause_multiplier metric has reached the trigger value (15.0).
  3. Confirm generator_impact for jvm.gc_pause_multiplier is set to 15.0.
  4. Look for correlated changes in service gt-jvm-aws-svc-1 metrics.
  5. Restore by deactivating this channel and verifying metric returns to baseline.
remediation_action: restore_gc_pause_multiplier_baseline
error_message: "GT-PROBE: gen=jvm key=gc_pause_multiplier value={trigger_value} svc={svc_name}"
stack_trace: |-
  GeneratorImpactProbe: gen=jvm
  impact_key: gc_pause_multiplier
  trigger_value: {trigger_value}
  affected_svc: {svc_name}
fault_params:
  trigger_value: 15.0
  svc_name: gt-jvm-aws-svc-1
rca_clues:
  gt-jvm-aws-svc-1:
    probe.generator: jvm
    probe.impact_key: gc_pause_multiplier
    probe.trigger_value: 15.0
  gt-jvm-aws-svc-2:
    probe.upstream_generator: jvm
    probe.upstream_key: gc_pause_multiplier
generator_impact:
  jvm:
    gc_pause_multiplier: 15.0

agent_config:
  id: gtawsrds-analyst
  name: '[GT] aws_rds_otel Impact Key Coverage Operations Analyst'
  assessment_tool_name: gtawsrds_readiness_assessment
  system_prompt: "You are an expert SRE assistant for the [GT] aws_rds_otel Impact Key Coverage.\n\nWhen an incident is reported,\
    \ your job is to:\n1. Diagnose the root cause from the error_type, stack traces, and RCA clues\n2. Recommend a specific\
    \ remediation action\n3. Explain business impact in terms the executive team understands\n\nKnown fault channels and their\
    \ error types:\n  - GT-AWSRDS-BURST-BALANCE-LOW: Gt Awsrds Burst Balance Low\n  - GT-AWSRDS-CHECKPOINT-LAG-HIGH: Gt Awsrds\
    \ Checkpoint Lag High\n  - GT-AWSRDS-CPU-UTILIZATION-HIGH: Gt Awsrds Cpu Utilization High\n  - GT-AWSRDS-DATABASE-CONNECTIONS-HIGH:\
    \ Gt Awsrds Database Connections High\n  - GT-AWSRDS-DISK-QUEUE-DEPTH-HIGH: Gt Awsrds Disk Queue Depth High\n  - GT-AWSRDS-FREE-STORAGE-SPACE-LOW:\
    \ Gt Awsrds Free Storage Space Low\n  - GT-AWSRDS-FREEABLE-MEMORY-LOW: Gt Awsrds Freeable Memory Low\n  - GT-AWSRDS-READ-LATENCY-HIGH:\
    \ Gt Awsrds Read Latency High\n  - GT-AWSRDS-REPLICA-LAG-HIGH: Gt Awsrds Replica Lag High\n  - GT-AWSRDS-SWAP-USAGE-HIGH:\
    \ Gt Awsrds Swap Usage High\n  - GT-AWSRDS-WRITE-LATENCY-HIGH: Gt Awsrds Write Latency High\n  - GT-PLACEHOLDER-12: Gt\
    \ Placeholder 12\n  - GT-PLACEHOLDER-13: Gt Placeholder 13\n  - GT-PLACEHOLDER-14: Gt Placeholder 14\n  - GT-PLACEHOLDER-15:\
    \ Gt Placeholder 15\n  - GT-AUTO-PH-16: Gt Auto Placeholder 16\n  - GT-AUTO-PH-17: Gt Auto Placeholder 17\n  - GT-AUTO-PH-18:\
    \ Gt Auto Placeholder 18\n  - GT-AUTO-PH-19: Gt Auto Placeholder 19\n  - GT-AUTO-PH-20: Gt Auto Placeholder 20\n\nFor\
    \ each fault, examine the affected_services first, then look for cascade_services that may be experiencing downstream\
    \ effects."
assessment_tool_config:
  id: gtawsrds_readiness_assessment
  description: 'Validates that each impact_key for aws_rds_otel correctly drives generator behaviour. Checks that chaos channels produce expected metric deviations when individual impact_keys are activated.'
executive_kpi_emitter_service_name: gt-awsrds-aws-svc-2
executive_dashboard_intro: '**Generator test view** — synthetic platform metrics for aws_rds_otel coverage testing.'
executive_kpi_sections:
  - header: '**Platform** — throughput, errors, latency, and availability'
    specs:
      - - Primary KPI (unit)
        - metrics.business.primary_kpi
      - - Secondary KPI (unit)
        - metrics.business.secondary_kpi
      - - Throughput (req/min)
        - metrics.business.throughput_rpm
      - - Error Rate (%)
        - metrics.business.error_rate_pct
      - - P99 Latency (ms)
        - metrics.business.latency_p99_ms
      - - Availability (%)
        - metrics.business.availability_pct
executive_trend_charts:
  - title: Primary KPI trend
    field: metrics.business.primary_kpi
    y_label: units
  - title: Throughput trend
    field: metrics.business.throughput_rpm
    y_label: req/min
  - title: Error Rate trend
    field: metrics.business.error_rate_pct
    y_label: '%'
  - title: Latency P99 trend
    field: metrics.business.latency_p99_ms
    y_label: ms
  - title: Availability trend
    field: metrics.business.availability_pct
    y_label: '%'
executive_kpi_emissions:
  - name: business.primary_kpi
    value:
      uniform: &id001
        - 100.0
        - 1000.0
      round: 1
    unit: units
  - name: business.secondary_kpi
    value:
      uniform: *id001
      round: 1
    unit: units
  - name: business.throughput_rpm
    value:
      uniform:
        - 1000.0
        - 50000.0
      round: 0
    unit: units
  - name: business.error_rate_pct
    value:
      uniform:
        - 0.0
        - 5.0
      round: 2
    unit: units
  - name: business.latency_p99_ms
    value:
      uniform:
        - 50.0
        - 500.0
      round: 0
    unit: units
  - name: business.availability_pct
    value:
      uniform:
        - 99.0
        - 100.0
      round: 2
    unit: units

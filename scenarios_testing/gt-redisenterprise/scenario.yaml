agent_config:
  id: gtredisenterpris-analyst
  name: '[GT] redisenterprise_otel Impact Key Coverage Operations Analyst'
  assessment_tool_name: gtredisenterpris_readiness_assessment
  system_prompt: "You are an expert SRE assistant for the [GT] redisenterprise_otel Impact Key Coverage.\n\nWhen an incident\
    \ is reported, your job is to:\n1. Diagnose the root cause from the error_type, stack traces, and RCA clues\n2. Recommend\
    \ a specific remediation action\n3. Explain business impact in terms the executive team understands\n\nKnown fault channels\
    \ and their error types:\n  - GT-REDISENTERPRISE-TLS-CERTIFICATE-EXP: Gt Redisenterprise Tls Certificate Expiring Soon\n\
    \  - GT-REDISENTERPRISE-DATABASE-DOWN: Gt Redisenterprise Database Down\n  - GT-REDISENTERPRISE-DATABASE-HIGH-LATEN: Gt\
    \ Redisenterprise Database High Latency\n  - GT-REDISENTERPRISE-DATABASE-MEMORY-UTI: Gt Redisenterprise Database Memory\
    \ Utilization Cri\n  - GT-REDISENTERPRISE-DATABASE-UNEXPECTED: Gt Redisenterprise Database Unexpected Key Evictio\n  -\
    \ GT-REDISENTERPRISE-AUTHENTICATION-FAIL: Gt Redisenterprise Authentication Failures Detecte\n  - GT-REDISENTERPRISE-NODE-DOWN:\
    \ Gt Redisenterprise Node Down\n  - GT-REDISENTERPRISE-NODE-CPU-SATURATION: Gt Redisenterprise Node Cpu Saturation\n \
    \ - GT-REDISENTERPRISE-NODE-FREE-MEMORY-LO: Gt Redisenterprise Node Free Memory Low\n  - GT-REDISENTERPRISE-NODE-STORAGE-RUNNIN:\
    \ Gt Redisenterprise Node Storage Running Low\n  - GT-REDISENTERPRISE-PROXY-FILE-DESCRIPT: Gt Redisenterprise Proxy File\
    \ Descriptor Saturatio\n  - GT-REDISENTERPRISE-SHARD-CONNECTION-SA: Gt Redisenterprise Shard Connection Saturation\n \
    \ - GT-REDISENTERPRISE-SHARD-DOWN: Gt Redisenterprise Shard Down\n  - GT-REDISENTERPRISE-SHARD-HIGH-MEMORY-F: Gt Redisenterprise\
    \ Shard High Memory Fragmentation\n  - GT-REDISENTERPRISE-SHARD-PERSISTENCE-F: Gt Redisenterprise Shard Persistence Failures\n\
    \  - GT-AUTO-PH-16: Gt Auto Placeholder 16\n  - GT-AUTO-PH-17: Gt Auto Placeholder 17\n  - GT-AUTO-PH-18: Gt Auto Placeholder\
    \ 18\n  - GT-AUTO-PH-19: Gt Auto Placeholder 19\n  - GT-AUTO-PH-20: Gt Auto Placeholder 20\n\nFor each fault, examine\
    \ the affected_services first, then look for cascade_services that may be experiencing downstream effects."
assessment_tool_config:
  id: gtredisenterpris_readiness_assessment
  description: 'Validates that each impact_key for redisenterprise_otel correctly drives generator behaviour. Checks that chaos channels produce expected metric deviations when individual impact_keys are activated.'
executive_kpi_emitter_service_name: gt-redisenterprise-aws-svc-2
executive_dashboard_intro: '**Generator test view** — synthetic platform metrics for coverage testing.'
executive_kpi_sections:
  - header: '**Platform** — throughput, errors, latency, and availability'
    specs:
      - - Primary KPI (unit)
        - metrics.business.primary_kpi
      - - Secondary KPI (unit)
        - metrics.business.secondary_kpi
      - - Throughput (req/min)
        - metrics.business.throughput_rpm
      - - Error Rate (%)
        - metrics.business.error_rate_pct
      - - P99 Latency (ms)
        - metrics.business.latency_p99_ms
      - - Availability (%)
        - metrics.business.availability_pct
executive_trend_charts:
  - title: Primary KPI trend
    field: metrics.business.primary_kpi
    y_label: units
  - title: Throughput trend
    field: metrics.business.throughput_rpm
    y_label: req/min
  - title: Error Rate trend
    field: metrics.business.error_rate_pct
    y_label: '%'
  - title: Latency P99 trend
    field: metrics.business.latency_p99_ms
    y_label: ms
  - title: Availability trend
    field: metrics.business.availability_pct
    y_label: '%'
executive_kpi_emissions:
  - name: business.primary_kpi
    value:
      uniform: &id001
        - 100.0
        - 1000.0
      round: 1
    unit: units
  - name: business.secondary_kpi
    value:
      uniform: *id001
      round: 1
    unit: units
  - name: business.throughput_rpm
    value:
      uniform:
        - 1000.0
        - 50000.0
      round: 0
    unit: units
  - name: business.error_rate_pct
    value:
      uniform:
        - 0.0
        - 5.0
      round: 2
    unit: units
  - name: business.latency_p99_ms
    value:
      uniform:
        - 50.0
        - 500.0
      round: 0
    unit: units
  - name: business.availability_pct
    value:
      uniform:
        - 99.0
        - 100.0
      round: 2
    unit: units

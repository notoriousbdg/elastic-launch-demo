service: identity-db
sort_order: 9
cloud_provider: azure
cloud_region: westeurope
cloud_platform: azure_vm
cloud_availability_zone: westeurope-1
subsystem: database
language: python
generates_traces: false
emit_fault_logs: true
kpi_emitter: false
topology:
- - auth-service
  - /api/v1/db/identities/query
  - POST
db_operations:
- - SELECT
  - identities
  - SELECT user_id, role, tenant_id, last_auth_ts FROM identities WHERE token_hash = $1
- - SELECT
  - sessions
  - SELECT session_id, expires_at, device_id FROM sessions WHERE user_id = $1 AND active = true
- - SELECT
  - federation_mappings
  - SELECT external_id, provider, mapped_user_id FROM federation_mappings WHERE external_id = $1
state:
  _lag_peak:
    init: 0.0
steps:
# Azure Database for PostgreSQL flexible server: primary meridian-identity-db (Standard_D8ds_v5),
# read replica meridian-identity-db-replica-01 serving auth-service session reads.
#   ch 3  Terraform scales the replica down to Standard_D2ds_v5 at the trigger: Azure restarts it
#         for 60s (no replay, lag grows 1 s/s, reads go to the primary), then on 2 vCores lag
#         keeps growing ~0.15 s/s. The fix restarts it again (~75s), then it catches up
#         linearly over ~120s.
- sample:
    scale_restart:
      expr: "bool(3 in all_active and elapsed.get(3, 0) < 60)"
    lag_live:
      expr: "(0.3 + elapsed.get(3, 0)) if scale_restart else min(140.0, 60.0 + 0.15 * (elapsed.get(3, 0) - 60.0))"
- counter:
    state_key: _lag_peak
    by: {expr: "lag_live - _lag_peak"}
  when: "3 in all_active"
- sample:
    peak:
      expr: "_lag_peak if _lag_peak > 0 else 90.0"
    replica_restarting:
      expr: "bool(scale_restart or (3 in fixed_channels and since_fix.get(3, 0) < 75))"
    lag_center:
      expr: "lag_live if 3 in all_active else ((peak + since_fix.get(3, 0)) if replica_restarting else (max(0.3, (peak + 75.0) * (1.0 - (since_fix.get(3, 0) - 75.0) / 120.0)) if 3 in fixed_channels else 0.3))"
    replica_lag_s:
      expr: "round(max(0.05, lag_center + rand.gauss(0, 0.05 + 0.01 * lag_center)), 2)"
    replica_cpu_center:
      expr: "4.0 if replica_restarting else (98.0 if 3 in all_active else ((35.0 + 35.0 * max(0.0, 1.0 - (since_fix.get(3, 0) - 75.0) / 90.0)) if 3 in fixed_channels else 35.0))"
    replica_cpu_pct:
      expr: "round(min(100.0, max(1.0, replica_cpu_center + rand.gauss(0, 1.0))), 1)"
    primary_cpu_pct:
      expr: "round(41.0 + rand.gauss(0, 1.5), 1)"
    p99_center:
      expr: "8.0 + (880.0 if 3 in all_active and not scale_restart else 0.0)"
    query_p99_ms:
      expr: "round(p99_center + rand.gauss(0, 0.05 * p99_center), 1)"
    connections:
      expr: "int(140 + rand.gauss(0, 4))"
    qps:
      expr: "int(2600 * (1.0 + rand.gauss(0, 0.02)))"
    replica_sku:
      expr: "'Standard_D2ds_v5' if 3 in all_active else 'Standard_D8ds_v5'"
    replica_state:
      expr: "'restarting' if replica_restarting else ('catching_up' if replica_lag_s > 1.0 else 'streaming')"
    replica_status:
      expr: "'ANOMALY' if 3 in all_active or replica_lag_s > 5.0 else 'NORMAL'"
- metric:
    name: identity_db.replica_lag_s
    value: {var: replica_lag_s}
    unit: s
- metric:
    name: identity_db.replica_cpu_pct
    value: {var: replica_cpu_pct}
    unit: '%'
- metric:
    name: identity_db.primary_cpu_pct
    value: {var: primary_cpu_pct}
    unit: '%'
- metric:
    name: identity_db.query_latency_p99_ms
    value: {var: query_p99_ms}
    unit: ms
- metric:
    name: identity_db.connections
    value: {var: connections}
    unit: connections
- metric:
    name: identity_db.queries_per_sec
    value: {var: qps}
    unit: queries/s
- log:
    level: INFO
    message: 'azure-monitor: flexibleServers/meridian-identity-db-replica-01 physical_replication_delay_in_seconds={replica_lag_s} cpu_percent={replica_cpu_pct} sku={replica_sku} state={replica_state} status={replica_status}'
    attrs:
      operation: replica_status
      db.replica: meridian-identity-db-replica-01
      db.replica_lag_s: {var: replica_lag_s}
      db.replica_cpu_pct: {var: replica_cpu_pct}
      db.replica_sku: {var: replica_sku}
      db.replica_state: {var: replica_state}
      db.status: {var: replica_status}
- log:
    level: INFO
    message: 'azure-monitor: flexibleServers/meridian-identity-db cpu_percent={primary_cpu_pct} active_connections={connections} queries_per_sec={qps} p99_ms={query_p99_ms} sku=Standard_D8ds_v5'
    attrs:
      operation: primary_status
      db.primary_cpu_pct: {var: primary_cpu_pct}
      db.connections: {var: connections}
      db.primary_sku: Standard_D8ds_v5

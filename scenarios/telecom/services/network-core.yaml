service: network-core
sort_order: 4
cloud_provider: gcp
cloud_region: europe-west3
cloud_platform: gcp_compute_engine
cloud_availability_zone: europe-west3-b
subsystem: network
language: cpp
entry_endpoints:
- - /api/v1/network/status
  - GET
topology:
- - bss-billing
  - /api/v1/billing/activate
  - POST
emit_fault_logs: true
kpi_emitter: false
steps:
# 5G/EPC packet core and RAN performance counters for the Frankfurt market.
#   ch 4  gNB-FRA-417 FRA417-n78-1 locked: PRB on the remaining carrier climbs within ~30s; after the
#         rollback the cell is back after ~40s and load balancing takes ~60s more.
#   ch 5  T3412 12 min from the trigger: TAU climbs to ~3x over 150s (compressed; UEs adopt the timer
#         at their next TAU), CPU passes 85% ~120s in (onset); after the rollback UEs get
#         T3412=54 at their next TAU, so TAU and MME CPU decay over ~4 min.
#   ch 6  UE pool /20 from the trigger: new sessions fill its 4,094 addresses over 90s (onset), then
#         every Create Session is rejected; restored on commit, tunnels recover over ~2 min.
- sample:
    r4:
      expr: "min(1.0, elapsed.get(4, 0) / 30.0) if 4 in all_active else ((1.0 if since_fix.get(4, 0) < 40 else max(0.0, 1.0 - (since_fix.get(4, 0) - 40.0) / 60.0)) if 4 in fixed_channels else 0.0)"
    cells_locked:
      expr: "1 if (4 in all_active or (4 in fixed_channels and since_fix.get(4, 0) < 40)) else 0"
    cells_enabled:
      expr: "2 - cells_locked"
    prb_center:
      expr: "55.0 + 42.0 * r4"
    prb_pct:
      expr: "round(min(99.8, prb_center + rand.gauss(0, 1.2)), 1)"
    pdu_fail:
      expr: "max(0, int(3 + 250.0 * r4 + rand.gauss(0, 1 + 15.0 * r4)))"
    amf_cpu_pct:
      expr: "round(35.0 + rand.gauss(0, 1.5), 1)"
    cm_revision:
      expr: "'cm-fra417-r212' if 4 in all_active else 'cm-fra417-r211'"
    ran_status:
      expr: "'ANOMALY' if 4 in all_active or prb_pct > 85.0 else 'NORMAL'"
- metric:
    name: network_core.prb_utilization_pct
    value: {var: prb_pct}
    unit: '%'
- metric:
    name: network_core.cells_locked
    value: {var: cells_locked}
    unit: cells
- metric:
    name: network_core.pdu_setup_failures_per_min
    value: {var: pdu_fail}
    unit: failures/min
- metric:
    name: network_core.amf_cpu_pct
    value: {var: amf_cpu_pct}
    unit: '%'
- log:
    level: INFO
    message: 'ran-pm gnb=gNB-FRA-417 cells_enabled={cells_enabled}/2 dl_prb_util={prb_pct}% pdu_setup_fail_last_min={pdu_fail} cm_revision={cm_revision} amf_cpu={amf_cpu_pct}% status={ran_status}'
    attrs:
      operation: ran_pm
      ran.gnb_id: gNB-FRA-417
      ran.prb_utilization_pct: {var: prb_pct}
      ran.cells_locked: {var: cells_locked}
      ran.pdu_setup_failures_per_min: {var: pdu_fail}
      ran.cm_revision: {var: cm_revision}
      ran.status: {var: ran_status}
- sample:
    r5:
      expr: "min(1.0, elapsed.get(5, 0) / 150.0) if 5 in all_active else (max(0.0, 1.0 - since_fix.get(5, 0) / 240.0) if 5 in fixed_channels else 0.0)"
    tau_per_min:
      expr: "int((11000 + 22500 * r5) * (1.0 + rand.gauss(0, 0.015)))"
    mme_cpu_pct:
      expr: "round(min(99.0, 42.0 + 53.0 * r5 + rand.gauss(0, 1.0)), 1)"
    attach_per_min:
      expr: "int(900 * (1.0 + rand.gauss(0, 0.03)))"
    nas_queue:
      expr: "max(0, int(60 + 4700 * max(0.0, (mme_cpu_pct - 80.0) / 17.0) + rand.gauss(0, 10)))"
    t3412_min:
      expr: "12 if 5 in all_active else 54"
    mme_status:
      expr: "'ANOMALY' if 5 in all_active or mme_cpu_pct > 85.0 else 'NORMAL'"
- metric:
    name: network_core.tau_per_min
    value: {var: tau_per_min}
    unit: procedures/min
- metric:
    name: network_core.mme_cpu_pct
    value: {var: mme_cpu_pct}
    unit: '%'
- metric:
    name: network_core.attach_per_min
    value: {var: attach_per_min}
    unit: procedures/min
- metric:
    name: network_core.nas_queue_depth
    value: {var: nas_queue}
    unit: messages
- log:
    level: INFO
    message: 'mme-fra-01 pm: pool=mme-pool-eu-central cpu={mme_cpu_pct}% tau_per_min={tau_per_min} attach_per_min={attach_per_min} nas_queue={nas_queue} t3412={t3412_min}min status={mme_status}'
    attrs:
      operation: mme_pm
      mme.pool: mme-pool-eu-central
      mme.cpu_pct: {var: mme_cpu_pct}
      mme.tau_per_min: {var: tau_per_min}
      mme.t3412_min: {var: t3412_min}
      mme.status: {var: mme_status}
- sample:
    fill6:
      expr: "min(1.0, elapsed.get(6, 0) / 90.0) if 6 in all_active else 0.0"
    r6:
      expr: "min(1.0, max(0.0, elapsed.get(6, 0) - 90.0) / 10.0) if 6 in all_active else 0.0"
    pool_util_pct:
      expr: "round(100.0 * fill6, 1) if 6 in all_active else round(61.0 + (1.5 * max(0.0, 1.0 - since_fix.get(6, 0) / 120.0) if 6 in fixed_channels else 0.0) + rand.gauss(0, 0.3), 1)"
    rejects_per_min:
      expr: "max(0, int(1200.0 * r6 + rand.gauss(0, 60.0 * r6)))"
    tunnels_active:
      expr: "int((160000 - 20000 * min(1.0, elapsed.get(6, 0) / 600.0) if 6 in all_active else (160000 - 12000 * max(0.0, 1.0 - since_fix.get(6, 0) / 120.0) if 6 in fixed_channels else 160000)) * (1.0 + rand.gauss(0, 0.004)))"
    active_bearers:
      expr: "int(tunnels_active * 1.18)"
    ue_pool_cidr:
      expr: "'100.64.0.0/20' if 6 in all_active else '100.64.0.0/14'"
    pool_free:
      expr: "int(4094 * (1.0 - fill6)) if 6 in all_active else int(262142 * (1.0 - pool_util_pct / 100.0))"
    pgw_status:
      expr: "'ANOMALY' if 6 in all_active else 'NORMAL'"
- metric:
    name: network_core.ue_ip_pool_utilization_pct
    value: {var: pool_util_pct}
    unit: '%'
- metric:
    name: network_core.create_session_rejects_per_min
    value: {var: rejects_per_min}
    unit: rejects/min
- metric:
    name: network_core.gtp_tunnels_active
    value: {var: tunnels_active}
    unit: tunnels
- metric:
    name: network_core.active_bearers
    value: {var: active_bearers}
    unit: bearers
- log:
    level: INFO
    message: 'pgw-fra-02 pm: apn=internet.meridian.eu pool=meridian-internet-v4 range={ue_pool_cidr} utilization={pool_util_pct}% free={pool_free} create_session_rejects_last_min={rejects_per_min} gtp_tunnels={tunnels_active} status={pgw_status}'
    attrs:
      operation: pgw_pm
      pgw.ue_pool: meridian-internet-v4
      pgw.ue_pool_cidr: {var: ue_pool_cidr}
      pgw.ue_pool_utilization_pct: {var: pool_util_pct}
      pgw.create_session_rejects_per_min: {var: rejects_per_min}
      pgw.gtp_tunnels_active: {var: tunnels_active}
      pgw.status: {var: pgw_status}

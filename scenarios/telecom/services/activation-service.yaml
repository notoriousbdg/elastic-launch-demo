service: activation-service
sort_order: 2
cloud_provider: aws
cloud_region: eu-central-1
cloud_platform: aws_ec2
cloud_availability_zone: eu-central-1b
subsystem: activation
language: java
entry_endpoints:
- - /api/v1/activation/status
  - GET
topology:
- - provisioning-service
  - /api/v1/provision
  - POST
- - auth-service
  - /api/v1/auth/token
  - POST
- - notification-service
  - /api/v1/notify/activation
  - POST
emit_fault_logs: true
kpi_emitter: false
state:
  _activation_count:
    init: 0
  _last_summary:
    init: now
steps:
- sample:
    activation_type:
      choice:
      - new_sim
      - sim_swap
      - plan_upgrade
      - 5g_activation
      - esim_activation
    segment:
      choice:
      - Consumer
      - Enterprise
      - MVNO
- counter:
    state_key: _activation_count
    by: 1
- log:
    level: INFO
    message: '[ACTIVATE] activation_request type={activation_type} segment={segment} step=4/6 status=IN_PROGRESS'
    attrs:
      operation: activation_request
      activation.type:
        var: activation_type
      activation.segment:
        var: segment
      activation.step: 4/6
- sample:
    active_workflows:
      randint:
      - 20
      - 100
- log:
    level: INFO
    message: '[ACTIVATE] workflow_health active_workflows={active_workflows} avg_duration_ms=1200 retry_rate=0.5% status=NORMAL'
    attrs:
      operation: workflow_health
      workflow.active:
        var: active_workflows
      workflow.avg_duration_ms: 1200
- every:
    seconds: 10
    state_key: _last_summary
    steps:
    - log:
        level: INFO
        message: '[ACTIVATE] activation_summary total={_activation_count} success_rate=99.2% avg_latency_ms=1200 status=NORMAL'
        attrs:
          operation: activation_summary
          activation.total:
            var: _activation_count
          activation.success_rate: 99.2
- sample:
    workflow_latency_ms:
      if_active:
        uniform:
        - 5000.0
        - 30000.0
        round: 1
      else:
        uniform:
        - 200.0
        - 2000.0
        round: 1
- metric:
    name: activation_service.workflow_latency_ms
    value:
      var: workflow_latency_ms
    unit: ms
- metric:
    name: activation_service.active_workflows
    value:
      randint:
      - 20
      - 100
    unit: workflows
- metric:
    name: activation_service.success_rate
    value:
      uniform:
      - 98.0
      - 99.9
      round: 2
    unit: '%'

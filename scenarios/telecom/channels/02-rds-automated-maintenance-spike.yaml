name: Subscriber DB Parameter Group Reset
subsystem: database
vehicle_section: subscriber_data
error_type: canceling statement due to statement timeout
sensor_type: db_latency
affected_services:
- subscriber-db
- provisioning-service
cascade_services:
- activation-service
- bss-billing
description: subscriber-db came back from its maintenance-window reboot on the default parameter group and the planner switched account lookups to sequential scans
investigation_notes: |-
  Root cause: a Terraform apply about 25 minutes before the incident dropped the custom parameter group from meridian-subscriber-db (module upgrade, ModifyDBInstance dBParameterGroupName=default.postgres15, applyImmediately=false). Associating a parameter group needs a reboot, so the change stayed pending until the maintenance-window reboot at the start of the incident (about 25 seconds of downtime). default.postgres15 sets random_page_cost=4 (meridian-pg15-subscriber uses 1.1 for gp3) and work_mem=4MB (64MB), so the planner now reads subscriber_profiles (45M rows) with sequential scans for account_id lookups. p99 query latency is {db_p99_ms} ms, every lookup hits the 5 s statement_timeout, and CPU sits at {db_cpu_pct}%.
  Confirm:
    - the RDS event "Finished applying modification to DB parameter group" / "DB instance restarted" comes before the first "canceling statement due to statement timeout", and the CloudTrail ModifyDBInstance record shows dBParameterGroupName=default.postgres15
    - subscriber-db status lines carry attributes.db.parameter_group default.postgres15 from the reboot on (meridian-pg15-subscriber before it, while the change was pending)
    - metric subscriber_db.seq_scans_per_s jumps from about 2 to {seq_scans_per_s} and subscriber_db.query_latency_p99_ms from about 20 ms to {db_p99_ms} ms, while subscriber_db.connections stays near its normal 180, which rules out a connection storm
  Remediation: put the custom parameter group back and reboot to apply it: opsctl patch db-instance/meridian-subscriber-db --db-parameter-group meridian-pg15-subscriber, then opsctl restart db-instance/meridian-subscriber-db. The reboot takes about 25 seconds; after it, p99 latency starts around 150 ms while the buffer cache warms up and falls back to about 20 ms within roughly 2 minutes. Cancelling queries or adding read replicas does not help, because every replica would use the same plan.
remediation_action: restore_subscriber_db_parameter_group
error_message: 'org.postgresql.util.PSQLException: ERROR: canceling statement due to statement timeout (statement_timeout=5000ms, query=SubscriberRepository.findByAccountId, db=meridian-subscriber-db)'
stack_trace: |-
  org.postgresql.util.PSQLException: ERROR: canceling statement due to statement timeout
  	at org.postgresql.core.v3.QueryExecutorImpl.receiveErrorResponse(QueryExecutorImpl.java:2713)
  	at org.postgresql.core.v3.QueryExecutorImpl.processResults(QueryExecutorImpl.java:2401)
  	at org.postgresql.core.v3.QueryExecutorImpl.execute(QueryExecutorImpl.java:368)
  	at org.postgresql.jdbc.PgStatement.executeInternal(PgStatement.java:498)
  	at org.postgresql.jdbc.PgPreparedStatement.executeQuery(PgPreparedStatement.java:134)
  	at com.zaxxer.hikari.pool.HikariProxyPreparedStatement.executeQuery(HikariProxyPreparedStatement.java)
  	at eu.meridian.provisioning.subscriber.SubscriberRepository.findByAccountId(SubscriberRepository.java:57)
  	at eu.meridian.provisioning.api.ProvisionController.provision(ProvisionController.java:54)
correlation_attr:
  key: db.parameter_group
  value: default.postgres15
fault_params:
  db_p99_ms: {randint: [4600, 5000]}
  db_cpu_pct: {uniform: [88.0, 97.0], round: 1}
  seq_scans_per_s: {randint: [120, 180]}
  scan_ms: {uniform: [5000.1, 5000.9], round: 3}
rca_clues:
  subscriber-db:
    db.parameter_group: default.postgres15
    db.random_page_cost: 4
    db.seq_scans_per_s: {randint: [120, 180]}
    db.cpu_utilization_pct: {uniform: [88.0, 97.0], round: 1}
  provisioning-service:
    db.statement_timeout_ms: 5000
    db.query: SubscriberRepository.findByAccountId
  activation-service:
    upstream.degraded_subsystem: provisioning
  bss-billing:
    upstream.degraded_subsystem: subscriber-db
    billing.account_lookup_p99_ms: {randint: [4600, 5000]}
remediation_command: |-
  opsctl patch db-instance/meridian-subscriber-db --db-parameter-group meridian-pg15-subscriber
  opsctl restart db-instance/meridian-subscriber-db
fault_scope:
  workloads: [subscriber-db]
error_services: [provisioning-service]
cascade_messages:
  subscriber-db:
    - severity: ERROR
      message: '{iso_now}:10.42.7.31(52210):provisioning@subscribers:[51877]:ERROR:  canceling statement due to statement timeout'
    - severity: INFO
      message: '{iso_now}:10.42.7.31(52210):provisioning@subscribers:[51877]:STATEMENT:  SELECT msisdn, account_id, plan_code, data_quota_gb, voice_quota_min FROM subscriber_profiles WHERE account_id = $1'
  activation-service:
    - severity: WARN
      message: 'POST http://provisioning-service/api/v1/provision took {scan_ms} ms (p99 budget 2000 ms); activation step provision_sim retried'
  bss-billing:
    - severity: WARN
      message: 'account lookup on subscriber-db exceeded 5000 ms for account batch; invoice run paused (retry in 60s)'
infrastructure_events:
  - service: subscriber-db
    severity: INFO
    offset_seconds: -1500
    event_name: aws.cloudtrail.ModifyDBInstance
    body: 'cloudtrail: eventSource=rds.amazonaws.com eventName=ModifyDBInstance userIdentity=assumed-role/meridian-terraform-ci/atlantis requestParameters.dBInstanceIdentifier=meridian-subscriber-db requestParameters.dBParameterGroupName=default.postgres15 requestParameters.applyImmediately=false errorCode=none'
    attributes:
      cloud.provider: aws
      aws.cloudtrail.event_source: rds.amazonaws.com
      aws.cloudtrail.event_name: ModifyDBInstance
      user.name: assumed-role/meridian-terraform-ci/atlantis
      db.pending_parameter_group: default.postgres15
  - service: subscriber-db
    severity: INFO
    offset_seconds: -5
    event_name: aws.rds.event
    body: 'rds-event: source=meridian-subscriber-db category=availability message="DB instance shutdown" event_id=RDS-EVENT-0004 reason=maintenance-window'
    attributes:
      aws.rds.instance: meridian-subscriber-db
      operation: rds_event
  - service: subscriber-db
    severity: INFO
    offset_seconds: 25
    event_name: aws.rds.event
    body: 'rds-event: source=meridian-subscriber-db category=configuration change message="Finished applying modification to DB parameter group" parameter_group=default.postgres15 status=in-sync'
    attributes:
      aws.rds.instance: meridian-subscriber-db
      db.parameter_group: default.postgres15
      operation: rds_event
  - service: subscriber-db
    severity: INFO
    offset_seconds: 25
    event_name: aws.rds.event
    body: 'rds-event: source=meridian-subscriber-db category=availability message="DB instance restarted" event_id=RDS-EVENT-0006 reason=maintenance-window'
    attributes:
      aws.rds.instance: meridian-subscriber-db
      operation: rds_event
remediation_effects:
  log_taper_seconds: 30
  log_events:
    - service: subscriber-db
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=rds.amazonaws.com eventName=ModifyDBInstance userIdentity={actor} requestParameters.dBInstanceIdentifier=meridian-subscriber-db requestParameters.dBParameterGroupName=meridian-pg15-subscriber requestParameters.applyImmediately=true errorCode=none'
      attributes:
        cloud.provider: aws
        aws.cloudtrail.event_name: ModifyDBInstance
        db.parameter_group: meridian-pg15-subscriber
    - service: subscriber-db
      severity: INFO
      offset_seconds: 3
      body: 'cloudtrail: eventSource=rds.amazonaws.com eventName=RebootDBInstance userIdentity={actor} requestParameters.dBInstanceIdentifier=meridian-subscriber-db errorCode=none'
      attributes:
        cloud.provider: aws
        aws.cloudtrail.event_name: RebootDBInstance
    - service: subscriber-db
      severity: INFO
      offset_seconds: 28
      body: 'rds-event: source=meridian-subscriber-db category=availability message="DB instance restarted" event_id=RDS-EVENT-0006 parameter_group=meridian-pg15-subscriber status=in-sync'
      attributes:
        aws.rds.instance: meridian-subscriber-db
        db.parameter_group: meridian-pg15-subscriber
        operation: rds_event
  steady_attributes:
    subscriber-db:
      db.parameter_group: meridian-pg15-subscriber
  verification:
    - signal: subscriber_db.query_latency_p99_ms
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "subscriber-db"'
      field: 'metrics.subscriber_db.query_latency_p99_ms'
      expect: 'under 50 ms after cache warm-up (was 4,600-5,000 ms)'
      within_seconds: 180
    - signal: subscriber_db.seq_scans_per_s
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "subscriber-db"'
      field: 'metrics.subscriber_db.seq_scans_per_s'
      expect: 'back near 2 (was 120-180)'
      within_seconds: 90
    - signal: statement timeout lines
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "provisioning-service" AND body.text LIKE "*canceling statement due to statement timeout*"'
      expect: '0 new lines after the reboot'
      within_seconds: 90
    - signal: subscriber-db parameter group
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "subscriber-db"'
      field: 'attributes.db.parameter_group'
      expect: 'meridian-pg15-subscriber on every status line since the reboot'
      within_seconds: 90
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [141.36, 162.64]}
  - kpi: business.revenue_usd_per_min
    factor: {uniform: [0.2, 0.5]}
  - kpi: business.esim_provisions_per_min
    value: {uniform: [120.9, 139.1]}
  - kpi: business.support_tickets_per_min
    factor: {uniform: [2.5, 5.0]}
generator_impact:
  aws_rds_otel:
    read_latency_high: 2.0
    write_latency_high: 2.0
    cpu_utilization_high: 90.0
generator_hold_seconds:
  aws_rds_otel: 90
onset_delay_seconds: 25
service_lag_seconds: {provisioning-service: 5, activation-service: 15, bss-billing: 30}

name: Push Notification Backpressure
subsystem: notifications
vehicle_section: push_channel
error_type: Quota exceeded for quota metric
sensor_type: push_delivery
affected_services:
- notification-service
- activation-service
cascade_services:
- provisioning-service
description: a consumer quota override capped Firebase Cloud Messaging sends at 500 per minute and push notifications back up
investigation_notes: |-
  Root cause: a consumer quota override on the GCP project meridian-project about a minute before the first error (the time it took to propagate) capped fcm.googleapis.com send requests at 500 per minute (override created after a load test in the wrong project; the default limit is 600,000 per minute). notification-service sends about 2,400 push messages per minute at this hour, so FCM answers the rest with 429 RESOURCE_EXHAUSTED ({push_429_per_min}/min) and the push queue grows by about 1,900 per minute. App users miss activation confirmations and eSIM download prompts. SMS, email and webhooks are normal, and FCM itself is healthy (Firebase status).
  Confirm:
    - the gcp-audit record CreateConsumerOverride for fcm.googleapis.com (overrideValue 500) comes before the first "Quota exceeded for quota metric", and push status lines carry attributes.fcm.quota_per_min 500
    - metric notification_service.push_429_per_min rises from 0 to about {push_429_per_min} and notification_service.push_delivered_per_min is pinned near 500 (normally about 2,400)
    - metric notification_service.push_queue_depth grows steadily while notification_service.sms_delivered_per_min stays normal, which rules out a notification-service capacity problem
  Remediation: delete the override with opsctl delete quota-override/fcm-send-per-minute. Quota changes take up to about a minute to apply; then 429s stop and the queue drains at FCM's normal rate within a few minutes. Throttling push on Meridian's side would only slow the backlog further.
remediation_action: delete_fcm_quota_override
error_message: 'push send failed: 429 RESOURCE_EXHAUSTED Quota exceeded for quota metric ''Send requests'' and limit ''Send requests per minute'' of service ''fcm.googleapis.com'' for consumer ''project_number:481516234211''. template={push_template} queue_depth={push_queue}'
stack_trace: |-
  Traceback (most recent call last):
    File "/app/notify/push/fcm.py", line 71, in send
      response = await self._session.post(FCM_SEND_URL, json=payload)
    File "/app/notify/push/fcm.py", line 79, in send
      raise FcmQuotaExceeded(response.status, body["error"]["message"])
  notify.push.errors.FcmQuotaExceeded: 429 RESOURCE_EXHAUSTED Quota exceeded for quota metric 'Send requests' and limit 'Send requests per minute' of service 'fcm.googleapis.com'
correlation_attr:
  key: fcm.quota_per_min
  value: '500'
fault_params:
  push_template: {choice: [activation_confirm, esim_download_ready, plan_change]}
  push_queue: {randint: [2000, 19000]}
  push_429_per_min: {randint: [1700, 2100]}
  esim_wait_min: {randint: [5, 20]}
rca_clues:
  notification-service:
    fcm.quota_per_min: 500
    fcm.push_429_per_min: {randint: [1700, 2100]}
    fcm.push_queue_depth: {randint: [2000, 19000]}
  activation-service:
    activation.confirmation_push_pending: {randint: [400, 1500]}
  provisioning-service:
    provisioning.esim_download_prompt_wait_min: {randint: [5, 20]}
remediation_command: |-
  opsctl delete quota-override/fcm-send-per-minute
fault_scope:
  cluster: meridian-gke-cluster
  workloads: [notification-service]
error_services: [notification-service]
cascade_messages:
  activation-service:
    - severity: WARN
      message: 'activation_confirm push still queued at notification-service; customer app shows "activation in progress"'
  provisioning-service:
    - severity: INFO
      message: 'eSIM profile ready but download prompt not delivered after {esim_wait_min} min (push queued); SM-DP+ reservation kept'
infrastructure_events:
  - service: notification-service
    severity: INFO
    offset_seconds: -60
    event_name: gcp.audit.CreateConsumerOverride
    body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=serviceusage.googleapis.com methodName=google.api.serviceusage.v1beta1.ServiceUsage.CreateConsumerOverride resourceName=projects/meridian-project/services/fcm.googleapis.com/consumerQuotaMetrics/send-requests/limits/per-minute/consumerOverrides/fcm-send-per-minute principalEmail=loadtest-runner@meridian-project.iam.gserviceaccount.com status=OK overrideValue=500'
    attributes:
      cloud.provider: gcp
      gcp.audit.method_name: google.api.serviceusage.v1beta1.ServiceUsage.CreateConsumerOverride
      user.name: loadtest-runner@meridian-project.iam.gserviceaccount.com
      fcm.quota_per_min: 500
remediation_effects:
  log_taper_seconds: 45
  log_events:
    - service: notification-service
      severity: INFO
      offset_seconds: 1
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=serviceusage.googleapis.com methodName=google.api.serviceusage.v1beta1.ServiceUsage.DeleteConsumerOverride resourceName=projects/meridian-project/services/fcm.googleapis.com/consumerQuotaMetrics/send-requests/limits/per-minute/consumerOverrides/fcm-send-per-minute principalEmail={actor} status=OK'
      attributes:
        cloud.provider: gcp
        gcp.audit.method_name: google.api.serviceusage.v1beta1.ServiceUsage.DeleteConsumerOverride
  steady_attributes:
    notification-service:
      fcm.quota_per_min: 600000
  verification:
    - signal: notification_service.push_429_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'metrics.notification_service.push_429_per_min'
      expect: '0 (was 1,700-2,100)'
      within_seconds: 120
    - signal: notification_service.push_queue_depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'metrics.notification_service.push_queue_depth'
      expect: 'falling quickly, back under 100'
      within_seconds: 240
    - signal: quota exceeded lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*Quota exceeded for quota metric*"'
      expect: '0 new lines once the quota change has applied'
      within_seconds: 120
    - signal: FCM quota
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'attributes.fcm.quota_per_min'
      expect: '600000 on every push status line since the override was deleted'
      within_seconds: 120
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [230.87, 265.63]}
  - kpi: business.esim_provisions_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.support_tickets_per_min
    factor: {uniform: [2.0, 4.0]}
  - kpi: business.nps
    factor: {uniform: [0.35, 0.65]}
service_lag_seconds: {activation-service: 30, provisioning-service: 60}

name: 5G Bearer Allocation Timeout
subsystem: network
vehicle_section: radio_access
error_type: radio-resources-not-available
sensor_type: bearer_allocation
affected_services:
- network-core
- provisioning-service
cascade_services:
- activation-service
- api-gateway
description: a configuration management push locked one of the two n78 carriers on gNB-FRA-417 and the remaining carrier ran out of radio resources
investigation_notes: |-
  Root cause: an OSS configuration change (CR-88214, batch energy-saving-pilot-fra) applied seconds before the first error set NRCellDU FRA417-n78-1 on gNB-FRA-417 to administrativeState LOCKED. The pilot was meant for night-time hours only. All traffic in the sector moved to FRA417-n78-2, whose PRB utilisation is now {prb_pct}%, and the gNB rejects new PDU session resource setups with cause radioNetwork:radio-resources-not-available. Neighbouring gNBs (FRA-416, FRA-418), the AMF and the UPF are normal; this is one site, not the core.
  Confirm:
    - the network-core line "CM change CR-88214 applied to gNB-FRA-417 ... UNLOCKED -> LOCKED" comes before the first radio-resources-not-available, and RAN status lines carry attributes.ran.cm_revision cm-fra417-r212 (previous cm-fra417-r211)
    - metric network_core.prb_utilization_pct (gNB-FRA-417) rises from about 55% to {prb_pct}% and network_core.cells_locked goes from 0 to 1
    - metric network_core.pdu_setup_failures_per_min rises from about 3 to {pdu_fail_per_min}, while network_core.amf_cpu_pct stays near 35%, which rules out a core-side capacity problem
  Remediation: revert the gNB configuration with opsctl rollback config/gnb-fra-417 --to-revision previous. The cell unlocks and starts broadcasting within about 40 seconds; load balancing then moves UEs back and PRB utilisation falls under 70% within about 90 seconds. Restarting the AMF or the gNB would drop every session on the site without unlocking the cell.
remediation_action: unlock_gnb_cell
error_message: 'ngap: PDUSessionResourceSetupResponse unsuccessful gnb=gNB-FRA-417 cell=FRA417-n78-2 cause=radioNetwork:radio-resources-not-available prb_util={prb_pct}% failed_last_min={pdu_fail_per_min}'
stack_trace: |-
  NGAP PDUSessionResourceSetupResponse
    AMF-UE-NGAP-ID: 88120417
    RAN-UE-NGAP-ID: 4171092
    PDUSessionResourceFailedToSetupListSURes:
      pDUSessionID: 1
      pDUSessionResourceSetupUnsuccessfulTransfer:
        cause: radioNetwork (0) radio-resources-not-available (27)
  gNB-FRA-417 cell FRA417-n78-2 dl_prb_util={prb_pct}%
  gNB-FRA-417 cell FRA417-n78-1 administrativeState=LOCKED operationalState=DISABLED
correlation_attr:
  key: ran.cm_revision
  value: cm-fra417-r212
fault_params:
  prb_pct: {uniform: [95.5, 99.5], round: 1}
  pdu_fail_per_min: {randint: [180, 320]}
rca_clues:
  network-core:
    ran.gnb_id: gNB-FRA-417
    ran.locked_cell: FRA417-n78-1
    ran.cm_revision: cm-fra417-r212
    ran.prb_utilization_pct: {uniform: [95.5, 99.5], round: 1}
  provisioning-service:
    upstream.degraded_subsystem: network
    provisioning.bearer_setup_failures: {randint: [20, 60]}
  activation-service:
    upstream.degraded_subsystem: provisioning
  api-gateway:
    upstream.degraded_subsystem: activation
remediation_command: |-
  opsctl rollback config/gnb-fra-417 --to-revision previous
fault_scope:
  cluster: meridian-gke-cluster
  workloads: [network-core]
error_services: [network-core]
cascade_messages:
  provisioning-service:
    - severity: WARN
      message: 'network allocate for new subscriber returned BEARER_SETUP_FAILED (gnb=gNB-FRA-417); activation step data_test rescheduled in 30s'
  activation-service:
    - severity: WARN
      message: 'activation workflow stalled at data_test: bearer setup rejected by RAN; 3 retries left'
  api-gateway:
    - severity: WARN
      message: 'POST /api/v1/activate completed with status=pending_network for 12% of requests in the last minute'
infrastructure_events:
  - service: network-core
    severity: INFO
    offset_seconds: -10
    event_name: oss.cm.change
    body: 'oss-cm: CM change CR-88214 applied to gNB-FRA-417 revision cm-fra417-r212 (was cm-fra417-r211): NRCellDU=FRA417-n78-1 administrativeState UNLOCKED -> LOCKED; batch=energy-saving-pilot-fra user=son-energy-saver'
    attributes:
      operation: cm_change
      user.name: son-energy-saver
      change.request: CR-88214
      ran.cm_revision: cm-fra417-r212
      change.summary: 'FRA417-n78-1 administrativeState UNLOCKED -> LOCKED'
remediation_effects:
  log_taper_seconds: 40
  log_events:
    - service: network-core
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl rollback config/gnb-fra-417 --to-revision previous actor={actor}: revision cm-fra417-r212 -> cm-fra417-r211'
      attributes:
        operation: change_executed
        change.target: config/gnb-fra-417
        ran.cm_revision: cm-fra417-r211
    - service: network-core
      severity: INFO
      offset_seconds: 40
      body: 'oss-fm: alarm cleared gNB-FRA-417 NRCellDU=FRA417-n78-1 "Cell administratively locked"; administrativeState=UNLOCKED operationalState=ENABLED'
      attributes:
        operation: alarm_clear
        ran.cm_revision: cm-fra417-r211
  steady_attributes:
    network-core:
      ran.cm_revision: cm-fra417-r211
  verification:
    - signal: network_core.prb_utilization_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "network-core"'
      field: 'metrics.network_core.prb_utilization_pct'
      expect: 'under 70% (was 95-99%)'
      within_seconds: 150
    - signal: network_core.cells_locked
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "network-core"'
      field: 'metrics.network_core.cells_locked'
      expect: '0 (was 1)'
      within_seconds: 90
    - signal: radio-resources-not-available lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*radio-resources-not-available*"'
      expect: '0 new lines'
      within_seconds: 90
    - signal: gNB-FRA-417 configuration revision
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "network-core"'
      field: 'attributes.ran.cm_revision'
      expect: 'cm-fra417-r211 on every RAN status line since the rollback'
      within_seconds: 90
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [230.87, 265.63]}
  - kpi: business.data_session_success_pct
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.ran_latency_p95_ms
    factor: {uniform: [2.5, 5.0]}
  - kpi: business.throughput_p50_mbps
    value: {uniform: [33.11, 38.09], round: 1}
service_lag_seconds: {provisioning-service: 10, activation-service: 20, api-gateway: 30}

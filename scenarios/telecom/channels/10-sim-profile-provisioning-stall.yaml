name: SIM Profile Provisioning Stall
subsystem: provisioning
vehicle_section: sim_management
error_type: HLR registration timed out after
sensor_type: sim_provisioning
affected_services:
- provisioning-service
cascade_services:
- activation-service
- notification-service
description: the HLR front-end connector was reconfigured to a single session and SIM registrations queue up behind it
investigation_notes: |-
  Root cause: a connector configuration change about 30 seconds before the first timeout (CR-88240, copied from the lab profile) set max-sessions on connector hlr-fe-fra from 16 to 1. provisioning-service sends every SIM registration (IMSI/Ki binding, service profile) through this connector, so registrations are now processed one at a time: about 40 per minute against the roughly 200 per minute that arrive. The HLR queue grows by about 160 per minute ({hlr_queue} now) and requests that wait longer than 30 s time out. The HLR front end itself responds normally (per-request latency about 1.4 s), and the subscriber database is not involved.
  Confirm:
    - the provisioning-service line "connector hlr-fe-fra reconfigured ... max-sessions 16 -> 1" comes before the first "HLR registration timed out after", and HLR status lines carry attributes.hlr.max_sessions 1
    - metric provisioning_service.hlr_queue_depth grows steadily from about 20 and provisioning_service.hlr_sessions_in_use is pinned at 1 (normally 5-8 of 16)
    - metric provisioning_service.hlr_request_latency_ms stays near 1,400 ms, which rules out a slow HLR
  Remediation: restore the session limit with opsctl patch connector/hlr-fe-fra --max-sessions 16. The connector opens the extra sessions within a few seconds; throughput goes back to about 650 per minute, so the backlog drains at roughly 450 per minute and new registrations stop timing out at once. Restarting provisioning-service would drop the queued registrations.
remediation_action: restore_hlr_connector_sessions
error_message: 'HLR registration timed out after 30000 ms imsi=26203{imsi_suffix} connector=hlr-fe-fra sessions={hlr_sessions}/{hlr_sessions} queue_depth={hlr_queue} op=INSERT_SUBSCRIBER'
stack_trace: |-
  eu.meridian.provisioning.hlr.HlrTimeoutException: HLR registration timed out after 30000 ms (connector=hlr-fe-fra, sessions={hlr_sessions}/{hlr_sessions}, queue_depth={hlr_queue})
  	at eu.meridian.provisioning.hlr.HlrConnector.await(HlrConnector.java:211)
  	at eu.meridian.provisioning.hlr.HlrConnector.insertSubscriber(HlrConnector.java:118)
  	at eu.meridian.provisioning.sim.SimRegistrationService.register(SimRegistrationService.java:74)
  	at eu.meridian.provisioning.api.ProvisionController.provision(ProvisionController.java:66)
correlation_attr:
  key: hlr.max_sessions
  value: '1'
fault_params:
  imsi_suffix: {randint: [1000000000, 1999999999]}
  hlr_sessions: 1
  hlr_queue: {randint: [100, 1700]}
  welcome_sms_wait_s: {randint: [300, 1500]}
rca_clues:
  provisioning-service:
    hlr.connector: hlr-fe-fra
    hlr.max_sessions: 1
    hlr.queue_depth: {randint: [100, 1700]}
    hlr.request_latency_ms: {randint: [1200, 1600]}
  activation-service:
    upstream.degraded_subsystem: provisioning
    activation.pending_sim_registration: {randint: [300, 900]}
  notification-service:
    notification.welcome_sms_wait_s: {randint: [300, 1500]}
remediation_command: |-
  opsctl patch connector/hlr-fe-fra --max-sessions 16
fault_scope:
  cluster: meridian-gke-cluster
  workloads: [provisioning-service]
cascade_messages:
  activation-service:
    - severity: WARN
      message: 'activation workflow waiting on sim_registration for more than 30s; provisioning-service returned 504 (HLR)'
  notification-service:
    - severity: INFO
      message: 'welcome SMS held: SIM not yet registered in HLR (waiting {welcome_sms_wait_s}s)'
infrastructure_events:
  - service: provisioning-service
    severity: INFO
    offset_seconds: -30
    event_name: connector.config_change
    body: 'connector hlr-fe-fra reconfigured by provisioning-ops/s.keller CR-88240: max-sessions 16 -> 1, keepalive 30s, endpoint hlr-fe-fra-01.core.meridian.internal:7766'
    attributes:
      operation: connector_config
      user.name: provisioning-ops/s.keller
      change.request: CR-88240
      hlr.max_sessions: 1
      change.summary: 'hlr-fe-fra max-sessions 16 -> 1'
remediation_effects:
  log_events:
    - service: provisioning-service
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl patch connector/hlr-fe-fra --max-sessions 16 actor={actor}: max-sessions 1 -> 16'
      attributes:
        operation: change_executed
        change.target: connector/hlr-fe-fra
        hlr.max_sessions: 16
    - service: provisioning-service
      severity: INFO
      offset_seconds: 6
      body: 'connector hlr-fe-fra: 16/16 sessions bound to hlr-fe-fra-01.core.meridian.internal:7766'
      attributes:
        operation: connector_config
        hlr.max_sessions: 16
  steady_attributes:
    provisioning-service:
      hlr.max_sessions: 16
  verification:
    - signal: provisioning_service.hlr_queue_depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "provisioning-service"'
      field: 'metrics.provisioning_service.hlr_queue_depth'
      expect: 'falling by about 450 per minute, back under 50'
      within_seconds: 300
    - signal: provisioning_service.hlr_sessions_in_use
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "provisioning-service"'
      field: 'metrics.provisioning_service.hlr_sessions_in_use'
      expect: 'above 1 while the backlog drains (16 of 16), then 5-8'
      within_seconds: 60
    - signal: HLR timeout lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*HLR registration timed out after*"'
      expect: '0 new lines'
      within_seconds: 60
    - signal: HLR connector session limit
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "provisioning-service"'
      field: 'attributes.hlr.max_sessions'
      expect: '16 on every HLR status line since the patch'
      within_seconds: 60
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [141.36, 162.64]}
  - kpi: business.esim_provisions_per_min
    value: {uniform: [74.4, 85.6]}
  - kpi: business.port_ins_per_min
    value: {uniform: [76.73, 88.28]}
  - kpi: business.support_tickets_per_min
    factor: {uniform: [2.0, 4.5]}
service_lag_seconds: {activation-service: 15, notification-service: 45}

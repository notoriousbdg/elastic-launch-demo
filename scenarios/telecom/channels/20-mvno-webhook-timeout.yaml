name: MVNO Webhook Timeout
subsystem: notifications
vehicle_section: partner_integration
error_type: partner callback failed
sensor_type: webhook
affected_services:
- notification-service
- api-gateway
cascade_services:
- bss-billing
description: the webhook client timeout was cut from 15 s to 1.5 s and callbacks to the slower MVNO partner endpoint time out
investigation_notes: |-
  Root cause: a notification-service configuration change about 30 seconds before the first error (config/notification-webhooks revision 19, "reduce worker pile-up") set the partner webhook timeout to 1500 ms instead of 15000 ms. Lycamobile's activation callback endpoint normally answers in 3-6 s (p95 about 4.8 s), so almost every callback to it now times out after 1.5 s and is retried until it gives up ({webhook_fail_per_min}/min). Lebara's endpoint answers in about 300 ms and is unaffected. Lycamobile then polls the activation status API to find out what happened, which raises partner traffic on api-gateway.
  Confirm:
    - the notification-service line "config notification-webhooks reloaded revision 19 ... timeout_ms 15000 -> 1500" comes before the first "partner callback failed", and webhook status lines carry attributes.webhook.timeout_ms 1500
    - metric notification_service.webhook_timeouts_per_min rises from 0 to about {webhook_fail_per_min} and notification_service.webhook_success_pct falls from about 99.6% to under 60%
    - every failure names partner=lycamobile with elapsed_ms at the timeout, while callbacks to lebara succeed, which rules out a notification-service outage
  Remediation: revert the webhook configuration with opsctl rollback config/notification-webhooks --to-revision previous. The client picks up the 15 s timeout within about 10 seconds; callbacks succeed again and Lycamobile's polling falls back to normal within a couple of minutes. A circuit breaker would stop the errors by not sending the callbacks at all.
remediation_action: revert_webhook_timeout
error_message: 'partner callback failed partner=lycamobile url=https://hooks.lycamobile.eu/meridian/activation event=activation.completed status=timeout elapsed_ms={elapsed_ms} timeout_ms=1500 attempt={attempt}/3'
stack_trace: |-
  Traceback (most recent call last):
    File "/app/notify/webhooks/sender.py", line 57, in deliver
      resp = await self._client.post(hook.url, json=event, timeout=hook.timeout)
    File "/usr/local/lib/python3.12/site-packages/httpx/_client.py", line 1859, in post
      return await self.request(
    File "/usr/local/lib/python3.12/site-packages/httpx/_transports/default.py", line 118, in map_httpcore_exceptions
      raise mapped_exc(message) from exc
  httpx.ReadTimeout: timed out (partner=lycamobile elapsed_ms={elapsed_ms} timeout_ms=1500)
correlation_attr:
  key: webhook.timeout_ms
  value: '1500'
fault_params:
  elapsed_ms: {randint: [1500, 1512]}
  attempt: {randint: [1, 3]}
  webhook_fail_per_min: {randint: [90, 160]}
  poll_rps: {uniform: [18.0, 40.0], round: 1}
rca_clues:
  notification-service:
    webhook.partner: lycamobile
    webhook.timeout_ms: 1500
    webhook.timeouts_per_min: {randint: [90, 160]}
  api-gateway:
    gateway.partner_client: lycamobile
    gateway.partner_poll_rps: {uniform: [18.0, 40.0], round: 1}
  bss-billing:
    billing.mvno_settlement_pending: {randint: [200, 900]}
remediation_command: |-
  opsctl rollback config/notification-webhooks --to-revision previous
fault_scope:
  cluster: meridian-gke-cluster
  workloads: [notification-service]
error_services: [notification-service]
cascade_messages:
  api-gateway:
    - severity: WARN
      message: 'partner client lycamobile polling GET /api/v1/customer/status at {poll_rps} req/s (baseline 2 req/s)'
  bss-billing:
    - severity: INFO
      message: 'MVNO settlement: activation records for partner lycamobile waiting for callback acknowledgement; wholesale invoice line held'
infrastructure_events:
  - service: notification-service
    severity: INFO
    offset_seconds: -30
    event_name: config.reload
    body: 'config notification-webhooks reloaded revision 19 (was 18) by notify-ops/j.meyer: partner_webhooks.timeout_ms 15000 -> 1500, max_attempts 3'
    attributes:
      operation: config_reload
      user.name: notify-ops/j.meyer
      webhook.timeout_ms: 1500
      change.summary: 'webhook timeout_ms 15000 -> 1500'
remediation_effects:
  log_taper_seconds: 10
  log_events:
    - service: notification-service
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl rollback config/notification-webhooks --to-revision previous actor={actor}: revision 19 -> 18 (timeout_ms 15000)'
      attributes:
        operation: change_executed
        change.target: config/notification-webhooks
        webhook.timeout_ms: 15000
  steady_attributes:
    notification-service:
      webhook.timeout_ms: 15000
  verification:
    - signal: notification_service.webhook_timeouts_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'metrics.notification_service.webhook_timeouts_per_min'
      expect: '0 (was 90-160)'
      within_seconds: 60
    - signal: notification_service.webhook_success_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'metrics.notification_service.webhook_success_pct'
      expect: 'back above 99% (was under 60%)'
      within_seconds: 90
    - signal: partner callback failed lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*partner callback failed*"'
      expect: '0 new lines'
      within_seconds: 60
    - signal: webhook timeout
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "notification-service"'
      field: 'attributes.webhook.timeout_ms'
      expect: '15000 on every webhook status line since the rollback'
      within_seconds: 60
business_impact:
  - kpi: business.mvno_net_adds_per_min
    value: {uniform: [27.2, 31.3]}
  - kpi: business.mvno_partner_revenue_usd_per_min
    value: {uniform: [1674.0, 1926.0], round: 1}
  - kpi: business.port_ins_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.trouble_to_billing_ratio_pct
    factor: {uniform: [2.5, 5.0]}
service_lag_seconds: {api-gateway: 30, bss-billing: 60}

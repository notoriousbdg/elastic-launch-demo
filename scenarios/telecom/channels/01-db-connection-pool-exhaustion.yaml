name: DB Connection Pool Exhaustion
subsystem: database
vehicle_section: subscriber_data
error_type: Connection is not available, request timed out after
sensor_type: connection_pool
affected_services:
- subscriber-db
- provisioning-service
cascade_services:
- activation-service
- api-gateway
description: provisioning-service HikariCP pools to subscriber-db are exhausted by connections held idle in transaction
investigation_notes: |-
  Root cause: provisioning-service 2.14.0 (Argo CD sync about a minute before the first error, as the new pods took traffic; previous image 2.13.4) moved the synchronous HLR registration call inside the @Transactional SimReservationService.reserveSim() method. Each reservation now holds a row lock on sim_inventory and keeps its connection idle in transaction for the whole HLR round trip (2-8 s). The HikariCP pool (maximumPoolSize {pool_max} per pod, 6 pods) fills with these connections: {pool_active} active, 0 idle, {pending_threads} threads waiting. subscriber-db itself is not saturated: CPU, read latency and the queries that do run are normal, and its connections are mostly idle in transaction rather than active.
  Confirm:
    - provisioning-service status lines carry attributes.deployment.image_tag 2.14.0 and the Argo CD sync line (2.13.4 -> 2.14.0) comes before the first "Connection is not available"
    - metric provisioning_service.hikari_active_connections sits at {pool_max} (normally about 12) and provisioning_service.hikari_pending_threads is in the hundreds (normally 0)
    - metric subscriber_db.idle_in_transaction_sessions climbs from about 3 to about 280, and subscriber-db logs "still waiting for ShareLock on transaction" on sim_inventory; subscriber_db.cpu_utilization_pct stays near 30%, which rules out an overloaded database
  Remediation: roll provisioning-service back to 2.13.4 with opsctl rollback deployment/provisioning-service --to-revision previous. The rolling update replaces one pod at a time (about 60 seconds for 6 pods); each new pod starts with an empty pool, so pending threads drop pod by pod and idle-in-transaction sessions fall back to single digits. Restarting subscriber-db or raising maximumPoolSize would only add more connections stuck in the same transactions.
remediation_action: rollback_provisioning_service
error_message: 'HikariPool-1 - Connection is not available, request timed out after 30000ms (total={pool_max}, active={pool_active}, idle=0, waiting={pending_threads})'
stack_trace: |-
  java.sql.SQLTransientConnectionException: HikariPool-1 - Connection is not available, request timed out after 30000ms (total={pool_max}, active={pool_active}, idle=0, waiting={pending_threads})
  	at com.zaxxer.hikari.pool.HikariPool.createTimeoutException(HikariPool.java:686)
  	at com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:179)
  	at com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:144)
  	at com.zaxxer.hikari.HikariDataSource.getConnection(HikariDataSource.java:127)
  	at org.springframework.jdbc.datasource.DataSourceTransactionManager.doBegin(DataSourceTransactionManager.java:265)
  	at org.springframework.transaction.support.AbstractPlatformTransactionManager.startTransaction(AbstractPlatformTransactionManager.java:400)
  	at eu.meridian.provisioning.sim.SimReservationService.reserveSim(SimReservationService.java:88)
  	at eu.meridian.provisioning.api.ProvisionController.provision(ProvisionController.java:61)
correlation_attr:
  key: deployment.image_tag
  value: provisioning-service:2.14.0
fault_params:
  pool_active: 50
  pool_max: 50
  pending_threads: {randint: [140, 220]}
  idle_in_tx: {randint: [260, 300]}
  lock_wait_ms: {uniform: [1000.0, 7800.0], round: 3}
  upstream_ms: {randint: [30005, 30090]}
rca_clues:
  provisioning-service:
    deployment.image_tag: provisioning-service:2.14.0
    hikari.active_connections: 50
    hikari.pending_threads: {randint: [140, 220]}
    hikari.connection_timeout_ms: 30000
  subscriber-db:
    db.idle_in_transaction_sessions: {randint: [260, 300]}
    db.lock_wait_relation: sim_inventory
    db.lock_waits: {randint: [60, 120]}
  activation-service:
    upstream.degraded_subsystem: provisioning
    upstream.status_code: 503
  api-gateway:
    upstream.degraded_subsystem: activation
    gateway.5xx_rate: {uniform: [0.12, 0.45], round: 2}
remediation_command: |-
  opsctl rollback deployment/provisioning-service --to-revision previous
fault_scope:
  cluster: meridian-gke-cluster
  workloads: [provisioning-service]
error_services: [provisioning-service]
cascade_messages:
  subscriber-db:
    - severity: WARN
      message: '{iso_now}:10.42.7.19(51834):provisioning@subscribers:[48211]:LOG:  process 48211 still waiting for ShareLock on transaction 918273641 after {lock_wait_ms} ms'
    - severity: WARN
      message: '{iso_now}:10.42.7.22(40418):provisioning@subscribers:[48377]:DETAIL:  Process holding the lock: 47102. Wait queue: 48377. CONTEXT: while locking tuple (11742,9) in relation "sim_inventory"'
  activation-service:
    - severity: ERROR
      message: 'POST http://provisioning-service/api/v1/provision failed: 503 Service Unavailable after {upstream_ms} ms; activation workflow moved to retry queue'
  api-gateway:
    - severity: WARN
      message: 'upstream activation-service returned 503 for POST /api/v1/activate in {upstream_ms}ms'
infrastructure_events:
  - service: provisioning-service
    severity: INFO
    offset_seconds: -60
    event_name: argocd.app.sync
    body: 'argocd-application-controller: Sync operation to 4f1c9a2 succeeded; app=provisioning-service namespace=meridian image provisioning-service:2.13.4 -> provisioning-service:2.14.0 initiatedBy=argocd-image-updater'
    attributes:
      operation: deployment_sync
      user.name: argocd-image-updater
      deployment.image_tag: provisioning-service:2.14.0
      change.summary: 'provisioning-service image 2.13.4 -> 2.14.0'
remediation_effects:
  log_taper_seconds: 60
  log_events:
    - service: provisioning-service
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl rollback deployment/provisioning-service --to-revision previous actor={actor}: image provisioning-service:2.14.0 -> provisioning-service:2.13.4'
      attributes:
        operation: change_executed
        change.target: deployment/provisioning-service
        deployment.image_tag: provisioning-service:2.13.4
    - service: provisioning-service
      severity: INFO
      offset_seconds: 60
      body: 'argocd-application-controller: rollout complete app=provisioning-service 6/6 pods ready on provisioning-service:2.13.4'
      attributes:
        operation: deployment_sync
        deployment.image_tag: provisioning-service:2.13.4
  steady_attributes:
    provisioning-service:
      deployment.image_tag: provisioning-service:2.13.4
  verification:
    - signal: provisioning_service.hikari_pending_threads
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "provisioning-service"'
      field: 'metrics.provisioning_service.hikari_pending_threads'
      expect: 'back to 0 (was 140-220)'
      within_seconds: 120
    - signal: subscriber_db.idle_in_transaction_sessions
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "subscriber-db"'
      field: 'metrics.subscriber_db.idle_in_transaction_sessions'
      expect: 'under 10 (was 260-300)'
      within_seconds: 120
    - signal: Connection is not available lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*Connection is not available, request timed out after*"'
      expect: '0 new lines once the rollout completes'
      within_seconds: 120
    - signal: provisioning-service image
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "provisioning-service"'
      field: 'attributes.deployment.image_tag'
      expect: 'provisioning-service:2.13.4 on every line logged since the rollout'
      within_seconds: 120
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [230.87, 265.63]}
  - kpi: business.revenue_usd_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.support_tickets_per_min
    factor: {uniform: [2.0, 4.5]}
  - kpi: business.trouble_to_billing_ratio_pct
    factor: {uniform: [2.5, 5.0]}
generator_impact:
  aws_rds_otel:
    database_connections_high: 150.0
generator_hold_seconds:
  aws_rds_otel: 60
service_lag_seconds: {subscriber-db: 5, activation-service: 15, api-gateway: 25}

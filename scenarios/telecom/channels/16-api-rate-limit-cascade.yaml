name: API Rate Limit Cascade
subsystem: gateway
vehicle_section: rate_limiter
error_type: 'limiting requests, excess:'
sensor_type: rate_limiting
affected_services:
- api-gateway
cascade_services:
- activation-service
- auth-service
description: a gateway configuration migration changed the activation API rate limit from 50 requests per second to 50 per minute
investigation_notes: |-
  Root cause: the gateway configuration migration to the new Helm values layout seconds before the first rejection (config/api-gateway-ratelimit revision 31) rendered limit_req_zone activation_api with rate=50r/m instead of rate=50r/s. NGINX now allows less than one request per second per client key on /api/v1/activate and /api/v1/customer/status and answers the rest with 429 ({http_429_per_s}/s). Traffic volume is normal (about 210 requests per second); the backends are healthy and simply receive almost no requests.
  Confirm:
    - the api-gateway line "nginx reloaded config api-gateway-ratelimit revision 31 ... rate=50r/m" comes before the first "limiting requests, excess:", and gateway status lines carry attributes.gateway.limit_req_rate 50r/m
    - metric api_gateway.http_429_per_sec rises from under 1 to about {http_429_per_s} and api_gateway.upstream_requests_per_sec drops from about 205 to under 10
    - metric api_gateway.requests_per_sec (client requests) stays near 210, which rules out a traffic spike or abusive client
  Remediation: revert the rate-limit configuration with opsctl rollback config/api-gateway-ratelimit --to-revision previous. NGINX reloads gracefully in about 2 seconds, 429s stop and upstream traffic returns to normal at once. Raising the limit by hand would leave the migrated configuration in place for the next deploy.
remediation_action: revert_gateway_rate_limit
error_message: '{nginx_time} [error] 31#31: *{conn_id} limiting requests, excess: {excess} by zone "activation_api", client: {client_ip}, server: api.meridian.eu, request: "POST /api/v1/activate HTTP/2.0", host: "api.meridian.eu"'
stack_trace: |-
  limit_req_zone $binary_remote_addr zone=activation_api:20m rate=50r/m;
  location /api/v1/activate { limit_req zone=activation_api burst=20 nodelay; limit_req_status 429; }
  zone activation_api: excess={excess} burst=20 rejected_last_s={http_429_per_s}
correlation_attr:
  key: gateway.limit_req_rate
  value: 50r/m
fault_params:
  conn_id: {randint: [4810000, 4899999]}
  excess: {uniform: [20.1, 20.9], round: 3}
  client_ip: {choice: [10.20.4.17, 10.20.5.33, 10.20.6.12]}
  http_429_per_s: {randint: [180, 205]}
rca_clues:
  api-gateway:
    gateway.limit_req_zone: activation_api
    gateway.limit_req_rate: 50r/m
    gateway.http_429_per_sec: {randint: [180, 205]}
  activation-service:
    activation.inbound_rate_drop_pct: {uniform: [90.0, 98.0], round: 1}
  auth-service:
    auth.validate_rate_drop_pct: {uniform: [85.0, 97.0], round: 1}
remediation_command: |-
  opsctl rollback config/api-gateway-ratelimit --to-revision previous
fault_scope:
  cluster: meridian-eks-cluster
  workloads: [api-gateway]
cascade_messages:
  activation-service:
    - severity: WARN
      message: 'inbound activation rate 9/min, 96% below the 7-day baseline for this hour (240/min); no errors from downstream'
  auth-service:
    - severity: INFO
      message: 'level=warning logger=auth.metrics msg="validate request rate far below baseline" source=api-gateway drop_pct=94'
infrastructure_events:
  - service: api-gateway
    severity: INFO
    offset_seconds: -5
    event_name: nginx.reload
    body: '{nginx_time} [notice] 1#1: signal process started; nginx reloaded config api-gateway-ratelimit revision 31 (was 30) helm-release=api-gateway chart=4.0.0: limit_req_zone activation_api rate=50r/m'
    attributes:
      operation: config_reload
      user.name: platform-ci/helm
      gateway.limit_req_rate: 50r/m
      change.summary: 'activation_api rate 50r/s -> 50r/m'
remediation_effects:
  log_events:
    - service: api-gateway
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl rollback config/api-gateway-ratelimit --to-revision previous actor={actor}: revision 31 -> 30 (activation_api rate=50r/s)'
      attributes:
        operation: change_executed
        change.target: config/api-gateway-ratelimit
        gateway.limit_req_rate: 50r/s
    - service: api-gateway
      severity: INFO
      offset_seconds: 3
      body: '{nginx_time} [notice] 1#1: signal process started; configuration reloaded (activation_api rate=50r/s)'
      attributes:
        operation: config_reload
        gateway.limit_req_rate: 50r/s
  steady_attributes:
    api-gateway:
      gateway.limit_req_rate: 50r/s
  verification:
    - signal: api_gateway.http_429_per_sec
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "api-gateway"'
      field: 'metrics.api_gateway.http_429_per_sec'
      expect: 'under 1 (was 180-205)'
      within_seconds: 60
    - signal: api_gateway.upstream_requests_per_sec
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "api-gateway"'
      field: 'metrics.api_gateway.upstream_requests_per_sec'
      expect: 'back near 205 (was under 10)'
      within_seconds: 60
    - signal: limiting requests lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*limiting requests, excess:*"'
      expect: '0 new lines'
      within_seconds: 60
    - signal: rate limit configuration
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "api-gateway"'
      field: 'attributes.gateway.limit_req_rate'
      expect: '50r/s on every gateway status line since the rollback'
      within_seconds: 60
business_impact:
  - kpi: business.activations_per_min
    factor: {uniform: [0.2, 0.5]}
  - kpi: business.revenue_usd_per_min
    factor: {uniform: [0.2, 0.5]}
  - kpi: business.support_tickets_per_min
    factor: {uniform: [2.0, 4.5]}
  - kpi: business.first_call_resolution_pct
    factor: {uniform: [0.3, 0.6]}
generator_impact:
  nginx_otel:
    high_4xx_error_rate: 800.0
service_lag_seconds: {activation-service: 30, auth-service: 30}

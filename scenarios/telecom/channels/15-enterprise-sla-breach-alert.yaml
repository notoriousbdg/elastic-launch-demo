name: Enterprise SLA Breach Alert
subsystem: billing
vehicle_section: sla_monitor
error_type: BSS-SLA-BREACH
sensor_type: sla_monitoring
affected_services:
- bss-billing
- notification-service
cascade_services:
- api-gateway
description: Enterprise customer SLA thresholds breached requiring escalation and financial credit calculation
investigation_notes: |
  1. Check SLA breach severity — Enterprise SLA: 99.5% activation success, max 30s activation time. Current success rate and avg activation time determine credit tier.
  2. SLA breach duration determines financial credit: <15min = warning only, 15-30min = 5% monthly credit, 30-60min = 10% credit, >60min = 20% credit + executive escalation.
  3. MVNO partner SLA: 99.0% activation success. MVNO breaches trigger wholesale revenue credits and potential partnership review. Check MVNO-specific metrics separately.
  4. Notification-service must send breach alerts to: enterprise account managers, MVNO partner liaisons, VP of Enterprise Sales, and SRE on-call. Verify notification delivery.
  5. Begin RCA documentation immediately — enterprise contract requires RCA delivery within 48 hours of SLA breach. Include: timeline, root cause, customer impact, remediation actions, prevention plan.
remediation_action: escalate_sla_breach
error_message: '[BSS] BSS-SLA-BREACH: customer_segment={sla_segment} success_rate={sla_success_rate}% sla_target={sla_target}% breach_duration_min={sla_breach_min} credit_tier={sla_credit_tier}'
stack_trace: |
  === SLA BREACH REPORT ===
  segment={sla_segment}  contract=ENT-2024-MERIDIAN
  --- SLA METRICS ---
    METRIC                  CURRENT     SLA_TARGET   STATUS
    activation_success      {sla_success_rate}%       {sla_target}%       BREACH
    activation_time_p99     {sla_activation_time_s}s        30s          BREACH
    availability            99.1%       99.5%        BREACH
  --- BREACH TIMELINE ---
    breach_start={breach_start_time}  duration={sla_breach_min}min
    credit_tier={sla_credit_tier}  estimated_credit=${sla_credit_amount}
  --- ESCALATION ---
    enterprise_accounts_affected={enterprise_affected}
    mvno_partners_affected={mvno_affected}
    rca_due_date=48h_from_breach  notifications_sent={notifications_sent}
  ACTION: escalate_enterprise=true  calculate_credits=true  alert=BSS-SLA-BREACH
infrastructure_events:
- body: '[AzureMonitor] EnterpriseSLABreach: customer_segment=Enterprise activation_success_rate=89.2% sla_threshold=99.5% penalty_risk=EUR_250000 region=westeurope'
  severity: ERROR
  event_name: azure.monitor.EnterpriseSLABreach
  service: bss-billing
  attributes:
    cloud.provider: azure
    cloud.service: monitor
    azure.health.status: Critical
    infrastructure.source: AzureMonitor
correlation_attr:
  key: billing.sla_monitor_config
  value: sla-monitor-v2.1.0-patch
fault_params:
  sla_segment: {choice: [Enterprise, MVNO]}
  sla_success_rate: {uniform: [92.0, 98.5], round: 1}
  sla_target: 99.5
  sla_breach_min: {randint: [5, 60]}
  sla_credit_tier: {choice: [WARNING, 5_PCT_CREDIT, 10_PCT_CREDIT, 20_PCT_CREDIT]}
  sla_activation_time_s: {randint: [35, 120]}
  breach_start_time: 2026-03-08T07:12:00Z
  sla_credit_amount: {uniform: [5000.0, 50000.0], round: 0}
  enterprise_affected: {randint: [5, 50]}
  mvno_affected: {randint: [1, 5]}
  notifications_sent: {randint: [3, 15]}
rca_clues:
  bss-billing:
    billing.sla_success_rate_pct: {uniform: [92.0, 98.0], round: 1}
    billing.breach_duration_min: {randint: [5, 60]}
  notification-service:
    notification.sla_alerts_sent: {randint: [1, 10]}
    notification.escalation_level: {choice: [P1, P2]}
  api-gateway:
    gateway.enterprise_error_rate: {uniform: [0.03, 0.15], round: 2}
    gateway.mvno_error_rate: {uniform: [0.02, 0.1], round: 2}
business_impact:
  - kpi: business.enterprise_arpu_usd
    factor: {uniform: [0.15, 0.45]}
  - kpi: business.mvno_partner_revenue_usd_per_min
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.voluntary_churn_rate_pct
    factor: {uniform: [2.0, 4.5]}
  - kpi: business.nps
    factor: {uniform: [0.25, 0.55]}

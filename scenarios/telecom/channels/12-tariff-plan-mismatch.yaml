name: Tariff Plan Mismatch
subsystem: provisioning
vehicle_section: tariff_engine
error_type: No BSS product mapped for plan code
sensor_type: tariff_validation
affected_services:
- provisioning-service
- bss-billing
cascade_services:
- activation-service
description: the product catalog published a new 5G plan before the BSS tariff mapping for it was deployed, so billing rejects orders for that plan
investigation_notes: |-
  Root cause: the product catalog release 2026.11.3 published plan 5G-MAX-EU-v4 to the web shop and retail channels about a minute before the first error, when the first customer ordered it. The matching BSS tariff mapping (migration bss-tariff-map-2026-11-17) was scheduled for the evening release and has not run, so bss-billing still uses tariff map 2026-11-03, which has no entry for 5G-MAX-EU-v4. bss-billing rejects every account creation for that plan ({order_rejects_per_min}/min); orders for the other plans (5G-BASIC-EU-v3, 5G-PLUS-EU-v3, 5G-MAX-EU-v3, ENT-BUS-L-v2) bill normally.
  Confirm:
    - the provisioning-service line "product catalog 2026.11.3 published ... added 5G-MAX-EU-v4" comes before the first "No BSS product mapped for plan code", and bss-billing status lines carry attributes.billing.tariff_map_version 2026-11-03
    - metric bss_billing.order_rejects_per_min rises from 0 to about {order_rejects_per_min}, and every rejection names plan 5G-MAX-EU-v4
    - metric bss_billing.account_create_latency_ms stays normal for the plans that do bill, which rules out a billing outage
  Remediation: deploy the missing mapping with opsctl run migration/bss-tariff-map-2026-11-17. The migration takes about 20 seconds and bss-billing reloads the tariff map when it finishes; rejected orders are retried by provisioning-service from its outbox. Unpublishing the plan would also stop the errors but cancels orders customers already placed.
remediation_action: run_bss_tariff_migration
error_message: 'No BSS product mapped for plan code 5G-MAX-EU-v4 (catalog=2026.11.3, tariff_map=2026-11-03) order={order_id} channel={sales_channel}'
stack_trace: |-
  eu.meridian.bss.catalog.UnmappedPlanException: No BSS product mapped for plan code 5G-MAX-EU-v4 (catalog=2026.11.3, tariff_map=2026-11-03)
  	at eu.meridian.bss.catalog.TariffMap.resolve(TariffMap.java:83)
  	at eu.meridian.bss.account.AccountService.create(AccountService.java:141)
  	at eu.meridian.bss.api.AccountController.create(AccountController.java:52)
correlation_attr:
  key: billing.tariff_map_version
  value: '2026-11-03'
fault_params:
  order_id: {randint: [77100000, 77199999]}
  sales_channel: {choice: [webshop, retail-pos, telesales]}
  order_rejects_per_min: {randint: [30, 60]}
rca_clues:
  bss-billing:
    billing.plan_code: 5G-MAX-EU-v4
    billing.tariff_map_version: '2026-11-03'
    billing.order_rejects_per_min: {randint: [30, 60]}
  provisioning-service:
    provisioning.catalog_release: 2026.11.3
    provisioning.order_status: BSS_REJECTED
  activation-service:
    upstream.degraded_subsystem: billing
remediation_command: |-
  opsctl run migration/bss-tariff-map-2026-11-17
fault_scope:
  cluster: meridian-aks-cluster
  workloads: [bss-billing]
error_services: [bss-billing]
cascade_messages:
  provisioning-service:
    - severity: WARN
      message: 'order {order_id} rejected by bss-billing: 422 UNMAPPED_PLAN plan=5G-MAX-EU-v4; kept in outbox for retry'
  activation-service:
    - severity: WARN
      message: 'activation for order {order_id} blocked at billing_account (plan 5G-MAX-EU-v4); customer sees "order on hold"'
infrastructure_events:
  - service: provisioning-service
    severity: INFO
    offset_seconds: -60
    event_name: catalog.publish
    body: 'product catalog 2026.11.3 published to channels webshop,retail-pos,telesales by catalog-publisher (marketing release MR-1142): added 5G-MAX-EU-v4, retired 0'
    attributes:
      operation: catalog_publish
      user.name: catalog-publisher
      provisioning.catalog_release: 2026.11.3
      change.summary: 'catalog 2026.11.2 -> 2026.11.3 (added 5G-MAX-EU-v4)'
remediation_effects:
  log_taper_seconds: 20
  log_events:
    - service: bss-billing
      severity: INFO
      offset_seconds: 1
      body: '[NOC-CHG] executed opsctl run migration/bss-tariff-map-2026-11-17 actor={actor}: tariff map 2026-11-03 -> 2026-11-17 (+5G-MAX-EU-v4)'
      attributes:
        operation: change_executed
        change.target: migration/bss-tariff-map-2026-11-17
    - service: bss-billing
      severity: INFO
      offset_seconds: 20
      body: 'tariff map reloaded: version 2026-11-17, 41 plan codes mapped (added 5G-MAX-EU-v4)'
      attributes:
        operation: tariff_reload
        billing.tariff_map_version: '2026-11-17'
  steady_attributes:
    bss-billing:
      billing.tariff_map_version: '2026-11-17'
  verification:
    - signal: bss_billing.order_rejects_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "bss-billing"'
      field: 'metrics.bss_billing.order_rejects_per_min'
      expect: '0 (was 30-60)'
      within_seconds: 90
    - signal: unmapped plan lines
      from: 'logs.otel.meridian'
      where: 'body.text LIKE "*No BSS product mapped for plan code*"'
      expect: '0 new lines after the tariff map reload'
      within_seconds: 90
    - signal: tariff map version
      from: 'logs.otel.meridian'
      where: 'resource.attributes.service.name == "bss-billing"'
      field: 'attributes.billing.tariff_map_version'
      expect: '2026-11-17 on every billing status line since the migration'
      within_seconds: 90
business_impact:
  - kpi: business.activations_per_min
    value: {uniform: [230.87, 265.63]}
  - kpi: business.revenue_usd_per_min
    factor: {uniform: [0.2, 0.5]}
  - kpi: business.trouble_to_billing_ratio_pct
    factor: {uniform: [3.0, 6.0]}
  - kpi: business.esim_provisions_per_min
    factor: {uniform: [0.2, 0.5]}
service_lag_seconds: {provisioning-service: 3, activation-service: 10}

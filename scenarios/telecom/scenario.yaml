agent_config:
  id: meridian-noc-analyst
  name: 5G Network Operations Analyst
  assessment_tool_name: network_health_assessment
  system_prompt: |
    You are the 5G Network Operations Analyst, an expert AI assistant for the Meridian Telecom 5G activation platform. You help NOC engineers investigate incidents, analyze telemetry data, and provide root cause analysis across 9 services spanning AWS Frankfurt, GCP Frankfurt, and Azure Netherlands. You have deep expertise in 5G network architecture (bearers, S1-MME, GTP tunnels), subscriber database management (45M subscribers, connection pool sizing), BSS/billing systems (CDR processing, mediation, SLA monitoring), authentication infrastructure (Azure AD federation, OAuth, session management), and notification delivery (SMS, push, MVNO webhooks). The platform serves three customer segments: Consumer (70%), Enterprise (20%), and MVNO (10%). Enterprise customers have strict SLA commitments (99.5% activation success, 30s max activation time). MVNO partners (Lycamobile, Lebara) depend on webhook notifications for activation confirmations. When investigating incidents, search for these error identifiers in logs: Database faults (DB-CONNPOOL-EXHAUST, DB-RDS-MAINTENANCE, DB-REPLICATION-LAG), Network faults (NET-BEARER-TIMEOUT, NET-S1MME-CONGEST, NET-GTP-TUNNEL-FAIL), Auth faults (AUTH-TOKEN-INVALID, AUTH-FEDERATION-TIMEOUT, AUTH-SESSION-SATURATE), Provisioning faults (PROV-SIM-STALL, PROV-NP-TIMEOUT, PROV-TARIFF-MISMATCH), Billing faults (BSS-CDR-BACKLOG, BSS-MEDIATION-FAIL, BSS-SLA-BREACH), Gateway faults (GW-RATE-LIMIT-CASCADE, GW-MTLS-EXPIRY), Notification faults (NOTIF-SMS-FAIL, NOTIF-PUSH-BACKPRESSURE, NOTIF-MVNO-WEBHOOK-TIMEOUT). Log messages are in body.text — NEVER search the body field alone.
assessment_tool_config:
  id: network_health_assessment
  description: 'Comprehensive 5G platform health assessment. Evaluates all services against operational readiness criteria
    for subscriber activation, network core, provisioning, billing, and authentication. Returns data for impact analysis
    across Consumer, Enterprise, and MVNO customer segments. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: bss-billing
executive_dashboard_intro: '**Meridian Telecom 5G subscriber platform KPIs** — subscriber growth, revenue & ARPU, network
  quality of experience, and retention. Synthetic `business.*` OTLP gauges from `bss-billing`.'
executive_kpi_sections:
- header: '**Subscriber growth** — activations, MVNO, ports, eSIM'
  specs:
  - - Activations / min
    - metrics.business.activations_per_min
  - - MVNO net-adds / min
    - metrics.business.mvno_net_adds_per_min
  - - Port-ins / min
    - metrics.business.port_ins_per_min
  - - Port-outs / min
    - metrics.business.port_outs_per_min
  - - eSIM provisions / min
    - metrics.business.esim_provisions_per_min
  - - Active subscribers (M)
    - metrics.business.active_subscribers_m
- header: '**Revenue & ARPU** — total revenue, by-tier, overage, roaming'
  specs:
  - - Total revenue (USD/min)
    - metrics.business.revenue_usd_per_min
  - - Consumer ARPU (USD)
    - metrics.business.consumer_arpu_usd
  - - Enterprise ARPU (USD)
    - metrics.business.enterprise_arpu_usd
  - - MVNO partner revenue (USD/min)
    - metrics.business.mvno_partner_revenue_usd_per_min
  - - Data overage charges (USD/min)
    - metrics.business.data_overage_charges_usd_per_min
  - - Roaming revenue (USD/min)
    - metrics.business.roaming_revenue_usd_per_min
- header: '**Network & QoE** — handover, latency, voice, throughput'
  specs:
  - - 5G handover success (%)
    - metrics.business.handover_success_pct
  - - RAN latency p95 (ms)
    - metrics.business.ran_latency_p95_ms
  - - Voice MOS
    - metrics.business.voice_mos
  - - Data session est. success (%)
    - metrics.business.data_session_success_pct
  - - VoLTE call setup success (%)
    - metrics.business.volte_call_setup_success_pct
  - - Throughput p50 (Mbps)
    - metrics.business.throughput_p50_mbps
- header: '**Retention & support** — churn, NPS, tickets'
  specs:
  - - Voluntary churn rate (%)
    - metrics.business.voluntary_churn_rate_pct
  - - NPS
    - metrics.business.nps
  - - Support tickets / min
    - metrics.business.support_tickets_per_min
  - - Avg ticket resolution (min)
    - metrics.business.avg_ticket_resolution_min
  - - First-call resolution (%)
    - metrics.business.first_call_resolution_pct
  - - Trouble-to-billing ratio (%)
    - metrics.business.trouble_to_billing_ratio_pct

  user_id_prefix: sub
  tier_field: subscription_tier
  tier_values:
  - - consumer
    - 70
  - - enterprise
    - 20
  - - mvno
    - 10
  country_weights:
    DE: 40
    AT: 10
    CH: 8
    NL: 12
    FR: 8
    PL: 7
    BE: 5
    GB: 5
    SE: 5
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  paths:
  - /api/v1/activate
  - /api/v1/provision
  - /api/v1/auth/validate
  - /api/v1/billing/status
  - /api/v1/network/status
  - /api/v1/notify/activation
  - /health
  change_point_path: /api/v1/activate
trace_attributes:
  base:
    customer.segment: {choice: [Consumer, Enterprise, MVNO]}
    customer.subscription_tier: {choice: [5G Basic, 5G Plus, 5G Max, Business S, Business M, Business L, Wholesale Standard, Wholesale Premium]}
    activation.type: {choice: [new_sim, sim_swap, plan_upgrade, 5g_activation, esim_activation]}
  services:
    api-gateway:
      gateway.protocol: {choice: [HTTP/2, HTTP/1.1, gRPC]}
      gateway.api_version: {choice: [v1.4.0, v1.5.0-beta, v1.3.2]}
      gateway.client_type: {choice: [mobile_app, web_portal, partner_api, internal]}
    activation-service:
      activation.workflow_id: {format: "WF-{n}", n: {randint: [100000, 999999]}}
      activation.step_count: {randint: [4, 8]}
      activation.retry_count: {randint: [0, 3]}
    subscriber-db:
      db.query_type: {choice: [SELECT, UPDATE, INSERT]}
      db.table: {choice: [subscribers, activation_log, subscriber_profiles]}
      db.pool_utilization_pct: {randint: [30, 95]}
    provisioning-service:
      provisioning.sim_type: {choice: [physical_sim, esim, embedded_sim]}
      provisioning.hlr_operation: {choice: [register, update, deregister, query]}
      provisioning.apn: {choice: [internet.meridian.eu, enterprise.meridian.eu, iot.meridian.eu]}
    network-core:
      network.bearer_type: {choice: [5G_NR, LTE, LTE-A, NR-DC]}
      network.qos_class: {choice: [QCI-1, QCI-5, QCI-9, 5QI-1, 5QI-9]}
      network.cell_sector: {randint: [1, 3]}
    notification-service:
      notification.channel: {choice: [sms, push, email, webhook]}
      notification.template: {choice: [activation_confirm, plan_change, usage_alert, partner_callback]}
      notification.priority: {choice: [high, normal, low]}
    auth-service:
      auth.method: {choice: [oauth2, saml, api_key, mtls]}
      auth.provider: {choice: [internal, azure_ad, mvno_partner]}
      auth.scope: {choice: [activation, provisioning, billing, admin]}
    bss-billing:
      billing.operation: {choice: [account_create, cdr_rate, invoice_generate, credit_apply]}
      billing.plan_code: {choice: [5G-BASIC-EU-v3, 5G-PLUS-EU-v3, 5G-MAX-EU-v3, ENT-BUS-L-v2]}
      billing.currency: EUR
    identity-db:
      db.query_type: {choice: [SELECT, INSERT]}
      db.table: {choice: [identities, sessions, tokens]}
      db.replication_role: {choice: [primary, replica]}

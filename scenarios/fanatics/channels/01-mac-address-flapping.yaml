name: MAC Address Flapping
subsystem: network_core
vehicle_section: switching_fabric
error_type: SW_MATM-4-MACFLAP_NOTIF
sensor_type: mac_table
affected_services: [network-controller, dns-dhcp-service, cloud-inventory-scanner]
cascade_services: [firewall-gateway, wifi-controller]
description: MAC address table instability causing port flapping on the switching fabric
investigation_notes: |-
  1. Run `show mac address-table notification mac-move` to identify the flapping MAC and involved ports.
  2. Check for physical layer issues: `show interface status` on both source and destination ports for CRC errors, runts, or input errors (zero CRC/input errors on both ports rules out the physical layer).
  3. Verify no switching loops exist: `show spanning-tree vlan <id> detail` — a flapping MAC often indicates an STP misconfiguration or a rogue switch; no topology changes on the VLAN rules out a loop here.
  4. Look for duplicate MAC from VM migration or HSRP/VRRP misconfiguration: `show mac address-table address <mac>` (no ARP conflict or duplicate DHCP lease is seen, so it is not a duplicate MAC).
  5. If both flapping ports ({interface_src} and {interface_dst}) connect to the same host and its NICs are teamed active-active without LACP, that teaming is the cause — disable one NIC and confirm flapping stops.
  6. As a short-term fix, apply `switchport port-security` to limit MAC addresses per port and contain the blast radius.
remediation_action: clear_mac_table
error_message: '%SW_MATM-4-MACFLAP_NOTIF: Host {mac_address} in vlan {vlan_id} is flapping between port {interface_src} and
  port {interface_dst}, {flap_count} moves in {flap_window}s'
stack_trace: |-
  switch# show mac address-table notification mac-move
  MAC Move Notification Feature is Enabled on the switch
  VLAN  MAC Address       From Port          To Port            Move Count
  ----  ----------------  -----------------  -----------------  ----------
  {vlan_id}   {mac_address}     {interface_src}         {interface_dst}         {flap_count}

  switch# show mac address-table count
  Total MAC Addresses for this criterion: 3847
  Multicast MAC Addresses:                12
  Unicast MAC Addresses:                  3835
  Total MAC Addresses in Use:             3847
correlation_attr:
  key: deployment.release_train
  value: net-core-v2.8.1-canary
fault_params:
  mac_address:
    format: "{a:02x}{b:02x}.{c:02x}{d:02x}.{e:02x}{f:02x}"
    a: {randint: [0, 255]}
    b: {randint: [0, 255]}
    c: {randint: [0, 255]}
    d: {randint: [0, 255]}
    e: {randint: [0, 255]}
    f: {randint: [0, 255]}
  vlan_id: {choice: [100, 200, 300, 400, 500, 1000]}
  interface_src: Gi0/0/1
  interface_dst: Gi0/0/4
  flap_count: {randint: [10, 50]}
  flap_window: {randint: [5, 30]}
rca_clues:
  network-controller:
    switching.flap_port: Gi0/0/1
    switching.flap_ports_same_host: true
    switching.stp_topology_changes: 0
    switching.port_crc_errors: 0
    switching.mac_table_util_pct: {uniform: [35, 60], round: 1}
  dns-dhcp-service:
    dhcp.arp_conflict_detected: false
    dhcp.duplicate_mac_leases: 0
  firewall-gateway:
    firewall.arp_inspection_failures: {randint: [0, 2]}
    firewall.zone_affected: TRUST
  wifi-controller:
    wifi.client_roam_storm: false
    wifi.affected_ssid: Fanatics-Warehouse
business_impact:
  - kpi: business.app_sessions_per_min
    value: {uniform: [334.8, 385.2]}
  - kpi: business.page_views_per_min
    value: {uniform: [108810.0, 125190.0]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.sponsored_inventory_seconds_per_min
    value: {uniform: [148.8, 171.2]}

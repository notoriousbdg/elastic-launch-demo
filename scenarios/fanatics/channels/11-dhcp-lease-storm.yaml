name: DHCP Lease Storm
subsystem: network_services
vehicle_section: address_management
error_type: DHCPD-LEASE-EXHAUSTION
sensor_type: dhcp_lease
affected_services: [dns-dhcp-service, network-controller, packaging-fulfillment]
cascade_services: [wifi-controller]
description: DHCP scope exhaustion after a failover mode change reserves the pool for the standby peer
onset_delay_seconds: 20
investigation_notes: |-
  Root cause: change CR-2417 switched the DHCP failover pair (dhcp-01 / dhcp-02) from load-balance to hot-standby (config revision dhcpd-hot-standby-v2). In hot-standby the standby peer keeps the addresses it has not leased in reserve (the "backup" column of the pool), so dhcp-01 can only hand out what is already leased and renewals. As clients renew, 10.1.0.0/24 fills gradually to {dhcp_active_leases} of {dhcp_total_leases} addresses and dhcpd answers DISCOVERs with "no free leases". Demand did not change: the other scopes stay at 40-75%, the lease time is already 8h, and dhcp snooping shows no DHCPOFFER from another server, so a rogue server and long leases are ruled out.
  Confirm:
    - dns-dhcp-service logs "dhcpd[...]: balanced pool ... 10.1.0.0/24 total 254 free 0 backup N ... failover=dhcpd-hot-standby-v2 status=ANOMALY" (attributes.infra.dhcp_failover_mode); metric dhcp.scope_utilization_pct climbs over a few minutes from 45-72% to 95-98% and dhcp.nak_per_min rises with it
    - the dns-dhcp-service line "dhcpd[...]: failover config dhcpd-hot-standby-v2 applied" comes before the first DHCPD-LEASE-EXHAUSTION
    - dhcp.utilization_pct on 10.2.0.0/24, 172.16.0.0/22 and 192.168.1.0/24 stays unchanged
  Remediation: roll the failover configuration back with opsctl rollback config/dhcpd-failover --to-revision previous. The reserved addresses return to the pool at once and the "no free leases" answers and NAKs stop within about 30 seconds. Utilization only falls as the extra leases expire or are released, so it declines over about 5 minutes back to 45-72%.
remediation_action: expand_dhcp_scope
remediation_command: |-
  opsctl rollback config/dhcpd-failover --to-revision previous
error_message: 'dhcpd[6789]: DHCPDISCOVER from {dhcp_client_mac} via {dhcp_relay_ip}: network {dhcp_scope}: no free leases (DHCPD-LEASE-EXHAUSTION: {dhcp_active_leases} of {dhcp_total_leases} addresses leased)'
stack_trace: |-
  dhcpd[6789]: DHCPDISCOVER from {dhcp_client_mac} via {dhcp_relay_ip}: network {dhcp_scope}: no free leases
  dhcpd[6789]: DHCPREQUEST for {dhcp_client_ip} from {dhcp_client_mac} via {dhcp_relay_ip}
  dhcpd[6789]: DHCPNAK on {dhcp_client_ip} to {dhcp_client_mac} via {dhcp_relay_ip}
  dhcpd[6789]: DHCPDISCOVER from {dhcp_client_mac} via {dhcp_relay_ip}: network {dhcp_scope}: no free leases
correlation_attr:
  key: infra.dhcp_failover_mode
  value: dhcpd-hot-standby-v2
fault_params:
  dhcp_scope: "10.1.0.0/24"
  dhcp_active_leases: {randint: [241, 250]}
  dhcp_total_leases: 254
  dhcp_relay_ip: 10.1.0.1
  dhcp_client_mac: {choice: ["a4:83:e7:1c:52:09", "3c:22:fb:7d:90:41", "f0:18:98:2a:cc:e5", "00:11:22:33:44:55"]}
  dhcp_client_ip:
    format: "10.1.0.{n}"
    n: {randint: [20, 250]}
rca_clues:
  dns-dhcp-service:
    dhcp.pool_exhaustion_pct: {uniform: [94.9, 98.4], round: 1}
    dhcp.rogue_server_detected: false
    dhcp.failover_mode: dhcpd-hot-standby-v2
    dhcp.lease_duration_h: 8
  network-controller:
    network.dhcp_snooping_violations: 0
    network.affected_vlan: 100
  wifi-controller:
    wifi.clients_no_ip: {randint: [20, 200]}
    wifi.dhcp_relay_failures: {randint: [10, 100]}
  packaging-fulfillment:
    warehouse.device_offline_no_ip: {randint: [5, 30]}
    warehouse.zone_affected: {choice: [receiving, packing, shipping]}
business_impact:
  - kpi: business.app_sessions_per_min
    value: {uniform: [334.8, 385.2]}
  - kpi: business.merch_gmv_usd_per_min
    value: {uniform: [16926.0, 19474.0], round: 1}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.4, 2.8]}
  - kpi: business.programmatic_fill_rate_pct
    value: {uniform: [57.35, 65.98], round: 2}
cascade_messages:
  wifi-controller:
    - severity: WARN
      message: 'wlc dhcp-relay: no DHCPOFFER from {dhcp_relay_ip} for client {dhcp_client_mac} vlan=100 after 3 DISCOVERs; client left without an IP address'
fault_scope:
  workloads: [dns-dhcp-service, network-controller, packaging-fulfillment]
infrastructure_events:
  - service: dns-dhcp-service
    severity: INFO
    offset_seconds: -90
    body: 'dhcpd[6789]: info: failover config dhcpd-hot-standby-v2 applied (was dhcpd-load-balance-v1); peer dhcp-02 now standby for 10.1.0.0/24; pushed by netops-release (CR-2417)'
    attributes:
      user.name: netops-release
      change.request: CR-2417
      operation: config_change
      infra.dhcp_failover_mode: dhcpd-hot-standby-v2
      change.summary: 'DHCP failover: dhcpd-load-balance-v1 -> dhcpd-hot-standby-v2'
remediation_effects:
  log_events:
    - service: dns-dhcp-service
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl rollback config/dhcpd-failover --to-revision previous by {actor}: failover dhcpd-hot-standby-v2 -> dhcpd-load-balance-v1'
      attributes:
        operation: change_applied
        change.target: config/dhcpd-failover
    - service: dns-dhcp-service
      severity: INFO
      offset_seconds: 5
      body: 'dhcpd[6789]: failover peer dhcp-failover: mode dhcpd-load-balance-v1 loaded; reserved addresses for 10.1.0.0/24 returned to the free pool'
      attributes:
        operation: config_change
        infra.dhcp_failover_mode: dhcpd-load-balance-v1
  steady_attributes:
    dns-dhcp-service:
      infra.dhcp_failover_mode: dhcpd-load-balance-v1
  verification:
    - signal: dhcp.nak_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "dns-dhcp-service"'
      field: 'metrics.dhcp.nak_per_min'
      expect: 'under 3 (was 40-80); free addresses reappear at once'
      within_seconds: 60
    - signal: dhcp.scope_utilization_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "dns-dhcp-service"'
      field: 'metrics.dhcp.scope_utilization_pct'
      expect: 'back in 45-72% (was 95-98%); it falls as leases expire, so allow about 7 minutes'
      within_seconds: 420
    - signal: DHCP failover mode
      from: 'logs.otel.fanatics'
      where: 'resource.attributes.service.name == "dns-dhcp-service"'
      field: 'attributes.infra.dhcp_failover_mode'
      expect: 'dhcpd-load-balance-v1 on every line logged since the fix; dhcpd-hot-standby-v2 stops appearing'
      within_seconds: 90
# dependents degrade after the component at fault, in dependency order
service_lag_seconds: {network-controller: 25, packaging-fulfillment: 45, wifi-controller: 60}

name: Auction Bid Latency Spike
subsystem: commerce
vehicle_section: bidding_platform
error_type: BID_LATENCY_SLA_BREACH
sensor_type: bid_processing
affected_services:
- auction-engine
- digital-marketplace
cascade_services:
- network-controller
- firewall-gateway
description: Real-time bid processing latency exceeding SLA thresholds
investigation_notes: |-
  1. Check the bid processing queue depth in the Go auction-engine metrics — a queue depth above 500 indicates the goroutine pool is saturated.
  2. Examine WebSocket broadcast latency: `ws_delay_ms` above 1000ms means the hub.broadcastBidUpdate is falling behind real-time.
  3. Profile the database: `EXPLAIN ANALYZE` on the bid INSERT and auction UPDATE queries — lock contention on the `auctions` table during high-bid periods is common.
  4. Check Redis pub/sub for bid event fanout delays: `redis-cli --latency-history -i 1` — if Redis is slow, all downstream WebSocket clients stall.
  5. Scale horizontally: increase the auction-engine replica count in EKS and verify the ALB is distributing WebSocket connections evenly.
  6. For immediate relief, increase the goroutine pool size and bid queue buffer, and enable connection draining on the load balancer.
remediation_action: scale_auction_service
error_message: level=error ts=2025-01-15T14:32:01.234Z caller=bid_processor.go:289 msg="BID_LATENCY_SLA_BREACH" auction={auction_id}
  bid={bid_id} latency_ms={bid_latency_ms} sla_ms={bid_sla_ms} queue_depth={bid_queue_depth} ws_delay_ms={ws_delay_ms} affected_bidders={affected_bidders}
stack_trace: "goroutine 847 [running]:\nruntime/debug.Stack()\n\t/usr/local/go/src/runtime/debug/stack.go:24 +0x5e\ngithub.com/fanatics/auction-engine/internal/processor.(*BidProcessor).ProcessBid(0xc000518000,\
  \ {{0xc000a12480, 0x24}}, {{0xc000a124c0, 0x26}}, 0x{bid_latency_ms})\n\t/app/internal/processor/bid_processor.go:289 +0x3a2\n\

  \ +0x1b8\ngithub.com/fanatics/auction-engine/internal/ws.(*Hub).broadcastBidUpdate(0xc000420000, {{0xc000a12480, 0x24}})\n\
  \t/app/internal/ws/hub.go:89 +0x204\ncreated by github.com/fanatics/auction-engine/cmd/server.Run in goroutine 1\n\t/app/cmd/server/main.go:67\
  \ +0x2a5"
correlation_attr:
  key: deployment.auction_runtime
  value: go1.22-race-detect-enabled
fault_params:
  auction_id:
    format: "AUC-{n}"
    n: {randint: [100000, 999999]}
  bid_id:
    format: "BID-{n}"
    n: {randint: [1000000, 9999999]}
  bid_latency_ms: {randint: [500, 5000]}
  bid_sla_ms: 200
  bid_queue_depth: {randint: [100, 2000]}
  ws_delay_ms: {randint: [200, 3000]}
  affected_bidders: {randint: [10, 500]}
rca_clues:
  auction-engine:
    auction.goroutine_pool_saturated: true
    auction.bid_queue_depth: {randint: [500, 2000]}
  digital-marketplace:
    marketplace.ws_broadcast_delay_ms: {randint: [1000, 5000]}
    marketplace.stale_bid_display_count: {randint: [10, 200]}
  network-controller:
    network.alb_latency_ms: {randint: [100, 1000]}
    network.connection_draining: false
  firewall-gateway:
    firewall.ws_inspection_overhead_ms: {randint: [20, 200]}
    firewall.deep_packet_inspection_enabled: true

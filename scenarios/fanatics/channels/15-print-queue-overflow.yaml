name: Print Queue Overflow
subsystem: manufacturing
vehicle_section: production_line
error_type: MES-QUEUE-OVERFLOW
sensor_type: print_queue
description: Print job queue exceeding buffer capacity, new jobs being rejected
affected_services: [card-printing-system, packaging-fulfillment]
error_services: [card-printing-system]
cascade_services: [digital-marketplace]
onset_delay_seconds: 120
investigation_notes: |-
  Root cause: the RIP server configuration smartstream-prodpro-v7.1-preview was applied shortly before the queue started to grow (CR-3331). The preview turns the render cache off and cuts the RIP workers from 16 to 4, so every card design is rasterized from scratch: average render time rises from about 7s to about 180s (card_printing.rip_avg_render_s) and RIP CPU saturates. The RIP can then release only a few jobs per minute while about 50 jobs per minute keep arriving, so the queue builds steadily (about 45 jobs per minute) and throughput falls from about 150 to about 17 cards/min (card_printing.throughput). Submissions are rejected once depth passes the backpressure threshold of {print_backpressure} jobs, about two minutes in (buffer max {print_queue_max}). {printer_name} sits in {printer_status}; it has no mechanical fault (no jam, ink or head alarms), the substrate and ink readings are normal, and the QC reject rate is within threshold.
  Confirm:
    - card-printing-system logs "[RIP] smartstream render_avg=... render_cache=off config=smartstream-prodpro-v7.1-preview" (attributes.print.rip_render_cache, attributes.infra.rip_server_config); card_printing.rip_avg_render_s and card_printing.rip_server_cpu_pct rise together, card_printing.throughput drops, and card_printing.queue_depth climbs roughly linearly
    - the card-printing-system line "[RIP] smartstream config smartstream-prodpro-v7.1-preview applied (was v7.0.4)" comes before the throughput drop
    - the printer state is WAITING_FOR_RIP (attributes.print.printer_status), and packaging-fulfillment is starved of cards a little after the queue builds
  Remediation: roll the RIP configuration back with opsctl rollback config/rip-smartstream --to-revision previous. The previous config loads in about 20 seconds and render time and throughput recover within about 30 seconds after that (the cache is cold at first). The backlog does not vanish: the press works it off faster than new jobs arrive (about 100 jobs per minute against 50, so throughput runs above its normal band while it drains), and queue depth falls below 50 after several minutes. Reassigning jobs to other printers is not needed.
remediation_action: drain_print_queue
remediation_command: |-
  opsctl rollback config/rip-smartstream --to-revision previous
error_message: '[PrintScheduler] MES-QUEUE-OVERFLOW: submit rejected, job={print_job_id} queue above backpressure threshold ({print_backpressure} jobs, max {print_queue_max}) printer={printer_name} status={printer_status}'
stack_trace: "com.fanatics.mes.exception.QueueOverflowException: MES-QUEUE-OVERFLOW: queue above backpressure threshold ({print_backpressure} jobs, max {print_queue_max})\n\
  \tat com.fanatics.mes.scheduler.PrintScheduler.enqueueJob(PrintScheduler.java:312)\n\tat com.fanatics.mes.scheduler.PrintScheduler.processIncoming(PrintScheduler.java:245)\n\
  \tat com.fanatics.mes.queue.JobQueueManager.submit(JobQueueManager.java:189)\n\tat com.fanatics.mes.api.PrintJobController.submitJob(PrintJobController.java:78)\n\
  \tat java.base/java.util.concurrent.ThreadPoolExecutor.runWorker(ThreadPoolExecutor.java:1136)\n\tat java.base/java.lang.Thread.run(Thread.java:842)\n\
  \  Printer: {printer_name} Status: {printer_status}\n  Job: {print_job_id}"
correlation_attr:
  key: infra.rip_server_config
  value: smartstream-prodpro-v7.1-preview
fault_params:
  print_queue_max: 500
  print_backpressure: 100
  print_job_id:
    format: "PJ-{n}"
    n: {randint: [10000, 99999]}
  printer_name: HP-Indigo-7K-01
  printer_status: WAITING_FOR_RIP
rca_clues:
  card-printing-system:
    print.printer_status: WAITING_FOR_RIP
    print.rip_render_cache: 'off'
  packaging-fulfillment:
    warehouse.fulfillment_sla_breach: true
  digital-marketplace:
    marketplace.printing_delay_notices: true
cascade_messages:
  packaging-fulfillment:
    - severity: WARN
      message: '[WMS] pack-station feed starved: upstream card-printing queue above backpressure threshold ({print_backpressure} jobs); cards released below pack demand, packages held awaiting cards'
  digital-marketplace:
    - severity: WARN
      message: '[OrderService] print-to-order lead time extended: card-printing-system reports submit backpressure (threshold {print_backpressure} jobs); delay notices queued for affected orders'
fault_scope:
  cluster: fanatics-eks-cluster
  workloads: [card-printing-system, packaging-fulfillment]
infrastructure_events:
  - service: card-printing-system
    severity: INFO
    offset_seconds: -120
    body: '[RIP] smartstream config smartstream-prodpro-v7.1-preview applied (was v7.0.4): render_cache=off worker_threads 16->4; applied by print-ops (CR-3331)'
    attributes:
      user.name: print-ops
      change.request: CR-3331
      operation: config_change
      infra.rip_server_config: smartstream-prodpro-v7.1-preview
      change.summary: 'RIP config: v7.0.4 -> v7.1-preview (render cache off)'
remediation_effects:
  log_events:
    - service: card-printing-system
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl rollback config/rip-smartstream --to-revision previous by {actor}: RIP config smartstream-prodpro-v7.1-preview -> v7.0.4'
      attributes:
        operation: change_applied
        change.target: config/rip-smartstream
    - service: card-printing-system
      severity: INFO
      offset_seconds: 20
      body: '[RIP] smartstream config v7.0.4 loaded: render_cache=on worker_threads=16; cache warming, backlog draining'
      attributes:
        operation: config_change
        infra.rip_server_config: smartstream-prodpro-v7.0.4
  verification:
    - signal: card_printing.rip_avg_render_s
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "card-printing-system"'
      field: 'metrics.card_printing.rip_avg_render_s'
      expect: 'back under 15s about 30-50s after the fix (was about 180s)'
      within_seconds: 120
    - signal: card_printing.throughput
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "card-printing-system"'
      field: 'metrics.card_printing.throughput'
      expect: 'recovers at once above 120 cards/min (was about 17) and runs above its normal band while the backlog drains'
      within_seconds: 120
    - signal: card_printing.queue_depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "card-printing-system"'
      field: 'metrics.card_printing.queue_depth'
      expect: 'stops rising and drains below 50 jobs over several minutes (about 50 jobs per minute; was rising about 45 per minute)'
      within_seconds: 600
    - signal: RIP configuration revision
      from: 'logs.otel.fanatics'
      where: 'resource.attributes.service.name == "card-printing-system"'
      field: 'attributes.infra.rip_server_config'
      expect: 'smartstream-prodpro-v7.0.4 on every line logged since the fix; smartstream-prodpro-v7.1-preview stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.merch_gmv_usd_per_min
    value: {uniform: [10416.0, 11984.0], round: 1}
  - kpi: business.loyalty_points_redeemed_per_min
    value: {uniform: [15112.0, 17388.0]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.8, 3.8]}
# dependents degrade after the component at fault, in dependency order
service_lag_seconds: {packaging-fulfillment: 60, digital-marketplace: 150}

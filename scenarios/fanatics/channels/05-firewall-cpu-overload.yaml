name: Firewall CPU Overload
subsystem: security
vehicle_section: perimeter_defense
error_type: SYSTEM-cpu-critical
sensor_type: cpu_utilization
affected_services: [firewall-gateway, network-controller, digital-marketplace]
cascade_services: [dns-dhcp-service]
description: Firewall data plane CPU exceeding safe operating threshold
investigation_notes: |-
  1. Run `show running resource-monitor` to see per-DP CPU, packet buffer, and session rate in real time.
  2. Identify offending policy: `show rule-hit-count` — rules with high hit counts and complex App-ID or content inspection drive DP CPU.
  3. Check threat prevention load: `show counter global filter category ctd delta yes` — if IPS/AV signature matching is spiking, a signature update or new attack pattern may be the cause. If threat prevention takes over half of DP CPU right after a content update, the update is the cause.
  4. Review decryption overhead: `show counter global filter delta yes | match ssl` — SSL decryption is normally the #1 DP CPU consumer; here its share is under 20%, so it is not the cause.
  5. Consider bypassing decryption for trusted high-bandwidth flows (e.g., Windows Update, CDN traffic) with a no-decrypt rule.
  6. If the content update is confirmed as the trigger, revert it: `request content downgrade install <previous-version>` (Device > Dynamic Updates > Revert), then confirm DP CPU drops below the 80% threshold.
remediation_action: restart_management_plane
error_message: 1,2025/01/15 14:32:01,007200001234,SYSTEM,general,0,SYSTEM-cpu-critical,Data plane CPU at {fw_dp_cpu_pct}%
  (threshold {fw_cpu_threshold}%), management plane {fw_mgmt_cpu_pct}%, packet buffer {fw_buffer_pct}%, active rules {fw_policy_count}
stack_trace: |-
  > show running resource-monitor
  Resource utilization (observed over last 60 seconds):
    Data Plane CPU Utilization:
      DP-0:  {fw_dp_cpu_pct}%  (threshold: {fw_cpu_threshold}%)
      DP-1:  {fw_dp_cpu_pct}%
    Management Plane CPU: {fw_mgmt_cpu_pct}%
    Packet Buffer:        {fw_buffer_pct}%
    Active Security Rules: {fw_policy_count}
    Session Rate:          8,452 sessions/sec
    Throughput:            4.2 Gbps
    Packet Rate:           892,341 pps
correlation_attr:
  key: deployment.threat_sig_ver
  value: content-8845-8432-experimental
fault_params:
  fw_dp_cpu_pct: {uniform: [85.0, 99.0], round: 1}
  fw_cpu_threshold: 80
  fw_mgmt_cpu_pct: {uniform: [60.0, 90.0], round: 1}
  fw_buffer_pct: {uniform: [80.0, 98.0], round: 1}
  fw_policy_count: {randint: [800, 2500]}
rca_clues:
  firewall-gateway:
    firewall.dp_cpu_offender: threat-prevention
    firewall.threat_cpu_share_pct: {uniform: [55, 75], round: 1}
    firewall.ssl_decrypt_cpu_share_pct: {uniform: [5, 15], round: 1}
    firewall.packet_buffer_pct: {uniform: [80, 98], round: 1}
  network-controller:
    network.throughput_degraded: true
    network.latency_spike_ms: {randint: [50, 500]}
  dns-dhcp-service:
    dns.query_timeout_pct: {uniform: [15, 60], round: 1}
    dns.upstream_latency_ms: {randint: [200, 2000]}
  digital-marketplace:
    marketplace.page_load_ms: {randint: [3000, 15000]}
    marketplace.ssl_handshake_failures: {randint: [10, 100]}
business_impact:
  - kpi: business.app_sessions_per_min
    value: {uniform: [334.8, 385.2]}
  - kpi: business.page_views_per_min
    value: {uniform: [66960.0, 77040.0]}
  - kpi: business.merch_gmv_usd_per_min
    value: {uniform: [10416.0, 11984.0], round: 1}
  - kpi: business.ad_revenue_usd_per_min
    value: {uniform: [51382.0, 59118.0], round: 1}

name: Warehouse Scanner Desync
subsystem: logistics
vehicle_section: inventory_system
error_type: WMS-SCANNER-DESYNC
sensor_type: barcode_scanner
affected_services:
- packaging-fulfillment
- cloud-inventory-scanner
error_services:
- packaging-fulfillment
cascade_services:
- digital-marketplace
- card-printing-system
description: Barcode scanners losing synchronization with inventory management system
investigation_notes: |-
  Root cause: the MDM policy CR-2417 moved the wh01 MC9300 fleet from firmware 3.1.4 to 3.0.5 (mc9300-fw-3.0.5-known-bug). Devices only change firmware when they check in with MDM, so the desync spreads over about four minutes: out_of_sync climbs towards ~195 of 214 devices and the worst last_sync reaches {scanner_last_sync_sec}s against a {scanner_sync_max_sec}s limit. Firmware 3.0.x has a known keepalive bug against the WMS REST API, so upgraded scanners stop pushing scans and every missed scan becomes an inventory delta. The radio and the devices are healthy: RSSI is {scanner_rssi_dbm} dBm (above the -67 dBm floor) and battery is {scanner_battery_pct}%, so WiFi coverage, AP health and battery are ruled out, and devices that have not checked in yet stay in sync.
  Confirm:
    - packaging-fulfillment logs "wms.scanner_sync fleet=MC9300 site=wh01 ... firmware_policy=mc9300-fw-3.0.5-known-bug status=ANOMALY" (attributes.deployment.scanner_firmware); metric fulfillment.scanner_sync_lag_s climbs from ~5s to ~270s and fulfillment.scanner_devices_out_of_sync rises with it while fulfillment.scan_accuracy_pct falls
    - the packaging-fulfillment line "[MDM] MC9300 fleet site=wh01 firmware policy applied" comes before the first WMS-SCANNER-DESYNC
    - cloud-inventory-scanner then reports physical/digital mismatches for the zones those scanners cover
  Remediation: roll the wh01 MC9300 firmware policy back to the previous release (3.1.4) with opsctl rollback firmware/mc9300-wh01 --to-revision previous. Each scanner installs 3.1.4 at its next MDM check-in and re-registers with the WMS, so out_of_sync falls to 0 and last_sync back under 10 seconds over about five minutes, not at once. After that run a zone reconciliation (wms-cli reconcile --zone <zone> --source physical-count) to clear the inventory deltas the desync created.
remediation_action: resync_scanners
remediation_command: |-
  opsctl rollback firmware/mc9300-wh01 --to-revision previous
error_message: wms.inventory WMS-SCANNER-DESYNC scanner={scanner_id} zone={scanner_zone} last_sync={scanner_last_sync_sec}s
  (max {scanner_sync_max_sec}s) missed_scans={scanner_missed_scans} inventory_delta={inventory_delta} firmware=v{scanner_firmware}
stack_trace: |-
  WMS Scanner Sync Diagnostic Report
  ------------------------------------
  Scanner ID:     {scanner_id}
  Zone:           {scanner_zone}
  Last Sync:      {scanner_last_sync_sec}s ago (threshold: {scanner_sync_max_sec}s)
  Missed Scans:   {scanner_missed_scans}
  Inventory Delta: {inventory_delta} items
  Firmware:       v{scanner_firmware} (fleet policy mc9300-fw-3.0.5-known-bug)
  WiFi Signal:    {scanner_rssi_dbm} dBm (good)
  Battery Level:  {scanner_battery_pct}%
  Recommended Action: Roll the MC9300 fleet firmware policy back to the previous release
correlation_attr:
  key: deployment.scanner_firmware
  value: mc9300-fw-3.0.5-known-bug
fault_params:
  scanner_id: {choice: [SCN-WH-01, SCN-WH-02, SCN-WH-03, SCN-DOCK-01]}
  scanner_zone: {choice: [receiving, storage-A, storage-B, packing, shipping]}
  scanner_last_sync_sec: {randint: [250, 290]}
  scanner_sync_max_sec: 60
  scanner_missed_scans: {randint: [55, 80]}
  inventory_delta: {randint: [5, 50]}
  scanner_firmware: "3.0.5"
  scanner_rssi_dbm: {randint: [-62, -52]}
  scanner_battery_pct: {randint: [70, 95]}
rca_clues:
  packaging-fulfillment:
    warehouse.inventory_drift_items: {randint: [20, 200]}
    warehouse.scanner_firmware: "3.0.5"
    warehouse.scanner_rssi_dbm: {randint: [-62, -52]}
    warehouse.scanner_battery_pct: {randint: [70, 95]}
  cloud-inventory-scanner:
    cloud_scan.physical_digital_mismatch: {randint: [10, 100]}
    cloud_scan.reconciliation_failures: {randint: [5, 50]}
  digital-marketplace:
    marketplace.phantom_stock_skus: {randint: [5, 50]}
    marketplace.oversold_orders: {randint: [1, 20]}
  card-printing-system:
    print.reprint_triggered_by_desync: {randint: [3, 30]}
    print.inventory_hold: true
cascade_messages:
  cloud-inventory-scanner:
    - severity: WARN
      message: 'inventory.reconcile zone={scanner_zone} physical count differs from WMS by {inventory_delta} items; scanner feed stale for {scanner_last_sync_sec}s, reconciliation deferred'
  digital-marketplace:
    - severity: WARN
      message: 'inventory-sync: availability for zone={scanner_zone} is stale ({scanner_last_sync_sec}s); {inventory_delta} SKUs flagged as possible phantom stock, oversell guard enabled'
  card-printing-system:
    - severity: WARN
      message: 'print-staging: inventory hold placed on zone={scanner_zone} while WMS reports scanner desync (last_sync={scanner_last_sync_sec}s)'
fault_scope:
  workloads: [packaging-fulfillment, cloud-inventory-scanner]
infrastructure_events:
  - service: packaging-fulfillment
    severity: INFO
    offset_seconds: -120
    body: '[MDM] MC9300 fleet site=wh01 firmware policy applied: 3.1.4 -> 3.0.5; devices targeted=214, install at next check-in; pushed by wms-mdm-release (CR-2417)'
    attributes:
      user.name: wms-mdm-release
      change.request: CR-2417
      operation: firmware_load
      deployment.scanner_firmware: mc9300-fw-3.0.5-known-bug
      change.summary: 'MC9300 wh01 firmware policy: 3.1.4 -> 3.0.5'
remediation_effects:
  log_events:
    - service: packaging-fulfillment
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl rollback firmware/mc9300-wh01 --to-revision previous by {actor}: MC9300 wh01 firmware policy rolled back 3.0.5 -> 3.1.4'
      attributes:
        operation: change_applied
        change.target: firmware/mc9300-wh01
    - service: packaging-fulfillment
      severity: INFO
      offset_seconds: 120
      body: '[MDM] MC9300 fleet site=wh01 firmware 3.1.4 installed on 118/214 devices; remaining devices install at next check-in'
      attributes:
        operation: firmware_load
        deployment.scanner_firmware: mc9300-fw-3.1.4
    - service: packaging-fulfillment
      severity: INFO
      offset_seconds: 300
      body: '[MDM] MC9300 fleet site=wh01 firmware 3.1.4 installed on 214/214 devices; all scanners re-registered with WMS'
      attributes:
        operation: firmware_load
        deployment.scanner_firmware: mc9300-fw-3.1.4
  steady_attributes:
    packaging-fulfillment:
      deployment.scanner_firmware: mc9300-fw-3.1.4
  verification:
    - signal: fulfillment.scanner_sync_lag_s
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "packaging-fulfillment"'
      field: 'metrics.fulfillment.scanner_sync_lag_s'
      expect: 'back under 10 s (was ~270 s); falls over about 5 minutes as devices check in'
      within_seconds: 360
    - signal: fulfillment.scanner_devices_out_of_sync
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "packaging-fulfillment"'
      field: 'metrics.fulfillment.scanner_devices_out_of_sync'
      expect: 'under 5 of 214 devices (was ~195)'
      within_seconds: 360
    - signal: WMS-SCANNER-DESYNC lines
      from: 'logs.otel.fanatics'
      where: 'body.text LIKE "*WMS-SCANNER-DESYNC*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: MC9300 firmware policy
      from: 'logs.otel.fanatics'
      where: 'resource.attributes.service.name == "packaging-fulfillment"'
      field: 'attributes.deployment.scanner_firmware'
      expect: 'mc9300-fw-3.1.4 on every sync line logged since the fix; mc9300-fw-3.0.5-known-bug stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.merch_gmv_usd_per_min
    value: {uniform: [10416.0, 11984.0], round: 1}
  - kpi: business.loyalty_points_redeemed_per_min
    value: {uniform: [15112.0, 17388.0]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.sponsored_inventory_seconds_per_min
    value: {uniform: [148.8, 171.2]}
# dependents degrade after the component at fault, in dependency order
service_lag_seconds: {cloud-inventory-scanner: 60, digital-marketplace: 120, card-printing-system: 150}

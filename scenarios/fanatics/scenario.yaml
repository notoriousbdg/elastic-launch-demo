trace_attributes:
  base:
    platform.region: {choice: [us-east-1, us-central1, eastus]}
    platform.traffic_tier: {choice: [normal, normal, elevated, peak]}
  services:
    card-printing-system:
      print.batch_id:
        format: "BATCH-{n}"
        n: {randint: [1000, 9999]}
      print.card_rarity: {choice: [common, uncommon, rare, ultra-rare, 1-of-1]}
      print.line_number: {choice: [LINE-A, LINE-B, LINE-C]}
      print.substrate: {choice: [standard-cardstock, chrome-foil, refractor-film, acetate]}
    digital-marketplace:
      marketplace.listing_type: {choice: [buy-now, auction, make-offer, pre-order]}
      marketplace.price_tier: {choice: [budget, mid-range, premium, ultra-premium]}
      marketplace.cart_items: {randint: [1, 12]}
      marketplace.session_type: {choice: [browse, search, checkout, watchlist]}
    auction-engine:
      auction.state: {choice: [accepting_bids, going_once, going_twice, closed, extending]}
      auction.bid_count: {randint: [1, 250]}
      auction.reserve_met: {choice: [true, true, true, false]}
      auction.time_remaining_s: {randint: [0, 7200]}
    packaging-fulfillment:
      warehouse.zone: {choice: [receiving, storage-A, storage-B, packing, shipping-dock]}
      warehouse.pick_velocity: {choice: [normal, express, priority, rush]}
      warehouse.carrier: {choice: [UPS, FedEx, USPS, DHL]}
      warehouse.package_weight_oz: {uniform: [2.0, 48.0], round: 1}
    wifi-controller:
      wifi.ssid: {choice: [Fanatics-Corp, Fanatics-Warehouse, Fanatics-Guest, Fanatics-IoT]}
      wifi.band: {choice: [2.4GHz, 5GHz, 6GHz]}
      wifi.ap_count: {randint: [20, 120]}
      wifi.client_count: {randint: [50, 800]}
    cloud-inventory-scanner:
      cloud_scan.provider: {choice: [aws, azure, gcp]}
      cloud_scan.resource_count: {randint: [200, 5000]}
      cloud_scan.compliance_pct: {uniform: [75.0, 99.5], round: 1}
      cloud_scan.orphan_count: {randint: [0, 45]}
    network-controller:
      network.switch_tier: {choice: [core, distribution, access, spine, leaf]}
      network.vlan_count: {randint: [20, 200]}
      network.port_utilization_pct: {uniform: [30.0, 95.0], round: 1}
      network.protocol: {choice: [OSPF, BGP, RSTP, LACP]}
    firewall-gateway:
      firewall.zone_pair: {choice: ["TRUST->UNTRUST", "UNTRUST->DMZ", "TRUST->DMZ", "DMZ->TRUST"]}
      firewall.policy_count: {randint: [400, 2500]}
      firewall.session_rate: {randint: [2000, 12000]}
      firewall.threat_level: {choice: [low, medium, high, critical]}
    dns-dhcp-service:
      dns.query_type: {choice: [A, AAAA, CNAME, SRV, PTR, MX]}
      dns.zone: {choice: [fanatics.internal, warehouse.local, collectibles.prod]}
      dhcp.scope_utilization_pct: {uniform: [40.0, 98.0], round: 1}
      dhcp.lease_duration_s: {choice: [3600, 7200, 14400, 28800, 86400]}

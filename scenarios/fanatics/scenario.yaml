agent_config:
  id: fanatics-infra-analyst
  name: Infrastructure & Network Analyst
  assessment_tool_name: platform_load_assessment
  system_prompt: 'You are the Fanatics Infrastructure & Network Analyst, an expert AI assistant for enterprise network and
    infrastructure operations. You help NOC engineers investigate incidents, analyze telemetry data, and provide root cause
    analysis for fault conditions across 9 infrastructure services spanning AWS, GCP, and Azure. You have deep expertise in
    Cisco IOS-XE/NX-OS switching and routing, Palo Alto PAN-OS firewall management, Juniper Mist wireless LAN controllers,
    Infoblox DDI (DNS/DHCP/IPAM), AWS VPC networking, Azure Virtual Network, and GCP VPC. You understand BGP peering, spanning
    tree protocol, 802.1X/RADIUS authentication, SSL inspection, and cross-cloud VPN tunneling. When investigating incidents,
    search for these vendor-specific identifiers in logs: Cisco syslog mnemonics (SW_MATM-4-MACFLAP_NOTIF, SPANTREE-2-TOPO_CHANGE,
    BGP-3-NOTIFICATION), PAN-OS system events (SYSTEM-session-threshold, SYSTEM-cpu-critical, SYSTEM-cert-expire), Juniper
    Mist events (AP_DISCONNECTED, INTERFERENCE_DETECTED, AUTH_FAILURE_STORM), DNS/DHCP faults (NAMED-SERVFAIL-FORWARDER, DHCPD-LEASE-EXHAUSTION),
    commerce errors (BID_LATENCY_SLA_BREACH, PAYMENT_GATEWAY_TIMEOUT, CATALOG_SYNC_FAILURE), manufacturing faults (MES-QUEUE-OVERFLOW,
    MES-QC-REJECT-THRESHOLD), warehouse faults (WMS-LABEL-PRINTER-FAULT, WMS-SCANNER-DESYNC), and cloud ops events (CLOUD-ORPHANED-RESOURCE,
    VPN-TUNNEL-FLAP). Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: platform_load_assessment
  description: 'Comprehensive platform load assessment. Evaluates all infrastructure services against event-day readiness
    criteria. Returns data for load evaluation across networking, DNS, VPN, firewall, and cloud infrastructure systems. Log
    message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: digital-marketplace
executive_dashboard_intro: '**Fanatics executive KPIs** — sports media, streaming, fantasy, collectibles commerce, sponsorship,
  and regulated wagering (synthetic `business.*` from `digital-marketplace`).'
executive_kpi_sections:
- header: '**Monetization & wagering** — ads, subscriptions, handle, and margin'
  specs:
  - - Ad revenue (USD/min)
    - metrics.business.ad_revenue_usd_per_min
  - - Programmatic fill (%)
    - metrics.business.programmatic_fill_rate_pct
  - - Betting handle (USD/min)
    - metrics.business.betting_handle_usd_per_min
  - - Sportsbook hold (%)
    - metrics.business.betting_hold_pct
  - - Gross win (USD/min)
    - metrics.business.betting_gross_win_usd_per_min
  - - Subscription MRR (USD/min)
    - metrics.business.subscription_mrr_usd_per_min
- header: '**Audience & engagement** — live scale, video, traffic, sessions, fantasy'
  specs:
  - - Live concurrent viewers
    - metrics.business.live_concurrent_viewers
  - - Video min engaged / min
    - metrics.business.video_minutes_engaged_per_min
  - - Page views / min
    - metrics.business.page_views_per_min
  - - App sessions / min
    - metrics.business.app_sessions_per_min
  - - Content completion (%)
    - metrics.business.content_completion_rate_pct
  - - Fantasy active entries
    - metrics.business.fantasy_active_entries
- header: '**Commerce & partners** — merch, tickets, sponsorship, B2B data'
  specs:
  - - Merch GMV (USD/min)
    - metrics.business.merch_gmv_usd_per_min
  - - Live ticketing (USD/min)
    - metrics.business.live_event_ticketing_usd_per_min
  - - Partner sponsorship (USD/min)
    - metrics.business.partner_sponsorship_usd_per_min
  - - API / data partner (USD/min)
    - metrics.business.api_data_partner_revenue_usd_per_min
  - - Sponsored inv. (s/min)
    - metrics.business.sponsored_inventory_seconds_per_min
  - - Premium ARPU (USD)
    - metrics.business.premium_tier_arpu_usd
- header: '**Marketing & health** — CRM, loyalty, social, churn & satisfaction proxies'
  specs:
  - - Push CTR (%)
    - metrics.business.push_notification_ctr_pct
  - - Newsletter open (%)
    - metrics.business.newsletter_open_rate_pct
  - - Loyalty redeem (pts/min)
    - metrics.business.loyalty_points_redeemed_per_min
  - - Social clip shares / min
    - metrics.business.social_clip_shares_per_min
  - - Churn risk (0–100)
    - metrics.business.churn_risk_index_0_100
  - - Satisfaction proxy (NPS-like)
    - metrics.business.net_satisfaction_proxy_nps

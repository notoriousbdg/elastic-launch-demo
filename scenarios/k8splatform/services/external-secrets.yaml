service: external-secrets
sort_order: 8
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_eks
cloud_availability_zone: us-east-1c
subsystem: secrets
language: go
generates_traces: false

# External Secrets Operator syncing AWS Secrets Manager into Kubernetes Secrets via
# IRSA (role external-secrets-irsa).
topology: []

emit_fault_logs: true
kpi_emitter: false

constants:
  EXTERNAL_SECRETS:
    - [tenant-edge, tenant-gateway-db]
    - [tenant-edge, tenant-gateway-signing-key]
    - [tenant-core, billing-api-db]
    - [tenant-core, usage-api-kafka]

steps:
  - sample:
      es: {choice: EXTERNAL_SECRETS}
      ok: {expr: "3 if 11 not in all_active else 0"}
  - every:
      seconds: 60
      state_key: _last_reconcile
      steps:
        - log:
            level: INFO
            message: '{{"level":"info","ts":{epoch_now},"logger":"controllers.ExternalSecret","msg":"reconciled secret","ExternalSecret":{{"name":"{es[1]}","namespace":"{es[0]}"}},"refreshInterval":"1h"}}'
            attrs:
              k8s.namespace.name: {expr: "es[0]"}
              externalsecret.name: {expr: "es[1]"}
  - metric: {name: externalsecret.sync_calls_ok_per_min, value: {var: ok}, unit: '{call}/min'}

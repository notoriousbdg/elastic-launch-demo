name: tenant-gateway database authentication failures after secret rotation
subsystem: secrets
vehicle_section: external-secrets/irsa
error_type: Not authorized to perform sts:AssumeRoleWithWebIdentity
sensor_type: secret_sync
affected_services:
  - external-secrets
  - tenant-gateway
error_services:
  - external-secrets
cascade_services: []
description: tenant-gateway cannot open new database connections and its pods start crash-looping. The database password
  was rotated but the new value never reached the cluster.
investigation_notes: |-
  Root cause: two events. First, the trust policy of the external-secrets-irsa role was edited and its sub condition now names system:serviceaccount:external-secrets:{wrong_sa} instead of the external-secrets service account, so the operator can no longer assume the role. Then the scheduled Secrets Manager rotation of {secret_id} succeeded and changed the database password. The ExternalSecret cannot refresh, the Kubernetes Secret still holds the old password, and new connections from tenant-gateway fail; existing pooled connections keep working at first, so errors grow gradually.
  Confirm:
    - external-secrets: AccessDenied: Not authorized to perform sts:AssumeRoleWithWebIdentity (role external-secrets-irsa); ExternalSecret tenant-edge/tenant-gateway-db SecretSyncedError
    - CloudTrail: UpdateAssumeRolePolicy on external-secrets-irsa, then RotationSucceeded for {secret_id}
    - tenant-gateway: FATAL: password authentication failed for user "gateway_cfg"; pods restarting (CrashLoopBackOff) as readiness depends on the config store
    - aws iam get-role --role-name external-secrets-irsa --query Role.AssumeRolePolicyDocument
  Remediation: restore the previous trust policy, then force a sync of the ExternalSecret so the Secret picks up the rotated password; reloader rolls tenant-gateway.
  Follow-up: revert the Terraform change to the external-secrets-irsa trust policy in the infrastructure repository before the next Atlantis apply; otherwise the apply undoes the fix.
remediation_action: restore_irsa_trust_and_sync
remediation_command: |-
  opsctl restore iam-role-trust/external-secrets-irsa --version previous
  opsctl sync externalsecret/tenant-gateway-db -n tenant-edge
error_message: '{{"level":"error","ts":{epoch_now},"logger":"controllers.ExternalSecret","msg":"error retrieving secret at .data[0],
  key: {secret_id}, err: operation error Secrets Manager: GetSecretValue, get identity: get credentials: failed to refresh
  cached credentials, failed to retrieve credentials, operation error STS: AssumeRoleWithWebIdentity, https response error StatusCode:
  403, RequestID: {request_id}, api error AccessDenied: Not authorized to perform sts:AssumeRoleWithWebIdentity","ExternalSecret":{{"name":"tenant-gateway-db","namespace":"tenant-edge"}}}}'
stack_trace: ''
fault_params:
  secret_id: prod/tenant-gateway/db
  wrong_sa: external-secrets-sa
  request_id: {format: '{a}-{b}-4{c}', a: {randint: [10000000, 99999999]}, b: {randint: [1000, 9999]}, c: {randint: [100, 999]}}
rca_clues:
  external-secrets:
    aws.iam.role: external-secrets-irsa
    aws.sts.error: AccessDenied
    externalsecret.status: SecretSyncedError
  tenant-gateway:
    db.user: gateway_cfg
    db.system.name: postgresql
cascade_messages:
  tenant-gateway:
    - severity: ERROR
      message: 'config store connection failed: failed to connect to `host=tenant-config.cluster-c9xk2p7f1q.us-east-1.rds.amazonaws.com
        user=gateway_cfg database=gateway`: server error (FATAL: password authentication failed for user "gateway_cfg" (SQLSTATE
        28P01))'
fault_scope:
  cluster: prod-use1
  workloads: [tenant-gateway]
onset_delay_seconds: 120
ramp_seconds: 240
generator_impact:
  kubernetes_otel:
    pod_crashloopbackoff: 1.0
infrastructure_events:
  - service: kube-apiserver
    severity: INFO
    offset_seconds: -600
    body: 'cloudtrail: eventSource=iam.amazonaws.com eventName=UpdateAssumeRolePolicy userIdentity=arn:aws:sts::752253522700:assumed-role/terraform-platform/atlantis
      requestParameters.roleName=external-secrets-irsa requestParameters.policyDocument.Statement[0].Condition.StringEquals.oidc.eks.us-east-1.amazonaws.com/id/7C1E9A44D2B85F0E36A1:sub=system:serviceaccount:external-secrets:external-secrets-sa'
    attributes:
      aws.cloudtrail.event_name: UpdateAssumeRolePolicy
  - service: kube-apiserver
    severity: INFO
    offset_seconds: -30
    body: 'cloudtrail: eventSource=secretsmanager.amazonaws.com eventName=RotationSucceeded requestParameters.secretId=prod/tenant-gateway/db
      additionalEventData.RotationStrategy=single-user'
    attributes:
      aws.cloudtrail.event_name: RotationSucceeded
remediation_effects:
  transition_seconds: 300
  log_events:
    - service: external-secrets
      severity: INFO
      offset_seconds: 10
      body: '{{"level":"info","ts":{epoch_now},"logger":"controllers.ExternalSecret","msg":"reconciled secret","ExternalSecret":{{"name":"tenant-gateway-db","namespace":"tenant-edge"}},"status":"SecretSynced"}}'
    - service: kube-apiserver
      severity: INFO
      offset_seconds: 15
      body: 'audit: level=Metadata verb=patch resource=deployments namespace=tenant-edge name=tenant-gateway user=system:serviceaccount:reloader:reloader
        code=200 annotation=reloader.stakater.com/last-reloaded-from=secret-tenant-gateway-db'
  verification:
    - signal: AssumeRoleWithWebIdentity failures
      from: 'logs.otel.platform'
      where: 'resource.attributes.service.name == "external-secrets" AND body.text LIKE "*AssumeRoleWithWebIdentity*"'
      expect: '0 new lines; a reconciled secret line with status SecretSynced'
      within_seconds: 60
    - signal: tenant-gateway auth failures and restarts
      from: 'metrics-k8sclusterreceiver.otel-*'
      field: 'metrics.k8s.container.restarts'
      where: 'resource.attributes.k8s.deployment.name == "tenant-gateway" AND resource.attributes.k8s.cluster.name == "prod-use1"'
      expect: 'no new password authentication failures; k8s.container.restarts stops increasing'
      within_seconds: 360
business_impact:
  - kpi: business.api_availability_pct
    value: {uniform: [98.2, 98.8], round: 3}
  - kpi: business.api_5xx_rate_pct
    value: {uniform: [1.2, 1.8], round: 3}
  - kpi: business.error_budget_burn_rate
    value: {uniform: [14.0, 20.0], round: 2}

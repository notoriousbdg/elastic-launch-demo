name: Public API returning 503 because the gateway Service has no endpoints
subsystem: ingress
vehicle_section: tenant-edge/service-selector
error_type: does not have any active Endpoint
sensor_type: service_endpoints
affected_services:
  - ingress-nginx
cascade_services: []
description: Every request to api.example-saas.io returns 503 from the ingress. The tenant-gateway pods are healthy but
  receive no traffic.
investigation_notes: |-
  Root cause: the blue/green deploy pipeline switched the tenant-gateway Service selector to track: {new_track} (audit, {pipeline_sa}) before the green Deployment had any pods. The selector matches no pods, the EndpointSlice for the Service is empty, and ingress-nginx has no upstream to send to.
  Confirm:
    - ingress-nginx: Service "tenant-edge/tenant-gateway" does not have any active Endpoint.; 503s with upstream "-" in the access log
    - tenant-gateway's own access log goes quiet (no requests arrive) while its pods stay Running and ready
    - audit: patch services/tenant-gateway selector track: blue -> green shortly before the first 503
    - tenant-gateway-green has 0 replicas: metrics.k8s.deployment.desired = 0 in metrics-k8sclusterreceiver.otel-* where resource.attributes.k8s.deployment.name == "tenant-gateway-green" (the blue tenant-gateway Deployment keeps its 8)
    - kubectl -n tenant-edge get endpointslices -l kubernetes.io/service-name=tenant-gateway
  Remediation: roll the Service back to its previous selector (track: blue); endpoints repopulate immediately.
remediation_action: rollback_service
remediation_command: |-
  opsctl rollback service/tenant-gateway -n tenant-edge
error_message: 'W{klog_time}       7 controller.go:1214] Service "tenant-edge/tenant-gateway" does not have any active Endpoint.'
stack_trace: ''
fault_params:
  new_track: green
  pipeline_sa: system:serviceaccount:delivery:bluegreen-pipeline
rca_clues:
  ingress-nginx:
    k8s.service.name: tenant-gateway
    k8s.service.selector: track=green
    k8s.endpointslice.ready_endpoints: 0
cascade_messages: {}
fault_scope:
  cluster: prod-use1
  workloads: [ingress-nginx-controller]
onset_delay_seconds: 10
infrastructure_events:
  - service: kube-apiserver
    severity: INFO
    offset_seconds: -15
    body: 'audit: level=RequestResponse stage=ResponseComplete verb=patch resource=services namespace=tenant-edge name=tenant-gateway
      user=system:serviceaccount:delivery:bluegreen-pipeline code=200 change="spec.selector.track: blue -> green" pipeline.run=bg-2291'
    attributes:
      k8s.audit.verb: patch
      k8s.audit.resource: services
      user.name: system:serviceaccount:delivery:bluegreen-pipeline
remediation_effects:
  transition_seconds: 20
  log_events:
    - service: kube-apiserver
      severity: INFO
      offset_seconds: 2
      body: 'audit: level=Metadata verb=patch resource=services namespace=tenant-edge name=tenant-gateway user={actor}
        code=200 change="spec.selector.track: green -> blue"'
  verification:
    - signal: no-endpoint warnings
      from: 'logs.otel.platform'
      where: 'resource.attributes.service.name == "ingress-nginx" AND body.text LIKE "*does not have any active Endpoint*"'
      expect: '0 new lines'
      within_seconds: 30
    - signal: 503s in the ingress-nginx access log
      from: 'logs.otel.platform'
      where: 'resource.attributes.service.name == "ingress-nginx" AND attributes.http.response.status_code == 503'
      expect: '0; tenant-gateway access log volume back to normal'
      within_seconds: 60
business_impact:
  - kpi: business.api_availability_pct
    value: {uniform: [1.0, 3.0], round: 3}
  - kpi: business.api_5xx_rate_pct
    value: {uniform: [96.0, 99.0], round: 3}
  - kpi: business.error_budget_burn_rate
    value: {uniform: [900.0, 1000.0], round: 2}
# Who applies the remediation and its follow-up (rendered into the Wiki runbook).
owner:
  team: API Gateway
  slack: '#api-gateway'
  oncall_slack: '#api-gateway-oncall'
  email: api-gateway-oncall@example-saas.io

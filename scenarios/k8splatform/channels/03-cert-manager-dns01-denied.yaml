  verification:
    - signal: cert-manager AccessDenied lines
      from: 'logs.otel.platform'
      where: 'resource.attributes.service.name == "cert-manager" AND body.text LIKE "*route53:ChangeResourceRecordSets*"'
      expect: '0 new lines'
      within_seconds: 120

# ── Pinned platform (schema 1.3) ────────────────────────────────────────────────
# Every node count, node name, pod IP, instance type and kubelet version quoted in a
# log line comes from this block. Pools that are rolled out by a change (general-m7i,
# arm-m7g) start at zero nodes; the channel that adds them carries a fault_state.
k8s_topology:
  default_cluster: prod-use1
  clusters:
    - name: prod-use1
      provider: aws
      platform: aws_eks
      region: us-east-1
      vpc_cidr: 10.42.0.0/16
      service_cidr: 172.20.0.0/16
      kube_dns_ip: 172.20.0.10
      node_name_format: 'ip-{ip_dashed}.ec2.internal'
      subnets:
        us-east-1a: 10.42.32.0/23
        us-east-1b: 10.42.36.0/23
        us-east-1c: 10.42.40.0/23
      node_pools:
        - name: system
          count: 3
          instance_types: [m6i.large]
          cpu: 2
          memory_gib: 8
          os_image: Amazon Linux 2023.6.20250115
          kubelet_version: v1.30.4-eks-a737599
          nodes: [ip-10-42-40-12.ec2.internal]
        - name: edge-c6i
          count: 6
          instance_types: [c6i.2xlarge]
          cpu: 8
          memory_gib: 16
          os_image: Amazon Linux 2023.6.20250115
          kubelet_version: v1.30.4-eks-a737599
          nodes: [ip-10-42-33-51.ec2.internal]
        - name: general-c6i
          count: 24
          instance_types: [c6i.4xlarge]
          cpu: 16
          memory_gib: 32
          os_image: Amazon Linux 2023.6.20250115
          kubelet_version: v1.30.4-eks-a737599
          nodes: [ip-10-42-36-17.ec2.internal]
        - name: batch-spot
          count: 8
          capacity_type: SPOT
          instance_types: [c6i.4xlarge, c6a.4xlarge, m6i.4xlarge, m7i.4xlarge]
          cpu: 16
          memory_gib: 32
          os_image: Amazon Linux 2023.6.20250115
          kubelet_version: v1.30.4-eks-a737599
          taints: ['workload=batch:NoSchedule']
        - name: general-m7i
          count: 0
          instance_types: [m7i.2xlarge]
          cpu: 8
          memory_gib: 32
          os_image: Ubuntu 22.04.5 LTS
          kubelet_version: v1.30.4-eks-a737599
        - name: arm-m7g
          count: 0
          arch: arm64
          instance_types: [m7g.2xlarge]
          cpu: 8
          memory_gib: 32
          os_image: Amazon Linux 2023.6.20250115
          kubelet_version: v1.30.4-eks-a737599

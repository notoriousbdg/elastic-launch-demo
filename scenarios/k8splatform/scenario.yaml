agent_config:
  id: platform-sre-analyst
  name: Platform SRE Analyst
  assessment_tool_name: platform_readiness_assessment
  system_prompt: "You are an SRE on the platform team that runs the shared EKS clusters (prod-use1, prod-use2, prod-euw1)\
    \ behind api.example-saas.io.\n\nWhen an incident is reported:\n1. Find the change or event that preceded the first\
    \ errors (Argo CD syncs, audit records, CloudTrail, rollouts, provider health events)\n2. Confirm the cause from the\
    \ component logs and their attributes, then from k8s metrics and events\n3. Recommend the opsctl remediation from the\
    \ runbook and the signals that will confirm recovery\n\nKnown failure signatures (search body.text):\n  - 10.20.8.53:53:\
    \ i/o timeout: CoreDNS corp.internal forward to unreachable resolvers\n  - nf_conntrack: table full, dropping packet:\
    \ Edge node conntrack exhaustion\n  - is not authorized to perform: route53:ChangeResourceRecordSets: cert-manager DNS-01\
    \ challenge denied\n  - PLEG is not healthy: Node NotReady (kubelet PLEG)\n  - code=429 reason=TooManyRequests: API\
    \ priority level saturated\n  - failed calling webhook: Admission webhook timeouts\n  - toomanyrequests: You have reached\
    \ your unauthenticated pull rate limit: Registry proxy cache pull limit\n  - UnfulfillableCapacity: Autoscaler cannot\
    \ add Spot nodes\n  - failed to assign an IP address to container: VPC CNI IP exhaustion\n  - Cannot evict pod as it\
    \ would violate the pod disruption budget: Node group upgrade blocked by PDB\n  - Not authorized to perform sts:AssumeRoleWithWebIdentity:\
    \ external-secrets IRSA trust failure\n  - The node was low on resource: ephemeral-storage: Ephemeral storage evictions\n\
    \  - exited on signal 9: ingress-nginx OOMKilled during reload storm\n  - 10.42.0.2:53: i/o timeout: ndots amplification\
    \ against the VPC resolver\n  - Another app is currently holding the xtables lock: kube-proxy sync blocked\n  - plugin/loop:\
    \ Loop: CoreDNS forwarding loop on new nodes\n  - response_flags=UO: tenant-gateway saturated by a retry storm\n  -\
    \ filesystem: no space left on device: Harbor registry volume full\n  - exec format error: fluent-bit image missing arm64\n\
    \  - does not have any active Endpoint: Service selector matches no pods\n\nCompare the affected cluster, pool or zone\
    \ with the healthy ones before concluding."
assessment_tool_config:
  id: platform_readiness_assessment
  description: 'Platform readiness assessment for the shared EKS clusters. Evaluates DNS resolution, ingress health, certificate
    renewal, node readiness, control-plane latency, capacity headroom, registry and log pipeline health against their own
    baselines, and returns the evidence for each. Log message field: body.text (never use ''body'' alone).'
# Exec dashboard overview: infra services without traces show an error-log ratio
# (instead of N/A), and the clusters with no pinned services show per-cluster health.
dashboard_log_error_services: [ingress-nginx, coredns, cert-manager, cluster-autoscaler, external-secrets, harbor-registry]
dashboard_cluster_health_tiles: true
executive_kpi_emitter_service_name: tenant-gateway
executive_dashboard_intro: '**Platform service levels** — public API, cluster services, delivery and capacity for the shared
  EKS platform. `business.*` gauges reported by the platform SLO exporter.'
executive_kpi_sections:
  - header: '**Public API** — what tenants experience on api.example-saas.io'
    specs:
      - [Availability (%), metrics.business.api_availability_pct]
      - [P99 latency (ms), metrics.business.api_p99_latency_ms]
      - [5xx rate (%), metrics.business.api_5xx_rate_pct]
      - [Requests / s, metrics.business.api_requests_per_s]
      - [TLS handshake success (%), metrics.business.tls_handshake_success_pct]
      - [Error budget burn rate, metrics.business.error_budget_burn_rate]
  - header: '**Cluster services** — DNS, control plane, nodes'
    specs:
      - [DNS success (%), metrics.business.dns_success_rate_pct]
      - [Control plane p99 (ms), metrics.business.control_plane_p99_ms]
      - [Nodes ready (%), metrics.business.nodes_ready_pct]
      - [Cordoned nodes, metrics.business.cordoned_nodes]
      - [Nodes on target Kubernetes version (%), metrics.business.nodes_on_target_version_pct]
      - [Certificate renewals succeeding (%), metrics.business.cert_renewal_success_pct]
  - header: '**Delivery and capacity** — deploys, scheduling, batch, registry, logs'
    specs:
      - [Deploy success (%), metrics.business.deploy_success_rate_pct]
      - [Pod start p95 (s), metrics.business.pod_start_p95_s]
      - [Pending pods, metrics.business.pending_pods]
      - [Batch jobs succeeding (%), metrics.business.batch_jobs_success_pct]
      - [Registry push success (%), metrics.business.registry_push_success_pct]
      - [Log pipeline coverage (%), metrics.business.log_pipeline_coverage_pct]
      - [Node agents ready (%), metrics.business.daemonset_ready_pct]
executive_trend_charts:
  - {title: API availability (%), field: metrics.business.api_availability_pct, y_label: '%'}
  - {title: API p99 latency (ms), field: metrics.business.api_p99_latency_ms, y_label: ms}
  - {title: DNS success (%), field: metrics.business.dns_success_rate_pct, y_label: '%'}
  - {title: Pending pods, field: metrics.business.pending_pods, y_label: pods}
  - {title: Nodes ready (%), field: metrics.business.nodes_ready_pct, y_label: '%'}
  - {title: Error budget burn rate, field: metrics.business.error_budget_burn_rate, y_label: x}
executive_kpi_emissions:
  - {name: business.api_availability_pct, better: higher, value: {uniform: [99.95, 99.99], round: 3}, unit: '%'}
  - {name: business.api_p99_latency_ms, better: lower, value: {uniform: [180.0, 260.0], round: 0}, unit: ms}
  - {name: business.api_5xx_rate_pct, better: lower, value: {uniform: [0.02, 0.08], round: 3}, unit: '%'}
  - {name: business.api_requests_per_s, better: higher, value: {uniform: [3800.0, 5200.0], round: 0}, unit: req/s}

scenario_id: k8splatform
scenario_name: Kubernetes Platform Operations
scenario_description: Internal platform team running a shared multi-tenant EKS platform (three clusters, us-east-1, us-east-2
  and eu-west-1) behind the public API api.example-saas.io. Faults are infrastructure faults (DNS, conntrack, certificates,
  nodes, control plane, capacity, registry) caught from component logs.
namespace: platform
scenario_icon: ☸️
sort_order: 0
nominal_label: HEALTHY
schema_version: '1.3'
apm_ml_bucket_span: 5m

# Infrastructure scenario: the k8s and host generators carry the corroborating
# metrics; component logs come from the nine services. No JVM, no nginx package
# (ingress-nginx logs come from its own service), no app-tier raw access logs.
generators:
  kubernetes_otel: true
  host_metrics: true
  traces: true
  jvm: false
  nginx_otel: false
  nginx_metrics: false
  raw_access: false
  gcp_vpcflow_otel: false
  azure_vnetflow_otel: false
  aws_vpcflow_otel: false

workflow_template_inputs:
  service_name: tenant-gateway


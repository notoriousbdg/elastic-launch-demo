        - name: tenant-gateway
          kind: Deployment
          namespace: tenant-edge
          service: tenant-gateway
          node_pool: general-c6i
          replicas: 8
          image: harbor.example-saas.io/platform/tenant-gateway:v2.14.0
          container: gateway
          cpu_request: 2
          cpu_limit: 2
          memory_request: 2Gi
          memory_limit: 2Gi
          cpu_util: [0.55, 0.65]
          memory_util: [0.45, 0.55]
          hpa: {min: 4, max: 20, target_cpu: 0.70}
        # The green half of the blue/green pair: scaled to zero between releases.
        # The deploy pipeline scales it up before switching the Service selector.
        - name: tenant-gateway-green
          kind: Deployment
          namespace: tenant-edge
          node_pool: general-c6i
          replicas: 0
          image: harbor.example-saas.io/platform/tenant-gateway:v2.15.0
          container: gateway
          cpu_request: 2
          cpu_limit: 2
          memory_request: 2Gi
          memory_limit: 2Gi

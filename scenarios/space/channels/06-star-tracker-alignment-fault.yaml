name: Star Tracker Alignment Fault
subsystem: guidance
vehicle_section: avionics
error_type: GNC-STAR-TRACKER-ALIGN
sensor_type: star_tracker
affected_services:
- navigation
- sensor-validator
cascade_services:
- mission-control
description: Star tracker optical alignment exceeds tolerance
investigation_notes: |-
  Root cause: Star Tracker A was loaded with software image star-tracker-v3.1.0-beta (was star-tracker-v3.0.4) shortly before the first alignment fault. The beta image applies a new boresight calibration table in its centroiding step, so every star position is shifted: the boresight error reads {error_arcsec} arcsec against a {limit_arcsec} arcsec limit and only 5-11 of 22 catalog stars match (minimum 12). The optics are not the cause: CCD temperature stays near -28C (under -25C, low dark current), integration time is nominal, there is no thruster plume impingement and the attitude quaternion shows no discontinuity from a bracket shift.
  Confirm:
    - navigation logs the ST-A software load of star-tracker-v3.1.0-beta before the first GNC-STAR-TRACKER-ALIGN line
    - navigation star_tracker lines: image=star-tracker-v3.1.0-beta, catalog_matches under 12, status=ANOMALY; attributes.deployment.image_tag
    - metrics.navigation.star_tracker.alignment_arcsec at 10-45 arcsec (nominal under 3)
    - GPS and IMU readings stay NOMINAL
  Remediation: roll Star Tracker A back to the previous image (opsctl rollback image/star-tracker-a --to-revision previous). The tracker restarts on star-tracker-v3.0.4, reacquires the catalog and the boresight error converges back under 5 arcsec within about a minute. Hold the beta image until its calibration table is checked; switch to Star Tracker B only if the error persists on v3.0.4.
remediation_action: recalibrate_navigation
remediation_command: |-
  opsctl rollback image/star-tracker-a --to-revision previous
error_message: '[GNC] GNC-STAR-TRACKER-ALIGN: boresight_error={error_arcsec}arcsec limit={limit_arcsec}arcsec catalog_match=DEGRADED'
stack_trace: |-
  == GN&C SYSTEM STATUS == STAR TRACKER ASSEMBLY ==
  TIMESTAMP: MET+00:04:14.501 | FRAME: 0x4A34 | SEQ: 18447
  ---------------------------------------------------------------
  PARAMETER            VALUE        LIMIT      STATUS
  BORESIGHT_ERROR      {error_arcsec}arcsec   {limit_arcsec}arcsec  **FAULT**
  CATALOG_MATCHES      8/22         12 min     DEGRADED
  CCD_TEMP             -28.4C       -25.0C     NOMINAL
  INTEGRATION_TIME     250ms        500ms      NOMINAL
  ---------------------------------------------------------------
  IMAGE: star-tracker-v3.1.0-beta | ATTITUDE_SOURCE: STAR_TRACKER_A | QUATERNION: [0.707, 0.0, 0.707, 0.0]
  GNC-STAR-TRACKER-ALIGN: Boresight error {error_arcsec} arcsec exceeds {limit_arcsec} limit
  ACTION: Check the tracker software image and calibration table
correlation_attr:
  key: deployment.image_tag
  value: star-tracker-v3.1.0-beta
fault_params:
  error_arcsec: {uniform: [10.0, 45.0], round: 1}
  limit_arcsec: 5.0
rca_clues:
  navigation:
    gnc.st_catalog_matches: {randint: [5, 11]}
    gnc.ccd_temp_c: {uniform: [-30, -25], round: 1}
  sensor-validator:
    validation.boresight_error_arcsec: {uniform: [8.0, 40.0], round: 1}
    validation.optics_contamination: false
    validation.st_image: star-tracker-v3.1.0-beta
  mission-control:
    upstream.degraded_subsystem: guidance
cascade_messages:
  mission-control:
    - severity: WARN
      message: '[MCC] GNC attitude source STAR_TRACKER_A boresight error {error_arcsec}arcsec > {limit_arcsec}arcsec; attitude knowledge DEGRADED'
fault_scope:
  workloads: [navigation, sensor-validator]
infrastructure_events:
  - service: navigation
    severity: INFO
    offset_seconds: -120
    body: '[GNC] ST-A software load complete: image star-tracker-v3.1.0-beta (was star-tracker-v3.0.4), checksum verified, tracker restarted; loaded by gnc-flight-sw-ci (CR-2310, beta validation)'
    attributes:
      user.name: gnc-flight-sw-ci
      change.request: CR-2310
      deployment.image_tag: star-tracker-v3.1.0-beta
      operation: software_load
remediation_effects:
  log_events:
    - service: mission-control
      severity: INFO
      offset_seconds: 2
      body: '[MCC] CMD ACCEPTED opsctl rollback image/star-tracker-a --to-revision previous from {actor}: ST-A image star-tracker-v3.1.0-beta -> star-tracker-v3.0.4'
    - service: navigation
      severity: INFO
      offset_seconds: 40
      body: '[GNC] ST-A image star-tracker-v3.0.4 loaded; catalog_matches 21/22 boresight 2.1arcsec NOMINAL'
  verification:
    - signal: navigation.star_tracker.alignment_arcsec
      from: 'metrics-generic.otel-default'
      field: 'metrics.navigation.star_tracker.alignment_arcsec'
      where: 'resource.attributes.service.name == "navigation"'
      expect: 'below 5 arcsec (was 10-45), converging over about a minute'
      within_seconds: 120
    - signal: GNC-STAR-TRACKER-ALIGN errors
      from: 'logs.otel.nova7'
      where: 'body.text LIKE "*GNC-STAR-TRACKER-ALIGN*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: Star Tracker A image
      from: 'logs.otel.nova7'
      where: 'resource.attributes.service.name == "navigation"'
      field: 'attributes.deployment.image_tag'
      expect: 'star-tracker-v3.0.4 on the latest star_tracker lines (was star-tracker-v3.1.0-beta)'
      within_seconds: 120
business_impact:
  - kpi: business.maneuver_accuracy_pct
    factor: {uniform: [0.50, 0.75]}
  - kpi: business.trajectory_deviation_meters
    factor: {uniform: [3.5, 9.0]}
  - kpi: business.mission_success_probability_pct
    factor: {uniform: [0.70, 0.88]}
  - kpi: business.autonomous_recovery_rate_pct
    factor: {uniform: [0.60, 0.82]}

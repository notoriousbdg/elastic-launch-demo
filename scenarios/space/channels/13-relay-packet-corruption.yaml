name: Relay Packet Corruption
subsystem: relay
vehicle_section: ground_network
error_type: RLY-PACKET-CORRUPT
sensor_type: data_integrity
affected_services:
- telemetry-relay
- sensor-validator
cascade_services:
- mission-control
description: Telemetry packets failing integrity checks during relay
investigation_notes: 'Root cause: the SFP transceiver on route {route_id} (FTRJ1319P1BTL-v2, serial FTRJ1319P1BTL-A7731) is
  failing. Its receive power was already marginal at -14.2dBm a couple of minutes before the first CRC failures (Telemetry Relay
  logged the DOM warning) and has since fallen below -18dBm. Burst error pattern on CRC32-C failures indicates a physical layer
  issue; burst errors (vs random) rule out EMI and point to this one link segment. The other routes (GCP-AZ-01, AWS-AZ-01) are clean,
  so NIC firmware and the relay software are not the cause. The link_status log shows the falling sfp_rx and the CRC failure
  rate. Remediation: swap the transceiver on {route_id} for a spare (opsctl replace transceiver/aws-gcp-01). Recovery: the
  link retrains on the spare; relay.corrupted_frames_pct falls back to ~0% within about 30 seconds, sfp_rx returns to about
  -6dBm, the link_status log shows transceiver=FTRJ1319P1BTL-B2204 status=NOMINAL and the RLY-PACKET-CORRUPT errors stop.
  Afterwards clean the fiber connectors with IPA wipes and check for recent rack maintenance that could have disturbed fiber runs.'
remediation_action: reset_relay_link
remediation_command: |-
  opsctl replace transceiver/aws-gcp-01
error_message: '[RLY] RLY-PACKET-CORRUPT: route={route_id} corrupted={corrupted_count}/{total_count} crc_fail_rate={corrupted_count}pkt'
stack_trace: |-
  == RELAY DIAGNOSTIC REPORT == INTEGRITY CHECKER ==
  TIMESTAMP: MET+00:04:17.228 | FRAME: 0x4A3B | SEQ: 18454
  ---------------------------------------------------------------
  ROUTE       TOTAL    CORRUPT   CRC_FAIL   STATUS
  {route_id}   {total_count}     {corrupted_count}        {corrupted_count}         **CORRUPT**
  GCP-AZ-01   487      0         0          NOMINAL
  AWS-AZ-01   392      1         1          NOMINAL
  ---------------------------------------------------------------
  CRC_TYPE: CRC32-C | WINDOW: 60s | ERROR_PATTERN: BURST
  RLY-PACKET-CORRUPT: {corrupted_count} of {total_count} packets failed CRC on route {route_id}
  ACTION: Check physical layer, verify NIC firmware version
correlation_attr:
  key: infra.sfp_model
  value: FTRJ1319P1BTL-v2
fault_params:
  route_id: AWS-GCP-01
  corrupted_count: {randint: [5, 50]}
  total_count: {randint: [100, 500]}
rca_clues:
  telemetry-relay:
    relay.crc_fail_pattern: burst
    relay.sfp_rx_power_dbm: {uniform: [-22.0, -18.5], round: 1}
  sensor-validator:
    validation.data_integrity: compromised
    validation.corrupt_route: AWS-GCP-01
  mission-control:
    upstream.degraded_subsystem: relay
business_impact:
  - kpi: business.telemetry_coverage_pct
    factor: {uniform: [0.50, 0.75]}
  - kpi: business.packet_loss_rate_pct
    factor: {uniform: [4.0, 9.0]}
  - kpi: business.downlink_data_rate_mbps
    factor: {uniform: [0.55, 0.80]}
  - kpi: business.spacecraft_health_index_0_100
    factor: {uniform: [0.70, 0.88]}
cascade_messages:
  mission-control:
  - severity: WARN
    message: '[MCC] telemetry frames rejected: {corrupted_count} of {total_count} packets on relay route {route_id} failed CRC,
      gaps in the vehicle telemetry stream'
  - severity: WARN
    message: '[MCC] downlink integrity caution: relay route {route_id} burst CRC errors, requesting frame retransmission'
fault_scope:
  workloads: [telemetry-relay, sensor-validator]
infrastructure_events:
- service: telemetry-relay
  severity: WARN
  offset_seconds: -120
  body: '[RLY] DOM warning link=AWS-GCP-01 transceiver=FTRJ1319P1BTL-A7731 sfp_rx=-14.2dBm low_warn=-14.0dBm low_alarm=-18.0dBm
    status=MARGINAL'
  attributes:
    operation: link_status
    relay.route_id: AWS-GCP-01
    relay.sfp_rx_power_dbm: -14.2
    relay.transceiver_serial: FTRJ1319P1BTL-A7731
remediation_effects:
  log_events:
  - service: mission-control
    severity: INFO
    offset_seconds: 1
    body: '[MCC] CMD ACCEPTED opsctl replace transceiver/aws-gcp-01 from {actor}: AWS-GCP-01 SFP FTRJ1319P1BTL-A7731 -> spare
      FTRJ1319P1BTL-B2204'
  - service: telemetry-relay
    severity: INFO
    offset_seconds: 25
    body: '[RLY] link AWS-GCP-01 retrained on transceiver FTRJ1319P1BTL-B2204 sfp_rx=-5.9dBm crc_fail=0.00% status=NOMINAL'
    attributes:
      operation: link_status
      relay.route_id: AWS-GCP-01
      relay.transceiver_serial: FTRJ1319P1BTL-B2204
  verification:
  - signal: relay.corrupted_frames_pct
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "telemetry-relay"
    field: metrics.relay.corrupted_frames_pct
    expect: 'back to ~0% (below 0.1%); was 2-20%'
    within_seconds: 60
  - signal: RLY-PACKET-CORRUPT errors
    from: logs.otel.nova7
    where: body.text LIKE "*RLY-PACKET-CORRUPT*"
    expect: '0 new lines'
    within_seconds: 60
  - signal: AWS-GCP-01 transceiver
    from: logs.otel.nova7
    where: resource.attributes.service.name == "telemetry-relay"
    field: attributes.relay.transceiver_serial
    expect: 'FTRJ1319P1BTL-B2204 (the spare) on the latest link_status lines'
    within_seconds: 60

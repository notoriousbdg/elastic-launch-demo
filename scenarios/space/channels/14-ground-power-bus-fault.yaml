name: Ground Power Bus Fault
subsystem: ground
vehicle_section: launch_pad
error_type: GND-POWER-BUS-FAULT
sensor_type: electrical
affected_services:
- ground-systems
- sensor-validator
cascade_services:
- mission-control
- fuel-system
description: Launch pad power bus voltage irregularity detected
investigation_notes: 'Root cause: a sag on the utility feed to bus {bus_id} while UPS-A sits on bypass (Ground Systems logged
  the sag and the transfer to BYPASS shortly before the first bus fault). With the UPS bypassed the sag reaches the bus directly
  and the transformer, still on tap 0, cannot compensate: the bus reads {voltage}V, {deviation_pct}% below the {nominal_v}V
  nominal. Voltage deviation >8% can cause sensitive avionics to trip undervoltage lockout. Compare bus current draw with other
  buses — a bus A draw within the 38.7A/41.1A of B/C rules out a ground fault or excessive load; a draw well above B/C would indicate
  one. PWR-B and PWR-C are fed from the other utility feeder and stay nominal. The power_bus_status log shows the bus voltage and
  the transformer tap. Remediation: raise the PWR-A transformer tap two steps (opsctl patch transformer/pwr-a --tap=+2).
  Recovery: the bus voltage (metrics.ground.power.bus_voltage) climbs back to ~120V over about 45 seconds, power_bus_status shows
  transformer_tap=+2 status=NOMINAL and the GND-POWER-BUS-FAULT errors stop. Afterwards return UPS-A from bypass to ONLINE once
  the utility feed is stable, check the breaker panel for tripped breakers or loose connections (thermal imaging recommended) and
  dispatch an electrical technician to the pad.'
remediation_action: reset_ground_power
remediation_command: |-
  opsctl patch transformer/pwr-a --tap=+2
error_message: '[GND] GND-POWER-BUS-FAULT: bus={bus_id} voltage={voltage}V nominal={nominal_v}V deviation={deviation_pct}%'
stack_trace: |-
  == GROUND SYSTEM DIAGNOSTIC == POWER DISTRIBUTION ==
  TIMESTAMP: MET+00:04:18.002 | FRAME: 0x4A3C | SEQ: 18455
  ---------------------------------------------------------------
  BUS      VOLTAGE   NOMINAL   DEVIATION   CURRENT   STATUS
  {bus_id}    {voltage}V   {nominal_v}V   {deviation_pct}%       40.2A     **FAULT**
  PWR-B    119.8V    120.0V    0.2%        38.7A     NOMINAL
  PWR-C    120.1V    120.0V    0.1%        41.1A     NOMINAL
  ---------------------------------------------------------------
  UPS_STATUS: BYPASS | GENERATOR: STANDBY | TRANSFER_SW: AUTO
  GND-POWER-BUS-FAULT: Bus {bus_id} voltage {voltage}V deviates {deviation_pct}% from nominal
  ACTION: Check utility feed and UPS bypass, verify transformer tap settings
correlation_attr:
  key: infra.ups_firmware
  value: apc-smart-ups-v4.1.2
fault_params:
  bus_id: PWR-A
  voltage: 109.8
  nominal_v: 120.0
  deviation_pct: 8.5
rca_clues:
  ground-systems:
    ground.bus_current_a: {uniform: [38.5, 41.5], round: 1}
    ground.ups_mode: BYPASS
    ground.power.transformer_tap: '0'
  sensor-validator:
    validation.power_quality: degraded
    validation.affected_bus: PWR-A
  mission-control:
    upstream.degraded_subsystem: ground
    telemetry.pad_status: caution
  fuel-system:
    propulsion.ground_power_status: unstable
business_impact:
  - kpi: business.launch_readiness_index_0_100
    factor: {uniform: [0.35, 0.60]}
  - kpi: business.critical_system_uptime_pct
    factor: {uniform: [0.55, 0.78]}
  - kpi: business.schedule_variance_days
    factor: {uniform: [2.5, 6.0]}
  - kpi: business.fault_events_per_min
    factor: {uniform: [3.0, 7.0]}
cascade_messages:
  mission-control:
  - severity: WARN
    message: '[MCC] pad power caution: bus {bus_id} at {voltage}V ({deviation_pct}% low), avionics ground power on undervoltage
      watch'
  fuel-system:
  - severity: WARN
    message: '[PMS] ground power unstable: LOX loading pump drive on bus {bus_id} reports {voltage}V, undervoltage ride-through
      active'
fault_scope:
  workloads: [ground-systems, sensor-validator]
infrastructure_events:
- service: ground-systems
  severity: WARN
  offset_seconds: -90
  body: '[GND] utility feed sag on PWR-A input 3.81kV nominal=4.16kV; UPS-A transferred to BYPASS (fw apc-smart-ups-v4.1.2)
    status=CAUTION'
  attributes:
    operation: power_bus_status
    ground.power.bus_id: PWR-A
    ground.ups_mode: BYPASS
    infra.ups_firmware: apc-smart-ups-v4.1.2
remediation_effects:
  log_events:
  - service: mission-control
    severity: INFO
    offset_seconds: 1
    body: '[MCC] CMD ACCEPTED opsctl patch transformer/pwr-a --tap=+2 from {actor}: PWR-A transformer tap 0 -> +2'
  - service: ground-systems
    severity: INFO
    offset_seconds: 40
    body: '[GND] PWR-A transformer tap +2 engaged; bus voltage 119.9V nominal=120.0V status=NOMINAL'
    attributes:
      operation: power_bus_status
      ground.power.bus_id: PWR-A
      ground.power.transformer_tap: '+2'
  verification:
  - signal: ground.power.bus_voltage
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "ground-systems"
    field: metrics.ground.power.bus_voltage
    expect: 'back to ~120 V (119-121); was ~109.8 V'
    within_seconds: 90
  - signal: GND-POWER-BUS-FAULT errors
    from: logs.otel.nova7
    where: body.text LIKE "*GND-POWER-BUS-FAULT*"
    expect: '0 new lines'
    within_seconds: 90
  - signal: PWR-A transformer tap
    from: logs.otel.nova7
    where: resource.attributes.service.name == "ground-systems"
    field: attributes.ground.power.transformer_tap
    expect: '+2 on the latest power_bus_status lines'
    within_seconds: 90

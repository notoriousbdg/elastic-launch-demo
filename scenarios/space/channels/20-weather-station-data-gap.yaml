name: Weather Station Data Gap
subsystem: ground
vehicle_section: launch_pad
error_type: GND-WEATHER-GAP
sensor_type: weather
affected_services:
- ground-systems
- sensor-validator
cascade_services:
- mission-control
- range-safety
description: Weather monitoring station reporting data gaps
investigation_notes: 'Root cause: firmware davis-v3.2.1-patched was loaded on weather station {station_id} (Ground Systems
  logged the update from davis-v3.1.8 shortly before the first data gap). Its serial driver drops the RS-422 link to the ground
  data system, so records arrive in bursts with gaps of {gap_seconds}s. Gap >{max_gap}s violates launch commit criteria (LCC) for
  weather data continuity. Station battery and processor are healthy (status LEDs normal, battery 80-98%), and the other
  stations (WX-SOUTH, WX-EAST, WX-WEST) report every 1-3s, which rules out a ground data system receiver failure; the gaps
  started right after the firmware load, not after pad work that could have crushed the RS-422 cable run. The weather_check log shows the WX-NORTH data_age and fw. Remediation: roll the station firmware back to the previous
  revision (opsctl rollback firmware/wx-north --to-revision previous). Recovery: the station reboots on davis-v3.1.8, the data
  age (metrics.ground.weather.data_age_s) falls back below {max_gap}s within about 30 seconds, weather_check shows
  fw=davis-v3.1.8 lcc=GO status=NOMINAL and the GND-WEATHER-GAP errors stop. Weather LCC waiver requires Range Safety Officer
  approval if gap exceeds 60s; keep davis-v3.2.1-patched off the other stations until the vendor fixes the serial driver.'
remediation_action: reset_ground_systems
remediation_command: |-
  opsctl rollback firmware/wx-north --to-revision previous
error_message: '[GND] GND-WEATHER-GAP: station={station_id} gap={gap_seconds}s max_allowed={max_gap}s link=TIMEOUT'
stack_trace: |-
  == GROUND SYSTEM DIAGNOSTIC == WEATHER NETWORK ==
  TIMESTAMP: T-00:04:18.334 | FRAME: 0x4A3D | SEQ: 18456
  ---------------------------------------------------------------
  STATION     LAST_DATA   GAP_SEC   MAX_GAP   STATUS
  {station_id}   {gap_seconds}s ago    {gap_seconds}s       {max_gap}s       **DATA_GAP**
  WX-SOUTH    2s ago      2s        15s       NOMINAL
  WX-EAST     1s ago      1s        15s       NOMINAL
  WX-WEST     3s ago      3s        15s       NOMINAL
  ---------------------------------------------------------------
  NETWORK: 4 stations | PROTOCOL: ASCII-1Hz | LINK: RS-422
  GND-WEATHER-GAP: Station {station_id} no data for {gap_seconds}s, max allowed {max_gap}s
  ACTION: Check station comm link, dispatch field technician
correlation_attr:
  key: deployment.wx_station_fw
  value: davis-v3.2.1-patched
fault_params:
  station_id: WX-NORTH
  gap_seconds: {randint: [30, 180]}
  max_gap: 15
rca_clues:
  ground-systems:
    ground.wx_link_type: RS-422
    ground.station_battery_pct: {uniform: [80.0, 98.0], round: 0}
    ground.rs422_link_state: DOWN
  sensor-validator:
    validation.weather_data_gap_s: {randint: [20, 120]}
    validation.station_affected: WX-NORTH
  mission-control:
    upstream.degraded_subsystem: ground
    telemetry.lcc_weather: violated
  range-safety:
    safety.weather_lcc_status: NO-GO
business_impact:
  - kpi: business.launch_readiness_index_0_100
    factor: {uniform: [0.45, 0.7]}
  - kpi: business.schedule_variance_days
    value: {uniform: [32.46, 37.34], round: 1}
  - kpi: business.ground_station_availability_pct
    factor: {uniform: [0.65, 0.85]}
  - kpi: business.program_net_satisfaction_proxy_nps
    value: {uniform: [21.13, 24.32], round: 1}
cascade_messages:
  mission-control:
  - severity: WARN
    message: '[MCC] weather LCC VIOLATED: station {station_id} no data for {gap_seconds}s, max allowed {max_gap}s'
  range-safety:
  - severity: WARN
    message: '[RSO] weather LCC NO-GO: station {station_id} data gap {gap_seconds}s exceeds {max_gap}s, waiver requires RSO approval'
fault_scope:
  workloads: [ground-systems, sensor-validator]
infrastructure_events:
- service: ground-systems
  severity: INFO
  offset_seconds: -90
  body: '[GND] WX-NORTH firmware update applied davis-v3.1.8 -> davis-v3.2.1-patched; station processor rebooted, link=RS-422; pushed by gnd-wx-fleet-mgr (CR-2335)'
  attributes:
    user.name: gnd-wx-fleet-mgr
    change.request: CR-2335
    operation: weather_check
    weather.station_id: WX-NORTH
    deployment.wx_station_fw: davis-v3.2.1-patched
remediation_effects:
  log_events:
  - service: mission-control
    severity: INFO
    offset_seconds: 1
    body: '[MCC] CMD ACCEPTED opsctl rollback firmware/wx-north --to-revision previous from {actor}: WX-NORTH davis-v3.2.1-patched
      -> davis-v3.1.8'
  - service: ground-systems
    severity: INFO
    offset_seconds: 25
    body: '[GND] WX-NORTH firmware davis-v3.1.8 loaded; RS-422 link UP data_age=2s max_gap=15s status=NOMINAL'
    attributes:
      operation: weather_check
      weather.station_id: WX-NORTH
      deployment.wx_station_fw: davis-v3.1.8
  verification:
  - signal: ground.weather.data_age_s
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "ground-systems"
    field: metrics.ground.weather.data_age_s
    expect: 'below 15 s (1-4 s); was 30-180 s'
    within_seconds: 60
  - signal: GND-WEATHER-GAP errors
    from: logs.otel.nova7
    where: body.text LIKE "*GND-WEATHER-GAP*"
    expect: '0 new lines'
    within_seconds: 60
  - signal: WX-NORTH firmware
    from: logs.otel.nova7
    where: resource.attributes.service.name == "ground-systems"
    field: attributes.deployment.wx_station_fw
    expect: 'davis-v3.1.8 on the latest weather_check lines'
    within_seconds: 60

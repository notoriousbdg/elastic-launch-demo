name: GPS Multipath Interference
subsystem: guidance
vehicle_section: avionics
error_type: GNC-GPS-MULTIPATH
sensor_type: gps
affected_services:
- navigation
- sensor-validator
cascade_services:
- mission-control
- range-safety
description: GPS receiver detecting multipath signal interference
investigation_notes: 'Root cause: ground-bounce multipath from launch structure or nearby buildings corrupting pseudorange
  measurements on low-elevation satellites. PDOP >6.0 indicates poor satellite geometry — check which SVs are flagged for
  multipath (SNR anomalies on G04, G07, G15). Verify antenna choke ring integrity and ground plane clearance. If >3 SVs affected,
  the GPS solution degrades below navigation-grade accuracy. Remediation: switch to IMU-primary navigation mode (GNC_NAV_MODE
  IMU_PRIMARY), mask multipath-affected SVs via SVMASK command, and schedule GPS reacquisition after clearing the launch structure
  multipath zone during ascent.'
remediation_action: recalibrate_navigation
error_message: '[GNC] GNC-GPS-MULTIPATH: sv_count={num_satellites} pdop=8.7 threshold=6.0 uncertainty={uncertainty}m'
stack_trace: |-
  == GN&C SYSTEM STATUS == GPS RECEIVER UNIT ==
  TIMESTAMP: MET+00:04:14.005 | FRAME: 0x4A32 | SEQ: 18445
  ---------------------------------------------------------------
  SV_ID   EL    AZ     SNR    MULTIPATH   USED
  G04     45    127    42.1   YES         NO
  G07     62    203    38.7   YES         NO
  G09     28    315    44.2   NO          YES
  G12     71    089    46.0   NO          YES
  G15     33    241    31.4   YES         NO
  ---------------------------------------------------------------
  AFFECTED SVs: {num_satellites} | PDOP: 8.7 (threshold 6.0)
  POSITION UNCERTAINTY: {uncertainty}m | SOLUTION: DEGRADED
  GNC-GPS-MULTIPATH: Multipath interference degrading navigation solution
  ACTION: Switch to IMU-primary navigation mode
correlation_attr:
  key: network.dns_resolver
  value: coredns-v1.11.4-patch2
fault_params:
  num_satellites: {randint: [3, 8]}
  uncertainty: {uniform: [5.0, 50.0], round: 1}
rca_clues:
  navigation:
    gnc.sv_masked_count: {randint: [2, 5]}
    gnc.pdop: {uniform: [6.5, 12.0], round: 1}
  sensor-validator:
    validation.gps_solution_quality: degraded
    validation.multipath_svs: {choice: ["G04,G07,G15", "G07,G15"]}
  mission-control:
    upstream.degraded_subsystem: guidance
    telemetry.nav_accuracy: reduced
  range-safety:
    safety.nav_solution_status: degraded
business_impact:
  - kpi: business.maneuver_accuracy_pct
    factor: {uniform: [0.55, 0.80]}
  - kpi: business.trajectory_deviation_meters
    factor: {uniform: [3.0, 8.0]}
  - kpi: business.mission_success_probability_pct
    factor: {uniform: [0.75, 0.90]}
  - kpi: business.launch_readiness_index_0_100
    factor: {uniform: [0.70, 0.88]}

name: Thermal Calibration Drift
subsystem: propulsion
vehicle_section: engine_bay
error_type: TCS-DRIFT-CRITICAL
sensor_type: thermal
affected_services:
- fuel-system
- sensor-validator
cascade_services:
- mission-control
- range-safety
description: Thermal sensor calibration drifts outside acceptable bounds in the engine bay
investigation_notes: 'Root cause: thermocouple junction degradation or reference junction compensation failure causes progressive
  drift in TC-47 readings. Check calibration epoch age — epochs older than 4 hours under thermal cycling indicate recalibration
  is overdue. Verify cold-junction compensation circuit on the signal conditioning board (SCB-4). Cross-reference with adjacent
  sensors TC-48/49/50 to isolate single-sensor vs zone-wide drift. Remediation: run TCS_RECAL procedure from MCC console,
  update calibration coefficients in the sensor registry, and confirm readings converge within 2.5K tolerance band.'
remediation_action: recalibrate_engine
error_message: '[TCS] TCS-DRIFT-CRITICAL: sensor=TC-47 reading={deviation}K nominal=310.2K deviation=+{deviation}K epoch={epoch}'
stack_trace: |-
  == TELEMETRY FRAME DUMP == TCS THERMAL CONTROL SUBSYSTEM ==
  TIMESTAMP: MET+00:04:12.337 | FRAME: 0x4A2F | SEQ: 18442
  ---------------------------------------------------------------
  SENSOR    READING    NOMINAL    DELTA     STATUS
  TC-47     {deviation}K     310.2K     +{deviation}K   **CRITICAL**
  TC-48     311.4K     310.2K     +1.2K     NOMINAL
  TC-49     309.8K     310.2K     -0.4K     NOMINAL
  TC-50     310.0K     310.2K     -0.2K     NOMINAL
  ---------------------------------------------------------------
  CALIBRATION BASELINE: epoch={epoch} | DRIFT THRESHOLD: 2.5K
  TCS-DRIFT-CRITICAL: Sensor TC-47 exceeded drift threshold by +{deviation}K
  ACTION: Recalibration required before engine ignition sequence
correlation_attr:
  key: deployment.config_version
  value: v2.3.1-canary
fault_params:
  deviation: {uniform: [3.0, 12.0], round: 1}
  epoch: {randint: [1700000000, 1800000000]}
rca_clues:
  fuel-system:
    thermal.sensor_zone: engine_bay_sector_7
    thermal.calibration_epoch: stale
  sensor-validator:
    validation.drift_detected: true
    validation.sensor_id: TC-47
  mission-control:
    upstream.degraded_subsystem: propulsion
    telemetry.quality: degraded
  range-safety:
    safety.propulsion_status: degraded

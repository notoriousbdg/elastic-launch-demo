name: X-Band Packet Loss
subsystem: communications
vehicle_section: antenna_array
error_type: COMM-PACKET-LOSS
sensor_type: packet_integrity
affected_services:
- comms-array
- sensor-validator
cascade_services:
- telemetry-relay
- mission-control
description: X-band data link experiencing excessive packet loss
investigation_notes: |-
  Root cause: the XB-PRIMARY low-noise amplifier bias current drifted from its nominal 62 mA to the low 40s shortly before the loss began. A starved LNA loses gain and raises the receiver noise temperature, so the bit error rate climbs to 1.2e-04 and the FEC decoder fails: 847 frames uncorrectable out of 2341 correction attempts, {loss_pct}% packet loss on {link_id} against a {threshold_pct}% threshold. Modulator phase noise reads 4-7 deg RMS (nominal under 1.5) because the carrier recovery loop runs on a noisy signal; antenna boresight and servo tracking are normal and no adjacent RF system changed.
  Confirm:
    - comms-array logs the XB-PRIMARY LNA bias warning before the first COMM-PACKET-LOSS line
    - comms-array X-Band antenna_check lines: link=XB-PRIMARY fec=7/8 lna_bias around 41-48 mA, status=ANOMALY; attributes.comms.lna_bias_ma
    - metrics.comms.xband.packet_loss_pct at 5-25% (nominal under 0.5%)
    - S-band and UHF links stay NOMINAL; telemetry-relay retransmits X-band frames
  Remediation: switch the X-band link to the redundant chain and lower the FEC code rate from 7/8 to 3/4 in one command (opsctl patch link/x-band --active=xb-secondary --fec-rate=3/4). XB-SECONDARY has its own LNA; with the stronger code the packet loss converges below 2% within about a minute and antenna_check lines show link=XB-SECONDARY fec=3/4. Keep XB-PRIMARY offline until its LNA bias supply is inspected; run COMM_ANTENNA_CAL X-BAND only if the loss persists on the secondary chain.
remediation_action: reset_comms_link
remediation_command: |-
  opsctl patch link/x-band --active=xb-secondary --fec-rate=3/4
error_message: '[COMM] COMM-PACKET-LOSS: link={link_id} loss_rate={loss_pct}% threshold={threshold_pct}% frames_dropped=847'
stack_trace: |-
  == LINK BUDGET ANALYSIS == X-BAND DATA LINK ==
  TIMESTAMP: MET+00:04:15.221 | FRAME: 0x4A36 | SEQ: 18449
  ---------------------------------------------------------------
  LINK         TX_RATE    RX_RATE    LOSS     STATUS
  {link_id}   150Mbps    142Mbps    {loss_pct}%    **DEGRADED**
  ---------------------------------------------------------------
  FEC_RATE: 7/8 | FEC_CORRECTIONS: 2341 | FEC_FAILURES: 847 | BER: 1.2e-04
  LNA_BIAS: 44.6mA (nominal 62.0mA) | NOISE_TEMP: HIGH
  THRESHOLD: {threshold_pct}% | MEASURED: {loss_pct}%
  COMM-PACKET-LOSS: Packet loss {loss_pct}% exceeds threshold on link {link_id}
  ACTION: Check LNA bias and noise temperature, select redundant chain
correlation_attr:
  key: comms.active_link
  value: XB-PRIMARY
fault_params:
  link_id: XB-PRIMARY
  loss_pct: {uniform: [5.0, 25.0], round: 1}
  threshold_pct: 2.0
rca_clues:
  comms-array:
    comms.ber: "1.2e-04"
    comms.lna_bias_ma: {uniform: [41.0, 48.0], round: 1}
    comms.fec_failure_count: {randint: [500, 1200]}
    comms.modulator_phase_noise_deg_rms: {uniform: [4.0, 7.0], round: 1}
  sensor-validator:
    validation.packet_integrity: degraded
    validation.link_affected: XB-PRIMARY
  telemetry-relay:
    relay.x_band_retransmits: {randint: [100, 500]}
  mission-control:
    upstream.degraded_subsystem: communications
cascade_messages:
  telemetry-relay:
    - severity: WARN
      message: '[RELAY] X-band frame retransmit requests rising on {link_id}: loss {loss_pct}%; downlink queue backing up'
  mission-control:
    - severity: WARN
      message: '[MCC] X-band downlink {link_id} loss {loss_pct}% > {threshold_pct}%; high-rate telemetry gaps on the FCR displays'
fault_scope:
  workloads: [comms-array, sensor-validator]
infrastructure_events:
  - service: comms-array
    severity: WARN
    offset_seconds: -120
    body: '[COMM] XB-PRIMARY LNA bias current 47.8mA (nominal 62.0mA +/-3.0mA) drifting low; receiver noise temperature rising'
    attributes:
      comms.active_link: XB-PRIMARY
      comms.lna_bias_ma: 47.8
      operation: lna_monitor
remediation_effects:
  log_events:
    - service: mission-control
      severity: INFO
      offset_seconds: 2
      body: '[MCC] CMD ACCEPTED opsctl patch link/x-band --active=xb-secondary --fec-rate=3/4 from {actor}: X-band link XB-PRIMARY -> XB-SECONDARY, FEC 7/8 -> 3/4'
    - service: comms-array
      severity: INFO
      offset_seconds: 30
      body: '[COMM] X-band on XB-SECONDARY FEC 3/4; frame sync acquired; loss 0.6% NOMINAL'
  verification:
    - signal: comms.xband.packet_loss_pct
      from: 'metrics-generic.otel-default'
      field: 'metrics.comms.xband.packet_loss_pct'
      where: 'resource.attributes.service.name == "comms-array"'
      expect: 'below 2% (was 5-25%), converging over about a minute'
      within_seconds: 120
    - signal: COMM-PACKET-LOSS errors
      from: 'logs.otel.nova7'
      where: 'body.text LIKE "*COMM-PACKET-LOSS*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: active X-band link
      from: 'logs.otel.nova7'
      where: 'resource.attributes.service.name == "comms-array"'
      field: 'attributes.comms.active_link'
      expect: 'XB-SECONDARY on the latest X-Band antenna_check lines (was XB-PRIMARY)'
      within_seconds: 120
business_impact:
  - kpi: business.downlink_data_rate_mbps
    value: {uniform: [75.56, 86.94], round: 1}
  - kpi: business.packet_loss_rate_pct
    factor: {uniform: [3.0, 8.0]}
  - kpi: business.telemetry_coverage_pct
    factor: {uniform: [0.55, 0.8]}
  - kpi: business.contact_window_utilization_pct
    factor: {uniform: [0.6, 0.82]}

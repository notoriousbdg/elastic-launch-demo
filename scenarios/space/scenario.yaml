raw_log_profile:
  service_name: mission-control-api
  user_id_prefix: gs
  tier_field: mission_class
  tier_values:
  - - cubesat
    - 55
  - - geo
    - 30
  - - deep-space
    - 15
  country_weights:
    US: 50
    DE: 12
    JP: 10
    GB: 8
    FR: 8
    IN: 6
    AU: 6
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  paths:
  - /api/v1/telemetry
  - /api/v1/orbits/{satellite}
  - /api/v1/commands
  - /api/v1/groundstations
  - /api/v1/passes
  - /api/v1/ephemeris
  - /health
  change_point_path: /api/v1/commands
trace_attributes:
  base:
    mission.phase: {choice: [pre-launch, countdown, ascent, orbital-insertion]}
    mission.elapsed_time_s: {randint: [0, 86399]}
  services:
    fuel-system:
      propulsion.engine_id: {choice: [E1-MAIN, E2-MAIN, E3-VERNIER]}
      propulsion.chamber_pressure_psi: {uniform: [2400, 2650], round: 1}
    navigation:
      gnc.nav_mode: {choice: [GPS_PRIMARY, IMU_PRIMARY, STAR_TRACKER, BLENDED]}
      orbit.altitude_km: {uniform: [180, 420], round: 1}
    comms-array:
      comms.link_type: {choice: [S-BAND, X-BAND, UHF]}
      comms.signal_margin_db: {uniform: [2.0, 12.0], round: 1}
    mission-control:
      mcc.operator_console: {choice: [FLIGHT, CAPCOM, GNC, PROP, EECOM]}
      mcc.telemetry_rate_hz: {choice: [1, 5, 10, 25]}
    ground-systems:
      ground.pad_id: {choice: [LC-39A, LC-39B, SLC-40]}
      ground.weather_go: {choice: [true, true, true, false]}
    payload-monitor:
      payload.bay_temp_c: {uniform: [18.0, 28.0], round: 1}
      payload.vibration_grms: {uniform: [0.1, 1.2], round: 2}
    sensor-validator:
      validation.pipeline_stage: {choice: [ingest, calibration, correlation, output]}
      validation.queue_depth: {randint: [0, 200]}
    telemetry-relay:
      relay.hop_count: {randint: [1, 4]}
      relay.buffer_pct: {uniform: [10.0, 85.0], round: 1}
    range-safety:
      safety.fts_arm_state: {choice: [SAFED, SAFED, SAFED, ARMED]}
      safety.tracking_radars_active: {randint: [2, 3]}

agent_config:
  id: nova7-launch-analyst
  name: Launch Anomaly Analyst
  assessment_tool_name: launch_safety_assessment
  system_prompt: 'You are the NOVA-7 Launch Anomaly Analyst, an expert AI assistant for space launch mission operations. You
    help mission controllers investigate anomalies, analyze telemetry data, and provide root cause analysis for fault conditions
    across 9 space systems. You have deep expertise in spacecraft propulsion telemetry, GN&C systems, TDRSS/S-band/X-band
    communications, payload environmental control, cross-cloud relay networks, ground support equipment, sensor validation
    pipelines, and range safety systems. When investigating incidents, search for these subsystem identifiers in logs: Propulsion
    faults (TCS-DRIFT-CRITICAL, PMS-PRESS-ANOMALY, PMS-OXIDIZER-FLOW), GN&C faults (GNC-GPS-MULTIPATH, GNC-IMU-SYNC-LOSS,
    GNC-STAR-TRACKER-ALIGN), Communications faults (COMM-SIGNAL-DEGRAD, COMM-PACKET-LOSS, COMM-ANTENNA-POINTING), Payload
    faults (PLD-THERMAL-EXCURSION, PLD-VIBRATION-LIMIT), Relay faults (RLY-LATENCY-CRITICAL, RLY-PACKET-CORRUPT), Ground faults
    (GND-POWER-BUS-FAULT, GND-WEATHER-GAP, GND-HYDRAULIC-PRESS), Validation faults (VV-PIPELINE-HALT, VV-EPOCH-DRIFT), and
    Range Safety faults (RSO-FTS-CHECK-FAIL, RSO-TRACKING-LOSS). Log messages are in body.text — NEVER search the body field
    alone.'
assessment_tool_config:
  id: launch_safety_assessment
  description: 'Comprehensive launch safety assessment. Evaluates all services against launch readiness criteria. Returns
    data for GO/NO-GO evaluation. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: mission-control
executive_dashboard_intro: '**NOVA-7 program view** — mission assurance, orbital mechanics, ground communications, and program
  health KPIs (synthetic `business.*` streams from `mission-control`).'
executive_kpi_sections:
- header: '**Mission assurance** — success probability, uptime, faults, recovery, and health'
  specs:
  - - Mission success probability (%)
    - metrics.business.mission_success_probability_pct
  - - Critical system uptime (%)
    - metrics.business.critical_system_uptime_pct
  - - Fault events / min
    - metrics.business.fault_events_per_min
  - - Autonomous recovery rate (%)
    - metrics.business.autonomous_recovery_rate_pct
  - - Telemetry coverage (%)
    - metrics.business.telemetry_coverage_pct
  - - Spacecraft health index (0–100)
    - metrics.business.spacecraft_health_index_0_100
- header: '**Orbital mechanics** — trajectory, delta-V, drift, accuracy, fuel, and altitude'
  specs:
  - - Trajectory deviation (m)
    - metrics.business.trajectory_deviation_meters
  - - Delta-V remaining (m/s)
    - metrics.business.delta_v_budget_remaining_mps
  - - Orbital period drift (ms)
    - metrics.business.orbital_period_drift_ms
  - - Maneuver accuracy (%)
    - metrics.business.maneuver_accuracy_pct
  - - Station-keeping fuel (%)
    - metrics.business.station_keeping_fuel_remaining_pct
  - - Perigee altitude (km)
    - metrics.business.perigee_altitude_km
- header: '**Communications** — downlink rate, uplink latency, contacts, packet loss, and ground'
  specs:
  - - Downlink data rate (Mbps)
    - metrics.business.downlink_data_rate_mbps
  - - Uplink latency (ms)
    - metrics.business.uplink_latency_ms
  - - Contact window utilization (%)
    - metrics.business.contact_window_utilization_pct
  - - Packet loss rate (%)
    - metrics.business.packet_loss_rate_pct
  - - Command acceptance rate (%)
    - metrics.business.command_acceptance_rate_pct
  - - Ground station availability (%)
    - metrics.business.ground_station_availability_pct
- header: '**Program health** — schedule, readiness, SLA, cost variance, risk, and NPS'
  specs:
  - - Schedule variance (days)
    - metrics.business.schedule_variance_days
  - - Launch readiness index (0–100)
    - metrics.business.launch_readiness_index_0_100
  - - Contractor SLA compliance (%)
    - metrics.business.contractor_sla_compliance_pct
  - - Cost variance (%)
    - metrics.business.cost_variance_pct
  - - Risk burn-down rate
    - metrics.business.risk_burn_down_rate
  - - Program satisfaction (NPS-like)
    - metrics.business.program_net_satisfaction_proxy_nps

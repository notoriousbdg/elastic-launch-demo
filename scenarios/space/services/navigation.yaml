service: navigation
sort_order: 4
cloud_provider: gcp
cloud_region: us-central1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-central1-a
subsystem: guidance
language: rust
topology:
- - sensor-validator
  - /api/v1/validate/imu
  - POST
- - sensor-validator
  - /api/v1/validate/gps
  - POST
- - sensor-validator
  - /api/v1/validate/star-tracker
  - POST
entry_endpoints:
- - /api/v1/nav/compute
  - POST
db_operations:
- - SELECT
  - calibration_epochs
  - SELECT epoch, baseline FROM calibration_epochs WHERE sensor_type IN ('imu', 'gps', 'star_tracker')
emit_fault_logs: true
kpi_emitter: false
constants:
  IMU_AXES:
  - X
  - Y
  - Z
state:
  _fix_count:
    init: 0
  _last_nav_report:
    init: now
steps:
- counter:
    state_key: _fix_count
    by: 1
# GPS (multipath fault, ch 4): swing-arm reflector -> few SVs in the solution and a large
# position uncertainty; after the fix the receiver runs IMU-primary with G04/G07/G15 masked.
- sample:
    gps_drift:
      uniform:
      - 0.1
      - 1.5
      round: 3
    mp_ramp:
      expr: "min(1.0, elapsed.get(4, 0) / 45.0) if 4 in all_active else 0.0"
    mp_fixed:
      expr: "4 in fixed_channels and 4 not in all_active"
    mp_conv:
      expr: "min(1.0, since_fix.get(4, 0) / 60.0) if mp_fixed else 1.0"
    nav_mode:
      expr: "'IMU_PRIMARY' if mp_fixed else 'GPS_PRIMARY'"
    sats_base:
      randint: [9, 12]
    gps_sats:
      expr: "round(sats_base - (sats_base - 3) * mp_ramp) if 4 in all_active else (rand.randint(6, 8) if mp_fixed else sats_base)"
    conf_base:
      uniform: [0.95, 0.999]
    conf_fault:
      uniform: [0.35, 0.6]
    gps_conf:
      expr: "round(conf_base + (conf_fault - conf_base) * mp_ramp, 4) if 4 in all_active else (round(conf_fault + (conf_base - conf_fault) * mp_conv, 4) if mp_fixed else round(conf_base, 4))"
    unc_base:
      uniform: [1.2, 3.5]
    unc_fault:
      uniform: [12.0, 50.0]
    unc_after:
      uniform: [1.5, 4.0]
    pos_unc:
      expr: "round(unc_base + (unc_fault - unc_base) * mp_ramp, 1) if 4 in all_active else (round(unc_fault + (unc_after - unc_fault) * mp_conv, 1) if mp_fixed else round(unc_base, 1))"
    gps_status:
      expr: "'ANOMALY' if 4 in all_active or pos_unc >= 5.0 else 'NOMINAL'"
- metric:
    name: navigation.gps.drift_ms
    value:
      var: gps_drift
    unit: ms
- metric:
    name: navigation.gps.confidence
    value:
      var: gps_conf
    unit: ratio
- metric:
    name: navigation.gps.satellites
    value:
      var: gps_sats
    unit: count
- metric:
    name: navigation.position_uncertainty_m
    value:
      var: pos_unc
    unit: m
- metric:
    name: navigation.fix_count
    value:
      var: _fix_count
    unit: fixes
- log:
    level: INFO
    message: '[GNC] gps_fix fix={_fix_count} mode={nav_mode} sv_count={gps_sats} drift={gps_drift}ms confidence={gps_conf} uncertainty={pos_unc}m solution={gps_status}'
    attrs:
      nav.system: gps
      nav.fix_count:
        var: _fix_count
      nav.drift_ms:
        var: gps_drift
      nav.confidence:
        var: gps_conf
      nav.gps_satellites:
        var: gps_sats
      nav.mode:
        var: nav_mode
      nav.position_uncertainty_m:
        var: pos_unc
      sensor.status:
        var: gps_status
      operation: gps_fix
# IMU timing (sync loss, ch 5): PPS A amplitude low -> IMU time base drifts; after the fix
# the IMU runs on GPS_1PPS_B and the realignment pulls the drift back under 3 ms.
- sample:
    imu_ramp:
      expr: "min(1.0, elapsed.get(5, 0) / 45.0) if 5 in all_active else 0.0"
    imu_fixed:
      expr: "5 in fixed_channels and 5 not in all_active"
    imu_conv:
      expr: "min(1.0, since_fix.get(5, 0) / 75.0) if imu_fixed else 1.0"
    sync_base:
      uniform: [0.1, 0.8]
    sync_fault:
      uniform: [5.0, 25.0]
    sync_after:
      uniform: [0.3, 1.5]
    imu_sync:
      expr: "round(sync_base + (sync_fault - sync_base) * imu_ramp, 2) if 5 in all_active else (round(sync_fault + (sync_after - sync_fault) * imu_conv, 2) if imu_fixed else round(sync_base, 2))"
    pps_source:
      expr: "'GPS_1PPS_B' if imu_fixed else 'GPS_1PPS_A'"
    pps_amp:
      expr: "round(rand.uniform(1.85, 1.95), 2) if 5 in all_active else round(rand.uniform(3.25, 3.35), 2)"
    imu_sync_state:
      expr: "'LOST' if imu_sync >= 3.0 else 'LOCKED'"
    imu_status:
      expr: "'ANOMALY' if 5 in all_active or imu_sync >= 3.0 else 'NOMINAL'"
- metric:
    name: navigation.imu.sync_drift_ms
    value:
      var: imu_sync
    unit: ms
- log:
    level: INFO
    message: '[GNC] imu_timing pps_source={pps_source} pps_amplitude={pps_amp}V clock_ref=OCXO-A sync_drift={imu_sync}ms sync={imu_sync_state} status={imu_status}'
    attrs:
      nav.system: imu
      gnc.pps_source:
        var: pps_source
      gnc.pps_amplitude_v:
        var: pps_amp
      nav.imu_sync_drift_ms:
        var: imu_sync
      nav.imu_sync_state:
        var: imu_sync_state
      sensor.status:
        var: imu_status
      operation: imu_timing
- for_each:
    in: IMU_AXES
    as: axis
    steps:
    - sample:
        drift:
          expr: "round(rand.uniform(0.01, 0.5) + (imu_sync if imu_sync >= 1.0 else 0.0), 4)"
        conf:
          uniform:
          - 0.97
          - 0.999
          round: 4
    - metric:
        name:
          expr: f'navigation.imu.drift_{axis.lower()}'
        value:
          var: drift
        unit: ms
    - log:
        level: INFO
        message: '[GNC] imu_reading axis={axis} drift={drift}ms confidence={conf} sync={imu_sync_state} status={imu_status}'
        attrs:
          nav.system: imu
          nav.drift_ms:
            var: drift
          nav.confidence:
            var: conf
          nav.imu_axis:
            var: axis
          sensor.status:
            var: imu_status
          operation: imu_reading
# Star tracker A (alignment fault, ch 6): the beta image shifts the boresight; rolling back
# to star-tracker-v3.0.4 brings the alignment back under 5 arcsec.
- sample:
    st_ramp:
      expr: "min(1.0, elapsed.get(6, 0) / 45.0) if 6 in all_active else 0.0"
    st_fixed:
      expr: "6 in fixed_channels and 6 not in all_active"
    st_conv:
      expr: "min(1.0, since_fix.get(6, 0) / 60.0) if st_fixed else 1.0"
    align_base:
      uniform: [0.1, 2.8]
    align_fault:
      uniform: [10.0, 45.0]
    align_after:
      uniform: [0.5, 3.0]
    alignment:
      expr: "round(align_base + (align_fault - align_base) * st_ramp, 2) if 6 in all_active else (round(align_fault + (align_after - align_fault) * st_conv, 2) if st_fixed else round(align_base, 2))"
    st_image:
      expr: "'star-tracker-v3.1.0-beta' if 6 in all_active else 'star-tracker-v3.0.4'"
    st_status:
      expr: "'ANOMALY' if 6 in all_active or alignment >= 5.0 else 'NOMINAL'"
    st_conf:
      expr: "round(rand.uniform(0.60, 0.80), 4) if alignment >= 5.0 else round(rand.uniform(0.96, 0.999), 4)"
    stars:
      expr: "rand.randint(5, 11) if alignment >= 5.0 else rand.randint(12, 28)"
- metric:
    name: navigation.star_tracker.alignment_arcsec
    value:
      var: alignment
    unit: arcsec
- metric:
    name: navigation.star_tracker.confidence
    value:
      var: st_conf
    unit: ratio
- log:
    level: INFO
    message: '[GNC] star_tracker unit=ST-A image={st_image} catalog_matches={stars} alignment={alignment}arcsec confidence={st_conf} status={st_status}'
    attrs:
      nav.system: star_tracker
      nav.drift_ms:
        expr: round(alignment * 0.01, 4)
      nav.confidence:
        var: st_conf
      nav.star_count:
        var: stars
      nav.alignment_arcsec:
        var: alignment
      deployment.image_tag:
        var: st_image
      sensor.status:
        var: st_status
      operation: star_tracker_reading

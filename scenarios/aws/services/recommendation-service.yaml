service: recommendation-service
sort_order: 9
cloud_provider: aws
cloud_region: eu-west-1
cloud_platform: aws_ec2
cloud_availability_zone: eu-west-1b
subsystem: personalization
language: python

# Topology: [downstream-service, endpoint, METHOD]
# Model inference is a managed Amazon Bedrock call, not another service.
topology: []

entry_endpoints:
  - [/api/v1/recommendations, GET]

db_operations: []

emit_fault_logs: true
kpi_emitter: false

constants:
  PLACEMENTS: [home_carousel, cart_upsell, pdp_similar_items, post_purchase]

state:
  _requests: {init: 0}
  _last_summary: {init: now}

steps:
  - sample:
      placement: {choice: PLACEMENTS}
      model:
        expr: "'eu.anthropic.claude-3-haiku-20240307-v1:0' if 17 in fixed_channels else 'anthropic.claude-3-haiku-20240307-v1:0'"
      shopper_id: {format: "shp-{n}", n: {randint: [100000, 999999]}}
      invocation_latency_ms:
        expr: "round(max(0.0, 500 + (8500 - 500) * min(1.0, elapsed.get(17, 0) / 45.0) + rand.gauss(0, 450)), 1) if 17 in all_active
          else (round(max(0.0, 8500 + (rand.uniform(220.0, 780.0) - 8500) * min(1.0, since_fix.get(17, 0) / 150.0) + rand.gauss(0, 450 * (1.0 - min(1.0, since_fix.get(17, 0) / 150.0)))), 1) if 17 in fixed_channels
          else round(rand.uniform(220.0, 780.0), 1))"
      time_to_first_token_ms:
        expr: "round(max(0.0, 205 + (4500 - 205) * min(1.0, elapsed.get(17, 0) / 45.0) + rand.gauss(0, 220)), 1) if 17 in all_active
          else (round(max(0.0, 4500 + (rand.uniform(90.0, 320.0) - 4500) * min(1.0, since_fix.get(17, 0) / 150.0) + rand.gauss(0, 220 * (1.0 - min(1.0, since_fix.get(17, 0) / 150.0)))), 1) if 17 in fixed_channels
          else round(rand.uniform(90.0, 320.0), 1))"
      input_tokens: {randint: [380, 1500]}
      output_tokens: {randint: [60, 340]}
      throttled_invocations:
        expr: "int(round(max(0, 0.3 + (80 - 0.3) * min(1.0, elapsed.get(17, 0) / 45.0) + rand.gauss(0, 3.5)))) if 17 in all_active
          else (int(round(max(0, 80 + (rand.randint(0, 1) - 80) * min(1.0, since_fix.get(17, 0) / 150.0) + rand.gauss(0, 3.5 * (1.0 - min(1.0, since_fix.get(17, 0) / 150.0)))))) if 17 in fixed_channels
          else rand.randint(0, 1))"
      invocation_client_errors: {randint: [0, 1]}
      items_returned: {randint: [4, 12]}
      personalization_hit_rate_pct:
        expr: "round(max(0.0, 83.0 + (45.0 - 83.0) * min(1.0, elapsed.get(17, 0) / 45.0) + rand.gauss(0, 1.8)), 1) if 17 in all_active
          else (round(max(0.0, 45.0 + (rand.uniform(74.0, 93.0) - 45.0) * min(1.0, since_fix.get(17, 0) / 150.0) + rand.gauss(0, 1.8 * (1.0 - min(1.0, since_fix.get(17, 0) / 150.0)))), 1) if 17 in fixed_channels
          else round(rand.uniform(74.0, 93.0), 1))"
      reco_status:
        expr: "'ANOMALY' if 17 in all_active or (17 in fixed_channels and since_fix.get(17, 0) < 150) else 'NOMINAL'"
  - counter:
      state_key: _requests
      by: 1
  - metric:
      name: recommendations.bedrock.invocation_latency_ms
      value: {var: invocation_latency_ms}
      unit: ms
  - metric:
      name: recommendations.bedrock.time_to_first_token_ms
      value: {var: time_to_first_token_ms}
      unit: ms
  - metric:
      name: recommendations.bedrock.input_token_count
      value: {var: input_tokens}
      unit: '{token}'
  - metric:
      name: recommendations.bedrock.output_token_count
      value: {var: output_tokens}
      unit: '{token}'
  - metric:
      name: recommendations.bedrock.invocation_throttles
      value: {var: throttled_invocations}
      unit: '{invocation}'
  - metric:
      name: recommendations.bedrock.invocation_client_errors
      value: {var: invocation_client_errors}
      unit: '{error}'
  - metric:
      name: recommendations.personalization_hit_rate_pct
      value: {var: personalization_hit_rate_pct}
      unit: '%'
  - log:
      level: INFO
      message: 'reco.invoke placement={placement} shopper={shopper_id} model={model} latency={invocation_latency_ms}ms ttft={time_to_first_token_ms}ms input_tokens={input_tokens} output_tokens={output_tokens} items={items_returned}'
      attrs:
        operation: bedrock_invoke
        reco.placement: {var: placement}
        reco.shopper_id: {var: shopper_id}
        gen_ai.request.model: {var: model}
        aws.bedrock.invocation_latency_ms: {var: invocation_latency_ms}
        gen_ai.usage.input_tokens: {var: input_tokens}
        gen_ai.usage.output_tokens: {var: output_tokens}
        reco.items_returned: {var: items_returned}
  - log:
      level: INFO
      message: 'reco.quota model={model} throttled_invocations={throttled_invocations} client_errors={invocation_client_errors} hit_rate={personalization_hit_rate_pct}% status={reco_status}'
      attrs:
        operation: bedrock_quota_check
        gen_ai.request.model: {var: model}
        aws.bedrock.invocation_throttles: {var: throttled_invocations}
        aws.bedrock.invocation_client_errors: {var: invocation_client_errors}
        reco.hit_rate_pct: {var: personalization_hit_rate_pct}
  - every:
      seconds: 30
      state_key: _last_summary
      steps:
        - log:
            level: INFO
            message: 'reco.summary requests={_requests} hit_rate={personalization_hit_rate_pct}% throttled={throttled_invocations} model={model} status={reco_status}'
            attrs:
              operation: reco_summary
              gen_ai.request.model: {var: model}
              reco.total_requests: {var: _requests}
              reco.hit_rate_pct: {var: personalization_hit_rate_pct}
              aws.bedrock.invocation_throttles: {var: throttled_invocations}

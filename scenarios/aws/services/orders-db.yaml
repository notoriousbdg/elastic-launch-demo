service: orders-db
sort_order: 4
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_ec2
cloud_availability_zone: us-east-1a
subsystem: database
language: python
generates_traces: false

# Topology: [downstream-service, endpoint, METHOD]
topology: []

db_operations:
- - SELECT
  - orders
  - SELECT order_id, customer_id, status, total_cents, currency, created_at FROM orders WHERE order_id = $1
- - INSERT
  - orders
  - INSERT INTO orders (order_id, customer_id, status, total_cents, currency, created_at) VALUES ($1, $2, 'PENDING', $3, $4, now())
- - INSERT
  - order_items
  - INSERT INTO order_items (order_id, sku, quantity, unit_price_cents) VALUES ($1, $2, $3, $4)
- - UPDATE
  - payments
  - UPDATE payments SET status = $1, auth_code = $2, captured_at = now() WHERE order_id = $3 AND status = 'AUTHORIZED'

emit_fault_logs: true
kpi_emitter: false

constants:
  DB_TABLES:
  - orders
  - order_items
  - payments
  - shipments
  DB_CLIENTS:
  - orders-service
  - orders-service
  - orders-service
  - reporting-batch
  DB_INSTANCE: orders-prod-pg-01

steps:
- sample:
    # ch1 (connection leak) ramps in over 60s and converges back over 90s after the rollback.
    # max_connections is pinned to 410 in the orders-pg15 parameter group (the db.r6g.large default would be ~1,700);
    # 6 orders-service tasks x maximumPoolSize 70 = 420 can never all connect, and 5 slots stay reserved for superusers.
    f1:
      expr: "min(1.0, elapsed.get(1, 0) / 60.0) if 1 in all_active else (max(0.0, 1.0 - since_fix.get(1, 0) / 90.0) if 1 in fixed_channels else 0.0)"
    table:
      choice: DB_TABLES
    db_connections:
      expr: "int(round(rand.uniform(30.0, 80.0) * (1.0 - f1) + max(398.0, min(405.0, 402.0 + rand.gauss(0, 1.5))) * f1))"
    max_connections: 410
    conn_utilization_pct:
      expr: round(db_connections / max_connections * 100, 1)
    idle_in_txn:
      expr: "int(round(rand.uniform(2.0, 25.0) * (1.0 - f1) + max(300.0, min(370.0, 335.0 + rand.gauss(0, 8.0))) * f1))"
    db_status:
      expr: "'ANOMALY' if (1 in all_active or (1 in fixed_channels and since_fix.get(1, 0) < 90.0)) else 'NOMINAL'"
- metric:
    name: aws.rds.database_connections
    value:
      var: db_connections
    unit: connections
- metric:
    name: aws.rds.connection_utilization_pct
    value:
      var: conn_utilization_pct
    unit: '%'
- metric:
    name: orders_db.idle_in_transaction_sessions
    value:
      var: idle_in_txn
    unit: sessions
- log:
    level: INFO
    message: 'postgresql[orders-prod-pg-01]: connections active={db_connections}/{max_connections} utilization={conn_utilization_pct}% idle_in_transaction={idle_in_txn} status={db_status}'
    attrs:
      operation: connection_health
      db.system: postgresql
      db.instance: orders-prod-pg-01
      db.connections_active:
        var: db_connections
      db.connections_max: 410
      db.utilization_pct:
        var: conn_utilization_pct
      db.idle_in_transaction:
        var: idle_in_txn
      db.status:
        var: db_status
- sample:
    client:
      choice: DB_CLIENTS
    commit_latency_ms:
      expr: "round(rand.uniform(1.0, 6.0) * (1.0 - f1) + max(9.0, min(18.0, 12.0 + rand.gauss(0, 1.0))) * f1, 1)"
    read_latency_ms:
      expr: "round(rand.uniform(0.8, 4.0) * (1.0 - f1) + max(6.0, min(12.0, 8.5 + rand.gauss(0, 0.8))) * f1, 1)"
    replica_lag_ms:
      expr: "round(rand.uniform(5.0, 60.0), 1)"
    cpu_utilization_pct:
      expr: "round(rand.uniform(18.0, 48.0), 1)"
- metric:
    name: aws.rds.commit_latency_ms
    value:
      var: commit_latency_ms
    unit: ms
- metric:
    name: aws.rds.read_latency_ms
    value:
      var: read_latency_ms
    unit: ms
- metric:
    name: aws.rds.replica_lag_ms
    value:
      var: replica_lag_ms
    unit: ms
- metric:
    name: aws.rds.cpu_utilization_pct
    value:
      var: cpu_utilization_pct
    unit: '%'
- log:
    level: INFO
    message: 'postgresql[orders-prod-pg-01]: latency_stats table={table} client={client} commit_ms={commit_latency_ms} read_ms={read_latency_ms} replica_lag_ms={replica_lag_ms} cpu={cpu_utilization_pct}%'
    attrs:
      operation: latency_stats
      db.table:
        var: table
      db.client:
        var: client
      db.commit_latency_ms:
        var: commit_latency_ms
      db.read_latency_ms:
        var: read_latency_ms
      db.replica_lag_ms:
        var: replica_lag_ms
- sample:
    slow_queries:
      expr: "int(round(rand.uniform(0.0, 3.0) * (1.0 - f1) + max(3.0, min(9.0, 6.0 + rand.gauss(0, 1.0))) * f1))"
    cache_hit_ratio:
      expr: "round(rand.uniform(0.97, 0.995), 3)"
    refused_connections:
      expr: "int(round(max(25.0, min(140.0, 80.0 + rand.gauss(0, 5.0))) * f1))"
    pg_ok:
      choice:
      - 'LOG: checkpoint complete: wrote 412 buffers (0.3%); sync files=18, longest=0.004 s'
      - 'LOG: automatic vacuum of table "orders.public.order_items": index scans: 1, pages removed: 0'
      - 'LOG: automatic analyze of table "orders.public.orders"'
    pg_leak:
      choice:
      - 'FATAL: remaining connection slots are reserved for roles with privileges of the "rds_reserved" role'
      - 'FATAL: remaining connection slots are reserved for roles with privileges of the "rds_reserved" role'
      - 'LOG: duration: 4812.337 ms statement: SELECT order_id, status FROM orders WHERE customer_id = $1 ORDER BY created_at DESC LIMIT 20'
    pg_auth:
      choice:
      - 'FATAL: password authentication failed for user "orders_app"'
    pg_event:
      expr: "pg_leak if f1 > 0.5 else (pg_auth if (13 in all_active and rand.uniform(0.0, 1.0) < 0.6) else pg_ok)"
- metric:
    name: orders_db.slow_query_count
    value:
      var: slow_queries
    unit: queries
- metric:
    name: orders_db.buffer_cache_hit_ratio
    value:
      var: cache_hit_ratio
    unit: ratio
- metric:
    name: orders_db.refused_connections
    value:
      var: refused_connections
    unit: connections
- log:
    level: INFO
    message: 'postgresql[orders-prod-pg-01]: perf_health cache_hit={cache_hit_ratio} slow_queries={slow_queries}/min refused_connections={refused_connections} rds_status=available'
    attrs:
      operation: perf_health
      db.cache_hit_ratio:
        var: cache_hit_ratio
      db.slow_queries:
        var: slow_queries
      db.refused_connections:
        var: refused_connections
- log:
    level: INFO
    message: 'postgresql[orders-prod-pg-01]: {pg_event}'
    attrs:
      operation: postgres_log
      db.system: postgresql
      db.instance: orders-prod-pg-01

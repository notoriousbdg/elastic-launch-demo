service: orders-gateway
sort_order: 2
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_ec2
cloud_availability_zone: us-east-1b
subsystem: edge_api
language: go

topology:
  - [orders-service, /api/v1/orders, POST]

entry_endpoints:
  - [/api/v1/orders, POST]
  - [/api/v1/orders/status, GET]

db_operations: []

emit_fault_logs: true
kpi_emitter: false

constants:
  ECS_TASKS: [orders-gateway-7c4f9d, orders-gateway-b21e68, orders-gateway-e90a35, orders-gateway-4a7d12]
  ROUTES: ["POST /api/v1/orders", "GET /api/v1/orders/status"]

state:
  _requests: {init: 0}
  _last_summary: {init: now}

steps:
  - sample:
      task: {choice: ECS_TASKS}
      route: {choice: ROUTES}
      requests_per_min: {randint: [900, 3600]}
      up_c20:
        expr: "max(0.0, 3800.0 * min(1.0, elapsed.get(20, 0) / 90.0) + rand.gauss(0, 152.0 * min(1.0, elapsed.get(20, 0) / 90.0))) if 20 in all_active else (max(0.0, 3800.0 * (1.0 - min(1.0, since_fix.get(20, 0) / 120.0)) + rand.gauss(0, 152.0 * (1.0 - min(1.0, since_fix.get(20, 0) / 120.0)))) if 20 in fixed_channels else 0.0)"
      up_c2:
        expr: "max(0.0, 150.0 * min(1.0, elapsed.get(2, 0) / 20.0) + rand.gauss(0, 6.0 * min(1.0, elapsed.get(2, 0) / 20.0))) if 2 in all_active else (max(0.0, 150.0 * (1.0 - min(1.0, max(0.0, since_fix.get(2, 0) - 30.0) / 30.0)) + rand.gauss(0, 6.0 * (1.0 - min(1.0, max(0.0, since_fix.get(2, 0) - 30.0) / 30.0)))) if 2 in fixed_channels else 0.0)"
      up_c10:
        expr: "max(0.0, 20.0 * min(1.0, elapsed.get(10, 0) / 20.0) + rand.gauss(0, 1.0 * min(1.0, elapsed.get(10, 0) / 20.0))) if 10 in all_active else (max(0.0, 20.0 * (1.0 - min(1.0, since_fix.get(10, 0) / 90.0)) + rand.gauss(0, 1.0 * (1.0 - min(1.0, since_fix.get(10, 0) / 90.0)))) if 10 in fixed_channels else 0.0)"
      upstream_ms:
        expr: "round(rand.uniform(25.0, 140.0) + up_c20 + up_c2 + up_c10, 1)"
      ft_frac:
        expr: "min(1.0, max(0.0, (since_fix.get(2, 0) - 30.0) / 30.0))"
      ft_low:
        expr: "min(1.0, max(0.0, 0.25 + rand.gauss(0, 0.25)))"
      ft_ramp:
        expr: "min(1.0, elapsed.get(2, 0) / 20.0)"
      healthy_targets:
        expr: "round(4.0 * (1.0 - ft_ramp) + ft_low * ft_ramp) if 2 in all_active else (round(min(4.0, ft_low + (4.0 - ft_low) * ft_frac)) if 2 in fixed_channels else 4)"
      e5_c10:
        expr: "max(0.0, 35.0 * min(1.0, elapsed.get(10, 0) / 20.0) + rand.gauss(0, 1.4 * min(1.0, elapsed.get(10, 0) / 20.0))) if 10 in all_active else (max(0.0, 35.0 * (1.0 - min(1.0, since_fix.get(10, 0) / 90.0)) + rand.gauss(0, 1.4 * (1.0 - min(1.0, since_fix.get(10, 0) / 90.0)))) if 10 in fixed_channels else 0.0)"
      e5_c2:
        expr: "max(0.0, 29.0 * min(1.0, elapsed.get(2, 0) / 20.0) + rand.gauss(0, 1.2 * min(1.0, elapsed.get(2, 0) / 20.0))) if 2 in all_active else (max(0.0, 29.0 * (1.0 - min(1.0, max(0.0, since_fix.get(2, 0) - 30.0) / 30.0)) + rand.gauss(0, 1.2 * (1.0 - min(1.0, max(0.0, since_fix.get(2, 0) - 30.0) / 30.0)))) if 2 in fixed_channels else 0.0)"
      e5_c14:
        expr: "max(0.0, 12.0 * min(1.0, elapsed.get(14, 0) / 15.0) + rand.gauss(0, 0.5 * min(1.0, elapsed.get(14, 0) / 15.0))) if 14 in all_active else (max(0.0, 12.0 * (1.0 - min(1.0, since_fix.get(14, 0) / 60.0)) + rand.gauss(0, 0.5 * (1.0 - min(1.0, since_fix.get(14, 0) / 60.0)))) if 14 in fixed_channels else 0.0)"
      e5_c20:
        expr: "max(0.0, 2.2 * min(1.0, elapsed.get(20, 0) / 90.0) + rand.gauss(0, 0.1 * min(1.0, elapsed.get(20, 0) / 90.0))) if 20 in all_active else (max(0.0, 2.2 * (1.0 - min(1.0, since_fix.get(20, 0) / 120.0)) + rand.gauss(0, 0.1 * (1.0 - min(1.0, since_fix.get(20, 0) / 120.0)))) if 20 in fixed_channels else 0.0)"
      http_5xx_pct:
        expr: "round(min(100.0, rand.uniform(0.0, 0.3) + e5_c10 + e5_c2 + e5_c14 + e5_c20), 2)"
      dns_failures:
        expr: "round(max(0.0, 500.0 * min(1.0, elapsed.get(14, 0) / 15.0) + rand.gauss(0, 25.0 * min(1.0, elapsed.get(14, 0) / 15.0)))) if 14 in all_active else (round(max(0.0, 500.0 * (1.0 - min(1.0, since_fix.get(14, 0) / 60.0)) + rand.gauss(0, 25.0 * (1.0 - min(1.0, since_fix.get(14, 0) / 60.0))))) if 14 in fixed_channels else 0)"
      rt_frac:
        expr: "min(1.0, max(0.0, (since_fix.get(20, 0) - 30.0) / 90.0))"
      running_tasks:
        expr: "round(4.0 + 4.0 * rt_frac) if 20 in fixed_channels else 4"
      task_def:
        expr: "'orders-gateway:48' if 10 in all_active else 'orders-gateway:47'"
      hc_path:
        expr: "'/api/v2/health' if 2 in all_active else '/healthz'"
      min_capacity:
        expr: "8 if 20 in fixed_channels else 4"
      zone_assoc:
        expr: "not (14 in all_active)"
      gw_status:
        expr: "'ANOMALY' if (2 in all_active or (2 in fixed_channels and since_fix.get(2, 0) < 60.0) or 10 in all_active or (10 in fixed_channels and since_fix.get(10, 0) < 90.0) or 14 in all_active or (14 in fixed_channels and since_fix.get(14, 0) < 60.0) or 20 in all_active or (20 in fixed_channels and since_fix.get(20, 0) < 120.0)) else 'NOMINAL'"
      http_4xx_pct: {uniform: [0.5, 2.5], round: 2}
      request_id: {format: "req-{n}", n: {randint: [100000, 999999]}}
  - counter:
      state_key: _requests
      by: 1
  - metric:
      name: orders_gateway.upstream_latency_ms
      value: {var: upstream_ms}
      unit: ms
  - metric:
      name: orders_gateway.requests_per_min
      value: {var: requests_per_min}
      unit: '{requests}/min'
  - metric:
      name: orders_gateway.http_5xx_pct
      value: {var: http_5xx_pct}
      unit: '%'
  - metric:
      name: orders_gateway.http_4xx_pct
      value: {var: http_4xx_pct}
      unit: '%'
  - metric:
      name: orders_gateway.alb_healthy_targets
      value: {var: healthy_targets}
      unit: '{targets}'
  - metric:
      name: orders_gateway.dns_resolution_failures_per_min
      value: {var: dns_failures}
      unit: '{failures}/min'
  - metric:
      name: orders_gateway.running_tasks
      value: {var: running_tasks}
      unit: '{tasks}'
  - log:
      level: INFO
      message: "[gateway] access route=\"{route}\" upstream=orders-service upstream_ms={upstream_ms} ecs_task={task} request_id={request_id}"
      attrs:
        operation: access_log
        gateway.route: {var: route}
        gateway.upstream_ms: {var: upstream_ms}
        aws.ecs.task: {var: task}
        http.request_id: {var: request_id}
  - every:
      seconds: 30
      state_key: _last_summary
      steps:
        - log:
            level: INFO
            message: "[gateway] summary status={gw_status} requests={_requests} requests_per_min={requests_per_min} http_5xx_pct={http_5xx_pct}% alb_healthy_targets={healthy_targets}/4 running_tasks={running_tasks} dns_failures_per_min={dns_failures} upstream_ms={upstream_ms}"
            attrs:
              operation: summary
              gateway.requests: {var: _requests}
              gateway.http_5xx_pct: {var: http_5xx_pct}
              aws.elb.healthy_targets: {var: healthy_targets}
              aws.elb.health_check_path: {var: hc_path}
              aws.ecs.task_definition: {var: task_def}
              aws.ecs.min_capacity: {var: min_capacity}
              aws.ecs.running_tasks: {var: running_tasks}
              dns.private_zone_associated: {var: zone_assoc}
              gateway.status: {var: gw_status}

agent_config:
  id: awsorders-analyst
  name: AWS Orders Platform Operations Analyst
  assessment_tool_name: awsorders_readiness_assessment
  system_prompt: "You are an expert SRE assistant for the AWS Orders Platform.\n\nWhen an incident is reported, your job is\
    \ to:\n1. Diagnose the root cause from the error_type, stack traces, and RCA clues\n2. Recommend a specific remediation\
    \ action\n3. Explain business impact in terms the executive team understands\n\nKnown fault channels and their error types:\n\
    \  - ORD-DB-CONNECTION-EXHAUSTION: Rds Connection Leak\n  - ALB-NO-HEALTHY-TARGETS: Alb No Healthy Targets\n  - PAY-LAMBDA-ERROR-SPIKE:\
    \ Payment Lambda Error Spike\n  - ORD-ECS-MEMORY-LEAK: Orders Service Memory Leak\n  - WEB-EC2-CREDIT-EXHAUSTION: Storefront\
    \ Burst Credit Exhaustion\n  - WEB-WAF-FALSE-POSITIVE: Checkout Waf False Positive\n  - INV-IAM-ACCESS-DENIED: Iam Access\
    \ Denied Storm\n  - NET-SG-REJECTS-DB-TRAFFIC: Security Group Rejects Db Traffic\n  - SUP-AGENTCORE-GATEWAY-ERRORS: Agentcore\
    \ Gateway Failures\n  - ORD-GW-5XX-BAD-DEPLOY: Gateway 5xx Bad Deploy\n  - INV-DDB-HOT-PARTITION: Dynamodb Hot Partition\n\
    \  - PAY-KMS-THROTTLED: Kms Throttling\n  - ORD-SECRET-ROTATION-MISMATCH: Secrets Rotation Mismatch\n  - NET-R53-RESOLUTION-FAILURE:\
    \ Route53 Private Zone Resolution\n  - PAY-IDEMPOTENCY-COLLISION: Idempotency Key Collision\n  - FUL-SQS-CONSUMER-LAG:\
    \ Sqs Fulfillment Consumer Lag\n  - REC-BEDROCK-THROTTLED: Bedrock Throttling\n  - PAY-LAMBDA-COLD-START: Lambda Cold\
    \ Start Latency\n  - WEB-ACM-CERT-EXPIRY: Acm Certificate Expiry\n  - ORD-ECS-SCALING-LAG: Ecs Autoscaling Lag\n\nFor\
    \ each fault, examine the affected_services first, then look for cascade_services that may be experiencing downstream\
    \ effects."
assessment_tool_config:
  id: awsorders_readiness_assessment
  description: 'Comprehensive AWS orders platform readiness assessment. Evaluates the storefront, the ALB and ECS order path,
    RDS Postgres connection and storage headroom, Lambda payment health, SQS fulfillment backlog and Bedrock capacity against
    operational criteria. Returns CloudWatch-backed evidence for each dimension, judged against its own baseline, so risks
    and causal chains can be surfaced. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: orders-service
executive_dashboard_intro: '**AWS Orders Platform KPIs** — orders and revenue, checkout and payments, fulfillment and inventory,
  and platform reliability. Synthetic `business.*` OTLP gauges from `orders-service`.'
executive_kpi_sections:
  - header: '**Orders and revenue** — orders, revenue, basket, shoppers'
    specs:
      - - Orders / min
        - metrics.business.orders_per_min
      - - Revenue (USD/min)
        - metrics.business.revenue_usd_per_min
      - - Average order value (USD)
        - metrics.business.avg_order_value_usd
      - - Units sold / min
        - metrics.business.units_sold_per_min
      - - Cart abandonment (%)
        - metrics.business.cart_abandonment_pct
      - - Active shoppers
        - metrics.business.active_shoppers
  - header: '**Checkout and payments** — success, authorization, declines, refunds'
    specs:
      - - Checkout success (%)
        - metrics.business.checkout_success_pct
      - - Payment authorization rate (%)
        - metrics.business.payment_auth_rate_pct
      - - Payment declines / min
        - metrics.business.payment_declines_per_min
      - - Checkout p95 latency (ms)
        - metrics.business.checkout_latency_p95_ms
      - - Refunds (USD/min)
        - metrics.business.refunds_usd_per_min
      - - Duplicate charge flags / hr
        - metrics.business.duplicate_charge_flags_per_hr
  - header: '**Fulfillment and inventory** — backlog, shipping, stock'
    specs:
      - - Fulfillment backlog (orders)
        - metrics.business.fulfillment_backlog
      - - Orders shipped / min
        - metrics.business.orders_shipped_per_min
      - - Oldest unfulfilled order (min)
        - metrics.business.oldest_unfulfilled_order_min
      - - Stock reservation success (%)
        - metrics.business.stock_reservation_success_pct
      - - Out-of-stock SKUs
        - metrics.business.out_of_stock_skus
      - - Support chats / min
        - metrics.business.support_chats_per_min
  - header: '**Platform reliability** — throughput, errors, latency, availability, cost'
    specs:
      - - Throughput (req/min)
        - metrics.business.throughput_rpm
      - - Error rate (%)
        - metrics.business.error_rate_pct
      - - P99 latency (ms)
        - metrics.business.latency_p99_ms
      - - Availability (%)
        - metrics.business.availability_pct
      - - Cloud spend (USD/hr)
        - metrics.business.cloud_spend_usd_per_hr
      - - Recommendation CTR (%)
        - metrics.business.recommendation_ctr_pct
executive_trend_charts:
  - title: Revenue (USD/min)
    field: metrics.business.revenue_usd_per_min
    y_label: USD/min

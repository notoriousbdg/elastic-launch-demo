scenario_id: aws
scenario_name: AWS Orders Platform
scenario_description: Retail orders platform running entirely on AWS across us-east-1, us-west-2 and eu-west-1. ALB and ECS
  front the order path, RDS Postgres stores orders, Lambda charges payments, SQS drives fulfillment, and Amazon Bedrock powers
  support and recommendations. 20 fault channels, led by an RDS connection leak that cascades into gateway and ALB 5xx.
namespace: awsorders
scenario_icon: 📦
sort_order: 10
nominal_label: ONLINE
schema_version: '1.2'
apm_ml_bucket_span: 1m
generators:
  aws_rds_otel:
    instance_id: orders-db
    connections_baseline: [0, 2]
  aws_cloudwatch_logs:

name: Gateway 5xx Bad Deploy
subsystem: api_gateway
vehicle_section: api_gateway_pipeline
error_type: ORD-GW-5XX-BAD-DEPLOY
sensor_type: health_check
affected_services: [orders-gateway]
cascade_services: [storefront-web]

description: >
  A new ECS task definition revision for orders-gateway ships a misconfigured upstream timeout, and the ALB access log shows roughly a third of requests returning 5xx.

investigation_notes: |
  1. Search body.text for *ORD-GW-5XX-BAD-DEPLOY* and note the task definition revision ({task_def_new}) now serving traffic.
  2. In the ALB access log, filter elb_status_code 5xx on orders-gateway: {error_pct}% of {sampled_requests} requests, with target_processing_time near {upstream_timeout_ms}ms and many 504 responses.
  3. Compare task definition {task_def_new} with {task_def_prev}: UPSTREAM_TIMEOUT_MS changed from {prev_timeout_ms} to {upstream_timeout_ms}.
  4. Check the ECS service events and CloudTrail UpdateService to confirm the rollout time ({deploy_time}) lines up with the first 5xx. The new tasks pass their ELB health checks (the bad value only affects upstream calls), so the deployment completes and the deployment circuit breaker never trips; nothing rolls back on its own.
  5. Verify the cascade: storefront-web checkout calls to orders-gateway fail or retry, while orders-service and orders-db metrics stay normal (orders-service p99 stays at 450-900ms: above the new timeout, far under the previous {prev_timeout_ms}ms).
  6. Confirm the revision on the gateway: attributes.aws.ecs.task_definition on orders-gateway logs reads {task_def_new} while orders_gateway.http_5xx_pct sits at 30-40%.
  7. Remediation: `opsctl rollback ecs-service/orders-gateway --to-revision previous` puts {task_def_prev} back; the rolling deployment starts 4 replacement tasks (about 45 s to start and pass 2 health checks) before the :48 tasks are drained, so the 5xx share returns to baseline in about 90 s.

remediation_action: rollback_ecs_task_definition
remediation_command: |-
  opsctl rollback ecs-service/orders-gateway --to-revision previous

error_message: |
  ORD-GW-5XX-BAD-DEPLOY: orders-gateway 5xx share {error_pct}% after deploy task_definition={task_def_new} upstream_timeout_ms={upstream_timeout_ms}

stack_trace: |
  === ALB 5XX REPORT ===
  load_balancer=app/awsorders-public-alb  service=orders-gateway  cluster=awsorders
  --- DEPLOYMENT ---
    new_task_definition={task_def_new}  previous={task_def_prev}
    deployed_at={deploy_time}  change=UPSTREAM_TIMEOUT_MS {prev_timeout_ms} -> {upstream_timeout_ms}
  --- ALB ACCESS LOG ---
    sampled_requests={sampled_requests}  elb_5xx_pct={error_pct}
    dominant_status=504  target_processing_time_ms={upstream_timeout_ms}
  --- IMPACT ---
    storefront-web checkout_retries={checkout_retries}
  ACTION: rollback_to={task_def_prev}  alert=ORD-GW-5XX-BAD-DEPLOY

infrastructure_events:
  - body: '[CloudTrail] UpdateService: cluster=awsorders service=orders-gateway task_definition=orders-gateway:48 previous=orders-gateway:47 region=us-east-1 event_source=ecs.amazonaws.com'
    severity: WARN
    offset_seconds: -100
    event_name: aws.cloudtrail.UpdateService
    service: orders-gateway
    attributes:
      cloud.provider: aws
      cloud.service: ecs
      aws.cloudtrail.event_name: UpdateService
      aws.ecs.service: orders-gateway
      aws.ecs.task_definition: orders-gateway:48
      infrastructure.source: CloudTrail

correlation_attr:
  key: infra.ecs_task_definition
  value: orders-gateway:48

fault_params:
  task_def_new: orders-gateway:48
  task_def_prev: orders-gateway:47
  prev_timeout_ms: 5000
  upstream_timeout_ms: {choice: [95, 100, 105]}
  deploy_time: 2026-10-21T15:22:00Z
  error_pct: {randint: [30, 40]}
  sampled_requests: {randint: [800, 4000]}
  checkout_retries: {randint: [200, 1200]}

rca_clues:
  orders-gateway:
    deploy.task_definition: orders-gateway:48
    deploy.config_changed: UPSTREAM_TIMEOUT_MS
    alb.elb_5xx_pct: {randint: [30, 40]}
    upstream.orders_service_p99_ms: {randint: [450, 900]}
  storefront-web:
    checkout.gateway_5xx_count: {randint: [200, 1200]}
    checkout.retry_storm: true

business_impact:
  - kpi: business.orders_per_min
    factor: {uniform: [0.55, 0.75]}
  - kpi: business.error_rate_pct
    factor: {uniform: [5.0, 9.0]}
  - kpi: business.availability_pct
    factor: {uniform: [0.92, 0.97]}

generator_impact:
  aws_elb_otel:
    error_fraction: 0.35
    records_per_cycle: 60
  aws_cloudwatch_logs:
    gateway_error_fraction: 0.35
  aws_elb_metrics_otel:
    high_application_load_balancer_target_5xx_error_rate: 300.0
# the package streams keep the fault while the scenario's own metrics converge
generator_hold_seconds: {aws_elb_metrics_otel: 90}
cascade_messages:
  storefront-web:
    - severity: WARN
      message: '[storefront] checkout call to orders-gateway returned HTTP 504 after {upstream_timeout_ms}ms, retrying (attempt 2 of 3)'
fault_scope:
  cluster: awsorders-eks-use1
  workloads: [orders-gateway]
remediation_effects:
  transition_seconds: 90
  log_events:
    - service: orders-gateway
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=ecs.amazonaws.com eventName=UpdateService userIdentity={actor} requestParameters.cluster=awsorders requestParameters.service=orders-gateway requestParameters.taskDefinition=orders-gateway:47 errorCode=none'
      attributes:
        command.target: ecs-service/orders-gateway
    - service: orders-gateway
      severity: INFO
      offset_seconds: 90
      body: '[ECS] service orders-gateway has reached a steady state: taskDefinition=orders-gateway:47 runningCount=4 desiredCount=4'
      attributes:
        aws.ecs.task_definition: orders-gateway:47
  steady_attributes:
    orders-gateway:
      aws.ecs.task_definition: orders-gateway:47
  verification:
    - signal: orders_gateway.http_5xx_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "orders-gateway"'
      field: 'metrics.orders_gateway.http_5xx_pct'
      expect: 'back in 0-0.3 % (was 30-40 %)'
      within_seconds: 120
    - signal: ORD-GW-5XX-BAD-DEPLOY lines
      from: 'logs.otel.awsorders'
      where: 'body.text LIKE "*ORD-GW-5XX-BAD-DEPLOY*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: ECS task definition serving traffic
      from: 'logs.otel.awsorders'
      where: 'resource.attributes.service.name == "orders-gateway"'
      field: 'attributes.aws.ecs.task_definition'
      expect: 'orders-gateway:47 on every line since the fix; orders-gateway:48 stops appearing'
      within_seconds: 120
service_lag_seconds:
  storefront-web: 30

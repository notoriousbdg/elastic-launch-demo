name: Secrets Rotation Mismatch
subsystem: order_management
vehicle_section: order_pipeline
error_type: ORD-SECRET-ROTATION-MISMATCH
sensor_type: health_check
affected_services: [orders-service]
cascade_services: [orders-db]

description: >
  Secrets Manager rotated the orders-db orders_app password but orders-service still caches the previous version, so new database connections fail authentication while already-pooled connections keep working until they recycle.

investigation_notes: |
  1. Search body.text for *ORD-SECRET-ROTATION-MISMATCH* and *password authentication failed* in the orders-db Postgres log for user {db_user}.
  2. In CloudTrail, find RotateSecret and PutSecretValue events for {secret_id}; the new version stage AWSCURRENT was set at {rotation_time}.
  3. Compare secret versions: orders-service reports secret_version_in_use={stale_version_id} while Secrets Manager AWSCURRENT is {current_version_id}.
  4. Check connection pool metrics: {pooled_ok} pooled connections still work, but {auth_failures} new-connection attempts failed; failures grow as pooled connections hit max lifetime.
  5. Confirm the ECS task cached the secret at startup (no refresh interval), so every task launched before rotation is affected.
  6. After approval, sync the rotation by forcing orders-service to refetch AWSCURRENT (rolling ECS redeploy or secret cache refresh) and verify authentication failures stop in the orders-db log.

remediation_action: sync_secret_rotation

error_message: |
  ORD-SECRET-ROTATION-MISMATCH: secret={secret_id} user={db_user} in_use={stale_version_id} current={current_version_id} auth_failures={auth_failures} pooled_ok={pooled_ok}

stack_trace: |
  org.postgresql.util.PSQLException: FATAL: password authentication failed for user "{db_user}"
    at org.postgresql.core.v3.ConnectionFactoryImpl.doAuthentication(ConnectionFactoryImpl.java:693)
    at com.zaxxer.hikari.pool.HikariPool.createPoolEntry(HikariPool.java:471)
    at com.awsorders.orders.db.ConnectionProvider.openConnection(ConnectionProvider.java:58)
    secret_id={secret_id}  rotation_time={rotation_time}
    secret_version_in_use={stale_version_id}  secret_version_current={current_version_id}
    auth_failures={auth_failures}  pooled_connections_ok={pooled_ok}

correlation_attr:
  key: infra.secret_rotation_schedule
  value: orders-db-credentials-rotate-30d-cached-at-startup

fault_params:
  secret_id: prod/orders-db/credentials
  db_user: orders_app
  rotation_time: 2026-10-21T02:00:00Z
  stale_version_id: {format: "{a:08x}-{b:04x}-4{c:03x}-8{d:03x}-{e:012x}", a: {randint: [0, 4294967295]}, b: {randint: [0, 65535]}, c: {randint: [0, 4095]}, d: {randint: [0, 4095]}, e: {randint: [0, 281474976710655]}}
  current_version_id: {format: "{a:08x}-{b:04x}-4{c:03x}-9{d:03x}-{e:012x}", a: {randint: [0, 4294967295]}, b: {randint: [0, 65535]}, c: {randint: [0, 4095]}, d: {randint: [0, 4095]}, e: {randint: [0, 281474976710655]}}
  auth_failures: {randint: [150, 4000]}
  pooled_ok: {randint: [8, 40]}

rca_clues:
  orders-service:
    secret.version_in_use_age_hours: {randint: [6, 72]}
    secret.cache_refresh_enabled: false
    db.new_connection_failures: {randint: [150, 4000]}
  orders-db:
    db.auth_failures_for_user: {randint: [150, 4000]}
    db.active_connections_stable: true

business_impact:
  - kpi: business.throughput_rpm
    factor: {uniform: [0.40, 0.75]}
  - kpi: business.error_rate_pct
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.availability_pct
    factor: {uniform: [0.96, 0.99]}

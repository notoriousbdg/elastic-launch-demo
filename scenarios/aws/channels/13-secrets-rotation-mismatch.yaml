name: Secrets Rotation Mismatch
subsystem: order_management
vehicle_section: order_pipeline
error_type: ORD-SECRET-ROTATION-MISMATCH
sensor_type: health_check
affected_services: [orders-service]
cascade_services: [orders-db]

description: >
  Secrets Manager rotated the orders-db orders_app password (single-user rotation, so the AWSPREVIOUS password stops working as soon as it is changed in Postgres) but orders-service still caches the previous version, so new database connections fail authentication while already-pooled connections keep working until they recycle.

investigation_notes: |
  1. Search body.text for *ORD-SECRET-ROTATION-MISMATCH* and *password authentication failed* in the orders-db Postgres log for user {db_user}.
  2. In CloudTrail, find RotateSecret, PutSecretValue (the AWSPENDING version) and UpdateSecretVersionStage events for {secret_id}; the new version was promoted to AWSCURRENT, and the old one demoted to AWSPREVIOUS, at {rotation_time}. With single-user rotation the AWSPREVIOUS password is already invalid in Postgres, so a task holding it cannot fall back to it.
  3. Compare secret versions: orders-service reports secret_version_in_use={stale_version_id} while Secrets Manager AWSCURRENT is {current_version_id}.
  4. Check connection pool metrics: {pooled_ok} pooled connections still work, but {auth_failures} new-connection attempts failed; failures grow as pooled connections hit HikariCP maxLifetime or are replaced, and every task launched after the rotation is unaffected.
  5. Confirm the ECS task cached the secret at startup (no refresh interval and no retry that re-fetches AWSCURRENT on an authentication failure), so every task launched before rotation is affected.
  6. Confirm db.credential_version on the orders-service logs shows the stale version with db.credential_stage=AWSPREVIOUS, and orders.db_auth_failures_per_min is elevated while orders.db_pool_active_connections stays in band.
  7. Remediation: `opsctl restart ecs-service/orders-service` starts a new deployment so the tasks re-read the AWSCURRENT credential; a restart fixes it only because the new tasks call GetSecretValue and load AWSCURRENT; recovery takes about 90 s as tasks roll and authentication failures in the orders-db log stop.

remediation_action: sync_secret_rotation
remediation_command: |-
  opsctl restart ecs-service/orders-service

error_message: |
  ORD-SECRET-ROTATION-MISMATCH: secret={secret_id} user={db_user} in_use={stale_version_id} current={current_version_id} auth_failures={auth_failures} pooled_ok={pooled_ok}

stack_trace: |
  org.postgresql.util.PSQLException: FATAL: password authentication failed for user "{db_user}"
    at org.postgresql.core.v3.ConnectionFactoryImpl.doAuthentication(ConnectionFactoryImpl.java:693)
    at com.zaxxer.hikari.pool.HikariPool.createPoolEntry(HikariPool.java:471)
    at com.awsorders.orders.db.ConnectionProvider.openConnection(ConnectionProvider.java:58)
    secret_id={secret_id}  rotation_time={rotation_time}
    secret_version_in_use={stale_version_id}  secret_version_current={current_version_id}
    auth_failures={auth_failures}  pooled_connections_ok={pooled_ok}

correlation_attr:
  key: infra.secret_rotation_schedule
  value: orders-db-credentials-rotate-30d-cached-at-startup

infrastructure_events:
  - body: '[CloudTrail] RotateSecret: secretId=prod/orders-db/credentials rotationRules.automaticallyAfterDays=30 AWSCURRENT moved to c9a2f6d1-52b7-4e08-8d3a-0f61b7e4a2c5, AWSPREVIOUS now e41c07b2-8a3d-4f15-9b60-7d2a1c5e93f8 region=us-east-1 event_source=secretsmanager.amazonaws.com'
    severity: INFO
    event_name: aws.cloudtrail.RotateSecret
    service: orders-service
    offset_seconds: -120
    attributes:
      cloud.provider: aws
      cloud.service: secretsmanager
      aws.cloudtrail.event_name: RotateSecret
      aws.secretsmanager.secret_id: prod/orders-db/credentials
      infrastructure.source: CloudTrail

fault_params:
  secret_id: prod/orders-db/credentials
  db_user: orders_app
  rotation_time: 2026-10-21T02:00:00Z
  stale_version_id: e41c07b2-8a3d-4f15-9b60-7d2a1c5e93f8
  current_version_id: c9a2f6d1-52b7-4e08-8d3a-0f61b7e4a2c5
  auth_failures: {randint: [400, 2000]}
  pooled_ok: {randint: [60, 200]}

rca_clues:
  orders-service:
    secret.version_in_use_age_hours: {randint: [6, 72]}
    secret.cache_refresh_enabled: false
    db.new_connection_failures: {randint: [400, 2000]}
  orders-db:
    db.auth_failures_for_user: {randint: [400, 2000]}
    db.active_connections_stable: true

business_impact:
  - kpi: business.throughput_rpm
    factor: {uniform: [0.40, 0.75]}
  - kpi: business.error_rate_pct
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.availability_pct
    factor: {uniform: [0.96, 0.99]}

fault_scope:
  cluster: awsorders-eks-use1
  workloads: [orders-service, orders-db]

cascade_messages:
  orders-db:
    - severity: ERROR
      message: 'postgresql[orders-prod-pg-01]: FATAL: password authentication failed for user "{db_user}" (client orders-service, connection attempt rejected)'

remediation_effects:
  transition_seconds: 90
  log_events:
    - service: orders-service
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=ecs.amazonaws.com eventName=UpdateService userIdentity={actor} requestParameters.cluster=awsorders requestParameters.service=orders-service requestParameters.forceNewDeployment=true errorCode=none'
      attributes:
        operation: command
        command.target: ecs-service/orders-service
        aws.cloudtrail.event_name: UpdateService
    - service: orders-service
      severity: INFO
      offset_seconds: 45
      body: '[ECS] service orders-service has reached a steady state: 6 of 6 tasks started, secret prod/orders-db/credentials loaded at stage AWSCURRENT'
      attributes:
        operation: service_deploy
        db.credential_version: c9a2f6d1-52b7-4e08-8d3a-0f61b7e4a2c5
        db.credential_stage: AWSCURRENT
  steady_attributes:
    orders-service:
      db.credential_version: c9a2f6d1-52b7-4e08-8d3a-0f61b7e4a2c5
      db.credential_stage: AWSCURRENT
  verification:
    - signal: orders.db_auth_failures_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "orders-service"'
      field: 'metrics.orders.db_auth_failures_per_min'
      expect: 'back in 0-2 (was 80-400)'
      within_seconds: 120
    - signal: ORD-SECRET-ROTATION-MISMATCH lines
      from: 'logs.otel.awsorders'
      where: 'body.text LIKE "*ORD-SECRET-ROTATION-MISMATCH*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: orders-db credential version in use
      from: 'logs.otel.awsorders'
      where: 'resource.attributes.service.name == "orders-service"'
      field: 'attributes.db.credential_version'
      expect: 'c9a2f6d1-52b7-4e08-8d3a-0f61b7e4a2c5 on every line logged since the fix; e41c07b2-8a3d-4f15-9b60-7d2a1c5e93f8 stops appearing'
      within_seconds: 120

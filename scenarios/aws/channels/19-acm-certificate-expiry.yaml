name: Acm Certificate Expiry
subsystem: security
vehicle_section: security_pipeline
error_type: WEB-ACM-CERT-EXPIRY
sensor_type: certificate_expiry
affected_services: [storefront-web]
cascade_services: [orders-gateway]

description: >
  The ACM certificate on the storefront ALB HTTPS listener has expired because its DNS validation CNAME record was missing, so managed renewal never completed and clients now fail the TLS handshake.

investigation_notes: |
  1. Search body.text LIKE *WEB-ACM-CERT-EXPIRY* and confirm certificate_arn={certificate_arn} shows status=EXPIRED, expired {expired_hours_ago}h ago.
  2. In CloudWatch AWS/CertificateManager check DaysToExpiry for the certificate; it sat below the 30-day alarm threshold for weeks and has now reached 0, with renewal_status={renewal_status} (ACM marks managed renewal FAILED once a certificate expires unvalidated).
  3. Describe the certificate (acm:DescribeCertificate): DomainValidationOptions for {domain_name} still shows ValidationStatus=PENDING_VALIDATION because the CNAME {validation_record} is not present in the Route 53 hosted zone.
  4. Confirm the impact: the ALB listener still serves the expired certificate, so browsers and internal clients reject the TLS handshake (certificate expired). The key and the CA are not compromised; only validity has lapsed.
  5. Check orders-gateway rca_clues (tls.upstream_cert_expired, tls.handshake_failures): internal clients calling the storefront fail on the same expired certificate.
  6. Remediation: an expired ACM certificate cannot be renewed. Recreate the DNS validation CNAME in Route 53, request a replacement certificate (acm request-certificate --validation-method DNS), wait for status ISSUED, then attach it to the listener (aws elbv2 modify-listener --certificates CertificateArn=<new-arn>). The listener switches without downtime.
remediation_action: replace_acm_certificate

error_message: |
  WEB-ACM-CERT-EXPIRY: certificate={certificate_arn} domain={domain_name} status=EXPIRED expired_hours_ago={expired_hours_ago} renewal_status={renewal_status}

stack_trace: |
  === ACM CERTIFICATE EXPIRY REPORT ===
  listener=storefront-alb:443  region=us-east-1  domain={domain_name}
  --- CERTIFICATE ---
    arn={certificate_arn}
    type=AMAZON_ISSUED  validation_method=DNS  status=EXPIRED
    expired_hours_ago={expired_hours_ago}  renewal_status={renewal_status}
  --- DOMAIN VALIDATION ---
    domain={domain_name}  validation_status=PENDING_VALIDATION
    missing_cname={validation_record}
  --- ASSESSMENT ---
    handshakes=FAILING  customer_impact=tls_errors_on_storefront  cause=dns_validation_record_missing
  ACTION: recreate_validation_record=true  replace_certificate=true  alert=WEB-ACM-CERT-EXPIRY

infrastructure_events:
- body: '[CloudWatch] Alarm in ALARM: awsorders-storefront-acm-days-to-expiry < 14 region=us-east-1'
  severity: WARN
  event_name: aws.cloudwatch.AlarmStateChange
  service: storefront-web
  attributes:
    cloud.provider: aws
    cloud.service: acm
    aws.cloudwatch.alarm_name: awsorders-storefront-acm-days-to-expiry
    aws.acm.validation_method: DNS
    infrastructure.source: CloudWatch

correlation_attr:
  key: aws.acm.certificate_arn
  value: arn:aws:acm:us-east-1:781386958653:certificate/7c1e4b2a-9d3f-4a68-b5e1-2f0c8a6d41b7

fault_params:
  certificate_arn: arn:aws:acm:us-east-1:781386958653:certificate/7c1e4b2a-9d3f-4a68-b5e1-2f0c8a6d41b7
  domain_name: shop.awsorders.example.com
  expired_hours_ago: {randint: [1, 30]}
  renewal_status: FAILED
  validation_record: _a1b2c3d4e5f60718.shop.awsorders.example.com

rca_clues:
  storefront-web:
    acm.certificate_status: EXPIRED
    acm.expired_hours_ago: {randint: [1, 30]}
    acm.validation_status: PENDING_VALIDATION
    acm.validation_cname_present: false
  orders-gateway:
    tls.upstream_cert_expired: true
    tls.handshake_failures: {randint: [400, 3000]}

business_impact:
  - kpi: business.availability_pct
    value: {uniform: [73.43, 84.49], round: 2}
  - kpi: business.orders_per_min
    value: {uniform: [120.9, 139.1], round: 0}

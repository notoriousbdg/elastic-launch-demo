name: Lambda Cold Start Latency
subsystem: payments
vehicle_section: payments_pipeline
error_type: PAY-LAMBDA-COLD-START
sensor_type: response_latency
affected_services: [payment-processor]
cascade_services: [orders-service]

description: >
  After a scale-up the payment-processor Lambda starts many new execution environments and cold starts add seconds of latency to checkout charges.

investigation_notes: |
  1. Search body.text LIKE *PAY-LAMBDA-COLD-START* and confirm function={function_name} reports init_duration_ms={init_duration_ms} on cold invocations.
  2. In CloudWatch Lambda Insights compare InitDuration and Duration; cold_start_pct={cold_start_pct}% of invocations is far above the baseline of ~2%, while error counts stay flat.
  3. Check ConcurrentExecutions against ProvisionedConcurrencyUtilization: provisioned={provisioned_concurrency} is exhausted, so spillover requests land on fresh on-demand environments.
  4. Confirm no deployment changed the package: code_size and runtime={runtime} are unchanged, so the cost is the init phase after a traffic ramp, not a regression.
  5. Check orders-service rca_clues (payment.call_p99_ms): charge calls slow to several seconds but still succeed with no timeouts at the {client_timeout_ms}ms client limit.
  6. Remediation is bounded and safe: raise provisioned concurrency on alias live to {target_provisioned}; it is reversible and the p99 recovers once environments are pre-initialized.
remediation_action: raise_provisioned_concurrency

error_message: |
  PAY-LAMBDA-COLD-START: function={function_name} init_duration_ms={init_duration_ms} cold_start_pct={cold_start_pct} provisioned={provisioned_concurrency}

stack_trace: |
  === LAMBDA COLD START REPORT ===
  function={function_name}  runtime={runtime}  region=us-west-2  alias=live
  --- REPORT LINE ---
    REPORT RequestId: {request_id}  Duration: {duration_ms} ms  Billed Duration: {duration_ms} ms  Memory Size: 1024 MB  Max Memory Used: 412 MB  Init Duration: {init_duration_ms} ms
  --- CLOUDWATCH METRICS ---
    cold_start_pct={cold_start_pct}%  (baseline ~2%)
    ProvisionedConcurrencyUtilization=100%  provisioned={provisioned_concurrency}
    Errors=0  Throttles=0
  --- ASSESSMENT ---
    cause=provisioned_concurrency_exhausted  client_timeout_ms={client_timeout_ms}
  ACTION: raise_provisioned_concurrency=true  target={target_provisioned}  alert=PAY-LAMBDA-COLD-START

infrastructure_events:
- body: '[CloudWatch] Alarm in ALARM: awsorders-payment-processor InitDuration p95 > 1500ms for 3 datapoints region=us-west-2'
  severity: WARN
  event_name: aws.cloudwatch.AlarmStateChange
  service: payment-processor
  attributes:
    cloud.provider: aws
    cloud.service: lambda
    aws.cloudwatch.alarm_name: awsorders-payment-processor-init-duration
    aws.lambda.function_name: awsorders-payment-processor
    infrastructure.source: CloudWatch

correlation_attr:
  key: aws.lambda.provisioned_concurrency
  value: payment-processor-live-pc-10

fault_params:
  function_name: awsorders-payment-processor
  runtime: python3.12
  request_id: {format: "{a:08x}-{b:04x}-4{c:03x}-a{d:03x}-{e:012x}", a: {randint: [0, 4294967295]}, b: {randint: [0, 65535]}, c: {randint: [0, 4095]}, d: {randint: [0, 4095]}, e: {randint: [0, 281474976710655]}}
  init_duration_ms: {randint: [2200, 6500]}
  duration_ms: {randint: [180, 650]}
  cold_start_pct: {randint: [25, 70]}
  provisioned_concurrency: 10
  target_provisioned: {choice: [40, 60, 80]}
  client_timeout_ms: 10000

rca_clues:
  payment-processor:
    lambda.init_duration_ms: {randint: [2200, 6500]}
    lambda.cold_start_pct: {randint: [25, 70]}
    lambda.provisioned_utilization_pct: 100
  orders-service:
    payment.call_p99_ms: {randint: [3000, 7500]}
    payment.slow_charge_count: {randint: [100, 800]}

business_impact:
  - kpi: business.latency_p99_ms
    factor: {uniform: [2.5, 5.0]}
  - kpi: business.orders_per_min
    factor: {uniform: [0.85, 0.95]}
  - kpi: business.availability_pct
    factor: {uniform: [0.99, 0.998]}

generator_impact:
  aws_lambda_otel:
    high_average_duration: 4000.0
    high_concurrent_executions: 1000.0

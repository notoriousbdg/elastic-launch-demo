name: Bedrock Throttling
subsystem: personalization
vehicle_section: personalization_pipeline
error_type: REC-BEDROCK-THROTTLED
sensor_type: health_check
affected_services: [recommendation-service]
cascade_services: [storefront-web]

description: >
  During a traffic peak recommendation-service Bedrock invocations are throttled with ThrottlingException and slow down, leaving storefront personalization slow or empty.

investigation_notes: |
  1. Search body.text LIKE *REC-BEDROCK-THROTTLED* and confirm model_id={model_id} returns ThrottlingException at rate throttled_pct={throttled_pct}%.
  2. Compare CloudWatch AWS/Bedrock InvocationThrottles and InvocationLatency for model_id={model_id} against baseline; throttles rising with latency p99 near {latency_ms}ms points to on-demand quota pressure, not a model outage.
  3. Check recommendation-service request volume: traffic is {traffic_multiplier}x baseline, and the Service Quotas value for requests per minute is {quota_rpm} RPM.
  4. Confirm there are no AccessDenied or ValidationException errors and guardrail interventions are flat, so only capacity is limited.
  5. Check storefront-web rca_clues (storefront.recommendations_fallback_rate): the storefront is rendering default carousels while recommendation calls time out.
  6. Remediation is bounded and safe: route the same model through the EU cross-region inference profile {fallback_profile} so requests spread across EU regions; revert to the single-region model ID once InvocationThrottles returns to baseline.
remediation_action: fallback_bedrock_model

error_message: |
  REC-BEDROCK-THROTTLED: ThrottlingException model_id={model_id} throttled_pct={throttled_pct} latency_ms={latency_ms} quota_rpm={quota_rpm}

stack_trace: |
  === BEDROCK INVOKE THROTTLING REPORT ===
  service=recommendation-service  region=eu-west-1  api=bedrock-runtime:InvokeModel
  --- ERROR ---
    botocore.errorfactory.ThrottlingException: Too many requests, please wait before trying again.
    model_id={model_id}  retries_exhausted=true
  --- CLOUDWATCH METRICS (AWS/Bedrock) ---
    InvocationThrottles_pct={throttled_pct}%  InvocationLatency_p99={latency_ms}ms  (baseline ~900ms)
    traffic_vs_baseline={traffic_multiplier}x  quota_rpm={quota_rpm}
  --- ASSESSMENT ---
    access_denied=0  validation_errors=0  cause=on_demand_quota_pressure
  ACTION: fallback_model=true  inference_profile={fallback_profile}  alert=REC-BEDROCK-THROTTLED

infrastructure_events:
- body: '[CloudWatch] Alarm in ALARM: awsorders-bedrock-invocation-throttles > 50 for 5 datapoints region=eu-west-1'
  severity: WARN
  event_name: aws.cloudwatch.AlarmStateChange
  service: recommendation-service
  attributes:
    cloud.provider: aws
    cloud.service: bedrock
    aws.cloudwatch.alarm_name: awsorders-bedrock-invocation-throttles
    aws.bedrock.error_code: ThrottlingException
    infrastructure.source: CloudWatch

correlation_attr:
  key: bedrock.model_id
  value: anthropic.claude-3-haiku-20240307-v1:0

fault_params:
  model_id: anthropic.claude-3-haiku-20240307-v1:0
  throttled_pct: {randint: [35, 72]}
  latency_ms: {randint: [2600, 5200]}
  traffic_multiplier: {uniform: [2.5, 4.5], round: 1}
  quota_rpm: 1000
  fallback_profile: eu.anthropic.claude-3-haiku-20240307-v1:0

rca_clues:
  recommendation-service:
    bedrock.throttle_rate_pct: {randint: [35, 72]}
    bedrock.retry_exhausted_count: {randint: [200, 1500]}
    bedrock.quota_utilization_pct: {randint: [100, 140]}
  storefront-web:
    storefront.recommendations_fallback_rate: {uniform: [0.4, 0.9], round: 2}
    storefront.carousel_timeout_count: {randint: [100, 900]}

business_impact:
  - kpi: business.orders_per_min
    value: {uniform: [120.9, 139.1], round: 0}
  - kpi: business.latency_p99_ms
    factor: {uniform: [1.3, 2.0]}
  - kpi: business.error_rate_pct
    value: {uniform: [7.67, 8.83], round: 2}

generator_impact:
  aws_bedrock:
    throttle_multiplier: 8.0
    latency_multiplier: 3.0

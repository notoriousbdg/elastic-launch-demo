name: Route53 Private Zone Resolution
subsystem: edge_api
vehicle_section: edge_pipeline
error_type: NET-R53-RESOLUTION-FAILURE
sensor_type: health_check
affected_services: [orders-gateway]
cascade_services: [fulfillment-worker]

description: >
  A Route 53 private hosted zone was disassociated from the VPC, so orders-gateway cannot resolve internal service names and fulfillment-worker cannot resolve its SQS interface endpoint.

investigation_notes: |
  1. Search body.text for *NET-R53-RESOLUTION-FAILURE* and group by dns.question.name to see which names fail, such as {failed_hostname}.
  2. In CloudTrail, look for DisassociateVPCFromHostedZone on zone {hosted_zone_id} ({zone_name}) at {disassociation_time} and identify the principal ({changed_by}) that made the change; each VPC is detached by its own call.
  3. Check Route 53 Resolver query logs: queries for {zone_name} from vpc {vpc_id} return NXDOMAIN or SERVFAIL since the change, with {nxdomain_count} failures in the window.
  4. Confirm the impact on orders-gateway: upstream connect errors to internal names rise while direct IP calls still work, which rules out ALB or target health.
  5. Check fulfillment-worker: its SQS client uses endpoint override {sqs_endpoint}, a CNAME in the same private zone that points at the us-west-2 SQS interface endpoint. The same change disassociated the zone from the us-west-2 VPC, so the name returns NXDOMAIN, ReceiveMessage fails, and the SQS fulfillment queue backlog and oldest message age grow.
  6. Confirm the association on the gateway: attributes.dns.private_zone_associated on orders-gateway logs is false and orders_gateway.dns_resolution_failures_per_min is 120-900.
  7. Remediation: `opsctl restore hosted-zone/awsorders.internal --vpc vpc-0f3a9c2b7d1e48a65,vpc-0b7e51d9a2c64f380` reassociates the zone with both the us-east-1 and us-west-2 VPCs (AssociateVPCWithHostedZone); the change shows PENDING for up to a minute before INSYNC, so resolution recovers in about 60 s for orders-gateway and fulfillment-worker.

remediation_action: reassociate_private_hosted_zone
remediation_command: |-
  opsctl restore hosted-zone/awsorders.internal --vpc vpc-0f3a9c2b7d1e48a65,vpc-0b7e51d9a2c64f380

error_message: |
  NET-R53-RESOLUTION-FAILURE: zone={zone_name} hosted_zone_id={hosted_zone_id} vpc={vpc_id} host={failed_hostname} rcode=NXDOMAIN failures={nxdomain_count}

stack_trace: |
  dial tcp: lookup {failed_hostname} on 10.1.0.2:53: no such host
  goroutine 1873 [running]:
  orders-gateway/proxy.(*Upstream).Dial(...)
  	/src/proxy/upstream.go:134
  orders-gateway/proxy.(*Router).Forward(...)
  	/src/proxy/router.go:96
    resolver=10.1.0.2  vpc={vpc_id}  hosted_zone_id={hosted_zone_id}  zone_name={zone_name}
    disassociated_at={disassociation_time}  nxdomain_count={nxdomain_count}
    fulfillment-worker: lookup {sqs_endpoint}: no such host (SQS interface endpoint)

correlation_attr:
  key: infra.route53_zone_association
  value: Z04812937NQ6W0TPXKRL8-vpc-disassociated

fault_params:
  zone_name: awsorders.internal
  hosted_zone_id: Z04812937NQ6W0TPXKRL8
  changed_by: arn:aws:sts::781386958653:assumed-role/platform-network-admin/maria.okafor
  vpc_id: vpc-0f3a9c2b7d1e48a65
  failed_hostname: {choice: [orders-service.awsorders.internal, inventory.awsorders.internal, payments.awsorders.internal]}
  sqs_endpoint: sqs.awsorders.internal
  disassociation_time: 2026-10-21T09:41:00Z
  nxdomain_count: {randint: [300, 9000]}

rca_clues:
  orders-gateway:
    dns.nxdomain_rate_per_min: {randint: [120, 900]}
    upstream.connect_errors: {randint: [200, 2500]}
    dns.public_names_resolving: true
  fulfillment-worker:
    sqs.endpoint_resolution_failed: true
    sqs.receive_errors: {randint: [50, 700]}
    queue.messages_visible: {randint: [500, 8000]}

business_impact:
  - kpi: business.throughput_rpm
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.error_rate_pct
    factor: {uniform: [4.0, 8.0]}
  - kpi: business.availability_pct
    factor: {uniform: [0.92, 0.97]}

generator_impact:
  aws_sqs_otel:
    high_backlog: 3000.0
    oldest_message_age_high: 600.0
# the package streams keep the fault while the scenario's own metrics converge
generator_hold_seconds: {aws_sqs_otel: 60}
cascade_messages:
  fulfillment-worker:
    - severity: ERROR
      message: '[fulfillment] sqs ReceiveMessage failed: lookup {sqs_endpoint}: no such host (rcode=NXDOMAIN), retrying in 5s'
fault_scope:
  cluster: awsorders-eks-use1
  workloads: [orders-gateway]
infrastructure_events:
  - service: orders-gateway
    severity: WARN
    offset_seconds: -120
    event_name: aws.cloudtrail.DisassociateVPCFromHostedZone
    body: '[CloudTrail] DisassociateVPCFromHostedZone: hostedZoneId={hosted_zone_id} zone={zone_name} vpc=vpc-0f3a9c2b7d1e48a65,vpc-0b7e51d9a2c64f380 userIdentity={changed_by} event_source=route53.amazonaws.com region=us-east-1'
    attributes:
      cloud.provider: aws
      cloud.service: route53
      aws.cloudtrail.event_name: DisassociateVPCFromHostedZone
      aws.route53.hosted_zone_id: '{hosted_zone_id}'
      infrastructure.source: CloudTrail
remediation_effects:
  transition_seconds: 60
  log_events:
    - service: orders-gateway
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=route53.amazonaws.com eventName=AssociateVPCWithHostedZone userIdentity={actor} requestParameters.hostedZone=awsorders.internal requestParameters.vpc=vpc-0f3a9c2b7d1e48a65,vpc-0b7e51d9a2c64f380 errorCode=none'
      attributes:
        command.target: hosted-zone/awsorders.internal
    - service: orders-gateway
      severity: INFO
      offset_seconds: 40
      body: '[gateway] resolver 10.1.0.2 answering for awsorders.internal from vpc-0f3a9c2b7d1e48a65 and vpc-0b7e51d9a2c64f380; upstream names resolve again'
      attributes:
        dns.private_zone_associated: true
  steady_attributes:
    orders-gateway:
      dns.private_zone_associated: true
  verification:
    - signal: orders_gateway.dns_resolution_failures_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "orders-gateway"'
      field: 'metrics.orders_gateway.dns_resolution_failures_per_min'
      expect: 'back to 0 (was 120-900)'
      within_seconds: 90
    - signal: NET-R53-RESOLUTION-FAILURE lines
      from: 'logs.otel.awsorders'
      where: 'body.text LIKE "*NET-R53-RESOLUTION-FAILURE*"'
      expect: '0 new lines'
      within_seconds: 90
    - signal: private hosted zone association
      from: 'logs.otel.awsorders'
      where: 'resource.attributes.service.name == "orders-gateway"'
      field: 'attributes.dns.private_zone_associated'
      expect: 'true on every line since the fix; false stops appearing'
      within_seconds: 90
service_lag_seconds:
  fulfillment-worker: 45

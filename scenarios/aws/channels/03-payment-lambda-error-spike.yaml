name: Payment Lambda Error Spike
subsystem: payments
vehicle_section: payments_pipeline
error_type: PAY-LAMBDA-ERROR-SPIKE
sensor_type: error_rate
affected_services: [payment-processor]
cascade_services: [orders-service]

description: >
  A bad dependency-layer update makes the payment-processor Lambda fail and run long, so orders-service cannot confirm charges at checkout.

investigation_notes: |
  1. Search body.text containing *PAY-LAMBDA-ERROR-SPIKE* and check the Lambda Errors metric for {function_name}: the error rate is about {error_rate_pct}% against a baseline under 1%.
  2. Check the Duration p99 for {function_name}: tail duration is {tail_duration_ms}ms against a baseline of a few hundred ms, with invocations ending at the {timeout_ms}ms function timeout. The failed import re-runs init inside every invoke; the downstream card-network call p99 stays under 300ms, so a slow dependency is ruled out.
  3. Read the CloudWatch Logs for the failing invocations: {exception} raised while importing {layer_package}, which appears only on version {bad_version}.
  4. Check CloudTrail for PublishLayerVersion and UpdateFunctionConfiguration events by {changed_by}: layer {layer_name} moved to version {layer_version} shortly before the first error.
  5. Confirm the cascade in orders-service: charge calls to payment-processor fail with {failed_charges} errors and orders stay in state PAYMENT_PENDING.
  6. Roll the function alias {alias_name} back to the previous published version and watch Errors and Duration p99 return to baseline.

remediation_action: rollback_lambda_version

error_message: |
  PAY-LAMBDA-ERROR-SPIKE: function={function_name} version={bad_version} error_rate_pct={error_rate_pct} duration_p99_ms={tail_duration_ms} layer={layer_name}:{layer_version} exception={exception}

stack_trace: |
  === LAMBDA ERROR REPORT ===
  function={function_name}  alias={alias_name}  runtime=python3.12  region=us-west-2
  --- CLOUDTRAIL EVENT ---
    event_name=UpdateFunctionConfiguration  source=lambda.amazonaws.com
    user={changed_by}  layer={layer_name}:{layer_version}
  --- INVOCATION FAILURE ---
    [ERROR] {exception}: Unable to import module 'handler': /lib64/libc.so.6: version `GLIBC_2.28' not found (required by /opt/python/{layer_package}/hazmat/bindings/_rust.abi3.so)
    INIT_REPORT Init Duration: 412.37 ms Phase: invoke Status: error Error Type: {exception}
  --- IMPACT ---
    error_rate_pct={error_rate_pct}  failed_charges={failed_charges}
    orders-service orders stuck in PAYMENT_PENDING
  ACTION: rollback_alias={alias_name}  alert=PAY-LAMBDA-ERROR-SPIKE

infrastructure_events:
- body: '[CloudTrail] UpdateFunctionConfiguration: function=payment-processor layer=payment-deps:42 initiated_by=deploy-pipeline region=us-west-2 event_source=lambda.amazonaws.com'
  severity: WARN
  event_name: aws.cloudtrail.UpdateFunctionConfiguration
  service: payment-processor
  attributes:
    cloud.provider: aws
    cloud.service: lambda
    aws.cloudtrail.event_name: UpdateFunctionConfiguration
    aws.lambda.function: payment-processor
    infrastructure.source: CloudTrail

correlation_attr:
  key: infra.lambda_layer_version
  value: payment-deps:42

fault_params:
  function_name: payment-processor
  alias_name: live
  bad_version: '58'
  error_rate_pct: {randint: [22, 30]}
  tail_duration_ms: {randint: [14000, 15000]}
  timeout_ms: 15000
  layer_name: payment-deps
  layer_version: '42'
  layer_package: cryptography
  exception: Runtime.ImportModuleError
  changed_by: {choice: [arn:aws:iam::781386958653:role/deploy-pipeline, arn:aws:iam::781386958653:user/payments-dev]}
  failed_charges: {randint: [150, 1800]}

rca_clues:
  payment-processor:
    lambda.error_rate_pct: {randint: [22, 30]}
    lambda.duration_p99_ms: {randint: [14000, 15000]}
    lambda.downstream_call_p99_ms: {randint: [80, 250]}
    lambda.layer_version: payment-deps:42
  orders-service:
    orders.pending_payment_count: {randint: [100, 900]}
    orders.charge_failures: {randint: [150, 1800]}

business_impact:
- kpi: business.payment_auth_rate_pct
  factor:
    uniform: [0.7, 0.88]
    round: 2
- kpi: business.throughput_rpm
  factor:
    uniform: [0.35, 0.6]
- kpi: business.availability_pct
  factor:
    uniform: [0.75, 0.9]
- kpi: business.error_rate_pct
  factor:
    uniform: [5.0, 9.0]
generator_impact:
  aws_lambda_otel:
    high_error_rate: 25.0

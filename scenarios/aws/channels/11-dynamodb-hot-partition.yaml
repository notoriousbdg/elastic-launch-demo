name: Dynamodb Hot Partition
subsystem: database
vehicle_section: database_pipeline
error_type: INV-DDB-HOT-PARTITION
sensor_type: health_check
affected_services: [inventory-service]
cascade_services: [orders-service]

description: >
  A flash-sale SKU concentrates stock-counter writes on one DynamoDB partition key, pushing writes to a single key above the table's 500 provisioned WCU, so DynamoDB returns ProvisionedThroughputExceededException and inventory reserves are throttled. The key's demand stays under the 1000 WCU/s per-partition ceiling, so lifting the table cap clears it.

investigation_notes: |
  1. Search body.text for *INV-DDB-HOT-PARTITION* and group by sku to confirm a single partition key dominates the {throttled_requests} throttled reserves.
  2. In CloudWatch, compare WriteThrottleEvents on table {table_name} with ConsumedWriteCapacityUnits: consumed capacity sits at the provisioned cap ({consumed_wcu} of {provisioned_wcu} WCU) while the throttle count is high and write latency (after SDK retries with backoff) has risen from milliseconds to seconds.
  3. Check CloudWatch Contributor Insights for the table: the top contributor should be sku={hot_sku} with roughly {hot_key_share_pct}% of write traffic, about {hot_key_demand_wcu} WCU/s of demand. That is above the table's {provisioned_wcu} provisioned WCU but below the 1000 WCU/s limit on a single partition, so raising the table cap is enough; a key above 1000 WCU/s would stay throttled on any capacity mode and would need key sharding or a write buffer in the application.
  4. Trace the cascade: orders-service reserve calls to inventory-service exceed the {reserve_timeout_ms}ms timeout, so checkout returns stock-unavailable even though stock exists.
  5. Correlate with the flash-sale campaign start about 90 seconds before the first throttle: stock-counter writes concentrate on one SKU while the table is still provisioned at {provisioned_wcu} WCU (infra.ddb_table_config).
  6. Confirm inventory.dynamodb.throttled_requests is high and inventory.dynamodb.consumed_write_capacity_units is at the cap, with aws.dynamodb.billing_mode=PROVISIONED on the inventory logs.
  7. Remediation: `opsctl patch dynamodb-table/awsorders-inventory --billing-mode PAY_PER_REQUEST` switches the table to on-demand (allowed once per 24 hours; the table stays available while it is UPDATING), so writes are no longer held to the 500 WCU provisioned cap and the hot key is served up to the per-partition limit; throttling clears and write latency recovers in about 120 s.

remediation_action: switch_dynamodb_to_on_demand
remediation_command: |-
  opsctl patch dynamodb-table/awsorders-inventory --billing-mode PAY_PER_REQUEST

error_message: |
  INV-DDB-HOT-PARTITION: table={table_name} sku={hot_sku} error=ProvisionedThroughputExceededException throttled_requests={throttled_requests} consumed_wcu={consumed_wcu} provisioned_wcu={provisioned_wcu}

stack_trace: |
  Amazon.DynamoDBv2.Model.ProvisionedThroughputExceededException: The level of configured provisioned throughput for the table was exceeded. Consider increasing your provisioning level with the UpdateTable API.
    at InventoryService.StockCounterStore.UpdateItemAsync(String sku, Int32 qty) in /src/InventoryService/StockCounterStore.cs:line 142
    at InventoryService.ReserveHandler.Reserve(ReserveRequest req) in /src/InventoryService/ReserveHandler.cs:line 77
    table={table_name}  partition_key=sku  hot_key={hot_sku}
    hot_key_share_pct={hot_key_share_pct}  hot_key_demand_wcu={hot_key_demand_wcu}  consumed_wcu={consumed_wcu}  provisioned_wcu={provisioned_wcu}
    sdk_retries_exhausted=true  reserve_timeout_ms={reserve_timeout_ms}

correlation_attr:
  key: infra.ddb_table_config
  value: awsorders-inventory-provisioned-500wcu-single-sku-partition-key

fault_params:
  table_name: awsorders-inventory
  hot_sku: {format: "SKU-{n}", n: {randint: [10000, 99999]}}
  throttled_requests: {randint: [800, 12000]}
  consumed_wcu: {randint: [480, 500]}
  provisioned_wcu: 500
  hot_key_share_pct: {randint: [62, 91]}
  hot_key_demand_wcu: {randint: [640, 900]}
  reserve_timeout_ms: {choice: [1500, 2000, 3000]}

rca_clues:
  inventory-service:
    ddb.write_throttle_events: {randint: [800, 12000]}
    ddb.hot_key_share_pct: {randint: [62, 91]}
    ddb.hot_key_demand_wcu: {randint: [640, 900]}
    ddb.table_capacity_mode: provisioned
    ddb.consumed_wcu: {randint: [480, 500]}
  orders-service:
    reserve.timeout_count: {randint: [100, 900]}
    reserve.stock_unavailable_false_positive: true

business_impact:
  - kpi: business.throughput_rpm
    factor: {uniform: [0.35, 0.65]}
  - kpi: business.error_rate_pct
    factor: {uniform: [3.0, 6.0]}
  - kpi: business.latency_p99_ms
    factor: {uniform: [2.0, 4.0]}

cascade_messages:
  orders-service:
    - severity: ERROR
      message: '[orders] stock reservation timed out after {reserve_timeout_ms}ms calling inventory-service POST /api/v1/inventory/reserve; checkout returned stock-unavailable'
service_lag_seconds:
  orders-service: 45
fault_scope:
  cluster: awsorders-eks-usw2
  workloads: [inventory-service]
infrastructure_events:
  - service: inventory-service
    severity: WARN
    offset_seconds: -90
    body: '[EventBridge] Scheduled rule awsorders-autumn-flash-sale-start fired: campaign=autumn-flash-sale started, reserve writes concentrating on sku={hot_sku}; table=awsorders-inventory billing_mode=PROVISIONED write_capacity_units=500 region=us-west-2'
    event_name: aws.events.ScheduledRuleInvoked
    attributes:
      cloud.provider: aws
      cloud.service: events
      aws.events.rule_name: awsorders-autumn-flash-sale-start
      aws.dynamodb.table_name: awsorders-inventory
      aws.dynamodb.billing_mode: PROVISIONED
      marketing.campaign: autumn-flash-sale
      infrastructure.source: EventBridge
remediation_effects:
  transition_seconds: 120
  log_events:
    - service: orders-service
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=dynamodb.amazonaws.com eventName=UpdateTable userIdentity={actor} requestParameters.tableName=awsorders-inventory requestParameters.billingMode=PAY_PER_REQUEST errorCode=none'
      attributes:
        operation: command
        command.target: dynamodb-table/awsorders-inventory
        aws.cloudtrail.event_name: UpdateTable
    - service: inventory-service
      severity: INFO
      offset_seconds: 45
      body: 'inventory.table awsorders-inventory status=ACTIVE billing_mode=PAY_PER_REQUEST; write throttling cleared, hot key sku writes succeeding'
      attributes:
        operation: table_update
        aws.dynamodb.billing_mode: PAY_PER_REQUEST
  steady_attributes:
    inventory-service:
      aws.dynamodb.billing_mode: PAY_PER_REQUEST
  verification:
    - signal: inventory.dynamodb.throttled_requests
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "inventory-service"'
      field: 'metrics.inventory.dynamodb.throttled_requests'
      expect: 'back in 0-1 (was 25-220)'
      within_seconds: 150
    - signal: inventory.dynamodb.write_latency_ms
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "inventory-service"'
      field: 'metrics.inventory.dynamodb.write_latency_ms'
      expect: 'back in 4-18 ms (was 350-2600 ms)'
      within_seconds: 150
    - signal: INV-DDB-HOT-PARTITION lines
      from: 'logs.otel.awsorders'
      where: 'body.text LIKE "*INV-DDB-HOT-PARTITION*"'
      expect: '0 new lines'
      within_seconds: 150
    - signal: DynamoDB billing mode
      from: 'logs.otel.awsorders'
      where: 'resource.attributes.service.name == "inventory-service"'
      field: 'attributes.aws.dynamodb.billing_mode'
      expect: 'PAY_PER_REQUEST on every line since the fix; PROVISIONED stops appearing'
      within_seconds: 150

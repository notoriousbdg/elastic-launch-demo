name: RDS Connection Leak
subsystem: database
vehicle_section: database_pipeline
error_type: ORD-DB-CONNECTION-EXHAUSTION
sensor_type: connection_pool
affected_services: [orders-db, orders-service]
cascade_services: [orders-gateway]

description: >
  A connection leak in orders-service exhausts the orders-db RDS Postgres connection ceiling, so Postgres refuses new sessions and the orders-gateway and ALB return 5xx.

investigation_notes: |
  1. Compare each orders-db CloudWatch metric to its own pre-incident baseline: DatabaseConnections is at {db_connections} of max_connections={max_connections} (pinned in the orders-pg15 parameter group; the db.r6g.large default would be about 1,700), far above its pre-incident level, while CPUUtilization, FreeStorageSpace and read latency stay in their baseline bands and WriteLatency and DiskQueueDepth rise only modestly, so neither CPU nor storage is a competing bottleneck.
  2. Search the orders-db Postgres log for body.text containing *ORD-DB-CONNECTION-EXHAUSTION* and "remaining connection slots are reserved": {refused_connections} refusals in the window, all against max_connections={max_connections}; the cap is reached with a few slots left because 5 are reserved for superusers.
  3. Follow the cascade into orders-service: the HikariCP pool for {db_pool} logs timeouts after {pool_timeout_ms}ms with {active_connections} active and {idle_connections} idle connections, which points at connections that are never returned: 6 tasks x maximumPoolSize 70 = 420 potential connections against a cap of {max_connections}, so the database fills before every pool does.
  4. Confirm the customer impact in the orders-gateway access log: about {gateway_5xx_pct}% of requests return 5xx, and the same window shows climbing HTTPCode_Target_5XX_Count on the ALB target group for orders-gateway.
  5. Check pg_stat_activity on orders-db grouped by application_name and state: sessions from {leaking_client} sit in state 'idle in transaction' with state_change older than {idle_age_min} minutes (leaked transactions are never committed or rolled back), which identifies the leaking client; idle_in_transaction_session_timeout is unset, which is why they were never reaped.
  6. Check the deployment history for correlation_attr infra.orders_service_release = orders-service-2026.10.3: the ECS UpdateService for that release landed minutes before the first connection refusal, and the new order-update code path does not close its connection when an exception is thrown while leakDetectionThreshold was also removed, so the leak was never logged. Hikari keeps these connections checked out, so they show as active in the pool and 'idle in transaction' in Postgres.
  7. Confirm service.version on the orders-service logs reads 2026.10.3 and orders.db_pool_active_connections is saturated while orders.jvm_heap_used_pct and the other orders-service metrics stay in band.
  8. Remediation: `opsctl rollback ecs-service/orders-service --to-revision previous` redeploys release 2026.10.2 with leak detection restored; the old tasks' sockets close as they stop, Postgres drops the leaked backends, and DatabaseConnections falls back to its baseline within about 90 s.

remediation_action: terminate_leaked_connections
remediation_command: |-
  opsctl rollback ecs-service/orders-service --to-revision previous

error_message: |
  ORD-DB-CONNECTION-EXHAUSTION: instance=orders-db connections={db_connections}/{max_connections} refused={refused_connections} client={leaking_client} pool={db_pool} pool_timeout_ms={pool_timeout_ms}

stack_trace: |
  === RDS CONNECTION EXHAUSTION REPORT ===
  instance=orders-db  engine=PostgreSQL 16.1  class=db.r6g.large  max_connections={max_connections}
  --- POSTGRES LOG (orders-db) ---
    FATAL:  remaining connection slots are reserved for roles with privileges of the "rds_reserved" role
    occurrences={refused_connections}  client={leaking_client}
  --- CLOUDWATCH ---
    METRIC                BASELINE   CURRENT
    DatabaseConnections   normal     {db_connections} (cap {max_connections})
    WriteLatency          1x         about 3x
    DiskQueueDepth        1x         about 3x
    CPUUtilization        flat       flat
    FreeStorageSpace      flat       flat
  --- ORDERS-SERVICE POOL ---
    pool={db_pool}  active={active_connections}  idle={idle_connections}
    java.sql.SQLTransientConnectionException: {db_pool} - Connection is not available, request timed out after {pool_timeout_ms}ms (maximumPoolSize=70).
  --- ORDERS-GATEWAY ---
    upstream_5xx_pct={gateway_5xx_pct}  alb_target_5xx=rising
  ACTION: terminate_leaked_connections=true  idle_in_transaction_age_min={idle_age_min}  alert=ORD-DB-CONNECTION-EXHAUSTION

infrastructure_events:
- body: '[CloudTrail] UpdateService: cluster=awsorders service=orders-service taskDefinition=orders-service:2026.10.3 desiredCount=6 region=us-east-1 event_source=ecs.amazonaws.com'
  severity: INFO
  event_name: aws.cloudtrail.UpdateService
  service: orders-service
  offset_seconds: -120
  attributes:
    cloud.provider: aws
    cloud.service: ecs
    aws.cloudtrail.event_name: UpdateService
    aws.ecs.cluster: awsorders
    aws.ecs.service: orders-service
    service.version: 2026.10.3
    infrastructure.source: CloudTrail
- body: '[CloudWatch] Alarm orders-db-DatabaseConnections-High in ALARM: DatabaseConnections above threshold for instance=orders-db region=us-east-1'
  severity: WARN
  event_name: aws.cloudwatch.AlarmStateChange
  service: orders-db
  attributes:
    cloud.provider: aws
    cloud.service: rds
    aws.cloudwatch.alarm_name: orders-db-DatabaseConnections-High
    aws.rds.instance: orders-db
    infrastructure.source: CloudWatch

correlation_attr:
  key: infra.orders_service_release
  value: orders-service-2026.10.3

fault_params:
  db_connections: 402
  max_connections: 410
  refused_connections: {randint: [2400, 3200]}
  leaking_client: orders-service
  db_pool: orders-hikari-pool
  pool_timeout_ms: {choice: [30000, 20000]}
  active_connections: {randint: [62, 67]}
  idle_connections: {randint: [0, 2]}
  gateway_5xx_pct: {randint: [30, 45]}
  idle_age_min: {randint: [1, 4]}

rca_clues:
  orders-db:
    db.connections_vs_baseline_ratio: {randint: [2, 4]}
    db.idle_in_transaction_sessions: {randint: [300, 370]}
    db.cpu_and_storage_flat: true
  orders-service:
    pool.active_connections: {randint: [62, 67]}
    pool.wait_timeout_count: {randint: [200, 900]}
    pool.leak_detection_enabled: false
  orders-gateway:
    gateway.upstream_5xx_pct: {randint: [30, 45]}
    gateway.alb_target_5xx_rising: true

business_impact:
  - kpi: business.checkout_success_pct
    factor: {uniform: [0.55, 0.75]}
  - kpi: business.orders_per_min
    value: {uniform: [120.9, 139.1], round: 0}
  - kpi: business.throughput_rpm
    factor: {uniform: [0.3, 0.55]}
  - kpi: business.availability_pct
    factor: {uniform: [0.6, 0.8]}
generator_impact:
  aws_rds_otel:
    # Plateau just under max_connections (410) minus the reserved superuser slots (alert: avg > 100).
    database_connections_high: 402.0
  aws_cloudwatch_logs:
    connection_refusals: 120
    gateway_error_fraction: 0.4
  aws_elb_otel:
    error_fraction: 0.4
  aws_elb_metrics_otel:
    high_application_load_balancer_target_5xx_error_rate: 300.0
# the package streams keep the fault while the scenario's own metrics converge
generator_hold_seconds: {aws_rds_otel: 90, aws_elb_metrics_otel: 90}

service_lag_seconds:
  orders-service: 30
  orders-gateway: 60

fault_scope:
  cluster: awsorders-eks-use1
  workloads: [orders-db, orders-service]

cascade_messages:
  orders-gateway:
    - severity: ERROR
      message: 'upstream orders-service returned 503 after {pool_timeout_ms}ms: orders-hikari-pool has no free connections; upstream_5xx_pct={gateway_5xx_pct}'

remediation_effects:
  transition_seconds: 90
  log_events:
    - service: orders-service
      severity: INFO
      offset_seconds: 1
      body: 'cloudtrail: eventSource=ecs.amazonaws.com eventName=UpdateService userIdentity={actor} requestParameters.cluster=awsorders requestParameters.service=orders-service requestParameters.taskDefinition=previous errorCode=none'
      attributes:
        operation: command
        command.target: ecs-service/orders-service
        aws.cloudtrail.event_name: UpdateService
    - service: orders-service
      severity: INFO
      offset_seconds: 45
      body: '[ECS] service orders-service has reached a steady state: release 2026.10.2 running 6 of 6 tasks, orders-hikari-pool leak detection enabled'
      attributes:
        operation: service_deploy
        service.version: 2026.10.2
        aws.ecs.cluster: awsorders
  steady_attributes:
    orders-service:
      service.version: 2026.10.2
  verification:
    - signal: aws.rds.database_connections
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "orders-db"'
      field: 'metrics.aws.rds.database_connections'
      expect: 'back in 30-80 (was 398-405)'
      within_seconds: 120
    - signal: RDS database connections (AWS integration stream)
      from: 'metrics-aws.rds.otel-*'
      where: 'Namespace == "AWS/RDS" AND MetricName == "DatabaseConnections" AND stat == "Average" AND DBInstanceIdentifier == "orders-db"'
      field: '`metrics.amazonaws.com/AWS/RDS/DatabaseConnections`'
      expect: 'back under 100 (was about 400, the max_connections ceiling)'
      within_seconds: 120
    - signal: orders.db_pool_active_connections
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "orders-service"'
      field: 'metrics.orders.db_pool_active_connections'
      expect: 'back in 14-46 (was 62-67)'
      within_seconds: 120
    - signal: ORD-DB-CONNECTION-EXHAUSTION lines
      from: 'logs.otel.awsorders'
      where: 'body.text LIKE "*ORD-DB-CONNECTION-EXHAUSTION*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: orders-service release version
      from: 'logs.otel.awsorders'
      where: 'resource.attributes.service.name == "orders-service"'
      field: 'attributes.service.version'
      expect: '2026.10.2 on every line logged since the fix; 2026.10.3 stops appearing'
      within_seconds: 120

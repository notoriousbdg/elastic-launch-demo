name: Fulfillment Carrier API Rate Limit
subsystem: fulfillment
vehicle_section: carrier_integration
error_type: CARRIER-RATE-LIMIT
sensor_type: api_quota
affected_services:
- fulfillment-orchestrator
cascade_services:
- order-management
- analytics-pipeline
description: FedEx shipping label creation fails with HTTP 429 and the label queue backs up because wave-planner revision 9 releases labels in 15-minute bursts of about 27,000 requests against a quota of 3,000 per minute.
onset_delay_seconds: 10
investigation_notes: |-
  Root cause: config wave-planner was updated to revision 9 (CR-5182) about 90 seconds before the first 429. Revision 8 released shipping labels continuously through a token bucket at 40 req/s (2,400 per minute), below the {carrier_name} Ship API quota of {api_quota_max} requests per {quota_window_s}s; revision 9 switches label release to 15-minute waves, so each wave dumps about 27,000 label requests (15 minutes of orders) at once, about 9 times the per-minute quota. {carrier_name} answers 429 Too Many Requests with a Retry-After of up to {quota_window_s}s, and the retries land in the next window and keep it saturated, so about 62% of calls are rejected while accepted calls sit at the quota. Order volume is normal (order-management orders.per_minute unchanged), so this is not an upstream order spike, and UPS, USPS and DHL label calls stay at about 0.1% 429s under their own quotas. Adding API keys to spread calls past the quota is against the carrier agreement, and rerouting to another carrier only hides the release pattern; the label release mode is what changed.
  Confirm:
    - fulfillment-orchestrator metrics.fulfillment.carrier_429_pct (FedEx) rises from about 0.1 to about 62 over about 30s; metrics.fulfillment.label_queue_depth climbs from about 120 by about 4 labels/s and metrics.fulfillment.label_creation_success_rate_pct falls from about 99.4 to about 72
    - "fulfillment.carrier_health carrier=fedex" lines show status=THROTTLED, http_429_pct about 62 and api_calls about 7,800 per minute against quota_per_min=3000, while carrier=ups / usps / dhl stay NOMINAL with http_429_pct about 0.1; every carrier_health line carries attributes.fulfillment.label_release_mode = wave-15m (token-bucket-40rps before)
    - the fulfillment-orchestrator config line "config wave-planner updated to revision 9 ... label_release_mode token-bucket-40rps -> wave-15m" comes before the first CARRIER-RATE-LIMIT error
    - order-management reports {orders_waiting_label} orders waiting on a FedEx label past SLA (oldest {oldest_wait_min} min), and analytics-pipeline sees FedEx label_created events down {label_events_drop_pct}% while UPS and USPS are unchanged
  Remediation: roll the config back with opsctl rollback config/wave-planner --to-revision previous. Label release returns to the 40 req/s token bucket on the next config reload (a few seconds); the {quota_window_s}s rate-limit window ages out, so carrier_429_pct is back to about 0.1 within about 60s. The backlog then drains through the bucket at about 10 labels/s net (2,400 per minute against about 1,800 per minute of new labels), about 4 minutes after a 10-minute incident, until label_queue_depth is back to about 120. No quota increase or extra keys are needed.
remediation_action: rotate_carrier_api_key
remediation_command: |-
  opsctl rollback config/wave-planner --to-revision previous
error_message: '[label-dispatch-12] c.e.fulfillment.carrier.FedExShipClient : CARRIER-RATE-LIMIT POST /ship/v1/shipments returned 429 Too Many Requests carrier={carrier_name} order={order_id} x-ratelimit-limit={api_quota_max}/{quota_window_s}s x-ratelimit-remaining=0 retry-after={reset_in_sec}s attempt={retry_attempt}/{max_retries}'
stack_trace: |-
  com.ecommerce.fulfillment.carrier.CarrierRateLimitException: CARRIER-RATE-LIMIT {carrier_name} Ship API returned 429 Too Many Requests (Retry-After: {reset_in_sec}) for order {order_id}
  	at com.ecommerce.fulfillment.carrier.FedExShipClient.handleResponse(FedExShipClient.java:203)
  	at com.ecommerce.fulfillment.carrier.FedExShipClient.createShipment(FedExShipClient.java:141)
  	at com.ecommerce.fulfillment.label.LabelDispatcher.dispatch(LabelDispatcher.java:118)
  	at com.ecommerce.fulfillment.label.LabelDispatcher.lambda$drain$0(LabelDispatcher.java:76)
  	at java.base/java.util.concurrent.ThreadPoolExecutor.runWorker(ThreadPoolExecutor.java:1144)
  	at java.base/java.util.concurrent.ThreadPoolExecutor$Worker.run(ThreadPoolExecutor.java:642)
  	at java.base/java.lang.Thread.run(Thread.java:1583)
  Caused by: org.springframework.web.client.HttpClientErrorException$TooManyRequests: 429 Too Many Requests: [{{"code":"RATE.LIMIT.EXCEEDED","message":"We have received too many requests in a short duration. Please wait a while to try again."}}]
  	at org.springframework.web.client.HttpClientErrorException.create(HttpClientErrorException.java:137)
  	at org.springframework.web.client.DefaultResponseErrorHandler.handleError(DefaultResponseErrorHandler.java:183)
  	... 6 common frames omitted
correlation_attr:
  key: fulfillment.label_release_mode
  value: wave-15m
fault_params:
  carrier_name: FedEx
  api_quota_max: 3000
  quota_window_s: 60
  reset_in_sec: {randint: [4, 60]}
  order_id: {format: "ORD-{n}", n: {randint: [100000, 999999]}}
  retry_attempt: {randint: [1, 5]}
  max_retries: 5
  orders_waiting_label: {randint: [300, 1800]}
  oldest_wait_min: {randint: [18, 45]}
  label_events_drop_pct: {randint: [55, 68]}
rca_clues:
  fulfillment-orchestrator:
    http.response.status_code: 429
    fulfillment.carrier_name: FedEx
    fulfillment.label_release_mode: wave-15m
    fulfillment.wave_release_size: {randint: [26500, 27500]}
    fulfillment.carrier_429_pct: {uniform: [58, 66], round: 1}
  order-management:
    order.awaiting_label_count: {randint: [300, 1800]}
    order.orders_per_min_delta_pct: {uniform: [-4, 4], round: 1}
  analytics-pipeline:
    analytics.fedex_label_events_drop_pct: {randint: [55, 68]}
    analytics.other_carrier_label_events_delta_pct: {uniform: [-3, 3], round: 1}
cascade_messages:
  order-management:
    - severity: WARN
      message: 'level=warn ts={iso_now} caller=fulfillment/watch.go:88 msg="orders waiting on shipping label past SLA" carrier={carrier_name} waiting={orders_waiting_label} oldest_wait_min={oldest_wait_min}'
  analytics-pipeline:
    - severity: WARN
      message: 'WARNING analytics.kpi.fulfillment: label_created events from fulfillment-orchestrator for carrier={carrier_name} down {label_events_drop_pct}% vs 1h baseline (ups/usps within 3%); on_time_delivery window marked provisional'
fault_scope:
  cluster: ecommerce-aks-cluster
  workloads: [fulfillment-orchestrator]
infrastructure_events:
  - service: fulfillment-orchestrator
    severity: INFO
    offset_seconds: -90
    body: '[config-watcher] c.e.fulfillment.config.ConfigReloader : config wave-planner updated to revision 9 (CR-5182, by fulfillment-eng): label_release_mode token-bucket-40rps -> wave-15m, wave_interval=15m; reloaded on 4/4 pods'
    attributes:
      user.name: fulfillment-eng
      change.request: CR-5182
      operation: config_reload
      config.name: wave-planner
      config.revision: 9
      fulfillment.label_release_mode: wave-15m
remediation_effects:
  log_taper_seconds: 60
  log_events:
    - service: fulfillment-orchestrator
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl rollback config/wave-planner --to-revision previous by {actor}: config wave-planner revision 9 -> 8 (label_release_mode wave-15m -> token-bucket-40rps)'
      attributes:
        operation: change_applied
        change.target: config/wave-planner
    - service: fulfillment-orchestrator
      severity: INFO
      offset_seconds: 4
      body: '[config-watcher] c.e.fulfillment.config.ConfigReloader : config wave-planner reloaded at revision 8 on 4/4 pods: label_release_mode=token-bucket-40rps, wave schedule cancelled'
      attributes:
        operation: config_reload
        config.name: wave-planner
        config.revision: 8
        fulfillment.label_release_mode: token-bucket-40rps
    - service: fulfillment-orchestrator
      severity: INFO
      offset_seconds: 65
      body: '[label-dispatch-12] c.e.fulfillment.label.LabelDispatcher : FedEx rate-limit window clear (no 429 in the last 60s); releasing label backlog at 40 req/s'
      attributes:
        operation: label_dispatch
        fulfillment.label_release_mode: token-bucket-40rps
  verification:
    - signal: fulfillment.carrier_429_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "fulfillment-orchestrator"'
      field: 'metrics.fulfillment.carrier_429_pct'
      expect: 'falls from about 62 to about 0.1 within about 60s as the rate-limit window ages out'
      within_seconds: 120
    - signal: fulfillment.label_queue_depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "fulfillment-orchestrator"'
      field: 'metrics.fulfillment.label_queue_depth'
      expect: 'drains at about 10 labels/s back to about 120 (about 4 minutes after a 10-minute incident); label_creation_success_rate_pct back to about 99.4'
      within_seconds: 480
    - signal: CARRIER-RATE-LIMIT lines
      from: 'logs.otel.ecommerce'
      where: 'body.text LIKE "*CARRIER-RATE-LIMIT*"'
      expect: 'no new lines after about 60s'
      within_seconds: 120
    - signal: label release mode
      from: 'logs.otel.ecommerce'
      where: 'resource.attributes.service.name == "fulfillment-orchestrator" AND body.text LIKE "fulfillment.carrier_health*"'
      field: 'attributes.fulfillment.label_release_mode'
      expect: 'wave-15m before the rollback; token-bucket-40rps after the config reload (a few seconds)'
      within_seconds: 60
service_lag_seconds: {order-management: 30, analytics-pipeline: 40}
business_impact:
  - kpi: business.fulfillment_sla_pct
    factor: {uniform: [0.20, 0.45]}
  - kpi: business.same_day_eligible_pct
    factor: {uniform: [0.15, 0.40]}
  - kpi: business.cancel_rate_pct
    factor: {uniform: [2.0, 4.0]}

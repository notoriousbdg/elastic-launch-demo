name: Search Index Corruption
subsystem: catalog
vehicle_section: search_engine
error_type: CATALOG-INDEX-CORRUPT
sensor_type: search_index
affected_services:
- product-catalog
cascade_services:
- storefront-gateway
- recommendation-engine
description: Product search index corrupted or partially rebuilt, returning incomplete or incorrect results
investigation_notes: |-
  1. Check product-catalog logs for CATALOG-INDEX-CORRUPT — note the affected shard ({shard_id}) and document count mismatch.
  2. Run an index health check: GET _cluster/health and GET _cat/shards?v&h=index,shard,prirep,state,docs,unassigned.reason — a RED primary is a candidate; GET _cluster/allocation/explain showing ALLOCATION_FAILED with CorruptIndexException confirms corruption rather than a lost node.
  3. Check for partial writes during a previous index rebuild: GET _cat/indices?v&h=index,health,docs.count and compare docs.count with the source of truth — a rebuild that aborted midway leaves an inconsistent index (catalog.last_rebuild_status ABORTED confirms it).
  4. Identify affected categories: query `catalog.items_indexed` metric — a drop below {expected_items} items indicates missing documents.
  5. Do not trigger a full rebuild during peak traffic — it will consume all indexing throughput and further degrade search latency.
  6. Roll back to the last known-good snapshot and replay the indexing changelog from that point forward.
remediation_action: rebuild_search_index
error_message: '[ProductCatalog] CATALOG-INDEX-CORRUPT: shard={shard_id} expected_docs={expected_items} actual_docs={actual_items}
  delta={doc_delta} affected_categories={affected_categories} last_clean_snapshot={snapshot_age_min}m ago'
stack_trace: "com.ecommerce.catalog.IndexException: CATALOG-INDEX-CORRUPT\n\tat com.ecommerce.catalog.SearchIndexManager.validateShard(SearchIndexManager.java:312)\n\
  \tat com.ecommerce.catalog.SearchIndexManager.healthCheck(SearchIndexManager.java:245)\n\tat com.ecommerce.catalog.CatalogService.serveSearchRequest(CatalogService.java:189)\n\
  Shard:           {shard_id}\nExpected docs:   {expected_items}\nActual docs:     {actual_items}\nDelta:           -{doc_delta}\n\
  Affected cats:   {affected_categories}\nSnapshot age:    {snapshot_age_min}m"
correlation_attr:
  key: catalog.index_unhealthy
  value: true
fault_params:
  shard_id: {format: "shard-{n}", n: {randint: [0, 7]}}
  expected_items: 1200000
  actual_items: 912000
  doc_delta: 288000
  affected_categories: {choice: ["electronics,apparel", "home,beauty", "sports,books", all_categories]}
  snapshot_age_min: {randint: [60, 480]}
rca_clues:
  product-catalog:
    catalog.shard_health: RED
    catalog.missing_docs_pct: 24.0
    catalog.items_indexed: 912000
    catalog.last_rebuild_status: ABORTED
    catalog.search_accuracy_pct: {uniform: [40, 80], round: 1}
  storefront-gateway:
    storefront.search_zero_results_pct: {uniform: [20, 60], round: 1}
    storefront.search_fallback_active: true
  recommendation-engine:
    reco.catalog_data_stale: true
    reco.fallback_to_trending: true
business_impact:
  - kpi: business.search_queries_per_min
    value: {uniform: [230.64, 265.36]}
  - kpi: business.sessions_per_min
    value: {uniform: [725.4, 834.6]}
  - kpi: business.conversion_rate_pct
    value: {uniform: [0.67, 0.77], round: 2}
  - kpi: business.page_views_per_min
    factor: {uniform: [0.3, 0.55]}

name: Cart Abandonment Spike
subsystem: orders
vehicle_section: checkout_funnel
error_type: CART-ABANDON-SPIKE
sensor_type: conversion_rate
affected_services:
- order-management
- storefront-gateway
cascade_services:
- ad-platform
description: Cart abandonment rate spiking abnormally — customers adding items but not completing checkout, indicating friction
  in the checkout flow
investigation_notes: |-
  1. Check order-management logs for CART-ABANDON-SPIKE — abandonment_rate={abandonment_rate_pct}% vs baseline {baseline_abandonment_pct}%.
  2. Identify the abandonment step: if most abandonment is at payment entry (step 3), payment form errors or slow gateway response are the cause (storefront.error_in_funnel names the failing step).
  3. Check for JavaScript errors in the storefront — a broken payment widget or address validation failure silently blocks checkout completion (a JavaScript error rate above 2% of checkout page views indicates a broken widget).
  4. Review promo code validation latency: if coupon checks take >{coupon_timeout_ms}ms, customers abandon while waiting for discount confirmation.
  5. Correlate with ad-platform metrics — if a recent ad campaign is driving high-intent but low-conversion traffic, the landing page may have a mismatch.
  6. Trigger cart recovery emails for sessions with >2min idle time in checkout — historically recovers {recovery_rate_pct}% of abandoned carts.
remediation_action: optimize_checkout_flow
error_message: '[OrderManagement] CART-ABANDON-SPIKE: abandonment_rate={abandonment_rate_pct}% (baseline {baseline_abandonment_pct}%)
  abandoned_carts={abandoned_carts} revenue_at_risk_usd={revenue_at_risk_usd} abandon_step={abandon_step}'
stack_trace: |-
  checkout funnel monitor: window=5m session_id={session_id}: CART-ABANDON-SPIKE: abandonment {abandonment_rate_pct}% above baseline {baseline_abandonment_pct}%
  goroutine 214 [running]:
  runtime/debug.Stack()
  	/usr/local/go/src/runtime/debug/stack.go:26 +0x5e
  github.com/ecommerce/order-management/internal/funnel.(*Monitor).checkAbandonmentRate(0xc0002f6000, {{0x1a9f3e0, 0xc0004c2000}})
  	/app/internal/funnel/monitor.go:96 +0x2b8
  github.com/ecommerce/order-management/internal/orders.(*OrderService).TrackCheckoutEvent(0xc0001b4000, {{0x1a9f3e0, 0xc0004c2000}})
  	/app/internal/orders/events.go:58 +0x14d
  Abandoned carts:   {abandoned_carts}
  Revenue at risk:   ${revenue_at_risk_usd}
  Abandon step:      {abandon_step}
  Coupon budget:     {coupon_timeout_ms}ms (p95 target)
  Coupon check p95:  {coupon_latency_ms}ms
  Time in funnel:    {avg_funnel_time_sec}s avg
correlation_attr:
  key: orders.abandonment_elevated
  value: true
fault_params:
  abandonment_rate_pct: {uniform: [84, 93], round: 1}
  baseline_abandonment_pct: 70.0
  abandoned_carts: {randint: [500, 10000]}
  revenue_at_risk_usd: {uniform: [50000, 500000], round: 2}
  abandon_step: coupon_validation
  session_id: {format: "SESS-{n}", n: {randint: [100000, 999999]}}
  recovery_rate_pct: {randint: [8, 20]}
  coupon_timeout_ms: 3000
  coupon_latency_ms: {randint: [4000, 10000]}
  avg_funnel_time_sec: {randint: [45, 180]}
rca_clues:
  order-management:
    order.abandonment_rate_pct: {uniform: [84, 93], round: 1}
    order.revenue_at_risk_usd: {randint: [10000, 500000]}
  storefront-gateway:
    storefront.checkout_step_drop_pct: {uniform: [30, 70], round: 1}
    storefront.error_in_funnel: coupon_check
    storefront.coupon_check_p95_ms: {randint: [4000, 10000]}
    storefront.js_error_rate_pct: {uniform: [0.1, 0.4], round: 2}
  ad-platform:
    ads.retargeting_triggered: true
    ads.cart_abandonment_audience_size: {randint: [1000, 50000]}
business_impact:
  - kpi: business.conversion_rate_pct
    value: {uniform: [0.67, 0.77], round: 2}
  - kpi: business.orders_placed_per_min
    value: {uniform: [31.62, 36.38]}
  - kpi: business.gmv_usd_per_min
    value: {uniform: [51382.0, 59118.0], round: 1}
  - kpi: business.cart_adds_per_min
    factor: {uniform: [0.2, 0.45]}

name: Recommendation Engine OOM
subsystem: personalization
vehicle_section: ml_inference
error_type: RECO-ENGINE-OOM
sensor_type: heap_memory
affected_services:
- recommendation-engine
cascade_services:
- storefront-gateway
- product-catalog
description: Recommendation pods are OOMKilled every few minutes because config revision 22 set EMBEDDING_CACHE_MAX_MB to 0, which leaves the in-process embedding cache unbounded.
onset_delay_seconds: 15
investigation_notes: |-
  Root cause: config reco-inference revision 22 (CR-4462, ml-infra) changed EMBEDDING_CACHE_MAX_MB from 4096 to 0. The intent was to skip the size check, but 0 means unbounded: the in-process embedding cache never evicts. Each CPython worker backfills its hot items right after start (RSS about 6,200MB) and then keeps growing by about 24MB/s until the container reaches its 10Gi cgroup memory limit (10,240MB). The kernel OOM killer ends the process (OOMKilled, exit code 137), the pod restarts cold and grows again, so RSS draws a sawtooth with a kill about every 165s; while a pod restarts, its requests fail over and recommendations fall back to trending items. This is resident memory of a Python process, not a heap or garbage-collection problem. The model is unchanged (reco.embedding_dim_delta 0, still reco-ranker-v8), traffic is flat, and the Redis result cache is healthy, which rules out a bigger model, a load spike or a cold result cache. Scaling out or raising the memory limit only delays the next kill, because each pod still grows without bound; halving the batch size does not bound the cache either.
  Confirm:
    - the recommendation-engine line "[reco.config] config reco-inference revision 22 applied: EMBEDDING_CACHE_MAX_MB 4096 -> 0" (attributes.change.request CR-4462) comes before the first RECO-ENGINE-OOM line
    - metrics.recommendations.memory_rss_mb leaves its 6,150MB baseline (plus or minus 60) and climbs from about 6,200 to the 10,240MB limit about every 165s, then drops back after each kill
    - metrics.recommendations.container_restarts goes up by one at each kill
    - "reco.model_health" status lines show attributes.reco.embedding_cache_max_mb 0, attributes.reco.memory_utilization_pct close to 100 and status=ANOMALY
    - storefront-gateway logs connection resets from restarting recommendation-engine pods and serves the trending fallback to {fallback_count} requests a minute; product-catalog returns featured products instead of similar items
  Remediation: opsctl rollback config/reco-inference --to-revision previous restores EMBEDDING_CACHE_MAX_MB=4096 and restarts the pods once. Within about 60s all 6 pods run with the bounded cache, RSS levels off around 6,150-6,200MB and the restart counter stops increasing.
remediation_action: scale_recommendation_engine
remediation_command: |-
  opsctl rollback config/reco-inference --to-revision previous
error_message: '[reco.memory_guard] RECO-ENGINE-OOM pod={pod_name} rss={rss_mb}MB cgroup_limit=10240MB embedding_cache={cache_mb}MB
  entries={cache_entries} EMBEDDING_CACHE_MAX_MB=0; previous container terminated reason=OOMKilled exit_code=137 restart_count={restart_count}'
stack_trace: ''
correlation_attr:
  key: reco.embedding_cache_max_mb
  value: 0
fault_params:
  pod_name: {choice: [recommendation-engine-6c9d7f5b8-2xkqp, recommendation-engine-6c9d7f5b8-7hm4t, recommendation-engine-6c9d7f5b8-b9wzn,
      recommendation-engine-6c9d7f5b8-fq2lr, recommendation-engine-6c9d7f5b8-kd8vs, recommendation-engine-6c9d7f5b8-tn5jc]}
  rss_mb: {randint: [9600, 10200]}
  cache_mb: {randint: [7550, 8150]}
  cache_entries: {randint: [1900000, 2100000]}
  restart_count: {randint: [1, 8]}
  fallback_count: {randint: [40, 400]}
rca_clues:
  recommendation-engine:
    reco.memory_utilization_pct: {uniform: [94.0, 99.6], round: 1}
    reco.embedding_cache_mb: {randint: [7550, 8150]}
    reco.embedding_cache_max_mb: 0
    reco.embedding_dim_delta: 0
    k8s.container.last_terminated_reason: OOMKilled
  storefront-gateway:
    storefront.personalization_disabled: true
    storefront.generic_reco_serving: true
  product-catalog:
    catalog.reco_lookup_errors: {randint: [100, 1000]}
    catalog.featured_fallback_active: true
cascade_messages:
  storefront-gateway:
    - severity: WARN
      message: 'storefront.reco_client upstream recommendation-engine connection reset (pod {pod_name} restarting); served trending fallback
        to {fallback_count} requests in the last minute'
  product-catalog:
    - severity: WARN
      message: 'WARN [http-nio-8080-exec-14] c.e.catalog.related.RecommendationClient - GET /api/v1/recommendations/similar failed:
        java.net.SocketException: Connection reset (pod {pod_name}); returning featured products'
fault_scope:
  cluster: ecommerce-gke-cluster
  workloads: [recommendation-engine]
infrastructure_events:
  - service: recommendation-engine
    severity: INFO
    offset_seconds: -150
    body: '[reco.config] config reco-inference revision 22 applied: EMBEDDING_CACHE_MAX_MB 4096 -> 0 (note: disable cache size check);
      rolling restart of recommendation-engine, 6 pods; changed by ml-infra (CR-4462)'
    attributes:
      user.name: ml-infra
      change.request: CR-4462
      operation: config_change
      config.name: reco-inference
      config.revision: 22
      reco.embedding_cache_max_mb: 0
      change.summary: 'EMBEDDING_CACHE_MAX_MB: 4096 -> 0'
remediation_effects:
  log_taper_seconds: 45
  log_events:
    - service: recommendation-engine
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl rollback config/reco-inference --to-revision previous by {actor}: config reco-inference revision 22 -> 21 (EMBEDDING_CACHE_MAX_MB 0 -> 4096); rolling restart of recommendation-engine'
      attributes:
        operation: change_applied
        change.target: config/reco-inference
    - service: recommendation-engine
      severity: INFO
      offset_seconds: 25
      body: '[reco.config] rolling restart in progress: 3/6 pods running with EMBEDDING_CACHE_MAX_MB=4096'
      attributes:
        operation: config_reload
        config.revision: 21
        reco.embedding_cache_max_mb: 4096
    - service: recommendation-engine
      severity: INFO
      offset_seconds: 55
      body: '[reco.config] rolling restart complete: 6/6 pods running with EMBEDDING_CACHE_MAX_MB=4096'
      attributes:
        operation: config_reload
        config.revision: 21
        reco.embedding_cache_max_mb: 4096
    - service: recommendation-engine
      severity: INFO
      offset_seconds: 90
      body: '[reco.embedding_cache] cache at its 4096MB bound, LRU eviction active; RSS steady at about 6,150MB of 10,240MB on all pods'
      attributes:
        operation: embedding_cache
        reco.embedding_cache_max_mb: 4096
  verification:
    - signal: recommendations.memory_rss_mb
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "recommendation-engine"'
      field: 'metrics.recommendations.memory_rss_mb'
      expect: 'no longer climbs to the 10,240MB limit; after one restart it levels off at about 6,150-6,200MB within about 60s'
      within_seconds: 180
    - signal: recommendations.container_restarts
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "recommendation-engine"'
      field: 'metrics.recommendations.container_restarts'
      expect: 'stops increasing (it went up by one at each OOM kill, about every 165s)'
      within_seconds: 300
    - signal: embedding cache bound
      from: 'logs.otel.ecommerce'
      where: 'resource.attributes.service.name == "recommendation-engine"'
      field: 'attributes.reco.embedding_cache_max_mb'
      expect: 'only 4096 once the restart completes (about 60s); was 0'
      within_seconds: 120
    - signal: RECO-ENGINE-OOM lines
      from: 'logs.otel.ecommerce'
      where: 'body.text LIKE "*RECO-ENGINE-OOM*"'
      expect: 'no new lines after the rollback (they fade out within about 45s)'
      within_seconds: 120
business_impact:
  - kpi: business.conversion_rate_pct
    value: {uniform: [0.67, 0.77], round: 2}
  - kpi: business.page_views_per_min
    value: {uniform: [3162.0, 3638.0]}
  - kpi: business.cart_adds_per_min
    value: {uniform: [229.71, 264.29]}
  - kpi: business.sessions_per_min
    factor: {uniform: [0.35, 0.6]}

generator_impact:
  kubernetes_otel:
    oomkilled_containers: 0.8
    container_memory_near_limit: 0.97
generator_hold_seconds: {kubernetes_otel: 120}
# dependents degrade after the component at fault, in dependency order
service_lag_seconds: {storefront-gateway: 20, product-catalog: 30}

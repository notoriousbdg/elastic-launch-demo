name: Recommendation Engine OOM
subsystem: personalization
vehicle_section: ml_inference
error_type: RECO-ENGINE-OOM
sensor_type: heap_memory
affected_services:
- recommendation-engine
cascade_services:
- storefront-gateway
- product-catalog
description: Recommendation model inference process running out of heap memory, crashing and causing fallback to non-personalized
  results
investigation_notes: |-
  1. Check recommendation-engine logs for RECO-ENGINE-OOM — heap_used_mb={heap_used_mb} vs heap_max_mb={heap_max_mb} gives the margin.
  2. The model embedding cache is likely bloated — check cache_size_mb metric. A cold-start after a pod restart causes aggressive cache backfill.
  3. Review the model version: v{model_version} may have a larger embedding dimension than the previous version, requiring more heap.
  4. Check GC log — G1GC full GC pauses above 2s indicate the heap is too small for current traffic; target 75% heap utilization.
  5. Immediate mitigation: reduce batch_size from {batch_size} to half — this trades throughput for stability under memory pressure.
  6. Scale the recommendation-engine horizontally (add pods) and reduce per-instance model cache size to distribute memory load.
remediation_action: scale_recommendation_engine
error_message: '[RecommendationEngine] RECO-ENGINE-OOM: heap_used={heap_used_mb}MB heap_max={heap_max_mb}MB model_version=v{model_version}
  batch_size={batch_size} cache_size={cache_size_mb}MB gc_pause_ms={gc_pause_ms}'
stack_trace: "java.lang.OutOfMemoryError: RECO-ENGINE-OOM Java heap space\n\tat com.ecommerce.reco.EmbeddingCache.load(EmbeddingCache.java:178)\n\
  \tat com.ecommerce.reco.ModelInference.predict(ModelInference.java:234)\n\tat com.ecommerce.reco.RecommendationService.getRecs(RecommendationService.java:112)\n\
  Heap used:    {heap_used_mb}MB / {heap_max_mb}MB\nModel:        v{model_version}\nBatch size:   {batch_size}\nCache size:\
  \   {cache_size_mb}MB\nGC pause:     {gc_pause_ms}ms"
correlation_attr:
  key: reco.engine_degraded
  value: true
fault_params:
  heap_used_mb: {randint: [7500, 9800]}
  heap_max_mb: 10240
  model_version: {randint: [7, 10]}
  batch_size: {randint: [64, 512]}
  cache_size_mb: {randint: [4000, 8000]}
  gc_pause_ms: {randint: [2000, 8000]}
rca_clues:
  recommendation-engine:
    reco.heap_utilization_pct: {uniform: [90, 99], round: 1}
    reco.gc_pause_ms: {randint: [2000, 8000]}
    reco.serving_fallback: trending
  storefront-gateway:
    storefront.personalization_disabled: true
    storefront.generic_reco_serving: true
  product-catalog:
    catalog.reco_lookup_errors: {randint: [100, 1000]}
    catalog.featured_fallback_active: true

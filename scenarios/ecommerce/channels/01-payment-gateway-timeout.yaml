name: Payment Gateway Timeout
subsystem: payments
vehicle_section: checkout_pipeline
error_type: PAYMENT-GATEWAY-TIMEOUT
sensor_type: gateway_latency
affected_services:
- payment-processor
- order-management
cascade_services:
- storefront-gateway
- fulfillment-orchestrator
description: Payment gateway connections timing out, causing checkout failures and order drop-off
investigation_notes: |-
  1. Check payment-processor logs for PAYMENT-GATEWAY-TIMEOUT — note which gateway provider ({payment_provider}) is affected.
  2. Query recent error rate: FROM logs.otel.ecommerce.* | WHERE body.text LIKE "*PAYMENT-GATEWAY-TIMEOUT*" | STATS count() BY service.name.
  3. Verify TLS handshake health — a TLS handshake above 1000ms (nominal is under 200ms) indicates certificate validation delays or MTU black holes on the path to the provider; a nominal handshake with charge calls still hitting the {payment_timeout_ms}ms timeout points to the provider itself.
  4. Check the payment provider's status page and correlate timing with their reported incidents.
  5. Review connection pool exhaustion: the pool is saturated only when active={active_connections} reaches pool_size={pool_size} (above 90% utilization) — scale horizontally or increase pool size.
  6. As an immediate mitigation, route traffic to the secondary gateway provider while the primary recovers.
remediation_action: restart_payment_gateway
error_message: '[PaymentProcessor] PAYMENT-GATEWAY-TIMEOUT: provider={payment_provider} order_id={order_id} timeout={payment_timeout_ms}ms
  pool_size={pool_size} active={active_connections} retry={retry_count}'
stack_trace: |-
  System.Threading.Tasks.TaskCanceledException: PAYMENT-GATEWAY-TIMEOUT: The request was canceled due to the configured HttpClient.Timeout elapsing.
   ---> System.TimeoutException: The operation was canceled.
     --- End of inner exception stack trace ---
     at System.Net.Http.HttpClient.HandleFailure(Exception e, Boolean telemetryStarted, HttpResponseMessage response, CancellationTokenSource cts, CancellationToken cancellationToken, CancellationTokenSource pendingRequestsCts)
     at Ecommerce.Payments.Gateway.PaymentGatewayClient.ChargeAsync(ChargeRequest request, CancellationToken ct) in /src/Payments/Gateway/PaymentGatewayClient.cs:line 118
     at Ecommerce.Payments.PaymentProcessor.ProcessOrderAsync(String orderId) in /src/Payments/PaymentProcessor.cs:line 76
     at Ecommerce.Checkout.CheckoutOrchestrator.CompleteCheckoutAsync(String sessionId) in /src/Checkout/CheckoutOrchestrator.cs:line 203
  Order:         {order_id}
  Session:       {session_id}
  Provider:      {payment_provider}
  Timeout (ms):  {payment_timeout_ms}
  Pool size:     {pool_size}
  Active conns:  {active_connections}
  Retry count:   {retry_count}
  Last success:  {last_success_sec}s ago
correlation_attr:
  key: payment.gateway_degraded
  value: true
fault_params:
  payment_provider: stripe
  order_id: {format: "ORD-{n}", n: {randint: [100000, 999999]}}
  session_id: {format: "SESS-{n}", n: {randint: [100000, 999999]}}
  payment_timeout_ms: {randint: [3000, 15000]}
  pool_size: 200
  active_connections: {randint: [60, 120]}
  retry_count: {randint: [2, 5]}
  last_success_sec: {randint: [30, 300]}
rca_clues:
  payment-processor:
    payment.gateway_timeout_ms: {randint: [3000, 15000]}
    payment.provider_circuit_open: true
    payment.tls_handshake_ms: {randint: [40, 120]}
    payment.pool_utilization_pct: {uniform: [30, 60], round: 0}
  order-management:
    order.checkout_failure_rate_pct: {uniform: [15, 60], round: 1}
    order.pending_payment_count: {randint: [50, 500]}
  storefront-gateway:
    storefront.checkout_error_rate_pct: {uniform: [10, 45], round: 1}
    storefront.error_page_shown: true
  fulfillment-orchestrator:
    fulfillment.pending_payment_orders: {randint: [20, 200]}
    fulfillment.hold_queue_depth: {randint: [10, 100]}
business_impact:
  - kpi: business.conversion_rate_pct
    value: {uniform: [0.67, 0.77], round: 2}
  - kpi: business.orders_placed_per_min
    value: {uniform: [31.62, 36.38]}
  - kpi: business.gmv_usd_per_min
    value: {uniform: [51382.0, 59118.0], round: 1}
  - kpi: business.cancel_rate_pct
    factor: {uniform: [2.5, 5.0]}

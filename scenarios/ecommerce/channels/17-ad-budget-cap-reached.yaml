name: Ad Budget Cap Reached
subsystem: advertising
vehicle_section: budget_controller
error_type: ADS-BUDGET-CAP
sensor_type: budget_utilization
affected_services:
- ad-platform
cascade_services:
- analytics-pipeline
description: Sponsored-product campaigns exhaust their daily budgets by late morning and stop serving because autobidder revision 47 set bid_multiplier 3.0 instead of 1.3, tripling CPCs.
onset_delay_seconds: 20
investigation_notes: |-
  Root cause: autobidder config revision 47 (CR-6083, by ads-optimization) set bid_multiplier to 3.0 instead of 1.3 for sponsored-product campaigns. The autobidder now bids about 2.3 times higher than intended, so it wins far more auctions at much higher prices: average CPC roughly triples from about 1.00 USD to about 3.00 USD, and the largest campaigns burn through their daily budgets by late morning. A campaign at its cap stops serving for the rest of the day. Raising the budgets is the tempting fix and is wrong: it keeps overcharging advertisers at three times the normal CPC. Demand is normal, not a high-traffic day: storefront traffic is within a few percent of the same day last week (analytics.traffic_vs_last_week_pct), while the auction win rate rose from about 34% to about 60%, the signature of overbidding. The targeting index is fresh (metrics.ads.targeting_index_age_min about 7 minutes) and fill rate only dips to about 77% because the capped campaigns drop out, unlike an ad serving outage where fill rate collapses to a few percent.
  Confirm:
    - ad-platform metrics.ads.avg_cpc_usd climbs from about 1.00 to about 3.00 USD within about 60s; metrics.ads.auction_win_rate_pct climbs from about 34% to about 60%
    - metrics.ads.budget_capped_campaigns climbs from 0-1 to about 38, and metrics.ads.fill_rate_pct dips from about 89% to about 77% as those campaigns stop
    - ad-platform "ads.campaign_health" lines show autobidder_rev=47, bid_multiplier=3.0 and status=ANOMALY (attributes.ads.bid_multiplier = 3.0; 1.3 before the change)
    - the ad-platform line "config autobidder revision 47 ... bid_multiplier 1.3 -> 3.0" (attributes.change.request CR-6083) comes before the first ADS-BUDGET-CAP line
    - analytics-pipeline reports sponsored-product spend {ad_spend_vs_last_week_pct}% above the same hour last week with sessions at {traffic_vs_last_week_pct}% vs last week, and {capped_campaigns} campaigns at their daily cap
  Remediation: roll the autobidder back with opsctl rollback config/autobidder --to-revision previous (revision 46, bid_multiplier 1.3), then run opsctl run job/budget-makegood to credit the overcharged spend back to each capped campaign's daily budget. CPC is back to about 1.00 USD within about 30s of the rollback; the make-good credits land about 10s after it starts and the capped campaigns resume over the next ~60s, so budget_capped_campaigns is back to 0-1 and fill rate to about 89% about 70s after the fix.
remediation_action: reset_ad_budget_cap
remediation_command: |-
  opsctl rollback config/autobidder --to-revision previous
  opsctl run job/budget-makegood
error_message: '[adplatform.budget.pacing] ADS-BUDGET-CAP campaign={campaign_id} type=sponsored_product daily_budget_usd={budget_daily_usd}
  spent_usd={budget_daily_usd} avg_cpc_usd={avg_cpc_usd} autobidder_rev=47: daily budget exhausted, campaign paused until 00:00
  UTC ({hours_remaining}h remaining in the day)'
stack_trace: ''
correlation_attr:
  key: ads.bid_multiplier
  value: 3.0
fault_params:
  campaign_id: {format: "CAMP-{n}", n: {randint: [1000, 9999]}}
  budget_daily_usd: {choice: [2500.0, 5000.0, 10000.0, 25000.0]}
  avg_cpc_usd: {uniform: [2.85, 3.15], round: 2}
  hours_remaining: {randint: [11, 13]}
  ad_spend_vs_last_week_pct: {uniform: [180.0, 220.0], round: 1}
  traffic_vs_last_week_pct: {uniform: [-3.0, 3.0], round: 1}
  capped_campaigns: {randint: [20, 38]}
rca_clues:
  ad-platform:
    ads.avg_cpc_usd: {uniform: [2.85, 3.15], round: 2}
    ads.auction_win_rate_pct: {uniform: [57.0, 63.0], round: 1}
    ads.bid_multiplier: 3.0
    ads.autobidder_revision: 47
  analytics-pipeline:
    analytics.traffic_vs_last_week_pct: {uniform: [-3.0, 3.0], round: 1}
    analytics.ad_spend_vs_last_week_pct: {uniform: [180.0, 220.0], round: 1}
cascade_messages:
  analytics-pipeline:
    - severity: WARN
      message: '[analytics.reports.ad_spend] sponsored_product spend {ad_spend_vs_last_week_pct}% above same hour last week while sessions are {traffic_vs_last_week_pct}% vs last week; {capped_campaigns} campaigns at daily cap'
fault_scope:
  cluster: ecommerce-gke-cluster
  workloads: [ad-platform]
infrastructure_events:
  - service: ad-platform
    severity: INFO
    offset_seconds: -120
    body: '[adplatform.config] config autobidder revision 47 applied: sponsored_product.bid_multiplier 1.3 -> 3.0 (revision 46 -> 47) by ads-optimization (CR-6083)'
    attributes:
      operation: config_change
      user.name: ads-optimization
      change.request: CR-6083
      change.summary: 'autobidder sponsored_product.bid_multiplier: 1.3 -> 3.0'
      ads.autobidder_revision: 47
      ads.bid_multiplier: 3.0
remediation_effects:
  log_taper_seconds: 60
  log_events:
    - service: ad-platform
      severity: INFO
      offset_seconds: 0
      body: '[CHG] CHANGE APPLIED opsctl rollback config/autobidder --to-revision previous by {actor}: autobidder reverted to revision 46 (sponsored_product.bid_multiplier 3.0 -> 1.3)'
      attributes:
        operation: change_applied
        change.target: config/autobidder
        ads.autobidder_revision: 46
        ads.bid_multiplier: 1.3
    - service: ad-platform
      severity: INFO
      offset_seconds: 2
      body: '[CHG] CHANGE APPLIED opsctl run job/budget-makegood by {actor}: make-good run started for campaigns charged above bid_multiplier 1.3 today'
      attributes:
        operation: change_applied
        change.target: job/budget-makegood
    - service: ad-platform
      severity: INFO
      offset_seconds: 12
      body: '[adplatform.jobs.budget_makegood] make-good credited overcharged spend on 38 campaigns (charged at bid_multiplier 3.0 since revision 47); daily budgets reopened'
      attributes:
        operation: budget_makegood
        ads.makegood_campaigns: 38
    - service: ad-platform
      severity: INFO
      offset_seconds: 70
      body: '[adplatform.budget.pacing] all 38 capped campaigns resumed serving; pacing back on plan at bid_multiplier 1.3'
      attributes:
        operation: campaign_health
        ads.bid_multiplier: 1.3
  verification:
    - signal: ads.avg_cpc_usd
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "ad-platform"'
      field: 'metrics.ads.avg_cpc_usd'
      expect: 'back to about 1.00 USD within about 30s of the rollback (was about 3.00)'
      within_seconds: 90
    - signal: ads.budget_capped_campaigns
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "ad-platform"'
      field: 'metrics.ads.budget_capped_campaigns'
      expect: 'falls from about 38 to 0-1 over about 60s after the make-good credits land'
      within_seconds: 150
    - signal: ADS-BUDGET-CAP lines
      from: 'logs.otel.ecommerce'
      where: 'body.text LIKE "*ADS-BUDGET-CAP*"'
      expect: 'no new lines once the campaigns have resumed (about 70s)'
      within_seconds: 150
    - signal: autobidder bid multiplier
      from: 'logs.otel.ecommerce'
      where: 'resource.attributes.service.name == "ad-platform"'
      field: 'attributes.ads.bid_multiplier'
      expect: '1.3 on the campaign_health lines after the rollback (3.0 during the incident)'
      within_seconds: 60
service_lag_seconds: {analytics-pipeline: 30}
business_impact:
  - kpi: business.ad_revenue_usd_per_min
    factor: {uniform: [0.05, 0.15]}
  - kpi: business.gmv_usd_per_min
    value: {uniform: [51382.0, 59118.0], round: 1}
  - kpi: business.conversion_rate_pct
    factor: {uniform: [0.35, 0.6]}

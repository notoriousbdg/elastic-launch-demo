service: payment-processor
sort_order: 7
cloud_provider: azure
cloud_region: eastus
cloud_platform: azure_vm
cloud_availability_zone: eastus-1
subsystem: payments
language: dotnet
topology:
- - order-management
  - /api/v1/orders/payment-confirm
  - POST
- - analytics-pipeline
  - /api/v1/analytics/payment-events
  - POST
entry_endpoints:
- - /api/v1/payments/authorize
  - POST
- - /api/v1/payments/capture
  - POST
- - /api/v1/payments/status
  - GET
db_operations:
- - INSERT
  - payment_transactions
  - INSERT INTO payment_transactions (order_id, provider, amount_usd, status, token_id, created_at) VALUES (?, ?, ?, 'pending',
    ?, NOW())
- - UPDATE
  - payment_transactions
  - UPDATE payment_transactions SET status = ?, provider_ref = ?, settled_at = NOW() WHERE id = ?
- - SELECT
  - payment_tokens
  - SELECT token_id, card_last4, card_brand, expiry_month, expiry_year FROM payment_tokens WHERE user_id = ? AND status =
    'active'
emit_fault_logs: true
kpi_emitter: false
constants:
  PROVIDERS:
  - stripe
  - adyen
  - braintree
steps:
- sample:
    transactions_per_min:
      uniform:
      - 90.0
      - 380.0
      round: 1
    success_rate_pct:
      uniform:
      - 97.5
      - 99.7
      round: 2
    avg_processing_ms:
      uniform:
      - 180.0
      - 850.0
      round: 1
    fraud_block_rate_pct:
      uniform:
      - 0.3
      - 1.8
      round: 3
- metric:
    name: payments.transactions_per_min
    value:
      var: transactions_per_min
    unit: txn/min
- metric:
    name: payments.success_rate_pct
    value:
      var: success_rate_pct
    unit: '%'
- metric:
    name: payments.avg_processing_ms
    value:
      var: avg_processing_ms
    unit: ms
- metric:
    name: payments.fraud_block_rate_pct
    value:
      var: fraud_block_rate_pct
    unit: '%'
- log:
    level: INFO
    message: payments.health txn_per_min={transactions_per_min} success_rate={success_rate_pct}% avg_processing_ms={avg_processing_ms}
      fraud_block_rate={fraud_block_rate_pct}%
    attrs:
      operation: payments_health
      payments.transactions_per_min:
        var: transactions_per_min
      payments.success_rate_pct:
        var: success_rate_pct
      payments.avg_processing_ms:
        var: avg_processing_ms
      payments.fraud_block_rate_pct:
        var: fraud_block_rate_pct
- sample:
    gateway_latency_ms:
      uniform:
      - 120.0
      - 600.0
      round: 1
    provider:
      choice: PROVIDERS
- log:
    level: INFO
    message: payments.gateway_health provider={provider} latency_ms={gateway_latency_ms} status=HEALTHY
    attrs:
      operation: gateway_health
      payments.gateway_provider:
        var: provider
      payments.gateway_latency_ms:
        var: gateway_latency_ms
      payments.gateway_status: HEALTHY

raw_log_profile:
  service_name: storefront-edge
  user_id_prefix: u
  tier_field: user_tier
  tier_values:
  - - free
    - 75
  - - pro
    - 20
  - - enterprise
    - 5
  country_weights:
    US: 40
    GB: 12
    DE: 10
    FR: 8
    JP: 8
    BR: 10
    CA: 7
    AU: 5
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  paths:
  - /checkout
  - /api/v2/cart
  - /api/v2/orders
  - /products/{id}
  - /search
  - /login
  - /account
  - /health
  change_point_path: /checkout
trace_attributes:
  base:
    platform.region: {choice: [us-east-1, us-central1, eastus]}
    platform.traffic_tier: {choice: [normal, normal, elevated, peak]}
    platform.market: {choice: [US, US, US, JP, EU, UK]}
  services:
    storefront-gateway:
      storefront.page_type: {choice: [home, search, pdp, cart, checkout, confirmation]}
      storefront.device: {choice: [mobile, mobile, desktop, tablet, app]}
      storefront.session_type: {choice: [browse, search, checkout, repeat_purchase]}
      storefront.ab_variant: {choice: [control, variant_a, variant_b]}
    product-catalog:
      catalog.search_type: {choice: [keyword, category, filter, recommendation]}
      catalog.result_count: {randint: [0, 200]}
      catalog.category: {choice: [electronics, apparel, home, beauty, sports, books]}
      catalog.index_version: {choice: [v12, v12, v12, v13]}
    order-management:
      order.channel: {choice: [web, mobile_app, mobile_web, api]}
      order.payment_method: {choice: [credit_card, debit_card, paypal, apple_pay, google_pay, buy_now_pay_later]}
      order.item_count: {randint: [1, 8]}
      order.is_prime: {choice: [true, true, false]}
    ad-platform:
      ads.placement: {choice: [homepage_banner, search_top, pdp_sidebar, cart_upsell, email_retargeting]}
      ads.format: {choice: [display, sponsored_product, video, native]}
      ads.targeting_type: {choice: [behavioral, contextual, retargeting, lookalike, demographic]}
      ads.auction_type: {choice: [first_price, second_price, fixed_cpm]}
    recommendation-engine:
      reco.algorithm: {choice: [collaborative_filter, content_based, hybrid, trending]}
      reco.context: {choice: [homepage, pdp_related, cart_upsell, post_purchase, email]}
      reco.personalized: {choice: [true, true, true, false]}
      reco.model_version: {choice: [v8, v8, v8, v9]}
    inventory-service:
      inventory.warehouse_region: {choice: [us-east, us-west, us-central, eu-west]}
      inventory.sku_category: {choice: [electronics, apparel, home, beauty, sports]}
      inventory.fulfillment_type: {choice: [standard, express, same_day, pickup]}
      inventory.stock_tier: {choice: [in_stock, in_stock, low_stock, backorder]}
    payment-processor:
      payment.provider: {choice: [stripe, adyen, braintree, square]}
      payment.currency: {choice: [USD, USD, USD, JPY, EUR, GBP]}
      payment.card_network: {choice: [visa, mastercard, amex, discover]}
      payment.3ds_required: {choice: [false, false, true]}
    fulfillment-orchestrator:
      fulfillment.carrier: {choice: [fedex, ups, usps, dhl, amazon_logistics]}
      fulfillment.service_level: {choice: [standard, two_day, overnight, same_day]}
      fulfillment.warehouse_id: {choice: [WH-US-NJ-01, WH-US-OH-02, WH-US-TX-03, WH-US-CA-04]}
      fulfillment.package_weight_lb: {uniform: [0.2, 25.0], round: 1}
    analytics-pipeline:
      analytics.event_type: {choice: [page_view, product_view, add_to_cart, purchase, ad_impression, ad_click]}
      analytics.pipeline_stage: {choice: [ingest, transform, aggregate, index]}
      analytics.consumer_group: {choice: [realtime-analytics, ad-attribution, inventory-analytics, fraud-signals]}
      analytics.partition: {randint: [0, 31]}

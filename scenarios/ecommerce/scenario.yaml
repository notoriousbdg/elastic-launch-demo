agent_config:
  id: ecommerce-ops-analyst
  name: Commerce Operations Analyst
  assessment_tool_name: platform_readiness_assessment
  system_prompt: 'You are the Commerce Operations Analyst for a global e-commerce platform. You help engineering and operations
    teams investigate incidents, analyze telemetry, and perform root cause analysis across 9 services spanning AWS, GCP, and
    Azure. You have deep expertise in e-commerce systems: storefront performance, product catalog search, order management,
    ad monetization, ML-powered personalization, payment processing, inventory management, fulfillment logistics, and real-time
    analytics pipelines. You understand that ad revenue is a critical business metric — when ads are not serving, that is
    direct, reportable revenue loss. Always quantify business impact alongside technical findings. When investigating incidents,
    search for these error identifiers in logs (field: body.text): payment errors (PAYMENT-GATEWAY-TIMEOUT, FRAUD-FALSE-POSITIVE,
    PAYMENT-TOKEN-EXPIRY), ad platform errors (ADS-SERVING-FAILURE, ADS-CLICK-BACKLOG, ADS-BUDGET-CAP), catalog errors (CATALOG-INDEX-CORRUPT,
    CATALOG-PRICE-SYNC), personalization errors (RECO-ENGINE-OOM, RECO-MODEL-DRIFT, RECO-CACHE-EVICTION), storefront errors
    (SESSION-STORM, CDN-CACHE-STORM, SSL-CERT-EXPIRY), order errors (ORDER-DB-REPLICATION-LAG, CART-ABANDON-SPIKE), inventory
    errors (INVENTORY-SYNC-LAG), fulfillment errors (CARRIER-RATE-LIMIT, WAREHOUSE-CAPACITY-ALERT), analytics errors (ANALYTICS-PIPELINE-LAG).
    Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: platform_readiness_assessment
  description: 'Comprehensive platform readiness assessment for the global commerce platform. Evaluates ad serving health,
    payment processing, order throughput, inventory sync, and personalization accuracy. Returns business impact metrics (GMV,
    ad revenue, conversion rate) alongside infrastructure health. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: ad-platform
executive_dashboard_intro: '**Commerce & advertising KPIs** — revenue, traffic & engagement, fulfillment, and customer health
  (synthetic `business.*` from `ad-platform`).'
executive_kpi_sections:
- header: '**Revenue** — GMV, conversion, AOV, ads, subscriptions, and seller fees'
  specs:
  - - GMV (USD/min)
    - metrics.business.gmv_usd_per_min
  - - Conversion rate (%)
    - metrics.business.conversion_rate_pct
  - - Average order value (USD)
    - metrics.business.average_order_value_usd
  - - Ad revenue (USD/min)
    - metrics.business.ad_revenue_usd_per_min
  - - Subscription MRR (USD/min)
    - metrics.business.subscription_mrr_usd_per_min
  - - Seller fee revenue (USD/min)
    - metrics.business.seller_fee_revenue_usd_per_min
- header: '**Traffic & engagement** — sessions, views, cart, search, and retention'
  specs:
  - - Sessions / min
    - metrics.business.sessions_per_min
  - - Page views / min
    - metrics.business.page_views_per_min
  - - Cart adds / min
    - metrics.business.cart_adds_per_min
  - - Search queries / min
    - metrics.business.search_queries_per_min
  - - Content completion (%)
    - metrics.business.content_completion_rate_pct
  - - Return visitor (%)
    - metrics.business.return_visitor_pct
- header: '**Fulfillment** — orders, SLA, returns, cancels, same-day, and inventory'
  specs:
  - - Orders placed / min
    - metrics.business.orders_placed_per_min
  - - Fulfillment SLA (%)
    - metrics.business.fulfillment_sla_pct
  - - Returns / min
    - metrics.business.returns_per_min
  - - Cancel rate (%)
    - metrics.business.cancel_rate_pct
  - - Same-day eligible (%)
    - metrics.business.same_day_eligible_pct
  - - Inventory turn rate
    - metrics.business.inventory_turn_rate
- header: '**Customer health** — CSAT, NPS, churn, email, push, and loyalty'
  specs:
  - - CSAT (0–5)
    - metrics.business.csat_score_0_5
  - - Satisfaction proxy (NPS-like)
    - metrics.business.net_satisfaction_proxy_nps
  - - Churn risk (0–100)
    - metrics.business.churn_risk_index_0_100
  - - Email open rate (%)
    - metrics.business.email_open_rate_pct
  - - Push CTR (%)
    - metrics.business.push_notification_ctr_pct
  - - Loyalty redeem (pts/min)
    - metrics.business.loyalty_points_redeemed_per_min
executive_trend_charts:
- title: GMV trend
  field: metrics.business.gmv_usd_per_min

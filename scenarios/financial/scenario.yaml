trace_attributes:
  base: {}
  services:
    order-gateway:
      order.instrument_class: {choice: [equity, fixed_income, fx, derivative, commodity]}
      order.side: {choice: [buy, sell, short_sell, cover]}
      order.validity_type: {choice: [day, gtc, fok, ioc, moc]}
      order.destination: {choice: [lit_venue, dark_pool, si, mtf]}
      svc.version: {choice: [3.4.0, 3.4.1, 3.5.0]}
      svc.environment: {choice: [prod, prod, staging]}
    matching-engine:
      engine.partition_id: {choice: [P-00, P-01, P-02, P-03, P-04, P-05]}
      engine.match_algorithm: {choice: [price_time, pro_rata, fifo_allocation]}
      oms.book_type: {choice: [central_limit, market_maker, dark]}
      svc.version: {choice: [5.1.0, 5.1.1, 5.2.0]}
      svc.environment: {choice: [prod, prod, staging]}
    risk-calculator:
      risk.model_type: {choice: [historical_var, monte_carlo, parametric]}
      risk.desk_class: {choice: [flow, prop, market_making, agency]}
      risk.asset_class: {choice: [equity, fixed_income, fx, derivatives, commodities]}
      svc.version: {choice: [2.8.0, 2.8.1, 2.9.0]}
      svc.environment: {choice: [prod, prod, staging]}
    settlement-processor:
      settlement.method: {choice: [dvp, fop, rfd, rtgs]}
      settlement.depository: {choice: [DTC, EUROCLEAR, CLEARSTREAM, JASDEC]}
      settlement.currency: {choice: [USD, EUR, GBP, JPY, CHF]}
      svc.version: {choice: [4.2.0, 4.2.1, 4.3.0]}
      svc.environment: {choice: [prod, prod, staging]}
    market-data-feed:
      feed.exchange: {choice: [NYSE, NASDAQ, CBOE, CME, ICE, BATS, IEX]}
      mdf.protocol: {choice: [FAST, FIX, ITCH, MDP3, OPRA]}
      mdf.feed_type: {choice: [primary, backup, consolidated]}
      svc.version: {choice: [1.6.0, 1.6.1, 1.7.0]}
      svc.environment: {choice: [prod, prod, staging]}
    fraud-detector:
      fraud.model_version: {choice: [v3.1.0, v3.2.0, v3.2.1]}

      compliance.report_type: {choice: [transaction, position, best_execution, aml]}
      compliance.jurisdiction: {choice: [US, EU, UK, SG, JP]}
      svc.version: {choice: [3.1.0, 3.1.1, 3.2.0]}
      svc.environment: {choice: [prod, prod, staging]}
    audit-logger:
      audit.stream: {choice: [orders, trades, settlements, risk-events, compliance-alerts]}

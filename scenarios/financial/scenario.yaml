agent_config:
  id: finserv-trading-analyst
  name: Trading Operations Analyst
  assessment_tool_name: trading_risk_assessment
  system_prompt: 'You are the Trading Operations Analyst, an expert AI assistant for financial trading platform operations.
    You help trading desk operators investigate incidents, analyze order flow, and provide root cause analysis for fault conditions
    across 9 trading infrastructure services spanning AWS, GCP, and Azure. You have deep expertise in FIX 4.4 protocol, order
    management systems, matching engine internals, risk limit frameworks (VaR, margin), T+2 settlement, DTCC/NSCC clearing,
    regulatory reporting (EMIR, MiFID II, CAT), AML/KYC screening, and cross-region audit replication. When investigating
    incidents, search for these system identifiers in logs: Order Management faults (OMS-BOOK-IMBALANCE, FIX-PARSE-REJECT),
    Matching Engine faults (ME-LATENCY-SLA, ME-DARKPOOL-REJECT), Market Data faults (MDF-PRICE-GAP, MDF-STALE-QUOTE), Risk
    faults (RISK-LIMIT-BREACH, RISK-MARGIN-CALL, RISK-POSITION-RECON), Settlement faults (SETTLE-T2-TIMEOUT, SETTLE-FAIL,
    SETTLE-NETTING-CALC), Compliance faults (COMPL-FRAUD-FP-STORM, COMPL-REG-REPORT-FAIL, COMPL-AML-SCREENING), Portal faults
    (PORTAL-SESSION-TIMEOUT, PORTAL-VALUATION-LAG, PORTAL-CONFIRM-DELAY), and Audit faults (AUDIT-SEQ-GAP, AUDIT-REPLICATION-LAG).
    Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: trading_risk_assessment
  description: 'Comprehensive pre-market trading risk assessment. Evaluates all services against operational readiness criteria
    for trading sessions. Returns data for risk evaluation across order management, matching engine, settlement, and compliance
    systems. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: risk-calculator
executive_dashboard_intro: '**Trading platform KPIs** — trade flow, risk exposure, market quality, and settlement operations
  (synthetic `business.*` from `risk-calculator`).'
executive_kpi_sections:
- header: '**Trade flow** — orders, fill rate, notional, executions, and rejects'
  specs:
  - - Order flow / min
    - metrics.business.order_flow_per_min
  - - Fill rate (%)
    - metrics.business.fill_rate_pct
  - - Notional value (USD/min)
    - metrics.business.notional_value_usd_per_min
  - - Executed trades / min
    - metrics.business.executed_trades_per_min
  - - Rejected orders / min
    - metrics.business.rejected_orders_per_min
  - - Cancel-replace rate (%)
    - metrics.business.cancel_replace_rate_pct
- header: '**Risk exposure** — VaR, margin, limits, delta, counterparty, and P&L'
  specs:
  - - Portfolio VaR (USD)
    - metrics.business.portfolio_var_usd
  - - Margin utilization (%)
    - metrics.business.margin_utilization_pct
  - - Position limit breaches
    - metrics.business.position_limit_breaches
  - - Delta exposure (USD)
    - metrics.business.delta_exposure_usd
  - - Counterparty credit risk (USD)
    - metrics.business.counterparty_credit_risk_usd
  - - Mark-to-market P&L (USD/min)
    - metrics.business.mark_to_market_pnl_usd_per_min
- header: '**Market quality** — spread, impact, slippage, latency, and best execution'
  specs:
  - - Avg spread (bps)
    - metrics.business.avg_spread_bps
  - - Market impact (bps)
    - metrics.business.market_impact_bps
  - - Slippage cost (USD/min)
    - metrics.business.slippage_cost_usd_per_min
  - - Latency SLA breach (%)
    - metrics.business.latency_sla_breach_rate_pct
  - - Best execution (%)
    - metrics.business.best_execution_pct
  - - Venue fill quality (%)
    - metrics.business.venue_fill_quality_pct
- header: '**Operations** — settlement, fails, breaks, alerts, availability, and reporting'
  specs:
  - - Settlement success rate (%)
    - metrics.business.settlement_success_rate_pct
  - - Settlement fails in queue
    - metrics.business.settlement_fails_in_queue
  - - Reconciliation breaks
    - metrics.business.reconciliation_breaks
  - - Ops alerts / min
    - metrics.business.ops_alerts_per_min
  - - System availability (%)
    - metrics.business.system_availability_pct
  - - Reporting latency (s)
    - metrics.business.reporting_latency_sec

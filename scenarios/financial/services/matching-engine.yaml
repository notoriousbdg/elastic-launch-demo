service: matching-engine
sort_order: 2
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_ec2
cloud_availability_zone: us-east-1b
subsystem: trade_execution
language: cpp
topology:
- - risk-calculator
  - /api/v1/risk/position-update
  - POST
- - settlement-processor
  - /api/v1/settlement/initiate
  - POST
- - market-data-feed
  - /api/v1/market/last-price
  - GET
entry_endpoints:
- - /api/v1/engine/health
  - GET
db_operations:
- - UPDATE
  - order_book
  - UPDATE order_book SET best_bid = ?, best_ask = ?, last_match_ts = NOW() WHERE instrument = ?
- - INSERT
  - trades
  - INSERT INTO trades (trade_id, instrument, buy_order, sell_order, qty, price, ts) VALUES (?, ?, ?, ?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: false
constants:
  INSTRUMENTS:
  - AAPL
  - GOOGL
  - MSFT
  - AMZN
  - TSLA
  - JPM
  - GS
  # partitions other than P-03 and P-07, for the healthy comparison lines
  OTHER_PARTITIONS:
  - P-01
  - P-02
  - P-04
  - P-05
  - P-06
  - P-08
  # dark venues without a venue-enforced minimum quantity
  OTHER_VENUES:
  - CROSSFINDER
  - MS-POOL
  - UBS-ATS
  - JPM-X
state:
  _matches_total:
    init: 0
  _last_book_snapshot:
    init: now
  _p03_lag_peak:
    init: 0
steps:
- sample:
    instrument:
      choice: INSTRUMENTS
    trade_price:
      uniform:
      - 100.0
      - 400.0
      round: 2
    trade_qty:
      randint:
      - 100
      - 2000
    trade_latency_us:
      randint:
      - 5
      - 80
- counter:
    state_key: _matches_total
    by: 1
- log:
    level: INFO
    message: '[ME] trade_match instrument={instrument} qty={trade_qty} price=${trade_price} latency_us={trade_latency_us}
      status=FILLED'
    attrs:
      operation: trade_match
      trade.instrument:
        var: instrument
      trade.price:
        var: trade_price
      trade.quantity:
        var: trade_qty
      trade.latency_us:
        var: trade_latency_us
      trade.status: FILLED
- sample:
    book_instrument:
      choice: INSTRUMENTS
    bid_levels:
      randint:
      - 50
      - 200
    ask_levels:
      randint:
      - 50
      - 200
    spread_bps:
      uniform:
      - 0.5
      - 3.0
      round: 2
- log:
    level: INFO
    message: '[ME] book_depth instrument={book_instrument} bid_levels={bid_levels} ask_levels={ask_levels} spread_bps={spread_bps}'
    attrs:
      operation: book_depth
      book.instrument:
        var: book_instrument
      book.bid_levels:
        var: bid_levels
      book.ask_levels:
        var: ask_levels
      book.spread_bps:
        var: spread_bps
- every:
    seconds: 8
    state_key: _last_book_snapshot
    steps:
    - sample:
        total_instruments:
          expr: len(INSTRUMENTS)
    - log:
        level: INFO
        message: '[ME] book_snapshot instruments={total_instruments} total_matches={_matches_total} status=NOMINAL'
        attrs:
          operation: book_snapshot
          snapshot.instrument_count:
            var: total_instruments
          snapshot.total_matches:
            var: _matches_total
          snapshot.status: NOMINAL
# Ch 1: the P-03 primary writes journal schema v14 after the 5.2.0 rollout; the 5.1.1 hot
# standby rejects every v14 record and stops applying, so its lag grows at the P-03 journal
# rate (~350 msgs/s) from seq 88,000,000, the last v13 record. After the fix the standby still sits at its old position until the
# reseed loads a fresh primary snapshot (~40 s), then replays the journal written since the
# snapshot (14,000 msgs) in ~40 s.
- sample:
    p03_t:
      expr: "max(0.0, elapsed.get(1, 0) - lag.get(1, 0)) if 1 in all_active else 0.0"
    p03_s:
      expr: "since_fix.get(1, 0) if (1 in fixed_channels and 1 not in all_active) else -1.0"
    p03_base:
      expr: "min(5, max(0, round(rand.gauss(2.0, 1.2))))"
    p03_lag:
      expr: "round(min(250000.0, 350.0 * p03_t) * (1.0 + rand.gauss(0, 0.02)) + p03_base) if 1 in all_active else (round((_p03_lag_peak if _p03_lag_peak > 1000 else 150000.0) + 350.0 * p03_s) if 0 <= p03_s < 40 else (round(14000.0 * (1.0 - (p03_s - 40.0) / 40.0) * (1.0 + rand.gauss(0, 0.03)) + p03_base) if 0 <= p03_s < 80 else p03_base))"
    p03_primary_ver:
      expr: "'5.2.0' if (1 in all_active or 0 <= p03_s < 12) else '5.1.1'"
    p03_schema:
      expr: "'v14' if p03_primary_ver == '5.2.0' else 'v13'"
    p03_state:
      expr: "'REPLAY_HALTED' if 1 in all_active and p03_lag > 10 else ('RESEEDING' if 0 <= p03_s < 40 else ('CATCHING_UP' if 0 <= p03_s < 80 else 'IN_SYNC'))"
    p03_standby_seq:
      expr: "88000000 if (1 in all_active or 0 <= p03_s < 40) else (88000000 + (_p03_lag_peak if _p03_lag_peak > 1000 else 150000) + int(350 * p03_s) - p03_lag if p03_s >= 0 else 86400000 + int((time.time() % 3600) * 350) - p03_lag)"
    p03_primary_seq:
      expr: "p03_standby_seq + p03_lag"
    p03_checksum_match:
      expr: "'true' if p03_lag <= 10 else 'false'"
    p03_status:
      expr: "'ANOMALY' if p03_lag > 10 else 'NOMINAL'"
    cmp_part:
      choice: OTHER_PARTITIONS
    cmp_lag:
      expr: "min(5, max(0, round(rand.gauss(2.0, 1.2))))"
    cmp_primary_seq:
      expr: "51200000 + int((time.time() % 86400) * 280)"
- counter:
    state_key: _p03_lag_peak
    by:
      expr: "(p03_lag - _p03_lag_peak) if 1 in all_active else 0"
- metric:
    name: matching_engine.standby_seq_lag_msgs
    value:
      var: p03_lag
    unit: msgs
    attrs:
      me.partition: P-03
- metric:
    name: matching_engine.standby_seq_lag_msgs
    value:
      var: cmp_lag
    unit: msgs
    attrs:
      me.partition:
        var: cmp_part
- log:
    level: INFO
    message: '[ME] replication_status partition=P-03 primary_version={p03_primary_ver} standby_version=5.1.1 journal_schema={p03_schema}
      primary_seq={p03_primary_seq} standby_seq={p03_standby_seq} lag_msgs={p03_lag} standby_state={p03_state} book_checksum_match={p03_checksum_match}
      status={p03_status}'
    attrs:
      operation: replication_status
      me.partition: P-03
      deployment.version:
        var: p03_primary_ver
      me.standby_version: 5.1.1
      me.journal_schema:
        var: p03_schema
      me.standby_seq_lag_msgs:
        var: p03_lag
      me.standby_state:
        var: p03_state
      replication.status:
        var: p03_status
- log:
    level: INFO
    message: '[ME] replication_status partition={cmp_part} primary_version=5.1.1 standby_version=5.1.1 journal_schema=v13
      primary_seq={cmp_primary_seq} standby_seq={cmp_primary_seq} lag_msgs={cmp_lag} standby_state=IN_SYNC book_checksum_match=true
      status=NOMINAL'
    attrs:
      operation: replication_status
      me.partition:
        var: cmp_part
      deployment.version: 5.1.1
      me.standby_version: 5.1.1
      me.journal_schema: v13
      me.standby_seq_lag_msgs:
        var: cmp_lag
      me.standby_state: IN_SYNC
      replication.status: NOMINAL
# Ch 16: after the request 8 -> 7.5 edit the P-07 pod runs as Burstable, so the static CPU
# manager gives it no exclusive cores; the matching thread is preempted on shared cores
# (involuntary context switches), orders queue behind it and p99 climbs. CPU throttling
# stays near 0 because usage is under the 8-core limit. After the fix the old pod serves
# ~20 s until the new Guaranteed pod takes over, then the queue drains over ~30 s.
- sample:
    p07_r:
      expr: "min(1.0, max(0.0, elapsed.get(16, 0) - lag.get(16, 0)) / 30.0) if 16 in all_active else (max(0.0, 1.0 - max(0.0, since_fix.get(16, 0) - 20.0) / 30.0) if 16 in fixed_channels else 0.0)"
    p07_burstable:
      expr: "16 in all_active or (16 in fixed_channels and since_fix.get(16, 0) < 20)"
    p07_p99:
      expr: "round(max(40.0, min(90.0, rand.gauss(62.0, 10.0))) * (1.0 - p07_r) + p07_r * min(50000.0, 12700.0 + abs(rand.gauss(0, 14000.0))))"
    p07_nvcsw:
      expr: "round(max(5.0, min(48.0, rand.gauss(24.0, 8.0))) * (1.0 - p07_r) + p07_r * rand.uniform(8000.0, 20000.0))"
    p07_queue:
      expr: "round(max(0.0, min(40.0, rand.gauss(12.0, 8.0))) * (1.0 - p07_r) + p07_r * rand.uniform(10500.0, 30000.0))"
    p07_throttled:
      expr: "round(max(0.0, min(2.0, rand.gauss(0.6, 0.4))), 1)"
    p07_qos:
      expr: "'Burstable' if p07_burstable else 'Guaranteed'"
    p07_cores:
      expr: "0 if p07_burstable else 8"
    p07_cpuset:
      expr: "'shared' if p07_burstable else '8-15'"
    p07_status:
      expr: "'ANOMALY' if p07_p99 > 200 else 'NOMINAL'"
    cmp_p99:
      expr: "round(max(40.0, min(90.0, rand.gauss(62.0, 10.0))))"
    cmp_nvcsw:
      expr: "round(max(5.0, min(48.0, rand.gauss(24.0, 8.0))))"
    cmp_queue:
      expr: "round(max(0.0, min(40.0, rand.gauss(12.0, 8.0))))"
    cmp_throttled:
      expr: "round(max(0.0, min(2.0, rand.gauss(0.6, 0.4))), 1)"
    match_latency:
      expr: "round(max(5.0, min(80.0, rand.gauss(28.0, 8.0))) + p07_r * p07_p99 * 0.4 / 8.0)"
- metric:
    name: matching_engine.match_latency_p99_us
    value:
      var: p07_p99
    unit: us
    attrs:
      me.partition: P-07
- metric:
    name: matching_engine.match_latency_p99_us
    value:
      var: cmp_p99
    unit: us
    attrs:
      me.partition:
        var: cmp_part
- metric:
    name: matching_engine.nonvoluntary_ctx_switches_per_s
    value:
      var: p07_nvcsw
    unit: '1/s'
    attrs:
      me.partition: P-07
- metric:
    name: matching_engine.nonvoluntary_ctx_switches_per_s
    value:
      var: cmp_nvcsw
    unit: '1/s'
    attrs:
      me.partition:
        var: cmp_part
- metric:
    name: matching_engine.inbound_queue_depth
    value:
      var: p07_queue
    unit: orders
    attrs:
      me.partition: P-07
- metric:
    name: matching_engine.inbound_queue_depth
    value:
      var: cmp_queue
    unit: orders
    attrs:
      me.partition:
        var: cmp_part
- metric:
    name: matching_engine.cpu_throttled_pct
    value:
      var: p07_throttled
    unit: '%'
    attrs:
      me.partition: P-07
- metric:
    name: matching_engine.cpu_throttled_pct
    value:
      var: cmp_throttled
    unit: '%'
    attrs:
      me.partition:
        var: cmp_part
- log:
    level: INFO
    message: '[ME] partition_health partition=P-07 match_p99_us={p07_p99} sla_us=200 queue_depth={p07_queue} nvcsw_per_s={p07_nvcsw}
      cpu_throttled_pct={p07_throttled} qos_class={p07_qos} exclusive_cores={p07_cores} cpuset={p07_cpuset} status={p07_status}'
    attrs:
      operation: partition_health
      me.partition: P-07
      me.match_p99_us:
        var: p07_p99
      me.queue_depth:
        var: p07_queue
      me.nvcsw_per_s:
        var: p07_nvcsw
      k8s.pod.qos_class:
        var: p07_qos
      cpu.exclusive_cores:
        var: p07_cores
      partition.status:
        var: p07_status
- log:
    level: INFO
    message: '[ME] partition_health partition={cmp_part} match_p99_us={cmp_p99} sla_us=200 queue_depth={cmp_queue} nvcsw_per_s={cmp_nvcsw}
      cpu_throttled_pct={cmp_throttled} qos_class=Guaranteed exclusive_cores=8 cpuset=pinned status=NOMINAL'
    attrs:
      operation: partition_health
      me.partition:
        var: cmp_part
      me.match_p99_us:
        var: cmp_p99
      me.queue_depth:
        var: cmp_queue
      me.nvcsw_per_s:
        var: cmp_nvcsw
      k8s.pod.qos_class: Guaranteed
      cpu.exclusive_cores: 8
      partition.status: NOMINAL
# Ch 20: sor-venue-profiles revision 58 renames min_qty; the router reads SIGMA-X's
# minimum as 0 and sends sub-10,000-share child orders, which SIGMA-X rejects. The hot
# reload after the fix lands at ~10 s; the per-minute rate then rolls off over ~30 s.
# Ch 19 (cascade): orders the Nasdaq venue rejects come back to the router and are re-routed.
- sample:
    dp_r:
      expr: "min(1.0, max(0.0, elapsed.get(20, 0) - lag.get(20, 0)) / 20.0) if 20 in all_active else ((1.0 if since_fix.get(20, 0) < 10 else max(0.0, 1.0 - (since_fix.get(20, 0) - 10.0) / 30.0)) if 20 in fixed_channels else 0.0)"
    dp_bad:
      expr: "20 in all_active or (20 in fixed_channels and since_fix.get(20, 0) < 10)"
    dp_rejects:
      expr: "round(min(120.0, min(2, max(0, round(rand.gauss(0.6, 0.6)))) + dp_r * max(40.0, min(120.0, rand.gauss(80.0, 18.0)))))"
    sor_rev:
      expr: "'58' if dp_bad else '57'"
    sigx_min:
      expr: "0 if dp_bad else 10000"
    sigx_fill_pct:
      expr: "round(max(0.0, min(80.0, rand.gauss(67.0, 3.0)) * (1.0 - dp_r)), 1)"
    dp_status:
      expr: "'ANOMALY' if dp_rejects > 5 else 'NOMINAL'"
    cmp_venue:
      choice: OTHER_VENUES
    cmp_dp_rejects:
      expr: "min(2, max(0, round(rand.gauss(0.6, 0.6))))"
    cmp_fill_pct:
      expr: "round(max(50.0, min(85.0, rand.gauss(71.0, 4.0))), 1)"
    fx19_r:
      expr: "min(1.0, max(0.0, elapsed.get(19, 0) - lag.get(19, 0)) / 20.0) if 19 in all_active else ((1.0 if since_fix.get(19, 0) < 30 else max(0.0, 1.0 - (since_fix.get(19, 0) - 30.0) / 30.0)) if 19 in fixed_channels else 0.0)"
    venue_reroutes:
      expr: "round(max(2.0, min(10.0, rand.gauss(5.0, 2.0))) + dp_rejects + fx19_r * max(270.0, min(810.0, rand.gauss(540.0, 120.0))))"
- metric:
    name: matching_engine.darkpool_rejects_per_min
    value:
      var: dp_rejects
    unit: orders/min
    attrs:
      sor.venue: SIGMA-X
- metric:
    name: matching_engine.darkpool_rejects_per_min
    value:
      var: cmp_dp_rejects
    unit: orders/min
    attrs:
      sor.venue:
        var: cmp_venue
- metric:
    name: matching_engine.venue_reroutes_per_min
    value:
      var: venue_reroutes
    unit: orders/min
- log:
    level: INFO
    message: '[SOR] venue_status venue=SIGMA-X config_revision={sor_rev} min_qty={sigx_min} rejects_per_min={dp_rejects}
      fill_rate_pct={sigx_fill_pct} status={dp_status}'
    attrs:
      operation: venue_status
      sor.venue: SIGMA-X
      config.revision:
        var: sor_rev
      sor.sigma_x_min_qty:
        var: sigx_min
      sor.rejects_per_min:
        var: dp_rejects
      router.status:
        var: dp_status
- log:
    level: INFO
    message: '[SOR] venue_status venue={cmp_venue} config_revision={sor_rev} min_qty=none rejects_per_min={cmp_dp_rejects}
      fill_rate_pct={cmp_fill_pct} status=NOMINAL'
    attrs:
      operation: venue_status
      sor.venue:
        var: cmp_venue
      config.revision:
        var: sor_rev
      sor.rejects_per_min:
        var: cmp_dp_rejects
      router.status: NOMINAL
# Ch 3: books on instruments with a feed sequence gap are halted until the gap is recovered.
# Ch 18 (cascade): the reference price the engine uses for price bands goes stale with the
# 30 s cache refresh (sawtooth). Ch 4 (cascade): EQ-PROP orders blocked by the kill switch
# never reach the engine.
- sample:
    halt_r:
      expr: "min(1.0, max(0.0, elapsed.get(3, 0) - lag.get(3, 0)) / 20.0) if 3 in all_active else (max(0.0, 1.0 - since_fix.get(3, 0) / 60.0) if 3 in fixed_channels else 0.0)"
    halted_instruments:
      expr: "round(halt_r * rand.uniform(2.0, 6.0))"
    ref_r:
      expr: "min(1.0, max(0.0, elapsed.get(18, 0) - lag.get(18, 0)) / 30.0) if 18 in all_active else (max(0.0, 1.0 - since_fix.get(18, 0) / 30.0) if 18 in fixed_channels else 0.0)"
    ref_price_age_ms:
      expr: "round(max(15.0, min(90.0, rand.gauss(45.0, 12.0))) + ref_r * (time.time() % 30.0) * 1000.0)"
    ks_r:
      expr: "min(1.0, max(0.0, elapsed.get(4, 0) - lag.get(4, 0)) / 15.0) if 4 in all_active else ((1.0 if since_fix.get(4, 0) < 10 else max(0.0, 1.0 - (since_fix.get(4, 0) - 10.0) / 30.0)) if 4 in fixed_channels else 0.0)"
    orders_in_per_s:
      expr: "round(max(150.0, rand.gauss(170.0, 6.0)) - ks_r * rand.uniform(2.5, 6.7), 1)"
- metric:
    name: matching_engine.halted_instruments
    value:
      var: halted_instruments
    unit: instruments
- when: "halted_instruments > 0"
  log:
    level: WARN
    message: '[ME] book_halt instruments_halted={halted_instruments} reason=market data sequence gap, book not rebuilt; new orders
      held until gap recovery'
    attrs:
      operation: book_halt
      me.halted_instruments:
        var: halted_instruments
- metric:
    name: matching_engine.ref_price_age_ms
    value:
      var: ref_price_age_ms
    unit: ms
- metric:
    name: matching_engine.orders_in_per_s
    value:
      var: orders_in_per_s
    unit: orders/s
- metric:
    name: matching_engine.match_latency_us
    value:
      var: match_latency
    unit: us
- metric:
    name: matching_engine.matches_total
    value:
      var: _matches_total
    unit: trades
- metric:
    name: matching_engine.order_book_depth
    value:
      randint:
      - 500
      - 5000
    unit: levels

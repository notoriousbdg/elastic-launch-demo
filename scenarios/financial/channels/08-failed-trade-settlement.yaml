name: Failed Trade Settlement
subsystem: settlement
vehicle_section: settlement_engine
error_type: SETTLE-FAIL
sensor_type: settlement_status
affected_services:
- settlement-processor
- risk-calculator
cascade_services:
- compliance-monitor
- audit-logger
description: Trade settlement fails due to insufficient securities or funding
investigation_notes: |-
  1. Check settlement-processor logs for SETTLE-FAIL — note trade_id, instrument, quantity, and failure_reason (e.g. insufficient_securities or SSI_mismatch).
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*SETTLE-FAIL*" | STATS count() BY failure_reason to determine if the cause is systemic.
  3. Inspect risk-calculator for the counterparty credit exposure — a counterparty_default failure_reason requires immediate credit event notification.
  4. Check compliance-monitor for SWIFT MT548 processing — confirm the LACK reject code was received and logged for regulatory recordkeeping.
  5. If auto_borrow=ATTEMPTED and borrow_result=UNAVAILABLE, initiate securities lending desk escalation or recycle the instruction with an extended settlement date.
remediation_action: initiate_securities_borrow_and_recycle
error_message: '[SETTLE] SETTLE-FAIL: trade={trade_id} instrument={instrument} qty={quantity} reason={failure_reason} counterparty={counterparty}'
stack_trace: |-
  === SWIFT MT548 SETTLEMENT STATUS ===
  :16R:GENL
  :20C::SEME//{settlement_id}
  :23G:INST
  :16R:STAT
  :25D::SETT//PEND
  :24B::PEND//LACK  (reason={failure_reason})
  :16S:STAT
  :16R:SETTRAN
  :35B:ISIN US0378331005  {instrument}
  :36B::SETT//UNIT/{quantity}
  :97A::SAFE//DTC-{counterparty}
  :16S:SETTRAN
  :16S:GENL
  trade={trade_id}  fail_code=LACK  auto_borrow=ATTEMPTED  borrow_result=UNAVAILABLE
  ACTION: recycle_instruction=true  notify_ops=true  alert=SETTLE-FAIL
correlation_attr: {}
fault_params:
  trade_id:
    format: "TRD-{n}"
    n: {randint: [100000, 999999]}
  instrument: {choice: [US.AAPL, US.GOOGL, US.MSFT, US.AMZN, US.TSLA, FX.EURUSD, FX.GBPUSD, FUT.ES, FUT.NQ, OPT.SPX]}
  quantity: {randint: [100, 50000]}
  failure_reason: {choice: [insufficient_securities, funding_shortfall, counterparty_default, DTCC_rejection, SSI_mismatch]}
  counterparty: {choice: [Goldman Sachs, Morgan Stanley, JP Morgan, Citadel Securities, Virtu Financial, Jane Street]}
  settlement_id:
    format: "STL-{n}"
    n: {randint: [100000, 999999]}
rca_clues:
  settlement-processor:
    settlement.fail_code_lack_count: {randint: [1, 30]}
    settlement.auto_borrow_failures: {randint: [1, 15]}
  risk-calculator:
    risk.counterparty_exposure_usd: {randint: [1000000, 50000000]}
    risk.credit_hold_active: true
  compliance-monitor:
    compliance.swift_mt548_rejections: {randint: [1, 20]}
    compliance.settle_fail_reg_events: {randint: [1, 10]}
  audit-logger:
    audit.settle_fail_trail_entries: {randint: [3, 30]}
    audit.recycled_instruction_count: {randint: [0, 5]}
business_impact:
  - kpi: business.settlement_success_rate_pct
    factor: {uniform: [0.55, 0.82]}
  - kpi: business.settlement_fails_in_queue
    factor: {uniform: [2.5, 6.0]}
  - kpi: business.notional_value_usd_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.counterparty_credit_risk_usd
    factor: {uniform: [2.0, 4.5]}

name: Cross-Region Replication Lag
subsystem: audit
vehicle_section: replication_bus
error_type: AUDIT-REPLICATION-LAG
sensor_type: replication_monitor
affected_services:
- audit-logger
- settlement-processor
cascade_services:
- compliance-monitor
- risk-calculator
description: Cross-region audit log replication falling behind, DR site stale
investigation_notes: |-
  1. Check audit-logger logs for AUDIT-REPLICATION-LAG — note source_region, dest_region, lag_ms, pending_events, and which channels are BEHIND.
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*AUDIT-REPLICATION-LAG*" | STATS max(lag_ms), sum(pending_events) BY source_region to quantify the RPO breach.
  3. Inspect network utilization between regions — if bandwidth utilization > 90% and tcp_retransmits is high, the WAN link is saturating under the replication load.
  4. Check settlement-processor for any settlements that depend on DR-site audit confirmation — if the DR site is stale, settlement authorizations may be blocked.
  5. Increase replication batch size to reduce per-message overhead; if lag exceeds RPO threshold, declare failover_ready=false and alert the DR team before market open.
remediation_action: increase_replication_batch_size
error_message: '[AUDIT] AUDIT-REPLICATION-LAG: source={source_region} dest={dest_region} lag_ms={lag_ms} max_ms={max_lag_ms}
  pending={pending_events}'
stack_trace: |-
  === REPLICATION STATUS REPORT ===
  source={source_region}  dest={dest_region}
  --- REPLICATION CHANNELS ---
    CHANNEL        LAG_MS    PENDING   STATUS
    orders         {lag_ms}     {pending_events}     BEHIND
    trades         12,400     892       BEHIND
    settlements    8,200      341       WARNING
    risk-events    {lag_ms}     {pending_events}     BEHIND
    compliance     3,100      127       OK
  --- NETWORK ---
    bandwidth_mbps=840  utilization=94%  packet_loss=0.02%
    tcp_retransmits=247  rtt_ms=68
  dr_site_staleness={lag_ms}ms  max_allowed={max_lag_ms}ms  rpo_breach=true
  ACTION: increase_batch_size=true  failover_ready=false  alert=AUDIT-REPLICATION-LAG
correlation_attr: {}
fault_params:
  source_region: {choice: [us-east-1, us-central1, eastus]}
  dest_region: {choice: [eu-west-1, us-west-2, westus]}
  lag_ms: {randint: [5000, 60000]}
  max_lag_ms: 3000
  pending_events: {randint: [100, 10000]}
rca_clues:
  audit-logger:
    audit.replication_lag_ms: {randint: [5000, 60000]}
    audit.pending_replication_events: {randint: [100, 10000]}
  settlement-processor:
    settlement.dr_audit_confirmation_pending: {randint: [1, 50]}
    settlement.cross_region_hold_count: {randint: [0, 20]}
  compliance-monitor:
    compliance.rpo_breach_ms: {randint: [2000, 57000]}
    compliance.dr_site_staleness_alerts: {randint: [1, 20]}
  risk-calculator:
    risk.dr_site_risk_state_age_ms: {randint: [5000, 60000]}
    risk.failover_readiness_pct: {uniform: [0.0, 80.0], round: 1}

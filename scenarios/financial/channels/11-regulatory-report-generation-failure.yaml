name: Regulatory Report Generation Failure
subsystem: compliance
vehicle_section: reporting_engine
error_type: COMPL-REG-REPORT-FAIL
sensor_type: report_generator
affected_services:
- compliance-monitor
- audit-logger
cascade_services:
- settlement-processor
description: Mandatory regulatory report fails to generate before submission deadline
investigation_notes: |-
  1. Check compliance-monitor logs for COMPL-REG-REPORT-FAIL — note report_type, failed_stage, and specific validation error counts (missing_LEI, invalid_UTI, stale_price).
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*COMPL-REG-REPORT-FAIL*" | STATS count() BY report_type, stage to identify which report type and stage is most frequently failing.
  3. Inspect audit-logger for the source trade records that failed validation — LEI and UTI issues typically trace back to stale reference data in the enrichment layer (reference data older than 24h is stale).
  4. Check settlement-processor for trades with stale_price errors — if price data is older than T+1 the regulator schema will reject the record.
  5. Remediate validation errors and resubmit; if the deadline will be missed, submit late and notify the national competent authority (NCA) and document all remediation steps for the audit trail.
remediation_action: remediate_validation_errors_and_resubmit
error_message: '[COMPL] COMPL-REG-REPORT-FAIL: report={report_type} period={report_period} stage={stage} deadline={deadline_utc}'
stack_trace: |-
  === REG REPORT PIPELINE STATUS ===
  report={report_type}  period={report_period}  deadline={deadline_utc}
  STAGE               STATUS       RECORDS     ERRORS
  data_collection     COMPLETE     1,247,832   0
  validation          FAILED       1,247,832   2,096  <<< BLOCKED
  aggregation         PENDING      ---         ---
  formatting          PENDING      ---         ---
  submission          PENDING      ---         ---
  --- VALIDATION ERRORS ---
    missing_LEI=1,204  invalid_UTI=892  stale_price=0
    destination=TradeRepository  schema=ESMA-ISO20022  format=XML
  failed_stage={stage}  retry_count=3  max_retries=3
  ACTION: manual_remediation=true  nca_late_notification=PENDING  alert=COMPL-REG-REPORT-FAIL
correlation_attr: {}
fault_params:
  report_type: {choice: [EMIR-TR, SFTR]}
  report_period: "2026-02-13"
  stage: validation
  deadline_utc: 2026-02-16T23:59:00Z
rca_clues:
  compliance-monitor:
    compliance.validation_error_count: {randint: [1500, 3500]}
    compliance.missing_lei_count: {randint: [1000, 2000]}
  audit-logger:
    audit.invalid_uti_records: {randint: [500, 1500]}
    audit.stale_price_records: 0
    audit.reference_data_age_h: {randint: [72, 240]}
  settlement-processor:
    settlement.stale_trade_price_age_s: {randint: [5, 60]}
    settlement.report_blocked_trades: {randint: [100, 5000]}
business_impact:
  - kpi: business.reporting_latency_sec
    factor: {uniform: [4.0, 10.0]}
  - kpi: business.ops_alerts_per_min
    factor: {uniform: [2.5, 6.0]}
  - kpi: business.system_availability_pct
    factor: {uniform: [0.90, 0.98]}
  - kpi: business.settlement_success_rate_pct
    factor: {uniform: [0.80, 0.95]}

name: Margin Call Calculation Error
subsystem: risk_management
vehicle_section: margin_system
error_type: RISK-MARGIN-CALL
sensor_type: margin_calculator
affected_services:
- risk-calculator
- settlement-processor
cascade_services:
- customer-portal
- compliance-monitor
description: Margin requirement calculation fails due to stale collateral valuations
investigation_notes: |-
  1. Check risk-calculator logs for RISK-MARGIN-CALL — note account_id, margin_ratio, and valuation_age_s for stale collateral.
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*RISK-MARGIN-CALL*" | STATS count() BY account_id to identify accounts with repeated margin calls.
  3. Inspect settlement-processor for pending collateral transfers — a funding shortfall here often compounds the equity deficiency.
  4. Check customer-portal for unsatisfied margin call notifications — the client may not have received the T+1 deadline alert.
  5. If valuation_age_s > 3600 force a collateral revaluation; if shortfall persists initiate liquidation of lowest-haircut assets first.
remediation_action: force_collateral_revaluation
error_message: '[RISK] RISK-MARGIN-CALL: account={account_id} margin_ratio={margin_ratio} maintenance_ratio={maintenance_ratio}
  valuation_age_s={valuation_age_s}'
stack_trace: |-
  === MARGIN SUMMARY ===
  account={account_id}  margin_ratio={margin_ratio}  maintenance={maintenance_ratio}
  --- COLLATERAL ---
    cash          $2,340,000    valued=CURRENT
    treasuries    $8,120,000    valued=STALE ({valuation_age_s}s)
    equities      $4,560,000    valued=STALE ({valuation_age_s}s)
    total_col     $15,020,000
  --- REQUIREMENTS ---
    initial_margin    $18,450,000
    maintenance       $14,760,000
    current_equity    $12,180,000  <<< BELOW MAINTENANCE
    shortfall         $2,580,000
  collateral_stale=true  valuation_age={valuation_age_s}s  max_staleness=300s
  ACTION: issue_margin_call=true  liquidation_t+1=PENDING  alert=RISK-MARGIN-CALL
correlation_attr: {}
fault_params:
  account_id:
    format: "ACC-{n}"
    n: {randint: [10000, 99999]}
  margin_ratio: {uniform: [0.05, 0.20], round: 3}
  maintenance_ratio: 0.25
  valuation_age_s: {randint: [300, 3600]}
rca_clues:
  risk-calculator:
    risk.margin_breach_count: {randint: [1, 20]}
    risk.collateral_staleness_s: {randint: [300, 3600]}
  settlement-processor:
    settlement.collateral_transfer_pending: {randint: [1, 10]}
    settlement.equity_deficiency_usd: {randint: [500000, 5000000]}
  customer-portal:
    portal.margin_call_notifications_unseen: {randint: [1, 5]}
    portal.account_restricted: true
  compliance-monitor:
    compliance.margin_call_regulatory_flags: {randint: [1, 10]}
    compliance.collateral_valuation_age_s: {randint: [300, 3600]}
business_impact:
  - kpi: business.margin_utilization_pct
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.counterparty_credit_risk_usd
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.settlement_success_rate_pct
    factor: {uniform: [0.80, 0.95]}
  - kpi: business.mark_to_market_pnl_usd_per_min
    factor: {uniform: [0.10, 0.40]}

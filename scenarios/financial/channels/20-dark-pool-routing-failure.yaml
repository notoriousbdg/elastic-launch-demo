name: Dark Pool Routing Failure
subsystem: trade_execution
vehicle_section: smart_router
error_type: ME-DARKPOOL-REJECT
sensor_type: routing_engine
affected_services:
- matching-engine
- order-gateway
cascade_services:
- risk-calculator
- audit-logger
- compliance-monitor
description: Smart order router fails to route block orders to dark pool venues
investigation_notes: |-
  1. Check matching-engine logs for ME-DARKPOOL-REJECT — note order_id, symbol, quantity, venue, and rejection_reason.
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*ME-DARKPOOL-REJECT*" | STATS count() BY venue, rejection_reason to find which venues are most restrictive.
  3. Inspect the venue scorecard fill_rate and avg_size data — if the submitted quantity is below venue min_size, the router should have fallen back to lit market automatically.
  4. Check risk-calculator for lit_market_impact_est — if market impact exceeds 10bps, reconsider whether a TWAP algo on the lit market is preferable to repeated dark pool rejections.
  5. Update the venue score for the rejecting venue and route to a venue whose minimum size accepts the order (or work it on the lit market via TWAP); do not split a below-minimum order further, and fix the router's venue min-size check; log the routing decision in audit-logger.
remediation_action: reroute_to_next_dark_pool_venue
error_message: '[ME] ME-DARKPOOL-REJECT: order={order_id} symbol={symbol} qty={quantity} venue={venue} reason={rejection_reason}'
stack_trace: |-
  === DARK POOL REJECTION DETAILS ===
  order={order_id}  symbol={symbol}  qty={quantity}
  --- ROUTING ATTEMPT ---
    venue={venue}  protocol=FIX-4.4  order_type=MIDPOINT_PEG
    min_size=10,000  submitted_qty={quantity}
    rejection_reason={rejection_reason}
  --- VENUE SCORECARD ---
    VENUE            FILL_RATE   AVG_SIZE    STATUS
    SIGMA-X          67.2%       45,000      AVAILABLE
    CROSSFINDER      72.1%       38,000      AVAILABLE
    SUPERX           58.4%       52,000      RESTRICTED
    LIQUIDNET        81.3%       120,000     AVAILABLE
  --- FALLBACK ---
    next_venue=CROSSFINDER  algo=TWAP-4h  urgency=LOW
    lit_market_impact_est={lit_impact_bps}bps
  ACTION: try_next_venue=true  update_venue_score=true  alert=ME-DARKPOOL-REJECT
correlation_attr: {}
fault_params:
  order_id:
    format: "ORD-{n}"
    n: {randint: [100000, 999999]}
  symbol: {choice: [AAPL, GOOGL, MSFT, AMZN, TSLA, JPM, GS, MS, BAC, C]}
  quantity: {randint: [100, 9500]}
  venue: SIGMA-X
  rejection_reason: minimum_size_not_met
  lit_impact_bps: {uniform: [11.0, 25.0], round: 1}
rca_clues:
  matching-engine:
    engine.dark_pool_rejection_count: {randint: [1, 50]}
    engine.venue_fallback_attempts: {randint: [1, 10]}
    engine.dark_pool_rejection_reason: minimum_size_not_met
  order-gateway:
    oms.block_order_routing_failures: {randint: [1, 30]}
    oms.lit_market_impact_est_bps: {uniform: [11.0, 25.0], round: 1}
  risk-calculator:
    risk.dark_pool_fill_rate_pct: {uniform: [0.0, 60.0], round: 1}
    risk.market_impact_cost_usd: {randint: [5000, 500000]}
  audit-logger:
    audit.routing_decision_log_count: {randint: [1, 100]}
    audit.venue_score_updates: {randint: [1, 20]}
  compliance-monitor:
    compliance.best_execution_failures: {randint: [1, 20]}
    compliance.dark_pool_reg_flags: {randint: [0, 10]}
business_impact:
  - kpi: business.best_execution_pct
    factor: {uniform: [0.60, 0.85]}
  - kpi: business.venue_fill_quality_pct
    factor: {uniform: [0.55, 0.80]}
  - kpi: business.slippage_cost_usd_per_min
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.market_impact_bps
    factor: {uniform: [2.5, 6.0]}

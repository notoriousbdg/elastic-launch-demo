name: Trade Confirmation Delay
subsystem: client_services
vehicle_section: confirmation_service
error_type: PORTAL-CONFIRM-DELAY
sensor_type: confirmation_timer
affected_services:
- customer-portal
- settlement-processor
cascade_services:
- audit-logger
- compliance-monitor
description: Trade confirmation messages delayed beyond regulatory reporting window
investigation_notes: |-
  1. Check customer-portal logs for PORTAL-CONFIRM-DELAY — note trade_id, delay_s vs reg_max_s, and delivery_queue depth and consumer count.
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*PORTAL-CONFIRM-DELAY*" | STATS count(), max(delay_s) BY instrument to identify if a specific asset class is most affected.
  3. Inspect settlement-processor for enrichment failures on the affected trade_ids — missing SSI data causes confirmation messages to stall in the formatting stage.
  4. Check audit-logger for confirmation dispatch records — if compliance_check stage took > 30s the downstream consumer_lag will cascade.
  5. Scale the delivery queue consumers from 2 to at least 6; file a regulatory exception report for any trades where delay_s > reg_max_s and notify the client of the delay.
remediation_action: scale_confirmation_queue_consumers
error_message: '[PORTAL] PORTAL-CONFIRM-DELAY: trade={trade_id} delay_s={delay_s} reg_max_s={reg_max_s} instrument={instrument}
  qty={quantity}'
stack_trace: |-
  === CONFIRMATION PIPELINE STATUS ===
  trade={trade_id}  instrument={instrument}  qty={quantity}
  STAGE                STATUS      ELAPSED
  trade_capture        COMPLETE    0.2s
  enrichment           COMPLETE    1.4s
  template_render      COMPLETE    0.8s
  compliance_check     COMPLETE    3.2s
  delivery_queue       STUCK       {delay_s}s  <<< BACKLOG
  client_ack           PENDING     ---
  --- DELIVERY STATS ---
    queue_depth=4,217  consumers=2  consumer_lag=3,890
    format=FIX-Confirmation(AH)  protocol=SWIFT-MT515
    reg_window={reg_max_s}s  elapsed={delay_s}s  breach=true
  ACTION: scale_consumers=true  reg_exception_report=true  alert=PORTAL-CONFIRM-DELAY
correlation_attr: {}
fault_params:
  trade_id:
    format: "TRD-{n}"
    n: {randint: [100000, 999999]}
  delay_s: {uniform: [600, 7200], round: 1}
  reg_max_s: 300
  instrument: {choice: [US.AAPL, US.GOOGL, US.MSFT, US.AMZN, US.TSLA, FX.EURUSD, FX.GBPUSD, FUT.ES, FUT.NQ, OPT.SPX]}
  quantity: {randint: [100, 50000]}
rca_clues:
  customer-portal:
    portal.confirmation_delay_s: {uniform: [300, 7200], round: 1}
    portal.undelivered_confirmations: {randint: [100, 5000]}
  settlement-processor:
    settlement.ssi_lookup_failures: {randint: [1, 50]}
    settlement.enrichment_timeout_count: {randint: [1, 100]}
  audit-logger:
    audit.confirm_dispatch_missing: {randint: [10, 1000]}
    audit.reg_exception_reports_filed: {randint: [1, 20]}
  compliance-monitor:
    compliance.confirmation_reg_breach_count: {randint: [1, 100]}
    compliance.mifid_disclosure_delay_s: {uniform: [300, 7200], round: 1}

name: Audit Log Sequence Gap
subsystem: audit
vehicle_section: audit_pipeline
error_type: AUDIT-SEQ-GAP
sensor_type: sequence_validator
affected_services:
- audit-logger
- compliance-monitor
cascade_services:
- settlement-processor
description: Audit trail event sequence numbers have gaps indicating lost events
investigation_notes: |-
  1. Check audit-logger logs for AUDIT-SEQ-GAP — note audit_stream, expected_seq, and gap_count.
  2. Query FROM logs.otel.financial.* | WHERE body.text LIKE "*AUDIT-SEQ-GAP*" | STATS count(), sum(gap_count) BY audit_stream to assess total event loss.
  3. Inspect Kafka consumer lag on the affected stream — if kafka_consumer_lag > 5000 the pipeline cannot keep up with ingestion rate.
  4. Check compliance-monitor for downstream hash chain validation errors — a broken chain invalidates the immutability proof for SEC-17a4.
  5. If replay_source=kafka is available, trigger replay from expected_seq to close the gap before the regulatory audit window closes.
remediation_action: replay_audit_stream
error_message: '[AUDIT] AUDIT-SEQ-GAP: stream={audit_stream} expected={expected_seq} received={last_seq} gap_count={gap_count}'
stack_trace: |-
  === AUDIT PIPELINE STATUS ===
  stream={audit_stream}  partition=0
  --- SEQUENCE ANALYSIS ---
    last_committed_seq   {last_seq}
    expected_next_seq    {expected_seq}
    gap_size             {gap_count} events
    gap_duration         ~4.2s
  --- PIPELINE HEALTH ---
    kafka_consumer_lag   2,340
    write_ahead_log      BEHIND
    hash_chain           BROKEN (gap invalidates chain from seq {expected_seq})
    immutability_proof   INVALID
  --- RECOVERY ---
    replay_source=kafka  replay_from={expected_seq}  estimated_time=12s
    reg_impact=SEC-17a4  audit_gap_report=REQUIRED
  ACTION: pause_pipeline=true  request_replay=true  alert=AUDIT-SEQ-GAP
correlation_attr: {}
fault_params:
  audit_stream: {choice: [orders, trades, settlements, risk-events, compliance-alerts]}
  expected_seq: {randint: [1000000, 9999999]}
  last_seq: {randint: [1000000, 9999999]}
  gap_count: {randint: [1, 100]}
rca_clues:
  audit-logger:
    audit.seq_gap_count: {randint: [1, 100]}
    audit.kafka_consumer_lag: {randint: [500, 20000]}
  compliance-monitor:
    compliance.hash_chain_broken: true
    compliance.immutability_violations: {randint: [1, 10]}
  settlement-processor:
    settlement.audit_hold_count: {randint: [0, 25]}
    settlement.pending_reg_review: {randint: [1, 50]}
business_impact:
  - kpi: business.reporting_latency_sec
    factor: {uniform: [3.0, 8.0]}
  - kpi: business.settlement_success_rate_pct
    factor: {uniform: [0.85, 0.97]}
  - kpi: business.ops_alerts_per_min
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.reconciliation_breaks
    factor: {uniform: [2.0, 4.5]}

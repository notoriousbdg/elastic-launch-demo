name: Market Data Stale Quote
subsystem: market_data
vehicle_section: quote_cache
error_type: MDF-STALE-QUOTE
sensor_type: quote_freshness
affected_services:
- market-data-feed
- risk-calculator
error_services:
- market-data-feed
cascade_services:
- matching-engine
- customer-portal
description: Cached market quotes exceeding staleness threshold affecting pricing
onset_delay_seconds: 0
service_lag_seconds:
  risk-calculator: 30
  matching-engine: 30
  customer-portal: 45
investigation_notes: |-
  Root cause: market-data-feed 1.7.0 was rolled out shortly before the first MDF-STALE-QUOTE and reloaded the {data_source} source config, where conflation.interval: 30 has no unit. 1.7.0 changed the default unit for unitless durations from milliseconds to seconds and the config file was not updated, so the quote cache publisher now conflates for 30 s instead of 30 ms. The {data_source} session stays CONNECTED and keeps receiving ticks (last_msg_age_ms {last_tick_ms}), but the cache is republished only once every 30 s, so quote age is a 0-30 s sawtooth and quotes go past the {quote_max_age_ms}ms limit for most of every cycle ({symbol} at {stale_ms}ms). The feed is healthy: ticks_per_second and feed latency are unchanged and the backup Reuters-Elektron source, whose config has an explicit 30ms, reads {backup_age_ms}ms, which rules out the vendor, the network and the session.
  Confirm:
    - market-data-feed "[MDF] quote_cache source={data_source}" lines show conflation_interval=30s (attributes.config.conflation_interval), session=CONNECTED with a fresh last_msg_age_ms, and publishes_10s of 0 or 1 instead of about 330
    - metric market_data.quote_age_ms (max quote age over each 10 s window) reads 10,000-30,000ms instead of 5-80ms while market_data.ticks_per_second is unchanged
    - the market-data-feed line "config reloaded version=1.7.0 ... conflation.interval=30 -> 30s" (attributes.operation deployment_rollout) comes before the first stale quote
    - risk-calculator flags stale-quote risk calcs: metrics.risk_calculator.stale_price_calcs_per_min rises from 0-2 to 40-120
  Remediation: opsctl patch config/market-data-feed --conflation-interval-ms 30 sets the interval with an explicit unit (30ms). market-data-feed hot-reloads the config in about 5 s and the cache publishes every 30 ms again; once the 10 s window has rolled past the last stale publish, max quote age is back under 100 ms within about 30 s and the stale-quote calcs stop. Failing over to Reuters-Elektron is a workaround, not a fix: the {data_source} cache publisher keeps the 30 s interval and the quotes go stale again on failback.
remediation_action: restore_conflation_interval
remediation_command: |-
  opsctl patch config/market-data-feed --conflation-interval-ms 30
error_message: '[MDF] MDF-STALE-QUOTE: symbol={symbol} stale_ms={stale_ms} max_age_ms={quote_max_age_ms} source={data_source} session=CONNECTED last_msg_age_ms={last_tick_ms}'
stack_trace: |-
  === QUOTE CACHE STATS ===
  symbol={symbol}  source={data_source}
  --- CACHE ENTRY ---
    last_bid=244.50  last_ask=244.55  last_trade=244.52
    cache_update_age_ms={stale_ms}  max_age_ms={quote_max_age_ms}
    cache_hits=14,230  cache_misses=0  evictions=0
  --- PUBLISHER ---
    conflation_interval=30s  (config conflation.interval: 30, version 1.7.0)
    last_publish_age_ms={stale_ms}  conflated_updates_pending={pending_updates}
  --- FEED STATUS ---
    primary_feed={data_source}  session=CONNECTED  last_msg_age_ms={last_tick_ms}
    backup_feed=Reuters-Elektron  session=CONNECTED  last_msg_age_ms={backup_age_ms}  conflation_interval=30ms
    failover_triggered=false
  --- IMPACT ---
    dependent_books=4  stale_risk_calcs={stale_risk_calcs}  client_views_affected=89
  ACTION: mark_indicative=true  alert=MDF-STALE-QUOTE
correlation_attr: {}
fault_params:
  symbol: {choice: [AAPL, GOOGL, MSFT, AMZN, TSLA, JPM, GS, MS, BAC, C]}
  stale_ms: {randint: [6500, 30000]}
  quote_max_age_ms: 3000
  data_source: Bloomberg-B-PIPE
  last_tick_ms: {randint: [1, 40]}
  backup_age_ms: {randint: [10, 80]}
  pending_updates: {randint: [5000, 45000]}
  stale_risk_calcs: {randint: [5, 100]}
rca_clues:
  market-data-feed:
    feed.quote_staleness_ms: {randint: [6500, 30000]}
    config.conflation_interval: 30s
    feed.primary_feed_status: CONNECTED
    feed.last_msg_age_ms: {randint: [1, 40]}
  risk-calculator:
    risk.stale_quote_risk_calcs: {randint: [5, 100]}
    risk.indicative_price_var_usd: {randint: [50000, 1000000]}
  matching-engine:
    engine.stale_quote_dependent_books: {randint: [1, 10]}
    engine.indicative_pricing_active: true
  customer-portal:
    portal.stale_quote_warnings_shown: {randint: [10, 500]}
    portal.client_views_affected: {randint: [10, 200]}
cascade_messages:
  risk-calculator:
    - severity: WARN
      message: '[RISK] stale_quote_calc symbol={symbol} quote_age_ms={stale_ms} source={data_source} result=INDICATIVE greeks_flagged=true'
  matching-engine:
    - severity: WARN
      message: '[ME] reference_price symbol={symbol} age_ms={stale_ms} source=market-data-feed state=INDICATIVE; price collars widened'
  customer-portal:
    - severity: WARN
      message: '[PORTAL] quote_banner symbol={symbol} state=DELAYED age_ms={stale_ms} source={data_source}'
fault_scope:
  cluster: finserv-gke-cluster
  workloads: [market-data-feed, risk-calculator]
infrastructure_events:
  - service: market-data-feed
    severity: INFO
    offset_seconds: -120
    body: '[MDF] config reloaded version=1.7.0 (was 1.6.4) source=bloomberg-bpipe conflation.interval=30 -> 30s (unitless durations are seconds since 1.7.0, were milliseconds); rolled out by mdf-release (CR-5265)'
    attributes:
      user.name: mdf-release
      change.request: CR-5265
      operation: deployment_rollout
      deployment.version: 1.7.0
      config.conflation_interval: 30s
      change.summary: 'market-data-feed 1.6.4 -> 1.7.0; bloomberg-bpipe conflation.interval 30ms -> 30s'
remediation_effects:
  log_taper_seconds: 5
  log_events:
    - service: audit-logger
      severity: INFO
      offset_seconds: 1
      body: '[AUDIT] event_logged stream=change-mgmt type=CHANGE_APPLIED cmd="opsctl patch config/market-data-feed --conflation-interval-ms 30" actor={actor}: bloomberg-bpipe conflation.interval 30 (30s) -> 30ms'
      attributes:
        operation: change_applied
        audit.stream: change-mgmt
        change.target: config/market-data-feed
    - service: market-data-feed
      severity: INFO
      offset_seconds: 5
      body: '[MDF] config reloaded version=1.7.0 source=bloomberg-bpipe conflation.interval=30ms; quote cache publisher restarted, publishing every 30ms'
      attributes:
        operation: config_change
        config.conflation_interval: 30ms
  steady_attributes:
    market-data-feed:
      config.conflation_interval: 30ms
  verification:
    - signal: market_data.quote_age_ms
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "market-data-feed"'
      field: 'metrics.market_data.quote_age_ms'
      expect: 'back under 100 ms (was a 10,000-30,000 ms sawtooth)'
      within_seconds: 60
    - signal: risk_calculator.stale_price_calcs_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "risk-calculator"'
      field: 'metrics.risk_calculator.stale_price_calcs_per_min'
      expect: 'back to 0-2 per minute (was 40-120)'
      within_seconds: 60
    - signal: MDF-STALE-QUOTE lines
      from: 'logs.otel.finserv'
      where: 'body.text LIKE "*MDF-STALE-QUOTE*"'
      expect: '0 new lines'
      within_seconds: 60
    - signal: quote cache conflation interval
      from: 'logs.otel.finserv'
      where: 'resource.attributes.service.name == "market-data-feed"'
      field: 'attributes.config.conflation_interval'
      expect: '30ms on every line since the config reload (about 5 s); 30s stops appearing'
      within_seconds: 60
business_impact:
  - kpi: business.order_flow_per_min
    value: {uniform: [513.83, 591.18]}
  - kpi: business.avg_spread_bps
    factor: {uniform: [2.0, 5.5]}
  - kpi: business.slippage_cost_usd_per_min
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.best_execution_pct
    factor: {uniform: [0.68, 0.88]}

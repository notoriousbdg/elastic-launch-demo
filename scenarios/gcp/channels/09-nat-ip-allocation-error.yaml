name: NAT IP Allocation Error
subsystem: network_access
vehicle_section: nat_gateway
error_type: NAT-IP-ALLOCATION-ERROR
sensor_type: nat_ip_pool
affected_services:
- cloud-nat-gateway
- vpc-network-manager
cascade_services:
- cloud-interconnect
description: Cloud NAT unable to allocate external IP addresses for outbound traffic
investigation_notes: |-
  Root cause: Cloud NAT cannot allocate additional external IPs due to project quota limits or IP conflicts. The EXTERNAL_IP_ADDRESS quota per region defaults to a limited number. If another NAT gateway or resource holds the IP, allocation fails. Check quotas:
    gcloud compute project-info describe --project=<project> --format='table(quotas.filter(metric=STATIC_ADDRESSES).limit,usage)'
    gcloud compute addresses list --filter='region:<region> AND status:RESERVED'
  Remediation: Release unused static IPs:
    gcloud compute addresses delete <unused-ip> --region=<region>
  Or request a quota increase via Console > IAM & Admin > Quotas > filter 'In-use IP addresses'. If IPs are held by other NAT gateways, consolidate NAT configurations. For immediate relief, switch to AUTO_ONLY allocation mode which uses GCP-managed ephemeral IPs (note: IPs will change on gateway restart, which may break IP-allowlisted external services).
remediation_action: reset_nat_gateway
error_message: 'cloudnat: NAT-IP-ALLOCATION-ERROR gateway={nat_gateway_name} region={gcp_region} allocated_ips={nat_allocated_ips}/{nat_max_ips}
  pending_allocations={nat_pending_allocs} error="{nat_alloc_error}"'
stack_trace: |-
  Cloud NAT IP Allocation Report
  ---------------------------------
  Gateway:     {nat_gateway_name}
  Region:      {gcp_region}
  Allocated:   {nat_allocated_ips}/{nat_max_ips}
  Pending:     {nat_pending_allocs}
  Error:       {nat_alloc_error}
  Quota:       EXTERNAL_IP_ADDRESS — check project quota
  Action: Release unused IPs or request quota increase
correlation_attr:
  key: infra.ip_allocation_pool
  value: static-pool-region-east1
fault_params:
  nat_gateway_name: {choice: [gcpnet-nat-central1, gcpnet-nat-east1, gcpnet-nat-europe1]}
  gcp_region: {choice: [us-central1, us-east1, europe-west1]}
  nat_allocated_ips: {randint: [8, 10]}
  nat_max_ips: 10
  nat_pending_allocs: {randint: [2, 8]}
  nat_alloc_error:
    choice:
      - "QUOTA_EXCEEDED: EXTERNAL_IP_ADDRESS"
      - IP_ALREADY_IN_USE by another NAT
      - REGION_QUOTA_EXCEEDED for static IPs
rca_clues:
  cloud-nat-gateway:
    nat.quota_name: EXTERNAL_IP_ADDRESS
    nat.quota_usage_pct: {uniform: [95, 100], round: 1}
  vpc-network-manager:
    vpc.nat_ip_conflict: true
    vpc.orphaned_static_ips: {randint: [2, 8]}
  cloud-interconnect:
    interconnect.nat_failover_path: unavailable
business_impact:
  - kpi: business.nat_port_exhaustion_rate_pct
    factor: {uniform: [6.0, 15.0]}
  - kpi: business.requests_per_min
    factor: {uniform: [0.60, 0.82]}
  - kpi: business.cloud_spend_usd_per_min
    factor: {uniform: [1.4, 2.8]}
  - kpi: business.network_sla_compliance_pct
    factor: {uniform: [0.70, 0.88]}

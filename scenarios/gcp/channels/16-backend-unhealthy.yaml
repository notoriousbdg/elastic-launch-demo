name: Backend Unhealthy
subsystem: traffic_management
vehicle_section: load_balancing
error_type: LB-BACKEND-UNHEALTHY
sensor_type: health_check
affected_services:
- cloud-load-balancer
- vpc-network-manager
cascade_services:
- cloud-cdn-service
- cloud-armor-waf
description: Load balancer backend VMs in the web managed instance group failing health checks as their CPU saturates
investigation_notes: |-
  Root cause: The Compute Engine VMs in the web managed instance group behind the backend service are pinned near 100% CPU (above 90%) since the web-frontend-v3.8.0 release, so health check probes time out and the LB marks them unhealthy and stops sending traffic. Confirm on the GCP Compute Engine OTel dashboards (instance CPU utilization and scheduler wait time by instance group). Other common causes: application crash/OOM, health check endpoint misconfiguration (wrong port or path), firewall rules blocking health check probes (GCP health checks come from 130.211.0.0/22 and 35.191.0.0/16). Diagnose:
    gcloud compute backend-services get-health <backend-service> --global
    gcloud compute health-checks describe <health-check>
    gcloud compute firewall-rules list --filter='sourceRanges:130.211.0.0/22 OR sourceRanges:35.191.0.0/16'
  Remediation: Roll the managed instance group back to the pre-v3.8.0 instance template (gcloud compute instance-groups managed rolling-action start-update <mig> --version=template=<previous-template> --region=<region>) or scale it out to relieve CPU. Only if the health check itself is wrong, verify it matches the application's actual health endpoint:
    gcloud compute health-checks update http <hc> --port=<correct_port> --request-path=<correct_path>
  Ensure firewall rules allow health check probes:
    gcloud compute firewall-rules create allow-health-checks --network=<vpc> --source-ranges=130.211.0.0/22,35.191.0.0/16 --allow=tcp:<port>
  Check instance logs for application crashes: Console > Compute Engine > <instance> > Serial port output.
remediation_action: reconfigure_health_checks
error_message: '[CloudLB] LB-BACKEND-UNHEALTHY forwarding_rule={lb_forwarding_rule} backend_service={lb_backend_service} unhealthy={lb_unhealthy_count}/{lb_total_backends}
  health_check={lb_health_check} failed_checks={lb_failed_checks} region={gcp_region}'
stack_trace: |-
  Cloud Load Balancer Health Report
  -----------------------------------
  Forwarding Rule:  {lb_forwarding_rule}
  Backend Service:  {lb_backend_service}
  Unhealthy:        {lb_unhealthy_count}/{lb_total_backends}
  Health Check:     {lb_health_check}
  Failed Checks:    {lb_failed_checks} consecutive
  Region:           {gcp_region}
  Action: Investigate backend instance logs and health check config
correlation_attr:
  key: deployment.app_version
  value: web-frontend-v3.8.0
fault_params:
  lb_forwarding_rule: gcpnet-fr-https-global
  lb_backend_service: gcpnet-bs-web
  lb_unhealthy_count: {randint: [2, 6]}
  lb_total_backends: {randint: [6, 12]}
  lb_health_check: hc-http-8080
  lb_failed_checks: {randint: [3, 10]}
  gcp_region: {choice: [us-central1, us-east1, europe-west1]}
rca_clues:
  cloud-load-balancer:
    lb.health_check_port: 8080
    lb.health_check_probe_result: TIMEOUT
    lb.backend_cpu_utilization_pct: {uniform: [92.0, 99.0], round: 1}
    lb.consecutive_failures: {randint: [3, 10]}
  vpc-network-manager:
    vpc.health_check_fw_rule: PRESENT
    vpc.probe_source_range: 130.211.0.0/22,35.191.0.0/16
  cloud-cdn-service:
    cdn.serving_stale_from_unhealthy: true
  cloud-armor-waf:
    armor.backend_protection_gap: true
business_impact:
  - kpi: business.load_balancer_rps
    value: {uniform: [16926.0, 19474.0]}
  - kpi: business.uptime_pct
    factor: {uniform: [0.72, 0.88]}
  - kpi: business.availability_index_0_100
    factor: {uniform: [0.65, 0.85]}
  - kpi: business.customer_sla_breach_count
    factor: {uniform: [3.5, 8.0]}
generator_impact:
  gcp_compute_otel:
    cpu_utilization_high: 95.0

name: Backend Unhealthy
subsystem: traffic_management
vehicle_section: load_balancing
error_type: LB-BACKEND-UNHEALTHY
sensor_type: health_check
affected_services:
- cloud-load-balancer
- vpc-network-manager
cascade_services:
- cloud-cdn-service
- cloud-armor-waf
description: Load balancer backend VMs in the web managed instance group failing health checks as their CPU saturates
error_message: '[CloudLB] LB-BACKEND-UNHEALTHY forwarding_rule={lb_forwarding_rule} backend_service={lb_backend_service} unhealthy={lb_unhealthy_count}/{lb_total_backends}
  health_check={lb_health_check} failed_checks={lb_failed_checks} region={gcp_region}'
stack_trace: |-
  Cloud Load Balancer Health Report
  -----------------------------------
  Forwarding Rule:  {lb_forwarding_rule}
  Backend Service:  {lb_backend_service}
  Unhealthy:        {lb_unhealthy_count}/{lb_total_backends}
  Health Check:     {lb_health_check}
  Failed Checks:    {lb_failed_checks} consecutive
  Region:           {gcp_region}
  Action: Investigate backend instance logs and health check config
correlation_attr:
  key: deployment.app_version
  value: web-frontend-v3-8-0
fault_params:
  lb_forwarding_rule: gcpnet-fr-https-global
  lb_backend_service: gcpnet-bs-web
  lb_unhealthy_count: 4
  lb_total_backends: 10
  lb_health_check: hc-http-8080
  lb_failed_checks: {randint: [3, 10]}
  gcp_region: us-central1
rca_clues:
  cloud-load-balancer:
    lb.health_check_port: 8080
    lb.health_check_probe_result: TIMEOUT
    lb.backend_cpu_max_pct: {uniform: [92.0, 99.0], round: 1}
    lb.consecutive_failures: {randint: [3, 10]}
  vpc-network-manager:
    vpc.health_check_fw_rule: PRESENT
    vpc.probe_source_range: 130.211.0.0/22,35.191.0.0/16
  cloud-cdn-service:
    cdn.serving_stale_from_unhealthy: true
  cloud-armor-waf:
    armor.backend_protection_gap: true
business_impact:
  - kpi: business.load_balancer_rps
    value: {uniform: [16926.0, 19474.0]}
  - kpi: business.uptime_pct
    factor: {uniform: [0.72, 0.88]}
  - kpi: business.availability_index_0_100
    factor: {uniform: [0.65, 0.85]}
  - kpi: business.customer_sla_breach_count
    factor: {uniform: [3.5, 8.0]}
generator_impact:
  gcp_compute_otel:
    cpu_utilization_high: 95.0
investigation_notes: |-
  Root cause: managed instance group gcpnet-web-mig ({gcp_region}) was rolled to instance template web-frontend-v3-8-0 (deployment.app_version=web-frontend-v3-8-0, see the audit record on the MIG before the first LB-BACKEND-UNHEALTHY). The new template pins the VMs that run it above 90% CPU (the rolling update had replaced {lb_unhealthy_count} of {lb_total_backends} instances when probes of health check {lb_health_check} began timing out; the other instances still run web-frontend-v3-7-4 and stay healthy), so backend service {lb_backend_service} marks those {lb_unhealthy_count} backends unhealthy and stops sending them traffic. The health check configuration and the probe path are fine, and firewall rules for 130.211.0.0/22 and 35.191.0.0/16 are present, which rules out a wrong health check port/path and a firewall block; the probe result is TIMEOUT, not connection refused.
  Confirm:
    - cloud-load-balancer logs "cloud-lb: mig=gcpnet-web-mig ... healthy=6/10 instance_template=web-frontend-v3-8-0 ... status=ANOMALY" (attributes.lb.instance_template, attributes.lb.backend_status)
    - metrics.lb.healthy_backends falls from 10 to 6 and metrics.lb.backend_cpu_max_pct (highest instance CPU in the group) rises above 90; metrics.lb.error_rate_5xx_pct and metrics.lb.latency_p99_ms rise with it
    - rca attributes lb.health_check_probe_result=TIMEOUT and vpc.health_check_fw_rule=PRESENT
  Remediation: roll the group back to the previous instance template with opsctl rollback mig/gcpnet-web-mig --region us-central1 --to-revision previous (web-frontend-v3-7-4). The rollback replaces the new-template instances one by one (each new VM has to boot and pass the health check), so healthy backends climb back to 10 of 10 over about 2 minutes. Scaling out would not fix it: the new template is what saturates the CPU.
remediation_action: rollback_instance_template
remediation_command: |-
  opsctl rollback mig/gcpnet-web-mig --region us-central1 --to-revision previous
fault_scope:
  cluster: gcpnet-gke-central1
  workloads: [cloud-load-balancer, vpc-network-manager]
# the load balancer's own health checks fail first; CDN and Cloud Armor see it later
service_lag_seconds: {cloud-cdn-service: 40, cloud-armor-waf: 60}
infrastructure_events:
  - service: vpc-network-manager
    severity: INFO
    offset_seconds: -120
    body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=compute.googleapis.com methodName=v1.compute.regionInstanceGroupManagers.patch resourceName=projects/gcpnet-prod-001/regions/us-central1/instanceGroupManagers/gcpnet-web-mig principalEmail=web-release-pipeline@gcpnet-project.iam.gserviceaccount.com status=OK change="versions[0].instanceTemplate web-frontend-v3-7-4 -> web-frontend-v3-8-0, rolling update started"'
    attributes:
      user.name: web-release-pipeline@gcpnet-project.iam.gserviceaccount.com
      change.request: CHG-7781
      operation: mig_rollout
      deployment.app_version: web-frontend-v3-8-0
      lb.mig: gcpnet-web-mig
cascade_messages:
  cloud-cdn-service:
    - severity: WARN
      message: '[CloudCDN] backend service {lb_backend_service} has {lb_unhealthy_count}/{lb_total_backends} unhealthy backends; serving stale from edge'
remediation_effects:
  log_events:
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 2
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=compute.googleapis.com methodName=v1.compute.regionInstanceGroupManagers.patch resourceName=projects/gcpnet-prod-001/regions/us-central1/instanceGroupManagers/gcpnet-web-mig principalEmail={actor} status=OK'
    - service: cloud-load-balancer
      severity: INFO
      offset_seconds: 10
      body: 'cloud-lb: managed instance group gcpnet-web-mig rolling back to instance_template web-frontend-v3-7-4; replacing instances one at a time'
      attributes:
        operation: mig_rollout
        lb.instance_template: web-frontend-v3-7-4
  steady_attributes:
    cloud-load-balancer:
      lb.instance_template: web-frontend-v3-7-4
  verification:
    - signal: lb.healthy_backends
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-load-balancer"'
      field: 'metrics.lb.healthy_backends'
      expect: '10 of 10 (was 6)'
      within_seconds: 150
    - signal: lb.backend_cpu_max_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-load-balancer"'
      field: 'metrics.lb.backend_cpu_max_pct'
      expect: 'back in 45-65 (was above 90)'
      within_seconds: 150
    - signal: instance template
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "cloud-load-balancer" AND body.text LIKE "*mig=gcpnet-web-mig*"'
      field: 'attributes.lb.instance_template'
      expect: 'web-frontend-v3-7-4 on every line logged since the fix; web-frontend-v3-8-0 stops appearing'
      within_seconds: 150

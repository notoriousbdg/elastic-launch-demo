name: Security Policy Sync Failure
subsystem: security
vehicle_section: policy_management
error_type: ARMOR-POLICY-SYNC-FAILURE
sensor_type: policy_sync
affected_services:
- cloud-armor-waf
- vpc-network-manager
cascade_services:
- cloud-load-balancer
description: Cloud Armor security policy failing to sync across backend services while the Cloud SQL for MySQL policy store is stuck on row lock waits
investigation_notes: |-
  Root cause: cloud-armor-waf keeps its security_policies table in Cloud SQL for MySQL. Concurrent policy edits contend for the same rows, so InnoDB row lock waits and slow queries pile up and the sync job can't read a consistent policy version to push to the backends. Confirm on the GCP Cloud SQL for MySQL OTel dashboards (InnoDB row lock waits, slow queries). Cloud Armor policy updates propagate asynchronously to all backend services. Propagation typically takes 60-90 seconds but can stall if backends are unhealthy or if there is a version conflict from concurrent policy edits. During sync gaps, stale backends enforce the previous policy version, creating an inconsistent security posture. Check sync status:
    gcloud compute backend-services describe <backend> --global --format='value(securityPolicy)'
    gcloud compute security-policies describe <policy> --format='value(fingerprint,creationTimestamp)'
  Remediation: Force a policy re-attachment to lagging backends:
    gcloud compute backend-services update <backend> --global --security-policy=<policy>
  If the version conflict persists, export the policy and re-import it; the fingerprint in the exported file makes the import fail on a concurrent change instead of overwriting it:
    gcloud compute security-policies export <policy> --file-name=policy-backup.yaml
    gcloud compute security-policies import <policy> --file-name=policy-backup.yaml
  Serialize policy edits so only one writer changes the policy at a time.
remediation_action: reset_security_policy
error_message: '[CloudArmor] ARMOR-POLICY-SYNC-FAILURE policy={armor_policy} version={policy_version} backends_synced={backends_synced}/{backends_total}
  last_sync={policy_last_sync_sec}s ago error="{policy_sync_error}"'
stack_trace: |-
  Cloud Armor Policy Sync Diagnostic
  -------------------------------------
  Policy:           {armor_policy}
  Version:          {policy_version}
  Synced Backends:  {backends_synced}/{backends_total}
  Last Sync:        {policy_last_sync_sec}s ago
  Error:            {policy_sync_error}
  Stale Backends:   Running the previous policy version
  Action: Force policy push or check backend health
correlation_attr:
  key: network.policy_push_agent
  value: armor-sync-v2.1.0-beta
fault_params:
  armor_policy: {choice: [gcpnet-waf-policy, gcpnet-ddos-policy, gcpnet-edge-policy]}
  policy_version: {randint: [10, 50]}
  backends_synced: {randint: [1, 3]}
  backends_total: 6
  policy_last_sync_sec: {randint: [120, 600]}
  policy_sync_error: version conflict with pending update
rca_clues:
  cloud-armor-waf:
    armor.policy_version_mismatch: true
    armor.stale_backends_count: {randint: [3, 5]}
    armor.concurrent_policy_edits: {randint: [2, 5]}
  vpc-network-manager:
    vpc.security_posture: inconsistent
    vpc.unprotected_backends: {randint: [3, 5]}
  cloud-load-balancer:
    lb.policy_enforcement_gap: true
    lb.backends_without_policy: {randint: [3, 5]}
    lb.backend_health_state: HEALTHY
business_impact:
  - kpi: business.api_success_rate_pct
    factor: {uniform: [0.78, 0.94]}
  - kpi: business.network_sla_compliance_pct
    factor: {uniform: [0.72, 0.90]}
  - kpi: business.vpc_flow_anomalies_per_min
    factor: {uniform: [2.5, 5.5]}
generator_impact:
  gcp_cloudsql_mysql_otel:
    innodb_lock_waits_high: 40.0
    slow_queries_high: 15.0

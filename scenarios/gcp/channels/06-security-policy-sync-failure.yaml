name: Security Policy Sync Failure
subsystem: security
vehicle_section: policy_management
error_type: ARMOR-POLICY-SYNC-FAILURE
sensor_type: policy_sync
affected_services:
- cloud-armor-waf
- vpc-network-manager
cascade_services:
- cloud-load-balancer
description: Cloud Armor security policy failing to sync across backend services
investigation_notes: |-
  Root cause: Cloud Armor policy updates propagate asynchronously to all backend services. Propagation typically takes 60-90 seconds but can stall if backends are unhealthy or if there is a version conflict from concurrent policy edits. During sync gaps, stale backends enforce the previous policy version, creating an inconsistent security posture. Check sync status:
    gcloud compute backend-services describe <backend> --global --format='value(securityPolicy)'
    gcloud compute security-policies describe <policy> --format='value(fingerprint,creationTimestamp)'
  Remediation: Force a policy re-attachment to lagging backends:
    gcloud compute backend-services update <backend> --global --security-policy=<policy>
  If version conflict persists, export the policy, delete and recreate it:
    gcloud compute security-policies export <policy> --file-name=policy-backup.yaml
  Avoid concurrent policy edits; use --fingerprint flag to prevent race conditions.
remediation_action: reset_security_policy
error_message: '[CloudArmor] ARMOR-POLICY-SYNC-FAILURE policy={armor_policy} version={policy_version} backends_synced={backends_synced}/{backends_total}
  last_sync={policy_last_sync_sec}s ago error="{policy_sync_error}"'
stack_trace: |-
  Cloud Armor Policy Sync Diagnostic
  -------------------------------------
  Policy:           {armor_policy}
  Version:          {policy_version}
  Synced Backends:  {backends_synced}/{backends_total}
  Last Sync:        {policy_last_sync_sec}s ago
  Error:            {policy_sync_error}
  Stale Backends:   Running policy version {policy_version} - 1
  Action: Force policy push or check backend health
correlation_attr:
  key: network.policy_push_agent
  value: armor-sync-v2.1.0-beta
fault_params:
  armor_policy: {choice: [gcpnet-waf-policy, gcpnet-ddos-policy, gcpnet-edge-policy]}
  policy_version: {randint: [10, 50]}
  backends_synced: {randint: [1, 3]}
  backends_total: {randint: [4, 8]}
  policy_last_sync_sec: {randint: [120, 600]}
  policy_sync_error:
    choice:
      - backend not responding to policy push
      - version conflict with pending update
      - timeout waiting for backend acknowledgment
rca_clues:
  cloud-armor-waf:
    armor.policy_version_mismatch: true
    armor.stale_backends_count: {randint: [2, 5]}
  vpc-network-manager:
    vpc.security_posture: inconsistent
    vpc.unprotected_backends: {randint: [1, 3]}
  cloud-load-balancer:
    lb.policy_enforcement_gap: true
    lb.backends_without_policy: {randint: [1, 4]}
business_impact:
  - kpi: business.api_success_rate_pct
    factor: {uniform: [0.78, 0.94]}
  - kpi: business.network_sla_compliance_pct
    factor: {uniform: [0.72, 0.90]}
  - kpi: business.vpc_flow_anomalies_per_min
    factor: {uniform: [2.5, 5.5]}

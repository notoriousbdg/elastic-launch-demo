name: DNS Zone Propagation Delay
subsystem: dns
vehicle_section: dns_propagation
error_type: DNS-ZONE-PROPAGATION-DELAY
sensor_type: dns_propagation
affected_services:
- cloud-dns-resolver
- cloud-load-balancer
cascade_services:
- cloud-cdn-service
- network-intelligence
description: DNS record changes taking abnormally long to propagate because the Cloud SQL for SQL Server record store is blocking and deadlocking
investigation_notes: |-
  Root cause: the Cloud Scheduler job dns-ttl-bulk-update (TTL migration to 60s) holds a long open transaction on the dns_records table in Cloud SQL for SQL Server, where cloud-dns-resolver stages record changes before publishing them to Cloud DNS. Other record writers are blocked behind it (some picked as deadlock victims), so a change such as {dns_change_id} for {dns_record_name} in zone {dns_zone} sits QUEUED in the record store and reaches only {dns_servers_updated} of {dns_servers_total} name servers late. Cloud DNS itself is healthy: name server response stays at 5-20 ms and there are 0 pending DNSSEC re-signing operations, which rules out name server load, a huge record set and re-signing.
  Confirm:
    - cloud-dns-resolver metric dns.record_store_blocked_writers rises from 0 to 5-20 and dns.pending_changes from 0 to 5-20
    - cloud-dns-resolver metric dns.propagation_time_s rises from 20-45 s to 120-600 s and dns.servers_updated drops from 4 to 1-3
    - cloud-dns-resolver logs operation=zone_health with dns.publisher_blocked=true, dns.pending_changes 5-20 and dns.status=ANOMALY for zone {dns_zone}
    - the Cloud SQL for SQL Server OTel dashboards show blocked processes and deadlocks on dns_records
    - the cloud-dns-resolver log "job dns-ttl-bulk-update started" (deployment.dns_ttl_override=ttl-60s-migration) comes before the first slow propagation
  Remediation: stop the Cloud Scheduler job so it cannot start again, kill its open transaction on the Cloud SQL for SQL Server instance (stopping the job alone does not end a session that is already running), then republish the zone from the source of truth:
    opsctl delete job/dns-ttl-bulk-update
    opsctl delete sql-session --selector job=dns-ttl-bulk-update --instance gcpnet-dns-sqlserver
    opsctl sync dns-zone/{dns_zone}
  When the session is killed the transaction rolls back and dns.record_store_blocked_writers drops to 0 within seconds. The queued changes then publish: dns.pending_changes drains to 0 and dns.propagation_time_s converges to about 30 s and dns.servers_updated returns to 4 over about 45-60 seconds. Flushing caches or waiting does not help: the changes are blocked before they reach Cloud DNS.
remediation_action: flush_dns_cache
remediation_command: |-
  opsctl delete job/dns-ttl-bulk-update
  opsctl delete sql-session --selector job=dns-ttl-bulk-update --instance gcpnet-dns-sqlserver
  opsctl sync dns-zone/gcpnet-prod-zone
error_message: 'cloud-dns: DNS-ZONE-PROPAGATION-DELAY zone={dns_zone} change_id={dns_change_id} record={dns_record_name} propagation_time={dns_prop_time_sec}s
  (SLA {dns_prop_sla_sec}s) servers_updated={dns_servers_updated}/{dns_servers_total}'
stack_trace: |-
  Cloud DNS Propagation Report
  ------------------------------
  Zone:               {dns_zone}
  Change ID:          {dns_change_id}
  Record:             {dns_record_name}
  Propagation Time:   {dns_prop_time_sec}s (SLA: {dns_prop_sla_sec}s)
  Servers Updated:    {dns_servers_updated}/{dns_servers_total}
  Status:             QUEUED in record store (not yet submitted to Cloud DNS)
  Action: Stop the blocking bulk job and resync the zone
correlation_attr:
  key: deployment.dns_ttl_override
  value: ttl-60s-migration
fault_params:
  dns_zone: gcpnet-prod-zone
  dns_change_id: {format: "change-{n}", n: {randint: [10000, 99999]}}
  dns_record_name: api.gcpnet.internal
  dns_prop_time_sec: {randint: [120, 600]}
  dns_prop_sla_sec: 60
  dns_servers_updated: {randint: [1, 3]}
  dns_servers_total: 4
rca_clues:
  cloud-dns-resolver:
    dns.propagation_lag_sec: {randint: [120, 600]}
    dns.publisher_blocked: true
    dns.change_status: QUEUED_IN_RECORD_STORE
    dns.record_store_blocked_writers: {randint: [5, 20]}
    dns.nameserver_response_ms: {randint: [5, 20]}
    dns.pending_dnssec_resign_ops: 0
  cloud-load-balancer:
    lb.dns_stale_ip: true
    lb.traffic_to_old_backend: {uniform: [10, 40], round: 1}
  cloud-cdn-service:
    cdn.dns_cache_stale: true
    cdn.origin_resolution_mismatch: true
  network-intelligence:
    ni.dns_consistency_check: INCONSISTENT
fault_scope:
  cluster: gcpnet-gke-east1
  workloads: [cloud-dns-resolver, cloud-load-balancer]
cascade_messages:
  cloud-cdn-service:
    - severity: WARN
      message: 'cdn: origin {dns_record_name} resolves to a stale address; zone {dns_zone} propagation {dns_prop_time_sec}s'
infrastructure_events:
  - service: cloud-dns-resolver
    severity: INFO
    offset_seconds: -120
    body: 'cloud-dns: job dns-ttl-bulk-update started: migrating TTLs to 60s on dns_records zone={dns_zone}; transaction open (scheduled by dns-ops, CR-4519)'
    attributes:
      user.name: dns-ops
      change.request: CR-4519
      operation: bulk_ttl_update
      deployment.dns_ttl_override: ttl-60s-migration
      change.summary: 'TTL migration: dns-ttl-bulk-update holds a long transaction on dns_records'
remediation_effects:
  log_events:
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 2
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=cloudscheduler.googleapis.com methodName=google.cloud.scheduler.v1.CloudScheduler.DeleteJob resourceName=projects/gcpnet-prod-001/locations/us-central1/jobs/dns-ttl-bulk-update principalEmail={actor} status=OK'
      attributes:
        operation: audit
        command.target: job/dns-ttl-bulk-update
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 4
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=sqladmin.googleapis.com methodName=google.cloud.sql.v1.SqlInstancesService.ExecuteSql resourceName=projects/gcpnet-prod-001/instances/gcpnet-dns-sqlserver principalEmail={actor} status=OK'
      attributes:
        operation: audit
        command.target: sql-session
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 6
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=dns.googleapis.com methodName=dns.changes.create resourceName=projects/gcpnet-prod-001/managedZones/gcpnet-prod-zone principalEmail={actor} status=OK'
      attributes:
        operation: audit
        command.target: dns-zone/gcpnet-prod-zone
    - service: cloud-dns-resolver
      severity: INFO
      offset_seconds: 8
      body: 'cloud-dns: job dns-ttl-bulk-update deleted and its session on gcpnet-dns-sqlserver killed, dns_records transaction rolled back (blocked writers 0); queued changes publishing to zone {dns_zone}'
      attributes:
        operation: bulk_ttl_update
        dns.publisher_blocked: 'false'
  steady_attributes:
    cloud-dns-resolver:
      dns.publisher_blocked: 'false'
  log_taper_seconds: 0
  verification:
    - signal: dns.record_store_blocked_writers
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.record_store_blocked_writers'
      expect: '0 (was 5-20), as soon as the session is killed'
      within_seconds: 30
    - signal: dns.pending_changes
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.pending_changes'
      expect: 'drains to 0 (was 5-20)'
      within_seconds: 60
    - signal: dns.propagation_time_s
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.propagation_time_s'
      expect: 'back to about 20-45 s (was 120-600 s), converging over about 60 s as the queue drains'
      within_seconds: 90
    - signal: dns.servers_updated
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.servers_updated'
      expect: '4 (was 1-3)'
      within_seconds: 90
    - signal: DNS record store publisher
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'attributes.dns.publisher_blocked'
      expect: 'false on every line logged since the fix'
      within_seconds: 90
business_impact:
  - kpi: business.api_success_rate_pct
    factor: {uniform: [0.65, 0.85]}
  - kpi: business.cdn_cache_hit_rate_pct
    factor: {uniform: [0.6, 0.82]}
  - kpi: business.load_balancer_rps
    value: {uniform: [16926.0, 19474.0]}
  - kpi: business.edge_latency_p50_ms
    factor: {uniform: [2.5, 6.0]}
generator_impact:
  gcp_cloudsql_sqlserver_otel:
    blocked_processes_high: 40.0
    deadlocks_high: 20.0

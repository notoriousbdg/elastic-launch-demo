name: DNSSEC Validation Failure
subsystem: dns
vehicle_section: dns_security
error_type: DNS-DNSSEC-VALIDATION-FAILURE
sensor_type: dnssec_validator
affected_services:
- cloud-dns-resolver
- vpc-network-manager
cascade_services:
- cloud-armor-waf
- network-intelligence
description: DNSSEC signature validation failing for managed DNS zones
investigation_notes: |-
  Root cause: the key-signing key (KSK) of managed zone {dns_zone} was rotated to ksk-2026q4-rotation (CR-4471) but the DS record at the domain registrar still references the previous KSK (ksk-2026q2). Validating resolvers follow the chain of trust from the parent DS to the zone DNSKEY, find no match and return SERVFAIL for {dns_record_name} ({dns_record_type}) and every other name in the zone. The zone itself is healthy and correctly signed: the RRSIG is valid ({dnssec_rrsig_expiry}), so an expired signature is ruled out, and the DS record is stale rather than missing. Only {dns_zone} fails; gcpnet-prod-zone and gcpnet-edge-zone validate normally.
  Confirm:
    - cloud-dns-resolver metric dns.dnssec_validation_failures rises from 0-1 to 50-500 per minute after the rotation (zone {dns_zone})
    - cloud-dns-resolver logs operation=dnssec_status with attributes dns.active_ksk_id=ksk-2026q4-rotation, dns.ds_matches_active_ksk=false, dns.status=ANOMALY and rrsig=VALID in the message
    - cloud-dns-resolver log "DNSSEC KSK rotated" (user.name=dns-admin, change.request=CR-4471) comes before the first validation failure
    - the failures stop only when the active KSK matches the registrar DS, so a new RRSIG or a flushed cache would not help
  Remediation: roll the zone back to the previous KSK, which still matches the registrar DS: opsctl rollback dnskey/{dns_zone} --to-revision previous. The zone re-activates ksk-2026q2 and the chain of trust validates again at once, but validating resolvers keep the SERVFAIL (negative) answers they already cached until those expire, typically 1-5 minutes, so dns.dnssec_validation_failures decays over about 4 minutes (dns.active_ksk_id and dns.ds_matches_active_ksk are already correct while it does) and reads 0-1 by about 5 minutes. A cache flush on the zone side would not shorten that. The DS record can be updated at the registrar before the rotation is attempted again.
remediation_action: reset_dns_zone
remediation_command: |-
  opsctl rollback dnskey/gcpnet-public-zone --to-revision previous
error_message: 'cloud-dns: DNS-DNSSEC-VALIDATION-FAILURE zone={dns_zone} record={dns_record_name} type={dns_record_type} rrsig_expiry={dnssec_rrsig_expiry}
  ds_status={dnssec_ds_status} validation_errors={dnssec_error_count}/m'
stack_trace: |-
  Cloud DNS DNSSEC Validation Report
  ------------------------------------
  Zone:              {dns_zone}
  Record:            {dns_record_name} ({dns_record_type})
  RRSIG Expiry:      {dnssec_rrsig_expiry}
  DS Record Status:  {dnssec_ds_status}
  Validation Errors: {dnssec_error_count}/min
  DNSKEY Algorithm:  RSASHA256
  Action: Roll back to the previous KSK or update the DS record at the registrar
correlation_attr:
  key: network.dnssec_key_id
  value: ksk-2026q4-rotation
fault_params:
  dns_zone: gcpnet-public-zone
  dns_record_name: api.gcpnet.example.com
  dns_record_type: A
  dnssec_rrsig_expiry: "VALID (6d remaining)"
  dnssec_ds_status: STALE
  dnssec_error_count: {randint: [50, 500]}
rca_clues:
  cloud-dns-resolver:
    dns.active_ksk_id: ksk-2026q4-rotation
    dns.rrsig_status: VALID
    dns.ds_record_stale: true
  vpc-network-manager:
    vpc.dns_resolution_failures: {randint: [50, 300]}
    vpc.affected_services: internal
  cloud-armor-waf:
    armor.dns_based_rules_stale: true
  network-intelligence:
    ni.dns_path_test: FAIL
    ni.dnssec_chain_broken: true
fault_scope:
  cluster: gcpnet-gke-east1
  workloads: [cloud-dns-resolver, vpc-network-manager]
cascade_messages:
  cloud-armor-waf:
    - severity: WARN
      message: 'armor: DNS-based rule refresh skipped, {dns_record_name} did not validate (zone={dns_zone})'
infrastructure_events:
  - service: cloud-dns-resolver
    severity: INFO
    offset_seconds: -90
    body: 'cloud-dns: DNSSEC KSK rotated zone={dns_zone} new_key=ksk-2026q4-rotation previous_key=ksk-2026q2; DS record at registrar not updated (rotated by dns-admin, CR-4471)'
    attributes:
      user.name: dns-admin
      change.request: CR-4471
      operation: dnssec_key_rotation
      network.dnssec_key_id: ksk-2026q4-rotation
      change.summary: 'KSK ksk-2026q2 -> ksk-2026q4-rotation'
remediation_effects:
  log_events:
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 2
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=dns.googleapis.com methodName=dns.managedZones.patch resourceName=projects/gcpnet-prod-001/managedZones/gcpnet-public-zone principalEmail={actor} status=OK'
      attributes:
        operation: audit
        command.target: dnskey/gcpnet-public-zone
    - service: cloud-dns-resolver
      severity: INFO
      offset_seconds: 5
      body: 'cloud-dns: zone={dns_zone} active KSK ksk-2026q2 re-activated; DS record at registrar matches the active KSK'
      attributes:
        operation: dnssec_key_rotation
        dns.active_ksk_id: ksk-2026q2
  steady_attributes:
    cloud-dns-resolver:
      dns.active_ksk_id: ksk-2026q2
      dns.ds_matches_active_ksk: 'true'
  log_taper_seconds: 0
  verification:
    - signal: dns.dnssec_validation_failures
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.dnssec_validation_failures'
      expect: 'decays over about 4 minutes as cached SERVFAIL answers expire, back to 0-1 per minute (was 50-500)'
      within_seconds: 300
    - signal: dns.servfail_count
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'metrics.dns.servfail_count'
      expect: 'back to 0-2 responses (was 60-280), tailing off with the dnssec failures'
      within_seconds: 300
    - signal: active KSK id
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'attributes.dns.active_ksk_id'
      expect: 'ksk-2026q2 on every line logged since the fix; ksk-2026q4-rotation stops appearing'
      within_seconds: 30
    - signal: DS matches active KSK
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "cloud-dns-resolver"'
      field: 'attributes.dns.ds_matches_active_ksk'
      expect: 'true'
      within_seconds: 30
business_impact:
  - kpi: business.api_success_rate_pct
    factor: {uniform: [0.55, 0.8]}
  - kpi: business.requests_per_min
    value: {uniform: [1692600.0, 1947400.0]}
  - kpi: business.uptime_pct
    factor: {uniform: [0.85, 0.95]}
  - kpi: business.customer_sla_breach_count
    factor: {uniform: [3.0, 7.0]}

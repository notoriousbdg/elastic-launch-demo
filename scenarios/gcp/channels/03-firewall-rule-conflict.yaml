name: Firewall Rule Conflict
subsystem: core_network
vehicle_section: vpc_firewall
error_type: VPC-FIREWALL-RULE-CONFLICT
sensor_type: firewall_policy
affected_services:
- vpc-network-manager
- cloud-armor-waf
cascade_services:
- cloud-interconnect
description: Conflicting VPC firewall rules causing unexpected traffic drops
investigation_notes: |-
  Root cause: firewall policy revision fw-policy-v34-rollback re-inserted the blanket rule {fw_rule_b} (DENY, ingress) at priority {fw_priority_b} on {vpc_network}. In GCP a lower number wins, so it now sits above {fw_rule_a} (ALLOW, priority {fw_priority_a}) and drops traffic that {fw_rule_a} is meant to allow: about {fw_dropped_packets} packets/s denied against 0-20/s normally. Cloud Armor, routes, NAT and subnets are unchanged, which rules out an attack (the denied flows are internal sources, not a DDoS) and a routing fault.
  Confirm:
    - vpc-network-manager metric vpc.firewall_denied_packets jumps from 0-20/s to 100-5000/s; log "deny_rule=deny-all-ingress deny_priority=900 ... status=ANOMALY" with attributes.vpc.firewall.deny_rule_priority = 900
    - the vpc-network-manager line "firewall policy fw-policy-v34-rollback applied" (attributes.network.firewall_policy_rev) precedes the first VPC-FIREWALL-RULE-CONFLICT
    - cloud-armor-waf and cloud-interconnect lines name deny-all-ingress as the upstream rule blocking on-prem and internal traffic
  Remediation: opsctl patch firewall/deny-all-ingress --priority 65534 moves the deny below {fw_rule_a} so the allow wins again; denied packets fall back to 0-20/s within about 45 seconds. Deleting {fw_rule_a} or raising its priority number is not needed. Follow-up: fix the rollback policy so it keeps the deny at 65534.
remediation_action: reconfigure_firewall_rules
remediation_command: |-
  opsctl patch firewall/deny-all-ingress --priority 65534
error_message: level=error ts={{timestamp}} caller=fw_policy_engine.go:445 msg="VPC-FIREWALL-RULE-CONFLICT" project={gcp_project}
  rule_a={fw_rule_a} rule_b={fw_rule_b} priority_a={fw_priority_a} priority_b={fw_priority_b} network={vpc_network} dropped_packets={fw_dropped_packets}/s
stack_trace: "goroutine 312 [running]:\ngcpnet/internal/vpc.(*PolicyEngine).detectConflicts(0xc000518000)\n\t/app/internal/vpc/fw_policy_engine.go:445\
  \ +0x2f1\n  Conflicting Rules:\n    Rule A: {fw_rule_a} (priority {fw_priority_a}, ALLOW)\n    Rule B: {fw_rule_b} (priority\
  \ {fw_priority_b}, DENY)\n  Network: {vpc_network}\n  Dropped: {fw_dropped_packets} packets/s\n  Action: Adjust rule priorities\
  \ or merge conflicting rules"
correlation_attr:
  key: network.firewall_policy_rev
  value: fw-policy-v34-rollback
fault_params:
  gcp_project: gcpnet-prod-001
  vpc_network: gcpnet-vpc-prod
  fw_rule_a: allow-internal-all
  fw_rule_b: deny-all-ingress
  fw_priority_a: 1000
  fw_priority_b: 900
  fw_dropped_packets: {randint: [100, 5000]}
rca_clues:
  vpc-network-manager:
    vpc.conflicting_priorities: 900-vs-1000
    vpc.denied_flow_spike: true
  cloud-armor-waf:
    armor.policy_bypass_detected: true
    armor.upstream_fw_conflict: deny-all-ingress
  cloud-interconnect:
    interconnect.onprem_traffic_blocked: true
    interconnect.affected_fw_rule: deny-all-ingress
cascade_messages:
  cloud-interconnect:
    - severity: WARN
      message: 'interconnect-agent: on-prem traffic blocked by VPC firewall rule {fw_rule_b} on {vpc_network}; {fw_dropped_packets} packets/s dropped'
fault_scope:
  cluster: gcpnet-gke-central1
  workloads: [vpc-network-manager, cloud-armor-waf]
infrastructure_events:
  - service: vpc-network-manager
    severity: INFO
    offset_seconds: -60
    body: 'firewall: policy fw-policy-v34-rollback applied on gcpnet-vpc-prod; deny-all-ingress priority 65534 -> 900 (above allow-internal-all 1000) applied_by=netsec-policy-bot (CHG-7766)'
    attributes:
      user.name: netsec-policy-bot
      change.request: CHG-7766
      network.firewall_policy_rev: fw-policy-v34-rollback
      operation: firewall_policy_apply
      change.summary: 'deny-all-ingress priority 65534 -> 900'
remediation_effects:
  transition_seconds: 45
  log_events:
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 2
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=compute.googleapis.com methodName=v1.compute.firewalls.patch resourceName=projects/gcpnet-prod-001/global/firewalls/deny-all-ingress principalEmail={actor} status=OK'
      attributes:
        operation: firewalls.patch
        cloud.provider: gcp
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 10
      body: 'vpc-firewall: deny-all-ingress priority now 65534; allow-internal-all (1000) evaluated first on gcpnet-vpc-prod'
      attributes:
        operation: firewall_update
        vpc.firewall.deny_rule_priority: 65534
  steady_attributes:
    vpc-network-manager:
      vpc.firewall.deny_rule_priority: 65534
  verification:
    - signal: vpc.firewall_denied_packets
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "vpc-network-manager"'
      field: 'metrics.vpc.firewall_denied_packets'
      expect: '0-20 packets/s (was 100-5000)'
      within_seconds: 90
    - signal: deny rule priority
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "vpc-network-manager"'
      field: 'attributes.vpc.firewall.deny_rule_priority'
      expect: '65534 on every line logged since the fix; 900 stops appearing'
      within_seconds: 90
    - signal: VPC-FIREWALL-RULE-CONFLICT lines
      from: 'logs.otel.gcpnet'
      where: 'body.text LIKE "*VPC-FIREWALL-RULE-CONFLICT*"'
      expect: '0 new lines'
      within_seconds: 90
business_impact:
  - kpi: business.api_success_rate_pct
    factor: {uniform: [0.60, 0.82]}
  - kpi: business.vpc_flow_anomalies_per_min
    factor: {uniform: [4.0, 9.0]}
  - kpi: business.network_sla_compliance_pct
    factor: {uniform: [0.65, 0.85]}
  - kpi: business.customer_sla_breach_count
    factor: {uniform: [3.0, 7.0]}

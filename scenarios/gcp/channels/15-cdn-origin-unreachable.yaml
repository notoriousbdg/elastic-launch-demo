name: CDN Origin Unreachable
subsystem: content_delivery
vehicle_section: cdn_origin
error_type: CDN-ORIGIN-UNREACHABLE
sensor_type: origin_health
affected_services:
- cloud-cdn-service
- cloud-load-balancer
cascade_services:
- cloud-armor-waf
description: Cloud CDN unable to fetch from its media-assets Cloud Storage backend bucket after an IAM change, serving stale content
stack_trace: |-
  Cloud CDN Origin Health Report
  --------------------------------
  Backend:       {cdn_backend}
  Origin:        {cdn_origin_host}
  Status Code:   {cdn_origin_status}
  Failures/s:    {cdn_origin_failures}
  Serving Stale: {cdn_stale_pct}%
  Stale TTL:     {cdn_stale_ttl_sec}s remaining
  Action: Check origin backend health and network path
correlation_attr:
  key: iam.bucket_policy_rev
  value: media-assets-iam-cleanup-r2
fault_params:
  cdn_backend: gcpnet-cdn-backend-01
  cdn_origin_host: gcpnet-media-assets.storage.googleapis.com
  cdn_origin_status: 403
  cdn_origin_failures: {randint: [50, 500]}
  cdn_stale_pct: {uniform: [20.0, 80.0], round: 1}
  cdn_stale_ttl_sec: {randint: [30, 300]}
rca_clues:
  cloud-cdn-service:
    cdn.origin_status_code: 403
    cdn.origin_error_reason: PERMISSION_DENIED
    cdn.stale_ttl_remaining_sec: {randint: [30, 300]}
  cloud-load-balancer:
    lb.origin_health_check: PASSING
  cloud-armor-waf:
    armor.origin_path_blocked: false
business_impact:
  - kpi: business.cdn_cache_hit_rate_pct
    factor: {uniform: [0.10, 0.35]}
  - kpi: business.cdn_error_rate_pct
    factor: {uniform: [4.0, 12.0]}
  - kpi: business.requests_per_min
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.uptime_pct
    factor: {uniform: [0.75, 0.90]}
generator_impact:
  gcp_cloudstorage_otel:
    error_4xx_rate: 0.4
investigation_notes: |-
  Root cause: an IAM change on bucket gcpnet-media-assets (setIamPolicy, iam.bucket_policy_rev=media-assets-iam-cleanup-r2) removed roles/storage.objectViewer from the Cloud CDN fill service account service-418273659204@cloud-cdn-fill.iam.gserviceaccount.com. Origin fetches from {cdn_origin_host} now return {cdn_origin_status} PERMISSION_DENIED and Cloud CDN serves stale content for backend {cdn_backend} ({cdn_stale_pct}% of responses, {cdn_stale_ttl_sec}s of stale TTL left). The origin itself is healthy: the load balancer health check passes and Cloud Armor does not block the origin path, which rules out an origin outage or a network path problem (a 502/503/504 would show instead of 403).
  Confirm:
    - cloud-cdn-service logs "cloud-cdn: backend_bucket=media-assets ... origin_status=403 ... status=ANOMALY" with attributes.cdn.origin_status = 403 and attributes.cdn.origin_health = ANOMALY
    - metrics.cdn.origin_fetch_errors rises from 0-2 to 50-500 and metrics.cdn.stale_served_pct from 0-2 to 20-80
    - rca attributes cdn.origin_error_reason=PERMISSION_DENIED and lb.origin_health_check=PASSING
    - the vpc-network-manager audit record with methodName=SetIamPolicy on bucket gcpnet-media-assets comes before the first CDN-ORIGIN-UNREACHABLE
  Remediation: restore the binding with opsctl apply bucket-iam/gcpnet-media-assets --member serviceAccount:service-418273659204@cloud-cdn-fill.iam.gserviceaccount.com --role roles/storage.objectViewer. Origin fetches return 200 again, the stale share and fetch errors fall back to about 0 over about 60 seconds. Resetting the CDN backend association would not help: the 403 is an IAM denial.
remediation_action: restore_bucket_iam_binding
remediation_command: |-
  opsctl apply bucket-iam/gcpnet-media-assets --member serviceAccount:service-418273659204@cloud-cdn-fill.iam.gserviceaccount.com --role roles/storage.objectViewer
error_message: '[CloudCDN] CDN-ORIGIN-UNREACHABLE backend={cdn_backend} origin={cdn_origin_host} status_code={cdn_origin_status} failures={cdn_origin_failures}/s serving_stale={cdn_stale_pct}% ttl_remaining={cdn_stale_ttl_sec}s'
fault_scope:
  cluster: gcpnet-gke-central1
  workloads: [cloud-cdn-service, cloud-load-balancer]
infrastructure_events:
  - service: vpc-network-manager
    severity: INFO
    offset_seconds: -90
    body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=storage.googleapis.com methodName=storage.setIamPermissions resourceName=projects/_/buckets/gcpnet-media-assets principalEmail=storage-cleanup-bot@gcpnet-project.iam.gserviceaccount.com status=OK change="removed roles/storage.objectViewer serviceAccount:service-418273659204@cloud-cdn-fill.iam.gserviceaccount.com"'
    attributes:
      user.name: storage-cleanup-bot@gcpnet-project.iam.gserviceaccount.com
      change.request: CHG-7740
      operation: bucket_iam_change
      iam.bucket_policy_rev: media-assets-iam-cleanup-r2
cascade_messages:
  cloud-armor-waf:
    - severity: WARN
      message: 'cloud-armor: edge security policy for backend {cdn_backend}: 0 requests denied in the last interval; origin fills answered {cdn_origin_status}'
remediation_effects:
  log_events:
    - service: vpc-network-manager
      severity: INFO
      offset_seconds: 2
      body: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=storage.googleapis.com methodName=storage.setIamPermissions resourceName=projects/_/buckets/gcpnet-media-assets principalEmail={actor} status=OK'
    - service: cloud-cdn-service
      severity: INFO
      offset_seconds: 8
      body: 'cloud-cdn: origin fetch from gcpnet-media-assets.storage.googleapis.com returned 200 for backend_bucket media-assets; refreshing stale objects'
      attributes:
        operation: origin_fetch
        cdn.origin_status: 200
  steady_attributes:
    cloud-cdn-service:
      cdn.origin_status: 200
  verification:
    - signal: cdn.origin_fetch_errors
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-cdn-service"'
      field: 'metrics.cdn.origin_fetch_errors'
      expect: 'back to 0-2 (was 50-500)'
      within_seconds: 90
    - signal: cdn.stale_served_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "cloud-cdn-service"'
      field: 'metrics.cdn.stale_served_pct'
      expect: 'back below 3 (was 20-80)'
      within_seconds: 90
    - signal: origin status
      from: 'logs.otel.gcpnet'
      where: 'resource.attributes.service.name == "cloud-cdn-service" AND body.text LIKE "*backend_bucket=media-assets*"'
      field: 'attributes.cdn.origin_status'
      expect: '200 on every line logged since the fix; 403 stops appearing'
      within_seconds: 90

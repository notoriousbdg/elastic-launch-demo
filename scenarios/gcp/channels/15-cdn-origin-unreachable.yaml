name: CDN Origin Unreachable
subsystem: content_delivery
vehicle_section: cdn_origin
error_type: CDN-ORIGIN-UNREACHABLE
sensor_type: origin_health
affected_services:
- cloud-cdn-service
- cloud-load-balancer
cascade_services:
- cloud-armor-waf
description: Cloud CDN unable to fetch from its media-assets Cloud Storage backend bucket after an IAM change, serving stale content
investigation_notes: |-
  Root cause: The CDN's backend bucket is the media-assets Cloud Storage bucket. An IAM change removed the roles/storage.objectViewer binding for the Cloud CDN fill service account (service-<project_number>@cloud-cdn-fill.iam.gserviceaccount.com), so origin fetches fail with PERMISSION_DENIED and the CDN falls back to stale content. Confirm on the GCP Cloud Storage OTel dashboards (request count by response_code, client-fault errors on the bucket), then restore the binding: gcloud storage buckets add-iam-policy-binding gs://<bucket> --member=serviceAccount:service-<project_number>@cloud-cdn-fill.iam.gserviceaccount.com --role=roles/storage.objectViewer. For a non-bucket origin: CDN edge nodes cannot reach the origin backend service. Status codes 502/503 indicate the origin is down or overloaded; 504 indicates a timeout. A status of 0 means the connection was refused or timed out at the TCP level. CDN is serving stale cached content while the stale TTL has not expired. Once stale TTL expires, clients will see errors. Diagnose:
    gcloud compute backend-services get-health <backend> --global
    gcloud compute health-checks describe <health-check> --format='value(httpHealthCheck)'
    Console > Network Services > Load Balancing > <lb> > Backend details (health status)
  Remediation: Check origin instance group health and scaling. If origin is a GKE service, verify pods are running: kubectl get pods -n <namespace> -l app=<origin-app>. Reset the CDN backend association to trigger fresh origin health checks:
    gcloud compute backend-services update <backend> --global --enable-cdn
  Increase the serve-while-stale window as a safety net:
    gcloud compute backend-buckets update <backend-bucket> --serve-while-stale=3600
remediation_action: reset_cdn_backend
error_message: '[CloudCDN] CDN-ORIGIN-UNREACHABLE backend={cdn_backend} origin={cdn_origin_host} status_code={cdn_origin_status}
  failures={cdn_origin_failures}/m serving_stale={cdn_stale_pct}% ttl_remaining={cdn_stale_ttl_sec}s'
stack_trace: |-
  Cloud CDN Origin Health Report
  --------------------------------
  Backend:       {cdn_backend}
  Origin:        {cdn_origin_host}
  Status Code:   {cdn_origin_status}
  Failures/min:  {cdn_origin_failures}
  Serving Stale: {cdn_stale_pct}%
  Stale TTL:     {cdn_stale_ttl_sec}s remaining
  Action: Check origin backend health and network path
correlation_attr:
  key: iam.bucket_policy_rev
  value: media-assets-iam-cleanup-r2
fault_params:
  cdn_backend: {choice: [gcpnet-cdn-backend-01, gcpnet-cdn-backend-02, gcpnet-cdn-backend-03]}
  cdn_origin_host: {choice: [gcpnet-media-assets.storage.googleapis.com]}
  cdn_origin_status: 403
  cdn_origin_failures: {randint: [50, 500]}
  cdn_stale_pct: {uniform: [20.0, 80.0], round: 1}
  cdn_stale_ttl_sec: {randint: [30, 300]}
rca_clues:
  cloud-cdn-service:
    cdn.origin_status_code: 403
    cdn.origin_error_reason: PERMISSION_DENIED
    cdn.stale_ttl_remaining_sec: {randint: [30, 300]}
  cloud-load-balancer:
    lb.origin_health_check: PASSING
  cloud-armor-waf:
    armor.origin_path_blocked: false
business_impact:
  - kpi: business.cdn_cache_hit_rate_pct
    factor: {uniform: [0.10, 0.35]}
  - kpi: business.cdn_error_rate_pct
    factor: {uniform: [4.0, 12.0]}
  - kpi: business.requests_per_min
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.uptime_pct
    factor: {uniform: [0.75, 0.90]}
generator_impact:
  gcp_cloudstorage_otel:
    error_4xx_rate: 0.4

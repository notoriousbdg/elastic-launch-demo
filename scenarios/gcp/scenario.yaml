raw_log_profile:
  service_name: cloud-gateway
  user_id_prefix: usr
  tier_field: support_tier
  tier_values:
  - - basic
    - 60
  - - standard
    - 30
  - - premium
    - 10
  country_weights:
    US: 35
    GB: 12
    DE: 10
    IN: 12
    JP: 8
    BR: 8
    FR: 8
    AU: 7
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  paths:
  - /v1/projects/{id}/instances
  - /v1/projects/{id}/buckets
  - /v1/projects/{id}/iam
  - /v1/projects/{id}/networks
  - /v1/projects/{id}/disks
  - /v1/projects/{id}/operations
  - /login
  - /health
  change_point_path: /v1/projects/{id}/instances
trace_attributes:
  base:
    gcp.project_id: {choice: [gcpnet-prod-001, gcpnet-prod-002, gcpnet-staging]}
    gcp.network_tier: {choice: [PREMIUM, PREMIUM, PREMIUM, STANDARD]}
  services:
    vpc-network-manager:
      vpc.network_tier: {choice: [PREMIUM, STANDARD]}
      vpc.subnet_cidr: {choice: [10.128.0.0/20, 10.142.0.0/20, 10.132.0.0/20]}
      vpc.peering_count: {randint: [1, 8]}
      vpc.route_table_size: {randint: [80, 250]}
      vpc.mtu: {choice: [1460, 1500, 8896]}
    cloud-armor-waf:
      armor.policy_name: {choice: [gcpnet-waf-policy, gcpnet-ddos-policy, gcpnet-edge-policy]}
      armor.rule_count: {randint: [8, 45]}
      armor.adaptive_protection: {choice: [true, true, false]}
      armor.evaluation_mode: {choice: [STANDARD, ADVANCED]}
    cloud-nat-gateway:
      nat.pool_utilization: {uniform: [30.0, 95.0], round: 1}
      nat.port_allocation: {choice: [STATIC, DYNAMIC]}
      nat.min_ports_per_vm: {choice: [64, 256, 1024, 2048]}
      nat.external_ip_count: {randint: [1, 10]}
    cloud-dns-resolver:
      dns.query_type: {choice: [A, AAAA, CNAME, MX, TXT, SRV]}
      dns.zone_name: {choice: [gcpnet-internal, gcpnet-prod-zone, gcpnet-services]}
      dns.dnssec_enabled: {choice: [true, true, false]}
      dns.response_policy_count: {randint: [0, 5]}
    cloud-interconnect:
      interconnect.circuit_id: {format: "CIR-{n}", n: {randint: [100000, 999999]}}
      interconnect.bandwidth_gbps: {choice: [10, 10, 100]}
      interconnect.lacp_state: {choice: [ACTIVE, ACTIVE, ACTIVE, DETACHED]}
      interconnect.location: {choice: [iad-zone1-1, dfw-zone1-1, ams-zone1-1]}
    cloud-vpn-gateway:
      vpn.tunnel_status: {choice: [ESTABLISHED, ESTABLISHED, ESTABLISHED, NEGOTIATING]}
      vpn.ike_version: {choice: [IKEv2, IKEv2, IKEv1]}
      vpn.peer_ip: {format: "203.0.113.{a}", a: {randint: [1, 254]}}
      vpn.ha_redundancy: {choice: [true, true, false]}
    cloud-cdn-service:
      cdn.cache_mode: {choice: [CACHE_ALL_STATIC, USE_ORIGIN_HEADERS, FORCE_CACHE_ALL]}
      cdn.origin_region: {choice: [us-central1, us-east1, europe-west1]}
      cdn.signed_url_enabled: {choice: [true, false]}
      cdn.negative_caching: {choice: [true, false]}
    cloud-load-balancer:
      lb.backend_count: {randint: [3, 12]}
      lb.health_check_interval: {choice: [5, 10, 30]}
      lb.scheme: {choice: [EXTERNAL_MANAGED, INTERNAL_MANAGED, EXTERNAL]}
      lb.protocol: {choice: [HTTPS, HTTP2, TCP, gRPC]}
    network-intelligence:
      ni.test_count_active: {randint: [5, 25]}
      ni.topology_nodes: {randint: [30, 120]}
      ni.last_scan_age_sec: {randint: [10, 300]}
      ni.firewall_insights_enabled: {choice: [true, true, false]}

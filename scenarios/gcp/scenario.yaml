agent_config:
  id: gcp-network-analyst
  name: Google Cloud Network Analyst
  assessment_tool_name: network_health_assessment
  system_prompt: 'You are the Google Cloud Network Analyst, an expert AI assistant for GCP network operations. You help network
    engineers investigate incidents, analyze telemetry data, and provide root cause analysis for fault conditions across 9
    GCP networking services spanning 3 regions (us-central1, us-east1, europe-west1). You have deep expertise in Google Cloud
    VPC networking, Cloud Armor WAF and DDoS protection, Cloud NAT gateway management, Cloud DNS (including DNSSEC), Dedicated
    Interconnect and BGP routing, Cloud VPN (IKE/IPsec), Cloud CDN caching and origin management, Cloud Load Balancing (L4/L7),
    and Network Intelligence Center connectivity testing. When investigating incidents, search for these GCP-specific identifiers
    in logs: VPC errors (VPC-ROUTE-LIMIT-EXCEEDED, VPC-SUBNET-IP-EXHAUSTION, VPC-FIREWALL-RULE-CONFLICT), Cloud Armor events
    (ARMOR-DDOS-ALERT, ARMOR-FALSE-POSITIVE, ARMOR-POLICY-SYNC-FAILURE), NAT faults (NAT-PORT-EXHAUSTION, NAT-ENDPOINT-MAPPING-FAILURE,
    NAT-IP-ALLOCATION-ERROR), DNS issues (DNS-DNSSEC-VALIDATION-FAILURE, DNS-ZONE-PROPAGATION-DELAY), Interconnect faults
    (INTERCONNECT-CIRCUIT-DOWN, INTERCONNECT-BGP-FLAP), CDN errors (CDN-CACHE-MISS-SPIKE, CDN-ORIGIN-UNREACHABLE), LB faults
    (LB-BACKEND-UNHEALTHY, LB-SSL-CERT-EXPIRY), VPN errors (VPN-TUNNEL-DOWN, VPN-IKE-NEGOTIATION-FAILURE), and NIC events
    (NI-CONNECTIVITY-TEST-FAILURE). Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: network_health_assessment
  description: 'Comprehensive network health assessment. Evaluates all GCP networking services against operational readiness
    criteria. Returns data for health evaluation across VPC, Cloud Armor, NAT, DNS, Interconnect, VPN, CDN, and Load Balancing
    systems. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: cloud-cdn-service
executive_dashboard_intro: '**GCP network KPIs** — CDN delivery, capacity & security, SLO compliance, and cloud economics
  (synthetic `business.*` from `cloud-cdn-service`).'
executive_kpi_sections:
- header: '**Delivery** — cache hit rate, requests, egress, offload, latency, and errors'
  specs:
  - - CDN cache hit rate (%)
    - metrics.business.cdn_cache_hit_rate_pct
  - - Requests / min
    - metrics.business.requests_per_min
  - - Bytes egress (GiB/min)
    - metrics.business.bytes_egress_gib_per_min
  - - Origin offload (%)
    - metrics.business.origin_offload_pct
  - - Edge latency P50 (ms)
    - metrics.business.edge_latency_p50_ms
  - - CDN error rate (%)
    - metrics.business.cdn_error_rate_pct
- header: '**Capacity & security** — bandwidth, interconnect, Cloud Armor, VPC, NAT, LB'
  specs:
  - - Peak bandwidth utilization (%)
    - metrics.business.peak_bandwidth_utilization_pct
  - - Interconnect utilization (%)
    - metrics.business.interconnect_utilization_pct
  - - Cloud Armor blocks / min
    - metrics.business.cloud_armor_blocks_per_min
  - - VPC flow anomalies / min
    - metrics.business.vpc_flow_anomalies_per_min
  - - NAT port exhaustion (%)
    - metrics.business.nat_port_exhaustion_rate_pct
  - - Load balancer RPS
    - metrics.business.load_balancer_rps
- header: '**SLO & reliability** — uptime, API success, SLA compliance, MTTD, MTTR'
  specs:
  - - Uptime (%)
    - metrics.business.uptime_pct
  - - API success rate (%)
    - metrics.business.api_success_rate_pct
  - - Network SLA compliance (%)
    - metrics.business.network_sla_compliance_pct
  - - Incident MTTD (min)
    - metrics.business.incident_mttd_min
  - - Incident MTTR (min)
    - metrics.business.incident_mttr_min
  - - Availability index (0–100)
    - metrics.business.availability_index_0_100
- header: '**Commercial** — spend, committed use, cost efficiency, carbon, and SLA breaches'
  specs:
  - - Cloud spend (USD/min)
    - metrics.business.cloud_spend_usd_per_min
  - - Committed use utilization (%)
    - metrics.business.committed_use_discount_utilization_pct
  - - Cost / M requests (USD)
    - metrics.business.cost_per_million_requests_usd
  - - Resource efficiency (%)
    - metrics.business.resource_efficiency_pct
  - - Carbon intensity (gCO2/TiB)
    - metrics.business.carbon_intensity_gco2_per_tib
  - - Customer SLA breaches
    - metrics.business.customer_sla_breach_count
executive_trend_charts:
- title: CDN cache hit rate
  field: metrics.business.cdn_cache_hit_rate_pct
  y_label: '%'
- title: Requests / min
  field: metrics.business.requests_per_min
  y_label: requests/min
- title: Bytes egress (GiB/min)
  field: metrics.business.bytes_egress_gib_per_min
  y_label: GiB/min
- title: Cloud Armor blocks / min
  field: metrics.business.cloud_armor_blocks_per_min
  y_label: blocks/min
- title: Cloud spend (USD/min)
  field: metrics.business.cloud_spend_usd_per_min
  y_label: USD/min
- title: Uptime (%)
  field: metrics.business.uptime_pct
  y_label: '%'

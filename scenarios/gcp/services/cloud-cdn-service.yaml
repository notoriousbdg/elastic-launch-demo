service: cloud-cdn-service
sort_order: 3
cloud_provider: gcp
cloud_region: us-central1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-central1-c
subsystem: content_delivery
language: python
topology:
- - cloud-load-balancer
  - /api/v1/lb/origin-fetch
  - GET
- - vpc-network-manager
  - /api/v1/vpc/route-to-origin
  - GET
entry_endpoints:
- - /api/v1/cdn/analytics
  - GET
- - /api/v1/cdn/purge
  - POST
db_operations:
- - SELECT
  - cdn_backends
  - SELECT backend_id, origin_host, cache_mode, ttl_sec, hit_ratio FROM cdn_backends WHERE enabled = true
- - INSERT
  - cache_invalidations
  - INSERT INTO cache_invalidations (backend_id, path_pattern, requested_at, status) VALUES (?, ?, NOW(), 'pending')
emit_fault_logs: true
kpi_emitter: true
constants:
  BACKENDS:
  - gcpnet-cdn-backend-01
  - gcpnet-cdn-backend-02
  - gcpnet-cdn-backend-03
  CACHE_MODES:
  - CACHE_ALL_STATIC
  - USE_ORIGIN_HEADERS
  - FORCE_CACHE_ALL
steps:
- sample:
    backend:
      choice: BACKENDS
    cache_mode:
      choice: CACHE_MODES
    s14:
      expr: "min(1.0, elapsed.get(14, 0) / 45.0) if 14 in all_active else (1.0 - min(1.0, since_fix.get(14, 0) / 90.0) if 14 in fixed_channels else 0.0)"
    base_hit:
      expr: round(max(88.0, min(95.0, rand.gauss(91.5, 1.5))), 1)
    fault_hit:
      expr: round(max(15.0, min(45.0, rand.gauss(30.0, 5.0))), 1)
    hit_ratio:
      expr: round(base_hit + (fault_hit - base_hit) * s14, 1)
    miss_base:
      expr: rand.randint(50, 200)
    miss_rate:
      expr: round(miss_base + (rand.randint(500, 5000) - miss_base) * s14)
    keys_base:
      expr: rand.randint(8000, 15000)
    unique_keys:
      expr: round(keys_base + (rand.randint(50000, 200000) - keys_base) * s14)
    cache_key_policy:
      expr: "'include-all-query-params' if 14 in all_active else 'exclude-query-params'"
    mc_status:
      expr: "'ANOMALY' if 14 in all_active or hit_ratio < 80.0 else 'OK'"
- metric:
    name: cdn.cache_hit_ratio
    value:
      var: hit_ratio
    unit: '%'
- metric:
    name: cdn.backend_hit_ratio_pct
    value:
      var: hit_ratio
    unit: '%'
- metric:
    name: cdn.unique_cache_keys
    value:
      var: unique_keys
    unit: keys
- metric:
    name: cdn.cache_miss_rate
    value:
      var: miss_rate
    unit: req/s
- log:
    level: INFO
    message: 'cloud-cdn: backend={backend} hit_ratio={hit_ratio}% miss_rate={miss_rate}/s cache_mode={cache_mode}'
    attrs:
      operation: cache_stats
      cdn.backend:
        var: backend
      cdn.hit_ratio:
        var: hit_ratio
      cdn.miss_rate:
        var: miss_rate
- when: "mc_status == 'OK'"
  log:
    level: INFO
    message: 'cloud-cdn: cache_key backend=gcpnet-cdn-backend-01 hit_ratio={hit_ratio}% unique_keys={unique_keys} cache_key_policy={cache_key_policy} status={mc_status}'
    attrs: &cache_key_attrs
      operation: cache_key_stats
      cdn.cache_backend: gcpnet-cdn-backend-01
      cdn.hit_ratio:
        var: hit_ratio
      cdn.unique_keys:
        var: unique_keys
      cdn.cache_key_policy:
        var: cache_key_policy
      cdn.cache_status:
        var: mc_status
- when: "mc_status != 'OK'"
  log:
    level: WARN
    message: 'cloud-cdn: cache_key backend=gcpnet-cdn-backend-01 hit_ratio={hit_ratio}% unique_keys={unique_keys} cache_key_policy={cache_key_policy} status={mc_status}'
    attrs: *cache_key_attrs
- sample:
    s15:
      expr: "min(1.0, elapsed.get(15, 0) / 20.0) if 15 in all_active else (1.0 - min(1.0, since_fix.get(15, 0) / 60.0) if 15 in fixed_channels else 0.0)"
    base_lat:
      expr: round(max(10.0, min(50.0, rand.gauss(28.0, 5.0))), 1)
    origin_latency:
      expr: round(base_lat + (max(200.0, min(2000.0, rand.gauss(900.0, 300.0))) - base_lat) * s14, 1)
    err_base:
      expr: rand.randint(0, 2)
    origin_errors:
      expr: round(err_base + (rand.randint(50, 500) - err_base) * s15)
    stale_base:
      expr: rand.uniform(0.0, 2.0)
    stale_pct:
      expr: round(stale_base + (rand.uniform(20.0, 80.0) - stale_base) * s15, 1)
    origin_status:
      expr: "403 if 15 in all_active else 200"
    origin_health:
      expr: "'ANOMALY' if 15 in all_active or origin_errors > 10 or stale_pct > 5.0 else 'OK'"
- metric:
    name: cdn.origin_latency_ms
    value:
      var: origin_latency
    unit: ms
- metric:
    name: cdn.origin_errors
    value:
      var: origin_errors
    unit: errors
- metric:
    name: cdn.origin_fetch_errors
    value:
      var: origin_errors
    unit: req/s
- metric:
    name: cdn.stale_served_pct
    value:
      var: stale_pct
    unit: '%'
- log:
    level: INFO
    message: 'cloud-cdn: origin_latency={origin_latency}ms origin_errors={origin_errors} backend={backend} interval=60s'
    attrs:
      operation: origin_health
      cdn.origin_latency:
        var: origin_latency
      cdn.origin_errors:
        var: origin_errors
- when: "origin_health == 'OK'"
  log:
    level: INFO
    message: 'cloud-cdn: backend_bucket=media-assets origin=gcpnet-media-assets.storage.googleapis.com origin_status={origin_status} fetch_errors={origin_errors}/s stale_served={stale_pct}% status={origin_health}'
    attrs: &origin_fetch_attrs
      operation: origin_fetch
      cdn.backend_bucket: media-assets
      cdn.origin_status:
        var: origin_status
      cdn.origin_fetch_errors:
        var: origin_errors
      cdn.stale_served_pct:
        var: stale_pct
      cdn.origin_health:
        var: origin_health
- when: "origin_health != 'OK'"
  log:
    level: WARN
    message: 'cloud-cdn: backend_bucket=media-assets origin=gcpnet-media-assets.storage.googleapis.com origin_status={origin_status} fetch_errors={origin_errors}/s stale_served={stale_pct}% status={origin_health}'
    attrs: *origin_fetch_attrs
- sample:
    egress_gbps:
      expr: round(max(1.0, rand.gauss(4.5, 0.4)) * (1.0 + 0.8 * s14), 2)
    requests_total:
      expr: round(max(100000, rand.gauss(300000, 15000)))
    served_from_cache:
      expr: round(hit_ratio * requests_total / 100)
- metric:
    name: cdn.egress_gbps
    value:
      var: egress_gbps
    unit: Gbps
- metric:
    name: cdn.requests_total
    value:
      var: requests_total
    unit: requests
- log:
    level: INFO
    message: 'cloud-cdn: egress={egress_gbps}Gbps requests={requests_total} served_from_cache={served_from_cache} interval=60s'
    attrs:
      operation: bandwidth_stats
      cdn.egress_gbps:
        var: egress_gbps
      cdn.requests_total:
        var: requests_total
- sample:
    cache_fill_pct:
      gauss: [74.0, 2.5]
      clamp: [60.0, 90.0]
      round: 1
- metric:
    name: cdn.cache_fill_pct
    value:
      var: cache_fill_pct
    unit: '%'
- log:
    level: INFO
    message: 'cloud-cdn: cache_fill={cache_fill_pct}% backend={backend} ttl_default=3600s signed_urls=enabled'
    attrs:
      operation: cache_fill
      cdn.cache_fill_pct:
        var: cache_fill_pct

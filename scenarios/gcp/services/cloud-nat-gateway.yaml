service: cloud-nat-gateway
sort_order: 5
cloud_provider: gcp
cloud_region: us-east1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-east1-c
subsystem: network_access
language: go
generates_traces: false
topology:
- - vpc-network-manager
  - /api/v1/vpc/subnet-info
  - GET
- - cloud-dns-resolver
  - /api/v1/dns/external-resolve
  - POST
entry_endpoints:
- - /api/v1/nat/status
  - GET
- - /api/v1/nat/mappings
  - GET
emit_fault_logs: true
kpi_emitter: false
constants:
  GATEWAYS:
  - gcpnet-nat-central1
  - gcpnet-nat-east1
  - gcpnet-nat-europe1
  NAT_IPS:
  - 34.72.100.10
  - 34.72.100.11
  - 34.72.100.12
  - 34.86.50.20
  - 34.86.50.21
  - 35.195.10.30
  - 35.195.10.31
steps:
# ---- gcpnet-nat-central1 (us-central1) ----
- sample:
    sev7_c:
      expr: "min(1.0, elapsed.get(7, 0) / 45.0) if 7 in all_active else (1.0 - min(1.0, since_fix.get(7, 0) / 60.0) if 7 in fixed_channels else 0.0)"
    sev8_c:
      expr: "min(1.0, elapsed.get(8, 0) / 45.0) if 8 in all_active else (1.0 - min(1.0, since_fix.get(8, 0) / 60.0) if 8 in fixed_channels else 0.0)"
    min_ports_c:
      expr: "64 if 7 in all_active else 1024"
    base_util_c:
      expr: "round(max(21.0, min(39.0, 30.0 + rand.gauss(0, 3.0))), 1)"
    util_c:
      expr: "round(base_util_c + (rand.uniform(93.8, 99.2) - base_util_c) * sev7_c, 1) if 7 in all_active else (round(6.0 + (base_util_c - 6.0) * min(1.0, since_fix.get(7, 0) / 60.0), 1) if 7 in fixed_channels else round(base_util_c + 12.0 * sev8_c, 1))"
    used_c:
      expr: "int(round(min_ports_c * util_c / 100.0))"
    nat_status_c:
      expr: "'ANOMALY' if 7 in all_active else 'NOMINAL'"
    base_drop_c:
      randint: [0, 5]
    dropped_c:
      expr: "int(round(base_drop_c + (rand.randint(50, 500) - base_drop_c) * max(sev7_c, sev8_c)))"
    mapping_fail_c:
      expr: "int(round((1 if rand.randint(1, 10) == 1 else 0) + rand.randint(100, 2000) * sev8_c))"
    eim_c:
      expr: "True if 8 in all_active else False"
    map_status_c:
      expr: "'ANOMALY' if 8 in all_active else 'NOMINAL'"
    pending_c:
      expr: "int(round(rand.randint(2, 8) * 0.0))"
    quota_c:
      expr: "6"
    alloc_ips_c:
      expr: "5"
    pool_status_c:
      expr: "'ANOMALY' if False else 'NOMINAL'"
    new_conns_c:
      randint: [1000, 10000]
    active_mappings_c:
      randint: [5000, 30000]
    nat_ip_c:
      choice: [34.72.100.10, 34.72.100.11, 34.72.100.12]
- metric:
    name: nat.ports_used
    value:
      var: used_c
    unit: 'ports'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1, vm: gke-node-pool-a-001}
- metric:
    name: nat.ports_total
    value:
      var: min_ports_c
    unit: 'ports'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1, vm: gke-node-pool-a-001}
- metric:
    name: nat.port_utilization_pct
    value:
      var: util_c
    unit: '%'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1, vm: gke-node-pool-a-001}
- metric:
    name: nat.min_ports_per_vm
    value:
      var: min_ports_c
    unit: 'ports'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.new_connections
    value:
      var: new_conns_c
    unit: 'conn/s'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.dropped_connections
    value:
      var: dropped_c
    unit: 'conn/s'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.mapping_failures
    value:
      var: mapping_fail_c
    unit: 'conn/s'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.allocated_ips
    value:
      var: alloc_ips_c
    unit: 'addresses'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.pending_ip_allocations
    value:
      var: pending_c
    unit: 'addresses'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.static_address_quota_used
    value:
      var: quota_c
    unit: 'addresses'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- metric:
    name: nat.active_mappings
    value:
      var: active_mappings_c
    unit: 'mappings'
    attrs: {gateway: gcpnet-nat-central1, nat.region: us-central1}
- log:
    level: INFO
    message: 'cloudnat: gateway=gcpnet-nat-central1 region=us-central1 vm=gke-node-pool-a-001 ports_used={used_c}/{min_ports_c} utilization={util_c}% min_ports_per_vm={min_ports_c} dynamic_port_allocation=false status={nat_status_c}'
    attrs:
      operation: port_allocation
      nat.gateway: gcpnet-nat-central1
      nat.region: us-central1
      nat.vm: gke-node-pool-a-001
      nat.dynamic_port_allocation: false
      nat.ports_used:
        var: used_c
      nat.utilization:
        var: util_c
      nat.min_ports_per_vm:
        var: min_ports_c
      nat.status:
        var: nat_status_c
- log:
    level: INFO
    message: 'cloudnat: gateway=gcpnet-nat-central1 region=us-central1 new_conns={new_conns_c}/s dropped={dropped_c}/s mapping_failures={mapping_fail_c}/s endpoint_independent_mapping={eim_c} protocol=TCP+UDP status={map_status_c}'
    attrs:
      operation: connection_stats
      nat.gateway: gcpnet-nat-central1
      nat.region: us-central1
      nat.new_connections:
        var: new_conns_c
      nat.dropped_connections:
        var: dropped_c
      nat.mapping_failures:
        var: mapping_fail_c
      nat.endpoint_independent_mapping:
        var: eim_c
      nat.status:
        var: map_status_c
- log:
    level: INFO
    message: 'cloudnat: gateway=gcpnet-nat-central1 region=us-central1 nat_ip={nat_ip_c} allocated_ips={alloc_ips_c} pending_ip_allocations={pending_c} static_address_quota_used={quota_c}/10 active_mappings={active_mappings_c} status={pool_status_c}'
    attrs:
      operation: ip_pool_status
      nat.gateway: gcpnet-nat-central1
      nat.region: us-central1
      nat.nat_ip:
        var: nat_ip_c
      nat.allocated_ips:
        var: alloc_ips_c
      nat.pending_ip_allocations:
        var: pending_c
      nat.static_address_quota_used:
        var: quota_c
      nat.active_mappings:
        var: active_mappings_c
      nat.status:
        var: pool_status_c

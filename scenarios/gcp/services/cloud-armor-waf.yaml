service: cloud-armor-waf
sort_order: 4
cloud_provider: gcp
cloud_region: us-east1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-east1-b
subsystem: security
language: rust
topology:
- - cloud-load-balancer
  - /api/v1/lb/block-request
  - POST
- - vpc-network-manager
  - /api/v1/vpc/firewall-sync
  - POST
entry_endpoints:
- - /api/v1/armor/policies
  - GET
- - /api/v1/armor/events
  - GET
- - /api/v1/armor/rule-update
  - POST
db_operations:
- - SELECT
  - security_policies
  - SELECT policy_id, name, rule_count, backend_count, last_updated FROM security_policies WHERE project = ?
- - SELECT
  - waf_events
  - SELECT timestamp, rule_id, action, src_ip, request_path, matched_pattern FROM waf_events WHERE policy_id = ? AND timestamp
    > NOW() - INTERVAL 1 HOUR ORDER BY timestamp DESC LIMIT 100
emit_fault_logs: true
kpi_emitter: false
constants:
  POLICIES:
  - gcpnet-web-policy
  - gcpnet-waf-policy
  - gcpnet-ddos-policy
  - gcpnet-edge-policy
  RULE_CATEGORIES:
  - sqli
  - xss
  - rce
  - lfi
  - rfi
  - scanner_detection
steps:
- sample:
    policy:
      choice: POLICIES
    total_requests:
      randint:
      - 10000
      - 50000
    blocked_requests:
      if_active:
        randint:
        - 500
        - 5000
      else:
        randint:
        - 10
        - 100
- sample:
    allowed_requests:
      expr: total_requests - blocked_requests
- metric:
    name: armor.requests_total
    value:
      var: total_requests
    unit: requests
- metric:
    name: armor.requests_blocked
    value:
      var: blocked_requests
    unit: requests
- metric:
    name: armor.requests_allowed
    value:
      var: allowed_requests
    unit: requests
- log:
    level: INFO
    message: 'cloud-armor: policy={policy} total={total_requests} blocked={blocked_requests} allowed={allowed_requests} adaptive_protection=ENABLED'
    attrs:
      operation: request_eval
      armor.policy:
        var: policy
      armor.total:
        var: total_requests
      armor.blocked:
        var: blocked_requests
- sample:
    ddos_events:
      expr: "rand.randint(3, 10) if (4 in all_active or 4 in fixed_channels) else rand.randint(0, 1)"
    attack_volume_mbps:
      expr: "round((max(20000.0, min(90000.0, rand.gauss(52000.0, 3000.0))) * min(1.0, 0.15 + elapsed.get(4, 0) / 30.0)) if 4 in all_active else (max(20000.0, min(90000.0, rand.gauss(52000.0, 3000.0))) if 4 in fixed_channels else rand.uniform(0.0, 50.0)), 1)"
- metric:
    name: armor.ddos_events
    value:
      var: ddos_events
    unit: events
- metric:
    name: armor.attack_volume_mbps
    value:
      var: attack_volume_mbps
    unit: Mbps
- log:
    level: INFO
    message: 'cloud-armor: ddos_events={ddos_events} attack_volume={attack_volume_mbps}Mbps mitigation=ACTIVE policy={policy}'
    attrs:
      operation: ddos_status
      armor.ddos_events:
        var: ddos_events
      armor.attack_volume:
        var: attack_volume_mbps
# ch4: HTTP flood on backend-lb-central1; gcpnet-edge-policy has no rate limit until the fix
- sample:
    ddos_mitigated_pct:
      expr: "round(99.8 + (max(55.0, min(70.0, rand.gauss(62.0, 2.5))) - 99.8) * min(1.0, elapsed.get(4, 0) / 45.0), 1) if 4 in all_active else (round(62.0 + (rand.uniform(99.1, 99.9) - 62.0) * min(1.0, since_fix.get(4, 0) / 60.0), 1) if 4 in fixed_channels else round(rand.uniform(99.5, 100.0), 1))"
    backend_5xx_pct:
      expr: "round(0.3 + (max(8.0, min(25.0, rand.gauss(15.0, 2.5))) - 0.3) * min(1.0, elapsed.get(4, 0) / 45.0), 2) if 4 in all_active else (round(16.0 + (rand.uniform(0.1, 0.5) - 16.0) * min(1.0, since_fix.get(4, 0) / 60.0), 2) if 4 in fixed_channels else round(rand.uniform(0.1, 0.5), 2))"
    ddos_status:
      expr: "'ANOMALY' if 4 in all_active or ddos_mitigated_pct < 90.0 else 'NOMINAL'"
    rate_limit_cfg:
      expr: "'on' if 4 in fixed_channels else 'off'"
- metric:
    name: armor.ddos_mitigated_pct
    value:
      var: ddos_mitigated_pct
    unit: '%'
- metric:
    name: armor.backend_5xx_pct
    value:
      var: backend_5xx_pct
    unit: '%'
- log:
    level: INFO
    message: 'cloud-armor: policy=gcpnet-edge-policy backend=backend-lb-central1 ddos_mitigated={ddos_mitigated_pct}% attack_volume={attack_volume_mbps}Mbps backend_5xx={backend_5xx_pct}% rate_limit_global={rate_limit_cfg} status={ddos_status}'
    attrs:
      operation: ddos_mitigation_status
      armor.policy: gcpnet-edge-policy
      armor.backend: backend-lb-central1
      armor.ddos_mitigated_pct:
        var: ddos_mitigated_pct
      armor.backend_5xx_pct:
        var: backend_5xx_pct
      armor.rule.rate_limit_global:
        var: rate_limit_cfg
      armor.status:
        var: ddos_status
# ch5: IAM cleanup removed compute.securityAdmin from deploy-sa; sqli-v33-stable-bad false-positives API traffic
- sample:
    fp_rate_pct:
      expr: "round(0.4 + (rand.uniform(15.0, 60.0) - 0.4) * min(1.0, elapsed.get(5, 0) / 45.0), 1) if 5 in all_active else (round(35.0 + (rand.uniform(0.1, 0.8) - 35.0) * min(1.0, since_fix.get(5, 0) / 60.0), 1) if 5 in fixed_channels else round(rand.uniform(0.1, 0.8), 1))"
    denied_per_min:
      expr: "int(rand.uniform(20, 400) * min(1.0, 0.2 + elapsed.get(5, 0) / 45.0)) if 5 in all_active else 0"
    fp_status:
      expr: "'ANOMALY' if 5 in all_active or fp_rate_pct >= 1.0 else 'NOMINAL'"
    policy_rev:
      expr: "'sqli-v33-stable-bad' if 5 in all_active else 'sqli-v33-stable'"
- metric:
    name: armor.false_positive_rate_pct
    value:
      var: fp_rate_pct
    unit: '%'
- metric:
    name: armor.rollback_denied_per_min
    value:
      var: denied_per_min
    unit: calls
- log:
    level: INFO
    message: 'cloud-armor: policy=gcpnet-web-policy rule=sqli-v33-stable false_positive_rate={fp_rate_pct}% policy_revision={policy_rev} status={fp_status}'
    attrs:
      operation: false_positive_status
      armor.policy: gcpnet-web-policy
      armor.false_positive_rate_pct:
        var: fp_rate_pct
      armor.policy_revision:
        var: policy_rev
      armor.status:
        var: fp_status
- when: "5 in all_active"
  log:
    level: ERROR
    message: 'gcp-audit: logName=cloudaudit.googleapis.com/activity serviceName=compute.googleapis.com methodName=v1.compute.securityPolicies.patch resourceName=projects/gcpnet-prod-001/global/securityPolicies/gcpnet-web-policy principalEmail=deploy-sa@gcpnet-project.iam.gserviceaccount.com status=PERMISSION_DENIED code=7 message="Required ''compute.securityPolicies.update'' permission for ''projects/gcpnet-prod-001/global/securityPolicies/gcpnet-web-policy''"'
    attrs:
      operation: audit_denied
      gcp.audit.method_name: v1.compute.securityPolicies.patch
      gcp.audit.status: PERMISSION_DENIED
      user.name: deploy-sa@gcpnet-project.iam.gserviceaccount.com
# ch6: armor-sync-v2.1.0-beta rollout, concurrent edits -> row lock waits -> backends stale
- sample:
    backends_synced_val:
      expr: "int(round(6 - (6 - rand.uniform(1.0, 3.0)) * min(1.0, elapsed.get(6, 0) / 45.0))) if 6 in all_active else (int(round(2 + 4 * min(1.0, since_fix.get(6, 0) / 60.0))) if 6 in fixed_channels else 6)"
    sync_lag_s:
      expr: "round(20 + (rand.uniform(120.0, 600.0) - 20.0) * min(1.0, elapsed.get(6, 0) / 45.0), 1) if 6 in all_active else (round(360.0 + (rand.uniform(15.0, 25.0) - 360.0) * min(1.0, since_fix.get(6, 0) / 60.0), 1) if 6 in fixed_channels else round(rand.uniform(15.0, 25.0), 1))"
    sync_status:
      expr: "'ANOMALY' if 6 in all_active or backends_synced_val < 6 else 'NOMINAL'"
    sync_agent:
      expr: "'armor-sync-v2.1.0-beta' if 6 in all_active else 'armor-sync-v2.0.4'"
- metric:
    name: armor.backends_synced
    value:
      var: backends_synced_val
    unit: backends
- metric:
    name: armor.policy_sync_lag_s
    value:
      var: sync_lag_s
    unit: s
- log:
    level: INFO
    message: 'cloud-armor: policy=gcpnet-waf-policy backends_synced={backends_synced_val}/6 sync_lag={sync_lag_s}s sync_agent={sync_agent} status={sync_status}'
    attrs:
      operation: policy_sync_status
      armor.policy: gcpnet-waf-policy
      armor.backends_synced:
        var: backends_synced_val
      armor.backends_total: 6
      armor.policy_sync_lag_s:
        var: sync_lag_s
      armor.sync_agent_version:
        var: sync_agent
      armor.status:
        var: sync_status
- sample:
    category:
      choice: RULE_CATEGORIES
    matches:
      if_active:
        randint:
        - 100
        - 1000
      else:
        randint:
        - 0
        - 20
- metric:
    name: armor.rule_matches
    value:
      var: matches
    unit: matches
- log:
    level: INFO
    message: 'cloud-armor: waf_category={category} matches={matches} action=DENY(403) sensitivity=2 policy={policy}'
    attrs:
      operation: waf_rule_stats
      armor.waf_category:
        var: category
      armor.rule_matches:
        var: matches
- sample:
    rate_limited:
      if_active:
        randint:
        - 100
        - 2000
      else:
        randint:
        - 0
        - 10
- metric:
    name: armor.rate_limited
    value:
      var: rate_limited
    unit: requests
- log:
    level: INFO
    message: 'cloud-armor: rate_limited={rate_limited} threshold=1000/min conform_action=allow exceed_action=deny(429) policy=gcpnet-web-policy'
    attrs:
      operation: rate_limit
      armor.rate_limited:
        var: rate_limited

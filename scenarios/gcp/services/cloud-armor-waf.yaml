service: cloud-armor-waf
sort_order: 4
cloud_provider: gcp
cloud_region: us-east1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-east1-b
subsystem: security
language: rust
topology:
- - cloud-load-balancer
  - /api/v1/lb/block-request
  - POST
- - vpc-network-manager
  - /api/v1/vpc/firewall-sync
  - POST
entry_endpoints:
- - /api/v1/armor/policies
  - GET
- - /api/v1/armor/events
  - GET
- - /api/v1/armor/rule-update
  - POST
db_operations:
- - SELECT
  - security_policies
  - SELECT policy_id, name, rule_count, backend_count, last_updated FROM security_policies WHERE project = ?
- - SELECT
  - waf_events
  - SELECT timestamp, rule_id, action, src_ip, request_path, matched_pattern FROM waf_events WHERE policy_id = ? AND timestamp
    > NOW() - INTERVAL 1 HOUR ORDER BY timestamp DESC LIMIT 100
emit_fault_logs: true
kpi_emitter: false
constants:
  POLICIES:
  - gcpnet-waf-policy
  - gcpnet-ddos-policy
  - gcpnet-edge-policy
  RULE_CATEGORIES:
  - sqli
  - xss
  - rce
  - lfi
  - rfi
  - scanner_detection
steps:
- sample:
    policy:
      choice: POLICIES
    total_requests:
      randint:
      - 10000
      - 50000
    blocked_requests:
      if_active:
        randint:
        - 500
        - 5000
      else:
        randint:
        - 10
        - 100
- sample:
    allowed_requests:
      expr: total_requests - blocked_requests
- metric:
    name: armor.requests_total
    value:
      var: total_requests
    unit: requests
- metric:
    name: armor.requests_blocked
    value:
      var: blocked_requests
    unit: requests
- metric:
    name: armor.requests_allowed
    value:
      var: allowed_requests
    unit: requests
- log:
    level: INFO
    message: 'cloud-armor: policy={policy} total={total_requests} blocked={blocked_requests} allowed={allowed_requests} adaptive_protection=ENABLED'
    attrs:
      operation: request_eval
      armor.policy:
        var: policy
      armor.total:
        var: total_requests
      armor.blocked:
        var: blocked_requests
- sample:
    ddos_events:
      if_active:
        randint:
        - 3
        - 10
      else:
        randint:
        - 0
        - 1
    attack_volume_mbps:
      if_active:
        uniform:
        - 5000.0
        - 120000.0
        round: 1
      else:
        uniform:
        - 0.0
        - 50.0
        round: 1
- metric:
    name: armor.ddos_events
    value:
      var: ddos_events
    unit: events
- metric:
    name: armor.attack_volume_mbps
    value:
      var: attack_volume_mbps
    unit: Mbps
- log:
    level: INFO
    message: 'cloud-armor: ddos_events={ddos_events} attack_volume={attack_volume_mbps}Mbps mitigation=ACTIVE policy={policy}'
    attrs:
      operation: ddos_status
      armor.ddos_events:
        var: ddos_events
      armor.attack_volume:
        var: attack_volume_mbps
- sample:
    category:
      choice: RULE_CATEGORIES
    matches:
      if_active:
        randint:
        - 100
        - 1000
      else:
        randint:
        - 0
        - 20
- metric:
    name: armor.rule_matches
    value:
      var: matches
    unit: matches
- log:
    level: INFO
    message: 'cloud-armor: waf_category={category} matches={matches} action=DENY(403) sensitivity=2 policy={policy}'
    attrs:
      operation: waf_rule_stats
      armor.waf_category:
        var: category
      armor.rule_matches:
        var: matches
- sample:
    rate_limited:
      if_active:
        randint:
        - 100
        - 2000
      else:
        randint:
        - 0
        - 10
- metric:
    name: armor.rate_limited
    value:
      var: rate_limited
    unit: requests
- log:
    level: INFO
    message: 'cloud-armor: rate_limited={rate_limited} threshold=1000/min conform_action=allow exceed_action=deny(429) policy={policy}'
    attrs:
      operation: rate_limit
      armor.rate_limited:
        var: rate_limited

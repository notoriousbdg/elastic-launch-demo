service: cloud-interconnect
sort_order: 7
cloud_provider: gcp
cloud_region: europe-west1
cloud_platform: gcp_compute_engine
cloud_availability_zone: europe-west1-b
subsystem: connectivity
language: java
topology:
- - vpc-network-manager
  - /api/v1/vpc/route-advertise
  - POST
- - cloud-vpn-gateway
  - /api/v1/vpn/failover-status
  - GET
- - network-intelligence
  - /api/v1/ni/latency-report
  - GET
entry_endpoints:
- - /api/v1/interconnect/attachments
  - GET
- - /api/v1/interconnect/diagnostics
  - GET
db_operations:
- - SELECT
  - interconnect_attachments
  - SELECT attachment_id, name, region, bandwidth, vlan_tag, state FROM interconnect_attachments WHERE interconnect_id = ?
emit_fault_logs: true
kpi_emitter: false
constants:
  ATTACHMENTS:
  - gcpnet-interconnect-primary
  - gcpnet-interconnect-secondary
  LOCATIONS:
  - iad-zone1-1
  - dfw-zone1-1
  - ams-zone1-1
  BANDWIDTH_OPTIONS:
  - 10
  - 100
  BGP_STATES:
  - IDLE
  - ACTIVE
  - CONNECT
  PEER_ASNS:
  - 16550
  - 64512
  - 64513
  LINK_FAULT_STATES:
  - DOWN
  - FLAPPING
state:
  _bgp_ticks:
    init: 0
steps:
# Channel 12 recovery after the optic swap (since_fix): light is back at once, the link
# retrains and comes up at ~75 s, the LACP member attaches at ~90 s, the BGP session is
# established and routes re-advertised at ~165 s, then traffic fails back to the primary.
- sample:
    rx_light_dbm:
      expr: "round(-2.5 + (max(-22.0, min(-16.0, rand.gauss(-19.0, 1.3))) + 2.5) * min(1.0, elapsed.get(12, 0) / 60.0), 1) if 12 in all_active
        else round(max(-3.2, min(-1.8, rand.gauss(-2.5, 0.25))), 1)"
    link_up:
      expr: "0 if (12 in all_active and rx_light_dbm < -14.0) or (12 in fixed_channels and since_fix.get(12, 0) < 75) else 1"
    lacp_state:
      expr: "'ATTACHED' if link_up == 1 and not (12 in fixed_channels and since_fix.get(12, 0) < 90) else 'DETACHED'"
    bgp_up12:
      expr: "0 if (12 in all_active and link_up == 0) or (12 in fixed_channels and since_fix.get(12, 0) < 165) else 1"
    failover_state:
      expr: "'NONE' if bgp_up12 == 1 else 'FAILOVER_IN_PROGRESS'"
    optic_batch:
      expr: "'lr4-100g-batch-2026q4' if 12 in fixed_channels else 'lr4-100g-batch-2026q2'"
    optic_status:
      expr: "'ANOMALY' if 12 in all_active or rx_light_dbm < -14.0 or link_up == 0 or lacp_state == 'DETACHED' or bgp_up12 == 0 else 'NOMINAL'"
- metric:
    name: interconnect.rx_light_dbm
    value:
      var: rx_light_dbm
    unit: dBm
- metric:
    name: interconnect.link_up
    value:
      var: link_up
    unit: '1'
- when: "optic_status == 'NOMINAL'"
  log: &optic_diagnostics_log
    level: INFO
    message: 'cloud-interconnect: attachment=gcpnet-interconnect-primary link=1 rx_light={rx_light_dbm}dBm lacp={lacp_state} optic={optic_batch} failover={failover_state} location=iad-zone1-1 status={optic_status}'
    attrs:
      operation: optic_diagnostics
      interconnect.attachment: gcpnet-interconnect-primary
      interconnect.rx_light_dbm:
        var: rx_light_dbm
      interconnect.link_up:
        var: link_up
      interconnect.lacp_state:
        var: lacp_state
      interconnect.optic_batch:
        var: optic_batch
      interconnect.status:
        var: optic_status
- when: "optic_status != 'NOMINAL' and link_up == 1"
  log:
    <<: *optic_diagnostics_log
    level: WARN
- when: "link_up == 0"
  log:
    <<: *optic_diagnostics_log
    level: ERROR
- sample:
    attachment:
      choice: ATTACHMENTS
    link_status:
      expr: "'DOWN' if attachment == 'gcpnet-interconnect-primary' and link_up == 0 else 'UP'"
    bandwidth_gbps:
      expr: "100 if attachment == 'gcpnet-interconnect-primary' else 10"
    primary_share:
      expr: "min(1.0, max(0.0, (since_fix.get(12, 0) - 165) / 30.0)) if 12 in fixed_channels else (0.0 if 12 in all_active and link_up == 0 else 1.0)"
    utilization_pct:
      expr: "round(max(0.0, rand.gauss(45.0, 3.0)) * primary_share, 1) if attachment == 'gcpnet-interconnect-primary' else round(max(0.0, rand.gauss(30.0, 2.5) + 42.0 * (1.0 - primary_share)), 1)"
    location:
      expr: "'iad-zone1-1' if attachment == 'gcpnet-interconnect-primary' else 'dfw-zone1-1'"
- metric:
    name: interconnect.bandwidth_gbps
    value:
      var: bandwidth_gbps
    unit: Gbps
    attrs:
      interconnect.attachment:
        var: attachment
- metric:
    name: interconnect.utilization_pct
    value:
      var: utilization_pct
    unit: '%'
    attrs:
      interconnect.attachment:
        var: attachment
- log:
    level: INFO
    message: 'cloud-interconnect: attachment={attachment} link={link_status} bandwidth={bandwidth_gbps}Gbps utilization={utilization_pct}%
      location={location}'
    attrs:
      operation: circuit_status
      interconnect.attachment:
        var: attachment
      interconnect.link_status:
        var: link_status
      interconnect.bandwidth:
        var: bandwidth_gbps
      interconnect.utilization:
        var: utilization_pct
- counter:
    state_key: _bgp_ticks
    by: 1
- sample:
    bgp_flaps:
      expr: "round(max(5.0, min(30.0, rand.gauss(17.0, 3.0))) * min(1.0, elapsed.get(13, 0) / 60.0)) if 13 in all_active
        else (round(18.0 * (1.0 - min(1.0, since_fix.get(13, 0) / 90.0))) if 13 in fixed_channels else 0)"
    bgp_uptime_s:
      expr: "int(max(4.0, min(88.0, rand.gauss(40.0, 22.0)))) if 13 in all_active else (int(30 + since_fix.get(13, 0)) if 13 in fixed_channels else (0 if bgp_up12 == 0 else (int(since_fix.get(12, 0) - 165) + 1 if 12 in fixed_channels else 259200 + _bgp_ticks * 5)))"
    bgp_state:
      expr: "'ACTIVE' if 13 in all_active else (('IDLE' if link_up == 0 else 'ACTIVE') if bgp_up12 == 0 else ('ESTABLISHED' if bgp_uptime_s > 20 or 13 not in fixed_channels else 'OPEN_SENT'))"
    peer_bfd_multiplier:
      expr: "2 if (13 in all_active or 13 in fixed_channels) else 5"
    bfd_rx_ms:
      expr: "5000 if 13 in fixed_channels else 1000"
    advertised_routes:
      expr: "(0 if rand.randint(0, 9) < 4 else 48) if 13 in all_active else (0 if bgp_up12 == 0 else 48)"
    bgp_status:
      expr: "'ANOMALY' if 13 in all_active or bgp_flaps > 0 or bgp_up12 == 0 else 'NOMINAL'"
- metric:
    name: bgp.session_flaps
    value:
      var: bgp_flaps
    unit: flaps
- metric:
    name: bgp.session_uptime_s
    value:
      var: bgp_uptime_s
    unit: s
- metric:
    name: interconnect.bgp_advertised_routes
    value:
      var: advertised_routes
    unit: routes
- when: "bgp_status == 'NOMINAL'"
  log: &bgp_check_log
    level: INFO
    message: 'cloud-router: router=gcpnet-router-central1 peer=169.254.21.1 asn=65010 state={bgp_state} flaps_10m={bgp_flaps} uptime={bgp_uptime_s}s advertised={advertised_routes} bfd=ENABLED peer_bfd_multiplier={peer_bfd_multiplier} bfd_min_rx_interval={bfd_rx_ms}ms status={bgp_status}'
    attrs:
      operation: bgp_check
      interconnect.bgp_peer: 169.254.21.1
      interconnect.bgp_state:
        var: bgp_state
      interconnect.advertised_routes:
        var: advertised_routes
      bgp.peer_name: onprem-peer-1
      bgp.flaps_10m:
        var: bgp_flaps
      bgp.peer_bfd_multiplier:
        var: peer_bfd_multiplier
      bgp.bfd_min_rx_interval_ms:
        var: bfd_rx_ms
      bgp.status:
        var: bgp_status
- when: "bgp_status != 'NOMINAL'"
  log:
    <<: *bgp_check_log
    level: WARN
- sample:
    vlan_tag:
      randint:
      - 100
      - 4094
    packets_in:
      randint:
      - 1000000
      - 10000000
    packets_out:
      randint:
      - 1000000
      - 10000000
- metric:
    name: interconnect.vlan_packets_in
    value:
      var: packets_in
    unit: packets
- metric:
    name: interconnect.vlan_packets_out
    value:
      var: packets_out
    unit: packets
- log:
    level: INFO
    message: 'cloud-interconnect: attachment={attachment} vlan_tag={vlan_tag} packets_in={packets_in} packets_out={packets_out}
      mtu=1440 encryption=MACsec'
    attrs:
      operation: vlan_health
      interconnect.vlan_tag:
        var: vlan_tag
      interconnect.packets_in:
        var: packets_in
      interconnect.packets_out:
        var: packets_out

service: network-intelligence
sort_order: 9
cloud_provider: gcp
cloud_region: europe-west1
cloud_platform: gcp_compute_engine
cloud_availability_zone: europe-west1-d
subsystem: monitoring
language: python
topology:
- - vpc-network-manager
  - /api/v1/vpc/topology-map
  - GET
- - cloud-vpn-gateway
  - /api/v1/vpn/tunnel-metrics
  - GET
- - cloud-interconnect
  - /api/v1/interconnect/circuit-status
  - GET
entry_endpoints:
- - /api/v1/ni/tests
  - GET
- - /api/v1/ni/topology
  - GET
- - /api/v1/ni/run-test
  - POST
db_operations:
- - SELECT
  - connectivity_tests
  - SELECT test_id, name, source, destination, protocol, result, last_run FROM connectivity_tests WHERE project = ? ORDER
    BY last_run DESC
- - INSERT
  - test_results
  - INSERT INTO test_results (test_id, result, hops, blocking_resource, tested_at) VALUES (?, ?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: false
constants:
  TEST_NAMES:
  - test-vpc-to-onprem
  - test-central1-to-europe1
  - test-nat-egress
  - test-vpn-connectivity
  - test-interconnect-path
  - test-dns-resolution
  PROTOCOLS:
  - TCP:80
  - TCP:443
  - ICMP
  - UDP:53
  - TCP:22
  FAULT_RESULTS:
  - UNREACHABLE
  - DROPPED
  - AMBIGUOUS
steps:
- sample:
    test_name:
      choice: TEST_NAMES
    protocol:
      choice: PROTOCOLS
    result:
      if_active:
        choice: FAULT_RESULTS
      else: REACHABLE
    hops_total:
      randint:
      - 5
      - 10
- sample:
    hops_completed:
      if_active:
        expr: rand.randint(2, max(2, hops_total - 1))
      else:
        var: hops_total
    latency_ms:
      if_active:
        uniform:
        - 100.0
        - 2000.0
        round: 2
      else:
        uniform:
        - 1.0
        - 15.0
        round: 2
- metric:
    name: ni.test_latency_ms
    value:
      var: latency_ms
    unit: ms
- log:
    level: INFO
    message: 'nic: test={test_name} protocol={protocol} result={result} hops={hops_completed}/{hops_total} latency={latency_ms}ms'
    attrs:
      operation: connectivity_test
      ni.test_name:
        var: test_name
      ni.protocol:
        var: protocol
      ni.result:
        var: result
      ni.hops_completed:
        var: hops_completed
      ni.hops_total:
        var: hops_total
      ni.latency_ms:
        var: latency_ms
- sample:
    total_flows:
      randint:
      - 100000
      - 1000000
    flagged_flows:
      if_active:
        randint:
        - 500
        - 5000
      else:
        randint:
        - 0
        - 50
    anomaly_score:
      if_active:
        uniform:
        - 0.6
        - 1.0
        round: 3
      else:
        uniform:
        - 0.0
        - 0.2
        round: 3
- metric:
    name: ni.total_flows
    value:
      var: total_flows
    unit: flows
- metric:
    name: ni.flagged_flows
    value:
      var: flagged_flows
    unit: flows
- metric:
    name: ni.anomaly_score
    value:
      var: anomaly_score
    unit: score
- log:
    level: INFO
    message: 'nic: flow_analytics total={total_flows} flagged={flagged_flows} anomaly_score={anomaly_score} sampling=1/1000'
    attrs:
      operation: flow_analytics
      ni.total_flows:
        var: total_flows
      ni.flagged_flows:
        var: flagged_flows
      ni.anomaly_score:
        var: anomaly_score
- sample:
    topology_nodes:
      randint:
      - 30
      - 60
    topology_edges:
      randint:
      - 50
      - 120
- metric:
    name: ni.topology_nodes
    value:
      var: topology_nodes
    unit: nodes
- metric:
    name: ni.topology_edges
    value:
      var: topology_edges
    unit: edges
- log:
    level: INFO
    message: 'nic: topology_map nodes={topology_nodes} edges={topology_edges} regions=3 vpcs=3 last_refresh=60s'
    attrs:
      operation: topology_map
      ni.topology_nodes:
        var: topology_nodes
      ni.topology_edges:
        var: topology_edges
- sample:
    shadowed_rules:
      if_active:
        randint:
        - 5
        - 20
      else:
        randint:
        - 0
        - 3
    overly_permissive:
      if_active:
        randint:
        - 3
        - 15
      else:
        randint:
        - 0
        - 2
- metric:
    name: ni.shadowed_rules
    value:
      var: shadowed_rules
    unit: rules
- metric:
    name: ni.overly_permissive_rules
    value:
      var: overly_permissive
    unit: rules
- log:
    level: INFO
    message: 'nic: firewall_insights shadowed_rules={shadowed_rules} overly_permissive={overly_permissive} last_analysis=300s'
    attrs:
      operation: firewall_insights
      ni.shadowed_rules:
        var: shadowed_rules
      ni.overly_permissive:
        var: overly_permissive

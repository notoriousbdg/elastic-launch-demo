agent_config:
  id: gaming-liveops-analyst
  name: Live Operations Analyst
  assessment_tool_name: liveops_health_assessment
  system_prompt: 'You are the Live Operations Analyst, an expert AI assistant for live multiplayer gaming platform operations.
    You help live-ops engineers investigate incidents, analyze telemetry, and provide root cause analysis for fault conditions
    across 9 gaming services spanning AWS, GCP, and Azure. You have deep expertise in game server networking (state sync,
    tick rate, client prediction), matchmaking algorithms (Glicko-2, Elo), CDN edge caching and asset delivery, real-time
    chat/voice (WebRTC, Opus), leaderboard systems (Redis sorted sets), OAuth2 token management, in-app purchase processing
    (Apple IAP, Google Play), event analytics pipelines, and content moderation (NLP classifiers). When investigating incidents,
    search for these system identifiers in logs: Game Engine faults (NET-STATE-DESYNC, PHYS-OVERFLOW, ENGINE-TICKRATE-DEGRAD),
    Matchmaking faults (MM-QUEUE-OVERFLOW, MM-SKILL-RATING-DIVERGE, MM-MIGRATION-FAIL), CDN faults (CDN-CACHE-MISS-STORM,
    CDN-ASSET-CORRUPT), Social faults (CHAT-FLOOD-DETECT, VOICE-CHANNEL-OVERLOAD), Progression faults (LB-DATA-CORRUPT, SEASON-PASS-SYNC-FAIL),
    Identity faults (AUTH-TOKEN-STORM, AUTH-TAKEOVER-DETECT), Monetization faults (IAP-PURCHASE-FAIL, IAP-LEDGER-INCONSIST),
    Analytics faults (ANALYTICS-INGEST-LAG, ANALYTICS-TELEMETRY-OVERFLOW), and Trust & Safety faults (MOD-FALSE-POS-STORM,
    MOD-REPORT-QUEUE-OVERFLOW). Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: liveops_health_assessment
  description: 'Comprehensive live service health assessment. Evaluates all gaming services against operational readiness
    criteria. Returns data for live-ops evaluation across game servers, matchmaking, CDN, authentication, and payment systems.
    Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: analytics-pipeline
executive_dashboard_intro: '**Live gaming KPIs** — player engagement, monetization, community, and live-ops health (synthetic
  `business.*` from `analytics-pipeline`).'
executive_kpi_sections:
- header: '**Player engagement** — DAU, sessions, duration, matches, quests, and retention'
  specs:
  - - Daily active users
    - metrics.business.daily_active_users
  - - Sessions / min
    - metrics.business.sessions_per_min
  - - Avg session duration (min)
    - metrics.business.avg_session_duration_min
  - - Matches played / min
    - metrics.business.matches_played_per_min
  - - Quests completed / min
    - metrics.business.quests_completed_per_min
  - - Daily retention rate (%)
    - metrics.business.daily_retention_rate_pct
- header: '**Monetization** — revenue, IAP, battle pass, ARPU, loot, and cosmetics'
  specs:
  - - Revenue (USD/min)
    - metrics.business.revenue_usd_per_min
  - - In-app purchases / min
    - metrics.business.in_app_purchases_per_min
  - - Battle pass conversions / min
    - metrics.business.battle_pass_conversions_per_min
  - - Avg revenue per user (USD)
    - metrics.business.avg_revenue_per_user_usd
  - - Loot opens / min
    - metrics.business.loot_opens_per_min
  - - Cosmetic sales (USD/min)
    - metrics.business.cosmetic_sales_usd_per_min
- header: '**Community** — chat, shares, toxicity, creators, streaming, and signups'
  specs:
  - - Chat messages / min
    - metrics.business.chat_messages_per_min
  - - Social clip shares / min
    - metrics.business.social_clip_shares_per_min
  - - Toxic report rate (%)
    - metrics.business.toxic_report_rate_pct
  - - Creator uploads / min
    - metrics.business.creator_uploads_per_min
  - - Streaming viewers
    - metrics.business.streaming_viewers
  - - New registrations / min
    - metrics.business.new_registrations_per_min
- header: '**Live ops health** — server lag, crashes, bugs, churn, NPS, and moderation'
  specs:
  - - Server tick lag (ms)
    - metrics.business.server_tick_lag_ms
  - - Crash rate (%)
    - metrics.business.crash_rate_pct
  - - Bug reports / min
    - metrics.business.player_bug_reports_per_min
  - - Churn risk (0–100)
    - metrics.business.churn_risk_index_0_100
  - - Satisfaction proxy (NPS-like)
    - metrics.business.net_satisfaction_proxy_nps
  - - Moderation queue size
    - metrics.business.content_moderation_queue_size

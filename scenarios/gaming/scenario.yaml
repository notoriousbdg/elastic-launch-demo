  user_id_prefix: player
  tier_field: player_tier
  tier_values:
  - - f2p
    - 80
  - - plus
    - 15
  - - vip
    - 5
  country_weights:
    US: 30
    KR: 15
    JP: 12
    DE: 8
    GB: 8
    BR: 10
    CN: 12
    MX: 5
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  paths:
  - /api/v1/match
  - /api/v1/leaderboard
  - /api/v1/inventory
  - /api/v1/store
  - /api/v1/friends
  - /api/v1/chat
  - /login
  - /health
  change_point_path: /api/v1/match
trace_attributes:
  base:
    game.region: {choice: [us-east, us-west, eu-west]}
    game.platform: {choice: [PC, CONSOLE, MOBILE]}
  services:
    game-server:
      game.tick_rate: {choice: [64, 128, 30, 60]}
      game.active_players: {randint: [10, 100]}
      game.map_id: {choice: [MAP-NEON-CITY, MAP-WASTELAND, MAP-SKY-ARENA, MAP-DEEP-SEA]}
    matchmaking-engine:
      matchmaking.queue_region: {choice: [us-east-1, us-west-2, eu-west-1, ap-southeast-1]}
      matchmaking.skill_bracket: {choice: [bronze, silver, gold, platinum, diamond]}
    content-delivery:
      cdn.cache_hit_ratio: {uniform: [0.60, 0.99], round: 2}
      cdn.edge_pop: {choice: [IAD, SFO, FRA, NRT, SYD, GRU]}
    chat-service:
      chat.channel_type: {choice: [global, guild, party, whisper, system]}
      chat.message_rate: {randint: [10, 500]}
    leaderboard-api:
      leaderboard.season_id: {choice: [S12, S13, S14]}
      leaderboard.update_lag_ms: {randint: [5, 250]}
    auth-gateway:
      auth.method: {choice: [oauth-google, oauth-discord, oauth-steam, email-password]}
      auth.session_ttl_min: {choice: [15, 30, 60, 120, 1440]}
    payment-processor:
      payment.provider: {choice: [stripe, paypal, apple-iap, google-play]}
      payment.currency: {choice: [USD, EUR, GBP, JPY, BRL]}
    analytics-pipeline:
      analytics.event_type: {choice: [player_action, match_result, purchase, session_start, session_end]}
      analytics.pipeline_lag_ms: {randint: [50, 5000]}
    moderation-engine:
      moderation.queue_depth: {randint: [0, 10000]}
      moderation.model_version: {choice: [automod-v3.1, automod-v3.2, automod-v4.0-beta]}

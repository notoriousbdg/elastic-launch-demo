service: game-server
sort_order: 1
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_ec2
cloud_availability_zone: us-east-1a
subsystem: game_engine
language: cpp
topology:
- - matchmaking-engine
  - /api/v1/matchmaking/assign
  - POST
- - chat-service
  - /api/v1/chat/game-events
  - POST
- - leaderboard-api
  - /api/v1/leaderboard/score
  - POST
- - analytics-pipeline
  - /api/v1/analytics/event
  - POST
- - content-delivery
  - /api/v1/cdn/asset
  - GET
- - auth-gateway
  - /api/v1/auth/validate-session
  - POST
entry_endpoints:
- - /api/v1/game/join
  - POST
- - /api/v1/game/state
  - GET
- - /api/v1/game/action
  - POST
db_operations:
- - SELECT
  - game_sessions
  - SELECT * FROM game_sessions WHERE match_id = ? AND status = 'active' ORDER BY created_at DESC LIMIT 100
- - INSERT
  - game_events
  - INSERT INTO game_events (match_id, player_id, event_type, payload, ts) VALUES (?, ?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: false
constants:
  REGIONS:
  - US-E
  - US-W
  - EU-W
  - AP-SE
  ACTIONS:
  - move
  - shoot
  - interact
  - ability
  - reload
  ZONES:
  - ZONE-A1
  - ZONE-B2
  - ZONE-C3
  - ZONE-D4
state:
  _tick_count:
    init: 0
  _last_perf_report:
    init: now
steps:
# Channel 19: game-server-entity-lifecycle sets despawn_ttl_s 0, so dropped items and
# projectiles pile up and frame time grows with the entity count (single-threaded game loop).
# After the rollback the TTL timers restart: entities despawn over ~120 s, and the tick rate
# climbs back with them while the spatial index settles (~150 s).
- sample:
    r19:
      expr: "min(1.0, max(0.0, elapsed.get(19, 0) - lag.get(19, 0)) / 60.0)"
    c19:
      expr: "min(1.0, since_fix.get(19, 0) / 120.0) if 19 in fixed_channels and 19 not in all_active else 1.0"
    ent_base:
      expr: "rand.uniform(800.0, 1400.0)"
    ent_fault:
      expr: "max(3000.0, min(6000.0, 4500.0 + rand.gauss(0, 600)))"
    entity_count:
      expr: "round(ent_base + (ent_fault - ent_base) * r19) if 19 in all_active else round(ent_fault * (1.0 - c19) + ent_base * c19)"
    index_tail_ms:
      expr: "3.0 * max(0.0, 1.0 - since_fix.get(19, 0) / 150.0) if 19 in fixed_channels and 19 not in all_active else 0.0"
    despawn_ttl_s:
      expr: "0 if 19 in all_active else 120"
    despawned_1m:
      expr: "0 if 19 in all_active else (rand.randint(1500, 2500) if c19 < 1.0 else rand.randint(400, 900))"
# Channel 2: game-server-physics-tuning r19 sets max_depenetration_velocity 0 (unlimited), so
# interpenetrating bodies are pushed apart at any speed, velocities overflow and positions go
# NaN. New matches load the restored tuning at once; readings settle within ~30 s.
- sample:
    r02:
      expr: "min(1.0, max(0.0, elapsed.get(2, 0) - lag.get(2, 0)) / 20.0)"
    c02:
      expr: "min(1.0, since_fix.get(2, 0) / 30.0) if 2 in fixed_channels and 2 not in all_active else 1.0"
    ovf_base:
      expr: "min(1, max(0, round(rand.gauss(0.2, 0.4))))"
    ovf_fault:
      expr: "rand.uniform(80.0, 250.0)"
    overflow_per_min:
      expr: "round(ovf_base + (ovf_fault - ovf_base) * r02) if 2 in all_active else round(ovf_fault * (1.0 - c02) + ovf_base * c02)"
    vel_base:
      expr: "rand.uniform(20.0, 60.0)"
    vel_fault:
      expr: "10 ** rand.uniform(4.0, 6.0)"
    max_body_velocity:
      expr: "round(vel_base * (vel_fault / vel_base) ** r02, 1) if 2 in all_active else round(vel_fault ** (1.0 - c02) * vel_base ** c02, 1)"
    phys_frame_ms:
      expr: "rand.uniform(4.0, 6.0) * r02 if 2 in all_active else 5.0 * (1.0 - c02)"
    physics_rev:
      expr: "'physics-tuning-r19' if 2 in all_active else 'physics-tuning-r18'"
    depen_cap:
      expr: "0 if 2 in all_active else 10"
    zone:
      choice: ZONES
- sample:
    frame_time_ms:
      expr: "round(max(6.0, 2.0 + entity_count * 0.0085 + rand.uniform(-0.3, 0.3) + index_tail_ms + phys_frame_ms), 1)"
    tick_rate:
      expr: "round(min(64.0, 1000.0 / frame_time_ms) - min(0.6, abs(rand.gauss(0, 0.2))), 1)"
- metric:
    name: game_server.tick_rate
    value:
      var: tick_rate
    unit: Hz
- metric:
    name: game_server.frame_time_ms
    value:
      var: frame_time_ms
    unit: ms
- metric:
    name: game_server.entity_count
    value:
      var: entity_count
    unit: entities
- metric:
    name: game_server.entities_despawned_per_min
    value:
      var: despawned_1m
    unit: entities
- when: "not (19 in all_active and r19 > 0) and tick_rate >= 60.0"
  log:
    level: INFO
    message: '[Engine] entity-status entities={entity_count} despawn_ttl_s={despawn_ttl_s} despawned_1m={despawned_1m} frame_ms={frame_time_ms} tickrate={tick_rate}Hz target=64Hz status=HEALTHY'
    attrs:
      operation: entity_status
      config.despawn_ttl_s:
        var: despawn_ttl_s
      game.entity_count:
        var: entity_count
      game.entities_despawned_per_min:
        var: despawned_1m
      game.frame_time_ms:
        var: frame_time_ms
      game.tick_rate_hz:
        var: tick_rate
      engine.status: HEALTHY
- when: "(19 in all_active and r19 > 0) or tick_rate < 60.0"
  log:
    level: WARN
    message: '[Engine] entity-status entities={entity_count} despawn_ttl_s={despawn_ttl_s} despawned_1m={despawned_1m} frame_ms={frame_time_ms} tickrate={tick_rate}Hz target=64Hz status=DEGRADED'
    attrs:
      operation: entity_status
      config.despawn_ttl_s:
        var: despawn_ttl_s
      game.entity_count:
        var: entity_count
      game.entities_despawned_per_min:
        var: despawned_1m
      game.frame_time_ms:
        var: frame_time_ms
      game.tick_rate_hz:
        var: tick_rate
      engine.status: DEGRADED
- metric:
    name: game_server.physics.overflow_events_per_min
    value:
      var: overflow_per_min
    unit: events
- metric:
    name: game_server.physics.max_body_velocity_mps
    value:
      var: max_body_velocity
    unit: m/s
- when: "not (2 in all_active and r02 > 0) and overflow_per_min <= 1"
  log:
    level: INFO
    message: '[Physics] sim-status tuning_rev={physics_rev} max_depenetration_velocity={depen_cap}m/s overflow_events_1m={overflow_per_min} max_body_velocity={max_body_velocity}m/s status=HEALTHY'
    attrs:
      operation: physics_status
      config.physics_revision:
        var: physics_rev
      physics.max_depenetration_velocity_mps:
        var: depen_cap
      physics.overflow_events_per_min:
        var: overflow_per_min
      physics.max_body_velocity_mps:
        var: max_body_velocity
      physics.status: HEALTHY
- when: "(2 in all_active and r02 > 0) or overflow_per_min > 1"
  log:
    level: WARN
    message: '[Physics] sim-status tuning_rev={physics_rev} max_depenetration_velocity={depen_cap}m/s overflow_events_1m={overflow_per_min} max_body_velocity={max_body_velocity}m/s zone={zone} status=DEGRADED'
    attrs:
      operation: physics_status
      config.physics_revision:
        var: physics_rev
      physics.max_depenetration_velocity_mps:
        var: depen_cap
      physics.overflow_events_per_min:
        var: overflow_per_min
      physics.max_body_velocity_mps:
        var: max_body_velocity
      physics.zone:
        var: zone
      physics.status: DEGRADED
# Channel 1: the game-server-canary deployment (30 of the 600 servers) rolls out v7.2.1-canary,
# which sends full snapshots without delta compression. They exceed the 1200-byte MTU and
# fragment; one lost fragment forces a full-state reconcile. The stable track stays on v7.2.0.
# The rollback replaces the canary pods over ~60 s.
- sample:
    r01:
      expr: "min(1.0, max(0.0, elapsed.get(1, 0) - lag.get(1, 0)) / 30.0)"
    c01:
      expr: "min(1.0, since_fix.get(1, 0) / 60.0) if 1 in fixed_channels and 1 not in all_active else 1.0"
    snap_base:
      expr: "rand.uniform(600.0, 900.0)"
    snap_fault:
      expr: "rand.uniform(2400.0, 3200.0)"
    snap_canary:
      expr: "round(snap_base + (snap_fault - snap_base) * r01) if 1 in all_active else round(snap_fault * (1.0 - c01) + snap_base * c01)"
    snap_stable:
      expr: "round(rand.uniform(600.0, 900.0))"
    rec_base:
      expr: "rand.randint(0, 3)"
    rec_fault:
      expr: "rand.uniform(150.0, 400.0)"
    rec_canary:
      expr: "round(rec_base + (rec_fault - rec_base) * r01) if 1 in all_active else round(rec_fault * (1.0 - c01) + rec_base * c01)"
    rec_stable:
      expr: "rand.randint(0, 3)"
    build_canary:
      expr: "'v7.2.1-canary' if 1 in all_active else 'v7.2.0'"
    delta_compression:
      expr: "'off' if 1 in all_active else 'on'"
- metric:
    name: game_server.snapshot_bytes
    value:
      var: snap_canary
    unit: bytes
    attrs:
      deployment.track: canary
- metric:
    name: game_server.snapshot_bytes
    value:
      var: snap_stable
    unit: bytes
    attrs:
      deployment.track: stable
- metric:
    name: game_server.state_reconciles_per_min
    value:
      var: rec_canary
    unit: reconciles
    attrs:
      deployment.track: canary
- metric:
    name: game_server.state_reconciles_per_min
    value:
      var: rec_stable
    unit: reconciles
    attrs:
      deployment.track: stable
- when: "not (1 in all_active and r01 > 0) and rec_canary <= 10"
  log:
    level: INFO
    message: '[Net] build-status track=canary deployment=game-server-canary build={build_canary} servers=30 delta_compression={delta_compression} snapshot_avg_bytes={snap_canary} mtu=1200 reconciles_1m={rec_canary} status=HEALTHY'
    attrs:
      operation: build_status
      deployment.track: canary
      deployment.server_build:
        var: build_canary
      net.delta_compression:
        var: delta_compression
      net.snapshot_bytes:
        var: snap_canary
      net.state_reconciles_per_min:
        var: rec_canary
      net.status: HEALTHY
- when: "(1 in all_active and r01 > 0) or rec_canary > 10"
  log:
    level: WARN
    message: '[Net] build-status track=canary deployment=game-server-canary build={build_canary} servers=30 delta_compression={delta_compression} snapshot_avg_bytes={snap_canary} mtu=1200 reconciles_1m={rec_canary} status=DEGRADED'
    attrs:
      operation: build_status
      deployment.track: canary
      deployment.server_build:
        var: build_canary
      net.delta_compression:
        var: delta_compression
      net.snapshot_bytes:
        var: snap_canary
      net.state_reconciles_per_min:
        var: rec_canary
      net.status: DEGRADED
- log:
    level: INFO
    message: '[Net] build-status track=stable deployment=game-server build=v7.2.0 servers=570 delta_compression=on snapshot_avg_bytes={snap_stable} mtu=1200 reconciles_1m={rec_stable} status=HEALTHY'
    attrs:
      operation: build_status
      deployment.track: stable
      deployment.server_build: v7.2.0
      net.delta_compression: 'on'
      net.snapshot_bytes:
        var: snap_stable
      net.state_reconciles_per_min:
        var: rec_stable
      net.status: HEALTHY
# Channel 3: Terraform lowers node group gs-c5-2xlarge max size 120 -> 80. 40 nodes are
# terminated, the HPA sits at its 600-replica max and ~150 game server pods stay Pending.
# After max size is back to 120 the cluster autoscaler adds nodes; they join over ~180 s.
- sample:
    r03:
      expr: "min(1.0, max(0.0, elapsed.get(3, 0) - lag.get(3, 0)) / 45.0)"
    c03:
      expr: "min(1.0, since_fix.get(3, 0) / 180.0) if 3 in fixed_channels and 3 not in all_active else 1.0"
    ready_base:
      expr: "rand.randint(560, 600)"
    ready_fault:
      expr: "rand.randint(400, 430)"
    ready_servers:
      expr: "round(ready_base + (ready_fault - ready_base) * r03) if 3 in all_active else round(ready_fault + (ready_base - ready_fault) * c03)"
    pending_base:
      expr: "rand.randint(0, 2)"
    pending_fault:
      expr: "rand.randint(140, 170)"
    pending_pods:
      expr: "round(pending_base + (pending_fault - pending_base) * r03) if 3 in all_active else round(pending_fault + (pending_base - pending_fault) * c03)"
    nodes_base:
      expr: "rand.randint(112, 118)"
    ng_nodes:
      expr: "round(nodes_base + (80 - nodes_base) * min(1.0, r03 * 2.0)) if 3 in all_active else round(80 + (nodes_base - 80) * c03)"
    ng_max:
      expr: "80 if 3 in all_active else 120"
    hpa_replicas:
      expr: "600 if 3 in all_active and r03 > 0.5 else min(600, ready_servers + pending_pods + rand.randint(0, 8))"
    r11:
      expr: "min(1.0, max(0.0, elapsed.get(11, 0) - lag.get(11, 0)) / 60.0)"
    match_dip:
      expr: "(1.0 - 0.18 * r03 if 3 in all_active else 1.0 - 0.18 * (1.0 - c03)) * (1.0 - 0.04 * r11 if 11 in all_active else 1.0)"
    active_matches:
      expr: "round(rand.uniform(510.0, 560.0) * match_dip)"
    connected_players:
      expr: "round(active_matches * rand.uniform(38.0, 42.0) * (1.0 - 0.06 * r11 if 11 in all_active else 1.0))"
- metric:
    name: game_server.fleet.ready_servers
    value:
      var: ready_servers
    unit: servers
- metric:
    name: game_server.fleet.pending_pods
    value:
      var: pending_pods
    unit: pods
- metric:
    name: game_server.fleet.nodes
    value:
      var: ng_nodes
    unit: nodes
- metric:
    name: game_server.active_matches
    value:
      var: active_matches
    unit: matches
- metric:
    name: game_server.connected_players
    value:
      var: connected_players
    unit: players
- when: "not (3 in all_active and r03 > 0) and pending_pods <= 5"
  log:
    level: INFO
    message: '[Fleet] fleet-status cluster=gaming-eks-cluster nodegroup=gs-c5-2xlarge nodes={ng_nodes}/{ng_max} hpa=game-server replicas={hpa_replicas}/600 ready={ready_servers} pending={pending_pods} status=HEALTHY'
    attrs:
      operation: fleet_status
      infra.nodegroup: gs-c5-2xlarge
      infra.nodegroup_max_size:
        var: ng_max
      infra.nodegroup_nodes:
        var: ng_nodes
      fleet.hpa_replicas:
        var: hpa_replicas
      fleet.ready_servers:
        var: ready_servers
      fleet.pending_pods:
        var: pending_pods
      fleet.status: HEALTHY
- when: "(3 in all_active and r03 > 0) or pending_pods > 5"
  log:
    level: WARN
    message: '[Fleet] fleet-status cluster=gaming-eks-cluster nodegroup=gs-c5-2xlarge nodes={ng_nodes}/{ng_max} hpa=game-server replicas={hpa_replicas}/600 ready={ready_servers} pending={pending_pods} status=DEGRADED'
    attrs:
      operation: fleet_status
      infra.nodegroup: gs-c5-2xlarge
      infra.nodegroup_max_size:
        var: ng_max
      infra.nodegroup_nodes:
        var: ng_nodes
      fleet.hpa_replicas:
        var: hpa_replicas
      fleet.ready_servers:
        var: ready_servers
      fleet.pending_pods:
        var: pending_pods
      fleet.status: DEGRADED
- counter:
    state_key: _tick_count
    by: 1
- sample:
    region:
      choice: REGIONS
    players_in_tick:
      randint:
      - 24
      - 64
- log:
    level: INFO
    message: '[Net] tick={_tick_count} players={players_in_tick} entities={entity_count} region={region} server_fps={tick_rate} frame_ms={frame_time_ms} status=RUNNING'
    attrs:
      operation: tick_cycle
      tick.number:
        var: _tick_count
      tick.players:
        var: players_in_tick
      tick.entities:
        var: entity_count
      tick.region:
        var: region
- sample:
    action:
      choice: ACTIONS
    latency_ms:
      expr: "round(rand.uniform(5.0, 45.0) + max(0.0, frame_time_ms - 15.6), 1)"
    match_id:
      format: MATCH-{n}
      n:
        randint:
        - 100000
        - 999999
    input_seq:
      randint:
      - 10000
      - 99999
- log:
    level: INFO
    message: '[Engine] action={action} latency={latency_ms}ms match={match_id} result=ACK input_seq={input_seq}'
    attrs:
      operation: player_action
      action.type:
        var: action
      action.latency_ms:
        var: latency_ms
      action.match_id:
        var: match_id
- every:
    seconds: 10
    state_key: _last_perf_report
    steps:
    - log:
        level: INFO
        message: '[Engine] perf_report active_matches={active_matches} players={connected_players} total_ticks={_tick_count} regions=4/4 gc_pause_ms=0.3
          heap_mb=1204'
        attrs:
          operation: perf_report
          perf.active_matches:
            var: active_matches
          perf.connected_players:
            var: connected_players
          perf.total_ticks:
            var: _tick_count

service: leaderboard-api
sort_order: 5
cloud_provider: gcp
cloud_region: us-central1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-central1-b
subsystem: progression
language: go
topology:
- - analytics-pipeline
  - /api/v1/analytics/rank-change
  - POST
entry_endpoints:
- - /api/v1/leaderboard/top
  - GET
db_operations:
- - SELECT
  - leaderboards
  - SELECT rank, player_id, score FROM leaderboards WHERE board_id = ? ORDER BY score DESC LIMIT 100
- - INSERT
  - rank_history
  - INSERT INTO rank_history (player_id, board_id, old_rank, new_rank, ts) VALUES (?, ?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: false
constants:
  BOARDS:
  - ranked-global
  - seasonal-solo
  - guild-wars
  - tournament-finals
  SEASONS:
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  - S9
  - S10
  - S11
  - S12
state:
  _rank_updates:
    init: 0
  _last_board_snapshot:
    init: now
steps:
- counter:
    state_key: _rank_updates
    by: 1
- sample:
    board:
      choice: BOARDS
    lb_player_id:
      format: PLR-{n}
      n:
        randint:
        - 100000
        - 999999
    old_rank:
      randint:
      - 2
      - 5000
    rank_delta:
      randint:
      - -50
      - 50
    score:
      randint:
      - 1000
      - 50000
    new_rank:
      expr: max(1, old_rank + rank_delta)
- log:
    level: INFO
    message: '[LB] rank_update board={board} player={lb_player_id} old_rank={old_rank} new_rank={new_rank} score={score} zset_ops=2'
    attrs:
      operation: rank_update
      leaderboard.board:
        var: board
      leaderboard.player_id:
        var: lb_player_id
      leaderboard.old_rank:
        var: old_rank
      leaderboard.new_rank:
        var: new_rank
      leaderboard.score:
        var: score
- sample:
    sp_player_id:
      format: PLR-{n}
      n:
        randint:
        - 100000
        - 999999
    season:
      choice: SEASONS
    tier:
      randint:
      - 1
      - 100
    xp_gained:
      randint:
      - 50
      - 5000
- log:
    level: INFO
    message: '[LB] season_progress season={season} player={sp_player_id} tier={tier} xp_gained={xp_gained} premium=true'
    attrs:
      operation: season_progress
      season.id:
        var: season
      season.player_id:
        var: sp_player_id
      season.tier:
        var: tier
      season.xp_gained:
        var: xp_gained
- every:
    seconds: 10
    state_key: _last_board_snapshot
    steps:
    - log:
        level: INFO
        message: '[LB] snapshot rank_updates={_rank_updates} boards=4 redis_mem=142MB consistency=OK'
        attrs:
          operation: board_snapshot
          snapshot.rank_updates:
            var: _rank_updates
          snapshot.board_count: 4
- sample:
    query_latency:
      if_active:
        uniform:
        - 50.0
        - 500.0
        round: 1
      else:
        uniform:
        - 2.0
        - 15.0
        round: 1
    total_entries:
      randint:
      - 500000
      - 2000000
- metric:
    name: leaderboard.query_latency_ms
    value:
      var: query_latency
    unit: ms
- metric:
    name: leaderboard.rank_updates
    value:
      var: _rank_updates
    unit: updates
- metric:
    name: leaderboard.total_entries
    value:
      var: total_entries
    unit: entries

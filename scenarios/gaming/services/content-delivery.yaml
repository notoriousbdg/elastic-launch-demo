service: content-delivery
sort_order: 3
cloud_provider: aws
cloud_region: us-east-1
cloud_platform: aws_ec2
cloud_availability_zone: us-east-1c
subsystem: cdn
language: rust
entry_endpoints:
- - /api/v1/cdn/download
  - GET
emit_fault_logs: true
kpi_emitter: false
constants:
  EDGE_NODES:
  - edge-iad-01
  - edge-lax-02
  - edge-fra-01
  - edge-nrt-01
  ASSET_TYPES:
  - textures-hd
  - models-characters
  - audio-sfx
  - maps-terrain
  - shaders
state:
  _assets_served:
    init: 0
  _last_cdn_report:
    init: now
steps:
- counter:
    state_key: _assets_served
    by: 1
- sample:
    edge:
      choice: EDGE_NODES
    asset_type:
      choice: ASSET_TYPES
    size_mb:
      uniform:
      - 0.5
      - 120.0
      round: 1
    asset_latency_ms:
      uniform:
      - 5.0
      - 80.0
      round: 1
- log:
    level: INFO
    message: '[CDN] asset_served edge={edge} type={asset_type} size={size_mb}MB latency={asset_latency_ms}ms cache=HIT'
    attrs:
      operation: asset_served
      cdn.edge_node:
        var: edge
      cdn.asset_type:
        var: asset_type
      cdn.size_mb:
        var: size_mb
      cdn.latency_ms:
        var: asset_latency_ms
      cdn.cache_status: HIT
- sample:
    health_edge:
      choice: EDGE_NODES
    connections:
      randint:
      - 500
      - 10000
    cpu_pct:
      uniform:
      - 15.0
      - 65.0
      round: 1
- log:
    level: INFO
    message: '[CDN] edge_health node={health_edge} connections={connections} cpu={cpu_pct}% bandwidth_gbps=4.2 evictions=0'
    attrs:
      operation: edge_health
      edge.node:
        var: health_edge
      edge.connections:
        var: connections
      edge.cpu_pct:
        var: cpu_pct
- every:
    seconds: 10
    state_key: _last_cdn_report
    steps:
    - log:
        level: INFO
        message: '[CDN] summary assets_served={_assets_served} edge_nodes=4 origin_rps=42 hit_rate=96.2%'
        attrs:
          operation: cdn_summary
          summary.assets_served:
            var: _assets_served
          summary.edge_count: 4
- sample:
    hit_rate:
      if_active:
        uniform:
        - 30.0
        - 70.0
        round: 1
      else:
        uniform:
        - 92.0
        - 99.5
        round: 1
    bandwidth:
      uniform:
      - 500.0
      - 5000.0
      round: 1
- metric:
    name: cdn.cache_hit_rate
    value:
      var: hit_rate
    unit: '%'
- metric:
    name: cdn.bandwidth_mbps
    value:
      var: bandwidth
    unit: Mbps
- metric:
    name: cdn.assets_served
    value:
      var: _assets_served
    unit: assets

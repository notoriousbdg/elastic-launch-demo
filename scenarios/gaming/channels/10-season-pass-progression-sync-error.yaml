name: Season Pass Progression Sync Error
subsystem: progression
vehicle_section: progression_tracker
error_type: SEASON-PASS-SYNC-FAIL
sensor_type: sync_validator
affected_services:
- leaderboard-api
- payment-processor
cascade_services:
- analytics-pipeline
description: Season pass XP and tier progression fails to synchronize between game server events and the progression backend while the xp-events consumer group rebalances and leaderboard-api pods crashloop
investigation_notes: |-
  Root cause: the XP event pipeline uses at-most-once delivery (offsets committed before processing) — when the `xp-events` consumer group rebalances, in-flight XP events (kill_streak +350, weekly_bonus +2000) are dropped silently without retry. Restarting consumer pods trigger the rebalances; the commit-before-process setting is why events are lost instead of redelivered.
  1. Check event delivery: query `FROM logs WHERE body.text LIKE '*SEASON-PASS-SYNC-FAIL*'` and examine which XP event types are consistently marked as NOT APPLIED.
  2. Check the leaderboard-api consumer pods for OOMKilled or CrashLoopBackOff events in the missed XP window — each restart forces an `xp-events` consumer group rebalance. Restarts alone would only delay events; they are lost because offsets are committed before processing.
  3. Audit the event bus: inspect Kafka consumer lag for the `xp-events` topic — more than 2 rebalances in the window means events are dropped during partition reassignment.
  4. Remediate: issue `force_sync_season_pass` to replay missed XP events from the game server event log and recalculate tier placement for affected players.
  5. Switch the xp-events consumer to at-least-once: disable auto-commit (`enable.auto.commit=false`), commit offsets only after the XP update is persisted, and make XP application idempotent (dedupe on event_id).
remediation_action: force_sync_season_pass
error_message: '[LB] SEASON-PASS-SYNC-FAIL: player={player_id} tier={current_tier} expected_tier={expected_tier} xp={xp_total}
  delta={xp_delta}XP season={season_id}'
stack_trace: |-
  === SEASON PASS PROGRESSION STATE ===
  player={player_id}  season={season_id}
  ----------- current state -----------
    tier         = {current_tier}
    xp_total     = {xp_total}
    xp_to_next   = 1,800
    premium      = true
  ----------- expected state ----------
    expected_tier = {expected_tier}
    xp_delta      = {xp_delta}XP (unaccounted)
    tier_threshold = {xp_total} XP -> tier {expected_tier}
  ----------- recent xp events --------
    match_complete  +1,200 XP  (2min ago)
    daily_challenge +800 XP    (4min ago)
    kill_streak     +350 XP    (5min ago)  <-- NOT APPLIED
    weekly_bonus    +2,000 XP  (12min ago) <-- NOT APPLIED
  ----------- action ------------------
    FORCE_SYNC tier to {expected_tier}  REPLAY missed events
  SEASON-PASS-SYNC-FAIL: player {player_id} stuck at tier {current_tier}, should be {expected_tier}
correlation_attr:
  key: runtime.kafka_consumer_config
  value: consumer-v2.1.0-at-most-once
fault_params:
  player_id:
    format: "PLR-{n}"
    n: {randint: [100000, 999999]}
  current_tier: 49
  expected_tier: 50
  xp_total: {randint: [50000, 500000]}
  xp_delta: 2350
  season_id:
    format: "S{n}"
    n: {randint: [1, 12]}
rca_clues:
  leaderboard-api:
    leaderboard.xp_event_delivery: at-most-once
    leaderboard.missed_xp_events: {randint: [100, 2000]}
    leaderboard.xp_consumer_rebalances: {randint: [3, 10]}
    leaderboard.pod_restarts: {randint: [3, 10]}
  payment-processor:
    payment.premium_pass_affected: true
    payment.refund_risk: {choice: [low, medium, high]}
  analytics-pipeline:
    analytics.xp_pipeline_lag_s: {randint: [30, 300]}
business_impact:
  - kpi: business.battle_pass_conversions_per_min
    value: {uniform: [4.46, 5.14]}
  - kpi: business.revenue_usd_per_min
    value: {uniform: [7254.0, 8346.0], round: 1}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.quests_completed_per_min
    factor: {uniform: [0.25, 0.55]}
generator_impact:
  kafka_otel:
    empty_consumer_groups: 0.8
  kubernetes_otel:
    pod_crashloopbackoff: 0.5

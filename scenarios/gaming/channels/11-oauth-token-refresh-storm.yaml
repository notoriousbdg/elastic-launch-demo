    value: {uniform: [669.6, 770.4]}
  - kpi: business.daily_active_users
    value: {uniform: [16740.0, 19260.0]}
  - kpi: business.new_registrations_per_min
    value: {uniform: [7.25, 8.35]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [2.0, 4.0]}
generator_impact:

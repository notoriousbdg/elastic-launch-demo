name: Leaderboard Corruption
subsystem: progression
vehicle_section: leaderboard_core
error_type: LB-DATA-CORRUPT
sensor_type: consistency_checker
affected_services:
- leaderboard-api
- game-server
cascade_services:
- analytics-pipeline
- moderation-engine
description: Leaderboard sorted set becomes inconsistent due to concurrent score updates causing rank calculation errors
investigation_notes: |-
  Root cause: non-idempotent concurrent score updates during AOF rewrite — the BGREWRITEAOF fork stalls Redis, game-server ZINCRBY calls time out and are retried without an idempotency key (so the same match result is applied twice), and two game servers update overlapping players without distributed locking. Redis keeps the set sorted, so the corruption shows up as stored scores that disagree with the transaction log.
  1. Check Redis state: `redis-cli info persistence` — if `aof_rewrite_in_progress:1`, the rewrite is contending with writes; defer bulk score updates until rewrite completes.
  2. Audit the corruption: compare sampled entries against the transaction log — a stored score that equals the logged score plus one extra match delta (rank 42103) is a retried ZINCRBY; neighbours whose stored score differs from the log are lost or duplicated updates.
  3. Verify ZSET cardinality: `ZCARD {leaderboard_id}` should match `total_entries` — any mismatch indicates phantom entries from partially applied MULTI/EXEC batches.
  4. Remediate: issue `freeze_leaderboard` to block new writes, then `rebuild_leaderboard` to reconstruct the sorted set from the transaction log source of truth.
  5. Deploy Redlock-based distributed mutex for score update batches and make score submits idempotent (dedupe on match_id before ZINCRBY, e.g. SET NX on a per-match key inside the same Lua script).
remediation_action: rebuild_leaderboard
error_message: '[LB] LB-DATA-CORRUPT: board={leaderboard_id} affected={corrupt_entries} checksum_fail=true season={season_id}'
stack_trace: |-
  === LEADERBOARD CONSISTENCY CHECK ===
  board={leaderboard_id}  season={season_id}
  ----------- sorted set audit --------
    total_entries    = 1,284,301
    corrupt_entries  = {corrupt_entries}
    checksum_fail    = true
    last_valid_rank  = 42,017
  ----------- sample violations -------
    rank 42018: stored=8401  txlog=8399  (MISMATCH vs transaction log)
    rank 42019: stored=8401  txlog=8176  (MISMATCH, increment applied twice)
    rank 42103: stored=8350  txlog=8125  (DUPLICATE ZINCRBY on retry)
  ----------- redis state -------------
    zset_card    = 1,284,301
    memory_used  = 142MB
    last_write   = 2026-02-17T14:21:58.441Z
    aof_rewrite  = IN_PROGRESS
  ----------- action ------------------
    FREEZE board  REBUILD from transaction log
  LB-DATA-CORRUPT: board {leaderboard_id} has {corrupt_entries} invalid entries
correlation_attr:
  key: deployment.redis_config
  value: redis-7.2.4-aof-experimental
fault_params:
  leaderboard_id: {choice: [ranked-global, seasonal-solo, guild-wars, tournament-finals]}
  corrupt_entries: {randint: [10, 500]}
  season_id:
    format: "S{n}"
    n: {randint: [1, 12]}
rca_clues:
  leaderboard-api:
    leaderboard.redis_aof_rewrite: true
    leaderboard.zadd_race_detected: true
  game-server:
    game.rank_display_stale: true
    game.score_submit_retries: {randint: [3, 10]}
  analytics-pipeline:
    analytics.rank_anomaly_events: {randint: [100, 500]}
  moderation-engine:
    moderation.rank_exploit_check: no_exploit_found
business_impact:
  - kpi: business.daily_retention_rate_pct
    value: {uniform: [11.9, 13.7], round: 2}
  - kpi: business.matches_played_per_min
    value: {uniform: [229.71, 264.29]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.net_satisfaction_proxy_nps
    value: {uniform: [9.3, 10.7], round: 1}

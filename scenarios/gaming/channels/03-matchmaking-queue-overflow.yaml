name: Matchmaking Queue Overflow
subsystem: matchmaking
vehicle_section: matchmaker_core
error_type: MM-QUEUE-OVERFLOW
sensor_type: queue_monitor
affected_services:
- matchmaking-engine
- game-server
error_services: [matchmaking-engine]
cascade_services: []
description: Matchmaking queue depth exceeds capacity because there are no ready game servers to place matches on; the game-server HPA sits at max replicas while new pods stay Pending
onset_delay_seconds: 10
ramp_seconds: 45
investigation_notes: |-
  Root cause: a FinOps Terraform apply (CHG0071403) lowered the max size of the EKS node group gs-c5-2xlarge on gaming-eks-cluster from 120 to 80 nodes during the evening peak. The node group shrank to 80 nodes, the game server pods on the removed nodes were rescheduled, and about 150 of them stay Pending (FailedScheduling: 0/80 nodes are available: 80 Insufficient cpu; the cluster autoscaler reports max node group size reached). The game-server HPA is at its 600-replica maximum, but only 400-430 servers are Ready, so the matchmaker forms matches it cannot allocate (NoReadyGameServer) and pool {queue_name} grows to {queue_depth} waiting players (threshold {max_capacity}), with p99 wait {wait_time_ms} ms. The matchmaker itself is healthy: it keeps forming matches, and allocations fail only for lack of servers.
  Confirm:
    - game-server `[Fleet] fleet-status` lines carry attributes.infra.nodegroup_max_size 80 (was 120) and nodes=80/80, and they follow the Terraform apply line with change.request CHG0071403
    - metric game_server.fleet.ready_servers reads 400-430 (baseline 560-600 of 600) and game_server.fleet.pending_pods reads 140-170 (baseline 0-2); the k8s events show FailedScheduling Insufficient cpu and NotTriggerScaleUp max node group size reached
    - metric matchmaking.queue_depth reads 3000-6000 (baseline 80-400) and matchmaking.avg_wait_time_s 120-300 s (baseline 8-25), with allocation failures reason NoReadyGameServer on the MM-QUEUE-OVERFLOW lines
  Remediation: raise the node group limit back with opsctl patch nodegroup/gs-c5-2xlarge --max-size 120. The cluster autoscaler then adds nodes, which join over about 180 seconds; pending_pods falls to 0-2 and ready_servers climbs back to 560-600 over that time, and the queue drains back under 400 over about 240 seconds as matches are allocated again. Restarting the matchmaker would drop the waiting players' tickets and not add a single server; scaling the HPA up does nothing because it is already at max and the extra pods would be Pending too.
remediation_action: raise_nodegroup_max_size
remediation_command: |-
  opsctl patch nodegroup/gs-c5-2xlarge --max-size 120
error_message: '[MM] MM-QUEUE-OVERFLOW: pool={queue_name} queue={queue_depth} max={max_capacity} wait_p99={wait_time_ms}ms region={region}
  allocations_failed_1m={alloc_failed} reason=NoReadyGameServer'
stack_trace: |-
  === MATCHMAKING QUEUE STATE DUMP ===
  pool={queue_name}  region={region}
  ----------- queue metrics -----------
    depth       = {queue_depth}  (max {max_capacity})
    wait_p99    = {wait_time_ms}ms
    enqueue/s   = 342
    dequeue/s   = 89
    drain_eta   = NEVER (inflow > outflow)
  ----------- allocation --------------
    matches_formed_1m      = 410
    allocations_failed_1m  = {alloc_failed}  reason=NoReadyGameServer
    fleet                  = game-server  ready={ready_servers}  pending={pending_pods}
  ----------- action ------------------
    HOLD tickets  RETRY allocation in 5s
  MM-QUEUE-OVERFLOW: pool {queue_name} saturated at {queue_depth}/{max_capacity}
correlation_attr:
  key: infra.nodegroup_max_size
  value: 80
fault_params:
  queue_name: {choice: [ranked-solo, ranked-duo, casual-squad, tournament-5v5]}
  queue_depth: {randint: [3000, 6000]}
  max_capacity: 3000
  wait_time_ms: {randint: [120000, 300000]}
  region: us-east-1
  alloc_failed: {randint: [250, 420]}
  ready_servers: {randint: [400, 430]}
  pending_pods: {randint: [140, 170]}
rca_clues:
  matchmaking-engine:
    matchmaking.allocation_failure_reason: NoReadyGameServer
    matchmaking.allocations_failed_per_min: {randint: [250, 420]}
    matchmaking.matches_formed_per_min: {randint: [380, 440]}
  game-server:
    infra.nodegroup_max_size: 80
    fleet.ready_servers: {randint: [400, 430]}
    fleet.pending_pods: {randint: [140, 170]}
    fleet.hpa_replicas: 600
cascade_messages:
  game-server:
    - severity: WARN
      message: '[Fleet] allocator: GameServerAllocation unallocated fleet=game-server ready=0 allocated={ready_servers} pending_pods={pending_pods} hpa_replicas=600/600'
    - severity: WARN
      message: '[Fleet] scale-up blocked: hpa=game-server at max replicas 600, {pending_pods} pods Pending (Insufficient cpu)'
k8s_events:
  - type: Warning
    reason: FailedScheduling
    object: {kind: Pod, name: game-server-6d8f9c7b54-q7kzt, namespace: game-servers}
    message: '0/80 nodes are available: 80 Insufficient cpu. preemption: 0/80 nodes are available: 80 No preemption victims found for incoming pod.'
    component: default-scheduler
    every_seconds: 30
  - type: Normal
    reason: NotTriggerScaleUp
    object: {kind: Pod, name: game-server-6d8f9c7b54-q7kzt, namespace: game-servers}
    message: "pod didn't trigger scale-up: 1 max node group size reached"
    component: cluster-autoscaler
    every_seconds: 60
  - type: Warning
    reason: ScalingLimited
    object: {kind: HorizontalPodAutoscaler, name: game-server, namespace: game-servers}
    message: 'the desired replica count is more than the maximum replica count'
    component: horizontal-pod-autoscaler
    every_seconds: 120
fault_scope:
  cluster: gaming-eks-cluster
  workloads: [game-server, matchmaking-engine]
service_lag_seconds: {matchmaking-engine: 30}
infrastructure_events:
  - service: game-server
    severity: INFO
    offset_seconds: -180
    body: 'module.eks_gaming.aws_eks_node_group.gs_c5_2xlarge: Modifications complete after 38s [id=gaming-eks-cluster:gs-c5-2xlarge] (scaling_config.max_size 120 -> 80, workspace=gaming-eks-prod, run=run-q8Zt3LmV)'
    attributes:
      operation: config_change
      change.request: CHG0071403
      user.name: finops-terraform
      change.summary: 'gs-c5-2xlarge scaling_config.max_size: 120 -> 80'
      infra.nodegroup: gs-c5-2xlarge
      infra.nodegroup_max_size: 80
  - service: game-server
    severity: INFO
    offset_seconds: -120
    body: 'eks: nodegroup gs-c5-2xlarge update Successful (type=ConfigUpdate, maxSize=80, desiredSize=80), 40 instances terminating'
    attributes:
      operation: config_change
      change.request: CHG0071403
      infra.nodegroup: gs-c5-2xlarge
      infra.nodegroup_max_size: 80
remediation_effects:
  transition_seconds: 240
  log_taper_seconds: 200
  log_events:
    - service: game-server
      severity: INFO
      offset_seconds: 1
      body: 'level=info logger=changelog msg="change applied" cmd="opsctl patch nodegroup/gs-c5-2xlarge --max-size 120" actor={actor} result="nodegroup/gs-c5-2xlarge scaling_config.max_size 80 -> 120"'
      attributes:
        operation: change_applied
        change.target: nodegroup/gs-c5-2xlarge
        infra.nodegroup_max_size: 120
    - service: game-server
      severity: INFO
      offset_seconds: 20
      body: 'cluster-autoscaler: Scale-up: setting group gs-c5-2xlarge size to 117 instead of 80 (max: 120)'
      attributes:
        operation: node_scale_up
        infra.nodegroup: gs-c5-2xlarge
        infra.nodegroup_max_size: 120
    - service: game-server
      severity: INFO
      offset_seconds: 180
      body: '[Fleet] scale-up complete: nodegroup=gs-c5-2xlarge nodes=117/120 pending_pods=0 hpa=game-server replicas=600/600'
      attributes:
        operation: fleet_status
        infra.nodegroup: gs-c5-2xlarge
        infra.nodegroup_max_size: 120
  steady_attributes:
    game-server:
      infra.nodegroup_max_size: 120
  verification:
    - signal: Pending game server pods
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "game-server"'
      field: 'metrics.game_server.fleet.pending_pods'
      expect: 'back to 0-2 (was 140-170) as the new nodes join over about 180 seconds'
      within_seconds: 240
    - signal: ready game servers
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "game-server"'
      field: 'metrics.game_server.fleet.ready_servers'
      expect: 'back in 560-600 (was 400-430) within about 180 seconds'
      within_seconds: 240
    - signal: matchmaking queue depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "matchmaking-engine"'
      field: 'metrics.matchmaking.queue_depth'
      expect: 'draining back under 400 (was 3000-6000) over about 240 seconds'
      within_seconds: 300
    - signal: node group max size
      from: 'logs.otel.gaming'
      where: 'resource.attributes.service.name == "game-server" AND attributes.operation == "fleet_status"'
      field: 'attributes.infra.nodegroup_max_size'
      expect: '120 on every fleet-status line since the patch (was 80)'
      within_seconds: 240
business_impact:
  - kpi: business.matches_played_per_min
    value: {uniform: [141.36, 162.64]}
  - kpi: business.sessions_per_min
    value: {uniform: [1088.0, 1252.0]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.net_satisfaction_proxy_nps
    value: {uniform: [9.3, 10.7], round: 1}
generator_impact:
  kubernetes_otel:
    hpa_at_max_replicas: 1.0
    pods_stuck_in_pending_phase: 0.8
# kube-state-metrics keeps the Pending pods and HPA-at-max until the new nodes have joined
generator_hold_seconds: {kubernetes_otel: 180}

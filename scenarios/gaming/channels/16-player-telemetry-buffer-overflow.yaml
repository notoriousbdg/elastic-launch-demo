name: Player Telemetry Buffer Overflow
subsystem: analytics
vehicle_section: telemetry_buffer
error_type: ANALYTICS-TELEMETRY-OVERFLOW
sensor_type: buffer_monitor
affected_services:
- analytics-pipeline
- game-server
error_services:
- analytics-pipeline
cascade_services: []
description: A game telemetry sampling change multiplies player_move events, overflowing the analytics ingest buffer so
  telemetry events are rejected and lost
onset_delay_seconds: 10
ramp_seconds: 20
investigation_notes: |-
  Root cause: Argo CD synced ConfigMap game-telemetry-sampling revision 17 (CHG0061616) to the game-server fleet, changing player_move sampling from 1/5 to {sample_rate}. At 1/5, player_move was about 42% of the ingest volume; at {sample_rate} it is five times that, so total ingest rises about 2.7x, from 5000-7000 to {received_per_s} events/s. That is past the {flush_rate} events/s the ingest buffer can flush to Kafka, so buffer {buffer_id} is full and the ingest API rejects the overflow with HTTP 503. Nothing changed in analytics-pipeline: its flush rate is at its normal ceiling, and all of the extra volume is player_move.
  Confirm:
    - the analytics-pipeline ingest-buffer lines show usage 95-100% (baseline 20-45%) with attributes.config.player_move_sample_rate = 1/1 (was 1/5); game-server logs the game-telemetry-sampling sync (change.request CHG0061616) before the first overflow
    - metrics.analytics.events_received_per_s is 13000-19000 (baseline 5000-7000) while metrics.analytics.throughput stays at its 7800-8000 ceiling, and metrics.analytics.events_dropped_per_s is 5000-11000 (baseline 0)
    - player_move is {player_move_share_pct}% of the buffered events (about 42% normally), and the game-server telemetry-exporter logs 503 rejections from the ingest API
  Remediation: run `opsctl rollback configmap/game-telemetry-sampling --to-revision previous`. The game servers reload the 1/5 sampling within about 30 s, so the received volume falls back to 5000-7000 events/s and rejections stop within about 30 s. The buffer stays full for about 20 s, then drains back to 20-45% within about 120 s of the rollback. Restarting analytics-pipeline would not help: the buffer empties for a few seconds, then fills again at 2.7x volume. Resizing the buffer only delays the overflow.
remediation_action: rollback_telemetry_sampling
remediation_command: |-
  opsctl rollback configmap/game-telemetry-sampling --to-revision previous
error_message: '[Analytics] ANALYTICS-TELEMETRY-OVERFLOW: buffer={buffer_id} usage={buffer_usage_pct}% received={received_per_s}/s
  flush_rate={flush_rate}/s rejected={dropped_per_s}/s player_move_share={player_move_share_pct}% player_move_sample_rate={sample_rate}'
stack_trace: |-
  === INGEST BUFFER {buffer_id} ===
    usage        = {buffer_usage_pct}% of 100000 slots
    received     = {received_per_s} events/s
    flush rate   = {flush_rate} events/s (Kafka producer, 16 partitions)
    rejected     = {dropped_per_s} events/s (HTTP 503 to producers)
  --- volume by event type (last 60s) ---
    player_move     : {player_move_share_pct}% (sample_rate {sample_rate})
    combat_event    : 9%
    state_snapshot  : 7%
    other           : 4%
  --- producers ---
    game-server telemetry-exporter: 600/600 servers sending
  ANALYTICS-TELEMETRY-OVERFLOW: {buffer_id} full, {dropped_per_s} events/s rejected
correlation_attr:
  key: config.player_move_sample_rate
  value: '1/1'
fault_params:
  buffer_id: buf-player-events
  buffer_usage_pct: {uniform: [95.0, 100.0], round: 1}
  received_per_s: {randint: [13400, 18800]}
  flush_rate: {randint: [7800, 8000]}
  dropped_per_s: {randint: [5400, 11000]}
  player_move_share_pct: {randint: [78, 82]}
  sample_rate: '1/1'
rca_clues:
  analytics-pipeline:
    analytics.player_move_share_pct: {randint: [78, 82]}
    analytics.events_rejected_per_s: {randint: [5400, 11000]}
    config.player_move_sample_rate: '1/1'
  game-server:
    telemetry.export_rejected_pct: {uniform: [40.0, 60.0], round: 1}
    config.player_move_sample_rate: '1/1'
cascade_messages:
  game-server:
    - severity: WARN
      message: 'telemetry-exporter: POST /api/v1/analytics/ingest returned 503 (ingest buffer {buffer_id} full) after 3 retries;
        dropped batch of 500 events, player_move_sample_rate={sample_rate}'
fault_scope:
  workloads: [analytics-pipeline, game-server]
service_lag_seconds: {game-server: 10}
infrastructure_events:
  - service: game-server
    severity: INFO
    offset_seconds: -90
    body: 'argocd-application-controller: level=info msg="Sync operation to 3e9b0d2 succeeded" application=argocd/game-server-prod
      resource=ConfigMap/game-telemetry-sampling revision=17 initiatedBy=gameplay-analytics (player_move sample_rate: 1/5 -> 1/1, CHG0061616)'
    attributes:
      operation: config_change
      change.request: CHG0061616
      user.name: gameplay-analytics
      change.summary: 'game-telemetry-sampling player_move sample_rate: 1/5 -> 1/1'
      config.player_move_sample_rate: '1/1'
  - service: game-server
    severity: INFO
    offset_seconds: -30
    body: 'telemetry-exporter: reloaded sampling config game-telemetry-sampling revision 17 on 600/600 servers (player_move=1/1)'
    attributes:
      operation: config_change
      change.request: CHG0061616
      config.player_move_sample_rate: '1/1'
remediation_effects:
  transition_seconds: 120
  log_events:
    - service: game-server
      severity: INFO
      offset_seconds: 1
      body: 'level=info logger=changelog msg="change applied" cmd="opsctl rollback configmap/game-telemetry-sampling --to-revision previous"
        actor={actor} result="configmap/game-telemetry-sampling revision 17 -> 16, player_move sample_rate 1/1 -> 1/5"'
      attributes:
        operation: change_applied
        event.action: rollback
        change.target: configmap/game-telemetry-sampling
        user.name: '{actor}'
        config.player_move_sample_rate: '1/5'
    - service: game-server
      severity: INFO
      offset_seconds: 30
      body: 'telemetry-exporter: reloaded sampling config game-telemetry-sampling revision 16 on 600/600 servers (player_move=1/5)'
      attributes:
        operation: config_change
        config.player_move_sample_rate: '1/5'
    - service: analytics-pipeline
      severity: INFO
      offset_seconds: 120
      body: '[Analytics] ingest-buffer buffer=buf-player-events drained below 50%, 0 events rejected in the last 60s'
      attributes:
        operation: buffer_status
        analytics.buffer: buf-player-events
  steady_attributes:
    analytics-pipeline:
      config.player_move_sample_rate: '1/5'
  verification:
    - signal: ingest buffer usage
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "analytics-pipeline"'
      field: 'metrics.analytics.buffer_usage_pct'
      expect: 'full for about 20 s, then back in 20-45% within about 120 s (was 95-100%)'
      within_seconds: 180
    - signal: rejected events
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "analytics-pipeline"'
      field: 'metrics.analytics.events_dropped_per_s'
      expect: '0 within about 30 s (was 5000-11000 events/s), with metrics.analytics.events_received_per_s back in 5000-7000 (was 13000-19000)'
      within_seconds: 120
    - signal: ANALYTICS-TELEMETRY-OVERFLOW lines
      from: 'logs.otel.gaming'
      where: 'body.text LIKE "*ANALYTICS-TELEMETRY-OVERFLOW*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: observed player_move sample rate
      from: 'logs.otel.gaming'
      where: 'resource.attributes.service.name == "analytics-pipeline" AND attributes.operation == "buffer_status"'
      field: 'attributes.config.player_move_sample_rate'
      expect: '1/5 on every ingest-buffer line since the rollback (was 1/1)'
      within_seconds: 120
business_impact:
  - kpi: business.matches_played_per_min
    value: {uniform: [229.71, 264.29]}
  - kpi: business.sessions_per_min
    factor: {uniform: [0.3, 0.55]}
  - kpi: business.crash_rate_pct
    value: {uniform: [0.58, 0.66], round: 3}
  - kpi: business.player_bug_reports_per_min
    value: {uniform: [12.92, 14.87], round: 2}

name: Cross-Region Player Migration Failure
subsystem: matchmaking
vehicle_section: migration_controller
error_type: MM-MIGRATION-FAIL
sensor_type: migration_monitor
affected_services:
- matchmaking-engine
- auth-gateway
cascade_services:
- game-server
- leaderboard-api
- analytics-pipeline
description: Player session migration between regional game server clusters fails during rebalancing or failover operations
investigation_notes: |-
  Root cause: the state transfer phase times out because the cross-region network path between {source_region} and {target_region} has elevated latency and 4.2% packet loss, causing the 84.2KB state payload to fail TCP delivery within the migration timeout.
  1. Check network path: `mtr -rwzbc 100 <target_region_endpoint>` from the source region to identify which hop introduces the latency and packet loss.
  2. Review migration phase: if failure is at 'transfer', it is network; if at 'injection', the target server rejected the state payload (version mismatch or schema change).
  3. Inspect payload size: 84.2KB with 247 inventory items is large — consider compressing the state payload (zstd typically achieves 3:1 on game state data).
  4. Remediate: issue `rollback_migration` to return the player to the source region, then retry with `migrate_with_reduced_payload` which strips non-essential state.
  5. Implement incremental migration: pre-replicate static player data (inventory, settings) to the target region asynchronously, so the live migration only transfers dynamic match state (~12.4KB), which is small enough to survive packet loss.
remediation_action: rollback_migration
error_message: '[MM] MM-MIGRATION-FAIL: player={player_id} path={source_region}->{target_region} phase={migration_phase} session={session_id}
  latency={latency_ms}ms'
stack_trace: |-
  === MIGRATION STATE TRANSFER LOG ===
  player={player_id}  session={session_id}
  ----------- migration path ----------
    source       = {source_region}
    target       = {target_region}
    phase        = {migration_phase}  <<< FAILED HERE
    latency      = {latency_ms}ms
  ----------- phase timeline ----------
    state_extraction  : 847ms   OK
    serialization     : 124ms   OK
    transfer          : {latency_ms}ms  TIMEOUT
    injection         : --      SKIPPED
    validation        : --      SKIPPED
  ----------- state payload -----------
    inventory_items = 247
    active_buffs    = 3
    match_state     = 12.4KB
    total_payload   = 84.2KB
  ----------- network diagnostic ------
    rtt_{source_region}->{target_region} = {latency_ms}ms
    packet_loss    = 4.2%
    tcp_retransmit = 12
  ----------- action ------------------
    ROLLBACK to source  RETRY with smaller payload
  MM-MIGRATION-FAIL: player {player_id} migration {source_region}->{target_region} failed at {migration_phase}
correlation_attr:
  key: network.cross_region_vpn
  value: wireguard-v1.0.20241201-mtu1400
fault_params:
  player_id:
    format: "PLR-{n}"
    n: {randint: [100000, 999999]}
  source_region: {choice: [us-east-1, eu-west-1]}
  target_region: {choice: [us-west-2, ap-southeast-1]}
  migration_phase: {choice: [state_extraction, transfer, injection, validation]}
  session_id:
    format: "SESS-{n}"
    n: {randint: [10000000, 99999999]}
  latency_ms: {randint: [200, 5000]}
rca_clues:
  matchmaking-engine:
    matchmaking.migration_timeout_ms: {randint: [5000, 30000]}
    matchmaking.cross_region_packet_loss_pct: {uniform: [2.0, 8.0], round: 1}
  auth-gateway:
    auth.session_transfer_status: failed
    auth.token_region_mismatch: true
  game-server:
    game.state_payload_kb: {uniform: [40.0, 120.0], round: 1}
    game.migration_rollback: true
  leaderboard-api:
    leaderboard.cross_region_sync: stalled
  analytics-pipeline:
    analytics.migration_failure_events: {randint: [10, 100]}
business_impact:
  - kpi: business.sessions_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.matches_played_per_min
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.net_satisfaction_proxy_nps
    factor: {uniform: [0.25, 0.50]}

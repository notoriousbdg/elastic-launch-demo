name: Skill Rating Calculation Error
subsystem: matchmaking
vehicle_section: rating_engine
error_type: MM-SKILL-RATING-DIVERGE
sensor_type: rating_validator
affected_services:
- matchmaking-engine
- leaderboard-api
cascade_services:
- analytics-pipeline
description: Skill rating calculation produces invalid MMR values due to edge cases in the Elo/Glicko algorithm implementation
investigation_notes: |-
  Root cause: a code defect in the Glicko-2 convergence loop — the volatility (sigma) iterative solver does not clamp intermediate values, allowing sigma to diverge when a player's actual score vastly exceeds expected score (e.g., 0.83 vs 0.41). This produces new_mu values outside the valid [0, max_mmr] range.
  1. Check convergence iterations: if `convergence_i` approaches max (20, i.e. 17 or more), the Illinois method is not converging. The tau system constant is at its default 0.5, so the unclamped sigma is the cause, not tau.
  2. Query affected players: `FROM logs WHERE body.text LIKE '*MM-SKILL-RATING-DIVERGE*'` and check how many players have out-of-range MMR in the current season.
  3. Validate the Glicko-2 implementation against Mark Glickman's reference paper — specifically step 5.1 (volatility estimation) needs a bisection fallback.
  4. Remediate: issue `reset_skill_ratings` for affected players to recalculate from match history; deploy a hotfix clamping sigma to a sane band (e.g. 0.01 < sigma < 0.2; default 0.06).
  5. The current CLAMP action masks the defect — the algorithm must be fixed to prevent incorrect competitive matchmaking downstream.
remediation_action: reset_skill_ratings
error_message: '[MM] MM-SKILL-RATING-DIVERGE: player={player_id} mmr={mmr_value} valid_range=[0,{max_mmr}] volatility={volatility}
  match={match_id}'
stack_trace: |-
  === GLICKO-2 CALCULATION TRACE ===
  player={player_id}  match={match_id}
  ----------- pre-match state ----------
    mu (rating)     = 1847.3
    phi (deviation) = 142.7
    sigma (vol)     = {volatility}
    games_in_period = 14
  ----------- match result -------------
    opponents       = 5
    actual_score    = 0.83
    expected_score  = 0.41
    tau             = 0.5
  ----------- post-match calc ----------
    new_mu          = {mmr_value}  <<< OUT OF RANGE [0, {max_mmr}]
    new_phi         = 187.2
    new_sigma       = {volatility} (solver did not converge)
    convergence_i   = {convergence_iter} iterations (max 20)
  ----------- action -------------------
    CLAMP to valid range  FLAG for manual review
  MM-SKILL-RATING-DIVERGE: player {player_id} mmr {mmr_value} outside bounds
correlation_attr:
  key: runtime.glicko_impl
  value: glicko2-v3.0.1-unclamped
fault_params:
  player_id:
    format: "PLR-{n}"
    n: {randint: [100000, 999999]}
  mmr_value: {randint: [5200, 10000]}
  max_mmr: 5000
  volatility: {uniform: [1.25, 2.5], round: 3}
  convergence_iter: {randint: [17, 20]}
  match_id:
    format: "MATCH-{n}"
    n: {randint: [100000, 999999]}
rca_clues:
  matchmaking-engine:
    matchmaking.glicko_convergence_iter: {randint: [17, 20]}
    matchmaking.glicko_sigma: {uniform: [1.25, 2.5], round: 3}
    matchmaking.glicko_tau: 0.5
    matchmaking.sigma_unclamped: true
  leaderboard-api:
    leaderboard.out_of_range_players: {randint: [10, 200]}
    leaderboard.season_integrity: compromised
  analytics-pipeline:
    analytics.rating_anomaly_count: {randint: [50, 300]}
business_impact:
  - kpi: business.matches_played_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.daily_retention_rate_pct
    value: {uniform: [11.9, 13.7], round: 2}
  - kpi: business.churn_risk_index_0_100
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.net_satisfaction_proxy_nps
    factor: {uniform: [0.25, 0.5]}

service: policy-manager
sort_order: 4
cloud_provider: gcp
cloud_region: us-central1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-central1-a
subsystem: policy_administration
language: python
topology:
- - quote-engine
  - /api/v1/quote/rate-policy
  - POST
- - document-vault
  - /api/v1/docs/generate-dec-page
  - POST
- - member-portal
  - /api/v1/member/policy-update
  - POST
entry_endpoints:
- - /api/v1/policy/renew
  - POST
- - /api/v1/policy/endorsement
  - PUT
- - /api/v1/policy/details
  - GET
db_operations:
- - SELECT
  - policies
  - SELECT policy_id, product_type, premium, effective_date, expiry_date FROM policies WHERE member_id = ? AND status = 'ACTIVE'
- - UPDATE
  - policies
  - UPDATE policies SET premium = ?, effective_date = ?, status = 'RENEWED' WHERE policy_id = ?
emit_fault_logs: true
kpi_emitter: false
state:
  _renewals_processed:
    init: 0
  _last_summary:
    init: now
steps:
- sample:
    policy_product:
      choice:
      - AUTO
      - HOMEOWNERS
      - RENTERS
      - UMBRELLA
    policy_premium:
      uniform:
      - 400.0
      - 3000.0
      round: 2
- counter:
    state_key: _renewals_processed
    by: 1
- log:
    level: INFO
    message: '[POLICY] renewal_processed product={policy_product} premium=${policy_premium} mvr_clear=true rating_complete=true
      status=RENEWED'
    attrs:
      operation: renewal_processed
      policy.product:
        var: policy_product
      policy.premium:
        var: policy_premium
      policy.mvr_clear: true
- sample:
    endorsement_type:
      choice:
      - ADD_VEHICLE
      - REMOVE_DRIVER
      - ADDRESS_CHANGE
      - COVERAGE_INCREASE
      - DEDUCTIBLE_CHANGE
      - PCS_UPDATE
- log:
    level: INFO
    message: '[POLICY] endorsement_applied type={endorsement_type} effective=IMMEDIATE premium_impact=+$12.40 status=APPLIED'
    attrs:
      operation: endorsement_applied
      endorsement.type:
        var: endorsement_type
      endorsement.effective: IMMEDIATE
- every:
    seconds: 10
    state_key: _last_summary
    steps:
    - log:
        level: INFO
        message: '[POLICY] admin_summary renewals={_renewals_processed} retention=95.2% scra_protected=847 status=NOMINAL'
        attrs:
          operation: admin_summary
          admin.renewals:
            var: _renewals_processed
          admin.retention_rate: 95.2
- metric:
    name: policy_manager.active_policies
    value:
      randint:
      - 2800000
      - 3200000
    unit: policies
- metric:
    name: policy_manager.renewal_rate
    value:
      uniform:
      - 92.0
      - 98.0
      round: 1
    unit: '%'
- metric:
    name: policy_manager.endorsement_queue
    value:
      randint:
      - 10
      - 100
    unit: endorsements
- sample:
    f11p:
      expr: min(1.0, max(0.0, elapsed.get(11, 0) - lag.get(11, 0)) / 30.0) if 11 in all_active else (max(0.0, 1.0 - since_fix.get(11,
        0) / 90.0) if 11 in fixed_channels else 0.0)
    c11_parallelism:
      expr: 32 if 11 in all_active else 4
    c11_failed:
      expr: round(round(rand.uniform(0.0, 1.0) * (1.0 - f11p) + rand.uniform(40.0, 120.0) * f11p, 0))
    c11_status:
      expr: '''DEGRADED'' if 11 in all_active or f11p > 0.1 else ''NOMINAL'''
- when: 11 in all_active
  log:
    level: WARN
    message: '[POLICY] renewal_batch_status cronjob=policy-renewal-batch parallelism={c11_parallelism} rating_timeout_s=15
      failed_per_min={c11_failed} status={c11_status}'
    attrs: &id001
      operation: renewal_batch_status
      batch.parallelism:
        var: c11_parallelism
      batch.failed_per_min:
        var: c11_failed
      batch.status:
        var: c11_status
- when: 11 not in all_active
  log:
    level: INFO
    message: '[POLICY] renewal_batch_status cronjob=policy-renewal-batch parallelism={c11_parallelism} rating_timeout_s=15
      failed_per_min={c11_failed} status={c11_status}'
    attrs: *id001
- metric:
    name: policy_manager.renewal_failed_per_min
    value:
      var: c11_failed
    unit: policies/min

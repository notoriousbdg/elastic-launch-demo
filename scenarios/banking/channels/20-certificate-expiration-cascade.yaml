name: Certificate Expiration Cascade
subsystem: authentication
vehicle_section: certificate_mgmt
error_type: INFRA-CERT-EXPIRE
sensor_type: certificate_monitor
affected_services:
- auth-gateway
- mobile-gateway
cascade_services:
- payment-engine
- member-portal
description: The wildcard TLS certificate for the API and sign-in endpoints expired because cert-manager could not complete DNS validation for a month, so clients reject every connection.
investigation_notes: |-
  1. Search logs.otel.banking for body.text containing INFRA-CERT-EXPIRE on auth-gateway and mobile-gateway: domain={cert_domain} with serial={cert_serial} from {cert_issuer} expired {cert_hours_left}h ago (negative means past notAfter) and {cert_svc_count} services serve it. metrics.mobile_gateway.tls_handshake_failures_per_min and metrics.auth_gateway.tls_handshake_failures_per_min normally read 0-4 and are in the thousands.
  2. Confirm it is the certificate, not the network: clients fail with certificate expired / ERR_CERT_DATE_INVALID during the handshake, the tls_status line on both gateways carries attributes.tls.cert_status=EXPIRED and attributes.tls.cert_serial={cert_serial}, and nothing reaches the application code.
  3. Find why renewal did not happen: cert-manager has tried to renew certificate wildcard-retailbank-com (namespace edge) since 30 days before expiry, and every ACME DNS-01 challenge failed with Route53 InvalidClientTokenId. The cert-manager Route 53 access key was rotated in AWS Secrets Manager last month, but ExternalSecret route53-dns01-credentials (namespace cert-manager) has refreshInterval 0, so the Kubernetes secret still holds the deleted key.
  4. Both clusters are affected because the certificate is issued once on banking-eks-cluster and replicated to banking-gke-cluster for auth-gateway. Renewing alone fails again with the same credential, and installing a manually issued certificate leaves renewal broken for the next expiry.
  5. Fix both: opsctl sync externalsecret/route53-dns01-credentials -n cert-manager pulls the current key, then opsctl renew certificate/wildcard-retailbank-com -n edge issues a new certificate. DNS-01 validation takes about a minute; the EKS ingress serves the new certificate first and the GKE copy follows on its next one-minute replication.
  6. Recovery: tls.cert_status reads VALID with a new tls.cert_serial on both gateways, tls_handshake_failures_per_min back to 0-4, and no new INFRA-CERT-EXPIRE lines. Add an alert on cert-manager certificate_ready_status and on notAfter under 14 days.
remediation_action: renew_wildcard_certificate
remediation_command: |-
  opsctl sync externalsecret/route53-dns01-credentials -n cert-manager
  opsctl renew certificate/wildcard-retailbank-com -n edge
error_message: '[INFRA] INFRA-CERT-EXPIRE: domain={cert_domain} expires_in={cert_hours_left}h serial={cert_serial} issuer={cert_issuer} services_affected={cert_svc_count} handshake_error=certificate_expired'
stack_trace: |-
  === CERTIFICATE STATUS REPORT ===
  domain={cert_domain}  issuer={cert_issuer}  certificate=edge/wildcard-retailbank-com
  --- CERTIFICATE DETAILS ---
    serial={cert_serial}
    remaining={cert_hours_left}h  <<< EXPIRED
    san={cert_domain},retailbank.com
  --- SERVED BY ---
    mobile-gateway (banking-eks-cluster)   FAILING   certificate_expired
    auth-gateway   (banking-gke-cluster)   FAILING   certificate_expired (replicated secret)
  --- RENEWAL ---
    cert-manager order=FAILED  challenge=dns-01  error="Route53 InvalidClientTokenId: The security token included in the request is invalid"
    attempts_since_renewal_window={renewal_attempts}  credentials=cert-manager/route53-dns01-credentials (refreshInterval 0)
  ACTION: alert=INFRA-CERT-EXPIRE
correlation_attr:
  key: tls.cert_serial
  value: 03F9A1C27B44E0D5
fault_params:
  cert_domain: '*.retailbank.com'
  cert_hours_left: {uniform: [-0.5, -0.1], round: 2}
  cert_serial: 03F9A1C27B44E0D5
  cert_issuer: "Let's Encrypt R11"
  cert_svc_count: {randint: [4, 6]}
  renewal_attempts: {randint: [140, 180]}
rca_clues:
  auth-gateway:
    tls.cert_status: EXPIRED
    tls.cert_serial: 03F9A1C27B44E0D5
  mobile-gateway:
    tls.cert_status: EXPIRED
    gateway.tls_handshake_failures: {randint: [5000, 20000]}
  payment-engine:
    payment.mobile_initiated_txn_drop_pct: {randint: [55, 80]}
  member-portal:
    portal.api_dependency_errors: {randint: [1000, 5000]}
service_lag_seconds:
  payment-engine: 30
  member-portal: 30
cascade_messages:
  payment-engine:
  - severity: WARN
    message: '[PAY] channel_volume source=mobile txn_per_sec_drop_pct=70 reason=upstream_tls_failures status=DEGRADED'
  member-portal:
  - severity: WARN
    message: '[PORTAL] upstream_error upstream=api.retailbank.com error="x509: certificate has expired or is not yet valid" status=502'
fault_scope:
  cluster: banking-eks-cluster
  workloads: [mobile-gateway, auth-gateway]
infrastructure_events:
- service: mobile-gateway
  severity: WARN
  offset_seconds: -60
  body: '[INFRA] cert-manager certificate=edge/wildcard-retailbank-com Ready=False reason=Expired notAfter passed; last renewal error: Route53 InvalidClientTokenId (secret cert-manager/route53-dns01-credentials)'
  attributes:
    operation: certificate_status
    tls.cert_status: EXPIRED
    tls.cert_serial: 03F9A1C27B44E0D5
remediation_effects:
  transition_seconds: 90
  log_events:
  - service: mobile-gateway
    severity: INFO
    offset_seconds: 1
    body: '[change-audit] change applied action=sync target=externalsecret/route53-dns01-credentials namespace=cert-manager cmd="opsctl sync externalsecret/route53-dns01-credentials -n cert-manager" actor={actor} result="secret refreshed from Secrets Manager (current key)"'
    attributes:
      operation: change_applied
      change.target: externalsecret/route53-dns01-credentials
  - service: mobile-gateway
    severity: INFO
    offset_seconds: 2
    body: '[change-audit] change applied action=renew target=certificate/wildcard-retailbank-com namespace=edge cmd="opsctl renew certificate/wildcard-retailbank-com -n edge" actor={actor} result="ACME order created (dns-01)"'
    attributes:
      operation: change_applied
      change.target: certificate/wildcard-retailbank-com
  - service: mobile-gateway
    severity: INFO
    offset_seconds: 60
    body: '[INFRA] cert-manager certificate=edge/wildcard-retailbank-com Ready=True reason=Issued serial=04B7E2D91A6C3F08 notAfter=+90d'
    attributes:
      operation: certificate_status
      tls.cert_status: VALID
      tls.cert_serial: 04B7E2D91A6C3F08
  verification:
  - signal: mobile_gateway.tls_handshake_failures_per_min
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "mobile-gateway"
    field: metrics.mobile_gateway.tls_handshake_failures_per_min
    expect: back to 0-4 (was 6,000-15,000)
    within_seconds: 150
  - signal: auth_gateway.tls_handshake_failures_per_min
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "auth-gateway"
    field: metrics.auth_gateway.tls_handshake_failures_per_min
    expect: back to 0-4 (was 4,000-12,000)
    within_seconds: 180
  - signal: served certificate
    from: logs.otel.banking
    where: attributes.operation == "tls_status" AND resource.attributes.service.name IN ("mobile-gateway", "auth-gateway")
    field: attributes.tls.cert_status
    expect: VALID with serial 04B7E2D91A6C3F08 on both gateways
    within_seconds: 180
  - signal: INFRA-CERT-EXPIRE lines
    from: logs.otel.banking
    where: body.text LIKE "*INFRA-CERT-EXPIRE*"
    expect: 0 new lines
    within_seconds: 180
generator_impact:
  nginx_otel:
    error_log_spike: 150.0
business_impact:
  - kpi: business.active_digital_sessions
    value: {uniform: [4464.0, 5136.0]}
  - kpi: business.mobile_logins_per_min
    value: {uniform: [148.8, 171.2]}
  - kpi: business.api_calls_per_min
    value: {uniform: [13299.0, 15301.0]}
  - kpi: business.digital_transaction_pct
    factor: {uniform: [0.15, 0.4]}


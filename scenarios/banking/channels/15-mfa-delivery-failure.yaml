name: MFA Delivery Failure
subsystem: authentication
vehicle_section: mfa_service
error_type: AUTH-MFA-DELIVERY-FAIL
sensor_type: mfa_delivery
affected_services:
- auth-gateway
- mobile-gateway
cascade_services:
- member-portal
- payment-engine
description: One-time passcodes sent by SMS are filtered by the mobile carriers since the passcode message template started including a shortened link.
investigation_notes: |-
  1. Search logs.otel.banking for body.text containing AUTH-MFA-DELIVERY-FAIL on auth-gateway: channel={mfa_channel} delivers {mfa_delivery_rate}% through {mfa_provider} with error={mfa_error} (provider error {twilio_error}, message filtered by the carrier). metrics.auth_gateway.mfa_delivery_rate normally reads 95-99.5% and is now 54-72%; metrics.auth_gateway.sms_filtered_per_min rose from 0-3 to 300-700.
  2. The provider and the carriers are up: messages are accepted by the provider (HTTP 201), the rejection comes back in the delivery receipt, and push, TOTP and email passcodes deliver normally. The filtering is on T-Mobile and Verizon for short code 872438, the carriers that block public URL shorteners in application-to-person traffic.
  3. Find the change: the mfa_delivery_status line on auth-gateway carries attributes.mfa.sms_template_version and attributes.mfa.sms_template_has_url. Message template mfa-otp-sms (namespace identity) was published as v12 shortly before the first failure; v12 appends "Not you? bit.ly/rb-secure" to the passcode text.
  4. Do not move the traffic to another provider or long code: carriers filter on the content, so the same text is filtered on any route, and an unregistered route makes filtering worse. Members abroad and on deployment depend on SMS passcodes; offer push or TOTP to them while SMS recovers.
  5. Fix: opsctl rollback message-template/mfa-otp-sms -n identity --to-revision previous republishes v11 (passcode only). New passcodes go out with the old text within seconds; carrier filtering subsides over about two minutes as the short code's recent filter rate drops.
  6. Recovery: mfa.sms_template_version reads v11 and sms_template_has_url false, mfa_delivery_rate back above 95%, sms_filtered_per_min back to 0-3, and no new AUTH-MFA-DELIVERY-FAIL lines.
remediation_action: rollback_otp_template
remediation_command: |-
  opsctl rollback message-template/mfa-otp-sms -n identity --to-revision previous
error_message: '[AUTH] AUTH-MFA-DELIVERY-FAIL: channel={mfa_channel} delivery_rate={mfa_delivery_rate}% member={member_id} provider={mfa_provider} error={mfa_error} provider_error={twilio_error} carrier={carrier} template=mfa-otp-sms/v12'
stack_trace: |-
  === MFA DELIVERY STATUS ===
  channel={mfa_channel}  provider={mfa_provider}  short_code=872438  template=mfa-otp-sms v12
  --- DELIVERY (5 min) ---
    CHANNEL     DELIVERY_RATE   STATUS
    SMS         {mfa_delivery_rate}%          DEGRADED
    PUSH        99.1%           OK
    TOTP        100%            OK
    EMAIL       98.4%           OK
  --- SMS FAILURE DETAIL ---
    error={mfa_error}  provider_error={twilio_error} (message filtered)  carrier={carrier}
    body_preview="Your Retail Bank code is ######. Not you? bit.ly/rb-secure"
  ACTION: alert=AUTH-MFA-DELIVERY-FAIL
correlation_attr:
  key: mfa.sms_template_version
  value: v12
fault_params:
  mfa_channel: SMS
  mfa_delivery_rate: {uniform: [54.0, 72.0], round: 1}
  member_id: {format: "M-{n}", n: {randint: [1000000, 9999999]}}
  mfa_provider: Twilio
  mfa_error: CARRIER_FILTERED
  twilio_error: '30007'
  carrier: {choice: [T-MOBILE, VERIZON]}
rca_clues:
  auth-gateway:
    mfa.sms_template_version: v12
    mfa.sms_template_has_url: true
    mfa.provider_error_code: '30007'
  mobile-gateway:
    gateway.mfa_resend_requests_per_min: {randint: [800, 2400]}
  member-portal:
    portal.deployed_member_lockout_count: {randint: [50, 150]}
  payment-engine:
    payment.step_up_auth_failures: {randint: [100, 500]}
error_services:
- auth-gateway
service_lag_seconds:
  mobile-gateway: 20
  member-portal: 60
  payment-engine: 60
cascade_messages:
  mobile-gateway:
  - severity: WARN
    message: '[MOBILE] mfa_resend member={member_id} channel=SMS attempts=3 reason=code_not_received status=RESENT'
  member-portal:
  - severity: WARN
    message: '[PORTAL] sign_in_blocked member={member_id} step=otp reason=code_not_received status=LOCKED_OUT'
  payment-engine:
  - severity: WARN
    message: '[PAY] step_up_auth payment_type=WIRE_DOM result=OTP_NOT_COMPLETED status=ABANDONED'
fault_scope:
  cluster: banking-gke-cluster
  workloads: [auth-gateway]
infrastructure_events:
- service: auth-gateway
  severity: INFO
  offset_seconds: -90
  body: '[AUTH] template_publish template=identity/mfa-otp-sms v11 -> v12 change="append fraud-awareness link bit.ly/rb-secure" published_by=identity-content approval=CHG0048509 status=ACTIVE'
  attributes:
    operation: template_publish
    mfa.sms_template_version: v12
    user.name: identity-content
remediation_effects:
  transition_seconds: 120
  log_events:
  - service: auth-gateway
    severity: INFO
    offset_seconds: 1
    body: '[change-audit] change applied action=rollback target=message-template/mfa-otp-sms namespace=identity cmd="opsctl rollback message-template/mfa-otp-sms -n identity --to-revision previous" actor={actor} result="v12 -> v11 (no link)"'
    attributes:
      operation: change_applied
      change.target: message-template/mfa-otp-sms
      mfa.sms_template_version: v11
  steady_attributes:
    auth-gateway:
      mfa.sms_template_version: v11
  verification:
  - signal: auth_gateway.mfa_delivery_rate
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "auth-gateway"
    field: metrics.auth_gateway.mfa_delivery_rate
    expect: back in 95-99.5% (was 54-72%)
    within_seconds: 180
  - signal: auth_gateway.sms_filtered_per_min
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "auth-gateway"
    field: metrics.auth_gateway.sms_filtered_per_min
    expect: back to 0-3 (was 300-700)
    within_seconds: 180
  - signal: passcode SMS template
    from: logs.otel.banking
    where: resource.attributes.service.name == "auth-gateway" AND attributes.operation == "mfa_delivery_status"
    field: attributes.mfa.sms_template_version
    expect: v11 on every line logged since the fix; v12 stops appearing
    within_seconds: 60
  - signal: AUTH-MFA-DELIVERY-FAIL lines
    from: logs.otel.banking
    where: body.text LIKE "*AUTH-MFA-DELIVERY-FAIL*"
    expect: 0 new lines
    within_seconds: 180
business_impact:
  - kpi: business.mobile_logins_per_min
    value: {uniform: [148.8, 171.2]}
  - kpi: business.active_digital_sessions
    value: {uniform: [7254.0, 8346.0]}
  - kpi: business.failed_auth_attempts_per_min
    factor: {uniform: [3.0, 6.0]}
  - kpi: business.digital_transaction_pct
    factor: {uniform: [0.4, 0.65]}

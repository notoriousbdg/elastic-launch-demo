name: MFA Delivery Failure
subsystem: authentication
vehicle_section: mfa_service
error_type: AUTH-MFA-DELIVERY-FAIL
sensor_type: mfa_delivery
affected_services:
- auth-gateway
- mobile-gateway
cascade_services:
- member-portal
- payment-engine
description: Multi-factor authentication code delivery failing via SMS and email channels
investigation_notes: |-
  1. SMS delivery at 70% is critically degraded — check carrier blocking status. T-Mobile and Verizon SPAM_FILTER blocking on short code 872438 requires carrier re-registration and compliance review.
  2. Military-specific impact: OCONUS members (342 affected) on overseas deployments rely heavily on SMS MFA. Satellite phones do not support short code SMS. Enable TOTP bypass for deployed members.
  3. Check MFA provider status — Twilio and AWS SNS have regional outage dashboards. Provider RATE_LIMIT_EXCEEDED means the sending volume exceeded the provisioned throughput. Request limit increase.
  4. Deployed member lockout (89 members) is a critical issue — these members cannot authenticate to manage finances during deployment. Activate emergency access protocol: verify identity via security questions + last 4 SSN, then issue temporary TOTP enrollment.
  5. Route all SMS traffic to EMAIL fallback while SMS is degraded. For members without email on file, enable PUSH notification MFA through the mobile app.
  6. SCRA flag on affected accounts means special regulatory handling — ensure no account restrictions are applied due to authentication failures on SCRA-protected accounts.
remediation_action: reset_mfa_delivery
error_message: '[AUTH] AUTH-MFA-DELIVERY-FAIL: channel={mfa_channel} delivery_rate={mfa_delivery_rate}% member={member_id}
  provider={mfa_provider} error={mfa_error}'
stack_trace: |-
  === MFA DELIVERY STATUS ===
  channel={mfa_channel}  provider={mfa_provider}
  --- DELIVERY METRICS ---
    CHANNEL     SENT      DELIVERED   RATE      STATUS
    SMS         4,200     2,940       70%       DEGRADED
    EMAIL       2,800     2,744       98%       OK
    PUSH        1,600     1,520       95%       OK
    TOTP        890       890         100%      OK
  --- SMS FAILURE DETAIL ---
    provider={mfa_provider}  error={mfa_error}
    carrier_block=T-MOBILE,VERIZON  reason=SPAM_FILTER
    short_code=872438  throughput=120/min  queue=4,200
  --- MILITARY IMPACT ---
    oconus_members_affected=342  satellite_phone=NOT_SUPPORTED
    deployed_members_lockout=89  scra_flag=true
  ACTION: route_to_email=true  enable_totp_bypass=true  alert=AUTH-MFA-DELIVERY-FAIL
correlation_attr:
  key: infra.sms_gateway_config
  value: twilio-gw-v4.8.0-hotfix
fault_params:
  mfa_channel: {choice: [SMS, EMAIL, PUSH, TOTP]}
  mfa_delivery_rate: {uniform: [50.0, 80.0], round: 1}
  member_id: {format: "M-{n}", n: {randint: [1000000, 9999999]}}
  mfa_provider: {choice: [Twilio, AWS_SNS, SendGrid, Firebase_Cloud_Messaging]}
  mfa_error: {choice: [CARRIER_BLOCKED, RATE_LIMIT_EXCEEDED, INVALID_NUMBER, PROVIDER_TIMEOUT, SHORT_CODE_FILTERED]}
rca_clues:
  auth-gateway:
    auth.sms_delivery_rate_pct: {uniform: [60, 78], round: 1}
    auth.carrier_block_list: {choice: [T-MOBILE, VERIZON, "T-MOBILE,VERIZON"]}
  mobile-gateway:
    gateway.mfa_fallback_channel: {choice: [PUSH, EMAIL, TOTP]}
    gateway.oconus_members_affected: {randint: [200, 500]}
  member-portal:
    portal.deployed_member_lockout_count: {randint: [50, 150]}
    portal.scra_flag_check: true
  payment-engine:
    payment.mfa_blocked_transactions: {randint: [500, 2000]}
    payment.step_up_auth_failures: {randint: [100, 500]}

name: Database Replication Lag
subsystem: payment_processing
vehicle_section: database_infra
error_type: INFRA-DB-REPL-LAG
sensor_type: replication_monitor
affected_services:
- payment-engine
- mobile-gateway
cascade_services:
- claims-processor
- member-portal
description: The payments read replica falls further behind every second because WAL replay waits on a long reporting query, so members see stale balances.
investigation_notes: |-
  1. Search logs.otel.banking for body.text containing INFRA-DB-REPL-LAG on payment-engine: cluster={db_cluster} replica={db_replica} is {db_lag_ms} ms behind against a {db_max_lag_ms} ms limit with {db_pending_txns} transactions not yet applied. metrics.payment_engine.db_replica_lag_ms normally reads 20-400 ms and is growing by about one second per second.
  2. Read the shape of the lag: a lag that grows linearly while the replica's CPU and disk are mostly idle means replay is paused, not slow. The replica logs "recovery still waiting ... recovery conflict on snapshot" and pg_stat_activity on the replica shows the ledger reconciliation report running for over 30 minutes; the startup process waits on RecoveryConflictSnapshot.
  3. Find the change: the replica_status line on payment-engine carries attributes.db.max_standby_streaming_delay. Parameter group banking-pg-payments-replica was changed from 30s to -1 (wait forever) shortly before the lag began, to stop the reconciliation report from being cancelled with "canceling statement due to conflict with recovery". With -1, replay waits behind every long query.
  4. Rule out storage and the primary: replica IOPS and CPU are well below their limits, the primary's WAL generation rate is normal, and the network between primary and replica is healthy. Adding IOPS or failing over does not help, and RDS will not accept another storage change for six hours after one.
  5. Fix: opsctl restore db-parameter-group/banking-pg-payments-replica --max-standby-streaming-delay 30s. The parameter is dynamic, so no reboot: the conflicting report query is cancelled within 30 s, replay resumes, and the lag drains in about a minute and a half. Move the reconciliation report to a dedicated reporting replica instead.
  6. Recovery: db.max_standby_streaming_delay reads 30s, db_replica_lag_ms back under 400 ms, stale_read_pct back near zero on mobile-gateway, and no new INFRA-DB-REPL-LAG lines.
remediation_action: restore_standby_delay
remediation_command: |-
  opsctl restore db-parameter-group/banking-pg-payments-replica --max-standby-streaming-delay 30s
error_message: '[INFRA] INFRA-DB-REPL-LAG: cluster={db_cluster} lag_ms={db_lag_ms} max_ms={db_max_lag_ms} replica={db_replica} pending_txns={db_pending_txns} replay=waiting wait_event=RecoveryConflictSnapshot'
stack_trace: |-
  === DATABASE REPLICATION STATUS ===
  cluster={db_cluster}  engine=RDS for PostgreSQL 15.7 (streaming replication)
  --- REPLICATION TOPOLOGY ---
    NODE                     ROLE        LAG_MS    STATUS
    {db_cluster}             PRIMARY     0         OK
    {db_replica}             REPLICA     {db_lag_ms}     BEHIND  <<< ALERT
  --- REPLICA ---
    max_standby_streaming_delay=-1  hot_standby_feedback=off
    startup process wait_event=RecoveryConflictSnapshot
    blocking query: pid={blocking_pid} application_name=ledger-recon-report runtime={blocking_runtime_min}min
    cpu=14%  read_iops=820/12000
  --- IMPACT ---
    stale_balance_reads=YES  read_routing=replica (balance, history)
  ACTION: alert=INFRA-DB-REPL-LAG
correlation_attr:
  key: db.max_standby_streaming_delay
  value: '-1'
fault_params:
  db_cluster: banking-pg-payments
  db_lag_ms: {randint: [15000, 60000]}
  db_max_lag_ms: 3000
  db_replica: banking-pg-payments-replica-1
  db_pending_txns: {randint: [8000, 50000]}
  blocking_pid: {randint: [18000, 32000]}
  blocking_runtime_min: {randint: [31, 48]}
rca_clues:
  payment-engine:
    db.max_standby_streaming_delay: '-1'
    db.replica_wait_event: RecoveryConflictSnapshot
    db.blocking_application: ledger-recon-report
  mobile-gateway:
    gateway.stale_balance_reads_pct: {uniform: [28, 36], round: 1}
  claims-processor:
    claims.claim_status_stale: true
  member-portal:
    portal.balance_inconsistency_reports: {randint: [50, 200]}
error_services:
- payment-engine
service_lag_seconds:
  mobile-gateway: 20
  claims-processor: 60
  member-portal: 60
cascade_messages:
  mobile-gateway:
  - severity: WARN
    message: '[MOBILE] balance_read source=replica replica_lag_ms={db_lag_ms} posted_txns_missing=true endpoint=/api/v1/mobile/accounts status=STALE'
  claims-processor:
  - severity: INFO
    message: '[CLAIMS] claim_status_read source=replica replica_lag_ms={db_lag_ms} status=STALE'
  member-portal:
  - severity: WARN
    message: '[PORTAL] member_feedback type=COMPLAINT topic=balance_missing_transaction status=OPEN'
fault_scope:
  cluster: banking-eks-cluster
  workloads: [payment-engine]
infrastructure_events:
- service: payment-engine
  severity: INFO
  offset_seconds: -120
  body: '[INFRA] cloudtrail eventName=ModifyDBParameterGroup dbParameterGroupName=banking-pg-payments-replica parameter=max_standby_streaming_delay 30000 -> -1 applyMethod=immediate userIdentity=assumed-role/data-eng-oncall reason="ledger-recon-report keeps getting cancelled"'
  attributes:
    operation: cloudtrail
    aws.cloudtrail.event_name: ModifyDBParameterGroup
    db.max_standby_streaming_delay: '-1'
    user.name: assumed-role/data-eng-oncall
- service: payment-engine
  severity: WARN
  offset_seconds: -30
  body: '[INFRA] postgres replica=banking-pg-payments-replica-1 LOG: recovery still waiting after 30012.431 ms: recovery conflict on snapshot DETAIL: Conflicting process: 24117 (ledger-recon-report)'
  attributes:
    operation: replica_log
    db.replica_wait_event: RecoveryConflictSnapshot
remediation_effects:
  transition_seconds: 90
  log_events:
  - service: payment-engine
    severity: INFO
    offset_seconds: 1
    body: '[change-audit] change applied action=restore target=db-parameter-group/banking-pg-payments-replica cmd="opsctl restore db-parameter-group/banking-pg-payments-replica --max-standby-streaming-delay 30s" actor={actor} result="max_standby_streaming_delay -1 -> 30000 (immediate)"'
    attributes:
      operation: change_applied
      change.target: db-parameter-group/banking-pg-payments-replica
      db.max_standby_streaming_delay: 30s
  - service: payment-engine
    severity: INFO
    offset_seconds: 30
    body: '[INFRA] postgres replica=banking-pg-payments-replica-1 FATAL: terminating connection due to conflict with recovery DETAIL: User query might have needed to see row versions that must be removed. application_name=ledger-recon-report'
    attributes:
      operation: replica_log
      db.max_standby_streaming_delay: 30s
  steady_attributes:
    payment-engine:
      db.max_standby_streaming_delay: 30s
  verification:
  - signal: payment_engine.db_replica_lag_ms
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "payment-engine"
    field: metrics.payment_engine.db_replica_lag_ms
    expect: back under 400 ms (was growing past 15,000 ms)
    within_seconds: 150
  - signal: mobile_gateway.stale_read_pct
    from: metrics-generic.otel-default
    where: resource.attributes.service.name == "mobile-gateway"
    field: metrics.mobile_gateway.stale_read_pct
    expect: back under 0.5% (was 28-36%)
    within_seconds: 150
  - signal: replica max_standby_streaming_delay
    from: logs.otel.banking
    where: resource.attributes.service.name == "payment-engine" AND attributes.operation == "replica_status"
    field: attributes.db.max_standby_streaming_delay
    expect: 30s on every line logged since the fix
    within_seconds: 60
  - signal: INFRA-DB-REPL-LAG lines
    from: logs.otel.banking
    where: body.text LIKE "*INFRA-DB-REPL-LAG*"
    expect: 0 new lines
    within_seconds: 150
business_impact:
  - kpi: business.active_digital_sessions
    value: {uniform: [7254.0, 8346.0]}
  - kpi: business.digital_transaction_pct
    factor: {uniform: [0.4, 0.65]}
  - kpi: business.chargeback_rate_pct
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.complaint_tickets_per_min
    factor: {uniform: [2.0, 4.0]}

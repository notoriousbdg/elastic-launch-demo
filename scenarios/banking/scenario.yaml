trace_attributes:
  base:
    member.segment: {choice: [active-duty, veteran, family, retired, guard-reserve]}
    platform.channel: {choice: [mobile, web, api, ivr]}
  services:
    mobile-gateway:
      gateway.platform: {choice: [iOS, Android, iPadOS]}
      gateway.api_version: {choice: [v1.8.2, v1.9.0, v2.0.0-beta, v1.8.5]}
      gateway.session_age_s: 0
      gateway.device_trust_level: {choice: [trusted, registered, unknown]}
    claims-processor:
      claims.type: {choice: [auto_collision, auto_comprehensive, homeowners, renters, life]}
      claims.priority: {choice: [standard, high, urgent, catastrophe]}
      claims.adjuster_pool: {choice: [internal, DRP_network, CAT_team, virtual]}
      claims.fnol_channel: {choice: [mobile_app, call_center, web_portal, agent]}
    payment-engine:
      payment.method: {choice: [ACH, wire, debit_card, bill_pay, P2P, check]}
      payment.amount_tier: {choice: [micro, standard, large, wire_threshold]}
      payment.rail: {choice: [FedACH, FedWire, Visa_Direct, RTP, NACHA_batch]}
      payment.compliance_check: {choice: [OFAC_clear, CTR_pending, SAR_review, clear]}
    policy-manager:
      policy.type: {choice: [auto, homeowners, renters, umbrella, life, VPP]}
      policy.renewal_status: {choice: [active, pending_renewal, grace_period, lapsed]}
      policy.underwriting_tier: {choice: [preferred, standard, non_standard, military_discount]}
      policy.state_jurisdiction: {choice: [TX, VA, CA, FL, NC, GA, WA]}
    fraud-sentinel:
      fraud.risk_score: {randint: [0, 100]}
      fraud.model_version: {choice: [FraudNet-v5.2, FraudNet-v5.3-canary, FraudNet-v5.1]}
      fraud.detection_method: {choice: [ML_ensemble, rules_engine, velocity_check, geo_analysis]}
      fraud.alert_disposition: {choice: [auto_cleared, pending_review, confirmed, escalated]}
    auth-gateway:
      auth.method: {choice: [biometric_face, biometric_fingerprint, mfa_sms, mfa_totp, password, CAC_PIV]}
      auth.device_trust: {choice: [enrolled, verified, new_device, jailbroken_suspect]}
      auth.session_type: {choice: [interactive, api_token, service_account, refresh_token]}
      auth.risk_signal: {choice: [low, medium, elevated, high]}
    quote-engine:
      quote.product_line: {choice: [auto, homeowners, renters, umbrella, VA_mortgage, life]}
      quote.rating_algorithm: {choice: [actuarial_v7, ML_pricing_v3, manual_rate, competitive_match]}
      quote.military_discount_applied: {choice: [true, true, true, false]}
      quote.bundle_eligible: {choice: [true, false]}
    member-portal:
      portal.page_context: {choice: [dashboard, accounts, claims, insurance, investments, settings]}
      portal.session_duration_s: {randint: [30, 1800]}
      portal.accessibility_mode: {choice: [standard, high_contrast, screen_reader, large_text]}
      portal.content_personalization: {choice: [active_duty, veteran, spouse, general]}
    document-vault:
      document.type: {choice: [DD214, COE_VA_loan, claims_photo, policy_dec_page, tax_1099, bank_statement]}
      document.classification: {choice: [PII, PHI, financial, military_record, general]}
      document.storage_tier: {choice: [hot, warm, archive, compliance_hold]}
      document.encryption_status: {choice: [AES256_KMS, AES256_SSE, client_side_encrypted]}

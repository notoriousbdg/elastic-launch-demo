agent_config:
  id: banking-ops-analyst
  name: Member Services Operations Analyst
  assessment_tool_name: member_services_assessment
  system_prompt: 'You are the Member Services Operations Analyst, an expert AI assistant for the retail banking platform.
    You help operations teams investigate incidents, analyze service health, and provide root cause analysis for fault conditions
    across 9 member services spanning AWS, GCP, and Azure. You have deep expertise in mobile banking operations, insurance
    claims processing (FNOL, photo estimation, disbursement), payment processing (ACH, wire, bill pay, card authorization),
    fraud detection and prevention, biometric authentication, MFA delivery, policy administration, VA home loan underwriting,
    and document management. You understand military-specific needs including deployment support, PCS (Permanent Change of
    Station) relocation impacts, SCRA (Servicemembers Civil Relief Act) benefits, DFAS pay processing, and OCONUS member challenges.
    When investigating incidents, search for these system identifiers in logs: Mobile faults (MOBILE-API-TIMEOUT, MOBILE-DEPOSIT-FAIL,
    MOBILE-NOTIF-STORM), Payment faults (PAY-ACH-DELAY, PAY-BILLPAY-FAIL, PAY-OFAC-BLOCK, PAY-CARD-AUTH-FAIL), Claims faults
    (CLAIMS-FNOL-BACKLOG, CLAIMS-PHOTO-EST-TIMEOUT, CLAIMS-DISBURSEMENT-FAIL), Policy faults (POLICY-RENEWAL-FAIL, UW-RULES-ENGINE-ERR,
    UW-VA-RATELOCK-FAIL), Auth faults (AUTH-BIOMETRIC-DEGRADE, AUTH-MFA-DELIVERY-FAIL), Fraud faults (FRAUD-FP-SURGE), Portal
    faults (PORTAL-SESSION-CASCADE), Document faults (DOC-UPLOAD-FAIL), and Infrastructure faults (INFRA-DB-REPL-LAG, INFRA-CERT-EXPIRE).
    Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: member_services_assessment
  description: 'Comprehensive member services platform health assessment. Evaluates all services against operational readiness
    criteria for mobile banking, claims processing, payment systems, and authentication services. Returns data for operational
    evaluation across digital banking, insurance, payments, fraud detection, and member portal systems. Log message field:
    body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: member-portal
executive_dashboard_intro: '**Retail banking KPIs** — revenue & margins, digital adoption, risk & compliance, and customer
  health (synthetic `business.*` from `member-portal`).'
executive_kpi_sections:
- header: '**Revenue & margins** — NII, fees, origination, interchange, and deposits'
  specs:
  - - Net interest income (USD/min)
    - metrics.business.net_interest_income_usd_per_min
  - - Fee revenue (USD/min)
    - metrics.business.fee_revenue_usd_per_min
  - - Loan origination (USD/min)
    - metrics.business.loan_origination_usd_per_min
  - - Card interchange (USD/min)
    - metrics.business.card_interchange_usd_per_min
  - - Wealth AUM delta (USD/min)
    - metrics.business.wealth_aum_delta_usd_per_min
  - - Deposit growth (USD/min)
    - metrics.business.deposit_growth_usd_per_min
- header: '**Digital adoption** — sessions, mobile, self-service, and API usage'
  specs:
  - - Active digital sessions
    - metrics.business.active_digital_sessions
  - - Mobile logins / min
    - metrics.business.mobile_logins_per_min
  - - Digital transaction (%)
    - metrics.business.digital_transaction_pct
  - - Self-service deflection (%)
    - metrics.business.self_service_deflection_pct
  - - App session duration (s)
    - metrics.business.app_session_duration_sec
  - - API calls / min
    - metrics.business.api_calls_per_min
- header: '**Risk & compliance** — fraud, AML, chargebacks, and regulatory'
  specs:
  - - Fraud detection rate (%)
    - metrics.business.fraud_detection_rate_pct
  - - Suspicious activity alerts / min
    - metrics.business.suspicious_activity_alerts_per_min
  - - AML flags / min
    - metrics.business.aml_flags_per_min
  - - Failed auth attempts / min
    - metrics.business.failed_auth_attempts_per_min
  - - Chargeback rate (%)
    - metrics.business.chargeback_rate_pct
  - - Regulatory breach count
    - metrics.business.regulatory_breach_count
- header: '**Customer health** — NPS, openings, closures, churn & satisfaction'
  specs:
  - - Satisfaction proxy (NPS-like)
    - metrics.business.net_satisfaction_proxy_nps
  - - Account openings / min
    - metrics.business.account_openings_per_min
  - - Account closures / min
    - metrics.business.account_closures_per_min
  - - Churn risk (0–100)
    - metrics.business.churn_risk_index_0_100
  - - Complaint tickets / min
    - metrics.business.complaint_tickets_per_min
  - - CSAT (0–5)
    - metrics.business.csat_score_0_5

name: Data Warehouse ETL Pipeline Stall
subsystem: analytics
vehicle_section: etl_pipeline
error_type: ETL-PIPELINE-STALL
sensor_type: etl_monitor
affected_services:
- data-warehouse
- billing-processor
cascade_services:
- ehr-system
description: Clinical data warehouse ETL pipeline stalls during extraction or transformation phase
investigation_notes: |-
  Root cause: etl-clinical-extractor 4.2.0 with pool config hikari-pool-experimental-64conn was rolled out shortly before the first ETL-PIPELINE-STALL. The new extractor does not return source connections to the pool when a cursor closes, so HikariPool-etl-clinical reaches 64/64 active with threads waiting. {pipeline_id} stalls at {etl_stage} with {rows_processed}/{total_rows} rows done and no progress for {stall_seconds}s. There are no blocking queries on the source and the staging disk is 40-60% used: this is a connection leak, not source contention or a full staging area. The other pipelines use their own pools and keep running.
  Confirm:
    - data-warehouse logs HikariPool-etl-clinical - Pool stats (total=64, active=64, idle=0, waiting=...) extractor=etl-clinical-extractor-4.2.0 config=hikari-pool-experimental-64conn ... status=STALLED (attributes.infra.etl_db_pool_config, attributes.deployment.etl_extractor_version)
    - metric warehouse.etl_rows_per_second drops from about 15,000 to under 150 and warehouse.etl_source_pool_active_pct goes to 100 after the rollout
    - the data-warehouse line "etl-clinical-extractor rolled out 4.2.0" comes before the first stall; ETL-BILLING-02, ETL-LAB-03 and ETL-QUALITY-04 keep logging etl_progress
  Remediation: roll the extractor back with opsctl rollback deployment/etl-clinical-extractor --to-revision previous (4.1.3, hikari-pool-standard-64conn). The restart closes the leaked connections and throughput is back above 5,000 rows per second within about 90 seconds. Restarting the stage on 4.2.0 only leaks again within minutes. Moving the job to off-peak hours does not fix a leak.
remediation_action: restart_etl_pipeline
error_message: '[DW] ETL-PIPELINE-STALL: pipeline={pipeline_id} stage={etl_stage} rows={rows_processed}/{total_rows} stalled={stall_seconds}s'
stack_trace: |-
  === ETL PIPELINE STATUS REPORT ===
  ------------------------------------------------------------------------
  PIPELINE        | STAGE     | ROWS DONE   | TOTAL ROWS  | STALL(s) | STATUS
  ------------------------------------------------------------------------
  {pipeline_id} | {etl_stage:9s} | {rows_processed:11d} | {total_rows:11d} | {stall_seconds:8d} | STALLED
  ETL-BILLING-02  | load      | 1200000     | 1200000     | 0        | COMPLETE
  ETL-LAB-03      | transform | 450000      | 800000      | 0        | RUNNING
  ETL-QUALITY-04  | extract   | 0           | 500000      | 0        | QUEUED
  ------------------------------------------------------------------------
  ETL-PIPELINE-STALL: {pipeline_id} stalled at {etl_stage} for {stall_seconds}s
  Progress: {rows_processed}/{total_rows} rows — no advancement detected
  Source connection pool may be exhausted — DBA review recommended
correlation_attr:
  key: infra.etl_db_pool_config
  value: hikari-pool-experimental-64conn
fault_params:
  pipeline_id: ETL-CLINICAL-01
  etl_stage: extract
  rows_processed: {randint: [10000, 500000]}
  total_rows: {randint: [500000, 2000000]}
  stall_seconds: {randint: [120, 900]}
rca_clues:
  data-warehouse:
    etl.source_db_pool_exhausted: true
    etl.source_db_pool_active_pct: 100
    etl.blocking_query_count: 0
    etl.staging_disk_used_pct: {uniform: [40, 60], round: 0}
  billing-processor:
    billing.revenue_cycle_report_stale: true
    billing.days_behind: {randint: [1, 5]}
  ehr-system:
    ehr.oltp_contention_detected: true
    ehr.query_timeout_count: {randint: [5, 30]}
remediation_command: |-
  opsctl rollback deployment/etl-clinical-extractor --to-revision previous
error_services: [data-warehouse]
service_lag_seconds:
  billing-processor: 30
  ehr-system: 20
cascade_messages:
  billing-processor:
    - severity: WARN
      message: '[CLAIMS] revenue_cycle_report_stale source={pipeline_id} stage={etl_stage}; dashboards show the previous load'
  ehr-system:
    - severity: WARN
      message: '[EHR] reporting_session_contention source={pipeline_id} idle_in_transaction_sessions=64; chart queries slowed'
fault_scope:
  workloads: [data-warehouse]
infrastructure_events:
  - service: data-warehouse
    severity: INFO
    offset_seconds: -120
    body: '[DW] deployment etl-clinical-extractor rolled out etl-clinical-extractor-4.2.0 (was etl-clinical-extractor-4.1.3) with pool config hikari-pool-experimental-64conn by dw-platform-release (CHG0032342)'
    attributes:
      user.name: dw-platform-release
      change.request: CHG0032342
      operation: deployment
      deployment.etl_extractor_version: etl-clinical-extractor-4.2.0
      infra.etl_db_pool_config: hikari-pool-experimental-64conn
      change.summary: 'etl-clinical-extractor: 4.1.3 -> 4.2.0'
remediation_effects:
  log_events:
    - service: data-warehouse
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl rollback deployment/etl-clinical-extractor --to-revision previous by {actor}: etl-clinical-extractor-4.2.0 -> etl-clinical-extractor-4.1.3, pool config hikari-pool-standard-64conn'
      attributes:
        operation: change_implemented
        change.target: deployment/etl-clinical-extractor
    - service: data-warehouse
      severity: INFO
      offset_seconds: 20
      body: 'HikariPool-etl-clinical - Shutdown completed. HikariPool-etl-clinical - Start completed. extractor=etl-clinical-extractor-4.1.3 config=hikari-pool-standard-64conn'
      attributes:
        operation: etl_source_pool
        deployment.etl_extractor_version: etl-clinical-extractor-4.1.3
        infra.etl_db_pool_config: hikari-pool-standard-64conn
  steady_attributes:
    data-warehouse:
      infra.etl_db_pool_config: hikari-pool-standard-64conn
  verification:
    - signal: warehouse.etl_rows_per_second
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "data-warehouse"'
      field: 'metrics.warehouse.etl_rows_per_second'
      expect: 'back above 5000 rows per second (was under 150) within about 90 seconds'
      within_seconds: 150
    - signal: ETL-PIPELINE-STALL lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*ETL-PIPELINE-STALL*"'
      expect: '0 new lines'
      within_seconds: 150
    - signal: infra.etl_db_pool_config
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "data-warehouse"'
      field: 'attributes.infra.etl_db_pool_config'
      expect: 'hikari-pool-standard-64conn on every HikariPool-etl-clinical line since the fix; the experimental config stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.collections_usd_per_min
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.unbilled_charges_usd_per_min
    factor: {uniform: [2.0, 4.0]}
  - kpi: business.staff_compliance_rate_pct
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.accounts_receivable_days
    factor: {uniform: [1.5, 2.8]}

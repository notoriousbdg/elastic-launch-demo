name: PACS Storage Capacity Warning
subsystem: radiology
vehicle_section: pacs_storage
error_type: PACS-CAPACITY-CRITICAL
sensor_type: storage_monitor
affected_services:
- imaging-service
- data-warehouse
cascade_services:
- clinical-alerts
- ehr-system
description: PACS archive persistent volume free space approaching critical threshold, risking image loss
investigation_notes: |-
  Root Cause: PACS storage volumes fill when DICOM image retention policies are not enforced, modality worklists generate excessive preliminary/secondary capture images, or archive migration jobs to long-term storage (VNA) have stalled. High-resolution modalities (CT, MRI) consume 500MB-2GB per study. An archive migration job with no successful run in the last 24h, while secondary captures stay below 10% of new objects, points to stalled VNA migration rather than excess image generation or an unenforced retention policy.
  Remediation: 1) Check the archive migration job status: `pacs-admin archive-status --volume {volume_id}`. 2) Trigger emergency archive migration to VNA: `pacs-admin migrate --volume {volume_id} --older-than 90d --destination VNA-TIER2`. 3) Identify and purge orphaned DICOM objects: `pacs-admin cleanup --volume {volume_id} --orphans-only`. 4) Expand the volume if migration is insufficient: `pacs-admin volume-expand --volume {volume_id} --add-tb 10`. 5) Review retention policies per radiology department guidelines. 6) Enable DICOM compression (JPEG2000 lossless) for new studies to reduce storage consumption.
remediation_action: expand_pacs_storage
error_message: '[PACS] PACS-CAPACITY-CRITICAL: volume={volume_id} usage={usage_pct}% threshold={threshold_pct}% remaining={remaining_gb}GB'
stack_trace: |-
  === PACS STORAGE VOLUME REPORT ===
  ------------------------------------------------------------------------
  VOLUME          | TOTAL TB | FREE GB | USAGE% | STATUS
  ------------------------------------------------------------------------
  {volume_id:15s} | 5.0      | {remaining_gb}     | {usage_pct}%  | CRITICAL
  PACS-VOL-02     | 50.0     | 13850   | 72.3%  | OK
  PACS-ARCHIVE-01 | 200.0    | 69800   | 65.1%  | OK
  ------------------------------------------------------------------------
  PACS-CAPACITY-CRITICAL: {volume_id} at {usage_pct}% (threshold: {threshold_pct}%)
  Remaining: {remaining_gb}GB — estimated time to full: <48 hours
  Action required: archive migration or volume expansion
correlation_attr:
  key: infra.pacs_storage_controller
  value: netapp-ontap-9.14.1-patch
fault_params:
  volume_id: PACS-VOL-01
  usage_pct: {uniform: [88.0, 98.5], round: 1}
  threshold_pct: 85.0
  remaining_gb: {randint: [50, 500]}
rca_clues:
  imaging-service:
    pacs.archive_migration_stalled: true
    pacs.archive_migration_last_success_h: {randint: [48, 168]}
    pacs.secondary_capture_ratio_pct: {uniform: [2, 5], round: 1}
    pacs.volume_fill_rate_gb_day: {uniform: [250, 600], round: 0}
  data-warehouse:
    etl.imaging_archive_full: true
    etl.vna_migration_pending: {randint: [500, 5000]}
  clinical-alerts:
    alerts.storage_critical_fired: true
  ehr-system:
    ehr.new_study_routing: blocked
business_impact:
  - kpi: business.imaging_worklist_size
    factor: {uniform: [2.0, 4.5]}
  - kpi: business.order_turnaround_min
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.hcahps_proxy_score
    factor: {uniform: [0.30, 0.60]}
  - kpi: business.patient_safety_events_per_min
    factor: {uniform: [1.5, 3.0]}
generator_impact:
  kubernetes_otel:
    persistent_volume_space_low: 10.0

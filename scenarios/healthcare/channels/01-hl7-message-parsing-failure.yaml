name: HL7 Message Parsing Failure
subsystem: clinical_records
vehicle_section: adt_interface
error_type: HL7-ACK-AE
sensor_type: hl7_parser
affected_services:
- ehr-system
- lab-integration
cascade_services:
- patient-monitor
- clinical-alerts
description: HL7 v2.x message parsing fails due to malformed segments or unsupported message types in the ADT interface
investigation_notes: |-
  Root cause: Mirth channel ADT-INBOUND revision r42 was deployed shortly before the first HL7-ACK-AE. r42 turned on strict HL7 v2.5.1 inbound validation, but the registration system still sends v2.3.1 (MSH-12 = 2.3.1). Every {msg_type} whose {hl7_segment} uses a v2.3.1 field encoding now gets an AE acknowledgment at position {position}. The messages are valid for the version they declare: there are no Z-segments and the source system has not changed. The ADT-FEED channels and ORU result traffic parse normally.
  Confirm:
    - ehr-system logs [EHR] hl7_interface channel=ADT-INBOUND revision=r42 validation=strict-2.5.1 ... status=DEGRADED (attributes.hl7.channel_revision); metric ehr.hl7_ack_ae_pct rises from under 0.5% to 35-45% after the deploy
    - the ehr-system line "Mirth channel ADT-INBOUND deployed revision r42" comes before the first HL7-ACK-AE
    - rca attributes hl7.msh_version 2.3.1 and hl7.z_segment_count 0 on the error lines
  Remediation: roll the channel back to r41 (lenient validation) with opsctl rollback channel/adt-inbound --to-revision previous. The AE rate falls back under 0.5% within about 60 seconds. Restarting the HL7 listener does not help: it comes back on r42 with the same validation. Getting the registration vendor onto v2.5.1 is the long-term fix, not an incident action. Messages that errored during the incident stay in the Mirth error queue and are reprocessed after the rollback.
remediation_action: restart_hl7_interface
error_message: '[EHR] HL7-ACK-AE: msg_type={msg_type} segment={hl7_segment} position={position} patient={mrn}'
stack_trace: |-
  MSH|^~\&|EHR-CORE|FACILITY-01|LAB-LIS|LAB-01|20260217143052||{msg_type}|MSG-{mrn}.001|P|2.3.1|||AL|NE
  EVN||20260217143052|||ADMIN-SYS
  PID|1||{mrn}^^^FACILITY-01^MR||DOE^JANE^M||19650315|F|||123 MAIN ST^^ANYTOWN^ST^12345||555-0100|||M|NON|{encounter_id}
  {hl7_segment}|<<< PARSE ERROR at position {position} >>>
  --- ACK ---
  MSH|^~\&|LAB-LIS|LAB-01|EHR-CORE|FACILITY-01|20260217143052||ACK^{msg_type}|ACK-{mrn}.001|P|2.5.1
  MSA|AE|MSG-{mrn}.001|HL7-ACK-AE: Segment {hl7_segment} at position {position} contains invalid field encoding
  ERR||{hl7_segment}^1^{position}|102^Data type error^HL70357|E||||Invalid field encoding
correlation_attr:
  key: hl7.channel_revision
  value: r42
fault_params:
  msg_type: {choice: ["ADT^A01", "ADT^A03", "ADT^A04", "ADT^A08"]}
  hl7_segment: {choice: [PID, PV1, NK1, DG1]}
  position: {randint: [1, 25]}
  mrn:
    format: "MRN-{n}"
    n: {randint: [1000000, 9999999]}
  encounter_id:
    format: "ENC-{n}"
    n: {randint: [100000, 999999]}
rca_clues:
  ehr-system:
    hl7.segment_encoding: non_standard_field_encoding
    hl7.z_segment_count: 0
    hl7.msh_version: "2.3.1"
  lab-integration:
    hl7.oru_queue_depth: {randint: [200, 800]}
    hl7.ack_disposition: AE
  patient-monitor:
    upstream.ehr_feed_status: degraded
    vitals.documentation_lag_s: {randint: [30, 120]}
  clinical-alerts:
    alerts.ehr_integration_status: stale_data
    alerts.suppressed_count: {randint: [5, 30]}
remediation_command: |-
  opsctl rollback channel/adt-inbound --to-revision previous
error_services: [ehr-system]
service_lag_seconds:
  lab-integration: 20
  patient-monitor: 30
  clinical-alerts: 45
cascade_messages:
  lab-integration:
    - severity: WARN
      message: '[LIS] adt_update_rejected source=EHR-CORE msg_type={msg_type} patient={mrn} reason=PATIENT_NOT_REGISTERED; specimen labels held'
  patient-monitor:
    - severity: WARN
      message: '[MONITOR] adt_admit_pending patient={mrn} encounter={encounter_id} reason=NO_ADT_FROM_EHR; bed assignment not updated'
  clinical-alerts:
    - severity: WARN
      message: '[CDS] patient_context_stale patient={mrn} encounter={encounter_id} reason=ADT_UPDATE_MISSING; rules evaluated on last known location'
fault_scope:
  workloads: [ehr-system]
infrastructure_events:
  - service: ehr-system
    severity: INFO
    offset_seconds: -120
    body: '[EHR] Mirth channel ADT-INBOUND deployed revision r42 (was r41): inbound validation strict-2.5.1 enabled by integration-release (CHG0031842)'
    attributes:
      user.name: integration-release
      change.request: CHG0031842
      operation: channel_deploy
      hl7.channel_revision: r42
      hl7.inbound_validation: strict-2.5.1
      change.summary: 'ADT-INBOUND: r41 -> r42 (strict v2.5.1 validation)'
remediation_effects:
  log_events:
    - service: ehr-system
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl rollback channel/adt-inbound --to-revision previous by {actor}: ADT-INBOUND r42 -> r41, inbound validation lenient'
      attributes:
        operation: change_implemented
        change.target: channel/adt-inbound
    - service: ehr-system
      severity: INFO
      offset_seconds: 15
      body: '[EHR] Mirth channel ADT-INBOUND deployed revision r41: inbound validation lenient; listener 2575 accepting'
      attributes:
        operation: channel_deploy
        hl7.channel_revision: r41
        hl7.inbound_validation: lenient
  steady_attributes:
    ehr-system:
      hl7.channel_revision: r41
  verification:
    - signal: ehr.hl7_ack_ae_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "ehr-system"'
      field: 'metrics.ehr.hl7_ack_ae_pct'
      expect: 'back under 0.5% (was 35-45%) within about 60 seconds'
      within_seconds: 120
    - signal: HL7-ACK-AE lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*HL7-ACK-AE*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: hl7.channel_revision
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "ehr-system"'
      field: 'attributes.hl7.channel_revision'
      expect: 'r41 on every hl7_interface line since the fix; r42 stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.hl7_messages_per_min
    value: {uniform: [513.83, 591.18]}
  - kpi: business.ehr_response_time_ms
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.order_turnaround_min
    factor: {uniform: [1.6, 3.0]}
  - kpi: business.patient_safety_events_per_min
    value: {uniform: [0.68, 0.79], round: 3}

name: Vital Signs Alert Storm
subsystem: vital_signs
vehicle_section: vitals_engine
error_type: VITAL-ALERT-STORM
sensor_type: vital_signs_monitor
affected_services:
- patient-monitor
- clinical-alerts
cascade_services:
- ehr-system
description: Excessive simultaneous vital sign alerts overwhelming the alerting pipeline from bedside monitors
investigation_notes: |-
  Root cause: the adult-icu-v7 alarm-limit profile was loaded on the {nursing_unit} central station shortly before the alarm storm. Its ICU limits (HR 50-110 bpm, SpO2 low 94%) fire on ordinary MedSurg readings: patient {patient_id} at HR {heart_rate} bpm and SpO2 {spo2}% is inside the MedSurg defaults (HR 40-150 bpm, SpO2 low 90%). The unit logged {alert_count} alarms in {window_seconds}s with no probe disconnects, and MedSurg-4S on medsurg-default stays quiet. This is a configuration problem, not a patient event or a sensor fault.
  Confirm:
    - patient-monitor logs [MONITOR] central_station unit=MedSurg-4N profile=adult-icu-v7 hr_limits=50-110bpm ... status=ALARM_FLOOD (attributes.vitals.alarm_profile); MedSurg-4S shows profile=medsurg-default status=OK
    - metric patient_monitor.alerts_per_minute rises from 3-13 to 60-120 after the profile load, all of the increase from MedSurg-4N
    - the patient-monitor line "alarm profile adult-icu-v7 loaded" comes before the first VITAL-ALERT-STORM; probe_off_1m stays 0
  Remediation: load the MedSurg profile back onto the unit with opsctl apply alarm-profile/medsurg-4n --profile medsurg-default. New alarms stop at once and the per-minute count falls back to baseline within about 90 seconds as the active alarms are acknowledged. Recalibrating the monitors or restarting the vitals aggregator does nothing (the sensors are fine), and adding dedup windows only hides alarms behind the wrong limits.
remediation_action: recalibrate_monitors
error_message: '[MONITOR] VITAL-ALERT-STORM: unit={nursing_unit} alerts={alert_count} window={window_seconds}s patient={patient_id}
  hr={heart_rate} spo2={spo2}%'
stack_trace: |-
  === BEDSIDE MONITOR ALERT SUMMARY — {nursing_unit} ===
  Interval: {window_seconds}s | Total Alerts: {alert_count} | Threshold: 10/60s
  ------------------------------------------------------------------------
  PATIENT     | PARAM   | VALUE   | LIMIT   | PRIORITY  | STATUS
  ------------------------------------------------------------------------
  {patient_id} | HR      | {heart_rate} bpm | 50-110  | CRITICAL  | UNACKED
  {patient_id} | SpO2    | {spo2}%    | >94%    | HIGH      | UNACKED
  {patient_id} | RR      | 28 br/m | 8-25    | MEDIUM    | UNACKED
  PT-XXXXXX  | BP-SYS  | 185 mmHg| <180    | HIGH      | UNACKED
  PT-XXXXXX  | TEMP    | 39.8 C  | <38.5   | MEDIUM    | ESCALATED
  ------------------------------------------------------------------------
  VITAL-ALERT-STORM: {alert_count} alerts in {window_seconds}s exceeds storm threshold on {nursing_unit}
  ACTION: Alert pipeline saturated — downstream CDS rule evaluation delayed
correlation_attr:
  key: vitals.alarm_profile
  value: adult-icu-v7
fault_params:
  nursing_unit: MedSurg-4N
  alert_count: {randint: [60, 110]}
  window_seconds: 60
  patient_id:
    format: "PT-{n}"
    n: {randint: [100000, 999999]}
  heart_rate: {randint: [111, 140]}
  spo2: {randint: [91, 93]}
rca_clues:
  patient-monitor:
    vitals.threshold_config: mismatched_acuity
    vitals.probe_disconnect_count: 0
    vitals.alarm_profile: adult-icu-v7
  clinical-alerts:
    alerts.storm_window_s: {randint: [30, 120]}
    alerts.dedup_disabled: true
  ehr-system:
    upstream.vitals_feed_status: flooded
    ehr.cds_queue_depth: {randint: [100, 500]}
remediation_command: |-
  opsctl apply alarm-profile/medsurg-4n --profile medsurg-default
error_services: [patient-monitor]
service_lag_seconds:
  clinical-alerts: 15
  ehr-system: 30
cascade_messages:
  clinical-alerts:
    - severity: WARN
      message: '[CDS] alert_queue_backlog source=central_station unit={nursing_unit} alarms={alert_count}/{window_seconds}s; vital sign rule evaluation delayed'
  ehr-system:
    - severity: WARN
      message: '[EHR] vitals_flowsheet_backlog unit={nursing_unit} patient={patient_id} alarms={alert_count}; alarm documentation queue delayed'
fault_scope:
  workloads: [patient-monitor]
infrastructure_events:
  - service: patient-monitor
    severity: INFO
    offset_seconds: -120
    body: '[MONITOR] central_station unit=MedSurg-4N alarm profile adult-icu-v7 loaded (was medsurg-default) from template push ICU-ALARM-2026Q4 by biomed-clinical-eng (CHG0031876)'
    attributes:
      user.name: biomed-clinical-eng
      change.request: CHG0031876
      operation: alarm_profile_load
      vitals.unit: MedSurg-4N
      vitals.alarm_profile: adult-icu-v7
      change.summary: 'MedSurg-4N alarm profile: medsurg-default -> adult-icu-v7'
remediation_effects:
  log_events:
    - service: patient-monitor
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl apply alarm-profile/medsurg-4n --profile medsurg-default by {actor}: MedSurg-4N adult-icu-v7 -> medsurg-default'
      attributes:
        operation: change_implemented
        change.target: alarm-profile/medsurg-4n
    - service: patient-monitor
      severity: INFO
      offset_seconds: 5
      body: '[MONITOR] central_station unit=MedSurg-4N alarm profile medsurg-default loaded: HR 40-150 bpm, SpO2 low 90%'
      attributes:
        operation: alarm_profile_load
        vitals.unit: MedSurg-4N
        vitals.alarm_profile: medsurg-default
  steady_attributes:
    patient-monitor:
      vitals.alarm_profile: medsurg-default
  verification:
    - signal: patient_monitor.alerts_per_minute
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "patient-monitor"'
      field: 'metrics.patient_monitor.alerts_per_minute'
      expect: 'back to 3-13 alarms per minute across units (was 60-120) within about 90 seconds'
      within_seconds: 150
    - signal: VITAL-ALERT-STORM lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*VITAL-ALERT-STORM*"'
      expect: '0 new lines'
      within_seconds: 150
    - signal: vitals.alarm_profile
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "patient-monitor"'
      field: 'attributes.vitals.alarm_profile'
      expect: 'medsurg-default on the MedSurg-4N central_station lines; adult-icu-v7 stops appearing'
      within_seconds: 150
business_impact:
  - kpi: business.patient_safety_events_per_min
    factor: {uniform: [2.0, 5.0]}
  - kpi: business.hcahps_proxy_score
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.staff_compliance_rate_pct
    factor: {uniform: [0.30, 0.60]}
  - kpi: business.readmission_risk_index_0_100
    factor: {uniform: [1.5, 2.8]}

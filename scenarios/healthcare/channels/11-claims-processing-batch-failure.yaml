name: Claims Processing Batch Failure
subsystem: billing
vehicle_section: claims_engine
error_type: X12-837-REJECT
sensor_type: x12_837
affected_services:
- billing-processor
- data-warehouse
cascade_services:
- ehr-system
- scheduling-api
description: Batch claims processing pipeline fails during X12 837 generation or submission
investigation_notes: |-
  Root cause: claims-837-generator x12-837-processor-v5.1.2-beta was rolled out shortly before the first X12-837-REJECT. It builds the CLM segment incorrectly, so payer 999 acknowledgments reject the claims at segment CLM (IK3*CLM): batch {batch_id}, claim {claim_id} for patient {patient_id} to {payer_id}. 30-46% of claims are rejected (normally 1-3%). ISA envelope validation passes and payer 277 rejections are 0, so the claims never reach adjudication. The generator is producing bad claims; the payers are not denying good ones.
  Confirm:
    - billing-processor logs [CLAIMS] batch_status ... ack_999=P generator=x12-837-processor-v5.1.2-beta ... rcm=REJECTIONS (attributes.deployment.claims_engine_build, attributes.x12.batch_rejection_rate_pct)
    - metric billing.claim_999_reject_pct rises from 1-3% to 30-46% after the rollout
    - the billing-processor line "claims-837-generator rolled out x12-837-processor-v5.1.2-beta" comes before the first rejection
  Remediation: two steps, in order. opsctl rollback deployment/claims-837-generator --to-revision previous returns the generator to v5.1.1. opsctl run job/resubmit-rejected-837 then regenerates and resubmits the rejected claims. The rejection rate is back to 1-3% within about 90 seconds. Resubmitting without the rollback only produces more rejections.
remediation_action: resubmit_claims_batch
error_message: '[CLAIMS] X12-837-REJECT: batch={batch_id} claim={claim_id} patient={patient_id} payer={payer_id} stage={claim_stage}'
stack_trace: |-
  --- X12 837 CLAIM SUBMISSION TRACE ---
  >>> 837 Professional Claim
  ISA*00*          *00*          *ZZ*FACILITY-01    *ZZ*{payer_id:15s}*260217*1430*^*00501*000000001*0*P*:
  GS*HC*FACILITY-01*{payer_id}*20260217*1430*0001*X*005010X222A1
  ST*837*0001*005010X222A1
  BHT*0019*00*{batch_id}*20260217*1430*CH
  CLM*{claim_id}*5000***1A:B:1*Y*A*Y*Y
  NM1*IL*1*DOE*JANE****MI*{insurance_id}
  SE*8*0001
  <<< 999 Acknowledgment
    AK1*HC*0001*005010X222A1
    AK2*837*0001*005010X222A1
    IK3*CLM*4*2300*8
    IK4*5:1*1331*7*1A
    IK5*R*5
    AK9*R*1*1*0
  X12-837-REJECT: Claim {claim_id} in batch {batch_id} rejected at {claim_stage}
  Patient: {patient_id} | Payer: {payer_id} | Queued for correction
correlation_attr:
  key: deployment.claims_engine_build
  value: x12-837-processor-v5.1.2-beta
fault_params:
  batch_id:
    format: "BATCH-{n}"
    n: {randint: [1000, 9999]}
  claim_id:
    format: "CLM-{n}"
    n: {randint: [100000, 999999]}
  patient_id:
    format: "PT-{n}"
    n: {randint: [100000, 999999]}
  payer_id: {choice: [BCBS-001, AETNA-002, UHC-003, CIGNA-004, MDCR-005, MDCD-006]}
  claim_stage: validation
  insurance_id:
    format: "INS-{n}"
    n: {randint: [100000, 999999]}
rca_clues:
  billing-processor:
    x12.batch_rejection_rate_pct: {uniform: [30, 46], round: 1}
    x12.isa_envelope_validation: pass
    x12.ik3_error_segment: CLM
    x12.payer_277_rejections: 0
  data-warehouse:
    etl.claims_feed_stalled: true
    etl.pending_claim_records: {randint: [500, 5000]}
  ehr-system:
    ehr.unbilled_encounters: {randint: [20, 100]}
  scheduling-api:
    sched.charge_capture_lag_s: {randint: [300, 1800]}
remediation_command: |-
  opsctl rollback deployment/claims-837-generator --to-revision previous
  opsctl run job/resubmit-rejected-837
error_services: [billing-processor]
service_lag_seconds:
  data-warehouse: 20
  ehr-system: 30
  scheduling-api: 45
cascade_messages:
  data-warehouse:
    - severity: WARN
      message: '[DW] claims_feed_hold batch={batch_id} claim={claim_id} payer={payer_id} reason=999_REJECTED; revenue cycle extract waiting'
  ehr-system:
    - severity: WARN
      message: '[EHR] encounter_unbilled patient={patient_id} claim={claim_id} reason=CLAIM_REJECTED_999'
  scheduling-api:
    - severity: WARN
      message: '[SCHED] charge_capture_hold patient={patient_id} claim={claim_id} payer={payer_id}'
fault_scope:
  workloads: [billing-processor]
infrastructure_events:
  - service: billing-processor
    severity: INFO
    offset_seconds: -120
    body: '[CLAIMS] deployment claims-837-generator rolled out x12-837-processor-v5.1.2-beta (was x12-837-processor-v5.1.1): CLM segment builder refactor by rcm-engineering-release (CHG0032188)'
    attributes:
      user.name: rcm-engineering-release
      change.request: CHG0032188
      operation: deployment
      deployment.claims_engine_build: x12-837-processor-v5.1.2-beta
      change.summary: 'claims-837-generator: v5.1.1 -> v5.1.2-beta'
remediation_effects:
  log_events:
    - service: billing-processor
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl rollback deployment/claims-837-generator --to-revision previous by {actor}: x12-837-processor-v5.1.2-beta -> x12-837-processor-v5.1.1'
      attributes:
        operation: change_implemented
        change.target: deployment/claims-837-generator
    - service: billing-processor
      severity: INFO
      offset_seconds: 2
      body: '[CHG] CHANGE IMPLEMENTED opsctl run job/resubmit-rejected-837 by {actor}: regenerating 999-rejected claims with x12-837-processor-v5.1.1'
      attributes:
        operation: change_implemented
        change.target: job/resubmit-rejected-837
  steady_attributes:
    billing-processor:
      deployment.claims_engine_build: x12-837-processor-v5.1.1
  verification:
    - signal: billing.claim_999_reject_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "billing-processor"'
      field: 'metrics.billing.claim_999_reject_pct'
      expect: 'back to 1-3% (was 30-46%) within about 90 seconds'
      within_seconds: 180
    - signal: X12-837-REJECT lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*X12-837-REJECT*"'
      expect: '0 new lines'
      within_seconds: 180
    - signal: deployment.claims_engine_build
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "billing-processor"'
      field: 'attributes.deployment.claims_engine_build'
      expect: 'x12-837-processor-v5.1.1 on every batch_status line since the fix; v5.1.2-beta stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.claims_submitted_per_min
    value: {uniform: [7.25, 8.35]}
  - kpi: business.clean_claim_rate_pct
    factor: {uniform: [0.15, 0.4]}
  - kpi: business.collections_usd_per_min
    factor: {uniform: [0.15, 0.4]}
  - kpi: business.denials_per_min
    factor: {uniform: [2.5, 5.5]}
  - kpi: business.accounts_receivable_days
    factor: {uniform: [1.8, 3.5]}

name: ADT Feed Synchronization Gap
subsystem: clinical_records
vehicle_section: adt_interface
error_type: ADT-SYNC-FAIL
sensor_type: adt_feed
affected_services:
- ehr-system
- scheduling-api
cascade_services:
- patient-monitor
- billing-processor
- lab-integration
description: ADT (Admit-Discharge-Transfer) event feed consumer falls behind on the ADT Kafka topic, causing stale patient location data
investigation_notes: |-
  Root cause: the queue threads on Mirth channel ADT-FEED-02 were cut from 8 to 1 by a change shortly before the first ADT-SYNC-FAIL. ADT events arrive at 2-6 per second and a single thread drains only 0.2-0.8 per second, so {feed_id} builds a queue of {queue_depth} events and falls {gap_seconds}s behind: patient {patient_id}'s {adt_event_type} is not delivered yet. ADT-FEED-01 and ADT-FEED-03 still run 8 threads and stay current, which rules out an inbound surge or a slow downstream database.
  Confirm:
    - ehr-system logs [EHR] adt_feed feed=ADT-FEED-02 queue_threads=1 ... status=LAGGING (attributes.adt.queue_threads, attributes.adt.queue_drain_rate_per_s); ADT-FEED-01 and ADT-FEED-03 show queue_threads=8 status=CURRENT
    - metric ehr.adt_feed_lag_seconds rises from 0.5-3s to 300-420s after the change; Kafka consumer lag on the ADT topic climbs
    - the ehr-system line "Mirth channel ADT-FEED-02 settings updated: queue threads 8 -> 1" comes before the first sync failure
  Remediation: restore the thread count with opsctl patch channel/adt-feed-02 --queue-threads 8. The drain rate jumps above the arrival rate and the backlog works off: lag is back under 10 seconds within about 150 seconds. Restarting the channel does not help, because the queue is persistent and still single-threaded. Skipping the backlog would lose admits, transfers and discharges.
remediation_action: restart_adt_feed
error_message: '[EHR] ADT-SYNC-FAIL: feed={feed_id} lag={gap_seconds}s queue_depth={queue_depth} patient={patient_id} event={adt_event_type}'
stack_trace: |-
  === ADT FEED STATUS — {feed_id} ===
  Feed Lag: {gap_seconds}s | Queue Depth: {queue_depth} | Threshold: 30s
  ------------------------------------------------------------------------
  SEQ    | EVENT | PATIENT     | TIMESTAMP   | STATUS
  ------------------------------------------------------------------------
  001247 | {adt_event_type}    | {patient_id}  | 20260217143052 | QUEUED
  001246 | A08   | PT-887432   | 20260217143052 | QUEUED
  001245 | A03   | PT-556201   | 20260217143052 | QUEUED
  001244 | A01   | PT-334789   | 20260217143052 | DELIVERED
  ------------------------------------------------------------------------
  ADT-SYNC-FAIL: {feed_id} lagging {gap_seconds}s with {queue_depth} events queued
  Patient {patient_id} event {adt_event_type} pending delivery
  Downstream systems receiving stale location data
correlation_attr:
  key: adt.queue_threads
  value: 1
fault_params:
  feed_id: ADT-FEED-02
  gap_seconds: {randint: [300, 420]}
  queue_depth: {randint: [600, 2500]}
  patient_id:
    format: "PT-{n}"
    n: {randint: [100000, 999999]}
  adt_event_type: {choice: [A01, A02, A03, A04, A08]}
rca_clues:
  ehr-system:
    adt.feed_processor_threads_exhausted: true
    adt.queue_drain_rate_per_s: {uniform: [0.2, 0.8], round: 1}
    adt.inbound_event_rate_per_s: {uniform: [2.0, 6.0], round: 1}
  scheduling-api:
    sched.patient_location_stale: true
    sched.bed_board_accuracy_pct: {uniform: [60, 85], round: 1}
  patient-monitor:
    vitals.patient_assignment_stale: true
    vitals.affected_beds: {randint: [5, 20]}
  billing-processor:
    billing.encounter_sync_lag_s: {randint: [120, 600]}
  lab-integration:
    lis.specimen_routing_stale: true
    lis.misrouted_results: {randint: [2, 10]}
remediation_command: |-
  opsctl patch channel/adt-feed-02 --queue-threads 8
error_services: [ehr-system]
generator_hold_seconds:
  kafka_otel: 150
service_lag_seconds:
  scheduling-api: 20
  patient-monitor: 30
  lab-integration: 40
  billing-processor: 45
cascade_messages:
  scheduling-api:
    - severity: WARN
      message: '[SCHED] patient_location_stale feed={feed_id} patient={patient_id} event={adt_event_type} lag={gap_seconds}s'
  patient-monitor:
    - severity: WARN
      message: '[MONITOR] patient_assignment_stale patient={patient_id} event={adt_event_type} source={feed_id}'
  billing-processor:
    - severity: WARN
      message: '[CLAIMS] encounter_sync_lag patient={patient_id} event={adt_event_type} lag={gap_seconds}s'
  lab-integration:
    - severity: WARN
      message: '[LIS] specimen_routing_stale patient={patient_id} event={adt_event_type} source={feed_id}'
fault_scope:
  workloads: [ehr-system]
infrastructure_events:
  - service: ehr-system
    severity: INFO
    offset_seconds: -120
    body: '[EHR] Mirth channel ADT-FEED-02 settings updated: queue threads 8 -> 1 (message ordering investigation) by integration-oncall (CHG0032317)'
    attributes:
      user.name: integration-oncall
      change.request: CHG0032317
      operation: channel_config
      adt.feed_id: ADT-FEED-02
      adt.queue_threads: 1
      change.summary: 'ADT-FEED-02 queue threads: 8 -> 1'
remediation_effects:
  log_taper_seconds: 90
  log_events:
    - service: ehr-system
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl patch channel/adt-feed-02 --queue-threads 8 by {actor}: ADT-FEED-02 queue threads 1 -> 8'
      attributes:
        operation: change_implemented
        change.target: channel/adt-feed-02
    - service: ehr-system
      severity: INFO
      offset_seconds: 5
      body: '[EHR] Mirth channel ADT-FEED-02 queue threads=8 active; draining backlog'
      attributes:
        operation: channel_config
        adt.feed_id: ADT-FEED-02
        adt.queue_threads: 8
  steady_attributes:
    ehr-system:
      adt.queue_threads: 8
  verification:
    - signal: ehr.adt_feed_lag_seconds
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "ehr-system"'
      field: 'metrics.ehr.adt_feed_lag_seconds'
      expect: 'back under 10 seconds (was 300-420s) within about 150 seconds as the backlog drains'
      within_seconds: 240
    - signal: ADT-SYNC-FAIL lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*ADT-SYNC-FAIL*"'
      expect: '0 new lines'
      within_seconds: 240
    - signal: adt.queue_threads
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "ehr-system" AND attributes.adt.feed_id == "ADT-FEED-02"'
      field: 'attributes.adt.queue_threads'
      expect: '8 on every ADT-FEED-02 adt_feed line since the fix; 1 stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.admits_per_min
    value: {uniform: [0.3, 0.34], round: 2}
  - kpi: business.discharges_per_min
    value: {uniform: [0.22, 0.26], round: 2}
  - kpi: business.hl7_messages_per_min
    value: {uniform: [513.83, 591.18]}
  - kpi: business.unbilled_charges_usd_per_min
    factor: {uniform: [1.8, 3.5]}
generator_impact:
  kafka_otel:
    high_consumer_lag_by_topic: 75000.0

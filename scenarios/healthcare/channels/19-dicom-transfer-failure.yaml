name: DICOM Transfer Failure
subsystem: radiology
vehicle_section: pacs_gateway
error_type: DICOM-STORE-FAIL
sensor_type: dicom_transfer
affected_services:
- imaging-service
- ehr-system
cascade_services:
- clinical-alerts
- data-warehouse
description: DICOM C-STORE or C-MOVE operation fails during modality-to-PACS image transfer
investigation_notes: |-
  Root Cause: DICOM association failures (status 0xA700/0xA900) indicate either AE title mismatch, transfer syntax negotiation failure, or storage commitment refusal. The PACS SCP rejects the C-STORE when the Presentation Context (Abstract Syntax + Transfer Syntax) is not in the accepted list. Here the association is accepted (A-ASSOCIATE-AC) with Explicit VR Little Endian, which rules out AE title and transfer syntax problems, and the C-STORE fails with 0xA900 (data set does not match SOP class). Since the dcm4chee-5.31.1-patch3 gateway build, the modality routing rule negotiates CT Image Storage for every modality, so MR, US, MG, NM and DX images arrive on a CT presentation context and the SCP rejects them. Fix the routing rule's abstract syntax per modality (or roll back the gateway build).
  Remediation: 1) Verify the DICOM association: `echoscu -b {modality}-SCU -c PACS-SCP-01@pacs-host:11112`. 2) Reset the DICOM association: `pacs-admin reset-association --ae-title {modality}-SCU`. 3) Check the PACS gateway connection pool: `pacs-admin gateway-status`. 4) If persistent, restart the PACS gateway service: `systemctl restart dcm4chee-arc`. 5) Verify transfer syntax compatibility — ensure Explicit VR Little Endian (1.2.840.10008.1.2.1) is configured. 6) For C-MOVE failures, verify the destination AE title is registered in the DICOM configuration.
remediation_action: restart_pacs_gateway
error_message: '[PACS] DICOM-STORE-FAIL: study={dicom_study_uid} modality={modality} operation={dicom_operation} status={dicom_error_code}'
stack_trace: |-
  A-ASSOCIATE-RQ PDU
    Called AE Title:  PACS-SCP-01
    Calling AE Title: {modality}-SCU
    Application Context: 1.2.840.10008.3.1.1.1
    Presentation Context:
      Abstract Syntax: 1.2.840.10008.5.1.4.1.1.2 (CT Image Storage)
      Transfer Syntax: 1.2.840.10008.1.2.1 (Explicit VR Little Endian)
  A-ASSOCIATE-AC — Association accepted
  {dicom_operation}-RQ | Study: {dicom_study_uid} | Series: 1 of 3
  {dicom_operation}-RSP | Status: {dicom_error_code} | FAILURE
    Error Comment: DICOM-STORE-FAIL — Data Set does not match SOP Class ({modality} dataset on CT Image Storage context)
    Affected SOP Instance: {dicom_study_uid}.1.1
  A-RELEASE-RQ
  A-RELEASE-RP — Association released
correlation_attr:
  key: infra.pacs_gateway_build
  value: dcm4chee-5.31.1-patch3
fault_params:
  dicom_study_uid:
    format: "1.2.840.{a}.{b}.{c}"
    a: {randint: [10000, 99999]}
    b: {randint: [1, 999]}
    c: {randint: [1, 99]}
  modality: {choice: [MR, US, MG, NM, DX]}
  dicom_operation: C-STORE
  dicom_error_code: "0xA900"
rca_clues:
  imaging-service:
    dicom.association_result: accepted
    dicom.cstore_status: "0xA900"
    dicom.transfer_syntax: 1.2.840.10008.1.2.1
    dicom.negotiated_sop_class: CT Image Storage
    dicom.dataset_sop_class_matches: false
  ehr-system:
    ehr.pending_imaging_results: {randint: [5, 30]}
    ehr.pacs_link_status: connected
  clinical-alerts:
    alerts.imaging_delay_count: {randint: [2, 10]}
  data-warehouse:
    etl.imaging_archive_stalled: true
    etl.pending_studies: {randint: [20, 100]}
business_impact:
  - kpi: business.imaging_worklist_size
    factor: {uniform: [2.5, 5.5]}
  - kpi: business.order_turnaround_min
    factor: {uniform: [2.0, 4.0]}
  - kpi: business.patient_safety_events_per_min
    factor: {uniform: [1.5, 3.0]}
  - kpi: business.hcahps_proxy_score
    factor: {uniform: [0.25, 0.55]}

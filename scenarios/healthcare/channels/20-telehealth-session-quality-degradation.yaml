name: Telehealth Session Quality Degradation
subsystem: vital_signs
vehicle_section: telehealth_engine
error_type: TELEHEALTH-QOS-DEGRAD
sensor_type: telehealth_qos
affected_services:
- patient-monitor
- clinical-alerts
cascade_services:
- ehr-system
- scheduling-api
description: Telehealth video session quality degrades below clinical acceptability threshold
investigation_notes: |-
  Root cause: coturn config coturn-4.6.2-high-concurrency was applied to the turn-us-east-1 relay pool shortly before the first TELEHEALTH-QOS-DEGRAD. It cut relay-threads from 8 to 2 and packed more sessions onto each thread. The two relay threads run at 95-100% CPU while the host sits at 22-34%, and relayed media packets are dropped: session {session_id} (patient {patient_id}) sees {packet_loss_pct}% loss, {latency_ms}ms latency and {bitrate_kbps}kbps. Client bandwidth is 2.5-8 Mbps, so the patients' networks are not the cause.
  Confirm:
    - patient-monitor logs [MONITOR] turn_relay pool=turn-us-east-1 relay_threads=2 thread_cpu_max=95-100% host_cpu=22-34% ... config=coturn-4.6.2-high-concurrency status=DEGRADED (attributes.infra.turn_server_build, attributes.telehealth.relay_threads)
    - metric patient_monitor.telehealth_packet_loss_pct rises from 0.1-0.8% to 8-16% and patient_monitor.turn_relay_thread_cpu_pct to 95-100% after the config change
    - the patient-monitor line "config coturn applied coturn-4.6.2-high-concurrency" comes before the first quality alarm
  Remediation: roll the relay config back with opsctl rollback config/coturn --to-revision previous (coturn-4.6.2-default, 8 relay threads). Packet loss is back under 1% within about 60 seconds. Adding TURN hosts barely helps, because each new host gets the same 2-thread config and host CPU was never the limit.
remediation_action: reset_telehealth_relay
error_message: '[MONITOR] TELEHEALTH-QOS-DEGRAD: session={session_id} patient={patient_id} bitrate={bitrate_kbps}kbps loss={packet_loss_pct}%
  latency={latency_ms}ms'
stack_trace: |-
  === WEBRTC QUALITY METRICS — SESSION {session_id} ===
  Patient: {patient_id} | Provider: NPI-ATTENDING
  ------------------------------------------------------------------------
  METRIC              | VALUE          | THRESHOLD     | STATUS
  ------------------------------------------------------------------------
  Video Bitrate       | {bitrate_kbps} kbps    | >750 kbps     | DEGRADED
  Packet Loss         | {packet_loss_pct}%         | <2.0%         | CRITICAL
  Round-Trip Latency  | {latency_ms} ms       | <300 ms       | DEGRADED
  Jitter              | 45 ms          | <30 ms        | WARNING
  Frame Rate          | 12 fps         | >24 fps       | DEGRADED
  Audio MOS           | 2.8            | >3.5          | WARNING
  ------------------------------------------------------------------------
  TELEHEALTH-QOS-DEGRAD: Session {session_id} below clinical acceptability
  Video quality insufficient for remote physical examination
  Recommendation: Switch to audio-only or reschedule in-person visit
correlation_attr:
  key: infra.turn_server_build
  value: coturn-4.6.2-high-concurrency
fault_params:
  session_id:
    format: "TH-{n}"
    n: {randint: [100000, 999999]}
  patient_id:
    format: "PT-{n}"
    n: {randint: [100000, 999999]}
  bitrate_kbps: {randint: [128, 512]}
  packet_loss_pct: {uniform: [8.0, 16.0], round: 1}
  latency_ms: {randint: [350, 900]}
rca_clues:
  patient-monitor:
    telehealth.turn_server_overloaded: true
    telehealth.turn_relay_cpu_pct: {uniform: [95, 100], round: 0}
    telehealth.client_available_bandwidth_kbps: {randint: [2500, 8000]}
  clinical-alerts:
    alerts.session_quality_breach_count: {randint: [3, 15]}
    alerts.provider_notified: true
  ehr-system:
    ehr.visit_documentation_incomplete: true
    ehr.telehealth_encounter_held: {randint: [1, 5]}
  scheduling-api:
    sched.telehealth_to_inperson_conversions: {randint: [1, 5]}
    sched.rebooking_queue: {randint: [2, 10]}
remediation_command: |-
  opsctl rollback config/coturn --to-revision previous
error_services: [patient-monitor]
service_lag_seconds:
  clinical-alerts: 15
  ehr-system: 30
  scheduling-api: 45
cascade_messages:
  clinical-alerts:
    - severity: WARN
      message: '[CDS] telehealth_quality_breach session={session_id} patient={patient_id} loss={packet_loss_pct}%; provider notified'
  ehr-system:
    - severity: WARN
      message: '[EHR] telehealth_encounter_incomplete session={session_id} patient={patient_id} reason=VIDEO_QUALITY'
  scheduling-api:
    - severity: WARN
      message: '[SCHED] telehealth_reschedule session={session_id} patient={patient_id} reason=SESSION_QUALITY'
fault_scope:
  workloads: [patient-monitor]
infrastructure_events:
  - service: patient-monitor
    severity: INFO
    offset_seconds: -120
    body: '[MONITOR] config coturn applied coturn-4.6.2-high-concurrency to turn-us-east-1 (was coturn-4.6.2-default): relay-threads 8 -> 2 by virtual-care-eng (CHG0032391)'
    attributes:
      user.name: virtual-care-eng
      change.request: CHG0032391
      operation: config_change
      infra.turn_server_build: coturn-4.6.2-high-concurrency
      telehealth.relay_threads: 2
      change.summary: 'coturn turn-us-east-1: coturn-4.6.2-default -> coturn-4.6.2-high-concurrency'
remediation_effects:
  log_events:
    - service: patient-monitor
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl rollback config/coturn --to-revision previous by {actor}: turn-us-east-1 coturn-4.6.2-high-concurrency -> coturn-4.6.2-default, relay-threads 8'
      attributes:
        operation: change_implemented
        change.target: config/coturn
    - service: patient-monitor
      severity: INFO
      offset_seconds: 10
      body: '[MONITOR] turn_relay pool=turn-us-east-1 config=coturn-4.6.2-default relay_threads=8 reloaded; sessions rebalanced across threads'
      attributes:
        operation: turn_relay_status
        infra.turn_server_build: coturn-4.6.2-default
        telehealth.relay_threads: 8
  steady_attributes:
    patient-monitor:
      infra.turn_server_build: coturn-4.6.2-default
  verification:
    - signal: patient_monitor.telehealth_packet_loss_pct
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "patient-monitor"'
      field: 'metrics.patient_monitor.telehealth_packet_loss_pct'
      expect: 'back under 1% (was 8-16%) within about 60 seconds'
      within_seconds: 120
    - signal: TELEHEALTH-QOS-DEGRAD lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*TELEHEALTH-QOS-DEGRAD*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: infra.turn_server_build
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "patient-monitor"'
      field: 'attributes.infra.turn_server_build'
      expect: 'coturn-4.6.2-default on every turn_relay line since the fix; the high-concurrency config stops appearing'
      within_seconds: 120
business_impact:
  - kpi: business.patient_satisfaction_nps
    value: {uniform: [6.7, 7.7], round: 1}
  - kpi: business.appointment_no_show_rate_pct
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.hcahps_proxy_score
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.admits_per_min
    value: {uniform: [0.48, 0.56], round: 2}

name: Blood Bank Inventory Sync Error
subsystem: laboratory
vehicle_section: blood_bank_interface
error_type: BB-INVENTORY-SYNC
sensor_type: blood_bank_inventory
affected_services:
- lab-integration
- clinical-alerts
cascade_services:
- ehr-system
- scheduling-api
description: Blood bank inventory management system loses sync with transfusion service records
investigation_notes: |-
  Root cause: ISBT 128 scanner driver isbt128-scanner-v1.7.3-patched was loaded on blood bank dispense station BB-DISP-01 shortly before the first BB-INVENTORY-SYNC. With the new driver the scanner is OFFLINE, so units leave the blood bank without being scanned out. The book count stays at {system_count} {blood_product} units of type {blood_type} while the RFID shelf count drops to {units_on_hand}: a discrepancy of {discrepancy}. No expired units are unrecorded and the physical count matches RFID. The stock really is short, and the inventory system does not know it.
  Confirm:
    - lab-integration logs [LIS] bb_inventory product=Cryoprecipitate abo=A book_count=11 rfid_count=... scanner=BB-DISP-01 scanner_state=OFFLINE driver=isbt128-scanner-v1.7.3-patched status=MISMATCH (attributes.bb.isbt_scanner_status, attributes.deployment.bb_isbt_driver)
    - metric lab.bb_inventory_discrepancy_units rises from 0 to 7 as unscanned units are dispensed
    - the lab-integration line "driver isbt128-scanner-bb01 updated to isbt128-scanner-v1.7.3-patched" comes before the first discrepancy
  Remediation: two steps, in order. opsctl rollback driver/isbt128-scanner-bb01 --to-revision previous brings the scanner back online on v1.7.2. opsctl run job/bb-inventory-reconcile then books the unscanned dispenses from the RFID log, and the discrepancy is back to 0 about 20 seconds later. Reconciling without the rollback leaves the scanner offline and the gap opens again with the next dispense.
remediation_action: reconcile_blood_bank
error_message: '[LIS] BB-INVENTORY-SYNC: product={blood_product} type={blood_type} on_hand={units_on_hand} system={system_count}
  discrepancy={discrepancy}'
stack_trace: |-
  === BLOOD BANK INVENTORY RECONCILIATION ===
  Reconciliation Time: 20260217143052
  ------------------------------------------------------------------------
  PRODUCT         | TYPE | PHYSICAL | SYSTEM | DISCREPANCY | STATUS
  ------------------------------------------------------------------------
  {blood_product:15s} | {blood_type:4s} | {units_on_hand:8d} | {system_count:6d} | {discrepancy:11d} | MISMATCH
  PRBC            | O-   | 12       | 12     | 0           | OK
  FFP             | AB+  | 8        | 8      | 0           | OK
  Platelets       | O+   | 6        | 6      | 0           | OK
  ------------------------------------------------------------------------
  BB-INVENTORY-SYNC: {blood_product} {blood_type} — physical count {units_on_hand} vs system {system_count}
  Discrepancy of {discrepancy} units detected — transfusion service notified
  Manual physical recount required per blood bank SOP
correlation_attr:
  key: deployment.bb_isbt_driver
  value: isbt128-scanner-v1.7.3-patched
fault_params:
  blood_product: Cryoprecipitate
  blood_type: "A"
  units_on_hand: 4
  system_count: 11
  discrepancy: 7
rca_clues:
  lab-integration:
    bb.isbt_scanner_status: offline
    bb.physical_count_mismatch: true
    bb.unscanned_dispense_count: 7
    bb.expired_units_unrecorded: 0
  clinical-alerts:
    alerts.blood_shortage_alert: true
    alerts.crossmatch_pending_expired: 0
  ehr-system:
    ehr.transfusion_orders_held: {randint: [1, 5]}
  scheduling-api:
    sched.surgical_cases_held: {randint: [1, 3]}
    sched.blood_type_screen_pending: true
remediation_command: |-
  opsctl rollback driver/isbt128-scanner-bb01 --to-revision previous
  opsctl run job/bb-inventory-reconcile
error_services: [lab-integration]
service_lag_seconds:
  clinical-alerts: 15
  ehr-system: 30
  scheduling-api: 45
cascade_messages:
  clinical-alerts:
    - severity: WARN
      message: '[CDS] blood_shortage_alert product={blood_product} abo={blood_type} available={units_on_hand} system={system_count}; transfusion service notified'
  ehr-system:
    - severity: WARN
      message: '[EHR] transfusion_order_hold product={blood_product} abo={blood_type} reason=INVENTORY_UNVERIFIED'
  scheduling-api:
    - severity: WARN
      message: '[SCHED] surgical_case_hold reason=BLOOD_PRODUCT_UNCONFIRMED product={blood_product} abo={blood_type}'
fault_scope:
  workloads: [lab-integration]
infrastructure_events:
  - service: lab-integration
    severity: INFO
    offset_seconds: -120
    body: '[LIS] driver isbt128-scanner-bb01 updated to isbt128-scanner-v1.7.3-patched (was isbt128-scanner-v1.7.2) on BB-DISP-01 by transfusion-it (CHG0032291)'
    attributes:
      user.name: transfusion-it
      change.request: CHG0032291
      operation: driver_update
      deployment.bb_isbt_driver: isbt128-scanner-v1.7.3-patched
      bb.scanner: BB-DISP-01
      change.summary: 'BB-DISP-01 scanner driver: v1.7.2 -> v1.7.3-patched'
remediation_effects:
  log_events:
    - service: lab-integration
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE IMPLEMENTED opsctl rollback driver/isbt128-scanner-bb01 --to-revision previous by {actor}: BB-DISP-01 isbt128-scanner-v1.7.3-patched -> isbt128-scanner-v1.7.2, scanner ONLINE'
      attributes:
        operation: change_implemented
        change.target: driver/isbt128-scanner-bb01
    - service: lab-integration
      severity: INFO
      offset_seconds: 2
      body: '[CHG] CHANGE IMPLEMENTED opsctl run job/bb-inventory-reconcile by {actor}: booking unscanned BB-DISP-01 dispenses from the RFID log'
      attributes:
        operation: change_implemented
        change.target: job/bb-inventory-reconcile
  steady_attributes:
    lab-integration:
      deployment.bb_isbt_driver: isbt128-scanner-v1.7.2
  verification:
    - signal: lab.bb_inventory_discrepancy_units
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "lab-integration"'
      field: 'metrics.lab.bb_inventory_discrepancy_units'
      expect: 'back to 0 units (was 7) about 20 seconds after the reconcile job'
      within_seconds: 60
    - signal: BB-INVENTORY-SYNC lines
      from: 'logs.otel.healthcare'
      where: 'body.text LIKE "*BB-INVENTORY-SYNC*"'
      expect: '0 new lines'
      within_seconds: 60
    - signal: bb.isbt_scanner_status
      from: 'logs.otel.healthcare'
      where: 'resource.attributes.service.name == "lab-integration"'
      field: 'attributes.bb.isbt_scanner_status'
      expect: 'ONLINE on every bb_inventory line since the fix; OFFLINE stops appearing'
      within_seconds: 60
business_impact:
  - kpi: business.or_utilization_pct
    factor: {uniform: [0.2, 0.45]}
  - kpi: business.patient_safety_events_per_min
    factor: {uniform: [2.5, 5.5]}
  - kpi: business.discharges_per_min
    value: {uniform: [0.36, 0.42], round: 2}
  - kpi: business.lab_critical_notification_pct
    factor: {uniform: [0.2, 0.5]}

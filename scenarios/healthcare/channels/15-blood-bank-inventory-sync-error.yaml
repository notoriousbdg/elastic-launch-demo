name: Blood Bank Inventory Sync Error
subsystem: laboratory
vehicle_section: blood_bank_interface
error_type: BB-INVENTORY-SYNC
sensor_type: blood_bank_inventory
affected_services:
- lab-integration
- clinical-alerts
cascade_services:
- ehr-system
- scheduling-api
description: Blood bank inventory management system loses sync with transfusion service records
investigation_notes: |-
  Root Cause: Blood bank inventory discrepancies arise when the ISBT 128-coded product tracking system loses sync with the transfusion service module — typically after manual dispensing without barcode scanning, product expiration dispositions not recorded, or crossmatch cancellations not propagated back.
  Remediation: 1) Initiate a physical recount per blood bank SOP: `bb-admin recount --product {blood_product} --type {blood_type}`. 2) Check the ISBT barcode scanner interface: `bb-admin scanner-status --station all`. 3) Reconcile system inventory with physical counts: `bb-admin reconcile --auto-adjust --audit-trail`. 4) Review the crossmatch pending list for unreturned units: `bb-admin crossmatch-pending --older-than 4h`. 5) Restart the blood bank inventory sync service: `systemctl restart bb-inventory-sync`. 6) Notify the blood bank medical director if discrepancy exceeds 2 units per AABB standards.
remediation_action: reconcile_blood_bank
error_message: '[LIS] BB-INVENTORY-SYNC: product={blood_product} type={blood_type} on_hand={units_on_hand} system={system_count}
  discrepancy={discrepancy}'
stack_trace: |-
  === BLOOD BANK INVENTORY RECONCILIATION ===
  Reconciliation Time: 20260217143052
  ------------------------------------------------------------------------
  PRODUCT         | TYPE | PHYSICAL | SYSTEM | DISCREPANCY | STATUS
  ------------------------------------------------------------------------
  {blood_product:15s} | {blood_type:4s} | {units_on_hand:8d} | {system_count:6d} | {discrepancy:11d} | MISMATCH
  PRBC            | O-   | 12       | 12     | 0           | OK
  FFP             | AB+  | 8        | 8      | 0           | OK
  Platelets       | O+   | 6        | 6      | 0           | OK
  ------------------------------------------------------------------------
  BB-INVENTORY-SYNC: {blood_product} {blood_type} — physical count {units_on_hand} vs system {system_count}
  Discrepancy of {discrepancy} units detected — transfusion service notified
  Manual physical recount required per blood bank SOP
correlation_attr:
  key: deployment.bb_isbt_driver
  value: isbt128-scanner-v1.7.3-patched
fault_params:
  blood_product: {choice: [PRBC, FFP, Platelets, Cryoprecipitate]}
  blood_type: {choice: ["O+", "O-", "A+", "A-", "B+", "B-", "AB+", "AB-"]}
  units_on_hand: {randint: [2, 15]}
  system_count: {randint: [8, 25]}
  discrepancy: {randint: [3, 12]}
rca_clues:
  lab-integration:
    bb.isbt_scanner_status: offline
    bb.physical_count_mismatch: true
  clinical-alerts:
    alerts.blood_shortage_alert: true
    alerts.crossmatch_pending_expired: {randint: [2, 8]}
  ehr-system:
    ehr.transfusion_orders_held: {randint: [1, 5]}
  scheduling-api:
    sched.surgical_cases_held: {randint: [1, 3]}
    sched.blood_type_screen_pending: true
business_impact:
  - kpi: business.or_utilization_pct
    factor: {uniform: [0.20, 0.45]}
  - kpi: business.patient_safety_events_per_min
    factor: {uniform: [2.5, 5.5]}
  - kpi: business.discharges_per_min
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.lab_critical_notification_pct
    factor: {uniform: [0.20, 0.50]}

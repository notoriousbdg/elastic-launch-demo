service: pharmacy-system
sort_order: 4
cloud_provider: gcp
cloud_region: us-central1
cloud_platform: gcp_compute_engine
cloud_availability_zone: us-central1-a
subsystem: medication
language: java
topology:
- - ehr-system
  - /api/v1/ehr/medication-admin
  - POST
- - clinical-alerts
  - /api/v1/alerts/drug-interaction
  - POST
entry_endpoints:
- - /api/v1/pharmacy/dispense
  - POST
db_operations:
- - SELECT
  - medication_orders
  - SELECT rx_id, drug_code, dose, route, frequency FROM medication_orders WHERE patient_id = ? AND status = 'active'
- - SELECT
  - drug_interactions
  - SELECT drug_a, drug_b, severity, description FROM drug_interactions WHERE drug_a IN (?) OR drug_b IN (?)
emit_fault_logs: true
kpi_emitter: false
constants:
  MEDICATIONS:
  - Metoprolol 50mg
  - Lisinopril 10mg
  - Heparin 5000u
  - Vancomycin 1g
  - Morphine 4mg
  - Ondansetron 4mg
  - Ceftriaxone 1g
  - Pantoprazole 40mg
  ROUTES:
  - IV
  - PO
  - IM
  - SQ
  - topical
  SEVERITIES:
  - none
  - none
  - minor
  - moderate
state:
  _orders_dispensed:
    init: 0
  _last_formulary_check:
    init: now
# Before / during / after (schema 1.3):
#   ch 5  ddi-screening config fdb-cache-aggressive-v2 cuts interaction-checker threads 32 -> 8: with
#         the same 80-140 discharge orders/min the pool pins at 95-100% busy and the queue reaches
#         240-360 in ~60s. After the rollback (32 threads) the queue drains over ~120s.
#   ch 6  surescripts-adapter v6.0.3-rc1 puts the prescriber-side pharmacy NPI in <To Qualifier="P">
#         where Surescripts routes on the NCPDP ID: NewRx (about half of SCRIPT traffic) is rejected
#         with 900; renewals and cancels, routed by RelatesToMessageID, still go through. Reject rate
#         48-62% in ~30s, back under 1% ~60s after the rollback as retries go out.
steps:
- sample:
    med:
      choice: MEDICATIONS
    disp_patient_id:
      expr: f'PT-{rand.randint(100000, 999999)}'
    rx_id:
      expr: f'RX-{rand.randint(100000, 999999)}'
    route:
      choice: ROUTES
- log:
    level: INFO
    message: '[PHARM] dispense rx={rx_id} med={med} route={route} patient={disp_patient_id} status=VERIFIED'
    attrs:
      operation: dispense
      pharmacy.rx_id:
        var: rx_id
      pharmacy.medication:
        var: med
      pharmacy.route:
        var: route
      pharmacy.patient_id:
        var: disp_patient_id
      pharmacy.status: DISPENSED
# ── ch 5: drug interaction screening ───────────────────────────────────────
- sample:
    ddi_queue:
      expr: "int(8 + (rand.uniform(240.0, 360.0) - 8) * min(1.0, elapsed.get(5, 0) / 60.0)) if 5 in all_active
        else (int(300 + (rand.randint(2, 15) - 300) * min(1.0, since_fix.get(5, 0) / 120.0)) if 5 in fixed_channels
        else rand.randint(2, 15))"
    ddi_busy_pct:
      expr: "round(min(100.0, 40.0 + (rand.uniform(95.0, 100.0) - 40.0) * min(1.0, elapsed.get(5, 0) / 30.0)), 1) if 5 in all_active
        else (round(97.0 + (rand.uniform(25.0, 55.0) - 97.0) * min(1.0, since_fix.get(5, 0) / 90.0), 1) if 5 in fixed_channels
        else round(rand.uniform(25.0, 55.0), 1))"
    ddi_max_threads:
      expr: "8 if 5 in all_active else 32"
    ddi_busy_threads:
      expr: "int(round(ddi_max_threads * ddi_busy_pct / 100.0))"
    discharge_orders_1m:
      expr: "rand.randint(80, 140)"
    ddi_config:
      expr: "'fdb-cache-aggressive-v2' if 5 in all_active else 'fdb-cache-standard-v1'"
    ddi_status:
      expr: "'SATURATED' if 5 in all_active or ddi_queue > 50 else 'OK'"
    med_a:
      choice: MEDICATIONS
    med_b:
      choice: MEDICATIONS
    severity:
      choice: SEVERITIES
    check_ms:
      expr: "rand.randint(5, 40) if ddi_queue < 50 else int(ddi_queue * rand.uniform(80.0, 120.0))"
- metric:
    name: pharmacy.interaction_queue_depth
    value:
      var: ddi_queue
    unit: checks
- metric:
    name: pharmacy.ddi_checker_busy_pct
    value:
      var: ddi_busy_pct
    unit: '%'
- log:
    level: INFO
    message: '[PHARM] ddi_screen drug_a={med_a} drug_b={med_b} severity={severity} eval_ms={check_ms} status=CLEAR'
    attrs:
      operation: interaction_check
      pharmacy.drug_a:
        var: med_a
      pharmacy.drug_b:
        var: med_b
      pharmacy.interaction_severity:
        var: severity
      pharmacy.check_ms:
        var: check_ms
- log:
    level: INFO
    message: '[PHARM] ddi_engine pool=interaction-checker busy={ddi_busy_threads}/{ddi_max_threads} busy_pct={ddi_busy_pct}% queue={ddi_queue} discharge_orders_1m={discharge_orders_1m} kb=FDB cache=current config={ddi_config} status={ddi_status}'
    attrs: &ddi_attrs
      operation: ddi_engine_status
      cpoe.interaction_checker_max_threads:
        var: ddi_max_threads
      cpoe.interaction_checker_busy_pct:
        var: ddi_busy_pct
      cpoe.ddi_queue_depth:
        var: ddi_queue
      cpoe.discharge_reconciliation_orders_per_min:
        var: discharge_orders_1m
      cpoe.fdb_cache_status: current
      deployment.cpoe_engine_config:
        var: ddi_config
      cpoe.engine_status:
        var: ddi_status
  when: "ddi_status == 'OK'"
- log:
    level: WARN
    message: '[PHARM] ddi_engine pool=interaction-checker busy={ddi_busy_threads}/{ddi_max_threads} busy_pct={ddi_busy_pct}% queue={ddi_queue} discharge_orders_1m={discharge_orders_1m} kb=FDB cache=current config={ddi_config} status={ddi_status}'
    attrs: *ddi_attrs
  when: "ddi_status != 'OK'"
# ── ch 6: Surescripts e-prescribing ────────────────────────────────────────
- sample:
    erx_sent_1m:
      expr: "rand.randint(35, 55)"
    erx_reject_pct:
      expr: "round(0.5 + (rand.uniform(48.0, 62.0) - 0.5) * min(1.0, elapsed.get(6, 0) / 30.0), 1) if 6 in all_active
        else (round(55.0 + (rand.uniform(0.2, 1.0) - 55.0) * min(1.0, since_fix.get(6, 0) / 60.0), 1) if 6 in fixed_channels
        else round(rand.uniform(0.2, 1.0), 1))"
    erx_900_1m:
      expr: "int(round(erx_sent_1m * erx_reject_pct / 100.0))"
    erx_adapter:
      expr: "'surescripts-adapter-v6.0.3-rc1' if 6 in all_active else 'surescripts-adapter-v6.0.2'"
    erx_to_id:
      expr: "'NPI' if 6 in all_active else 'NCPDPID'"
    erx_status:
      expr: "'DEGRADED' if 6 in all_active or erx_reject_pct > 5.0 else 'OK'"
- metric:
    name: pharmacy.erx_reject_pct
    value:
      var: erx_reject_pct
    unit: '%'
- log:
    level: INFO
    message: '[PHARM] surescripts_link endpoint=surescripts-prod adapter={erx_adapter} to_identifier={erx_to_id} sent_1m={erx_sent_1m} error_900_1m={erx_900_1m} reject_pct={erx_reject_pct}% link=CONNECTED status={erx_status}'
    attrs: &erx_attrs
      operation: erx_link_status
      infra.ncpdp_gateway_version:
        var: erx_adapter
      ncpdp.to_identifier:
        var: erx_to_id
      ncpdp.script_version: "2017071"
      ncpdp.reject_pct:
        var: erx_reject_pct
      ncpdp.link_status: CONNECTED
      ncpdp.status:
        var: erx_status
  when: "erx_status == 'OK'"
- log:
    level: WARN
    message: '[PHARM] surescripts_link endpoint=surescripts-prod adapter={erx_adapter} to_identifier={erx_to_id} sent_1m={erx_sent_1m} error_900_1m={erx_900_1m} reject_pct={erx_reject_pct}% link=CONNECTED status={erx_status}'
    attrs: *erx_attrs
  when: "erx_status != 'OK'"
- every:
    seconds: 10
    state_key: _last_formulary_check
    steps:
    - sample:
        formulary_items:
          randint:
          - 2800
          - 3200
    - log:
        level: INFO
        message: '[PHARM] formulary_status items={formulary_items} dispensed={_orders_dispensed} cpoe_pipeline=NOMINAL'
        attrs:
          operation: formulary_status
          formulary.active_items:
            var: formulary_items
          formulary.total_dispensed:
            var: _orders_dispensed
- counter:
    state_key: _orders_dispensed
    by: 1
- metric:
    name: pharmacy.orders_dispensed
    value:
      var: _orders_dispensed
    unit: orders
- metric:
    name: pharmacy.formulary_compliance_pct
    value:
      uniform:
      - 95.0
      - 99.8
      round: 1
    unit: '%'

service: billing-processor
sort_order: 7
cloud_provider: azure
cloud_region: eastus
cloud_platform: azure_vm
cloud_availability_zone: eastus-1
subsystem: billing
language: dotnet
topology:
- - data-warehouse
  - /api/v1/warehouse/claims
  - POST
entry_endpoints:
- - /api/v1/billing/submit-claim
  - POST
db_operations:
- - SELECT
  - claim_submissions
  - SELECT claim_id, payer_id, total_charges, status FROM claim_submissions WHERE batch_id = ? ORDER BY created_at
- - INSERT
  - claim_submissions
  - INSERT INTO claim_submissions (encounter_id, payer_id, total_charges, dx_codes, cpt_codes) VALUES (?, ?, ?, ?, ?)
emit_fault_logs: true
kpi_emitter: true
constants:
  PAYERS:
  - BCBS-001
  - AETNA-002
  - UHC-003
  - CIGNA-004
  - MDCR-005
  - MDCD-006
  RESPONDING_PAYERS:
  - MDCR-005
  - MDCD-006
  DX_CODES:
  - I10
  - E11.9
  - J18.1
  - M54.5
  - K21.0
  - N39.0
state:
  _claims_processed:
    init: 0
  _last_batch_report:
    init: 0
# Before / during / after (schema 1.3):
#   ch 10 Availity real-time eligibility degraded: 270s to the four commercial payers hit the 5000 ms
#         gateway timeout within ~20s (Medicare and Medicaid answer through their own connections).
#         After failing the 270 route over to Trizetto, p95 is back under 1500 ms in ~30s.
#   ch 11 claims-837-generator v5.1.2-beta maps CLM05-1 from the wrong field ("1A"): 999 rejections
#         reach 30-46% of claims in ~60s. After the rollback and the resubmission job new batches are
#         accepted and the rejection rate is back at 1-3% in ~90s.
#   Denial rate (835) is steady: payer adjudication takes days, not minutes.
steps:
# ── ch 11: 837 generation and 999 acknowledgments ──────────────────────────
- sample:
    rej_999_pct:
      expr: "round(2.0 + (rand.uniform(30.0, 46.0) - 2.0) * min(1.0, elapsed.get(11, 0) / 60.0), 1) if 11 in all_active
        else (round(38.0 + (rand.uniform(1.0, 3.0) - 38.0) * min(1.0, since_fix.get(11, 0) / 90.0), 1) if 11 in fixed_channels
        else round(rand.uniform(1.0, 3.0), 1))"
    gen_build:
      expr: "'x12-837-processor-v5.1.2-beta' if 11 in all_active else 'x12-837-processor-v5.1.1'"
    claim_id:
      expr: f'CLM-{rand.randint(100000, 999999)}'
    payer:
      choice: PAYERS
    charges:
      uniform:
      - 500.0
      - 50000.0
      round: 2
    dx_code:
      choice: DX_CODES
- log:
    level: INFO
    message: '[CLAIMS] x12_837_submit claim={claim_id} payer={payer} charges=${charges:.2f} dx={dx_code} status=ACCEPTED'
    attrs:
      operation: claim_submission
      billing.claim_id:
        var: claim_id
      billing.payer:
        var: payer
      billing.charges:
        var: charges
      billing.dx_code:
        var: dx_code
      billing.status: SUBMITTED
- metric:
    name: billing.claim_999_reject_pct
    value:
      var: rej_999_pct
    unit: '%'
# ── ch 10: real-time eligibility route ─────────────────────────────────────
- sample:
    elig_p95_ms:
      expr: "int(1100 + (rand.uniform(5000.0, 5050.0) - 1100) * min(1.0, elapsed.get(10, 0) / 20.0)) if 10 in all_active
        else (int(5020 + (rand.uniform(900.0, 1400.0) - 5020) * min(1.0, since_fix.get(10, 0) / 30.0)) if 10 in fixed_channels
        else int(rand.uniform(700.0, 1400.0)))"
    elig_timeout_pct:
      expr: "round(0.2 + (rand.uniform(62.0, 72.0) - 0.2) * min(1.0, elapsed.get(10, 0) / 20.0), 1) if 10 in all_active
        else (round(67.0 + (rand.uniform(0.0, 0.5) - 67.0) * min(1.0, since_fix.get(10, 0) / 30.0), 1) if 10 in fixed_channels
        else round(rand.uniform(0.0, 0.5), 1))"
    elig_payers_timing_out:
      expr: "4 if 10 in all_active else 0"
    clearinghouse:
      expr: "'availity' if 10 in all_active else ('trizetto' if 10 in fixed_channels else 'availity')"
    elig_status:
      expr: "'DEGRADED' if 10 in all_active or elig_p95_ms > 3000 else 'OK'"
    elig_payer:
      expr: "rand.choice(RESPONDING_PAYERS) if 10 in all_active else rand.choice(PAYERS)"
    patient_id:
      expr: f'PT-{rand.randint(100000, 999999)}'
    response_ms:
      randint:
      - 200
      - 1500
    elig_result:
      choice:
      - ELIGIBLE
      - ELIGIBLE
      - ELIGIBLE
      - NEEDS_AUTH
- metric:
    name: billing.eligibility_p95_ms
    value:
      var: elig_p95_ms
    unit: ms
- metric:
    name: billing.eligibility_timeout_pct
    value:
      var: elig_timeout_pct
    unit: '%'
- log:
    level: INFO
    message: '[CLAIMS] x12_271_response patient={patient_id} payer={elig_payer} clearinghouse={clearinghouse} eligibility={elig_result} response_ms={response_ms}'
    attrs:
      operation: eligibility_check
      billing.payer:
        var: elig_payer
      billing.patient_id:
        var: patient_id
      billing.eligibility_status:
        var: elig_result
      billing.response_ms:
        var: response_ms
      x12.clearinghouse:
        var: clearinghouse
- log:
    level: INFO
    message: '[CLAIMS] x12_270_route clearinghouse={clearinghouse} p95_ms={elig_p95_ms} timeout_ms=5000 timeouts_pct={elig_timeout_pct}% payers_timing_out={elig_payers_timing_out}/6 isa_validation=PASS status={elig_status}'
    attrs: &route_attrs
      operation: eligibility_route_status
      x12.clearinghouse:
        var: clearinghouse
      x12.eligibility_p95_ms:
        var: elig_p95_ms
      x12.eligibility_timeout_pct:
        var: elig_timeout_pct
      x12.payers_timing_out:
        var: elig_payers_timing_out
      x12.isa_envelope_validation: pass
      x12.route_status:
        var: elig_status
  when: "elig_status == 'OK'"
- log:
    level: WARN
    message: '[CLAIMS] x12_270_route clearinghouse={clearinghouse} p95_ms={elig_p95_ms} timeout_ms=5000 timeouts_pct={elig_timeout_pct}% payers_timing_out={elig_payers_timing_out}/6 isa_validation=PASS status={elig_status}'
    attrs: *route_attrs
  when: "elig_status != 'OK'"
- every:
    seconds: 10
    state_key: _last_batch_report
    steps:
    - sample:
        batch_id:
          expr: f'BATCH-{rand.randint(1000, 9999)}'
        batch_size:
          randint:
          - 50
          - 300
    - sample:
        accepted:
          expr: "int(batch_size * (100.0 - rej_999_pct) / 100.0)"
        ack_999:
          expr: "'A' if accepted == batch_size else ('P' if accepted > 0 else 'R')"
        rcm_state:
          expr: "'ON_TRACK' if rej_999_pct < 5.0 else 'REJECTIONS'"
    - log:
        level: INFO
        message: '[CLAIMS] batch_status batch={batch_id} accepted={accepted}/{batch_size} ack_999={ack_999} generator={gen_build} total_processed={_claims_processed}
          rcm={rcm_state}'
        attrs:
          operation: batch_status
          billing.batch_id:
            var: batch_id
          billing.batch_size:
            var: batch_size
          billing.accepted:
            var: accepted
          billing.total_processed:
            var: _claims_processed
          x12.batch_rejection_rate_pct:
            var: rej_999_pct
          deployment.claims_engine_build:
            var: gen_build
- counter:
    state_key: _claims_processed
    by: 1
- metric:
    name: billing.claims_processed
    value:
      var: _claims_processed
    unit: claims
- metric:
    name: billing.denial_rate_pct
    value:
      expr: "round(max(2.0, min(8.0, rand.gauss(4.8, 0.3))), 1)"
    unit: '%'
- metric:
    name: billing.avg_reimbursement_days
    value:
      randint:
      - 14
      - 45
    unit: days

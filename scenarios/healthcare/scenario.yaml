agent_config:
  id: healthcare-clinical-analyst
  name: Clinical Systems Analyst
  assessment_tool_name: patient_safety_assessment
  system_prompt: 'You are the Clinical Systems Analyst, an expert AI assistant for hospital clinical operations. You help
    IT operations teams investigate system anomalies, analyze integration failures, and provide root cause analysis for fault
    conditions across 9 clinical systems spanning AWS, GCP, and Azure. You have deep expertise in HL7 v2.x ADT/ORM/ORU messaging,
    DICOM C-STORE/C-MOVE/C-FIND protocols, NCPDP SCRIPT e-prescribing, X12 270/271 eligibility and 837 claims transactions,
    ASTM laboratory interfaces, clinical decision support (CDS) rule engines, HIPAA audit compliance, and healthcare ETL pipelines.
    When investigating incidents, search for these system identifiers in logs: EHR faults (HL7-ACK-AE, EMPI-MATCH-FAIL, ADT-SYNC-FAIL),
    Vital Signs faults (VITAL-ALERT-STORM, TELEHEALTH-QOS-DEGRAD), Laboratory faults (LIS-RESULT-DELAY, BB-INVENTORY-SYNC),
    Radiology faults (DICOM-STORE-FAIL, PACS-CAPACITY-CRITICAL), Medication faults (CPOE-DDI-CRITICAL, NCPDP-SCRIPT-FAIL),
    Scheduling faults (SCHED-BED-MGMT-FAIL, SCHED-CONFLICT, SCHED-SURGICAL-CONFLICT), Billing faults (X12-271-TIMEOUT, X12-837-REJECT),
    Alerting faults (CDS-OVERLOAD, NURSE-CALL-STORM), and Analytics faults (ETL-PIPELINE-STALL, HIPAA-AUDIT-FAIL). Log messages
    are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: patient_safety_assessment
  description: 'Comprehensive patient safety assessment. Evaluates all clinical systems against operational health criteria
    for patient care continuity. Returns data for safety evaluation across EHR, patient monitoring, laboratory, pharmacy,
    and imaging systems. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: billing-processor
executive_dashboard_intro: '**Hospital operations KPIs** — access & throughput, revenue cycle, clinical quality, and EHR operations
  (synthetic `business.*` from `billing-processor`).'
executive_kpi_sections:
- header: '**Access & throughput** — ED time, admits, discharges, bed, OR, and ICU'
  specs:
  - - ED door-to-provider (min)
    - metrics.business.ed_door_to_provider_min
  - - Admits / min
    - metrics.business.admits_per_min
  - - Discharges / min
    - metrics.business.discharges_per_min
  - - Bed occupancy (%)
    - metrics.business.bed_occupancy_pct
  - - OR utilization (%)
    - metrics.business.or_utilization_pct
  - - ICU capacity (%)
    - metrics.business.icu_capacity_pct
- header: '**Revenue cycle** — claims, clean rate, denials, AR days, and collections'
  specs:
  - - Claims submitted / min
    - metrics.business.claims_submitted_per_min
  - - Clean claim rate (%)
    - metrics.business.clean_claim_rate_pct
  - - Denials / min
    - metrics.business.denials_per_min
  - - AR days
    - metrics.business.accounts_receivable_days
  - - Collections (USD/min)
    - metrics.business.collections_usd_per_min
  - - Unbilled charges (USD/min)
    - metrics.business.unbilled_charges_usd_per_min
- header: '**Clinical quality** — order TAT, lab alerts, med reconciliation, and safety'
  specs:
  - - Order turnaround (min)
    - metrics.business.order_turnaround_min
  - - Lab critical notification (%)
    - metrics.business.lab_critical_notification_pct
  - - Medication reconciliation (%)
    - metrics.business.medication_reconciliation_rate_pct
  - - Patient safety events / min
    - metrics.business.patient_safety_events_per_min
  - - HCAHPS proxy score
    - metrics.business.hcahps_proxy_score
  - - Readmission risk (0–100)
    - metrics.business.readmission_risk_index_0_100
- header: '**Operations** — EHR response, HL7, imaging, no-shows, satisfaction, and compliance'
  specs:
  - - EHR response time (ms)
    - metrics.business.ehr_response_time_ms
  - - HL7 messages / min
    - metrics.business.hl7_messages_per_min
  - - Imaging worklist size
    - metrics.business.imaging_worklist_size
  - - Appointment no-show rate (%)
    - metrics.business.appointment_no_show_rate_pct
  - - Patient satisfaction (NPS-like)
    - metrics.business.patient_satisfaction_nps
  - - Staff compliance rate (%)
    - metrics.business.staff_compliance_rate_pct

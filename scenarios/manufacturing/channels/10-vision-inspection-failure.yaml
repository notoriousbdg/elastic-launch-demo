name: Vision Inspection Failure
subsystem: quality
vehicle_section: vision_pipeline
error_type: VISION-INSPECT-FAIL
sensor_type: vision_pipeline
affected_services:
- quality-inspector
cascade_services:
- mes-controller
- oee-analytics
description: Vision system camera or inference pipeline failure; defects flowing through unchecked
investigation_notes: |-
  Root Cause: Vision pipeline failures fall into three buckets: (1) hardware (camera trigger lost, lighting drifting, lens fouled), (2) inference (model returns low confidence on every frame), (3) network (frames arrive late or out of order). The first sign is usually a confidence-score histogram skewing low for an entire shift.
  Remediation: 1) Visual inspection of camera, lens, lighting at station {station_id}. 2) Run the calibration target: `vision-cli calibrate --station {station_id}`. 3) Check inference container health: `kubectl describe pod -n vision vision-inference-*`. 4) Reload the model: `vision-cli reload-model --station {station_id} --model {model_version}`. 5) If the issue persists, fall back to manual inspection and tag the lot for review per quality plan.
remediation_action: reload_vision_model
error_message: '[QC] VISION-INSPECT-FAIL: station={station_id} model={model_version} confidence_avg={confidence_avg} frames_dropped={frames_dropped}'
stack_trace: |-
  === VISION INSPECTION DIAGNOSTIC — {station_id} ===
  Model: {model_version} | Window: 5 min
  ------------------------------------------------------------------------
  STAGE             | STATUS    | METRIC
  ------------------------------------------------------------------------
  camera_trigger     | OK        | 220 fps
  frame_capture      | DEGRADED  | {frames_dropped} dropped
  preprocess         | OK        | mean 8ms
  inference          | DEGRADED  | confidence_avg={confidence_avg}
  postprocess        | OK        | mean 3ms
  ------------------------------------------------------------------------
  VISION-INSPECT-FAIL: pipeline degraded — defects may be passing through
correlation_attr:
  key: deployment.vision_model_version
  value: yolo-v8-mfg-v3.4-beta
fault_params:
  station_id: {choice: [VIS-01, VIS-02, VIS-03, CMM-01]}
  model_version: {choice: [yolo-v8-mfg-v3.4-beta, yolo-v8-mfg-v3.3]}
  confidence_avg: {uniform: [0.55, 0.78], round: 3}
  frames_dropped: {randint: [50, 800]}
rca_clues:
  quality-inspector:
    vision.confidence_avg: {uniform: [0.55, 0.78], round: 3}
    vision.frames_dropped: {randint: [50, 800]}
  mes-controller:
    mes.unverified_parts_count: {randint: [20, 300]}
  oee-analytics:
    oee.quality_pct: {uniform: [80.0, 92.0], round: 1}
business_impact:
  - kpi: business.oee_quality_pct
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.first_pass_yield_pct
    factor: {uniform: [0.30, 0.60]}
  - kpi: business.defect_ppm
    factor: {uniform: [2.5, 5.5]}
  - kpi: business.customer_complaints_per_day
    factor: {uniform: [2.0, 4.5]}

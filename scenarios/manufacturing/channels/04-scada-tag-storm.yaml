name: SCADA Tag Storm
subsystem: scada
vehicle_section: tag_subscription
error_type: SCADA-TAG-STORM
sensor_type: tag_subscription
affected_services:
- scada-gateway
- ot-historian
cascade_services:
- mes-controller
- oee-analytics
description: Runaway tag-update rate floods the historian write path, exhausting buffers
investigation_notes: |-
  Root Cause: Tag storms typically come from a sensor stuck in fast-change mode (e.g., a dead-band value of 0 on a noisy signal) or from a PLC firmware update that reset the publishing interval to the minimum allowed by the OPC-UA server. The downstream historian buffer fills faster than the compaction job can drain it.
  Remediation: 1) Identify offenders: `scada-admin top-publishers --window 60s`. 2) Apply a temporary dead-band: `scada-admin set-deadband --tag {tag_name} --pct 0.5`. 3) Reduce publishing rate: `scada-admin set-publish-interval --subscription {subscription_id} --ms 1000`. 4) Drain the historian buffer: `historian-admin flush-buffer --priority high`. 5) Open a biomed/maintenance ticket if a sensor is genuinely failing (constant noise above process limits).
remediation_action: throttle_subscription
error_message: '[SCADA] SCADA-TAG-STORM: subscription={subscription_id} rate={tag_rate}/s baseline=1200/s tag={tag_name} affected_plcs={affected_plcs}'
stack_trace: |-
  === SCADA TAG PUBLISH RATE ANOMALY ===
  Subscription: {subscription_id} | Window: 60s
  ------------------------------------------------------------------------
  TAG NAME             | RATE/s   | BASELINE | RATIO    | DEADBAND
  ------------------------------------------------------------------------
  {tag_name}            | {tag_rate}    | 12       | {tag_rate}x      | 0.0
  MotorSpeed            | 8        | 8        | 1.0x     | 0.5
  OvenTempC             | 3        | 3        | 1.0x     | 0.5
  ------------------------------------------------------------------------
  SCADA-TAG-STORM: aggregate rate {tag_rate}/s exceeds historian buffer drain rate; backpressure imminent
correlation_attr:
  key: infra.scada_publish_config
  value: deadband-zero-experimental
fault_params:
  subscription_id:
    format: "sub-{n}"
    n: {randint: [1000, 9999]}
  tag_rate: {randint: [15000, 60000]}
  tag_name: {choice: [MotorSpeed, OvenTempC, ConveyorRPM, PressurePsi, PartsCounter]}
  affected_plcs: {randint: [1, 4]}
rca_clues:
  scada-gateway:
    scada.publish_rate_per_s: {randint: [15000, 60000]}
    scada.deadband_pct: 0.0
  ot-historian:
    historian.buffer_high_watermark_pct: {uniform: [85.0, 99.5], round: 1}
  mes-controller:
    mes.tag_feed_lag_s: {randint: [5, 35]}
  oee-analytics:
    oee.event_intake_lag_s: {randint: [8, 45]}
business_impact:
  - kpi: business.oee_overall_pct
    factor: {uniform: [0.35, 0.65]}
  - kpi: business.oee_performance_pct
    factor: {uniform: [0.30, 0.60]}
  - kpi: business.throughput_units_per_hour
    factor: {uniform: [0.35, 0.65]}
  - kpi: business.unplanned_downtime_min_per_shift
    factor: {uniform: [1.8, 3.5]}

name: MES Queue Overflow
subsystem: mes
vehicle_section: work_order_queue
error_type: MES-QUEUE-OVERFLOW
sensor_type: work_order_queue
affected_services:
- mes-controller
cascade_services:
- oee-analytics
description: A Helm upgrade dropped the replica override for the MES work-order workers; two workers cannot drain the shift-start release and the work-order queue grows past its watermark
investigation_notes: |-
  Root cause: the mes-controller Helm release was upgraded shortly before the first MES-QUEUE-OVERFLOW (chart 4.12.0 -> 4.13.0, by mes-release, CHG-7402) without the plant values file, so the workorder.replicas: 6 override was dropped and the mes-workorder-workers Deployment scaled from 6 to the chart default of 2. Each worker drains about 240 work-order events per minute. At shift start the planner releases the shift's work orders at about 900 per minute, so two workers (480 per minute) fall behind by about 420 per minute and the WORK-ORDER queue passes the 2,000 soft watermark. The workers are healthy (CPU 55-65%, no errors, no restarts) and the Kafka brokers and SQL Server are normal; there are simply too few consumers.
  Confirm:
    - mes-controller workorder_pool lines show workers=2 desired=2 (attributes.mes.workorder_workers); metric mes.workorder_workers drops from 6 to 2
    - the mes-controller helm upgrade line (CHG-7402) comes before the first MES-QUEUE-OVERFLOW
    - metric mes.work_order_queue_depth climbs from 0-150 toward the 5,000 hard watermark at about 7 per second; the Kafka integration shows consumer lag growing on the work-order topic for group mes-workorder-workers
  Remediation: restore the replica count with opsctl patch deployment/mes-workorder-workers --replicas 6. The four new workers join the consumer group within about 20 s; six workers drain about 1,440 per minute, so the queue falls below the soft watermark within about five minutes and back to normal after that. Adding the plant values file back to the release pipeline is a follow-up so the next upgrade does not drop the override again.
remediation_action: scale_mes_workers
remediation_command: |-
  opsctl patch deployment/mes-workorder-workers --replicas 6
error_message: '[MES] MES-QUEUE-OVERFLOW: queue=WORK-ORDER depth={queue_depth} soft_watermark=2000 hard_watermark=5000 workers={current_workers} inbound_per_min=900 drain_per_min=480'
stack_trace: |-
  === MES QUEUE STATUS — WORK-ORDER ===
  Depth: {queue_depth} | Soft watermark: 2000 | Hard watermark: 5000
  Workers: {current_workers} ready (deployment mes-workorder-workers, desired {current_workers}; was 6 before CHG-7402)
  ------------------------------------------------------------------------
  Recent rates:
    Inbound:    900/min (shift-start release)
    Drain:      480/min (240/min per worker)
    Net:        +420/min
  ------------------------------------------------------------------------
  MES-QUEUE-OVERFLOW: queue growing; drain capacity below inbound rate
correlation_attr:
  key: mes.workorder_workers
  value: '2'
fault_params:
  queue_depth: {randint: [2200, 4800]}
  current_workers: 2
rca_clues:
  mes-controller:
    mes.worker_cpu_pct: {randint: [55, 65]}
    mes.worker_restarts: 0
    helm.chart_version: 4.13.0
  oee-analytics:
    oee.event_intake_lag_s: {randint: [15, 75]}
cascade_messages:
  oee-analytics:
    - severity: WARN
      message: '[OEE] work-order events from mes-controller arriving {queue_depth} behind; production counts for the current window are provisional'
fault_scope:
  cluster: mfg-eks-cluster
  workloads: [mes-controller]
infrastructure_events:
  - service: mes-controller
    severity: INFO
    offset_seconds: -300
    body: '[MES] helm upgrade release=mes-controller chart 4.12.0 -> 4.13.0 values=values.yaml (values-p002.yaml not passed); deployment/mes-workorder-workers replicas 6 -> 2; by mes-release (CHG-7402)'
    attributes:
      operation: config_change
      user.name: mes-release
      change.request: CHG-7402
      mes.workorder_workers: 2
      change.summary: 'mes-workorder-workers replicas: 6 -> 2 (chart default)'
service_lag_seconds:
  oee-analytics: 30
remediation_effects:
  log_events:
    - service: mes-controller
      severity: INFO
      offset_seconds: 1
      body: '[CHG] CHANGE APPLIED opsctl patch deployment/mes-workorder-workers --replicas 6 by {actor}: replicas 2 -> 6'
      attributes:
        operation: change_applied
        change.target: deployment/mes-workorder-workers
    - service: mes-controller
      severity: INFO
      offset_seconds: 20
      body: '[MES] consumer group mes-workorder-workers rebalanced: 6 members, drain rate 1440/min'
      attributes:
        operation: consumer_rebalance
  steady_attributes:
    mes-controller:
      mes.workorder_workers: 6
  log_taper_seconds: 30
  verification:
    - signal: mes.workorder_workers
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "mes-controller"'
      field: 'metrics.mes.workorder_workers'
      expect: '6 (was 2)'
      within_seconds: 60
    - signal: mes.work_order_queue_depth
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "mes-controller"'
      field: 'metrics.mes.work_order_queue_depth'
      expect: 'falling steadily and below the 2,000 soft watermark'
      within_seconds: 330
    - signal: MES-QUEUE-OVERFLOW lines
      from: 'logs.otel.mfg'
      where: 'body.text LIKE "*MES-QUEUE-OVERFLOW*"'
      expect: '0 new lines'
      within_seconds: 120
    - signal: work-order worker count
      from: 'logs.otel.mfg'
      where: 'resource.attributes.service.name == "mes-controller" AND body.text LIKE "*workorder_pool*"'
      field: 'attributes.mes.workorder_workers'
      expect: '6 on every line logged since the fix'
      within_seconds: 60
business_impact:
  - kpi: business.throughput_units_per_hour
    factor: {uniform: [0.60, 0.80]}
  - kpi: business.oee_performance_pct
    factor: {uniform: [0.60, 0.80]}
  - kpi: business.cycle_time_seconds
    factor: {uniform: [1.3, 1.8]}
  - kpi: business.on_time_delivery_pct
    factor: {uniform: [0.60, 0.85]}
generator_impact:
  kafka_otel:
    high_consumer_lag_by_topic: 70000.0
generator_hold_seconds: {kafka_otel: 180}

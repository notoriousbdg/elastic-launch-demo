name: SPC Out-of-Control Process
subsystem: quality
vehicle_section: spc_engine
error_type: SPC-OUT-OF-CONTROL
sensor_type: spc_engine
affected_services:
- quality-inspector
cascade_services:
- mes-controller
- oee-analytics
description: Process variation exceeds Cpk threshold on a critical-to-quality (CTQ) characteristic
investigation_notes: |-
  Root Cause: An out-of-control signal (Western Electric / Nelson rules) means the process mean or variance has shifted. Common causes: tooling wear, fixture loosening, raw-material lot change, or a temperature/humidity excursion in the work cell. A rule-2 (9 points on one side of mean) is more diagnostic than a rule-1 (single point beyond 3σ).
  Remediation: 1) Pull the SPC chart: `qc-admin spc-chart --characteristic {characteristic} --window 8h`. 2) Identify the rule fired and the timestamp. 3) Cross-reference with raw-material lot changes (`mes-admin lot-history --line {line_id}`) and operator/tooling changes. 4) Pause auto-release and shift to 100% inspection until the cause is found and corrected: `qc-admin set-inspection-mode --line {line_id} --mode FULL`. 5) Document a CAPA per IATF 16949.
remediation_action: tighten_inspection
error_message: '[QC] SPC-OUT-OF-CONTROL: characteristic={characteristic} rule={spc_rule} cpk={cpk} target_cpk=1.33 line={line_id}'
stack_trace: |-
  === SPC CONTROL CHART — {characteristic} ===
  Line: {line_id} | Sample size: 30 | Cpk: {cpk} | Target: 1.33
  ------------------------------------------------------------------------
  RULE FIRED: {spc_rule}
    Western Electric Rule 1: 1 point beyond 3σ
    Western Electric Rule 2: 9 consecutive points on one side of mean
    Nelson Rule 5: 2 of 3 consecutive points beyond 2σ on same side
  ------------------------------------------------------------------------
  SAMPLE  | VALUE   | STATUS
  ------------------------------------------------------------------------
  S-028   | 49.85   | within ±1σ
  S-029   | 51.12   | beyond +2σ
  S-030   | 51.48   | beyond +3σ — RULE 1 FIRED
  ------------------------------------------------------------------------
  SPC-OUT-OF-CONTROL: process shift detected on {characteristic}
correlation_attr:
  key: deployment.spc_baseline_config
  value: baseline-v2.3-tightened
fault_params:
  characteristic: {choice: [LENGTH_MM, DIAMETER_MM, TORQUE_NM, WEIGHT_G]}
  spc_rule: {choice: [WE-1, WE-2, Nelson-5]}
  cpk: {uniform: [0.65, 1.20], round: 3}
  line_id: {choice: [LINE-01, LINE-02, LINE-03, LINE-04, LINE-05]}
rca_clues:
  quality-inspector:
    quality.spc_rule_fired: {choice: [WE-1, WE-2, Nelson-5]}
    quality.cpk: {uniform: [0.65, 1.20], round: 3}
  mes-controller:
    mes.lot_under_quarantine: true
  oee-analytics:
    oee.quality_pct: {uniform: [82.0, 94.0], round: 1}
business_impact:
  - kpi: business.oee_quality_pct
    factor: {uniform: [0.30, 0.60]}
  - kpi: business.first_pass_yield_pct
    factor: {uniform: [0.35, 0.65]}
  - kpi: business.defect_ppm
    factor: {uniform: [3.0, 6.0]}
  - kpi: business.scrap_rate_pct
    factor: {uniform: [2.5, 5.0]}
  - kpi: business.cost_of_poor_quality_usd_per_min
    factor: {uniform: [2.5, 5.0]}

  - kpi: business.oee_overall_pct
    factor: {uniform: [0.40, 0.70]}
  - kpi: business.rework_hours_per_shift
    factor: {uniform: [1.8, 3.5]}
  - kpi: business.unplanned_downtime_min_per_shift
    factor: {uniform: [1.5, 3.0]}

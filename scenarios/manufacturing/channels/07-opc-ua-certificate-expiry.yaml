name: OPC-UA Certificate Expiry
subsystem: scada
vehicle_section: secure_channel
error_type: OPC-UA-CERT-EXPIRY
sensor_type: x509_validator
affected_services:
- scada-gateway
cascade_services:
- mes-controller
- ot-historian
- shopfloor-portal
description: TLS certificate between the OPC-UA gateway and aggregation server expired; secure channel rejected
investigation_notes: |-
  Root Cause: OPC-UA app instance certificates have a hard expiry; once the `notAfter` date passes, the secure channel handshake is rejected by the server with status 0x80120000 (BadCertificateInvalid) or 0x80130000 (BadCertificateTimeInvalid). Auto-renewal jobs that depend on the cert still being valid for handshake will not renew themselves.
  Remediation: 1) Check expiry: `openssl x509 -in /etc/scada/certs/app-instance.crt -noout -dates`. 2) Issue a fresh certificate via the OT PKI: `pki-cli issue --profile opcua-app-instance --cn scada-gateway-{plc_id}`. 3) Push the new cert to the gateway and trust list: `scada-admin install-cert --cert /tmp/new.crt`. 4) Also push to PLC trust list (out-of-band, via the engineering workstation). 5) Renegotiate channels: `scada-admin reconnect --all`. 6) Add a 30-day expiry alert via Elastic Watcher.
remediation_action: renew_opcua_cert
error_message: '[SCADA] OPC-UA-CERT-EXPIRY: subject={cert_subject} expired_days_ago={cert_expired_days} thumbprint={cert_thumbprint}
  affected_plcs={affected_plcs}'
stack_trace: |-
  === OPC-UA CERTIFICATE STATUS ===
  Subject:      {cert_subject}
  Issuer:       CN=Manufacturing OT Root CA
  NotBefore:    2024-08-15 00:00:00 UTC
  NotAfter:     {cert_expiry_date} (expired {cert_expired_days} days ago)
  Thumbprint:   {cert_thumbprint}
  ------------------------------------------------------------------------
  Handshake:    REJECTED — status 0x80130000 (BadCertificateTimeInvalid)
  Affected:     {affected_plcs}
  OPC-UA-CERT-EXPIRY: secure channel cannot be established
correlation_attr:
  key: infra.opcua_cert_profile
  value: ot-pki-shortlived-30d
fault_params:
  cert_subject: "CN=scada-gateway-prod, O=Manufacturing OT"
  cert_expired_days: {randint: [1, 14]}
  cert_thumbprint:
    format: "{a:016x}{b:016x}{c:08x}"
    a: {randint: [0, 9223372036854775807]}
    b: {randint: [0, 9223372036854775807]}
    c: {randint: [0, 4294967295]}
  cert_expiry_date: "2026-04-12 00:00:00 UTC"
  affected_plcs: {randint: [1, 4]}
rca_clues:
  scada-gateway:
    opcua.cert_status: expired
    opcua.cert_expired_days: {randint: [1, 14]}
  mes-controller:
    mes.scada_link_status: down
  ot-historian:
    historian.scada_link_status: down
  shopfloor-portal:
    portal.scada_link_status: down
business_impact:
  - kpi: business.oee_overall_pct
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.oee_availability_pct
    factor: {uniform: [0.25, 0.55]}
  - kpi: business.throughput_units_per_hour
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.unplanned_downtime_min_per_shift
    factor: {uniform: [2.5, 5.5]}

service: inventory-sync
sort_order: 8
cloud_provider: azure
cloud_region: eastus
cloud_platform: azure_vm
cloud_availability_zone: eastus-1
subsystem: inventory
language: java
topology:
- - mes-controller
  - /api/v1/mes/material-availability
  - POST
entry_endpoints:
- - /api/v1/inventory/sync
  - POST
db_operations:
- - SELECT
  - material_master
  - SELECT material_code, on_hand_qty, reorder_point, safety_stock FROM material_master WHERE plant_id = ?
- - INSERT
  - inventory_deltas
  - INSERT INTO inventory_deltas (material_code, delta_units, location, source_doc, ts) VALUES (?, ?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: false
constants:
  MATERIALS:
  - RM-STEEL-A36
  - RM-ALU-6061
  - RM-PLASTIC-ABS
  - RM-COPPER-110
  LOCATIONS:
  - WH-RAW-01
  - WH-A-01
  - LINE-03-SUPERMARKET
state:
  _batches_synced:
    init: 0
steps:
- sample:
    # Per-channel fault intensity: ramps 0->1 once the fault reaches this service, drains 1->0 after its fix.
    f14:
      expr: "min(1.0, max(0.0, elapsed.get(14, 0) - lag.get(14, 0)) / 60.0) if 14 in all_active else (max(0.0, 1.0 - since_fix.get(14, 0) / 120.0) if 14 in fixed_channels else 0.0)"
    f17:
      expr: "min(1.0, max(0.0, elapsed.get(17, 0) - lag.get(17, 0)) / 10.0) if 17 in all_active else (max(0.0, 1.0 - since_fix.get(17, 0) / 60.0) if 17 in fixed_channels else 0.0)"
    # Stock records stay in LB until the reconcile job (about 40 s after the fix) rewrites them.
    uom_wrong:
      expr: "15 in all_active or (15 in fixed_channels and since_fix.get(15, 0) < 40)"
- sample:
    base_uom:
      expr: "'LB' if 15 in all_active else 'KG'"
    alu_on_hand_kg:
      expr: "round(rand.gauss(1905.0, 6.0), 1) if uom_wrong else round(rand.gauss(4200.0, 12.0), 1)"
    cycle_count_variance_pct:
      expr: "round(rand.uniform(54.2, 54.9), 1) if uom_wrong else round(rand.uniform(0.2, 0.8), 2)"
    below_reorder:
      expr: "1 if uom_wrong else 0"
    below_reorder_flag:
      expr: "'true' if uom_wrong else 'false'"
    pool_state:
      expr: "'stale' if 17 in all_active else 'healthy'"
    stale_handles:
      expr: "5 if 17 in all_active else 0"
    rfc_errors_per_min:
      expr: "rand.randint(3, 8) if 17 in all_active else 0"
    erp_sync_lag_s:
      expr: "int(150.0 + elapsed.get(17, 0) + rand.uniform(0.0, 30.0)) if 17 in all_active else (int(max(rand.uniform(30.0, 280.0), 400.0 * (1.0 - since_fix.get(17, 0) / 60.0))) if 17 in fixed_channels else int(rand.uniform(30.0, 280.0)))"
    goods_movements_pending:
      expr: "int(rand.randint(0, 20) + f14 * rand.randint(40, 300) + f17 * rand.randint(500, 1800))"
    batch_status:
      expr: "'FAILED' if 17 in all_active else 'OK'"
- counter:
    state_key: _batches_synced
    by:
      expr: "0 if 17 in all_active else 1"
- metric:
    name: inventory.batches_synced
    value:
      var: _batches_synced
    unit: batches
- metric:
    name: inventory.alu_6061_on_hand_kg
    value:
      var: alu_on_hand_kg
    unit: kg
    attrs:
      inventory.material: RM-ALU-6061
- metric:
    name: inventory.cycle_count_variance_pct
    value:
      var: cycle_count_variance_pct
    unit: '%'
    attrs:
      inventory.material: RM-ALU-6061
- metric:
    name: inventory.materials_below_reorder
    value:
      var: below_reorder
    unit: materials
- metric:
    name: inventory.rfc_errors_per_min
    value:
      var: rfc_errors_per_min
    unit: errors/min
- metric:
    name: inventory.rfc_pool_stale_handles
    value:
      var: stale_handles
    unit: handles
- metric:
    name: inventory.erp_sync_lag_s
    value:
      var: erp_sync_lag_s
    unit: s
- metric:
    name: inventory.erp_goods_movements_pending
    value:
      var: goods_movements_pending
    unit: postings
- log:
    level: INFO
    message: '[WMS] stock_status material=RM-ALU-6061 plant=P002 on_hand_kg={alu_on_hand_kg} base_uom={base_uom} reorder_point_kg=3000 below_reorder={below_reorder_flag} last_cycle_count_kg=4200 variance_pct={cycle_count_variance_pct}'
    attrs:
      operation: stock_status
      inventory.material: RM-ALU-6061
      inventory.base_uom:
        var: base_uom
      inventory.on_hand_kg:
        var: alu_on_hand_kg
- log:
    level: INFO
    message: '[WMS] rfc_pool pool=inventory-sync-sap destination=SAPPRD_INV size=8 stale_handles={stale_handles} state={pool_state} rfc_errors_per_min={rfc_errors_per_min} erp_sync_lag_s={erp_sync_lag_s}'
    attrs:
      operation: rfc_pool
      rfc.pool_state:
        var: pool_state
      rfc.stale_handles:
        var: stale_handles
- sample:
    material:
      choice: MATERIALS
    location:
      choice: LOCATIONS
    delta_kg:
      expr: "-round(rand.uniform(12.0, 180.0), 1)"
    gi_doc:
      expr: f'49{rand.randint(10000000, 99999999)}'
- log:
    level: INFO
    message: '[WMS] inventory_delta material={material} movement=261 delta_kg={delta_kg} location={location} doc={gi_doc} erp_post={batch_status}'
    attrs:
      operation: inventory_delta
      inventory.material:
        var: material
      inventory.delta_kg:
        var: delta_kg
      inventory.location:
        var: location

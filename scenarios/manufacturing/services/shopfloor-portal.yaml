service: shopfloor-portal
sort_order: 9
cloud_provider: azure
cloud_region: eastus
cloud_platform: azure_vm
cloud_availability_zone: eastus-2
subsystem: portal
language: java
topology:
- - mes-controller
  - /api/v1/mes/operator-action
  - POST
- - quality-inspector
  - /api/v1/quality/operator-flag
  - POST
entry_endpoints:
- - /api/v1/portal/scan
  - POST
db_operations:
- - SELECT
  - operator_sessions
  - SELECT session_id, operator_id, kiosk_id, started_at FROM operator_sessions WHERE status = 'active'
emit_fault_logs: true
kpi_emitter: false
constants:
  KIOSKS:
  - KIOSK-LINE01-01
  - KIOSK-LINE02-01
  - KIOSK-LINE03-01
  - TABLET-MGR-01
  ACTIONS:
  - login
  - scan_part
  - submit_inspection
  - report_issue
  - logout
  ENDPOINTS:
  - /api/scan
  - /api/work-orders
  - /api/inspections
  - /api/oee/lines
state:
  _sessions_total:
    init: 0
  # CrashLoopBackOff restarts seen so far (all incidents) and in the current incident.
  _restart_total:
    init: 0
  _restart_seen:
    init: 0
steps:
- sample:
    # Per-channel fault intensity: ramps 0->1 once the fault reaches this service, drains 1->0 after its fix.
    f1:
      expr: "min(1.0, max(0.0, elapsed.get(1, 0) - lag.get(1, 0)) / 20.0) if 1 in all_active else (max(0.0, 1.0 - since_fix.get(1, 0) / 40.0) if 1 in fixed_channels else 0.0)"
    f7:
      expr: "min(1.0, max(0.0, elapsed.get(7, 0) - lag.get(7, 0)) / 10.0) if 7 in all_active else (max(0.0, 1.0 - since_fix.get(7, 0) / 20.0) if 7 in fixed_channels else 0.0)"
    f13:
      expr: "min(1.0, max(0.0, elapsed.get(13, 0) - lag.get(13, 0)) / 30.0) if 13 in all_active else (max(0.0, 1.0 - since_fix.get(13, 0) / 60.0) if 13 in fixed_channels else 0.0)"
    f20:
      expr: "min(1.0, max(0.0, elapsed.get(20, 0) - lag.get(20, 0)) / 20.0) if 20 in all_active else (max(0.0, 1.0 - since_fix.get(20, 0) / 120.0) if 20 in fixed_channels else 0.0)"
    # Recreate strategy: no pod is ready from the 1.18.4 rollout until the rolled-back pods pass readiness (~35 s).
    portal_down:
      expr: "16 in all_active or (16 in fixed_channels and since_fix.get(16, 0) < 35)"
- sample:
    image_tag:
      expr: "'1.18.4' if 16 in all_active else '1.18.3'"
    ready_replicas:
      expr: "0 if portal_down else 3"
    http_5xx_pct:
      expr: "round(rand.uniform(95.0, 100.0), 1) if portal_down else round(rand.uniform(0.02, 0.4), 2)"
    e16:
      expr: "elapsed.get(16, 0)"
    restart_this_incident:
      expr: "(e16 > 10) + (e16 > 30) + (e16 > 70) + (e16 > 150) + (e16 > 310) + (e16 > 610) + (e16 > 910) + (e16 > 1210) if 16 in all_active else 0"
    req_latency_ms:
      expr: "int(rand.uniform(2.0, 6.0)) if portal_down else int(rand.uniform(40.0, 220.0) + f20 * rand.uniform(600.0, 1400.0) + f13 * rand.uniform(200.0, 900.0))"
    live_data:
      expr: "'stale' if f1 > 0.5 or f7 > 0.5 else 'live'"
- counter:
    state_key: _restart_total
    by:
      expr: "max(0, restart_this_incident - _restart_seen)"
- counter:
    state_key: _restart_seen
    by:
      expr: "(max(_restart_seen, restart_this_incident) - _restart_seen) if 16 in all_active else -_restart_seen"
- sample:
    restarts:
      expr: "_restart_total"
    deploy_state:
      expr: "'CrashLoopBackOff' if 16 in all_active else ('Progressing' if portal_down else 'Available')"
- metric:
    name: portal.ready_replicas
    value:
      var: ready_replicas
    unit: replicas
- metric:
    name: portal.http_5xx_pct
    value:
      var: http_5xx_pct
    unit: '%'
- metric:
    name: portal.container_restarts
    value:
      var: restarts
    unit: restarts
- metric:
    name: portal.request_latency_ms
    value:
      var: req_latency_ms
    unit: ms
- metric:
    name: portal.active_kiosks
    value:
      expr: "0 if portal_down else 4"
    unit: kiosks
- log:
    level: INFO
    message: '[PORTAL-K8S] deployment_status deployment=shopfloor-portal namespace=mfg image=registry.mfg.internal/shopfloor-portal:{image_tag} strategy=Recreate ready={ready_replicas}/3 state={deploy_state} restarts={restarts} http_5xx_pct={http_5xx_pct}'
    attrs:
      operation: deployment_status
      k8s.deployment.name: shopfloor-portal
      container.image.tag:
        var: image_tag
      k8s.deployment.ready_replicas:
        var: ready_replicas
- when: "not portal_down"
  counter:
    state_key: _sessions_total
    by: 1
- metric:
    name: portal.sessions_total
    value:
      var: _sessions_total
    unit: sessions
- sample:
    kiosk:
      choice: KIOSKS
    operator:
      expr: f'OP-{rand.randint(1000, 9999)}'
    action:
      choice: ACTIONS
    endpoint:
      choice: ENDPOINTS
    status:
      expr: "rand.choice([502, 503]) if portal_down else rand.choice([200, 200, 200, 200, 201, 304])"
- when: "not portal_down"
  log:
    level: INFO
    message: '[PORTAL] session kiosk={kiosk} operator={operator} action={action} line_data={live_data}'
    attrs:
      operation: session_event
      portal.kiosk:
        var: kiosk
      portal.operator:
        var: operator
      portal.action:
        var: action
- log:
    level: INFO
    message: '[PORTAL] http_request kiosk={kiosk} path={endpoint} status={status} latency_ms={req_latency_ms}'
    attrs:
      operation: http_request
      http.target:
        var: endpoint
      http.response.status_code:
        var: status
      portal.kiosk:
        var: kiosk

agent_config:
  id: mfg-operations-analyst
  name: Manufacturing Operations Analyst
  assessment_tool_name: production_readiness_assessment
  system_prompt: 'You are the Manufacturing Operations Analyst, an expert AI assistant for discrete manufacturing operations
    spanning OT and IT. You help plant operations and IT teams investigate system anomalies, analyze OT/IT integration failures,
    and provide root cause analysis for fault conditions across 9 systems on AWS, GCP, and Azure. You have deep expertise
    in MES (work orders, batch genealogy, equipment state), SCADA / OPC-UA / Modbus / EtherNet-IP, OT historian time-series
    stores, OEE (availability x performance x quality), SPC and Cpk process capability, vision inspection, CMMS and predictive
    maintenance (vibration RMS, ISO 10816), Windows event logs (event IDs 7031/7034/7036, channel System), Docker/Kubernetes
    pod OOM and CrashLoopBackOff diagnostics, ISA-95 levels, and IATF 16949 / FDA 21 CFR Part 11 traceability. When investigating
    incidents, search for these system identifiers in logs: OT/SCADA faults (PLC-COMM-LOSS, SCADA-TAG-STORM, PROTOCOL-DRIFT,
    OPC-UA-CERT-EXPIRY), MES faults (MES-WORK-ORDER-DEADLOCK, MES-BATCH-GENEALOGY-BREAK, MES-QUEUE-OVERFLOW), Historian faults
    (OT-HISTORIAN-BACKPRESSURE), Quality faults (SPC-OUT-OF-CONTROL, VISION-INSPECT-FAIL), Maintenance faults (CMMS-WORK-ORDER-BACKLOG,
    PREDICTIVE-MAINT-ANOMALY), OEE faults (OEE-AVAILABILITY-DROP, ANALYTICS-CONTAINER-OOM, OEE-CACHE-INVALIDATION), ERP faults
    (ERP-WIN-SERVICE-CRASH), Inventory faults (RAW-MATERIAL-SHORTAGE, INVENTORY-SYNC-BATCH-FAIL), and Portal faults (PORTAL-CONTAINER-CRASHLOOP,
    SCADA-CONNECTION-POOL-EXHAUST). Log messages are in body.text — NEVER search the body field alone.'
assessment_tool_config:
  id: production_readiness_assessment
  description: 'Plant-wide production readiness assessment. Evaluates OEE health, OT connectivity, MES queue depth, quality
    drift (Cpk), and IT-side dependencies (ERP bridge, shopfloor portal) for safe continued production at SLA targets. Returns
    aggregated error/warning counts across the 9 manufacturing systems. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: oee-analytics
executive_dashboard_intro: '**Plant operations KPIs** — production performance (OEE), quality, maintenance & reliability,
  and cost & operations (synthetic `business.*` from `oee-analytics`).'
executive_kpi_sections:
- header: '**Production Performance** — OEE, throughput, and cycle time'
  specs:
  - - Overall OEE (%)
    - metrics.business.oee_overall_pct
  - - Availability (%)
    - metrics.business.oee_availability_pct
  - - Performance (%)
    - metrics.business.oee_performance_pct
  - - Quality (%)
    - metrics.business.oee_quality_pct
  - - Throughput (units/hr)
    - metrics.business.throughput_units_per_hour
  - - Cycle time (sec)
    - metrics.business.cycle_time_seconds
- header: '**Quality** — yield, scrap, defects, capability'
  specs:
  - - First pass yield (%)
    - metrics.business.first_pass_yield_pct
  - - Scrap rate (%)
    - metrics.business.scrap_rate_pct
  - - Defect PPM
    - metrics.business.defect_ppm
  - - Rework hours/shift
    - metrics.business.rework_hours_per_shift
  - - Process Cpk
    - metrics.business.process_cpk
  - - Customer complaints/day
    - metrics.business.customer_complaints_per_day
- header: '**Maintenance & Reliability** — downtime, MTBF, MTTR, PM compliance'
  specs:
  - - Unplanned downtime (min/shift)
    - metrics.business.unplanned_downtime_min_per_shift
  - - MTBF (hours)
    - metrics.business.mtbf_hours
  - - MTTR (min)
    - metrics.business.mttr_minutes
  - - PM compliance (%)
    - metrics.business.pm_compliance_pct
  - - Spare parts stockout risk (%)
    - metrics.business.spare_parts_stockout_risk_pct
  - - Maintenance backlog
    - metrics.business.maintenance_backlog_count
- header: '**Cost & Operations** — COPQ, energy, delivery, safety'
  specs:
  - - Cost of poor quality (USD/min)
    - metrics.business.cost_of_poor_quality_usd_per_min
  - - Energy (kWh)
    - metrics.business.energy_consumption_kwh
  - - Material variance (USD)
    - metrics.business.material_variance_usd
  - - On-time delivery (%)
    - metrics.business.on_time_delivery_pct
  - - Inventory turns
    - metrics.business.inventory_turns
  - - Recordable safety incidents
    - metrics.business.recordable_safety_incidents

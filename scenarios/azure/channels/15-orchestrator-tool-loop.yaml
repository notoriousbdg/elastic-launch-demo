name: Orchestrator Tool Loop
subsystem: orchestration
vehicle_section: orchestration_pipeline
error_type: AGENT-TOOL-LOOP
sensor_type: health_check
affected_services: [chat-orchestrator]
cascade_services: [cost-guard, model-router]

description: Agent configuration v42 removed the stop condition, so the chat-orchestrator agent repeats the same retrieval tool call without terminating, inflating latency and token spend.

investigation_notes: |
  Root cause: agent-config revision {agent_config} for chat-orchestrator was deployed shortly before the first AGENT-TOOL-LOOP and removed the iteration stop condition. Turns now call {tool_name} with near-identical arguments (args_hash={args_hash}) for iterations={iteration_count} cycles against an expected limit of {normal_max_iterations}. The tool and its result schema are unchanged, so retrieval and the model deployment are not at fault.
  Confirm:
    - metric chat.tool_calls_per_turn rises from 0-3 to 25-120; chat-orchestrator logs "chat.agent_status" with attributes.agent.config_version={agent_config} and status=ANOMALY
    - tokens_per_turn={tokens_per_turn} against a normal {normal_tokens_per_turn}; chat.token_cost_usd_per_conversation and chat.turn_latency_ms rise with it, and cost-guard shows spend_rate_per_min={spend_rate} with {router_calls_per_turn} model calls per user turn on model-router
    - the config-service record for agent-config/chat-orchestrator (revision v42, stop condition removed) comes minutes before the first loop
    - chat.openai_quota_headroom_pct and the other Azure OpenAI deployments are unaffected by a config problem, which rules out throttling as the cause of the long turns
  Remediation: roll the agent configuration back to the previous revision (v41) with opsctl rollback agent-config/chat-orchestrator --to-revision previous. New turns stop looping straight away and tool calls per turn return to 5 or fewer within about 45 seconds. Raising quota or restarting the orchestrator only hides the loop and keeps burning tokens.

remediation_action: cap_agent_tool_iterations
remediation_command: |-
  opsctl rollback agent-config/chat-orchestrator --to-revision previous

error_message: |
  [ChatOrchestrator] AGENT-TOOL-LOOP: session={session_id} tool={tool_name} iterations={iteration_count} (limit {normal_max_iterations}) tokens_per_turn={tokens_per_turn} agent_config={agent_config}

stack_trace: |
  AgentLoopException: AGENT-TOOL-LOOP
    at AgentRunner.executeToolCall(tool={tool_name}, args_hash={args_hash})
    at ChatOrchestrator.runTurn(session={session_id})
  Iterations:          {iteration_count} (limit: {normal_max_iterations})
  Tokens per turn:     {tokens_per_turn} (normal: {normal_tokens_per_turn})
  Model calls/turn:    {router_calls_per_turn}
  Spend rate:          {spend_rate} USD/min
  Agent config:        {agent_config}

correlation_attr:
  key: agent.config_version
  value: agent-config-v42

fault_params:
  session_id: {choice: ["sess-4c81e0", "sess-9ab2d7", "sess-e03f56", "sess-71d9b3"]}
  tool_name: search_knowledge_base
  args_hash: {choice: ["a91f03", "3be7c2", "d6104e"]}
  iteration_count: {randint: [25, 120]}
  normal_max_iterations: 5
  tokens_per_turn: {randint: [40000, 220000]}
  normal_tokens_per_turn: 3500
  router_calls_per_turn: {randint: [25, 120]}
  spend_rate: {uniform: [12, 85], round: 1}
  agent_config: "agent-config-v42"

rca_clues:
  chat-orchestrator:
    agent.tool_iterations_per_turn: {randint: [25, 120]}
    agent.repeated_tool_call_ratio: {uniform: [0.80, 0.99], round: 2}
    agent.stop_condition_missing: true
    agent.tool_result_schema_changed: false
  cost-guard:
    cost.spend_rate_usd_per_min: {uniform: [12, 85], round: 1}
    cost.tokens_per_turn_p95: {randint: [40000, 220000]}
  model-router:
    router.calls_per_turn_p95: {randint: [25, 120]}
    router.queue_wait_ms: {randint: [300, 3500]}

cascade_messages:
  cost-guard:
    - severity: WARN
      message: 'cost.spend_rate usd_per_min={spend_rate} tokens_per_turn_p95={tokens_per_turn} budget alert not yet evaluated; one caller (chat-orchestrator) drives the increase'
  model-router:
    - severity: WARN
      message: 'router.calls_per_turn p95={router_calls_per_turn} caller=chat-orchestrator queue_wait elevated; request pattern is repeated identical prompts'

service_lag_seconds: {cost-guard: 20, model-router: 10}
fault_scope:
  workloads: [chat-orchestrator]

infrastructure_events:
  - service: chat-orchestrator
    severity: INFO
    offset_seconds: -120
    body: 'config-service: change applied agent-config/chat-orchestrator rev=v42 by=release-pipeline@contoso-demo.onmicrosoft.com : agent-config-v42 deployed (stop_condition removed, max_iterations unset)'
    attributes:
      user.name: release-pipeline@contoso-demo.onmicrosoft.com
      operation: config_deploy
      config.target: agent-config/chat-orchestrator
      agent.config_version: agent-config-v42
      change.summary: 'agent-config-v41 -> agent-config-v42: stop_condition removed'

remediation_effects:
  log_events:
    - service: chat-orchestrator
      severity: INFO
      offset_seconds: 1
      body: 'config-service: change applied agent-config/chat-orchestrator cmd="opsctl rollback agent-config/chat-orchestrator --to-revision=previous" by={actor} : agent-config-v42 -> agent-config-v41, stop condition restored'
      attributes:
        operation: config_rollback
        agent.config_version: agent-config-v41
        change.summary: 'agent-config-v42 -> agent-config-v41'
  steady_attributes:
    chat-orchestrator:
      agent.config_version: agent-config-v41
  verification:
    - signal: chat.tool_calls_per_turn
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "chat-orchestrator"'
      field: 'metrics.chat.tool_calls_per_turn'
      expect: '5 or fewer (was 25-120)'
      within_seconds: 60
    - signal: chat.token_cost_usd_per_conversation
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "chat-orchestrator"'
      field: 'metrics.chat.token_cost_usd_per_conversation'
      expect: 'back in the normal 0.35-1.1 USD band'
      within_seconds: 60
    - signal: agent config revision
      from: 'logs.otel.azureai'
      where: 'resource.attributes.service.name == "chat-orchestrator"'
      field: 'attributes.agent.config_version'
      expect: 'agent-config-v41 on every line logged since the fix; agent-config-v42 stops appearing'
      within_seconds: 60
    - signal: model_router.calls_per_turn_p95
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "model-router"'
      field: 'metrics.model_router.calls_per_turn_p95'
      expect: 'back to 2-4 calls per turn (was 25-120)'
      within_seconds: 60

business_impact:
  - kpi: business.tokens_per_conversation
    factor: {uniform: [4.0, 9.0]}
  - kpi: business.latency_p99_ms
    factor: {uniform: [2.5, 5.0]}
  - kpi: business.throughput_rpm
    value: {uniform: [604.5, 695.5], round: 0}
  - kpi: business.conversations_per_min
    factor: {uniform: [0.55, 0.8]}

generator_impact:
  azure_ai_foundry:
    provisioned_utilization_above_threshold: 92.0
    latency_high: 7000.0
generator_hold_seconds: {azure_ai_foundry: 45}

name: Privilege Escalation Key Vault Read
subsystem: identity
vehicle_section: identity_pipeline
error_type: IAM-PRIV-ESC-KEYVAULT-READ
sensor_type: health_check
affected_services: [identity-broker, chat-orchestrator]
cascade_services: []
description: The Activity Log shows a role assignment write granting Owner to a service principal, followed by Key Vault secret reads by that principal that need security review.
investigation_notes: |-
  Root cause: a role assignment write (id 7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3) granted {role_name} at {role_scope} to {principal_name}, initiated by {initiator_upn} without a PIM activation or change ticket. The principal then read secrets from {key_vault_name}, so the secrets it read must be treated as exposed. The vault and the identity platform are healthy.
  Confirm:
    - identity-broker metric identity_broker.keyvault_unapproved_secret_reads_per_min is 10-24 (normal 0) and starts within minutes of the grant; {secret_read_count} SecretGet calls in {minutes_after_grant} minutes from caller_ip={caller_ip}
    - identity-broker log attributes authz.role_assignment=7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3 (role {role_name}, principal {principal_name}) and keyvault.secret_version=a41c07d9 (the version the principal read) on the credential_health line
    - the Activity Log line operationName=Microsoft.Authorization/roleAssignments/write by {initiator_upn} (cause event) comes before the first IAM-PRIV-ESC-KEYVAULT-READ
    - the broker's own routine vault reads (key_vault_reads in credential_health) stay at the usual 3-14 per minute and token validation latency and failure rate stay normal, which rules out a Key Vault outage, a new application rollout and an expired credential
  Remediation: two commands, both required. Delete the role assignment with opsctl delete role-assignment/7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3, then rotate the exposed secret with opsctl rotate keyvault-secret/openai-api-key --vault {key_vault_name}. Deleting the assignment stops further reads; rotating makes the values already read useless. Blocking the caller IP alone leaves the Owner grant in place.
remediation_action: revoke_role_assignment
remediation_command: |-
  opsctl delete role-assignment/7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3
  opsctl rotate keyvault-secret/openai-api-key --vault kv-azureai-prod-weu
service_lag_seconds: {chat-orchestrator: 45}
fault_scope:
  workloads: [identity-broker, chat-orchestrator]
error_message: '[IdentityBroker] IAM-PRIV-ESC-KEYVAULT-READ: principal={principal_name} granted role={role_name} scope={role_scope} initiator={initiator_upn} secret_reads={secret_read_count} vault={key_vault_name}'
stack_trace: |-
  PrivilegeEscalationDetectedException: IAM-PRIV-ESC-KEYVAULT-READ
    at IdentityBroker.auditRoleAssignment(principal={principal_name})
    at KeyVaultAccessMonitor.flagSecretRead(vault={key_vault_name})
  Role granted:    {role_name}
  Scope:           {role_scope}
  Initiator:       {initiator_upn}
  Secret reads:    {secret_read_count} within {minutes_after_grant} min
  Caller IP:       {caller_ip}
correlation_attr:
  key: azure.role_assignment_id
  value: 7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3
fault_params:
  principal_name: sp-identity-broker-prod
  role_name: Owner
  role_scope: /subscriptions/38514ecc-371c-5d0a-9c14-ab99a396027d
  initiator_upn: dev.contractor@contoso-demo.onmicrosoft.com
  key_vault_name: kv-azureai-prod-weu
  secret_read_count: {randint: [60, 140]}
  minutes_after_grant: 6
  caller_ip: 203.0.113.47
infrastructure_events:
  - service: identity-broker
    severity: WARN
    offset_seconds: -120
    body: 'azure-activity: operationName=Microsoft.Authorization/roleAssignments/write resourceId=/subscriptions/38514ecc-371c-5d0a-9c14-ab99a396027d/resourceGroups/azureai-rg/providers/Microsoft.Authorization/roleAssignments/7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3 caller=dev.contractor@contoso-demo.onmicrosoft.com status=Succeeded category=Administrative'
    attributes:
      cloud.provider: azure
      azure.activity.operation_name: Microsoft.Authorization/roleAssignments/write
      azure.activity.resource_provider: Microsoft.Authorization/roleAssignments
      event.action: Microsoft.Authorization/roleAssignments/write
      user.name: dev.contractor@contoso-demo.onmicrosoft.com
      authz.role_assignment: 7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3
      change.summary: 'sp-identity-broker-prod roles: Key Vault Secrets User -> Owner (scope /subscriptions/38514ecc-371c-5d0a-9c14-ab99a396027d)'
remediation_effects:
  log_events:
    - service: identity-broker
      severity: INFO
      offset_seconds: 1
      body: 'azure-activity: operationName=Microsoft.Authorization/roleAssignments/delete resourceId=/subscriptions/38514ecc-371c-5d0a-9c14-ab99a396027d/resourceGroups/azureai-rg/providers/Microsoft.Authorization/roleAssignments/7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3 caller={actor} status=Succeeded category=Administrative'
      attributes:
        cloud.provider: azure
        azure.activity.operation_name: Microsoft.Authorization/roleAssignments/delete
        azure.activity.resource_provider: Microsoft.Authorization/roleAssignments
        event.action: Microsoft.Authorization/roleAssignments/delete
        operation: role_assignment_delete
        authz.role_assignment: revoked
        change.summary: 'sp-identity-broker-prod Owner assignment 7c1e5d2a revoked'
    - service: identity-broker
      severity: INFO
      offset_seconds: 2
      body: 'azure-activity: operationName=Microsoft.KeyVault/vaults/secrets/write resourceId=/subscriptions/38514ecc-371c-5d0a-9c14-ab99a396027d/resourceGroups/azureai-rg/providers/Microsoft.KeyVault/vaults/secrets/openai-api-key caller={actor} status=Succeeded category=Administrative'
      attributes:
        cloud.provider: azure
        azure.activity.operation_name: Microsoft.KeyVault/vaults/secrets/write
        azure.activity.resource_provider: Microsoft.KeyVault/vaults/secrets
        event.action: Microsoft.KeyVault/vaults/secrets/write
        operation: secret_rotate
        keyvault.secret_version: f7b20c5e
        change.summary: 'openai-api-key version a41c07d9 -> f7b20c5e (vault kv-azureai-prod-weu)'
  steady_attributes:
    identity-broker:
      authz.role_assignment: revoked
      keyvault.secret_version: f7b20c5e
  verification:
    - signal: identity_broker.keyvault_unapproved_secret_reads_per_min
      from: 'metrics-generic.otel-default'
      where: 'resource.attributes.service.name == "identity-broker"'
      field: 'metrics.identity_broker.keyvault_unapproved_secret_reads_per_min'
      expect: '0 (was 10-24)'
      within_seconds: 90
    - signal: role assignment state
      from: 'logs.otel.azureai'
      where: 'resource.attributes.service.name == "identity-broker"'
      field: 'attributes.authz.role_assignment'
      expect: 'revoked on every line logged since the fix; 7c1e5d2a-93b4-4f0e-a6d8-2b9f41c0e6a3 stops appearing'
      within_seconds: 90
    - signal: openai-api-key secret version
      from: 'logs.otel.azureai'
      where: 'resource.attributes.service.name == "identity-broker"'
      field: 'attributes.keyvault.secret_version'
      expect: 'f7b20c5e on every line logged since the fix; a41c07d9 stops appearing'
      within_seconds: 90
rca_clues:
  identity-broker:
    iam.role_assignment_writes_last_hour: {randint: [1, 4]}
    iam.keyvault_secret_gets: {randint: [60, 140]}
    iam.pim_activation_found: false
  chat-orchestrator:
    orchestrator.unexpected_token_exchanges: {randint: [5, 60]}
    orchestrator.credential_source: broker_key_vault
business_impact:
  - kpi: business.error_rate_pct
    value: {uniform: [5.46, 6.29], round: 2}
  - kpi: business.availability_pct
    factor: {uniform: [0.92, 0.98]}
  - kpi: business.conversations_per_min
    value: {uniform: [74.4, 85.6], round: 0}
generator_impact:
  azure_activity_otel:
    role_assignment_write_privilege_escalation: 1.0
    sensitive_key_access: 1.0

name: App Gateway Backend Unhealthy
subsystem: api_gateway
vehicle_section: api_gateway_pipeline
error_type: AGW-BACKEND-UNHEALTHY
sensor_type: health_check
affected_services: [assistant-web]
cascade_services: [chat-orchestrator]

description: A newly applied NSG rule on the assistant-web subnet denies Application Gateway health probes, so the gateway marks the backend pool unhealthy; reverting the rule restores traffic.

investigation_notes: |
  1. Search body.text for *AGW-BACKEND-UNHEALTHY* and read unhealthy_hosts={unhealthy_hosts} of {pool_size} in pool {backend_pool}.
  2. Inspect the health probe: path {probe_path} times out after {probe_timeout_s}s even though the assistant-web instances are running and serving direct requests (direct request success above 99% rules out an application failure).
  3. Check VNet flow logs (data_stream.dataset azure.vnetflow.otel) for azure.vnet.flow.action Deny with azure.vnet.flow.state D on destination.port {probe_port}: about {denied_flows_per_min} denied flows/min, all matched by azure.vnet.flow.rule {nsg_rule}.
  4. Confirm the timing: the Activity Log shows a securityRules write for {nsg_rule} on {nsg_name} just before the first probe failure, Resource Health reports the Application Gateway as Degraded, and chat-orchestrator request volume drops as the gateway returns 502 ({gateway_502_per_min}/min).
  5. Revert the NSG rule change (restore the previous rule set or remove {nsg_rule}); this is a bounded revert of the last change, so it is safe to automate.
  6. Verify the Deny share in the flow logs falls back to baseline, the healthy host count returns to {pool_size}, and 502s stop.

remediation_action: revert_nsg_rule

error_message: |
  AGW-BACKEND-UNHEALTHY: pool={backend_pool} unhealthy={unhealthy_hosts}/{pool_size} probe_path={probe_path} timeout={probe_timeout_s}s nsg_rule={nsg_rule} denied_flows={denied_flows_per_min}/min 502s={gateway_502_per_min}/min

stack_trace: |
  BackendHealthException: AGW-BACKEND-UNHEALTHY
    at ApplicationGateway.evaluateBackendHealth(pool={backend_pool})
    at HealthProbe.run(path={probe_path}, port={probe_port})
  Probe timeout:     {probe_timeout_s}s
  Unhealthy hosts:   {unhealthy_hosts}/{pool_size}
  NSG:               {nsg_name}
  Deny rule:         {nsg_rule}
  Denied flows:      {denied_flows_per_min}/min (VNet flow log state D)
  Gateway 502s:      {gateway_502_per_min}/min

correlation_attr:
  key: azure.nsg.rule_change
  value: nsg-assistant-web-ruleset-v14

fault_params:
  backend_pool: pool-assistant-web-eastus
  unhealthy_hosts: 6
  pool_size: 6
  probe_path: {choice: [/healthz, /health/ready]}
  probe_port: 443
  probe_timeout_s: {choice: [30, 60]}
  nsg_name: nsg-assistant-web-subnet
  nsg_rule: UserRule_deny-untrusted-inbound
  denied_flows_per_min: {randint: [200, 2500]}
  gateway_502_per_min: {randint: [120, 1800]}

rca_clues:
  assistant-web:
    appgw.backend_health_state: Unhealthy
    appgw.probe_timeouts_last_5m: {randint: [20, 200]}
    nsg.recent_rule_change: true
    web.direct_request_success_pct: {uniform: [99.2, 100.0], round: 1}
  chat-orchestrator:
    orchestrator.inbound_requests_drop_pct: {uniform: [40.0, 85.0], round: 1}
    orchestrator.idle_sessions: {randint: [50, 400]}

business_impact:
  - kpi: business.throughput_rpm
    factor: {uniform: [0.20, 0.50]}
  - kpi: business.availability_pct
    factor: {uniform: [0.70, 0.90]}
  - kpi: business.error_rate_pct
    factor: {uniform: [3.0, 8.0]}

generator_impact:
  azure_vnetflow_otel:
    deny_rate: 0.8
  azure_activity_otel:
    resource_health_degradation: 1.0

service: retrieval-service
sort_order: 3
cloud_provider: azure
cloud_region: eastus
cloud_platform: azure_vm
cloud_availability_zone: eastus-3
subsystem: retrieval
language: python

# Topology: [downstream-service, endpoint, METHOD]
topology:
  - [embedding-service, /api/v1/embed, POST]

entry_endpoints:
  - [/api/v1/retrieve, POST]

db_operations:
  - [SEARCH, kb-articles-index, "POST /indexes/kb-articles-index/docs/search?api-version=2024-07-01 {search, vectorQueries[k=8], queryType=semantic, top=8}"]
  - [SEARCH, policy-docs-index, "POST /indexes/policy-docs-index/docs/search?api-version=2024-07-01 {search, vectorQueries[k=5], filter=audience eq 'customer', top=5}"]

emit_fault_logs: true
kpi_emitter: false

constants:
  INDEXES: [kb-articles-index, policy-docs-index, product-faq-index]

steps:
  # ch11 (ranker config rerank200 + exhaustive kNN) is the only channel that moves query latency
  - sample:
      base_latency_ms: {uniform: [45.0, 160.0], round: 1}
      search_latency_ms:
        expr: "round(base_latency_ms + (rand.uniform(1800.0, 6500.0) - base_latency_ms) * min(1.0, elapsed.get(11, 0) / 45.0), 1) if 11 in all_active
          else (round(4000.0 * (1.0 - min(1.0, since_fix.get(11, 0) / 60.0)) + base_latency_ms * min(1.0, since_fix.get(11, 0) / 60.0), 1) if 11 in fixed_channels
          else base_latency_ms)"
      search_status:
        expr: "'ANOMALY' if 11 in all_active or search_latency_ms > 1000.0 else 'NOMINAL'"
      ranker_config:
        expr: "'semantic-ranker-v3-rerank200' if 11 in all_active else 'semantic-ranker-v3-rerank50'"
      semantic_rank_ms: {uniform: [30.0, 110.0], round: 1}
      avg_relevance: {uniform: [0.72, 0.91], round: 3}
      search_units_used_pct: {uniform: [22.0, 71.0], round: 1}
  # ch6 (embedding dimension 3072 against a 1536 index): vector queries are rejected, so results come back empty
  - sample:
      empty_p:
        expr: "rand.uniform(0.35, 0.9) * min(1.0, max(0.0, elapsed.get(6, 0) - lag.get(6, 0)) / 45.0) if (6 in all_active and elapsed.get(6, 0) >= lag.get(6, 0))
          else (0.6 * (1.0 - min(1.0, since_fix.get(6, 0) / 90.0)) if 6 in fixed_channels else 0.0)"
      hits_returned:
        expr: "0 if rand.uniform(0.0, 1.0) < empty_p else rand.randint(5, 8)"
      empty_result_pct:
        expr: "round(empty_p * 100.0, 1)"
      vector_status:
        expr: "'ANOMALY' if (6 in all_active and elapsed.get(6, 0) >= lag.get(6, 0)) or empty_p > 0.05 else 'NOMINAL'"
  # ch5 (indexer data source credentials expired): the index stops receiving documents, freshness grows over days.
  # ch13 (embedding backlog): new documents wait in the queue, so freshness grows to the oldest job's age (hours, not days).
  - sample:
      base_freshness_min: {uniform: [2.0, 18.0], round: 0}
      index_freshness_min:
        expr: "round(base_freshness_min + (2880.0 + 11520.0 * min(1.0, elapsed.get(5, 0) / 7200.0) - base_freshness_min) * min(1.0, elapsed.get(5, 0) / 45.0), 0) if 5 in all_active
          else (round(7000.0 * (1.0 - min(1.0, since_fix.get(5, 0) / 150.0)) + base_freshness_min * min(1.0, since_fix.get(5, 0) / 150.0), 0) if 5 in fixed_channels
          else (round(base_freshness_min + (rand.uniform(90.0, 480.0) - base_freshness_min) * min(1.0, max(0.0, elapsed.get(13, 0) - lag.get(13, 0)) / 90.0), 0) if (13 in all_active and elapsed.get(13, 0) >= lag.get(13, 0))
          else (round(300.0 * (1.0 - min(1.0, since_fix.get(13, 0) / 150.0)) + base_freshness_min * min(1.0, since_fix.get(13, 0) / 150.0), 0) if 13 in fixed_channels
          else base_freshness_min)))"
      index_hours_since_success:
        expr: "round(index_freshness_min / 60.0, 1)"
      indexer_status:
        expr: "'error' if 5 in all_active else 'success'"
      indexer_error:
        expr: "'Data source credentials expired' if 5 in all_active else 'none'"
      index_status:
        expr: "'ANOMALY' if 5 in all_active or index_freshness_min > 360.0 else 'NOMINAL'"
  # ch20 (result cache not invalidated on index refresh): stale entries keep being served
  - sample:
      base_cache_hit_pct: {uniform: [38.0, 66.0], round: 1}
      cache_hit_pct:
        expr: "round(base_cache_hit_pct + (rand.uniform(72.0, 92.0) - base_cache_hit_pct) * min(1.0, elapsed.get(20, 0) / 45.0), 1) if 20 in all_active
          else (round(2.0 + (base_cache_hit_pct - 2.0) * min(1.0, since_fix.get(20, 0) / 240.0), 1) if 20 in fixed_channels
          else base_cache_hit_pct)"
      cache_stale_hit_pct:
        expr: "round(rand.uniform(30.0, 85.0) * min(1.0, elapsed.get(20, 0) / 45.0), 1) if 20 in all_active
          else (round(55.0 * (1.0 - min(1.0, since_fix.get(20, 0) / 30.0)), 1) if 20 in fixed_channels else 0.0)"
      cache_config:
        expr: "'invalidate_on_index_refresh=false' if 20 in all_active else 'invalidate_on_index_refresh=true'"
      cache_status:
        expr: "'ANOMALY' if 20 in all_active or cache_stale_hit_pct > 5.0 else 'NOMINAL'"
  - metric:
      name: retrieval.search_latency_ms
      value: {var: search_latency_ms}
      unit: ms
  - metric:
      name: retrieval.semantic_ranker_ms
      value: {var: semantic_rank_ms}
      unit: ms
  - metric:
      name: retrieval.hits_returned
      value: {var: hits_returned}
      unit: hits
  - metric:
      name: retrieval.avg_relevance_score
      value: {var: avg_relevance}
      unit: score
  - metric:
      name: retrieval.index_freshness_minutes
      value: {var: index_freshness_min}
      unit: min
  - metric:
      name: retrieval.cache_hit_pct
      value: {var: cache_hit_pct}
      unit: '%'
  - metric:
      name: retrieval.cache_stale_hit_pct
      value: {var: cache_stale_hit_pct}
      unit: '%'
  - metric:
      name: retrieval.search_units_used_pct
      value: {var: search_units_used_pct}
      unit: '%'
  - log:
      level: INFO
      message: 'retrieval.search_health index=kb-passages-prod search_latency_ms={search_latency_ms} semantic_ranker_ms={semantic_rank_ms} ranker_config={ranker_config} avg_relevance={avg_relevance} status={search_status}'
      attrs:
        operation: search_health
        search.index: kb-passages-prod
        search.latency_ms: {var: search_latency_ms}
        search.semantic_ranker_ms: {var: semantic_rank_ms}
        search.avg_relevance: {var: avg_relevance}
        search.ranker_config: {var: ranker_config}
        search.status: {var: search_status}
  - log:
      level: INFO
      message: 'retrieval.vector_query index=kb-passages-v4 hits={hits_returned} empty_result_pct={empty_result_pct}% index_vector_dimensions=1536 status={vector_status}'
      attrs:
        operation: vector_query
        search.index: kb-passages-v4
        search.hits_returned: {var: hits_returned}
        search.empty_result_pct: {var: empty_result_pct}
        search.index_dimensions: 1536
        search.status: {var: vector_status}
  - log:
      level: INFO
      message: 'retrieval.index_status index=kb-docs-index-prod indexer=kb-docs-indexer indexer_status={indexer_status} freshness_min={index_freshness_min} hours_since_success={index_hours_since_success} slo_hours=6 search_units={search_units_used_pct}% status={index_status}'
      attrs:
        operation: index_status
        search.index: kb-docs-index-prod
        search.indexer: kb-docs-indexer
        search.indexer_status: {var: indexer_status}
        search.indexer_error: {var: indexer_error}
        search.index_freshness_min: {var: index_freshness_min}
        search.status: {var: index_status}
  - log:
      level: INFO
      message: 'retrieval.cache_status cache=retrieval-results index=kb-passages-prod hit={cache_hit_pct}% stale_hit={cache_stale_hit_pct}% ttl_s=900 {cache_config} status={cache_status}'
      attrs:
        operation: cache_status
        cache.name: retrieval-results
        cache.hit_pct: {var: cache_hit_pct}
        cache.stale_hit_pct: {var: cache_stale_hit_pct}
        cache.config: {var: cache_config}
        cache.status: {var: cache_status}

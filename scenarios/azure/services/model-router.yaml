service: model-router
sort_order: 5
cloud_provider: azure
cloud_region: eastus2
cloud_platform: azure_vm
cloud_availability_zone: eastus2-2
subsystem: model_serving
language: go

# Topology: [downstream-service, endpoint, METHOD]
topology: []

db_operations: []

emit_fault_logs: true
kpi_emitter: false

constants: {}

state:
  _route_count:
    init: 0
  _last_summary:
    init: now

steps:
  - sample:
      deployment:
        choice: [gpt-4o-prod-eastus2, gpt-4o-prod-eastus2, gpt-4o-mini-prod-eastus2, foundry-reasoning-prod, gpt-4o-prod-swedencentral]
      backend:
        choice: [azure_openai, azure_openai, azure_openai, microsoft_foundry]
      route_reason:
        choice: [intent_simple_faq, intent_complex_reasoning, tenant_pinned_deployment, quota_headroom_balance]
      prompt_tokens:
        randint: [600, 4200]
      completion_tokens:
        randint: [120, 900]
      tpm_used_pct:
        if_active:
          uniform: [96.0, 100.0]
          round: 1
        else:
          uniform: [38.0, 76.0]
          round: 1
      throttled_429:
        if_active:
          randint: [25, 90]
        else:
          randint: [0, 2]
      canary_share_pct:
        if_active:
          uniform: [45.0, 60.0]
          round: 1
        else:
          uniform: [4.0, 6.0]
          round: 1
      route_latency_ms:
        if_active:
          uniform: [1800.0, 9500.0]
          round: 1
        else:
          uniform: [420.0, 1600.0]
          round: 1
  - counter:
      state_key: _route_count
      by: 1
  - log:
      level: INFO
      message: '[MODEL_ROUTER] route_selected deployment={deployment} backend={backend} reason={route_reason} prompt_tokens={prompt_tokens} completion_tokens={completion_tokens} latency={route_latency_ms}ms'
      attrs:
        operation: route_selected
        router.deployment:
          var: deployment
        router.backend:
          var: backend
        router.reason:
          var: route_reason
        router.prompt_tokens:
          var: prompt_tokens
        router.completion_tokens:
          var: completion_tokens
        router.latency_ms:
          var: route_latency_ms
  - log:
      level: INFO
      message: '[MODEL_ROUTER] quota_health deployment={deployment} tpm_used={tpm_used_pct}% throttled_429={throttled_429} canary_share={canary_share_pct}% status=NORMAL'
      attrs:
        operation: quota_health
        router.deployment:
          var: deployment
        router.tpm_used_pct:
          var: tpm_used_pct
        router.throttled_429:
          var: throttled_429
        router.canary_share_pct:
          var: canary_share_pct
  - every:
      seconds: 10
      state_key: _last_summary
      steps:
        - log:
            level: INFO
            message: '[MODEL_ROUTER] router_summary routed_total={_route_count} stable_deployment=gpt-4o-2026-08-06 canary_deployment=gpt-4o-2026-10-01 failover_region=swedencentral status=NORMAL'
            attrs:
              operation: router_summary
              router.routed_total:
                var: _route_count
  - metric:
      name: model_router.route_latency_ms
      value:
        var: route_latency_ms
      unit: ms
  - metric:
      name: model_router.prompt_tokens
      value:
        var: prompt_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.completion_tokens
      value:
        var: completion_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.total_tokens
      value:
        expr: prompt_tokens + completion_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.tpm_quota_used_pct
      value:
        var: tpm_used_pct
      unit: '%'
  - metric:
      name: model_router.throttled_429_count
      value:
        var: throttled_429
      unit: '{responses}'
  - metric:
      name: model_router.canary_traffic_share_pct
      value:
        var: canary_share_pct
      unit: '%'

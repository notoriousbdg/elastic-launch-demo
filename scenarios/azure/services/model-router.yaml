service: model-router
sort_order: 5
cloud_provider: azure
cloud_region: eastus2
cloud_platform: azure_vm
cloud_availability_zone: eastus2-2
subsystem: model_serving
language: go

# Topology: [downstream-service, endpoint, METHOD]
topology: []

db_operations: []

emit_fault_logs: true
kpi_emitter: false

constants: {}

state:
  _route_count:
    init: 0
  _last_summary:
    init: now

steps:
  - sample:
      ramp1:
        expr: "min(1.0, elapsed.get(1, 0) / 45.0)"
      ramp10:
        expr: "min(1.0, elapsed.get(10, 0) / 45.0)"
      ramp16:
        expr: "min(1.0, elapsed.get(16, 0) / 45.0)"
      # ch1: Foundry deployment gpt-4o-chat-prod answers slowly after the model version update
      lat_base:
        expr: "rand.uniform(420.0, 1600.0)"
      tpm_base:
        expr: "rand.uniform(38.0, 76.0)"
      avail_val:
        expr: "round(99.8 + (rand.uniform(93.0, 97.0) - 99.8) * ramp1, 1) if 1 in all_active
          else (round(95.0 + (rand.uniform(99.6, 100.0) - 95.0) * min(1.0, since_fix.get(1, 0) / 60.0), 1) if 1 in fixed_channels
          else round(rand.uniform(99.6, 100.0), 1))"
      route_latency_ms:
        expr: "round(lat_base + (rand.uniform(5000.0, 9500.0) - lat_base) * ramp1, 1) if 1 in all_active
          else (round(6500.0 + (lat_base - 6500.0) * min(1.0, since_fix.get(1, 0) / 60.0), 1) if 1 in fixed_channels
          else round(lat_base, 1))"
      foundry_model_version:
        expr: "'gpt-4o-2024-11-20' if 1 in all_active else 'gpt-4o-2024-08-06'"
      avail_status:
        expr: "'ANOMALY' if 1 in all_active or avail_val < 99.0 else 'NOMINAL'"
      # ch10: canary route weight raised from 5 to 25 on a deployment that returns empty completions
      canary_share_pct:
        expr: "round(5.0 + (rand.uniform(24.0, 26.0) - 5.0) * ramp10, 1) if 10 in all_active
          else (round(max(0.0, rand.uniform(24.0, 26.0) * (1.0 - min(1.0, since_fix.get(10, 0) / 30.0))), 1) if 10 in fixed_channels
          else round(rand.uniform(4.0, 6.0), 1))"
      empty_completion_pct:
        expr: "round(rand.uniform(0.0, 0.5) + rand.uniform(30.0, 75.0) * ramp10, 1) if 10 in all_active
          else (round(rand.uniform(30.0, 75.0) * (1.0 - min(1.0, since_fix.get(10, 0) / 30.0)) + rand.uniform(0.0, 0.5), 1) if 10 in fixed_channels
          else round(rand.uniform(0.0, 0.5), 1))"
      canary_weight:
        expr: "25 if 10 in all_active else (0 if 10 in fixed_channels else 5)"
      canary_status:
        expr: "'ANOMALY' if 10 in all_active or empty_completion_pct > 5.0 else 'NOMINAL'"
      # ch16: tokens-per-minute quota of chat-gpt4o-eastus exhausted after the capacity cut
      tpm_used_pct:
        expr: "round(tpm_base + (rand.uniform(96.0, 100.0) - tpm_base) * ramp16, 1) if 16 in all_active
          else (round(98.0 + (tpm_base - 98.0) * min(1.0, since_fix.get(16, 0) / 60.0), 1) if 16 in fixed_channels
          else round(tpm_base, 1))"
      throttled_429:
        expr: "int(rand.uniform(25, 90) * ramp16) + rand.randint(0, 2) if 16 in all_active
          else (int(rand.uniform(25, 90) * (1.0 - min(1.0, since_fix.get(16, 0) / 60.0))) + rand.randint(0, 2) if 16 in fixed_channels
          else rand.randint(0, 2))"
      tpm_capacity:
        expr: "450000 if 16 in all_active else 600000"
      quota_status:
        expr: "'ANOMALY' if 16 in all_active or tpm_used_pct > 95.0 or throttled_429 > 10 else 'NOMINAL'"
      # ch15: the orchestrator's tool loop multiplies model calls per user turn
      ramp15:
        expr: "min(1.0, max(0.0, elapsed.get(15, 0) - lag.get(15, 0)) / 45.0)"
      calls_per_turn_p95:
        expr: "round(3.0 + (rand.uniform(25.0, 120.0) - 3.0) * ramp15, 1) if (15 in all_active and elapsed.get(15, 0) >= lag.get(15, 0))
          else (round(max(3.0, rand.uniform(25.0, 120.0) * (1.0 - min(1.0, since_fix.get(15, 0) / 45.0))), 1) if 15 in fixed_channels
          else round(rand.uniform(2.0, 4.0), 1))"
      # ch14: with the budget misread as nearly unused, cost-guard never throttles premium traffic
      ramp14:
        expr: "min(1.0, max(0.0, elapsed.get(14, 0) - lag.get(14, 0)) / 45.0)"
      premium_share_pct:
        expr: "round(32.0 + (rand.uniform(70.0, 95.0) - 32.0) * ramp14, 1) if (14 in all_active and elapsed.get(14, 0) >= lag.get(14, 0))
          else (round(32.0 + (rand.uniform(70.0, 95.0) - 32.0) * (1.0 - min(1.0, since_fix.get(14, 0) / 90.0)), 1) if 14 in fixed_channels
          else round(rand.uniform(25.0, 40.0), 1))"
      load_status:
        expr: "'ANOMALY' if calls_per_turn_p95 > 8.0 or premium_share_pct > 60.0 else 'NOMINAL'"
      summary_status:
        expr: "'ANOMALY' if avail_status == 'ANOMALY' or canary_status == 'ANOMALY' or quota_status == 'ANOMALY' or load_status == 'ANOMALY' else 'NOMINAL'"
      deployment:
        expr: "'foundry-chat-canary-r3' if 10 in all_active and rand.uniform(0.0, 100.0) < canary_share_pct
          else rand.choice(['gpt-4o-chat-prod', 'gpt-4o-chat-prod', 'gpt-4o-mini-chat-prod', 'foundry-reasoning-prod', 'chat-gpt4o-eastus', 'chat-gpt4o-stable', 'gpt-4o-chat-weu-secondary'])"
      backend:
        expr: "'microsoft_foundry' if deployment.startswith(('gpt-4o-chat', 'foundry')) else 'azure_openai'"
      route_reason:
        choice: [intent_simple_faq, intent_complex_reasoning, tenant_pinned_deployment, quota_headroom_balance]
      prompt_tokens:
        randint: [600, 4200]
      completion_tokens:
        expr: "1 if deployment == 'foundry-chat-canary-r3' and rand.uniform(0.0, 100.0) < 70.0 else rand.randint(120, 900)"
      finish_reason:
        expr: "'stop'"
  - counter:
      state_key: _route_count
      by: 1
  - log:
      level: INFO
      message: '[MODEL_ROUTER] route_selected deployment={deployment} backend={backend} reason={route_reason} prompt_tokens={prompt_tokens} completion_tokens={completion_tokens} finish_reason={finish_reason} latency={route_latency_ms}ms'
      attrs:
        operation: route_selected
        router.deployment:
          var: deployment
        router.backend:
          var: backend
        router.reason:
          var: route_reason
        router.prompt_tokens:
          var: prompt_tokens
        router.completion_tokens:
          var: completion_tokens
        router.finish_reason:
          var: finish_reason
        router.latency_ms:
          var: route_latency_ms
  - log:
      level: INFO
      message: '[MODEL_ROUTER] deployment_health deployment=gpt-4o-chat-prod model_version={foundry_model_version} availability={avail_val}% secondary=gpt-4o-chat-weu-secondary status={avail_status}'
      attrs:
        operation: deployment_health
        router.deployment: gpt-4o-chat-prod
        router.availability_pct:
          var: avail_val
        deployment.foundry_model_version:
          var: foundry_model_version
        router.status:
          var: avail_status
  - log:
      level: INFO
      message: '[MODEL_ROUTER] canary_health canary=foundry-chat-canary-r3 weight={canary_weight} canary_share={canary_share_pct}% empty_completions={empty_completion_pct}% stable=chat-gpt4o-stable status={canary_status}'
      attrs:
        operation: canary_health
        router.canary_deployment: foundry-chat-canary-r3
        router.canary_share_pct:
          var: canary_share_pct
        router.empty_completion_pct:
          var: empty_completion_pct
        router.canary_weight:
          var: canary_weight
        router.status:
          var: canary_status
  - log:
      level: INFO
      message: '[MODEL_ROUTER] quota_health deployment=chat-gpt4o-eastus tpm_used={tpm_used_pct}% tpm_capacity={tpm_capacity} throttled_429={throttled_429} status={quota_status}'
      attrs:
        operation: quota_health
        router.deployment: chat-gpt4o-eastus
        router.tpm_used_pct:
          var: tpm_used_pct
        router.throttled_429:
          var: throttled_429
        router.tpm_capacity:
          var: tpm_capacity
        router.status:
          var: quota_status
  - log:
      level: INFO
      message: '[MODEL_ROUTER] router_load calls_per_turn_p95={calls_per_turn_p95} caller=chat-orchestrator premium_deployment=gpt-4o-premium-eus2 premium_share={premium_share_pct}% status={load_status}'
      attrs:
        operation: router_load
        router.calls_per_turn_p95:
          var: calls_per_turn_p95
        router.premium_traffic_share_pct:
          var: premium_share_pct
        router.status:
          var: load_status
  - every:
      seconds: 10
      state_key: _last_summary
      steps:
        - log:
            level: INFO
            message: '[MODEL_ROUTER] router_summary routed_total={_route_count} stable_deployment=chat-gpt4o-stable canary_deployment=foundry-chat-canary-r3 canary_weight={canary_weight} failover_region=swedencentral status={summary_status}'
            attrs:
              operation: router_summary
              router.routed_total:
                var: _route_count
              router.canary_weight:
                var: canary_weight
              router.status:
                var: summary_status
  - metric:
      name: model_router.route_latency_ms
      value:
        var: route_latency_ms
      unit: ms
  - metric:
      name: model_router.prompt_tokens
      value:
        var: prompt_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.completion_tokens
      value:
        var: completion_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.total_tokens
      value:
        expr: prompt_tokens + completion_tokens
      unit: '{tokens}'
  - metric:
      name: model_router.deployment_availability_pct
      value:
        var: avail_val
      unit: '%'
  - metric:
      name: model_router.tpm_quota_used_pct
      value:
        var: tpm_used_pct
      unit: '%'
  - metric:
      name: model_router.throttled_429_count
      value:
        var: throttled_429
      unit: '{responses}'
  - metric:
      name: model_router.canary_traffic_share_pct
      value:
        var: canary_share_pct
      unit: '%'
  - metric:
      name: model_router.empty_completion_pct
      value:
        var: empty_completion_pct
      unit: '%'
  - metric:
      name: model_router.calls_per_turn_p95
      value:
        var: calls_per_turn_p95
      unit: '{calls}'
  - metric:
      name: model_router.premium_traffic_share_pct
      value:
        var: premium_share_pct
      unit: '%'

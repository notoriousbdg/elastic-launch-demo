agent_config:
  id: azureai-analyst
  name: Azure GenAI Assistant Operations Analyst
  assessment_tool_name: azureai_readiness_assessment
  system_prompt: "You are an expert SRE assistant for the Azure GenAI Assistant.\n\nWhen an incident is reported, your job\
    \ is to:\n1. Diagnose the root cause from the error_type, stack traces, and RCA clues\n2. Recommend a specific remediation\
    \ action\n3. Explain business impact in terms the executive team understands\n\nKnown fault channels and their error types:\n\
    \  - AI-FOUNDRY-AVAILABILITY-DROP: Foundry Model Availability Drop\n  - AI-TOKEN-SPEND-RUNAWAY: Runaway Token Spend\n\
    \  - IAM-PRIV-ESC-KEYVAULT-READ: Privilege Escalation Key Vault Read\n  - AGW-WAF-BLOCK-SURGE: App Gateway Waf Block Surge\n\
    \  - RAG-INDEX-STALE: Rag Index Staleness\n  - EMB-DIMENSION-MISMATCH: Embedding Dimension Mismatch\n  - COSMOS-RU-THROTTLED:\
    \ Cosmos Ru Throttling\n  - PROMPT-FILTER-FALSE-POSITIVE: Content Filter False Positives\n  - PROMPT-INJECTION-SPIKE:\
    \ Prompt Injection Spike\n  - ROUTER-BAD-CANARY: Model Router Bad Canary\n  - RAG-LATENCY-REGRESSION: Retrieval Latency\
    \ Regression\n  - COSMOS-HISTORY-INCONSISTENT: Conversation History Inconsistent\n  - EMB-BATCH-BACKLOG: Embedding Batch\
    \ Backlog\n  - COST-BUDGET-MISCONFIG: Cost Budget Misconfiguration\n  - AGENT-TOOL-LOOP: Orchestrator Tool Loop\n  - OPENAI-QUOTA-EXHAUSTED:\
    \ Openai Quota Exhaustion\n  - IDENTITY-TOKEN-EXPIRED: Entra Token Expiry\n  - AGW-BACKEND-UNHEALTHY: App Gateway Backend\
    \ Unhealthy\n  - COSMOS-AUTOSCALE-CEILING: Cosmos Autoscale Ceiling\n  - RAG-CACHE-STALE: Retrieval Cache Stale\n\nFor\
    \ each fault, examine the affected_services first, then look for cascade_services that may be experiencing downstream\
    \ effects."
assessment_tool_config:
  id: azureai_readiness_assessment
  description: 'Comprehensive Azure GenAI assistant readiness assessment. Evaluates the Application Gateway front door, Azure
    OpenAI and Microsoft Foundry model capacity and availability, AI Search grounding freshness, Cosmos DB throughput headroom,
    token spend against budget and Activity Log security signals. Returns evidence for each dimension so risks and causal
    chains can be surfaced. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: chat-orchestrator
executive_dashboard_intro: '**Azure GenAI Assistant KPIs** — conversations and resolution, model capacity and quota, cost
  and tokens, and platform reliability. Synthetic `business.*` OTLP gauges from `chat-orchestrator`.'
executive_kpi_sections:
  - header: '**Conversations and resolution** — volume, resolution, escalation, satisfaction'
    specs:
      - - Conversations / min
        - metrics.business.conversations_per_min
      - - Resolution rate (%)
        - metrics.business.resolution_rate_pct
      - - Escalations to a human / min
        - metrics.business.human_escalations_per_min
      - - CSAT (1-5)
        - metrics.business.csat_score
      - - Avg turns per conversation
        - metrics.business.avg_turns_per_conversation
      - - Answer groundedness (%)
        - metrics.business.groundedness_pct
  - header: '**Model capacity and quota** — quota headroom, availability, throttling'
    specs:
      - - OpenAI quota headroom (%)
        - metrics.business.openai_quota_headroom_pct
      - - Model availability (%)
        - metrics.business.model_availability_pct
      - - Throttled requests / min
        - metrics.business.throttled_requests_per_min
      - - Time to first token p95 (ms)
        - metrics.business.ttft_p95_ms
      - - Provisioned utilization (%)
        - metrics.business.provisioned_utilization_pct
      - - Fallback-model share (%)
        - metrics.business.fallback_model_share_pct
  - header: '**Cost and tokens** — cost per conversation, spend, budget'
    specs:
      - - Cost per conversation (USD)
        - metrics.business.cost_per_conversation_usd
      - - Token spend (USD/hr)
        - metrics.business.token_spend_usd_per_hr
      - - Tokens per conversation
        - metrics.business.tokens_per_conversation
      - - Budget consumed MTD (%)
        - metrics.business.budget_consumed_mtd_pct
      - - Prompt cache hit rate (%)
        - metrics.business.prompt_cache_hit_pct
      - - Blocked prompts / min
        - metrics.business.blocked_prompts_per_min
  - header: '**Platform reliability** — throughput, errors, latency, availability'
    specs:
      - - Throughput (req/min)
        - metrics.business.throughput_rpm
      - - Error rate (%)
        - metrics.business.error_rate_pct
      - - P99 latency (ms)
        - metrics.business.latency_p99_ms
      - - Availability (%)
        - metrics.business.availability_pct
      - - Retrieval p95 latency (ms)
        - metrics.business.retrieval_latency_p95_ms
      - - Active sessions
        - metrics.business.active_sessions
executive_trend_charts:
  - title: Conversations / min
    field: metrics.business.conversations_per_min
    y_label: conv/min
  - title: Resolution rate (%)
    field: metrics.business.resolution_rate_pct
    y_label: '%'
  - title: Cost per conversation (USD)
    field: metrics.business.cost_per_conversation_usd
    y_label: USD
  - title: OpenAI quota headroom (%)
    field: metrics.business.openai_quota_headroom_pct
    y_label: '%'
  - title: P99 latency (ms)
    field: metrics.business.latency_p99_ms
    y_label: ms
  - title: Availability (%)
    field: metrics.business.availability_pct
    y_label: '%'
executive_kpi_emissions:
  - name: business.conversations_per_min
    better: higher
    value:
      uniform:
        - 200.0
        - 3000.0
      round: 0
    unit: conv/min
  - name: business.resolution_rate_pct
    better: higher
    value:
      uniform:
        - 70.0
        - 95.0
      round: 1
    unit: '%'
  - name: business.human_escalations_per_min

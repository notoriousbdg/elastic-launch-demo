scenario_id: azure
scenario_name: Azure GenAI Assistant
scenario_description: GenAI customer assistant running entirely on Azure across eastus, eastus2 and westeurope. Application
  Gateway fronts assistant-web, chat-orchestrator calls Azure OpenAI and Microsoft Foundry deployments through model-router,
  AI Search and embeddings ground the answers, Cosmos DB stores history and cost-guard enforces token budgets. 20 fault channels
  spanning quota, availability, cost and identity.

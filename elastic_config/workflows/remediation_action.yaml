version: "1"
name: __SCENARIO_NAME__ Remediation Action
description: >
  Execute remediation actions for __SCENARIO_NAME__ anomalies. Queues a
  remediation command to an ES index for the backend poller to process.

tags:
  - "__NS__"

triggers:
  - type: manual

inputs:
  - name: error_type
    type: string
    required: true
    description: "Error type to remediate"
  - name: channel
    type: number
    required: true
    description: "Fault channel being remediated (1-20)"
  - name: action_type
    type: string
    required: true
    description: "Remediation action to execute (scenario-specific, e.g. restart_mobile_gateway, reset_vpc_peering)"
  - name: target_service
    type: string
    default: ""
    description: "Service to target for restart/failover actions"
  - name: justification
    type: string
    required: true
    description: "Reason for executing this remediation"
  - name: dry_run
    type: boolean
    default: true
  - name: case_id
    type: string
    default: ""
    description: "Direct case ID to close (skips tag search when provided — always pass this when remediating from a case context)"
  - name: approval_mode
    type: string
    default: "required"
    description: "required = pause at waitForInput for operator approval; skip = queue immediately (auto-remediate alerts only)"
  - name: requires_approval
    type: boolean
    default: true
    description: "Deprecated — use approval_mode. If true and approval_mode omitted, approval is required."

steps:
  # Approval gate — runs unless approval_mode is explicitly skip. Uses string
  # KQL (inputs.approval_mode : skip) because boolean requires_approval does
  # not match reliably in workflow if conditions.
  - name: approval_flow
    type: if
    condition: "NOT inputs.approval_mode : skip"
    steps:
      - name: await_operator_approval
        type: waitForInput
        with:
          message: |
            Approve remediation for **{{ inputs.error_type }}** on channel {{ inputs.channel }}?

            - **Action:** {{ inputs.action_type }}
            - **Target service:** {{ inputs.target_service }}
            - **Case:** {{ inputs.case_id }}
            - **Justification:** {{ inputs.justification }}
          schema:
            type: object
            properties:
              approved:
                type: boolean
                title: "Approve remediation"
              notes:
                type: string
                title: "Notes (optional)"
            required: ["approved"]

      - name: handle_denial
        type: if
        condition: "steps.await_operator_approval.output.approved : false"
        steps:
          - name: comment_denial
            type: if
            condition: 'inputs.case_id : * AND NOT inputs.case_id : ""'
            steps:
              - name: post_denial_comment
                type: kibana.request
                with:
                  method: POST
                  path: "/api/cases/{{ inputs.case_id }}/comments"
                  headers:
                    kbn-xsrf: "true"
                  body:
                    type: "user"
                    comment: |
                      ## Remediation Denied by Operator

                      - **Proposed action:** {{ inputs.action_type }}
                      - **Target service:** {{ inputs.target_service }}
                      - **Error type:** {{ inputs.error_type }}
                      - **Channel:** {{ inputs.channel }}
                      - **Operator notes:** {{ steps.await_operator_approval.output.notes }}

                      The case remains open for manual follow-up.
                    owner: "observability"

          - name: audit_denial
            type: elasticsearch.index
            with:
              index: "__NS__-remediation-audit"
              document:
                channel: "{{ inputs.channel }}"
                action_type: "{{ inputs.action_type }}"
                target_service: "{{ inputs.target_service }}"
                error_type: "{{ inputs.error_type }}"
                status: "denied"
                approval_requested: true
                case_closed: false
                mission_id: "__SCENARIO_NAME__"
              refresh: wait_for

  # Auto path: approval_mode skip. HITL path: operator approved true.
  - name: execute_remediation
    type: if
    condition: "inputs.approval_mode : skip OR steps.await_operator_approval.output.approved : true"
    steps:
      - name: queue_remediation
        type: elasticsearch.index
        with:
          index: "__NS__-remediation-queue"
          document:
            channel: "{{ inputs.channel }}"
            action_type: "{{ inputs.action_type }}"
            target_service: "{{ inputs.target_service }}"
            justification: "{{ inputs.justification }}"
            dry_run: "{{ inputs.dry_run }}"
            error_type: "{{ inputs.error_type }}"
            namespace: "__NS__"
            status: "pending"
            mission_id: "__SCENARIO_NAME__"
          refresh: wait_for

      - name: log_queued
        type: console
        with:
          message: "Remediation QUEUED for channel {{ inputs.channel }}. Backend will process shortly."

      # Path A: case_id provided and non-empty — use it directly, no search needed.
      # "inputs.case_id : *" alone also matches an empty string (the input's
      # default), which is what let a blank case_id crash this step with
      # "Failed to get case id: : Error: Not Found" instead of falling through
      # to the tag-search fallback below.
      - name: close_case
        type: if
        condition: 'inputs.case_id : * AND NOT inputs.case_id : ""'
        steps:
          - name: add_comment_to_provided_case
            type: cases.addComment
            on-failure:
              continue: true
            with:
              case_id: "{{ inputs.case_id }}"
              comment: |
                ## Remediation Performed

                - **Action:** {{ inputs.action_type }}
                - **Target Service:** {{ inputs.target_service }}
                - **Error Type:** {{ inputs.error_type }}
                - **Channel:** {{ inputs.channel }}
                - **Dry Run:** {{ inputs.dry_run }}
                - **Justification:** {{ inputs.justification }}

          - name: update_provided_case_closed
            type: cases.closeCase
            on-failure:
              continue: true
            with:
              case_id: "{{ inputs.case_id }}"

          - name: log_case_closed
            type: console
            with:
              message: "Case {{ inputs.case_id }} closed for {{ inputs.error_type }} (channel {{ inputs.channel }})."

        # Path B: no case_id (missing or empty) — fall back to tag-based search.
        else:
          # NOTE: cases.findCases matches ANY tag in this array (OR), not all of
          # them — passing both the namespace tag and error_type here previously
          # matched any open case in the namespace, not just ones about this
          # error_type. Every case already carries the namespace tag, so it adds
          # no filtering power; search on error_type alone for a precise match.
          - name: search_open_case
            type: cases.findCases
            with:
              tags:
                - "{{ inputs.error_type }}"
              status: "open"
              owner: "observability"
              sortField: "createdAt"
              sortOrder: "desc"
              perPage: 1

          - name: close_found_case
            type: if
            condition: "steps.search_open_case.output.cases.0.id : *"
            steps:
              - name: add_remediation_comment
                type: cases.addComment
                on-failure:
                  continue: true
                with:
                  case_id: "{{ steps.search_open_case.output.cases[0].id }}"
                  comment: |
                    ## Remediation Performed

                    - **Action:** {{ inputs.action_type }}
                    - **Target Service:** {{ inputs.target_service }}
                    - **Error Type:** {{ inputs.error_type }}
                    - **Channel:** {{ inputs.channel }}
                    - **Dry Run:** {{ inputs.dry_run }}
                    - **Justification:** {{ inputs.justification }}

              - name: update_case_closed
                type: cases.closeCase
                on-failure:
                  continue: true
                with:
                  case_id: "{{ steps.search_open_case.output.cases[0].id }}"

              - name: log_case_closed_via_search
                type: console
                with:
                  message: "Case {{ steps.search_open_case.output.cases[0].id }} closed for {{ inputs.error_type }} (channel {{ inputs.channel }})."

            # No case_id was given and no open case matches these tags — remediation
            # was still queued above; there's simply nothing to close. Log instead
            # of failing the run.
            else:
              - name: log_no_case_found
                type: console
                with:
                  message: "No open case found to close for {{ inputs.error_type }} (channel {{ inputs.channel }}). Remediation was queued regardless."

      - name: audit_log
        type: elasticsearch.index
        with:
          index: "__NS__-remediation-audit"
          document:
            channel: "{{ inputs.channel }}"
            action_type: "{{ inputs.action_type }}"
            target_service: "{{ inputs.target_service }}"
            justification: "{{ inputs.justification }}"
            dry_run: "{{ inputs.dry_run }}"
            status: "resolved"
            approval_mode: "{{ inputs.approval_mode }}"
            mission_id: "__SCENARIO_NAME__"
          refresh: wait_for

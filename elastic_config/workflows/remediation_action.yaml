version: "1"
name: __SCENARIO_NAME__ Remediation Action
description: >
  Execute remediation actions for __SCENARIO_NAME__ anomalies. Queues a
  remediation command to an ES index for the backend poller to process.

tags:
  - "__NS__"

# Kibana 9.5+: inputs MUST live under the manual trigger (not root-level).
# Root-level inputs leave Agent Builder workflow tools with an empty schema
# (elastic/kibana#269992), so every tool call arrives with inputs: {}.
triggers:
  - type: manual
    inputs:
      - name: error_type
        type: string
        required: true
        description: "Error type to remediate"
      - name: channel
        type: number
        required: true
        description: "Fault channel being remediated (1-20)"
      - name: action_type
        type: string
        required: true
        description: "Remediation action to execute (scenario-specific, e.g. restart_mobile_gateway, reset_vpc_peering)"
      - name: target_service
        type: string
        default: ""
        description: "Service to target for restart/failover actions"
      - name: justification
        type: string
        required: true
        description: "Reason for executing this remediation"
      - name: dry_run
        type: boolean
        default: true
        description: "If true, poller records the command without resolving the fault. Pass false to remediate."
      - name: case_id
        type: string
        default: ""
        description: "Direct case ID to close (skips tag search when provided — always pass this when remediating from a case context)"
      - name: approval_mode
        type: string
        default: "required"
        description: "required (default) = HITL waitForInput; skip = queue immediately (auto-remediate alerts only). Direct/agent calls default to HITL."
      - name: requires_approval
        type: boolean
        default: true
        description: "Deprecated — use approval_mode. If true and approval_mode omitted, approval is required."

steps:
  # HITL path — runs unless approval_mode is explicitly skip.
  # String KQL on approval_mode (booleans do not match reliably from Agent Builder).
  - name: approval_flow
    type: if
    condition: "NOT inputs.approval_mode : skip"
    steps:
      - name: await_operator_approval
        type: waitForInput
        with:
          message: |
            Approve remediation for **{{ inputs.error_type }}** on channel {{ inputs.channel }}?

            - **Action:** {{ inputs.action_type }}
            - **Target service:** {{ inputs.target_service }}
            - **Case:** {{ inputs.case_id }}
            - **Justification:** {{ inputs.justification }}
          schema:
            type: object
            properties:
              approved:
                type: boolean
                title: "Approve remediation"
              notes:
                type: string
                title: "Notes (optional)"
            required: ["approved"]

      # On 9.5, waitForInput stores the resume payload under output.response
      # (e.g. {response: {approved, notes}, respondedBy}), not flat on output.
      # Deny on explicit false; else (approve) queues remediation.
      - name: handle_decision
        type: if
        condition: "steps.await_operator_approval.output.response.approved : false"
        steps:
          - name: comment_denial
            type: if
            condition: 'inputs.case_id : * AND NOT inputs.case_id : ""'
            steps:
              - name: post_denial_comment
                type: kibana.request
                with:
                  method: POST
                  path: "/api/cases/{{ inputs.case_id }}/comments"
                  headers:
                    kbn-xsrf: "true"
                  body:
                    type: "user"
                    comment: |
                      ## Remediation Denied by Operator

                      - **Proposed action:** {{ inputs.action_type }}
                      - **Target service:** {{ inputs.target_service }}
                      - **Error type:** {{ inputs.error_type }}
                      - **Channel:** {{ inputs.channel }}
                      - **Operator notes:** {{ steps.await_operator_approval.output.response.notes }}

                      The case remains open for manual follow-up.
                    owner: "observability"

          - name: audit_denial
            type: elasticsearch.index
            with:
              index: "__NS__-remediation-audit"
              document:
                channel: "{{ inputs.channel }}"
                action_type: "{{ inputs.action_type }}"
                target_service: "{{ inputs.target_service }}"
                error_type: "{{ inputs.error_type }}"
                status: "denied"
                approval_requested: true
                case_closed: false
                mission_id: "__SCENARIO_NAME__"
              refresh: wait_for

        else:
          - name: queue_remediation_hitl
            type: elasticsearch.index
            with:
              index: "__NS__-remediation-queue"
              document:
                channel: "{{ inputs.channel }}"
                action_type: "{{ inputs.action_type }}"
                target_service: "{{ inputs.target_service }}"
                justification: "{{ inputs.justification }}"
                dry_run: "{{ inputs.dry_run }}"
                error_type: "{{ inputs.error_type }}"
                namespace: "__NS__"
                status: "pending"
                mission_id: "__SCENARIO_NAME__"
              refresh: wait_for

          - name: log_queued_hitl
            type: console
            with:
              message: "Remediation QUEUED for channel {{ inputs.channel }} (HITL approved). Backend will process shortly."

          - name: comment_case_hitl
            type: if
            condition: 'inputs.case_id : * AND NOT inputs.case_id : ""'
            steps:
              - name: add_comment_hitl
                type: cases.addComment
                on-failure:
                  continue: true
                with:
                  case_id: "{{ inputs.case_id }}"
                  comment: |
                    ## Remediation Initiated

                    - **Action:** {{ inputs.action_type }}
                    - **Target Service:** {{ inputs.target_service }}
                    - **Error Type:** {{ inputs.error_type }}
                    - **Channel:** {{ inputs.channel }}
                    - **Dry Run:** {{ inputs.dry_run }}
                    - **Justification:** {{ inputs.justification }}

                    The case will close automatically once the alert clears.

          - name: audit_log_hitl
            type: elasticsearch.index
            with:
              index: "__NS__-remediation-audit"
              document:
                channel: "{{ inputs.channel }}"
                action_type: "{{ inputs.action_type }}"
                target_service: "{{ inputs.target_service }}"
                justification: "{{ inputs.justification }}"
                dry_run: "{{ inputs.dry_run }}"
                status: "remediation_queued"
                approval_mode: "{{ inputs.approval_mode }}"
                mission_id: "__SCENARIO_NAME__"
              refresh: wait_for

  # Auto path — approval_mode skip (string). Used when Agent Builder passes
  # inputs correctly, or when invoked via workflow run API.
  - name: execute_auto
    type: if
    condition: "inputs.approval_mode : skip"
    steps:
      - name: queue_remediation_auto
        type: elasticsearch.index
        with:
          index: "__NS__-remediation-queue"
          document:
            channel: "{{ inputs.channel }}"
            action_type: "{{ inputs.action_type }}"
            target_service: "{{ inputs.target_service }}"
            justification: "{{ inputs.justification }}"
            dry_run: "{{ inputs.dry_run }}"
            error_type: "{{ inputs.error_type }}"
            namespace: "__NS__"
            status: "pending"
            mission_id: "__SCENARIO_NAME__"
          refresh: wait_for

      - name: log_queued_auto
        type: console
        with:
          message: "Remediation QUEUED for channel {{ inputs.channel }} (auto). Backend will process shortly."

      - name: comment_case_auto
        type: if
        condition: 'inputs.case_id : * AND NOT inputs.case_id : ""'
        steps:
          - name: add_comment_auto
            type: cases.addComment
            on-failure:
              continue: true
            with:
              case_id: "{{ inputs.case_id }}"
              comment: |
                ## Remediation Initiated

                - **Action:** {{ inputs.action_type }}
                - **Target Service:** {{ inputs.target_service }}
                - **Error Type:** {{ inputs.error_type }}
                - **Channel:** {{ inputs.channel }}
                - **Dry Run:** {{ inputs.dry_run }}
                - **Justification:** {{ inputs.justification }}

                The case will close automatically once the alert clears.

          - name: log_case_updated_auto
            type: console
            with:
              message: "Remediation recorded on case {{ inputs.case_id }} for {{ inputs.error_type }} (channel {{ inputs.channel }}); case stays open until alert clears."

        else:
          - name: search_open_case
            type: cases.findCases
            with:
              tags:
                - "{{ inputs.error_type }}"
              status: "open"
              owner: "observability"
              sortField: "createdAt"
              sortOrder: "desc"
              perPage: 1

          - name: comment_found_case
            type: if
            condition: "steps.search_open_case.output.cases.0.id : *"
            steps:
              - name: add_remediation_comment
                type: cases.addComment
                on-failure:
                  continue: true
                with:
                  case_id: "{{ steps.search_open_case.output.cases[0].id }}"
                  comment: |
                    ## Remediation Initiated

                    - **Action:** {{ inputs.action_type }}
                    - **Target Service:** {{ inputs.target_service }}
                    - **Error Type:** {{ inputs.error_type }}
                    - **Channel:** {{ inputs.channel }}
                    - **Dry Run:** {{ inputs.dry_run }}
                    - **Justification:** {{ inputs.justification }}

                    The case will close automatically once the alert clears.

            else:
              - name: log_no_case_found
                type: console
                with:
                  message: "No open case found for {{ inputs.error_type }} (channel {{ inputs.channel }}). Remediation was queued regardless."

      - name: audit_log_auto
        type: elasticsearch.index
        with:
          index: "__NS__-remediation-audit"
          document:
            channel: "{{ inputs.channel }}"
            action_type: "{{ inputs.action_type }}"
            target_service: "{{ inputs.target_service }}"
            justification: "{{ inputs.justification }}"
            dry_run: "{{ inputs.dry_run }}"
            status: "remediation_queued"
            approval_mode: "{{ inputs.approval_mode }}"
            mission_id: "__SCENARIO_NAME__"
          refresh: wait_for
